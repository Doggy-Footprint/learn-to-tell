<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세련된 화면은 '차이'를 아껴 쓴다</title>
<script type="application/json" id="ltt-meta">{"domain":"UIUX","topic":"시각적 위계와 근접성·간격 스케일","audience":"UI를 가끔 직접 만드는 개발자. 간격을 '그냥 맞춰' 쓰지만 이유를 말로 설명하지는 못한다","pattern":["hook","terms","explain:strip","figure","explain","contrast","sweep","compare","statement","explain:stack","summary","keywords"],"theme":"studio","medium":"실제 제품 화면(상품 카드·회원가입 폼 목업)에 디자인 리뷰처럼 간격 측정선을 그린다","mode":"체험형: 같은 상품 카드를 간격 측정선과 함께 단계별로 다듬고, 같은 폼의 BEFORE/AFTER를 번호 주석으로 읽은 뒤, 묶음 사이 간격을 직접 밀어 본다","decision":"무엇을 먼저 읽히게 할지와 그 수단(크기·굵기·회색 진하기), 묶음 안/사이 간격을 스케일의 어느 단계로 고를지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .pc { display: flex; flex-direction: column; font-size: 15px; color: #222; }
  .pc .img { height: 92px; border-radius: 10px; background: #eceae4; margin-bottom: 12px; }
  .pc > * { position: relative; transition: all .35s ease; }
  .pc .btn { margin-top: 10px; text-align: center; border-radius: 10px; padding: 9px; font-weight: 700; }
  .fm { display: flex; flex-direction: column; font-size: 14px; color: #222; }
  .fm .in { height: 30px; border: 1px solid #d6d2c8; border-radius: 8px; background: #fff; }
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .live > * { min-width: 0; }
  @media (max-width: 720px) { .live { grid-template-columns: 1fr; } }
  .gapnote { font: 13px var(--ltt-mono); color: var(--ltt-muted); margin-top: 8px; }
  .kpi { border-radius: 12px; padding: 14px; background: #fff; box-shadow: inset 0 0 0 1px #e6e3dc; color: #222; }
  .lv { display: grid; gap: 8px; }
  .lv div { display: flex; align-items: baseline; gap: 10px; }
  .lv code { font: 11px var(--ltt-mono); color: var(--ltt-muted); width: 92px; flex: none; }
  .scale { display: flex; align-items: flex-end; gap: 6px; }
  .scale span { display: flex; flex-direction: column; align-items: center; font: 11px var(--ltt-mono); color: var(--ltt-muted); gap: 4px; }
  .scale i { display: block; width: 16px; background: var(--ltt-accent-soft); box-shadow: inset 0 0 0 1px var(--ltt-accent); border-radius: 3px; }
  .map { font: 13px var(--ltt-mono); line-height: 1.8; }
  .map b { color: var(--ltt-accent); }
</style>
</head>
<body>
<script>
  // 손계산: 스케일 [4,8,16,24,32,48]에서 가장 가까운 값. 14→16(차 2 vs 6), 13→16(차 3 vs 5), 10→8(차 2 vs 6), 22→24(차 2 vs 6).
  const EXPECTED_BY_HAND = { s14: 16, s13: 16, s10: 8, s22: 24 };
  const SCALE = [4, 8, 16, 24, 32, 48];
  const snap = (v) => SCALE.reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
  LTT.expect("snap(14)", snap(14), EXPECTED_BY_HAND.s14, { tol: 0 });
  LTT.expect("snap(13)", snap(13), EXPECTED_BY_HAND.s13, { tol: 0 });
  LTT.expect("snap(10)", snap(10), EXPECTED_BY_HAND.s10, { tol: 0 });
  LTT.expect("snap(22)", snap(22), EXPECTED_BY_HAND.s22, { tol: 0 });

  // Product card at hierarchy step k (0 = everything equal). Only inline styles change between steps.
  const cardStyle = (k) => {
    const base = "font-size:15px;font-weight:600;color:#222;margin-top:10px";
    const low = "font-size:13px;font-weight:400;color:#6b6b6b";
    return {
      name: k >= 1 ? "font-size:17px;font-weight:700;color:#111;margin-top:0" : base.replace("margin-top:10px", "margin-top:0"),
      price: k >= 1 ? `font-size:24px;font-weight:800;color:#111;margin-top:${k >= 3 ? 4 : 10}px` : base,
      desc: k >= 2 ? `${low};margin-top:${k >= 3 ? 16 : 10}px` : base,
      rate: k >= 2 ? `${low};margin-top:${k >= 3 ? 4 : 10}px` : base,
      ship: k >= 2 ? `${low};margin-top:${k >= 3 ? 4 : 10}px` : base,
      btn: k >= 4 ? `background:#2f5bff;color:#fff;margin-top:${k >= 3 ? 24 : 10}px` : `background:#fff;color:#222;box-shadow:inset 0 0 0 1px #222;margin-top:${k >= 3 ? 24 : 10}px`,
    };
  };
  const cardMock = () => {
    const b = LTT.mock.browser({ url: "shop.example.com", width: 300 });
    b.screen.innerHTML = `<div class="pc"><div class="img"></div>
      <div data-k="name">무선 키보드 K3</div><div data-k="price">₩89,000</div>
      <div data-k="desc">저소음 스위치 · 블루투스 5.1</div><div data-k="rate">★ 4.7 (리뷰 1,284)</div>
      <div data-k="ship">내일 도착 · 무료배송</div><div class="btn" data-k="btn">장바구니 담기</div></div>`;
    const rl = LTT.redline(b.screen.querySelector(".pc"), { selector: "[data-k]" });
    const paint = (k) => {
      const s = cardStyle(k);
      b.screen.querySelectorAll("[data-k]").forEach((n) => { n.style.cssText = s[n.dataset.k]; });
      rl.update();
    };
    return { el: b.el, paint };
  };

  // Signup form; o.lab = label→input, o.first = heading→first label, o.gaps = between fields, o.sec = before the 2nd section.
  const formMock = (o) => () => {
    const b = LTT.mock.browser({ url: "signup", width: 250 });
    const field = (l, top) => `<div style="margin-top:${top}px;font-size:${o.labSize}px;font-weight:600;color:${o.labColor}">${l}</div><div class="in" style="margin-top:${o.lab}px"></div>`;
    b.screen.innerHTML = `<div class="fm">
      <div style="font-size:${o.hSize}px;font-weight:${o.hWeight};color:#111">회원 정보</div>
      ${field("이름", o.first)}${field("이메일", o.gaps[0])}${field("전화번호", o.gaps[1])}
      <div style="margin-top:${o.sec}px;font-size:${o.hSize}px;font-weight:${o.hWeight};color:#111">배송지</div>
      ${field("주소", o.first)}</div>`;
    return b.el;
  };

  LTT.deck({
    title: "세련된 화면은 '차이'를 아껴 쓴다",
    theme: "studio",
    glossary: {
      "대비비": "글자색과 배경색의 밝기가 몇 배 차이 나는지 나타낸 숫자. 흰 배경의 일반 글자는 4.5:1 이상이어야 웹 접근성 국제 지침(WCAG)의 기본 등급 AA를 넘는다.",
    },
    scenes: [
      { type: "hook", art: "bulb", kicker: "세련된 UI 만들기, 1회차",
        pre: "같은 내용, 같은 색인데 왜 한쪽만 '각이 잡혀' 보일까?",
        text: "세련됨은 장식을 더해서가 아니라<br><u>차이를 아껴서</u> 나온다.",
        sub: "어지러운 화면은 대부분 두 가지 결정을 안 한 화면이다. 무엇을 먼저 읽힐지, 무엇끼리 묶을지. 이 수업을 마치면 그 두 결정을 말로 설명하고, 간격 값을 감이 아니라 이유로 고를 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "시각적 위계", en: "visual hierarchy", icon: "layers", plain: "눈이 화면에서 무엇을 먼저, 무엇을 나중에 읽을지의 순서. 크기·굵기·색 진하기의 차이로 만든다.", example: "상품 카드에서 가격이 가장 먼저, 배송 정보가 마지막에 읽힌다." },
          { key: "근접성", en: "proximity · 게슈탈트(사람이 형태를 묶어 보는 방식) 원리", icon: "link", plain: "가까이 붙은 것들을 사람이 자동으로 한 묶음으로 보는 성질. 선이나 박스 없이 간격만으로 그룹을 만든다.", example: "라벨과 입력칸은 붙이고, 다음 항목과는 띄운다. 이미 감으로 하고 있던 그것이다." },
          { key: "간격 스케일", en: "spacing scale", icon: "ruler", plain: "여백 값을 미리 정한 몇 단계(예: 4·8·16·24·32·48)에서만 고르는 규칙.", example: "13px, 15px 대신 16px 하나만 쓴다." },
        ] },

      { type: "explain", form: "strip", kicker: "원인 → 과정 → 결과", title: "'어지럽다'는 눈이 길을 못 찾는다는 뜻이다", en: "Why it feels messy",
        steps: [
          { icon: "doc", title: "모두 같은 무게", text: "글자 크기·굵기·색이 다 비슷하면 눈이 출발할 곳이 없다. 즉 {{시각적 위계}}가 없다.",
            visual: `<div style="font-weight:600;line-height:1.7">무선 키보드 K3<br>₩89,000<br>내일 도착</div>` },
          { icon: "alert", title: "간격이 제각각", text: "13, 15, 18px처럼 의미 없는 차이가 섞이면, 눈은 어느 차이가 '묶음 경계'인지 판단하지 못한다. {{근접성}}이 신호 대신 잡음이 된다." },
          { icon: "eye", title: "결과", text: "사용자는 화면 전체를 훑어야 한다. 이게 '어지럽다', '촌스럽다'로 느껴진다. 반대로 차이가 적고 각 차이에 뜻이 있으면 '각이 잡혀' 보인다." },
        ],
        takeaway: "어지러움은 '뜻 없는 차이'와 '차이 없는 중요도'에서 온다." },

      { type: "figure", kicker: "디자인 리뷰 · 단계별로 보기", title: "강조는 키우기보다 나머지를 낮춰서 만든다", en: "Building hierarchy",
        caption: "같은 상품 카드를 네 번 손본다. 오른쪽 파란 측정선은 각 줄 위의 간격(px)이다. '다음'을 누르며 눈이 가장 먼저 가는 곳이 어떻게 바뀌는지 보자. 핵심은 2단계다. 가격을 더 키우는 대신 설명·평점·배송을 작고 옅게 낮추자, 가격이 저절로 떠오른다.",
        figure: cardMock,
        steps: [
            "<b>0. 모두 같은 무게</b>: 15px 굵게, 같은 색, 같은 간격 10px. 어디부터 읽을지 정해진 곳이 없다.",
            "<b>1. 가장 중요한 것 하나</b>: 이 카드의 질문은 '뭐고 얼마냐'다. 이름과 가격만 키웠다.",
            "<b>2. 나머지를 낮춘다</b>: 설명·평점·배송을 13px, 보통 굵기, 회색 #6b6b6b로. 지우지 않고 '나중에 읽게' 했다.",
            "<b>3. 간격으로 묶는다</b>: 이름–가격 4px, 보조 정보끼리 4px, 묶음 사이 16px, 버튼 앞 24px. 선 없이 세 묶음이 보인다.",
            "<b>4. 행동 하나에만 색</b>: 누를 곳만 파랑. 색이 하나뿐이라 '여기를 누르세요'라는 신호가 된다(색 체계는 다음 회차).",
        ].map((caption) => ({ caption, enter: (k, card) => card.paint(k) })),
        basis: "'덜 중요한 것을 낮춰 강조를 만든다'는 Wathan & Schoger, Refactoring UI의 'Emphasize by de-emphasizing'. 회색 #6b6b6b는 옅어도 흰 배경에서 읽기 기준을 넘는 진하기다(다음 장면에서 설명).",
        takeaway: "가장 중요한 것 하나를 고르고, 나머지를 작게·옅게 낮춘다.",
        sources: ["Refactoring UI — Hierarchy is everything"],
        ask: "\"이 화면에서 사용자가 가장 먼저 읽어야 할 것 하나가 뭐야?\"" },

      { type: "explain", kicker: "도구 세 가지", title: "위계를 만드는 손잡이는 크기·굵기·회색 진하기다", en: "Levers", arrows: false,
        steps: [
          { icon: "scale", title: "크기", text: "가장 강한 손잡이. 한 화면 안에서는 3–4단계로 제한하는 것이 흔한 경험칙이다. 단계가 많으면 서로 비슷해져 차이가 잘 드러나지 않는다.",
            visual: `<div class="lv"><div><code>크기px / 굵기</code></div><div><code>24 / 800</code><b style="font-size:24px">₩89,000</b></div><div><code>15 / 600</code><span style="font-size:15px;font-weight:600">무선 키보드</span></div><div><code>13 / 400</code><span style="font-size:13px">내일 도착</span></div></div>` },
          { icon: "pencil", title: "굵기", text: "크기를 바꾸기 어려운 곳(표, 목록)에서 쓴다. CSS font-weight 값으로 보통(400–500)과 굵게(600–700) 두 단계면 대부분 된다." },
          { icon: "palette", title: "회색 진하기", text: "진함 / 중간 / 옅음 세 단계로 본문과 보조 정보를 나눈다. 단, 옅은 회색도 {{대비비}} 4.5:1은 넘겨야 읽힌다(흰 배경에서는 #767676까지).",
            visual: `<div class="lv"><div><code>#111</code><span style="color:#111">제목</span></div><div><code>#444</code><span style="color:#444">본문</span></div><div><code>#6b6b6b</code><span style="color:#6b6b6b">보조 정보</span></div></div>` },
        ],
        basis: "#767676(4.54:1)과 #6b6b6b(약 5.3:1)는 WCAG 2.x 대비비 식으로 계산한 값(모델로 계산한 예시). 굵기 두 단계는 Refactoring UI의 권장. 크기 3–4단계는 경험칙. 색 체계 전체는 다음 회차.",
        takeaway: "크기·굵기·회색 각각 2–4단계만 쓴다. 단계가 적을수록 차이에 뜻이 생긴다.",
        ask: "\"이 화면에 글자 크기가 몇 종류 쓰였는지 세어 줘\"" },

      { type: "contrast", kicker: "같은 폼, 간격과 글자 위계를 바꿨다", title: "묶음 안은 좁게, 묶음 사이는 넓게", en: "Before → After",
        sub: "왼쪽과 오른쪽은 같은 회원가입 폼이다. 번호를 따라 간격이 무엇을 말하는지 보자.",
        before: {
          visual: formMock({ lab: 14, first: 13, gaps: [10, 12], sec: 22, labSize: 14, labColor: "#222", hSize: 15, hWeight: 600 }),
          points: [
            { at: [70, 30], title: "라벨↔입력칸 14px, 항목 사이 10·12px", text: "'이메일' 라벨이 자기 칸(14px)보다 위 칸(10px)에 더 가깝다. 어느 칸의 라벨인지 한 번 더 생각하게 된다.", tone: "bad" },
            { at: [70, 55], title: "10 · 12 · 13 · 14px 제각각", text: "뜻 없는 차이라 눈이 '여기서 뭐가 달라졌지?'를 찾는다. 이게 각이 안 잡힌 느낌이다.", tone: "bad" },
            { at: [40, 78], title: "섹션 제목 = 라벨과 같은 무게", text: "'배송지'가 새 묶음의 시작인지 그냥 항목인지 구분되지 않는다.", tone: "bad" },
          ],
          foot: { label: "쓰인 간격", visual: () => LTT.swatches([10, 12, 13, 14, 22].map((v) => ({ color: "#d9d6cf", label: v + "px", w: 12, h: v, r: 2 })), { caption: "다섯 가지 값, 규칙 없음" }) },
        },
        after: {
          visual: formMock({ lab: 8, first: 16, gaps: [24, 24], sec: 48, labSize: 13, labColor: "#444", hSize: 17, hWeight: 800 }),
          points: [
            { at: [70, 26], title: "라벨↔입력칸 8px, 항목 사이 24px", text: "묶음 안 간격이 묶음 사이의 1/3이라 라벨이 제 칸에 붙어 보인다.", tone: "good" },
            { at: [70, 50], title: "항목 사이는 모두 24px", text: "같은 역할은 같은 값. 차이가 없으니 눈이 쉴 수 있다.", tone: "good" },
            { at: [40, 74], title: "섹션 앞 48px + 큰 제목", text: "간격과 크기가 함께 '여기서 새 묶음 시작'을 말한다.", tone: "good" },
          ],
          foot: { label: "쓴 간격", visual: () => LTT.swatches([8, 16, 24, 48].map((v) => ({ color: "#2f5bff", label: v + "px", w: 12, h: v, r: 2 })), { caption: "스케일 4·8·16·24·32·48 중 네 단계" }) },
        },
        takeaway: "묶음 안 간격 < 묶음 사이 간격 < 섹션 사이 간격. 같은 역할에는 같은 값을 쓴다.",
        sources: ["NN/g — Proximity Principle in Visual Design"],
        ask: "\"이 폼의 간격을 역할별(묶음 안·묶음 사이·섹션 사이)로 나눠서 스케일 값으로 바꿔 줘\"" },

      { kicker: "직접 밀어 보기", title: "묶음 사이 간격을 벌리면 그룹이 생긴다", en: "Try it",
        narration: [
          "라벨↔입력칸 8px, 섹션 앞 48px은 고정하고, 슬라이더로 항목 사이 간격만 바꿔 보자. 값은 {{간격 스케일}}의 단계로만 움직인다.",
          "8px(같은 값)에서는 라벨이 위아래 어느 칸에 붙는지 모호하다. 단계를 올릴수록 라벨-입력칸 쌍이 하나의 덩어리로 떨어져 보인다.",
        ],
        mount(body) {
          body.innerHTML = `<div class="live"><div><label class="ltt-param">항목 사이(=묶음 사이) 간격 <b id="bg-v"></b><input type="range" id="bg" min="1" max="5" value="1" step="1"></label>
            <p class="gapnote" id="bg-r"></p><span class="ltt-tag">예시 화면</span></div><div id="bg-f"></div></div>`;
          const host = LTT.$("bg-f");
