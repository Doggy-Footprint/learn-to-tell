<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버튼을 크게 만들면 클릭이 얼마나 빨라질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"UIUX","topic":"Fitts 법칙: 버튼 크기·거리와 클릭 시간","audience":"버튼 배치를 정해 본 적 있는 프런트엔드·디자인 입문자(로그 함수만 알면 됨)","pattern":["hook","explain","predict","compare","sweep","keywords"],"mode":"체험형: 커서 이동 시간을 예측하고 움직임으로 확인한다(시스템 동작 예측이라 자기 편향을 겨냥하지 않는다)","decision":"버튼 너비 W와 시작점에서의 거리 D를 어떻게 잡을지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --ltt-on: #4f6bed; --ltt-alt: #d6455d; }
  .lane-row b { font-size: 14px; } .lane-row span { float: right; color: var(--ltt-muted); font-variant-numeric: tabular-nums; }
  .lanes { display: grid; gap: 6px; }
  .vis svg { width: 100%; }
  @media (max-width: 720px) { .ltt-hero { font-size: 52px; } }
</style>
</head>
<body>
<script>
  // a=100, b=200, log2(D/W+1) 손계산 (log2 6=2.58496, log2 11=3.45943, log2 2.25=1.16993, log2 21=4.39232, log2 1.2=0.26303)
  const EXPECTED_BY_HAND = {
    A_small_near: 100 + 200 * 2.58496,
    B_big_far: 100 + 200 * 2.58496,
    W40_D400: 100 + 200 * 3.45943,
    W80_D100: 100 + 200 * 1.16993,
    D400_W20: 100 + 200 * 4.39232,
    D400_edge: 100 + 200 * 0.26303,
  };
  const A = 100, B = 200, EDGE_W = 2000, SLOW = 3;
  const mt = (D, W) => A + B * Math.log2(D / W + 1);

  LTT.expect("A 작고 가까움", mt(100, 20), EXPECTED_BY_HAND.A_small_near, { tol: 0.05 });
  LTT.expect("B 크고 멈", mt(400, 80), EXPECTED_BY_HAND.B_big_far, { tol: 0.05 });
  LTT.expect("W=40, D=400", mt(400, 40), EXPECTED_BY_HAND.W40_D400, { tol: 0.05 });
  LTT.expect("W=80, D=100", mt(100, 80), EXPECTED_BY_HAND.W80_D100, { tol: 0.05 });
  LTT.expect("D=400, W=20", mt(400, 20), EXPECTED_BY_HAND.D400_W20, { tol: 0.05 });
  LTT.expect("D=400, 가장자리", mt(400, EDGE_W), EXPECTED_BY_HAND.D400_edge, { tol: 0.05 });

  // Lane: start circle on the left, target rect at distance D; `go` animates the cursor at SLOW× the model time.
  function lane(node, D, W, edge) {
    const X0 = 20, S = 0.95, VW = 480, cx = X0 + D * S * 0.5, w = W * S * 0.5;
    const svg = d3.select(node).append("svg").attr("class", "ltt-svg").attr("viewBox", `0 0 ${VW} 54`);
    svg.append("rect").attr("width", VW).attr("height", 54).attr("rx", 10).attr("fill", "none").attr("stroke", "var(--ltt-line)");
    svg.append("rect").attr("x", cx - w / 2).attr("y", 8).attr("height", 38).attr("rx", 4)
      .attr("width", edge ? VW - (cx - w / 2) : w).attr("fill", "var(--ltt-on)").attr("fill-opacity", 0.85);
    svg.append("line").attr("x1", X0).attr("x2", cx).attr("y1", 27).attr("y2", 27).attr("stroke", "var(--ltt-muted)").attr("stroke-dasharray", "4 4");
    svg.append("circle").attr("cx", X0).attr("cy", 27).attr("r", 6).attr("fill", "none").attr("stroke", "var(--ltt-muted)").attr("stroke-width", 2);
    const cur = svg.append("circle").attr("cx", X0).attr("cy", 27).attr("r", 6).attr("fill", "var(--ltt-alt)");
    return { go: () => cur.interrupt().attr("cx", X0).transition().duration(LTT.MOTION_MS ? mt(D, edge ? EDGE_W : W) * SLOW : 0).ease(d3.easeCubicOut).attr("cx", cx) };
  }
  const ms = (D, W) => Math.round(mt(D, W)) + " ms";
  let lanesAB = [];
  const caseItem = (label, D, W, edge, tone, note) => ({
    label, tone, verdict: ms(D, edge ? EDGE_W : W), noteAfter: true, note,
    visual: (n) => { const l = lane(n, D, W, edge); n.onclick = l.go; setTimeout(l.go, 400); },
  });

  LTT.deck({
    title: "버튼을 크게 만들면 클릭이 얼마나 빨라질까?",
    scenes: [
      { type: "hook", art: "🎯",
        text: "작고 가까운 버튼과<br>크고 먼 버튼, <u>어느 쪽이 빨리</u> 눌릴까?",
        sub: "주요 버튼의 크기와 위치를 정할 때 '거리 대비 크기'라는 하나의 비율만 보면 된다." },

      { type: "explain", kicker: "원리", title: "시간은 거리 ÷ 너비가 정한다",
        steps: [
          { icon: "↔️", title: "멀리 간다", text: "커서는 먼저 크게 날아가 목표 근처에 닿는다." },
          { icon: "🎯", title: "좁으면 다듬는다", text: "목표가 좁을수록 마지막에 작은 보정 동작이 여러 번 붙는다." },
          { icon: "⏱️", title: "로그로 늘어난다", text: "D/W가 두 배가 돼도 시간은 두 배가 아니라 일정량(약 b)만 는다." },
        ],
        tex: "MT = a + b\\,\\log_2\\!\\left(\\frac{D}{W}+1\\right)",
        basis: "a=100ms, b=200ms/bit는 이 페이지의 예시값이다. 장치·사용자·과제마다 크게 달라 직접 측정해야 한다(불확실)." },

      { type: "predict", kicker: "예측", title: "어느 쪽이 더 빨리 클릭될까?",
        question: "작고 가까운 버튼(W=20,D=100)과 크고 먼 버튼(W=80,D=400) 중 어느 쪽이 빨리 클릭되는가",
        choices: [{ id: "A", text: "A. 작고 가까운 버튼이 빠르다" }, { id: "B", text: "B. 크고 먼 버튼이 빠르다" }, { id: "same", text: "거의 같다" }],
        answer: "same",
        why: `둘 다 <b>${ms(100, 20)}</b>(모델로 계산한 예시). D/W가 5로 같아 log2(6)이 같다. 이동은 3배 느리게 재생했다.`,
        mount(body) {
          const box = document.createElement("div");
          box.className = "lanes";
          [["A. 작고 가까운 버튼 (W=20, D=100)", 100, 20], ["B. 크고 먼 버튼 (W=80, D=400)", 400, 80]].forEach(([t, D, W]) => {
            const row = document.createElement("div");
            row.className = "lane-row";
            row.innerHTML = `<b>${t}</b><span></span>`;
            box.appendChild(row);
            lanesAB.push({ l: lane(row, D, W, false), s: row.querySelector("span"), D, W });
          });
          body.prepend(box);
          return {};
        },
        reveal: () => lanesAB.forEach((x) => { x.s.textContent = ms(x.D, x.W); x.l.go(); }) },

      { type: "compare", kicker: "실제 배치", title: "400px 떨어진 곳에 둘 버튼, 어느 배치가 빠를까?",
        revealLabel: "예상 시간 보기",
        items: [
          caseItem("툴바 아이콘 20px", 400, 20, false, "bad", "아이콘만 작게 두면 가장 느리다."),
          caseItem("일반 버튼 40px", 400, 40, false, "warn", "너비 두 배 → 약 b만큼 빨라짐."),
          caseItem("화면 가장자리 메뉴", 400, 20, true, "good", "커서가 벽에서 멈춰 유효 너비가 커진다(macOS 메뉴바)."),
          caseItem("가까운 80px 버튼", 100, 80, false, "good", "가깝고 크면 거의 즉시."),
        ],
        basis: "카드를 누르면 이동을 다시 재생한다(3배 느리게). 모델로 계산한 예시. 가장자리 유효 너비는 무한이 아니라 2000px로 가정했다(불확실)." },

      { type: "live", kicker: "직접 밀어 보기", title: "W를 두 배로 = D를 절반으로",
        mount(body) {
          body.innerHTML = `<div class="ltt-hero"><span id="mt">0</span><small>ms · D/W = <b id="ratio"></b></small></div><div id="ln"></div>
            <label class="ltt-param">거리 D <b id="Dv"></b><input type="range" id="D" min="50" max="800" step="10" value="300"></label>
            <label class="ltt-param">너비 W <b id="Wv"></b><input type="range" id="W" min="10" max="200" step="2" value="40"></label>
            <span class="ltt-tag">모델로 계산한 예시</span>`;
          const draw = () => {
            const D = +LTT.$("D").value, W = +LTT.$("W").value;
            LTT.$("Dv").textContent = D + " px"; LTT.$("Wv").textContent = W + " px";
            LTT.$("ratio").textContent = (D / W).toFixed(1);
            LTT.tween("mt", mt(D, W), undefined, 200);
            LTT.$("ln").replaceChildren();
            lane(LTT.$("ln"), D, W, false).go();
          };
          body.querySelectorAll("input").forEach((i) => i.addEventListener("change", draw));
          body.querySelectorAll("input").forEach((i) => i.addEventListener("input", () => LTT.tween("mt", mt(+LTT.$("D").value, +LTT.$("W").value), undefined, 0)));
          return { enter: draw };
        } },

      { type: "explain", kicker: "주의", title: "이 식이 말해 주지 않는 것",
        steps: [
          { icon: "👆", title: "터치는 다르다", text: "손가락이 목표를 가리고 a, b가 다르다. 44pt(Apple)·48dp(Material)는 속도가 아니라 오터치 방지 기준이다." },
          { icon: "❌", title: "오류율", text: "W를 줄여도 시간은 로그로만 늘지만 잘못 누르는 비율은 따로 는다." },
          { icon: "📏", title: "상수는 측정", text: "a, b는 장치·사람마다 다르다. 비교는 같은 조건 안에서만." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "Fitts 법칙", en: "Fitts's law" }, { ko: "난이도 지수", en: "index of difficulty (ID)" }],
        signals: ["버튼을 얼마나 크게, 어디에 둘지 정할 때", "자주 누르는 동작이 화면 반대편에 있을 때", "모바일 터치 영역 최소 크기를 물을 때"],
        queries: ["Fitts law Shannon formulation", "Fitts law screen edge infinite width", "touch target size 44pt 48dp", "pointing throughput ISO 9241-9"],
        neighbors: [
          { term: "Hick 법칙", diff: "선택지 수가 결정 시간을 정한다. Fitts는 이동(포인팅) 시간." },
          { term: "Steering 법칙", diff: "좁은 통로를 따라가는 시간(중첩 메뉴). 터널 길이/폭에 선형." },
        ] },
    ],
  });
</script>
</body>
</html>
