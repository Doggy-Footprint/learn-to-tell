<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회색 글자는 얼마나 옅어야 읽기 힘들어질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"UIUX","topic":"WCAG 2.x 색 대비비","audience":"CSS 색상 코드(#RRGGBB)를 읽을 수 있는 UI 개발자·디자이너","pattern":["hook","explain","predict","compare","sweep","keywords"],"mode":"체험형: 실제 UI 조각을 나란히 놓고 대비비 통과 여부를 짐작해 본 뒤 인포그래픽 정답으로 확인한다(시스템 계산을 맞히는 것이라 자기 편향을 겨냥하지 않는다)","decision":"글자색과 배경색 조합이 WCAG AA/AAA 대비비 기준을 넘는지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .crow { display: grid; grid-template-columns: 64px 1fr 70px; gap: 10px; align-items: center; }
  .crow .hex { margin: 0; }
  .hex { display: block; font: 12px ui-monospace, monospace; color: var(--ltt-muted); margin-top: 4px; }
  .ui { width: 100%; border-radius: 10px; padding: 14px; border: 1px solid var(--ltt-line); font-size: 15px; }
  .ui input { width: 100%; font: inherit; border: 1px solid #ccc; border-radius: 8px; padding: 8px; box-sizing: border-box; }
  .ui .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; font-weight: 700; }
  .mono { font: 13px ui-monospace, monospace; }
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
  .live .ui { padding: 22px; }
  @media (max-width: 720px) { .live { grid-template-columns: 1fr; } .ltt-hero { font-size: 52px; } }
</style>
</head>
<body>
<script>
  // 손계산: c=((s/255+0.055)/1.055)^2.4, 회색은 계수 합이 1이라 L=선형값
  // #777: 0.494471^2.4=0.18448 → 1.05/0.23448=4.478 / #767676: 0.18117 → 4.542 / #595959: 0.09990 → 7.005
  // 순수색 L은 계수 그대로: 빨강 0.2126, 초록 0.7152, 파랑 0.0722
  const EXPECTED_BY_HAND = {
    gray999: 2.849, gray888: 3.545, gray777: 4.478, gray666: 5.742, gray767676: 4.542, gray595959: 7.005,
    blackWhite: 21, same: 1,
    redWhite: 1.05 / 0.2626, blueWhite: 1.05 / 0.1222, redGreen: 0.7652 / 0.2626,
  };
  const lin = (s) => { const c = s / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = (r, g, b) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const ratio = (f, g) => { const a = lum(...f), b = lum(...g); return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); };
  const gr = (v) => [v, v, v], W = gr(255);

  LTT.expect("#999 on 흰색", ratio(gr(0x99), W), EXPECTED_BY_HAND.gray999, { tol: 0.005 });
  LTT.expect("#888 on 흰색", ratio(gr(0x88), W), EXPECTED_BY_HAND.gray888, { tol: 0.005 });
  LTT.expect("#777 on 흰색", ratio(gr(0x77), W), EXPECTED_BY_HAND.gray777, { tol: 0.005 });
  LTT.expect("#666 on 흰색", ratio(gr(0x66), W), EXPECTED_BY_HAND.gray666, { tol: 0.005 });
  LTT.expect("#767676 on 흰색", ratio(gr(0x76), W), EXPECTED_BY_HAND.gray767676, { tol: 0.005 });
  LTT.expect("#595959 on 흰색", ratio(gr(0x59), W), EXPECTED_BY_HAND.gray595959, { tol: 0.005 });
  LTT.expect("검정 on 흰색", ratio(gr(0), W), EXPECTED_BY_HAND.blackWhite, { tol: 1e-9 });
  LTT.expect("흰색 on 흰색", ratio(W, W), EXPECTED_BY_HAND.same, { tol: 1e-9 });
  LTT.expect("빨강 on 흰색", ratio([255, 0, 0], W), EXPECTED_BY_HAND.redWhite, { tol: 0.005 });
  LTT.expect("파랑 on 흰색", ratio([0, 0, 255], W), EXPECTED_BY_HAND.blueWhite, { tol: 0.005 });
  LTT.expect("빨강 on 초록", ratio([255, 0, 0], [0, 255, 0]), EXPECTED_BY_HAND.redGreen, { tol: 0.005 });

  // Floor, not round: 4.499 must not display as 4.50 while failing AA.
  const fl2 = (v) => (Math.floor(v * 100 + 1e-9) / 100).toFixed(2);
  const hex = (c) => "#" + c.map((x) => x.toString(16).padStart(2, "0")).join("").toUpperCase();
  const RULES = [["AA 일반", 4.5], ["AA 큰 글자", 3], ["AAA 일반", 7], ["UI 요소", 3]];
  const badges = (r) => RULES.map(([n, m]) => `<span class="ltt-tag ${r >= m ? "good" : "bad"}">${r >= m ? "✓" : "✗"} ${n} ${m}</span>`).join(" ");
  const GRAYS = ["99", "88", "77", "66"];

  LTT.deck({
    title: "회색 글자는 얼마나 옅어야 읽기 힘들어질까?",
    scenes: [
      { type: "hook", art: "🔍",
        text: "눈에는 멀쩡히 읽히는 회색 글자가<br>접근성 검사에서는 <u>실패</u>한다.",
        sub: "보조 텍스트·placeholder 색을 고를 때, 눈 대신 '대비비'라는 숫자로 판정한다." },

      { type: "explain", kicker: "원리", title: "대비비는 두 색의 '밝기 차이 비율'이다",
        steps: [
          { icon: "🎨", title: "색 → 밝기", text: "RGB를 사람 눈의 감도대로 섞어 상대 휘도 L로 바꾼다. 초록이 가장 크게, 파랑이 가장 작게 기여한다." },
          { icon: "➗", title: "밝은 쪽 ÷ 어두운 쪽", text: "같은 색이면 1:1, 검정과 흰색이면 21:1." },
          { icon: "🚦", title: "기준선과 비교", text: "AA 일반 글자 4.5, 큰 글자·UI 경계 3, AAA 일반 7." },
        ],
        tex: "CR = \\frac{L_1 + 0.05}{L_2 + 0.05},\\quad L = 0.2126R + 0.7152G + 0.0722B",
        basis: "WCAG 2.x 성공 기준 1.4.3(AA), 1.4.6(AAA), 1.4.11(UI 요소, 2.1부터). 큰 글자는 24px 이상 또는 약 18.7px 굵게." },

      { type: "predict", kicker: "짐작해 보기", title: "흰 배경에서 AA(4.5:1)를 넘는 회색은?",
        question: "흰 배경 위 회색 글자(#999, #888, #777, #666) 중 대비비 4.5:1을 넘는 것",
        choices: GRAYS.map((g) => ({ id: g + g + g, text: `<span style="color:#${g}${g}${g}">저장하지 않은 변경 사항</span><span class="hex">#${g}${g}${g}</span>` })),
        answer: "666666",
        why: "#666만 통과한다. #777은 <b>4.48:1</b>로 0.02 모자라 실패한다. 눈으로는 구분되지 않는 차이다.",
        answerVisual: (n) => {
          n.innerHTML = GRAYS.map((g, i) => {
            const r = ratio(gr(parseInt(g, 16)), W);
            return `<div class="crow ltt-rise" style="--i:${i}"><span class="hex">#${g}${g}${g}</span><div class="ltt-bar"><span style="flex-grow:${r};background:#${g}${g}${g}"></span><span style="flex-grow:${7 - r}"></span></div><span class="ltt-tag ${r >= 4.5 ? "good" : "bad"}">${fl2(r)}:1</span></div>`;
          }).join("") + `<p class="ltt-basis">막대 끝 = 7:1(AAA). 4.5:1(AA)은 막대의 64% 지점.</p>`;
        } },

      { type: "compare", kicker: "실제 UI", title: "자주 보는 UI 조각, 일반 글자 AA를 넘을까?",
        revealLabel: "대비비 보기",
        items: [
          { label: "입력창 placeholder #999", tone: "bad", verdict: `${fl2(ratio(gr(0x99), W))}:1 실패`,
            visual: `<div class="ui"><input placeholder="이메일 주소" disabled style="background:#fff;color:#999"></div>`,
            noteAfter: true, note: "읽혀야 할 안내라면 기준 대상." },
          { label: "캡션 #767676", tone: "good", verdict: `${fl2(ratio(gr(0x76), W))}:1 통과`,
            visual: `<div class="ui" style="color:#767676">마지막 저장 3분 전</div>`,
            noteAfter: true, note: "AA를 넘는 가장 옅은 회색." },
          { label: "흰 글자 + 순빨강 버튼", tone: "warn", verdict: `${fl2(ratio([255, 0, 0], W))}:1 큰 글자만 통과`,
            visual: `<div class="ui"><span class="btn" style="background:#f00;color:#fff">삭제</span></div>`,
            noteAfter: true, note: "빨강은 휘도 기여가 낮다." },
          { label: "빨강 글자 on 초록", tone: "bad", verdict: `${fl2(ratio([255, 0, 0], [0, 255, 0]))}:1 실패`,
            visual: `<div class="ui" style="background:#0f0;color:#f00;font-weight:700">오류 3건</div>`,
            noteAfter: true, note: "색각 이상에선 더 가깝다." },
        ],
        basis: "대비비는 WCAG 2.x 식으로 계산했다(모델로 계산한 예시). 배경이 단색일 때만 맞는 값이다." },

      { type: "live", kicker: "직접 밀어 보기", title: "회색을 옅게 하면 어디서 갈릴까?",
        sub: "슬라이더로 글자 회색을 바꾼다. 경계는 #767676 근처다.",
        mount(body) {
          body.innerHTML = `<div class="live"><div><div class="ltt-hero"><span id="cr">0</span><small>: 1</small></div>
            <p id="bdg"></p><label class="ltt-param">글자 회색 <b id="gv" class="mono"></b><input type="range" id="g" min="64" max="204" value="119"></label></div>
            <div class="ui" id="pv"><b style="font-size:24px">큰 글자 24px 굵게</b><p style="margin:8px 0 0">일반 글자 16px. 저장하지 않은 변경 사항이 있습니다.</p></div></div>
            <span class="ltt-tag">모델로 계산한 예시</span>`;
          const draw = () => {
            const v = +LTT.$("g").value, r = ratio(gr(v), W);
            LTT.tween("cr", r, fl2, 200);
            LTT.$("gv").textContent = hex(gr(v));
            LTT.$("pv").style.color = hex(gr(v));
            LTT.$("bdg").innerHTML = badges(r);
          };
          LTT.$("g").addEventListener("input", draw);
          return { enter: draw };
        } },

      { type: "explain", kicker: "한계", title: "숫자가 맞지 않는 곳",
        steps: [
          { icon: "🖼️", title: "이미지·그라디언트 위", text: "배경이 단색이 아니면 가장 나쁜 지점에서 따로 잰다." },
          { icon: "🔠", title: "굵기·크기", text: "WCAG 2.x 식은 글자 굵기와 크기를 연속으로 반영하지 못한다." },
          { icon: "🧪", title: "대안 APCA", text: "WCAG 3 초안의 대안 식이 제안되어 있으나 아직 표준이 아니다(불확실)." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "색 대비비", en: "WCAG contrast ratio" }, { ko: "상대 휘도", en: "relative luminance" }],
        signals: ["회색 보조 텍스트·placeholder·비활성 버튼 색을 정할 때", "브랜드 색 버튼 위 흰 글자가 괜찮은지 물을 때", "다크 모드 토큰을 새로 만들 때"],
        queries: ["WCAG 1.4.3 contrast minimum", "WCAG 1.4.11 non-text contrast", "APCA contrast WCAG 3", "#767676 minimum gray AA"],
        neighbors: [
          { term: "색각 이상 대응", diff: "대비비가 높아도 색상만으로 구분하면 실패. 1.4.1 '색 사용' 기준." },
          { term: "APCA", diff: "글자 크기·굵기·극성을 반영하는 대안 식. 숫자 척도가 다르다." },
        ] },
    ],
  });
</script>
</body>
</html>
