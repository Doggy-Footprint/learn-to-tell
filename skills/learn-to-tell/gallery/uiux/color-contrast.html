<script>
  // 손계산: c=((s/255+0.055)/1.055)^2.4, 회색은 계수 합이 1이라 L=선형값
  // #777: 0.494471^2.4=0.18448 → 1.05/0.23448=4.478 / #767676: 0.18117 → 4.542 / #595959: 0.09990 → 7.005
  // #AAA: 0.684044^2.4=0.40198 → 1.05/0.45198=2.323
  // #D70015: R 0.851315^2.4=0.67954, B 0.130192^2.4=0.007497 → L=0.145011 → 1.05/0.195011=5.384
  // 순수색 L은 계수 그대로: 빨강 0.2126, 초록 0.7152, 파랑 0.0722
  const EXPECTED_BY_HAND = {
    grayAAA: 2.323, gray999: 2.849, gray888: 3.545, gray777: 4.478, gray666: 5.742, gray767676: 4.542, gray595959: 7.005,
    blackWhite: 21, same: 1, deepRedWhite: 5.384,
    redWhite: 1.05 / 0.2626, blueWhite: 1.05 / 0.1222, redGreen: 0.7652 / 0.2626,
  };
  const lin = (s) => { const c = s / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = (r, g, b) => 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const ratio = (f, g) => { const a = lum(...f), b = lum(...g); return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); };
  const gr = (v) => [v, v, v], W = gr(255);
  const rgb = (h) => [0, 2, 4].map((i) => parseInt(h.replace("#", "").slice(i, i + 2), 16));

  LTT.expect("#AAA on 흰색", ratio(gr(0xaa), W), EXPECTED_BY_HAND.grayAAA, { tol: 0.005 });
  LTT.expect("#999 on 흰색", ratio(gr(0x99), W), EXPECTED_BY_HAND.gray999, { tol: 0.005 });
  LTT.expect("#888 on 흰색", ratio(gr(0x88), W), EXPECTED_BY_HAND.gray888, { tol: 0.005 });
  LTT.expect("#777 on 흰색", ratio(gr(0x77), W), EXPECTED_BY_HAND.gray777, { tol: 0.005 });
  LTT.expect("#666 on 흰색", ratio(gr(0x66), W), EXPECTED_BY_HAND.gray666, { tol: 0.005 });
  LTT.expect("#767676 on 흰색", ratio(gr(0x76), W), EXPECTED_BY_HAND.gray767676, { tol: 0.005 });
  LTT.expect("#595959 on 흰색", ratio(gr(0x59), W), EXPECTED_BY_HAND.gray595959, { tol: 0.005 });
  LTT.expect("검정 on 흰색", ratio(gr(0), W), EXPECTED_BY_HAND.blackWhite, { tol: 1e-9 });
  LTT.expect("흰색 on 흰색", ratio(W, W), EXPECTED_BY_HAND.same, { tol: 1e-9 });
  LTT.expect("흰색 on #D70015", ratio(rgb("#d70015"), W), EXPECTED_BY_HAND.deepRedWhite, { tol: 0.005 });
  LTT.expect("빨강 on 흰색", ratio([255, 0, 0], W), EXPECTED_BY_HAND.redWhite, { tol: 0.005 });
  LTT.expect("파랑 on 흰색", ratio([0, 0, 255], W), EXPECTED_BY_HAND.blueWhite, { tol: 0.005 });
  LTT.expect("빨강 on 초록", ratio([255, 0, 0], [0, 255, 0]), EXPECTED_BY_HAND.redGreen, { tol: 0.005 });

  // Floor, not round: 4.499 must not display as 4.50 while failing AA.
  const fl2 = (v) => (Math.floor(v * 100 + 1e-9) / 100).toFixed(2);
  const hex = (c) => "#" + c.map((x) => x.toString(16).padStart(2, "0")).join("").toUpperCase();
  const cr = (h) => fl2(ratio(rgb(h), W));
  const RULES = [["AA 일반", 4.5], ["AA 큰 글자", 3], ["AAA 일반", 7]];
  const badges = (r) => RULES.map(([n, m]) => `<span class="ltt-tag ${r >= m ? "good" : "bad"}">${r >= m ? "✓" : "✗"} ${n} ${m}</span>`).join(" ");
  const GRAYS = ["99", "88", "77", "66"];

  // The same settings screen twice; only the text colours differ between BEFORE and AFTER.
  // o.meas outlines the measured text like a redline; point positions are % of the phone frame, so they hold at any width.
  const settings = (c, o = {}) => () => {
    const p = LTT.mock.phone({ width: o.width || 220, ratio: "9/16.5" });
    const m = o.meas ? " meas" : "";
    p.screen.innerHTML = `<div class="set" style="display:flex;flex-direction:column;gap:10px;height:100%">
      <h4>알림 설정</h4>
      <div class="field${m}" style="color:${c.ph}">이메일 주소를 입력하세요</div>
      <p class="help${m}" style="color:${c.help}">변경 사항은 저장한 뒤부터 적용돼요.</p>
      <div class="row"><span>새 댓글 알림</span><i class="tg"></i></div>
      <div class="row"><span>주간 요약 메일</span><i class="tg"></i></div>
      <div class="del${m}" style="background:${c.btn}">계정 삭제</div></div>`;
    return p.el;
  };
  const BEFORE = { ph: "#aaaaaa", help: "#999999", btn: "#ff0000" };
  const inspector = () => LTT.inspector({ title: "CONTRAST CHECK · 일반 글자",
    rows: [["placeholder", "#AAAAAA", "#FFFFFF", "#aaaaaa"], ["도움말", "#999999", "#FFFFFF", "#999999"], ["버튼 글자", "#FFFFFF", "#FF0000", "#ff0000"]]
      .map(([name, fg, bg, k]) => ({ name, fg, bg, ratio: cr(k) })) });
  // Linear 1..8 track: the three thresholds sit far enough apart to label; 21:1 is off the scale.
  const ratioRuler = () => {
    const x = (v) => `${((v - 1) / 7) * 100}%`;
    return `<div class="ruler"><div class="track"></div>${[[3, "3", "큰 글자"], [4.5, "4.5", "AA"], [7, "7", "AAA"]].map(([v, l, t]) => `<b style="left:${x(v)}">${l}</b><span style="left:${x(v)}">${t}</span>`).join("")}</div>`;
  };

  LTT.deck({
    title: "회색 글자는 얼마나 옅어야 읽기 힘들어질까?",
    theme: "studio",
    scenes: [
      { type: "hook", art: "eye", kicker: "설정 화면의 보조 텍스트 색 고르기",
        pre: "placeholder는 #999면 될까, #777이면 될까?",
        text: "눈에는 멀쩡히 읽히는 회색 글자가<br>접근성 검사에서는 <u>실패</u>한다.",
        sub: "흐린 화면, 햇빛 아래의 휴대폰, 시력이 약한 사용자에게는 같은 회색이 보이지 않는다. 그래서 '눈으로 봐서 괜찮다' 대신 숫자 하나로 판정한다. 이 수업을 마치면 그 숫자를 읽고, 어떤 회색까지 써도 되는지 말할 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "대비비", en: "contrast ratio", icon: "sun", plain: "글자색과 배경색의 밝기가 몇 배 차이 나는지 나타낸 숫자. 1:1(같은 색)부터 21:1(검정과 흰색)까지.", example: "흰 배경에 #767676 회색 글자는 4.54:1." },
          { key: "상대 휘도", en: "relative luminance", icon: "eye", plain: "색이 사람 눈에 얼마나 밝게 보이는지를 0(검정)~1(흰색)로 나타낸 값. 대비비는 이 값으로 계산한다.", example: "순수한 초록은 0.72, 순수한 파랑은 0.07. 같은 '최대 밝기'라도 눈에는 다르게 보인다." },
          { key: "WCAG AA", en: "accessibility level", icon: "check", plain: "웹 접근성 국제 지침(WCAG)이 정한 기본 합격선. 일반 글자는 대비비 4.5 이상이어야 한다.", example: "더 엄격한 AAA는 7 이상. 공공기관 사이트는 보통 AA를 요구한다." },
        ] },

      { type: "figure", kicker: "디자인 리뷰 · 대비 검사", title: "눈에는 읽히는 이 화면, 재 보면 세 곳이 실패한다", en: "Redline",
        figure: () => {
          const w = LTT.h("div", "review");
          w.appendChild(settings(BEFORE, { width: 260, meas: true })());
          w.insertAdjacentHTML("beforeend", inspector());
          return w;
        },
        pointsOn: ".ltt-phone", pointsTone: "bad",
        points: [
          { at: [90, 24], title: "placeholder", text: "입력칸 안의 안내 글자." },
          { at: [64, 37], title: "도움말", text: "입력칸 아래 보조 설명." },
          { at: [88, 91], title: "버튼 글자", text: "순빨강 위 흰 글자." },
        ],
        caption: "빨간 점선 = 검사한 글자. 오른쪽 패널은 디자인 툴의 대비 검사처럼 글자색·배경색과 {{대비비}}를 보인다. 셋 다 일반 글자 기준 4.5에 못 미친다. 숫자가 어디서 나오는지는 다음 장면에서 본다. 모델로 계산한 예시." },

      { type: "explain", form: "stack", kicker: "계산 과정", title: "대비비는 이렇게 나온다", en: "How it works",
        steps: [
          { icon: "palette", title: "색 → 밝기", text: "RGB 각 값(0–255)을 화면 특성에 맞게 보정해 0–1로 바꾼 뒤, 눈의 감도대로 섞어 {{상대 휘도}}를 구한다. 눈은 초록에 가장 민감하다. 예: #767676은 118 → 보정하면 0.18.",
            visual: `<div class="lum">${[["R", "#e5484d", 0.2126], ["G", "#12a066", 0.7152], ["B", "#2f5bff", 0.0722]].map(([k, c, w]) => `<div><span>${k}</span><i style="width:${w * 100}%;background:${c}"></i><span>×${w}</span></div>`).join("")}</div>` },
          { icon: "scale", title: "밝은 쪽 ÷ 어두운 쪽", text: "(밝은 쪽 + 0.05) ÷ (어두운 쪽 + 0.05)로 나눈다. 0.05는 화면 반사광을 흉내 낸 값이다. 예: 흰색(1)과 #767676은 1.05 ÷ 0.23 = 4.54.",
            visual: `<div class="pair"><span style="background:#fff;color:#000;box-shadow:inset 0 0 0 1px #e6e3dc">21 : 1</span><span style="background:#767676;color:#fff">4.54 : 1</span><span style="background:#eee;color:#ddd">1.2 : 1</span></div>` },
          { icon: "ruler", title: "기준선과 비교", text: "일반 글자는 4.5, 24px 이상 큰 글자와 버튼 테두리는 3, 더 엄격한 AAA는 7을 넘어야 한다. 막대 왼쪽(빨강)이 실패, 오른쪽(초록)이 통과 구간이다.",
            visual: ratioRuler },
        ],
        tex: "CR = \\frac{L_{밝은} + 0.05}{L_{어두운} + 0.05},\\quad L = 0.2126R + 0.7152G + 0.0722B \\ (R,G,B\\text{는 화면 특성에 맞게 보정한 0–1 값})",
        basis: "WCAG 2.x 성공 기준 1.4.3(AA), 1.4.6(AAA), 1.4.11(UI 요소, 2.1부터). 큰 글자는 24px 이상 또는 약 18.7px 굵게.",
        takeaway: "대비비는 '눈이 느끼는 밝기'의 비율이다. 색상이 아니라 밝기 차이가 읽힘을 정한다." },

      { type: "contrast", kicker: "같은 화면, 색만 바꿨다", title: "옅은 회색 세 곳이 화면을 못 읽게 만든다", en: "Before → After",
        sub: "왼쪽과 오른쪽은 글자 색만 다르다. 번호를 따라 무엇이 바뀌었는지 보자.",
        before: {
          visual: settings(BEFORE),
          points: [
            { at: [90, 24], title: `placeholder #AAA · ${cr("#aaaaaa")}:1`, text: "무엇을 입력할지 알려 주는 안내가 거의 안 보인다." },
            { at: [64, 37], title: `도움말 #999 · ${cr("#999999")}:1`, text: "'옅을수록 덜 중요해 보인다'는 의도가 읽기 자체를 막는다." },
            { at: [88, 91], title: `흰 글자 + 순빨강 · ${cr("#ff0000")}:1`, text: "빨강은 눈이 덜 밝게 느껴 흰 글자와의 차이가 작다." },
          ],
          foot: { label: "쓰인 글자색", visual: () => LTT.swatches([["#aaaaaa"], ["#999999"], ["#ff0000"]].map(([c]) => ({ color: c, label: cr(c), w: 34, h: 34, r: 10 })), { caption: "모두 일반 글자 기준 4.5 미달" }) },
        },
        after: {
          visual: settings({ ph: "#767676", help: "#595959", btn: "#d70015" }),
          points: [
            { at: [90, 24], title: `placeholder #767676 · ${cr("#767676")}:1`, text: "흰 배경에서 AA(4.5)를 넘는다." },
            { at: [64, 37], title: `도움말 #595959 · ${cr("#595959")}:1`, text: "AAA(7)까지 넘는다. 중요도는 크기·굵기로 낮춘다." },
            { at: [88, 91], title: `흰 글자 + #D70015 · ${cr("#d70015")}:1`, text: "빨강을 조금 어둡게 하면 '위험' 느낌은 그대로 두고 통과한다." },
          ],
          foot: { label: "바꾼 글자색", visual: () => LTT.swatches([["#767676"], ["#595959"], ["#d70015"]].map(([c]) => ({ color: c, label: cr(c), w: 34, h: 34, r: 10 })), { caption: "모두 4.5 이상 · 모델로 계산한 예시" }) },
        },
        takeaway: "중요도를 낮추려면 색을 옅게 하지 말고, 크기와 굵기를 줄인다.",
        sources: ["WebAIM Contrast Checker", "WCAG 1.4.3"],
        ask: "\"보조 텍스트 색이 4.5:1을 넘는지 확인해 줘\"" },

      { type: "predict", kicker: "짐작해 보기", title: "흰 배경에서 AA(4.5:1)를 넘는 회색은?",
        sub: "네 가지 회색으로 같은 문장을 썼다. {{대비비}} 4.5를 넘는 것을 모두 고르는 게 아니라, 넘기 시작하는 가장 옅은 것 하나를 골라 보자.",
        question: "흰 배경 위 회색 글자(#999, #888, #777, #666) 중 대비비 4.5:1을 넘는 가장 옅은 것",
        choices: GRAYS.map((g) => ({ id: g + g + g, text: `<span style="color:#${g}${g}${g};font-weight:600">저장하지 않은 변경 사항</span><span class="hex">#${g}${g}${g}</span>` })),
        answer: "666666",

      { type: "statement", kicker: "색상보다 밝기", title: "색이 정반대여도 <em>밝기</em>가 비슷하면 읽히지 않는다.",
        sub: "빨강과 초록은 색상으로는 정반대지만 밝기 차이가 작아 4.5에 못 미친다. 같은 빨강도 조금 어둡게 하면 흰 글자와 통과한다.",
