<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>처음 본 숫자가 내 추정을 끌어당길까?</title>
<script type="application/json" id="ltt-meta">{"domain":"인지과학","topic":"앵커링과 조정 부족","audience":"견적이나 일정을 추정해 본 적이 있다","pattern":["hook","terms","stepper","compare","compare","explain","summary","keywords"],"mode":"설명형: 사용자 자신의 편향을 겨냥하므로 체험시키지 않고 연구 사례를 보여 준다(한 사람의 추정으로는 효과가 드러나지도 않는다)","decision":"견적·일정 추정에서 첫 숫자를 보여 줄 시점과 독립 추정을 먼저 받을지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --ltt-on: var(--ltt-accent); --ltt-alt: var(--ltt-bad); }
  .case { font-size: 15px; text-align: center; line-height: 1.5; width: 100%; color: var(--ltt-ink-2); }
  .case .ci { display: flex; width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 20px; align-items: center; justify-content: center; background: var(--ltt-bad-soft); color: var(--ltt-bad); font-size: 34px; }
  .pl text { font-size: 14px; }
  .rows { display: grid; gap: 8px; width: 100%; }
  .rows .ltt-bar { height: 28px; }
  .wk { width: 100%; } .wk .ltt-units { max-width: none; }
  .wk small { display: block; font-size: 13px; color: var(--ltt-muted); margin-top: 4px; }
</style>
</head>
<body>
<script>
  const EXPECTED_BY_HAND = { gap_2_6: 4, gap_12_6: 6, gap_6_6: 0, study_diff: 20 };
  const STUDY = { 10: 25, 65: 45 };
  const gap = (anc, own) => Math.abs(anc - own);
  LTT.expect("gap 2 vs 6", gap(2, 6), EXPECTED_BY_HAND.gap_2_6, { tol: 0 });
  LTT.expect("gap 12 vs 6", gap(12, 6), EXPECTED_BY_HAND.gap_12_6, { tol: 0 });
  LTT.expect("gap equal", gap(6, 6), EXPECTED_BY_HAND.gap_6_6, { tol: 0 });
  LTT.expect("study median diff", STUDY[65] - STUDY[10], EXPECTED_BY_HAND.study_diff, { tol: 0 });

  const caseVis = (icon, t) => `<div class="case"><span class="ci">${LTT.icon(icon)}</span>${t}</div>`;
  // Two groups saw anchors 10 and 65; bars grow from 0 to each group's median estimate.
  function wheelBars(node) {
    const box = document.createElement("div");
    box.className = "rows";
    node.appendChild(box);
    const bs = [10, 65].map((a) => { const e = document.createElement("div"); box.appendChild(e); return [a, LTT.bar(e, [{ color: a === 10 ? "var(--ltt-on)" : "var(--ltt-alt)" }, { color: "transparent" }])]; });
    bs.forEach(([, b]) => b.set([0, 100]));
    setTimeout(() => bs.forEach(([a, b]) => b.set([STUDY[a], 100 - STUDY[a]], [`바퀴 ${a} → 추정 중앙값 ${STUDY[a]}%`, ""])), 400);
  }
  // Weeks 1..12: blue up to the smaller of anchor/own, red over the gap where the anchor can pull.
  function weeks(anc, own) {
    return (node) => {
      const w = document.createElement("div");
      w.className = "wk";
      node.appendChild(w);
      const u = document.createElement("div");
      w.appendChild(u);
      const g = LTT.units(u, 12, 12);
      w.insertAdjacentHTML("beforeend", `<small>먼저 들은 숫자 ${anc}주 · 내 독립 추정 ${own}주 · 끌림 구간 ${gap(anc, own)}주</small>`);
      setTimeout(() => g.paint(Math.min(anc, own), "on", gap(anc, own)), 300);
    };
  }
  // Concept sketch on a 0..12 week line; positions are illustrative, not measured effect sizes.
  function pullLine(panel) {
    const W = 820, H = 190, x = d3.scaleLinear([0, 12], [40, W - 40]), y = 110;
    const svg = d3.select(panel).append("svg").attr("class", "ltt-svg pl").attr("viewBox", `0 0 ${W} ${H}`);
    svg.append("line").attr("x1", x(0)).attr("x2", x(12)).attr("y1", y).attr("y2", y).style("stroke", "var(--ltt-line-2)").style("stroke-width", 3);
    d3.range(0, 13, 2).forEach((t) => { svg.append("text").attr("x", x(t)).attr("y", y + 30).attr("text-anchor", "middle").text(t + "주").style("fill", "var(--ltt-muted)"); });
    const zone = svg.append("rect").attr("x", x(4.5)).attr("width", x(8) - x(4.5)).attr("y", y - 22).attr("height", 44).attr("rx", 12).style("fill", "var(--ltt-good-soft)").style("stroke", "var(--ltt-good)").style("stroke-dasharray", "4 4");
    const zoneT = svg.append("text").attr("x", x(6.95)).attr("y", y - 30).attr("text-anchor", "start").text("그럴듯해 보이는 범위").style("fill", "var(--ltt-good)").style("font-weight", 700);
    const own = svg.append("g").attr("transform", `translate(${x(6)},${y})`);
    own.append("circle").attr("r", 10).style("fill", "var(--ltt-accent)");
    own.append("text").attr("y", -44).attr("text-anchor", "middle").text("혼자 추정 6주").style("font-weight", 800).style("fill", "var(--ltt-accent)");
    const anc = svg.append("g").attr("transform", `translate(${x(2)},${y})`);
    anc.append("rect").attr("x", -11).attr("y", -11).attr("width", 22).attr("height", 22).attr("rx", 5).style("fill", "var(--ltt-bad)");
    anc.append("text").attr("y", -40).attr("text-anchor", "middle").text("\"2주면 되지?\"").style("font-weight", 800).style("fill", "var(--ltt-bad)");
    const path = svg.append("path").attr("d", `M${x(2)},${y - 14} C${x(2.8)},${y - 70} ${x(4)},${y - 70} ${x(4.5)},${y - 14}`).style("fill", "none").style("stroke", "var(--ltt-ink)").style("stroke-width", 2.5).style("stroke-dasharray", "6 6");
    const fin = svg.append("g").attr("transform", `translate(${x(4.5)},${y})`);
    fin.append("circle").attr("r", 10).style("fill", "var(--ltt-ink)");
    fin.append("text").attr("y", 52).attr("text-anchor", "middle").text("최종 답 ≈ 4.5주").style("font-weight", 800);
    const ms = LTT.MOTION_MS / 2, vis = (s, on) => s.transition().duration(ms).style("opacity", on ? 1 : 0);
    const len = path.node().getTotalLength();
    const set = (o, a, z, p, f) => { vis(own, o); vis(anc, a); vis(zone, z); vis(zoneT, z); vis(fin, f);
      path.interrupt().style("opacity", p ? 1 : 0).attr("stroke-dashoffset", p ? len : 0).transition().duration(p ? LTT.MOTION_MS * 1.4 : 0).attr("stroke-dashoffset", 0); };
    path.attr("stroke-dasharray", len + " " + len);
    return [
      { caption: "<b>① 혼자 생각하면</b> — 이 작업은 6주쯤 걸린다고 본다(파란 점).", enter: () => set(1, 0, 0, 0, 0) },
      { caption: "<b>② 숫자를 먼저 듣는다</b> — 회의에서 누군가 \"2주면 되지?\"라고 말한다. 이 숫자가 <b>{{앵커}}</b>가 된다.", enter: () => set(0.25, 1, 0, 0, 0) },
      { caption: "<b>③ 앵커에서 출발해 조정한다</b> — \"2주는 너무 짧지\" 하며 위로 올라간다. 처음부터 6주를 떠올리지 않는다.", enter: () => set(0.25, 1, 0, 1, 0) },
      { caption: "<b>④ 그럴듯해지면 멈춘다</b> — 2주에서 올라오다 보니 '말이 된다'고 느끼는 범위의 아래쪽 끝, 4.5주쯤에 닿자마자 멈춘다. 6주까지 가지 못한 이 차이가 <b>조정 부족</b>이다.", enter: () => set(0.25, 1, 1, 0, 1) },
    ];
  }

  LTT.deck({
    title: "처음 본 숫자가 내 추정을 끌어당길까?",
    scenes: [
      { type: "hook", art: "anchor", kicker: "견적·일정 추정 절차 정하기",
        pre: "\"2주면 되지?\"",
        text: "이 한마디가<br>내 견적을 <u>2주 쪽으로</u> 끌어당긴다.",
        sub: "누가 먼저 숫자를 말했는지가 추정 결과를 바꾼다. 알고 있어도 막기 어려워서, 의지가 아니라 절차로 막는다. 이 수업을 마치면 추정 회의의 순서를 어떻게 짜야 하는지 말할 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "앵커", en: "anchor", icon: "anchor", plain: "추정하기 전에 먼저 보거나 들은 숫자. 질문과 상관없는 숫자여도 출발점이 된다.", example: "\"작년엔 2주 걸렸대요\", 견적서에 미리 적힌 희망가." },
          { key: "조정 부족", en: "insufficient adjustment", icon: "trend", plain: "앵커에서 출발해 답을 고쳐 가다가, 충분히 가기 전에 멈추는 것. 그래서 답이 앵커 쪽에 치우친다.", example: "6주짜리 일을 2주에서 출발해 4~5주로 답한다." },
          { key: "독립 추정", en: "independent estimate", icon: "pencil", plain: "다른 사람의 숫자를 보기 전에 각자 따로 적은 추정값.", example: "플래닝 포커(각자 숫자 카드를 고른 뒤 동시에 뒤집는 추정 방식)가 카드를 동시에 뒤집는 이유." },
        ] },

      { kicker: "단계별로 보기", title: "출발점에서 덜 움직인다", en: "Anchoring", layout: "stack",
        narration: "한 사람의 머릿속에서 일어나는 일을 수직선으로 그렸다. 단계를 넘기며 최종 답이 어디서 멈추는지 보자.",
        mount(body) {
          const panel = body.appendChild(Object.assign(document.createElement("div"), { className: "ltt-panel" }));
          LTT.stepper(panel, pullLine(panel), { interval: 2800 });
          return {};
        },
        basis: "개념 그림이다. 점의 위치는 설명용이고 실제 효과 크기가 아니다. 설명은 Tversky & Kahneman 1974의 '앵커링과 조정'. 앵커가 관련 정보를 먼저 떠올리게 한다는 설명(선택적 접근성)도 있다.",
        takeaway: "먼저 들은 숫자에서 출발하면, 충분히 가기 전에 멈춘다.",
        ask: "\"이 견적, 누가 먼저 숫자를 말했나요?\"" },

      { type: "compare", kicker: "연구 사례", title: "상관없는 숫자에도 판단이 끌려갔다", layout: "stack", reveal: false,
        narration: "세 연구 모두 판단 전에 숫자 하나를 먼저 보여 주었다. 바퀴와 주사위는 질문과 상관없는 숫자였고, 중개인의 매도 희망가는 결과를 그만큼 움직일 근거가 없는 숫자였다. 경력 있는 전문가도 끌렸다.",
        items: [
          { label: "조작된 행운의 바퀴", visual: wheelBars, tone: "bad", verdict: "중앙값 20%p 차이",
            note: "UN 회원국 중 아프리카 국가 비율 추정. 바퀴는 10 또는 65에만 멈추게 조작했다(Tversky & Kahneman 1974)." },
          { label: "판사와 주사위", visual: caseVis("dice", "형량을 정하기 전<br>주사위를 굴린 판사들"), tone: "bad", verdict: "높은 눈 → 더 긴 형량",
            note: "조작된 주사위. 경력 판사도 끌렸다(Englich 외 2006)." },
          { label: "부동산 중개인", visual: caseVis("home", "같은 집,<br>다른 매도 희망가 서류"), tone: "bad", verdict: "희망가 따라 감정가 이동",
            note: "본인들은 희망가를 참고하지 않았다고 답했다(Northcraft & Neale 1987)." },
        ],
        basis: "수치는 바퀴 연구의 논문 보고값(집단 중앙값)만 실었다. 나머지 두 연구는 방향만 적었다. 한 사람의 값으로는 효과를 확인할 수 없다.",
        takeaway: "앵커는 무관한 숫자여도, 전문가에게도 작동한다." },

      { type: "compare", kicker: "내 작업에서", title: "일정 견적에서 끌림이 생기는 구간", layout: "stack", reveal: false,
        narration: "혼자 추정하면 6주인 사람이 다른 숫자를 먼저 들은 경우다. 칸 하나가 1주이고, 빨간 칸이 앵커 쪽으로 끌려갈 수 있는 구간이다. 그런데 앵커를 들은 뒤에는 원래 몇 주로 생각했는지 본인도 알 수 없다. 그래서 숫자를 듣기 전에 {{독립 추정}}을 적어 둬야 끌렸는지 비교할 수 있다.",
        items: [
          { label: "낮은 앵커 \"2주면 되지?\"", visual: weeks(2, 6), tone: "bad", verdict: "낮은 쪽으로 끌림" },
          { label: "높은 앵커 \"12주는 걸리겠죠\"", visual: weeks(12, 6), tone: "warn", verdict: "높은 쪽으로 끌림" },
          { label: "같은 값", visual: weeks(6, 6), tone: "good", verdict: "끌림이 있어도 안 보임",
            note: "앵커와 내 추정이 같으면 끌렸는지조차 보이지 않는다." },
        ],
        basis: "끌림의 크기는 사람과 과제마다 달라 싣지 않고 방향과 구간만 보인다.",
        takeaway: "끌렸는지 알려면, 숫자를 듣기 전에 내 추정을 적어 둬야 한다." },

      { type: "explain", kicker: "실전 절차", title: "의지 대신 순서로 막는다", en: "Procedure",
        steps: [
          { icon: "pencil", title: "먼저 적기", text: "숫자를 보기 전에 각자 낙관·보통·비관 세 값을 적는다. 범위로 적어 두면 나중에 들은 숫자가 그 안인지 밖인지 바로 비교된다." },
          { icon: "eye", title: "숫자 늦게 공개", text: "기존 견적·희망 마감은 독립 추정을 모은 뒤 보여 준다." },
          { icon: "link", title: "출처를 붙여 공개", text: "첫 숫자를 줄 때는 \"참고값\"이라 부르고 어디서 나왔는지 붙인다. 끌림을 막지는 못하지만, 그 숫자가 맞는지 따져 볼 수 있게 한다." },
        ],
        basis: "앵커는 무작위 숫자여도 작동한다. 그럴듯한 근거가 붙은 숫자가 틀렸는지는 따로 확인해야 한다.",
        takeaway: "독립 추정을 먼저 모으고, 기존 숫자는 그 다음에 공개한다.",
        ask: "\"다른 숫자를 보기 전에 각자 추정을 먼저 적어 주세요\"" },

      { type: "summary", title: "추정 회의 전에 물어볼 것", en: "Recap" },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "앵커링 효과", en: "anchoring effect" }, { ko: "조정 부족", en: "insufficient adjustment" }],
        signals: ["누군가 견적·일정·가격을 먼저 말한 뒤 추정해야 할 때", "회의에서 첫 발언자의 숫자로 수렴할 때", "협상에서 첫 제시가를 정할 때"],
        queries: ["anchoring and adjustment Tversky Kahneman 1974", "anchoring effect expert judges dice", "planning poker independent estimates", "wideband delphi estimation"],
        neighbors: [
          { term: "계획 오류", diff: "자기 일정을 체계적으로 낙관하는 것. 앵커 없이도 생긴다." },
          { term: "프레이밍 효과", diff: "같은 정보를 다르게 표현해 선택이 바뀌는 것. 숫자 출발점이 아니라 표현 방식." },
        ] },
    ],
  });
</script>
</body>
</html>
