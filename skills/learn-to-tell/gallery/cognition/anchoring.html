<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>처음 본 숫자가 내 추정을 끌어당길까?</title>
<script type="application/json" id="ltt-meta">{"domain":"인지과학","topic":"앵커링과 조정 부족","audience":"견적이나 일정을 추정해 본 적이 있다","pattern":["hook","explain","compare","keywords"],"mode":"설명형: 사용자 자신의 편향을 겨냥하므로 체험시키지 않고 연구 사례를 보여 준다(한 사람의 추정으로는 효과가 드러나지도 않는다)","decision":"견적·일정 추정에서 첫 숫자를 보여 줄 시점과 독립 추정을 먼저 받을지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --ltt-on: #4f6bed; --ltt-alt: #d6455d; }
  .case { font-size: 14px; text-align: center; line-height: 1.5; width: 100%; }
  .case b { display: block; font-size: 34px; }
  .rows { display: grid; gap: 8px; width: 100%; }
  .rows .ltt-bar { height: 28px; }
  .wk { width: 100%; } .wk .ltt-units { max-width: none; }
  .wk small { display: block; font-size: 12px; color: var(--ltt-muted); margin-top: 4px; }
</style>
</head>
<body>
<script>
  const EXPECTED_BY_HAND = { gap_2_6: 4, gap_12_6: 6, gap_6_6: 0, study_diff: 20 };
  const STUDY = { 10: 25, 65: 45 };
  const gap = (anc, own) => Math.abs(anc - own);
  LTT.expect("gap 2 vs 6", gap(2, 6), EXPECTED_BY_HAND.gap_2_6, { tol: 0 });
  LTT.expect("gap 12 vs 6", gap(12, 6), EXPECTED_BY_HAND.gap_12_6, { tol: 0 });
  LTT.expect("gap equal", gap(6, 6), EXPECTED_BY_HAND.gap_6_6, { tol: 0 });
  LTT.expect("study median diff", STUDY[65] - STUDY[10], EXPECTED_BY_HAND.study_diff, { tol: 0 });

  const caseVis = (icon, t) => `<div class="case"><b>${icon}</b>${t}</div>`;
  // Two groups saw anchors 10 and 65; bars grow from 0 to each group's median estimate.
  function wheelBars(node) {
    const box = document.createElement("div");
    box.className = "rows";
    node.appendChild(box);
    const bs = [10, 65].map((a) => { const e = document.createElement("div"); box.appendChild(e); return [a, LTT.bar(e, [{ color: a === 10 ? "var(--ltt-on)" : "var(--ltt-alt)" }, { color: "transparent" }])]; });
    bs.forEach(([, b]) => b.set([0, 100]));
    setTimeout(() => bs.forEach(([a, b]) => b.set([STUDY[a], 100 - STUDY[a]], [`바퀴 ${a} → ${STUDY[a]}%`, ""])), 400);
  }
  // Weeks 1..12: blue up to the smaller of anchor/own, red over the gap where the anchor can pull.
  function weeks(anc, own) {
    return (node) => {
      const w = document.createElement("div");
      w.className = "wk";
      node.appendChild(w);
      const u = document.createElement("div");
      w.appendChild(u);
      const g = LTT.units(u, 12, 12);
      w.insertAdjacentHTML("beforeend", `<small>먼저 들은 숫자 ${anc}주 · 내 독립 추정 ${own}주 · 끌림 구간 ${gap(anc, own)}주</small>`);
      setTimeout(() => g.paint(Math.min(anc, own), "on", gap(anc, own)), 300);
    };
  }

  LTT.deck({
    title: "처음 본 숫자가 내 추정을 끌어당길까?",
    scenes: [
      { type: "hook", art: "⚓",
        text: "\"2주면 되지?\"<br>이 한마디가 내 견적을 <u>2주 쪽으로</u> 끌어당긴다.",
        sub: "견적·일정을 추정할 때 누가 먼저 숫자를 말했는지가 결과를 바꾼다. 아는 것만으로는 막기 어려워 절차로 막는다." },

      { type: "explain", kicker: "원리", title: "출발점에서 덜 움직인다",
        steps: [
          { icon: "👂", title: "숫자를 본다", text: "질문과 무관한 숫자라도 먼저 보면 머릿속 출발점이 된다." },
          { icon: "↕️", title: "거기서 조정", text: "\"그보다는 높겠지\"처럼 출발점에서 위아래로 움직여 답을 찾는다." },
          { icon: "🛑", title: "덜 간 채 멈춤", text: "그럴듯한 범위에 들어오면 멈춰서 답이 출발점 쪽에 치우친다." },
        ],
        basis: "Tversky & Kahneman 1974의 '앵커링과 조정' 설명. 조정 부족 외에 앵커가 관련 정보를 먼저 떠올리게 한다는 설명(선택적 접근성)도 있다." },

      { type: "compare", kicker: "연구 사례", title: "무관한 숫자에도 판단이 끌려갔다",
        reveal: false,
        items: [
          { label: "조작된 행운의 바퀴", visual: wheelBars, tone: "bad", verdict: "중앙값 20%p 차이",
            note: "UN 중 아프리카 국가 비율 추정. 바퀴는 10 또는 65만 나왔다(Tversky & Kahneman 1974)." },
          { label: "판사와 주사위", visual: caseVis("🎲⚖️", "형량을 정하기 전 주사위를 굴린 판사들"), tone: "bad", verdict: "높은 눈 → 더 긴 형량",
            note: "조작된 주사위. 경력 판사도 끌렸다(Englich 외 2006)." },
          { label: "부동산 중개인", visual: caseVis("🏠📄", "같은 집, 다른 매도 희망가 서류"), tone: "bad", verdict: "희망가 따라 감정가 이동",
            note: "본인들은 참고 안 했다고 답했다(Northcraft & Neale 1987)." },
        ],
        basis: "수치는 바퀴 연구의 논문 보고값(집단 중앙값)만 실었다. 나머지 두 연구는 방향만 적었다. 한 사람의 값으로는 효과를 확인할 수 없다." },

      { type: "compare", kicker: "내 작업에서", title: "일정 견적에서 끌림이 생기는 구간",
        sub: "독립 추정 6주인 사람이 먼저 다른 숫자를 들었을 때. 빨간 칸이 끌려갈 수 있는 구간이다.",
        reveal: false,
        items: [
          { label: "낮은 앵커 \"2주면 되지?\"", visual: weeks(2, 6), tone: "bad", verdict: "낮은 쪽으로 끌림" },
          { label: "높은 앵커 \"12주는 걸리겠죠\"", visual: weeks(12, 6), tone: "warn", verdict: "높은 쪽으로 끌림" },
          { label: "같은 값", visual: weeks(6, 6), tone: "good", verdict: "끌림이 있어도 안 보임",
            note: "그래서 숫자를 보기 전에 독립 추정을 먼저 받아야 구분된다." },
        ],
        basis: "끌림의 크기는 사람과 과제마다 달라 싣지 않고 방향과 구간만 보인다." },

      { type: "explain", kicker: "실전 절차", title: "순서로 막는다", arrows: true,
        steps: [
          { icon: "✍️", title: "먼저 적기", text: "숫자를 보기 전에 각자 낙관·보통·비관 세 값을 적는다." },
          { icon: "🙈", title: "숫자 늦게 공개", text: "기존 견적·희망 마감은 독립 추정을 모은 뒤 보여 준다." },
          { icon: "🏷️", title: "근거와 함께", text: "첫 숫자를 줄 때는 \"참고값\"이라 부르고 출처를 붙인다." },
        ],
        basis: "앵커는 무작위 숫자여도 작동한다. 그럴듯한 근거가 붙은 숫자가 틀렸는지는 따로 확인해야 한다." },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "앵커링 효과", en: "anchoring effect" }, { ko: "조정 부족", en: "insufficient adjustment" }],
        signals: ["누군가 견적·일정·가격을 먼저 말한 뒤 추정해야 할 때", "회의에서 첫 발언자의 숫자로 수렴할 때", "협상에서 첫 제시가를 정할 때"],
        queries: ["anchoring and adjustment Tversky Kahneman 1974", "anchoring effect expert judges dice", "planning poker independent estimates", "wideband delphi estimation"],
        neighbors: [
          { term: "계획 오류", diff: "자기 일정을 체계적으로 낙관하는 것. 앵커 없이도 생긴다." },
          { term: "프레이밍 효과", diff: "같은 정보를 다르게 표현해 선택이 바뀌는 것. 숫자 출발점이 아니라 표현 방식." },
        ] },
    ],
  });
</script>
</body>
</html>
