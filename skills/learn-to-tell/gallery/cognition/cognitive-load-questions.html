<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조건을 한꺼번에 묻는 질문은 왜 틀리게 만들까?</title>
<script type="application/json" id="ltt-meta">{"domain":"인지과학","topic":"작업 기억 한계와 질문의 인지 부하","audience":"사용자에게 질문하거나 질문을 받아 본 적이 있다","pattern":["hook","explain","compare","keywords"],"mode":"설명형: 읽는 사람 자신의 작업 기억을 시험하는 체험은 답이 뻔해 실패하므로, 질문 다시 쓰기 사례와 연구 근거로 보여 준다","decision":"한 질문에 동시에 담을 조건 수와, 질문을 몇 단계로 쪼갤지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --ltt-on: #4f6bed; --ltt-alt: #d6455d; }
  .q { font-size: 14px; line-height: 1.5; background: var(--ltt-bg); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
  .slots { width: 100%; } .slots .ltt-units { max-width: none; }
  .slots .ltt-unit { aspect-ratio: 1.6; }
  .slots .ltt-unit:nth-child(n+5) { outline: 2px dashed var(--ltt-line); outline-offset: -2px; background: transparent; }
  .slots .ltt-unit.alt:nth-child(n+5) { background: var(--ltt-alt); outline: 0; }
  .vis { flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<script>
  // Hand-computed from the model in the text: hold = ceil(n/steps) + (steps>1 ? 1 : 0); overflow = max(0, hold - 4).
  const EXPECTED_BY_HAND = [
    { n: 6, s: 1, hold: 6, over: 2 },
    { n: 6, s: 2, hold: 4, over: 0 },
    { n: 6, s: 3, hold: 3, over: 0 },
    { n: 8, s: 2, hold: 5, over: 1 },
    { n: 8, s: 4, hold: 3, over: 0 },
    { n: 4, s: 1, hold: 4, over: 0 },
    { n: 1, s: 1, hold: 1, over: 0 },
  ];
  const CAP = 4;
  const hold = (n, s) => Math.ceil(n / s) + (s > 1 ? 1 : 0);
  const over = (n, s) => Math.max(0, hold(n, s) - CAP);
  EXPECTED_BY_HAND.forEach((e) => {
    LTT.expect(`hold n=${e.n} s=${e.s}`, hold(e.n, e.s), e.hold, { tol: 0 });
    LTT.expect(`over n=${e.n} s=${e.s}`, over(e.n, e.s), e.over, { tol: 0 });
  });

  // Eight slots: the first four (solid) approximate working-memory capacity, the dashed rest are outside it.
  const rewrite = (label, q, n, s, tone, note) => ({
    label, tone, note, noteAfter: true,
    verdict: over(n, s) ? `동시에 ${hold(n, s)}개 · ${over(n, s)}개 넘침` : `동시에 ${hold(n, s)}개 · 한계 안`,
    visual: (node) => {
      node.innerHTML = `<div class="q">${q}</div><div class="slots"><div></div></div>`;
      const u = LTT.units(node.querySelector(".slots div"), 8, 8);
      setTimeout(() => u.paint(Math.min(hold(n, s), CAP), "on", over(n, s)), 300);
    },
  });
  const scene = (icon, t) => `<div class="q" style="text-align:center"><div style="font-size:30px">${icon}</div>${t}</div>`;

  LTT.deck({
    title: "조건을 한꺼번에 묻는 질문은 왜 틀리게 만들까?",
    scenes: [
      { type: "hook", art: "🧠",
        text: "조건 여섯 개를 한 문장에 담은 질문은<br>답하는 사람이 <u>몇 개를 놓친 채</u> 답하게 만든다.",
        sub: "사용자에게(또는 agent에게) 조건이 여러 개인 결정을 물을 때, 한 번에 담을 조건 수와 쪼갤 단계를 정한다." },

      { type: "explain", kicker: "원리", title: "머릿속 작업대에는 네 칸 정도만 있다",
        steps: [
          { icon: "📥", title: "조건을 읽는다", text: "답하려면 조건을 모두 동시에 들고 있어야 한다." },
          { icon: "🗃️", title: "약 4덩어리 한계", text: "연습·묶기를 막으면 작업 기억은 대략 4개 안팎의 덩어리만 유지한다(Cowan 2001)." },
          { icon: "🫳", title: "넘치면 놓친다", text: "넘친 조건은 빠지거나 다른 조건과 섞인 채 답이 나온다." },
        ],
        basis: "4는 과제에 따라 달라지는 근사값이다. 조건끼리 묶이면(chunk) 더 많이 유지된다. 오답률의 크기는 과제마다 달라 숫자로 싣지 않는다." },

      { type: "compare", kicker: "질문 다시 쓰기", title: "같은 결정을 묻는 네 가지 질문",
        sub: "실선 4칸 = 작업 기억 한계 근사, 점선 칸은 한계 밖. 단계마다 앞 단계 결과 1개를 더 들고 간다고 단순화했다.",
        reveal: false,
        items: [
          rewrite("원문: 한 문장에 전부", "30일 보관, 암호화 필수, 국내 리전, 월 20만 원 이하, 3명 운영, 기존 S3 유지 — 어떤 저장 방식이 좋은가?", 6, 1, "bad", "조건 6개를 한꺼번에 들고 답해야 한다."),
          rewrite("2단계로 분할", "① 정책 조건(30일·암호화·국내)만 묻고 ② 답을 받은 뒤 운영 조건(비용·인원·S3)을 묻는다.", 6, 2, "warn", "한계에 딱 맞음. 조건 간 상호작용(내재 부하)은 그대로다."),
          rewrite("3단계 + 일부는 agent가", "기존 S3 계속 사용? → 보관 기간? → 비용 상한? 나머지는 제가 확인합니다.", 6, 3, "good", "동시에 2개 + 앞 결과 1개."),
          rewrite("선택지 추가", "보관 기간은? [7일] [30일] [90일]", 6, 3, "good", "칸 수는 같지만 답을 만들던 일이 고르는 일로 바뀐다. 이 이득은 칸으로 표현되지 않는다."),
        ],
        basis: "모델로 계산한 예시: 동시 유지 = ⌈조건 수 / 단계 수⌉ + (단계 > 1이면 1). '앞 단계 결과 1개'는 이 페이지의 단순화 가정이다(불확실)." },

      { type: "explain", kicker: "무엇을 줄일 수 있나", title: "질문을 고쳐 쓰면 '외재 부하'만 준다",
        steps: [
          { icon: "🧩", title: "내재 부하", text: "조건끼리 얽힌 정도. 내용 자체라 쪼개도 사라지지 않는다." },
          { icon: "🧾", title: "외재 부하", text: "한 문장에 몰아 쓰기, 열린 질문처럼 제시 방식이 만드는 부하. 고쳐 쓰면 준다." },
          { icon: "🧑‍🎓", title: "숙련도", text: "익숙한 사람은 묶인 조건을 한 덩어리로 들고 간다. 같은 질문도 사람마다 부하가 다르다." },
        ],
        basis: "Sweller의 인지 부하 이론 구분." },

      { type: "compare", kicker: "자주 보는 장면", title: "어디서 같은 문제가 생길까?",
        revealLabel: "고치는 방향 보기",
        items: [
          { label: "회원가입 폼 한 페이지", visual: scene("📝", "필드 15개, 오류는 제출 후 한꺼번에"), tone: "warn", verdict: "단계형 + 즉시 오류 표시", noteAfter: true, note: "오류 여러 개를 동시에 기억하며 고치게 하지 않는다." },
          { label: "agent에게 요구사항 한 문단", visual: scene("🤖", "제약 8개를 쉼표로 이어 쓴 프롬프트"), tone: "warn", verdict: "번호 목록 + 확인 질문", noteAfter: true, note: "목록으로 쓰면 빠진 조건이 눈에 보인다." },
          { label: "quick survey", visual: scene("❓", "\"예산·일정·인원·기술 스택은?\""), tone: "warn", verdict: "하나씩 + 선택지", noteAfter: true, note: "답한 내용을 다음 질문에 반영해 묻는다." },
        ] },

      { type: "explain", kicker: "주의", title: "쪼개기에도 비용이 있다",
        steps: [
          { icon: "🔪", title: "너무 잘게", text: "단계가 많으면 앞 단계 맥락을 계속 들고 가야 해서 오히려 늘 수 있다." },
          { icon: "🔗", title: "얽힌 조건", text: "서로 영향을 주는 조건을 따로 물으면 나중에 충돌이 드러난다. 함께 묻고 표로 보여 준다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "작업 기억 용량", en: "working memory capacity" }, { ko: "인지 부하", en: "cognitive load (intrinsic / extraneous)" }],
        signals: ["질문 하나에 조건이 4개를 넘을 때", "\"제가 말한 조건 하나를 빠뜨렸네요\"가 반복될 때", "폼·설문·프롬프트를 한 번에 길게 쓰고 있을 때"],
        queries: ["Cowan 2001 magical number 4", "cognitive load theory intrinsic extraneous", "multi-step form vs single page", "chunking working memory"],
        neighbors: [
          { term: "Miller의 7±2", diff: "더 오래된 추정. 묶기를 막으면 4 안팎이라는 것이 Cowan의 수정." },
          { term: "Hick 법칙", diff: "선택지 수와 고르는 시간. 동시에 들고 있어야 할 조건 수와는 다르다." },
        ] },
    ],
  });
</script>
</body>
</html>
