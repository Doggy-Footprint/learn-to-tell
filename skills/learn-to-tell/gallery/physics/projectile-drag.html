<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공기저항이 있으면 가장 멀리 날아가는 각도는 얼마나 낮아질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"물리학","topic":"공기저항이 있는 투사체의 최대 사거리 각도","audience":"등가속도 운동과 sin2θ 사거리 공식을 알고 있다","pattern":["hook","explain","predict","sim","compare","explain","keywords"],"mode":"체험형: 항력의 뜻을 먼저 보이고 최적각을 짐작한 뒤 사거리 막대로 답을 보이고 진공과 항력 궤적을 나란히 날려 보고 속력별 사례를 비교한다","decision":"공기저항을 무시해도 되는지, 최대 사거리 각도를 45°로 둘 수 있는지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --vac: #8a93ab; --drag: #d6455d; }
  .scene { max-height: 29vh; }
  .facts { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: var(--ltt-muted); }
  .facts b { font-size: 26px; color: var(--ltt-ink); font-variant-numeric: tabular-nums; }
  .traj path { fill: none; stroke-width: 2.5; }
  .pk { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: center; font-size: 13px; margin: 2px 0; }
</style>
</head>
<body>
<script>
  const EXPECTED_BY_HAND = {
    g: 9.81,
    vac45: 1600 / 9.81,                    // 163.0989 m
    vac30: 1600 * Math.sin(Math.PI / 3) / 9.81,  // sin60 = 0.8660254 -> 141.2478 m
    vac20: 1600 * Math.sin(2 * Math.PI / 9) / 9.81,
    convTol: 0.001,                        // m, |R(dt) - R(dt/2)|
  };
  // MODEL-BEGIN
  const G = 9.81, MASS = 0.145, DIAM = 0.0732, CD = 0.35, RHO = 1.2;
  const K = 0.5 * RHO * CD * Math.PI * (DIAM / 2) ** 2 / MASS;   // a_drag = K v |v|, 단위 1/m
  const rad = (d) => d * Math.PI / 180;
  const vacRange = (v, deg) => v * v * Math.sin(2 * rad(deg)) / G;
  const deriv = (s, k) => { const v = Math.hypot(s[2], s[3]); return [s[2], s[3], -k * v * s[2], -G - k * v * s[3]]; };
  function rk4(s, dt, k) {
    const add = (a, b, h) => a.map((x, i) => x + h * b[i]);
    const k1 = deriv(s, k), k2 = deriv(add(s, k1, dt / 2), k), k3 = deriv(add(s, k2, dt / 2), k), k4 = deriv(add(s, k3, dt), k);
    return s.map((x, i) => x + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  }
  function path(v, deg, k, dt) {
    let s = [0, 0, v * Math.cos(rad(deg)), v * Math.sin(rad(deg))];
    const pts = [[0, 0]];
    for (let i = 0; i < 1e6; i++) {
      const n = rk4(s, dt, k);
      if (n[1] < 0) { pts.push([s[0] + (n[0] - s[0]) * s[1] / (s[1] - n[1]), 0]); return pts; }
      s = n; pts.push([s[0], s[1]]);
    }
    return pts;
  }
  const range = (v, deg, k, dt) => path(v, deg, k, dt).at(-1)[0];
  function bestAngle(v, k, dt) {
    let best = 0, br = -1;
    for (let a = 5; a <= 85; a += 1) { const r = range(v, a, k, dt); if (r > br) { br = r; best = a; } }
    let lo = best - 1, hi = best + 1;     // range(angle)는 봉우리 하나라 황금분할 탐색이 수렴한다
    const phi = (Math.sqrt(5) - 1) / 2;
    let c = hi - phi * (hi - lo), d = lo + phi * (hi - lo);
    for (let i = 0; i < 30; i++) {
      if (range(v, c, k, dt) > range(v, d, k, dt)) hi = d; else lo = c;
      c = hi - phi * (hi - lo); d = lo + phi * (hi - lo);
    }
    return (lo + hi) / 2;
  }
  // MODEL-END
  const near = (a, b) => Math.abs(a - b);
  LTT.expect("진공 45° 사거리 (손계산 163.099 m)", vacRange(40, 45), EXPECTED_BY_HAND.vac45, { tol: 1e-9 });
  LTT.expect("진공 30° 사거리 (손계산 141.248 m)", vacRange(40, 30), EXPECTED_BY_HAND.vac30, { tol: 1e-9 });
  LTT.expect("Cd=0 수치 사거리 = 진공 45°", range(40, 45, 0, 1 / 200), EXPECTED_BY_HAND.vac45, { tol: EXPECTED_BY_HAND.convTol });
  LTT.expect("Cd=0 수치 사거리 = 진공 20°", range(40, 20, 0, 1 / 200), EXPECTED_BY_HAND.vac20, { tol: EXPECTED_BY_HAND.convTol });
  [30, 45, 60].forEach((a) => LTT.expect("dt 절반 수렴 " + a + "°", near(range(40, a, K, 1 / 200), range(40, a, K, 1 / 400)), 0, { tol: EXPECTED_BY_HAND.convTol }));

  const DT = 1 / 200, f0 = d3.format(".0f"), f1 = d3.format(".1f");
  const best40 = bestAngle(40, K, DT), loss = (v, a) => 1 - range(v, a, K, DT) / vacRange(v, 45);
  const SRC = "야구공 질량 145 g, 지름 7.3 cm(MLB 규격 142–149 g, 지름 7.3–7.5 cm), 공기밀도 1.2 kg/m³(해수면 약 20 °C), Cd 0.35(야구공 Cd는 대략 0.3–0.5로 알려져 있고 속도·실밥에 따라 변한다, 기억 기반 값이라 불확실). 던지는 높이 0 m, 바람 0. 항력 사거리는 dt를 절반으로 줄여 수렴만 확인했고 절대 정확도는 검증하지 않았다.";

  // 진공(점선)과 항력(실선) 궤적. 축척은 진공 45° 사거리에 맞춰 각도를 바꿔도 축이 고정된다.
  function traj(node, v, VW = 300, VH = 130) {
    const sc = (VW - 20) / (v * v / G * 1.02), px = (p) => [10 + p[0] * sc, VH - 10 - p[1] * sc];
    const s = d3.select(node).append("svg").attr("class", "traj ltt-svg").attr("viewBox", `0 0 ${VW} ${VH}`);
    s.append("line").attr("x1", 0).attr("x2", VW).attr("y1", VH - 10).attr("y2", VH - 10).attr("stroke", "var(--ltt-line)").attr("stroke-width", 3);
    const pv = s.append("path").attr("stroke", "var(--vac)").attr("stroke-dasharray", "6 5");
    const pd = s.append("path").attr("stroke", "var(--drag)");
    const dv = s.append("circle").attr("r", 5).attr("fill", "var(--vac)"), dd = s.append("circle").attr("r", 5).attr("fill", "var(--drag)");
    const set = (vac, drag) => {
      pv.attr("d", d3.line()(vac.map(px))); pd.attr("d", d3.line()(drag.map(px)));
      const a = px(vac.at(-1)), b = px(drag.at(-1));
      dv.attr("cx", a[0]).attr("cy", a[1]); dd.attr("cx", b[0]).attr("cy", b[1]);
    };
    return { svg: s, set };
  }
  const vacPath = (v, a, n = 80) => { const T = 2 * v * Math.sin(rad(a)) / G; return d3.range(n + 1).map((i) => { const t = T * i / n; return [v * Math.cos(rad(a)) * t, Math.max(0, v * Math.sin(rad(a)) * t - G * t * t / 2)]; }); };

  LTT.deck({
    title: "공기저항이 있으면 가장 멀리 날아가는 각도는 얼마나 낮아질까?",
    scenes: [
      { type: "hook", art: "⚾",
        text: "교과서의 답은 45°.<br>그런데 그건 <u>공기가 없을 때</u>다.",
        sub: "공을 가장 멀리 보낼 발사각을 정할 때, 공기저항을 무시해도 되는지 판단하는 이야기." },

      { type: "explain", kicker: "용어", title: "공기저항(항력)이 하는 일", arrows: false,
        steps: [
          { icon: "💨", title: "항력", text: "공이 나아가는 반대 방향으로 미는 힘. 속력의 제곱에 비례해 빠를수록 급격히 커진다." },
          { icon: "📐", title: "진공의 45°", text: "공기가 없으면 R = v² sin 2θ / g 라서 45°에서 가장 멀리 간다." },
          { icon: "⏱️", title: "높이 던지면", text: "공중에 오래 머문다. 그동안 항력이 계속 속도를 깎는다." },
        ] },

      { type: "predict", kicker: "짐작해 보기", title: "40 m/s로 던진 야구공, 가장 멀리 가는 각도는?",
        sub: "지면에서 던진다. 진공이면 R = v² sin 2θ / g 라서 45°다.",
        question: "야구공을 40 m/s로 던질 때 공기저항이 있으면 최대 사거리 각도는?",
        choices: [{ id: "45", text: "45° 그대로" }, { id: "41", text: "약 41°" }, { id: "35", text: "약 35°" }, { id: "28", text: "약 28°" }],
        answer: "41",
        answerVisual(node) {
          node.innerHTML = [["진공 · 45°", vacRange(40, 45), "#9aa1b5"], [`항력 · ${f1(best40)}°`, range(40, best40, K, DT), "var(--drag)"]]
            .map(([l, r]) => `<div class="pk"><span>${l} · ${f0(r)} m</span><div></div></div>`).join("");
          const top = vacRange(40, 45), cols = ["#9aa1b5", "var(--drag)"], rs = [top, range(40, best40, K, DT)];
          node.querySelectorAll(".pk > div").forEach((d, i) => setTimeout(() => LTT.bar(d, [{ color: cols[i] }, { color: "transparent" }]).set([rs[i], top - rs[i]], ["", ""]), 100 + 400 * i));
        },
        why: `약 <b>${f1(best40)}°</b>. 각도는 몇 도만 내려가지만 사거리는 진공 ${f0(vacRange(40, 45))} m에서 ${f0(range(40, best40, K, DT))} m로 <b>${f0(loss(40, best40) * 100)}%</b> 줄어든다. 각도보다 거리가 훨씬 크게 틀린다. <span class="ltt-tag">모델로 계산한 예시</span>` },

      { kicker: "날려 보기", title: "같은 공, 공기가 있을 때와 없을 때",
        sub: "점선 = 진공, 빨간 선 = 항력 있음. 항력 궤적은 내려올 때 더 가파르다.",
        mount: (body) => {
          body.innerHTML = `<div class="dk-actions"><button data-a="45">45°로 던지기</button><button data-a="best" class="ghost">${f1(best40)}°로 던지기</button></div><div></div>
            <div class="facts"><span>진공 <b id="rv">-</b> m</span><span style="color:var(--drag)">항력 <b id="rd">-</b> m</span><span class="ltt-tag">모델로 계산한 예시</span></div>`;
          const tr = traj(body.children[1], 40, 880, 360);
          tr.svg.classed("scene", true);
          let sim;
          const throwAt = (a) => {
            body.querySelectorAll("[data-a]").forEach((b) => b.classList.toggle("ghost", (b.dataset.a === "best" ? best40 : 45) !== a));
            const vac = vacPath(40, a, 400), drag = path(40, a, K, DT), h = 2 * 40 * Math.sin(rad(a)) / G / 400;
            const j = (i) => Math.min(drag.length - 1, Math.round(i * h / DT)), n = Math.max(400, Math.ceil(drag.length * DT / h));
            LTT.$("rv").textContent = "-"; LTT.$("rd").textContent = "-";
            if (sim) sim.stop();
            sim = LTT.sim({ dt: h, speed: 1.4, init: () => 0, step: (i) => i + 1, until: (i) => i >= n - 1,
              draw: (i) => tr.set(vac.slice(0, Math.min(i, 400) + 1), drag.slice(0, j(i) + 1)),
              onEnd: () => { LTT.tween("rv", vacRange(40, a), f1); LTT.tween("rd", drag.at(-1)[0], f1); } });
            sim.start();
          };
          body.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => throwAt(b.dataset.a === "best" ? best40 : 45));
          return { enter: () => throwAt(45), leave: () => sim && sim.stop() };
        },
        tex: "F_{\\text{drag}}=\\tfrac12\\rho C_d A v^2,\\qquad R_{\\text{진공}}=\\frac{v^2\\sin 2\\theta}{g}",
        basis: "두 공은 같은 시간 축으로 움직인다. " + SRC },

      { type: "compare", kicker: "속력별", title: "공이 빠를수록 무엇이 달라지나",
        sub: "각 속력에서 그 속력의 최적각으로 던졌다. 축척은 카드마다 진공 45° 사거리 기준.",
        items: [15, 30, 45].map((v, i) => {
          const a = bestAngle(v, K, DT);
          return { label: ["캐치볼 15 m/s", "외야 송구 30 m/s", "최고 구속급 45 m/s"][i],
            visual: (n) => traj(n, v).set(vacPath(v, 45), path(v, a, K, DT)),
            tone: ["good", "warn", "bad"][i],
            verdict: `최적 ${f1(a)}° · 사거리 −${f0(loss(v, a) * 100)}%`,
            note: i === 2 ? "45 m/s는 약 100 mph(44.7 m/s) 직구 수준." : "" };
        }),
        basis: "모델로 계산한 예시. 사거리 감소는 진공 45° 대비. " + SRC },

      { type: "explain", kicker: "주의", title: "45°가 틀리는 다른 이유들", arrows: false,
        steps: [
          { icon: "🏔️", title: "높은 곳에서 던지면", text: "항력이 없어도 최적각이 45°보다 낮다(포환던지기 등)." },
          { icon: "🌀", title: "회전과 바람", text: "이 모델은 마그누스 힘, 바람, 속도에 따라 변하는 Cd를 무시한다. 실제 홈런 비거리와 다를 수 있다." },
          { icon: "🐌", title: "느린 공", text: "캐치볼처럼 느리면 45°에 가깝다. 항력은 속력의 제곱으로 커진다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "이차 항력", en: "quadratic drag" },
          { ko: "항력 계수", en: "drag coefficient Cd" },
          { ko: "최적 발사각", en: "optimal launch angle" },
        ],
        signals: [
          "포물선 공식으로 거리를 계산했는데 실제와 크게 다를 때",
          "빠르거나 가벼운 물체의 궤적을 예측해야 할 때",
          "'45°가 최적'이라는 말을 그대로 쓰려 할 때",
        ],
        queries: ["projectile motion quadratic drag optimal angle", "baseball drag coefficient", "terminal velocity drag force 1/2 rho Cd A v^2", "Magnus effect baseball trajectory", "launch angle from height optimal"],
        neighbors: [
          { term: "선형 항력", diff: "속도에 비례하는 저항. 아주 느리거나 작은 물체(점성 영역)에 맞는다." },
          { term: "종단 속도", diff: "항력이 중력과 같아져 더 빨라지지 않는 속도. 낙하 문제에서 만난다." },
        ] },
    ],
  });
</script>
</body>
</html>
