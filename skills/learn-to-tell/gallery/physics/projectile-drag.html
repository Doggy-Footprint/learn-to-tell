<script>
  const EXPECTED_BY_HAND = {

    vac20: 1600 * Math.sin(2 * Math.PI / 9) / 9.81,

  const G = 9.81, MASS = 0.145, DIAM = 0.0732, CD = 0.35, RHO = 1.2;
  const K = 0.5 * RHO * CD * Math.PI * (DIAM / 2) ** 2 / MASS;   // a_drag = K v |v|, 단위 1/m
  const rad = (d) => d * Math.PI / 180;

  const deriv = (s, k) => { const v = Math.hypot(s[2], s[3]); return [s[2], s[3], -k * v * s[2], -G - k * v * s[3]]; };
  function rk4(s, dt, k) {
    const add = (a, b, h) => a.map((x, i) => x + h * b[i]);
    const k1 = deriv(s, k), k2 = deriv(add(s, k1, dt / 2), k), k3 = deriv(add(s, k2, dt / 2), k), k4 = deriv(add(s, k3, dt), k);
    return s.map((x, i) => x + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  }
  function path(v, deg, k, dt) {
    let s = [0, 0, v * Math.cos(rad(deg)), v * Math.sin(rad(deg))];
    const pts = [[0, 0]];
    for (let i = 0; i < 1e6; i++) {
      const n = rk4(s, dt, k);
      if (n[1] < 0) { pts.push([s[0] + (n[0] - s[0]) * s[1] / (s[1] - n[1]), 0]); return pts; }
      s = n; pts.push([s[0], s[1]]);

  }
  const range = (v, deg, k, dt) => path(v, deg, k, dt).at(-1)[0];

    let best = 0, br = -1;
    for (let a = 5; a <= 85; a += 1) { const r = range(v, a, k, dt); if (r > br) { br = r; best = a; } }

  [30, 45, 60].forEach((a) => LTT.expect("dt 절반 수렴 " + a + "°", near(range(40, a, K, 1 / 200), range(40, a, K, 1 / 400)), 0, { tol: EXPECTED_BY_HAND.convTol }));

  const SRC = "야구공 질량 145 g, 지름 7.3 cm(MLB 규격 142–149 g, 지름 7.3–7.5 cm), 공기밀도 1.2 kg/m³(해수면 약 20 °C), Cd 0.35(야구공 Cd는 대략 0.3–0.5로 알려져 있고 속도·실밥에 따라 변한다, 기억 기반 값이라 불확실). 던지는 높이 0 m, 바람 0. 항력 사거리는 계산 시간 간격(dt)을 절반으로 줄여도 결과가 거의 같은지만 확인했고 절대 정확도는 검증하지 않았다.";

  // 진공(점선)과 항력(실선) 궤적. 축척은 진공 45° 사거리에 맞춰 각도를 바꿔도 축이 고정되고, x·y 축척이 같아 궤적 모양이 실제와 같다.
  function traj(node, v, VW = 560, VH = 180) {

    const xt = d3.ticks(0, xmax, 6), yt = d3.ticks(0, ymax, 3), g = s.append("g").attr("class", "tk");

    s.append("path").attr("d", `M${M.l},${M.t}V${VH - M.b}H${VW - M.r}`).style("stroke", "var(--ltt-ink-2)").attr("stroke-width", 1.5).attr("fill", "none");

  }

    glossary: {

    },
    scenes: [
      { type: "hook", art: "ball", kicker: "공을 가장 멀리 보내는 각도 정하기",
        pre: "교과서의 답은 45°.",
        text: "그런데 그건<br><u>공기가 없을 때</u>의 답이다.",
        sub: "실제 공은 공기를 밀고 나가며 속도를 잃는다. 이 수업을 마치면 공기저항이 최적 각도와 거리를 얼마나 바꾸는지, 언제 무시해도 되는지 말할 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [

          { key: "항력", en: "drag", icon: "wind", plain: "공이 공기를 밀고 나갈 때 진행 반대 방향으로 받는 힘. 속력의 제곱에 비례해, 2배 빠르면 4배 세다.", example: "손을 차창 밖으로 내밀면 빠를수록 세게 밀린다." },

      { type: "explain", form: "strip", kicker: "원리", title: "항력이 있으면 왜 낮게 던져야 할까", en: "Why lower",

        ],

            visual: (n) => traj(n, v).set(vacPath(v, 45), path(v, a, K, DT)),
