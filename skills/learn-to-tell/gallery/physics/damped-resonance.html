<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감쇠를 줄이면 공진 피크는 어떻게 변할까?</title>
<script type="application/json" id="ltt-meta">{"domain":"물리학","topic":"감쇠비와 강제 진동의 공진 피크","audience":"질량-스프링의 고유진동수 ω0를 알고 있다","pattern":["hook","sim","predict","compare","explain","keywords"],"mode":"체험형: 같은 힘으로 흔든 질량-스프링이 감쇠비마다 얼마나 커지는지 시뮬레이션으로 보고 피크 모양을 예측한다","decision":"구조물이나 장치의 감쇠를 얼마나 둘지, 구동 주파수가 고유진동수에 가까울 때 얼마나 위험한지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .scene { max-height: 30vh; }
  .facts { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: var(--ltt-muted); }
  .facts b { font-size: 28px; color: var(--ltt-ink); font-variant-numeric: tabular-nums; }
  .curve { max-height: 38vh; }
  .curve path.c { fill: none; stroke-width: 2.5; }
  .tac { font-size: 54px; text-align: center; }
  @media (max-width: 720px) { .dk-pred .ltt-choices { grid-template-columns: 1fr 1fr; } .tac { font-size: 32px; white-space: nowrap; } .dk-cmp > .dk-item:nth-child(3):last-child { grid-column: 1 / -1; } }
</style>
</head>
<body>
<script>
  const EXPECTED_BY_HAND = {
    r1_z01: 5,                 // 1/(2*0.1)
    r0: 1,                     // (w0^2)/(w0^2)
    r05_z01: 1.32164,          // 1/sqrt(0.75^2+0.1^2) = 1/0.756637
    peak_z005: 10.01252,       // 1/(0.1*sqrt(0.9975))
    peak_z02: 2.55155,         // 1/(0.4*sqrt(0.96))
    rpk_z02: 0.959166,         // sqrt(1-0.08)
    sim_r05_z02: 1.28830,      // 1/sqrt(0.75^2+0.2^2)
    sim_r1_z05: 1,             // 1/(2*0.5)
  };
  // MODEL-BEGIN
  const W0 = 2 * Math.PI, AS = 10;             // rad/s, mm
  const gain = (r, z) => 1 / Math.sqrt((1 - r * r) ** 2 + (2 * z * r) ** 2);
  const peakR = (z) => (z < Math.SQRT1_2 ? Math.sqrt(1 - 2 * z * z) : 0);
  const peakGain = (z) => (z < Math.SQRT1_2 ? 1 / (2 * z * Math.sqrt(1 - z * z)) : 1);
  const cfg = { z: 0.2, r: 1 };
  function accel(x, v, t) { return -2 * cfg.z * W0 * v - W0 * W0 * x + W0 * W0 * AS * Math.cos(cfg.r * W0 * t); }
  function rk4(s, t, dt) {
    const f = (x, v, tt) => [v, accel(x, v, tt)];
    const a = f(s[0], s[1], t), b = f(s[0] + dt / 2 * a[0], s[1] + dt / 2 * a[1], t + dt / 2);
    const c = f(s[0] + dt / 2 * b[0], s[1] + dt / 2 * b[1], t + dt / 2), d = f(s[0] + dt * c[0], s[1] + dt * c[1], t + dt);
    return [s[0] + dt / 6 * (a[0] + 2 * b[0] + 2 * c[0] + d[0]), s[1] + dt / 6 * (a[1] + 2 * b[1] + 2 * c[1] + d[1])];
  }
  const T_END = 40;
  const initState = () => ({ s: [0, 0], pk: 0, last: 0, tp: 0 });
  function stepState(st, dt, t) {
    const s = rk4(st.s, t, dt), P = 2 * Math.PI / (cfg.r * W0);
    let pk = Math.max(st.pk, Math.abs(s[0])), last = st.last, tp = st.tp;
    if (t + dt - tp >= P) { last = pk; pk = 0; tp = t + dt; }
    return { s, pk, last, tp };
  }
  // MODEL-END
  const E = EXPECTED_BY_HAND;
  LTT.expect("r=1, ζ=0.1 → 5배", gain(1, 0.1), E.r1_z01, { tol: 1e-9 });
  LTT.expect("r=0 → 1배", gain(0, 0.3), E.r0, { tol: 1e-9 });
  LTT.expect("r=0.5, ζ=0.1 → 1.32164배", gain(0.5, 0.1), E.r05_z01, { tol: 1e-4 });
  LTT.expect("피크 ζ=0.05 → 10.0125배", peakGain(0.05), E.peak_z005, { tol: 1e-4 });
  LTT.expect("피크 ζ=0.2 → 2.55155배", peakGain(0.2), E.peak_z02, { tol: 1e-4 });
  LTT.expect("피크 위치 ζ=0.2 → 0.959166", peakR(0.2), E.rpk_z02, { tol: 1e-5 });
  LTT.expect("피크 공식과 gain 일치(ζ=0.2)", gain(peakR(0.2), 0.2), peakGain(0.2), { tol: 1e-9 });
  function simAmp(z, r) {
    const keep = { ...cfg }; cfg.z = z; cfg.r = r;
    let st = initState();
    for (let t = 0; t < T_END; t += 1 / 240) st = stepState(st, 1 / 240, t);
    Object.assign(cfg, keep);
    return st.last / AS;
  }
  LTT.expect("시뮬레이션 정상 진폭 r=0.5, ζ=0.2", simAmp(0.2, 0.5), E.sim_r05_z02, { tol: 0.005 });
  LTT.expect("시뮬레이션 정상 진폭 r=1, ζ=0.5", simAmp(0.5, 1), E.sim_r1_z05, { tol: 0.005 });

  const f1 = d3.format(".1f");
  const SRC = "ω0 = 1 Hz, 정적 변위 F0/k = 10 mm로 둔 가상의 값이다(불확실). 운동 방정식을 RK4(dt = 1/240 s)로 풀었다.";

  // 응답 곡선: x축 ω/ω0 0.2~2, y축 진폭/정적 변위. 모양이 메시지라 곡선으로 그린다.
  const curve = (node, zs, opts = {}) => {
    const VW = 320, VH = opts.h || 180, x = d3.scaleLinear([0.2, 2], [30, VW - 8]), y = d3.scaleLinear([0, opts.top || 11], [VH - 20, 8]).clamp(true);
    const s = d3.select(node).append("svg").attr("class", "curve ltt-svg").attr("viewBox", `0 0 ${VW} ${VH}`);
    s.append("g").attr("transform", `translate(0,${VH - 20})`).call(d3.axisBottom(x).ticks(4)).selectAll("text").style("font-size", "10px");
    s.append("g").attr("transform", "translate(30,0)").call(d3.axisLeft(y).ticks(4)).selectAll("text").style("font-size", "10px");
    s.append("line").attr("x1", x(1)).attr("x2", x(1)).attr("y1", 8).attr("y2", VH - 20).attr("stroke", "var(--ltt-line)").attr("stroke-dasharray", "4 4");
    const line = (z) => d3.line().x((r) => x(r)).y((r) => y(gain(r, z)))(d3.range(0.2, 2.0001, 0.005));
    return zs.map((z, i) => s.append("path").attr("class", "c").attr("d", line(z)).attr("stroke", (opts.colors || [])[i] || "var(--ltt-accent)"));
  };
  const draw = (paths) => paths.forEach((p, i) => { const L = p.node().getTotalLength(); p.attr("stroke-dasharray", L).attr("stroke-dashoffset", L).transition().delay(i * 300).duration(LTT.MOTION_MS * 1.5).attr("stroke-dashoffset", 0); });
  let predPaths = [];

  LTT.deck({
    title: "감쇠를 줄이면 공진 피크는 어떻게 변할까?",
    scenes: [
      { type: "hook", art: "🌉",
        text: "약한 힘이라도 <u>박자가 맞으면</u><br>구조물은 크게 흔들린다.",
        sub: "지진·모터·소리처럼 주기적인 힘을 받는 구조물이나 장치의 감쇠(ζ)를 얼마나 둘지 정하는 이야기." },

      { kicker: "시뮬레이션", title: "같은 힘으로 고유진동수에 맞춰 흔든다",
        sub: "감쇠비 ζ만 바꿔 보자. 처음엔 과도 응답이 섞이고, ζ가 작을수록 정상 진폭에 늦게 도달한다.",
        mount: (body) => {
          body.innerHTML = `<div class="dk-actions">${[0.05, 0.2, 0.71].map((z) => `<button data-z="${z}" class="ghost">ζ = ${z}</button>`).join("")}</div>
            <svg class="scene ltt-svg" viewBox="0 0 880 200"></svg>
            <div class="facts"><span>최근 한 주기 진폭 <b id="meas">-</b> mm</span><span>이론 정상 진폭 <b id="theo">-</b> mm</span><span class="ltt-tag">모델로 계산한 예시</span></div>`;
          const svg = d3.select(body).select("svg"), XE = 470, BW = 70, SC = 3;
          svg.append("line").attr("x1", 20).attr("x2", 20).attr("y1", 40).attr("y2", 160).attr("stroke", "var(--ltt-ink)").attr("stroke-width", 6);
          svg.append("line").attr("x1", XE).attr("x2", XE).attr("y1", 30).attr("y2", 170).attr("stroke", "var(--ltt-muted)").attr("stroke-dasharray", "3 4");
          svg.append("text").attr("x", XE).attr("y", 22).attr("text-anchor", "middle").text("평형 위치");
          const spring = svg.append("path").attr("fill", "none").attr("stroke", "var(--ltt-muted)").attr("stroke-width", 3);
          const block = svg.append("rect").attr("y", 100).attr("width", BW).attr("height", 60).attr("rx", 8).attr("fill", "var(--ltt-accent)");
          const drawMass = (x) => {
            const left = Math.max(60, Math.min(800, XE + x * SC - BW / 2)), n = 12;
            spring.attr("d", d3.line()(d3.range(n + 1).map((i) => [20 + (left - 20) * i / n, i === 0 || i === n ? 130 : 130 + (i % 2 ? -14 : 14)])));
            block.attr("x", left);
          };
          const run = LTT.sim({
            dt: 1 / 240, speed: 2, init: () => { drawMass(0); return initState(); }, step: stepState, until: (st, t) => t >= T_END,
            draw: (st) => { drawMass(st.s[0]); LTT.$("meas").textContent = st.last ? f1(st.last) : "-"; },
          });
          const pick = (z) => {
            cfg.z = z; cfg.r = 1;
            body.querySelectorAll("[data-z]").forEach((b) => b.classList.toggle("ghost", Number(b.dataset.z) !== z));
            LTT.$("theo").textContent = f1(gain(1, z) * AS);
            run.start();
          };
          body.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => pick(Number(b.dataset.z)));
          return { enter: () => pick(cfg.z), leave: () => run.stop() };
        },
        basis: "블록 변위는 화면에 맞게 잘라 그렸다(ζ = 0.05의 정상 진폭은 화면 밖으로 나간다). " + SRC },

      { type: "predict", kicker: "먼저 예측", title: "ζ를 줄이면 주파수별 응답 곡선의 피크는?",
        sub: "같은 크기의 힘을 여러 주파수로 가했을 때 진폭을 이은 곡선이다. 지금은 ζ = 0.5.",
        mount: (body) => { const d = document.createElement("div"); body.prepend(d); predPaths = curve(d, [0.5, 0.2, 0.05], { colors: ["#c5cdf3", "#8a9cf0", "var(--ltt-accent)"] }); predPaths.slice(1).forEach((p) => p.style("opacity", 0)); d.querySelector("svg").style.maxHeight = "31vh"; return {}; },
        question: "감쇠비 ζ를 줄이면 공진 피크는 어떻게 변하나?",
        choices: [{ id: "A", text: "낮아지고 넓어진다" }, { id: "B", text: "높아지고 좁아진다" }, { id: "C", text: "높이만 커지고 폭은 그대로" }, { id: "D", text: "피크 위치만 옆으로 이동" }],
        answer: "B",
        reveal: () => { predPaths.slice(1).forEach((p) => p.style("opacity", 1)); draw(predPaths.slice(1)); },
        why: `높아지고 좁아진다. ζ = 0.2의 피크는 약 ${f1(peakGain(0.2))}배, ζ = 0.05는 약 ${f1(peakGain(0.05))}배. 공진에서 높이는 대략 1/(2ζ)배로 솟는다. <span class="ltt-tag">모델로 계산한 예시</span>`,
        tex: "A(\\omega)=\\frac{F_0/m}{\\sqrt{(\\omega_0^2-\\omega^2)^2+(2\\zeta\\omega_0\\omega)^2}},\\qquad A_{\\text{peak}}\\approx\\frac{1}{2\\zeta}\\ (\\text{정적 변위 배})" },

      { type: "compare", kicker: "실제 사례", title: "세 곳에서 이 곡선은 무엇을 말하나",
        items: [
          { label: "건물 (ζ ≈ 0.05)", visual: (n) => curve(n, [0.05], { h: 150 }), tone: "bad", verdict: `공진 시 약 ${f1(peakGain(0.05))}배 증폭`, noteAfter: true,
            note: "지반 진동의 지배 주파수가 고유진동수 근처면 위험. 감쇠기를 달거나 고유진동수를 옮긴다. 건물 감쇠비는 대략 수 %(불확실)." },
          { label: "밀폐형 스피커 (Q ≈ 0.707)", visual: (n) => curve(n, [0.71], { h: 150 }), tone: "good", verdict: "피크 없이 평탄", noteAfter: true,
            note: "Q = 1/(2ζ). ζ ≈ 0.71이면 솟는 구간이 없다. 실제 스피커 응답은 고역통과 형태라 이 곡선과 다르다(불확실)." },
          { label: "타코마 다리 (1940)", visual: '<div class="tac">🌬️🌉</div>', tone: "warn", verdict: "이 모델로는 설명 안 됨", noteAfter: true,
            note: "흔히 '바람과 맞은 공진'이라 하지만 연구자들은 바람과 비틀림이 서로 먹이는 자려 진동(공탄성 플러터)으로 본다. Billah & Scanlan, Am. J. Phys. 59, 118 (1991) (기억에 의존, 미검증)." },
        ],
        basis: "곡선은 모델로 계산한 예시(가로축 ω/ω0, 세로축 정적 변위 대비 배수). " + SRC },

      { type: "explain", kicker: "대응", title: "피크를 피하는 세 가지 손잡이", arrows: false,
        steps: [
          { icon: "🧽", title: "감쇠 늘리기", text: "ζ를 키우면 피크가 낮고 넓어진다. 질량 감쇠기·댐퍼." },
          { icon: "🎚️", title: "고유진동수 옮기기", text: "강성·질량을 바꿔 외력 주파수에서 멀어지게 한다." },
          { icon: "⏱️", title: "구동 주파수 피하기", text: "모터 회전수 등을 공진 대역 밖으로 빠르게 지나가게 한다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "감쇠비", en: "damping ratio ζ" },
          { ko: "공진 / 품질 계수", en: "resonance, Q factor" },
          { ko: "주파수 응답", en: "frequency response, transmissibility" },
        ],
        signals: [
          "특정 회전수·속도에서만 진동이나 소음이 커질 때",
          "구조물·장치 사양에 고유진동수가 적혀 있을 때",
          "감쇠를 줄여 '반응을 날카롭게' 하자는 제안이 나올 때",
        ],
        queries: ["damping ratio resonance peak 1/(2ζ)", "forced vibration amplitude response", "Q factor damping ratio relation", "tuned mass damper building", "Tacoma Narrows flutter not resonance"],
        neighbors: [
          { term: "자려 진동 / 플러터", diff: "외력 주기가 아니라 운동 자체가 에너지를 끌어들인다. 감쇠 곡선 모델이 맞지 않는다." },
          { term: "과도 응답", diff: "흔들기 시작 직후의 출렁임. 공진 곡선은 충분히 지난 뒤의 정상 진폭이다." },
        ] },
    ],
  });
</script>
</body>
</html>
