<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시 읽기와 인출 연습, 1주 뒤엔 어느 쪽이 더 남을까?</title>
<script type="application/json" id="ltt-meta">{"domain":"교육학","topic":"인출 연습(testing effect)","audience":"전제 지식 없음","pattern":["hook","terms","explain","diagram","predict","compare","compare","explain","summary","keywords"],"mode":"체험형: 용어와 원리를 풀고 실험 설계를 다이어그램으로 본 뒤, 다른 사람들이 참여한 실험 결과를 짐작하고 막대로 확인한다(사용자 자신의 편향을 시험하지 않는다)","decision":"복습 시간을 다시 읽기와 인출 연습 중 어디에 쓸지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --read: color-mix(in srgb, var(--ltt-accent) 40%, var(--ltt-card)); --test: var(--ltt-accent); }
  .pair { display: grid; gap: 8px; width: 100%; }
  .pair .ltt-bar { height: 34px; }
  .ex { font-size: 15px; text-align: center; line-height: 1.5; color: var(--ltt-ink-2); }
  .ex .ci { display: flex; width: 60px; height: 60px; margin: 0 auto 10px; border-radius: 18px; align-items: center; justify-content: center; background: var(--ltt-accent-soft); color: var(--ltt-accent); font-size: 30px; }
</style>
</head>
<body>
<script>
  // EXPECTED_BY_HAND: 논문 값(불확실)에서 손으로 뺀 차이. 5분 뒤 71-83=-12, 1주 뒤 61-40=21.
  const DATA = [{ read: 83, test: 71 }, { read: 40, test: 61 }];
  const EXPECTED_BY_HAND = { diff5min: -12, diff1wk: 21 };
  DATA.forEach((d, i) => LTT.expect(i ? "1주 뒤 차이" : "5분 뒤 차이", d.test - d.read, i ? EXPECTED_BY_HAND.diff1wk : EXPECTED_BY_HAND.diff5min, { tol: 0 }));

  // Bars start empty and grow on `fire`, so the ranking flip is seen as motion rather than read as numbers.
  function pair(node, d) {
    const box = document.createElement("div");
    box.className = "pair";
    node.appendChild(box);
    const mk = (c) => { const e = document.createElement("div"); box.appendChild(e); return LTT.bar(e, [{ color: c }, { color: "transparent" }]); };
    const r = mk("var(--read)"), t = mk("var(--test)");
    r.set([0, 100]); t.set([0, 100]);
    return () => { r.set([d.read, 100 - d.read], [`다시 읽기 조 ${d.read}%`, ""]); t.set([d.test, 100 - d.test], [`떠올리기 조 ${d.test}%`, ""]); };
  }
  const SRC = "Roediger & Karpicke (2006) Psychological Science 실험 1(대학생, 산문 글, 떠올릴 때 정답 안 알려 줌). 방향과 1주 뒤 차이 약 21%p는 검색으로 확인. 83/71, 40/61 개별 값은 기억에 의존했고 원문 표로 재확인하지 못했다(불확실).";
  const ex = (icon, t) => `<div class="ex"><span class="ci">${LTT.icon(icon)}</span>${t}</div>`;
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");

  LTT.deck({
    title: "다시 읽기와 인출 연습, 1주 뒤엔 어느 쪽이 더 남을까?",
    scenes: [
      { type: "hook", art: "doc", kicker: "시험 전 복습 계획 세우기",
        pre: "네 번 읽으면 다 아는 것 같다.",
        text: "그런데 <u>일주일 뒤</u>에도<br>남아 있을까?",
        sub: "남은 복습 시간을 '다시 읽기'와 '책 덮고 떠올리기' 중 어디에 쓸지 정하는 이야기다. 이 수업을 마치면 어떤 공부법이 오래 남는지, 언제는 예외인지 말할 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "인출 연습", en: "retrieval practice", icon: "pencil", plain: "배운 내용을 보지 않고 머릿속에서 꺼내 보는 연습. 꺼낸 뒤 맞았는지 확인한다.", example: "책을 덮고 방금 읽은 내용을 백지에 써 보기." },
          { key: "지연 시험", en: "delayed test", icon: "clock", plain: "공부하고 며칠 지난 뒤에 보는 시험. 오래 남았는지를 잰다. 공부 직후 시험과 결과가 다를 수 있다.", example: "공부 5분 뒤 시험 vs 1주 뒤 시험." },
        ] },

      { type: "explain", kicker: "원리", title: "꺼내 본 기억이 다음에도 꺼내진다", en: "Why it works",
        steps: [
          { icon: "eye", title: "다시 읽기", text: "글이 눈앞에 있어 술술 읽힌다. 이 익숙함이 '안다'는 느낌을 만들지만, 꺼내는 연습은 되지 않는다." },
          { icon: "pencil", title: "떠올리기", text: "책을 덮고 꺼내려 애쓰는 과정이 그 기억으로 가는 길을 튼튼하게 만든다." },
          { icon: "clock", title: "며칠 뒤 차이", text: "시험도 결국 '꺼내기'다. 꺼내 본 연습이 많을수록 {{지연 시험}}에서 더 남는다." },
        ],
        takeaway: "시험에서 하는 일(꺼내기)을 미리 연습한 쪽이 오래 남는다." },

      { kicker: "실험 설계", title: "같은 글, 다른 복습법, 두 번의 시험", en: "Experiment",
        bare: true,
        narration: [
          "대학생들이 같은 글을 공부했다. 한 조는 4번 읽었고, 다른 조는 1번 읽은 뒤 3번은 책을 덮고 기억나는 대로 썼다.",
          "두 조 모두 일부는 5분 뒤, 일부는 1주 뒤에 같은 시험을 봤다(점선 = 둘 중 한 시험만 봄). 복습에 쓴 시간은 같다.",
        ],
        mount(body) {
          const panel = body.appendChild(Object.assign(document.createElement("div"), { className: "ltt-panel" }));
          LTT.diagram(panel.appendChild(svgEl()), {
            cols: 3, rows: 2, cell: [220, 100], node: [180, 62], maxWidth: false,
            nodes: [
              { id: "doc", c: 0, r: 0.5, l: "같은 글 공부", s: "대학생", icon: "doc" },
              { id: "read", c: 1, r: 0, l: "4번 읽기", s: "다시 읽기 조", icon: "eye", k: "muted" },
              { id: "test", c: 1, r: 1, l: "1번 읽고 3번 쓰기", s: "떠올리기 조", icon: "pencil", k: "accent" },
              { id: "t5", c: 2, r: 0, l: "5분 뒤 시험", icon: "clock" },
              { id: "t1w", c: 2, r: 1, l: "1주 뒤 시험", s: "지연 시험", icon: "clock", k: "dark" },
            ],
            edges: [{ f: "doc", t: "read" }, { f: "doc", t: "test", k: "accent" }, { f: "read", t: "t5", dash: true }, { f: "read", t: "t1w", dash: true }, { f: "test", t: "t5", dash: true }, { f: "test", t: "t1w", dash: true }],
          });
          return {};
        },
        basis: SRC,
        takeaway: "비교한 것은 같은 시간을 '읽기'에 쓰느냐 '꺼내기'에 쓰느냐다." },

      { type: "predict", kicker: "짐작해 보기", title: "1주 뒤 시험, 어느 조가 더 많이 기억했을까?",
        sub: "앞 장면의 두 조가 1주 뒤에 본 시험 결과다.",
        visual: () => LTT.facts([
          { icon: "eye", value: "4번 읽기", label: "다시 읽기 조" },
          { icon: "pencil", value: "1번 읽고 3번 쓰기", label: "떠올리기 조" },
          { icon: "clock", value: "1주 뒤", label: "시험 시점" },
        ]),
        question: "4번 읽기 vs 1번 읽고 3번 떠올리기, 1주 뒤 어느 쪽이 더 높은가",
        choices: [{ id: "read", text: "4번 읽은 조" }, { id: "test", text: "떠올려 쓴 조" }, { id: "same", text: "비슷하다" }],
        answer: "test",
        why: "떠올려 쓴 조가 약 <b>21%포인트</b>(정답 비율의 차이) 높았다. 글을 본 횟수는 더 적었는데도 그렇다. 쓰면서 기억을 꺼내 본 연습이 1주 뒤의 '꺼내기'를 도왔다.",
        answerVisual: (n) => { const fire = pair(n, DATA[1]); n.insertAdjacentHTML("beforeend", `<p class="ltt-basis">막대 = 1주 뒤 시험에서 기억해 낸 비율 · 출처 값 일부 불확실</p>`); setTimeout(fire, 100); } },

      { type: "compare", kicker: "시험 시점만 다르게", title: "5분 뒤와 1주 뒤, 순위가 뒤집혔다", layout: "stack", reveal: false,
        narration: "같은 실험에서 시험을 5분 뒤에 본 사람들과 1주 뒤에 본 사람들을 나란히 놓았다. 위 막대가 다시 읽기 조, 아래 막대가 떠올리기 조다. 막 공부한 직후에는 순위가 반대라서, 벼락치기가 효과 있어 보이는 것이다.",
        items: [
          { label: "5분 뒤 시험", visual: (n) => { const f = pair(n, DATA[0]); setTimeout(f, 300); }, tone: "warn", verdict: "다시 읽기가 12%포인트 앞섬",
            note: "막 읽은 내용은 아직 눈앞에 있다." },
          { label: "1주 뒤 시험", visual: (n) => { const f = pair(n, DATA[1]); setTimeout(f, 900); }, tone: "good", verdict: "떠올리기가 21%포인트 앞섬",
            note: "읽기 조는 절반 넘게 잊었고 떠올리기 조는 덜 잊었다." },
        ],
        basis: SRC,
        takeaway: "공부 직후의 느낌으로 공부법을 고르면, 오래 남는 쪽을 놓친다.",
        ask: "\"이 자료로 나를 테스트할 문제를 만들어 줘\"" },

      { type: "compare", kicker: "실제 공부법", title: "이 공부법들, '꺼내기'가 들어 있을까?", layout: "stack",
        narration: "자주 쓰는 공부법 네 가지다. 각각 책을 보지 않고 머릿속에서 꺼내는 단계가 있는지 먼저 짐작해 보고 판정을 열자.",
        revealLabel: "판정 보기",
        items: [
          { label: "플래시카드", visual: ex("doc", "앞면 보고 뒷면 떠올리기"), tone: "good", verdict: "인출 연습" },
          { label: "기출·연습 문제", visual: ex("pencil", "답을 만들어 낸 뒤 채점"), tone: "good", verdict: "인출 연습" },
          { label: "백지 복습", visual: ex("inbox", "덮고 기억나는 대로 쓰기"), tone: "good", verdict: "인출 연습", noteAfter: true, note: "맞았는지 확인하는 단계를 꼭 붙인다." },
          { label: "형광펜·요약 다시 보기", visual: ex("eye", "칠한 부분을 다시 읽기"), tone: "bad", verdict: "다시 읽기", noteAfter: true, note: "익숙함만 늘 수 있다." },
        ],
        takeaway: "복습에 '책 덮고 꺼내는' 단계가 있는지 확인한다." },

      { type: "explain", kicker: "한계", title: "그대로 옮기면 안 되는 곳", arrows: false,
        steps: [
          { icon: "clock", title: "시험이 곧이면", text: "몇 분 뒤 시험에서는 다시 읽기가 앞섰다. 효과는 며칠 뒤에 드러난다." },
          { icon: "question", title: "처음 배우는 어려운 내용", text: "아직 이해하지 못했으면 떠올릴 거리가 없다. 먼저 이해한 뒤에 꺼내기를 한다." },
          { icon: "alert", title: "정답 확인 없음", text: "틀린 내용을 떠올리면 오답이 굳을 수 있다. 꺼낸 뒤 반드시 맞춰 본다." },
        ],
        basis: "한 편의 글, 대학생 조건의 결과라 다른 과목·연령에 수치를 그대로 옮길 수 없다.",
        takeaway: "이해 먼저, 그다음 꺼내기, 그리고 정답 확인." },

      { type: "summary", title: "복습 계획을 짜기 전에 물어볼 것", en: "Recap" },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "인출 연습", en: "retrieval practice" }, { ko: "시험 효과 (인출 연습으로 기억이 느는 현상)", en: "testing effect" }],
        signals: ["복습 계획을 '다시 읽기'로만 채우고 있을 때", "\"다 아는 것 같은데 시험에선 안 나온다\"는 말을 들을 때", "교육 자료에 퀴즈를 넣을지 정할 때"],
        queries: ["Roediger Karpicke 2006 testing effect", "retrieval practice vs restudy delayed test", "illusion of competence rereading", "successive relearning"],
        neighbors: [
          { term: "간격 효과", diff: "복습을 '언제' 할지의 문제. 인출 연습은 복습을 '어떻게' 할지의 문제." },
          { term: "바람직한 어려움", diff: "인출·간격·섞어 연습을 묶는 상위 개념. 당장은 어렵지만 오래 남는 학습." },
        ] },
    ],
  });
</script>
</body>
</html>
