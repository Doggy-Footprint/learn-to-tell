<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐시 TTL을 늘리면 무엇을 잃을까?</title>
<script type="application/json" id="ltt-meta">{"domain":"백엔드","topic":"캐시 TTL과 오래된 응답 비율","audience":"캐시 적중률과 TTL 만료는 안다","pattern":["hook","explain","predict","motion","compare","sweep","keywords"],"mode":"체험형: 오래된 응답 비율은 직관보다 작거나 크게 빗나가므로 예측 후 공개한다","decision":"TTL (원본 부하와 오래된 응답 사이)"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --stale: #eb6834; --fresh: #c3c9da; --miss: #2a78d6; }
  .u-stale { background: var(--stale) !important; } .u-fresh { background: var(--fresh) !important; } .u-miss { background: var(--miss) !important; }
  .mini .ltt-units { max-width: 120px; gap: 2px; } .mini .ltt-unit { border-radius: 2px; }
  @media (max-width: 720px) { .dk-cmp { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 6px !important; } .dk-item { padding: 8px !important; } .num { font-size: 11px; } .num b { font-size: 18px; } }
  .row { display: flex; gap: clamp(16px, 4vw, 48px); align-items: center; flex-wrap: wrap; }
  .row .ltt-units { width: min(300px, 70vw); }
  @media (max-width: 720px) { .row .ltt-units { width: min(300px, 70vw, 26vh); } }
  .num { font-size: 13px; color: var(--ltt-muted); text-align: center; } .num b { font-size: 22px; color: var(--ltt-ink); }
</style>
</head>
<body>
<script>
  // Hand-derived by an independent subagent from the formulas only; the model must match these, not the reverse.
  const EXPECTED_BY_HAND = [
    { label: "C1 λ2 변경10분 TTL60초", lambda: 2, interval: 600, ttl: 60, h: 0.991736, sHit: 0.0483742, stale: 0.0479744, perMin: 0.991736, miss: 1, staleN: 5, fresh: 94 },
    { label: "C2 λ2 변경1분 TTL5분", lambda: 2, interval: 60, ttl: 300, h: 0.998336, sHit: 0.801348, stale: 0.800014, perMin: 0.199667, miss: 0, staleN: 80, fresh: 20 },
    { label: "C3 λ2 변경1분 TTL10초", lambda: 2, interval: 60, ttl: 10, h: 0.952381, sHit: 0.0788903, stale: 0.0751337, perMin: 5.71429, miss: 5, staleN: 8, fresh: 87 },
    { label: "C4 λ2 변경1일 TTL5분", lambda: 2, interval: 86400, ttl: 300, h: 0.998336, sHit: 0.00173410, stale: 0.00173122, perMin: 0.199667, miss: 0, staleN: 0, fresh: 100 },
  ];
  const hitRatio = (lambda, ttl) => (lambda * ttl) / (1 + lambda * ttl);
  // expm1 keeps precision when μT is tiny (daily changes, short TTL); x = 0 would be 0/0.
  const staleShareOfHits = (mu, ttl) => { const x = mu * ttl; return x === 0 ? 0 : 1 + Math.expm1(-x) / x; };
  function model(lambda, interval, ttl) {
    const h = hitRatio(lambda, ttl), sHit = staleShareOfHits(1 / interval, ttl), stale = h * sHit;
    const missN = Math.round(100 * (1 - h)), staleN = Math.round(100 * stale);
    return { h, sHit, stale, perMin: (60 * lambda) / (1 + lambda * ttl), missN, staleN, freshN: 100 - missN - staleN };
  }
  for (const c of EXPECTED_BY_HAND) {
    const m = model(c.lambda, c.interval, c.ttl);
    LTT.expect(c.label + " 적중률", m.h, c.h, { tol: 1e-5 });
    LTT.expect(c.label + " 적중 중 오래된 비율", m.sHit, c.sHit, { tol: 1e-5 });
    LTT.expect(c.label + " 오래된 응답 비율", m.stale, c.stale, { tol: 1e-5 });
    LTT.expect(c.label + " 원본 조회/분", m.perMin, c.perMin, { tol: 1e-4 });
    LTT.expect(c.label + " 100건 중 원본 조회", m.missN, c.miss, { tol: 0 });
    LTT.expect(c.label + " 100건 중 오래된 값", m.staleN, c.staleN, { tol: 0 });
    LTT.expect(c.label + " 100건 중 최신 적중", m.freshN, c.fresh, { tol: 0 });
  }

  const sig2 = d3.format(".2~r");
  const fmtDur = (s) => s < 60 ? `${sig2(s)}초` : s < 3600 ? `${sig2(s / 60)}분` : `${sig2(s / 3600)}시간`;
  const KEY = `<span class="ltt-key"><i class="u-stale"></i>오래된 적중</span><span class="ltt-key"><i class="u-fresh"></i>최신 적중</span><span class="ltt-key"><i class="u-miss"></i>원본 조회</span>`;
  // Stale cells first, so the eye counts the orange block directly.
  function paint(cells, m) {
    cells.forEach((u, i) => {
      u.classList.toggle("u-stale", i < m.staleN);
      u.classList.toggle("u-fresh", i >= m.staleN && i < m.staleN + m.freshN);
      u.classList.toggle("u-miss", i >= m.staleN + m.freshN);
    });
  }
  const caseVis = (interval, ttl) => (node) => {
    const m = model(2, interval, ttl), box = document.createElement("div");
    box.className = "mini";
    node.appendChild(box);
    paint(LTT.units(box.appendChild(document.createElement("div")), 100).cells, m);
    box.insertAdjacentHTML("beforeend", `<p class="num"><b>${m.staleN || "<1"}</b> / 100 오래된 값<br>원본 조회 분당 ${sig2(m.perMin)}회</p>`);
  };
  const BASE = model(2, 600, 60);

  LTT.deck({
    title: "캐시 TTL을 늘리면 무엇을 잃을까?",
    scenes: [
      { type: "hook", art: "🧊",
        text: "TTL을 늘리면 원본은 편해지고,<br>사용자는 <u>바뀌기 전 값</u>을 받는다.",
        sub: "얼마나 자주 옛 값을 주는지는 TTL 하나가 아니라 '원본이 얼마나 자주 바뀌나'와 함께 정해진다." },

      { type: "explain", kicker: "원리", title: "캐시에 담긴 값의 한 생애",
        steps: [
          { icon: "📥", title: "miss → 저장", text: "원본에서 최신 값을 받아 캐시에 넣는다. 이 순간 나이 0." },
          { icon: "⏳", title: "T초 동안 적중", text: "그동안의 요청은 원본에 묻지 않고 캐시 값을 받는다." },
          { icon: "🔄", title: "원본이 바뀌면", text: "캐시는 모른다. 남은 시간의 적중은 모두 오래된 값." },
          { icon: "⌛", title: "만료", text: "다음 요청이 다시 miss. 원본 조회 1회." },
        ] },

      { type: "predict", kicker: "예측", title: "응답 100건 중 옛 값은 몇 건?",
        sub: "상품 정보 API. 원본은 평균 10분에 한 번 바뀌고, 한 상품에 초당 2번 요청. TTL 60초.",
        question: "응답 100건 중 오래된 값 건수 (요청 2회/초, 변경 평균 10분, TTL 60초)",
        choices: [{ id: "0", text: "거의 0건" }, { id: "5", text: "5건쯤" }, { id: "25", text: "25건쯤" }, { id: "50", text: "절반쯤" }],
        answer: "5",
        why: "약 5건. 적중한 값의 나이는 0–60초에 고르게 퍼져 평균 30초이고, 그 30초 안에 원본이 바뀔 확률은 30/600 ≈ 5%다. <span class=\"ltt-tag\">모델로 계산한 예시</span>" },

      { kicker: "모델로 계산한 예시", title: "같은 조건의 응답 100칸",
        sub: "칸 하나가 응답 하나. 원본 조회는 100건 중 1건뿐이고, 오래된 값은 5건.",
        mount(body) {
          body.innerHTML = `<div class="row"><div></div><div><p>${KEY}</p><div class="ltt-stat"><span>0</span><small>/ 100 오래된 값</small></div><p class="ltt-basis">적중률 ${d3.format(".1f")(100 * BASE.h)}% · 원본 조회 분당 ${sig2(BASE.perMin)}회</p></div></div>`;
          const u = LTT.units(body.querySelector(".row > div"), 100);
          return { enter() { u.cells.forEach((c) => c.className = "ltt-unit"); setTimeout(() => paint(u.cells, BASE), 200); LTT.tween(body.querySelector(".ltt-stat span"), BASE.staleN); } };
        },
        tex: String.raw`\text{적중률}=\frac{\lambda T}{1+\lambda T},\quad \text{적중 중 오래된 비율}=1-\frac{1-e^{-\mu T}}{\mu T}`,
        basis: "가정: 요청과 원본 변경이 독립 Poisson 과정, 변경 시 캐시를 지우지 않음. 적중률 식은 Jung, Berger, Balakrishnan (INFOCOM 2003) Theorem 1. 몰려 오는(bursty) 실제 트래픽은 적중률이 더 높게 나온다." },

      { type: "compare", kicker: "사례", title: "TTL은 '데이터가 바뀌는 속도'에 맞춰야 한다",
        sub: "모두 한 상품에 초당 2회 요청. 칸 그림은 응답 100건(모델로 계산한 예시).",
        items: [
          { label: "상품 설명 · 하루 1회 변경 · TTL 5분", visual: caseVis(86400, 300), tone: "good", verdict: "길게 둬도 된다",
            noteAfter: true, note: "변경이 드물면 TTL 5분이어도 옛 값이 1건도 안 된다." },
          { label: "재고 · 1분마다 변경 · TTL 5분", visual: caseVis(60, 300), tone: "bad", verdict: "대부분 옛 값",
            noteAfter: true, note: "품절 상품이 '재고 있음'으로 보일 수 있다." },
          { label: "재고 · 1분마다 변경 · TTL 10초", visual: caseVis(60, 10), tone: "warn", verdict: "옛 값↓ 원본 부하↑",
            noteAfter: true, note: "원본 조회가 TTL 5분 때의 약 29배." },
        ] },

      { kicker: "직접 바꿔 보기", title: "TTL을 끌면 두 막대가 반대로 움직인다",
        sub: "요청 2회/초, 원본 변경 평균 10분 고정. 모델로 계산한 예시.",
        mount(body) {
          const TTLS = [1, 5, 10, 30, 60, 120, 300, 600, 1800, 3600];
          body.innerHTML = `<label class="ltt-param">TTL <b id="ttl-v"></b><input type="range" id="ttl" min="0" max="9" value="4" aria-label="TTL"></label>
            <p class="ltt-basis">응답 100건 구성</p><div class="ltt-bar" id="b1"></div><p>${KEY}</p>
            <p class="ltt-basis">원본 조회 (분당, 최대 120회 기준)</p><div class="ltt-bar" id="b2"></div>`;
          const b1 = LTT.bar("b1", [{ color: "var(--stale)" }, { color: "var(--fresh)" }, { color: "var(--miss)" }]);
          const b2 = LTT.bar("b2", [{ color: "var(--miss)" }, { color: "transparent" }]);
          LTT.sweep({ params: { ttl: { map: (i) => TTLS[i], fmt: fmtDur } }, render({ ttl }) {
            const m = model(2, 600, ttl);
            b1.set([m.staleN, m.freshN, m.missN], [m.staleN || "", m.freshN, m.missN || ""]);
            b2.set([m.perMin, 120 - m.perMin], [sig2(m.perMin) + "회", ""]);
          } });
          return {};
        },
        basis: "TTL이 변경 간격(10분)에 다가가면 오래된 값이 급격히 늘고, 원본 조회는 이미 바닥이라 더 줄 것이 없다." },

      { type: "explain", kicker: "어림 규칙", title: "숫자 감각 세 가지", arrows: false,
        steps: [
          { icon: "½", title: "옛 값 ≈ (TTL ÷ 변경 간격) ÷ 2", text: "TTL이 변경 간격보다 충분히 짧을 때만 맞는 어림." },
          { icon: "🔟", title: "적중률 99% → 99.9%", text: "숫자는 비슷해 보여도 원본 조회는 1%에서 0.1%, 10분의 1이 된다." },
          { icon: "🧹", title: "TTL 말고 무효화", text: "변경 시 캐시를 지운다. 단, 읽기·쓰기 경쟁으로 옛 값이 다시 캐시될 수 있다(Nishtala 외, NSDI 2013의 stale set·lease)." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "캐시 TTL", en: "time to live" }, { ko: "오래된 응답 · 신선도", en: "stale read · freshness" }, { ko: "캐시 무효화", en: "cache invalidation" }],
        signals: ["TTL을 '그냥 5분'으로 정하려 할 때", "\"캐시 때문에 값이 늦게 바뀐다\"는 버그 리포트"],
        queries: ["cache TTL staleness hit ratio Poisson", "TTL cache analysis Jung Berger Balakrishnan", "cache invalidation stale set lease memcache"],
        neighbors: [
          { term: "적중률", diff: "원본 부하를 말한다. 응답이 최신인지는 말해 주지 않는다." },
          { term: "stale-while-revalidate", diff: "만료 후 옛 값을 주면서 뒤에서 갱신. TTL을 늘리는 것과 다른 손잡이." },
        ] },
    ],
  });
</script>
</body>
</html>
