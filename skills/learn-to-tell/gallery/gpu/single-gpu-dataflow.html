<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU가 2배 빨라지면 글 생성도 2배 빨라질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"gpu","topic":"single-gpu-dataflow","audience":"Transformer 구조를 모름. 모델은 큰 숫자 표라는 정도만 안다","pattern":["hook","explain","flow","predict","compare","flow","compare","explain","keywords"],"mode":"체험형: 표가 흘러가는 모습을 보고 연산기 업그레이드 효과를 직접 예측한다","decision":"토큰당 시간을 정하는 것이 메모리 대역폭인지 연산 속도인지, batch가 이를 어떻게 바꾸는지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --mem: #4f6bed; --cmp: #e0a33a; --user: #1f9d6b; }
  .fl { max-width: 400px; max-height: 38vh; margin: 0 auto; }
  .tm { display: grid; gap: 6px; max-width: 520px; margin: 0 auto; width: 100%; font-size: 14px; }
  .tm .ltt-bar span { font-size: 12px; white-space: nowrap; }
  .mini { width: 100%; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px; font-size: 13px; } .mini .big { grid-column: 1 / -1; }
  .mini .ltt-bar { height: 22px; }
  .big { font-size: 28px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { .big { font-size: 17px; } .mini { font-size: 11px; } }
  .big small { display: block; font-size: 12px; font-weight: 600; color: var(--ltt-muted); }
</style>
</head>
<body>
<script>
  // 손으로 계산한 기대값 (모델 코드보다 먼저)
  // 8B BF16 = 16 GB. 16e9 / 3.35e12 = 4.77612 ms -> 1 / 4.77612e-3 = 209.375 tok/s (= 3.35e12 / 16e9)
  // 계산 시간(batch 1) = 2*8e9 / 989e12 = 1.61779e-5 s = 0.0161779 ms
  // 꺾이는 batch = 989 / 3.35 = 295.224 (읽기 시간 = 계산 시간)
  // batch 64: 메모리에 묶임 -> 64 * 209.375 = 13400 tok/s
  // batch 512: 계산 시간 = 2*8e9*512/989e12 = 8.2827 ms > 4.776 ms -> 512 / 8.2827e-3 = 61812.5 tok/s (= 989e12 / 16e9)
  // 연산기 2배, batch 1: 읽기 4.776 ms가 그대로 -> 배수 1.0
  // 대역폭 2배, batch 1: 6.7e12 / 16e9 = 418.75 tok/s / 4B 모델(8 GB): 3.35e12 / 8e9 = 418.75 tok/s
  const EXPECTED_BY_HAND = { tMemMs: 4.77612, tokps: 209.375, tCompMs: 0.0161779, ridge: 295.224, b64: 13400, b512: 61812.5, speed2x: 1.0, bw2x: 418.75, half: 418.75 };

  const BW = 3.35e12, FLOPS = 989e12;
  const model = (paramsB, batch, speed = 1, bwMul = 1) => {
    const P = paramsB * 1e9, tMem = (2 * P) / (BW * bwMul), tComp = (2 * P * batch) / (FLOPS * speed);
    const step = Math.max(tMem, tComp);
    return { tMem, tComp, step, perUser: 1 / step, total: batch / step, memBound: tMem >= tComp };
  };
  const m81 = model(8, 1);
  LTT.expect("읽기 시간 ms", m81.tMem * 1e3, EXPECTED_BY_HAND.tMemMs, { tol: 1e-4 });
  LTT.expect("batch 1 tok/s", m81.total, EXPECTED_BY_HAND.tokps, { tol: 1e-3 });
  LTT.expect("계산 시간 ms", m81.tComp * 1e3, EXPECTED_BY_HAND.tCompMs, { tol: 1e-6 });
  LTT.expect("꺾이는 batch", FLOPS / BW, EXPECTED_BY_HAND.ridge, { tol: 1e-3 });
  LTT.expect("batch 64 tok/s", model(8, 64).total, EXPECTED_BY_HAND.b64, { tol: 1e-2 });
  LTT.expect("batch 512 tok/s", model(8, 512).total, EXPECTED_BY_HAND.b512, { tol: 1e-2 });
  LTT.expect("연산기 2배 배수", model(8, 1, 2).total / m81.total, EXPECTED_BY_HAND.speed2x, { tol: 1e-9 });
  LTT.expect("대역폭 2배 tok/s", model(8, 1, 1, 2).total, EXPECTED_BY_HAND.bw2x, { tol: 1e-3 });
  LTT.expect("4B 모델 tok/s", model(4, 1).total, EXPECTED_BY_HAND.half, { tol: 1e-3 });

  const fmtN = d3.format(",.0f");
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const SRC = "H100 SXM 데이터시트 기준 HBM3 약 3.35 TB/s, BF16 dense 약 989 TFLOPS (작성 시 원문 재확인 안 함). BF16은 파라미터당 2바이트, 토큰당 파라미터당 곱셈·덧셈 2회로 단순화. KV cache·커널 오버헤드·실제 대역폭 효율은 무시한 이상적 상한(roofline)이다.";

  function makeFlow(body) {
    const s = svgEl(); s.classList.add("fl"); body.appendChild(s);
    const fl = LTT.flow(s, {
      viewBox: "0 0 440 380",
      nodes: {
        hbm: { x: 110, y: 8, w: 220, h: 58, label: "HBM (표 16 GB)", sub: "약 3.35 TB/s" },
        l2: { x: 110, y: 112, w: 220, h: 58, label: "L2 캐시", sub: "통과만 한다" },
        sm: { x: 110, y: 216, w: 220, h: 58, label: "SM (연산기)", sub: "곱하고 더한다" },
        out: { x: 110, y: 320, w: 220, h: 52, label: "생성된 토큰" },
      },
      links: [{ from: "hbm", to: "l2", label: "표 조각 흐름" }, { from: "l2", to: "sm" }, { from: "sm", to: "out" }],
    });
    let run = 0;
    const loop = async (users) => {
      const id = ++run;
      fl.clear(); fl.highlight(["hbm", "l2", "sm", "out"]);
      while (id === run) {
        await fl.send("hbm", "l2", { count: 8, ms: 900, gap: 110 });
        if (id !== run) return;
        await fl.send("l2", "sm", { count: 8, ms: 500, gap: 60 });
        if (id !== run) return;
        await fl.send("sm", "out", { count: users, ms: 600, gap: 120, r: 8, color: "var(--user)" });
        if (!LTT.MOTION_MS) return;
      }
    };
    return { loop, stop: () => { run++; fl.clear(); } };
  }

  const mini = (r, top) => (node) => {
    const w = document.createElement("div"); w.className = "mini";
    w.innerHTML = `<div class="big">${fmtN(r.total)}<small>tok/s (전체)</small></div><div>읽기</div><div class="a"></div><div>계산</div><div class="b"></div>`;
    node.appendChild(w);
    LTT.bar(w.querySelector(".a"), [{ color: "var(--mem)" }, { color: "var(--ltt-line)" }]).set([r.tMem, top - r.tMem], ["", ""]);
    LTT.bar(w.querySelector(".b"), [{ color: "var(--cmp)" }, { color: "var(--ltt-line)" }]).set([r.tComp, top - r.tComp], ["", ""]);
  };

  LTT.deck({
    title: "GPU가 2배 빨라지면 글 생성도 2배 빨라질까?",
    scenes: [
      { type: "hook", art: "🐢",
        text: "더 비싼 GPU를 사면<br>챗봇 답이 <u>그만큼</u> 빨리 나올까?",
        sub: "모델을 GPU 한 장에 올려 서빙할 때, 어떤 성능 숫자에 돈을 써야 생성 속도가 오르는지 정하는 이야기." },

      { type: "explain", kicker: "원리", title: "토큰 하나 = 큰 표를 처음부터 끝까지 한 번 읽기",
        steps: [
          { icon: "📚", title: "모델은 큰 숫자 표", text: "8B 모델이면 표가 16 GB다. GPU 메모리(HBM)에 들어 있다." },
          { icon: "🚚", title: "표를 연산기로 옮긴다", text: "토큰 하나마다 표 전체가 HBM에서 연산기로 흘러간다." },
          { icon: "⚙️", title: "곱하고 더해 토큰 1개", text: "연산기는 받은 숫자로 계산해 다음 글자 하나를 낸다." },
        ] },

      { kicker: "흐름", title: "어디서 시간이 걸리나", sub: "표가 흘러가는 시간이 계산하는 시간보다 300배쯤 길다.",
        mount: (body) => {
          const f = makeFlow(body);
          const tm = document.createElement("div"); tm.className = "tm";
          tm.innerHTML = `<span>표 읽기 ${d3.format(".2f")(m81.tMem * 1e3)} ms · 계산 ${d3.format(".3f")(m81.tComp * 1e3)} ms <span class="ltt-tag">모델로 계산한 예시</span></span><div></div>`;
          body.appendChild(tm);
          LTT.bar(tm.lastChild, [{ color: "var(--mem)" }, { color: "var(--cmp)" }]).set([m81.tMem, m81.tComp], ["읽기", ""]);
          return { enter: () => f.loop(1), leave: f.stop };
        },
        basis: "패킷 수와 속도는 연출이다. L2 캐시는 가중치를 통과시킬 뿐 재사용하지 못한다고 단순화했다(불확실). " + SRC },

      { type: "predict", kicker: "먼저 예측", title: "연산기만 2배 빠른 GPU로 바꾸면?",
        sub: "8B 모델, 사용자 1명. 메모리 속도는 그대로다.",
        question: "연산기만 2배 빠른 GPU로 바꾸면 8B 모델 batch 1 생성 속도는 몇 배가 되는가",
        choices: [{ id: "two", text: "약 2배" }, { id: "onefive", text: "약 1.4배" }, { id: "same", text: "거의 그대로" }, { id: "half", text: "오히려 느려짐" }],
        answer: "same",
        why: `거의 그대로다. 표 16 GB를 읽는 ${d3.format(".1f")(m81.tMem * 1e3)} ms가 그대로라 <b>${fmtN(m81.total)} → ${fmtN(model(8, 1, 2).total)} tok/s</b>. 연산기는 원래도 대부분 기다리고 있었다. <span class="ltt-tag">모델로 계산한 예시</span>` },

      { type: "compare", kicker: "세 가지 업그레이드", title: "사용자 1명일 때 무엇이 속도를 올리나", cols: 3,
        sub: "8B 모델 기준 한 가지씩만 바꿨다. 막대는 읽기·계산 시간.",
        items: [
          { label: "연산기 2배", visual: mini(model(8, 1, 2), m81.tMem), tone: "bad", verdict: "×1.0 그대로", noteAfter: true, note: "줄어든 건 원래도 짧던 계산 막대뿐." },
          { label: "메모리 대역폭 2배", visual: mini(model(8, 1, 1, 2), m81.tMem), tone: "good", verdict: "×2.0", noteAfter: true, note: "긴 읽기 막대가 절반이 된다." },
          { label: "모델을 4B로", visual: mini(model(4, 1), m81.tMem), tone: "good", verdict: "×2.0", noteAfter: true, note: "읽을 표가 절반. 양자화(바이트 수 줄이기)도 같은 방향." },
        ],
        basis: "모델로 계산한 예시. " + SRC },

      { kicker: "묶기(batch)", title: "한 번 읽고 여러 명에게 토큰을 나눠 준다",
        sub: "사용자를 묶어도 읽는 양은 같다. 나오는 토큰만 늘어난다.",
        mount: (body) => {
          const f = makeFlow(body);
          const row = document.createElement("div"); row.className = "dk-actions";
          let users = 1;
          [1, 4].forEach((n) => {
            const b = document.createElement("button"); b.textContent = n + "명 묶기";
            b.onclick = () => { users = n; f.loop(n); };
            row.appendChild(b);
          });
          body.appendChild(row);
          return { enter: () => f.loop(users), leave: f.stop };
        } },

      { type: "compare", kicker: "실제 서빙 규모", title: "묶는 인원별로 무엇에 묶이나", cols: 3,
        sub: "같은 GPU, 8B 모델. 처리량과 읽기·계산 막대로 판정해 보자.",
        items: [
          { label: "개인 챗 (1명)", visual: mini(m81, m81.tMem), tone: "", verdict: "메모리에 묶임", noteAfter: true, note: "연산기는 거의 논다." },
          { label: "서버 64명", visual: mini(model(8, 64), m81.tMem), tone: "good", verdict: "메모리에 묶임 · 처리량 64배", noteAfter: true, note: "같은 읽기로 64토큰. 한 사람 속도는 그대로." },
          { label: "서버 512명", visual: mini(model(8, 512), model(8, 512).tComp), tone: "warn", verdict: "연산에 묶임", noteAfter: true, note: "약 295명을 넘으면 계산이 읽기보다 길어 한 사람 속도가 떨어진다." },
        ],
        tex: "t_{\\text{token}}=\\max\\!\\left(\\frac{\\text{가중치 바이트}}{\\text{대역폭}},\\ \\frac{2\\times\\text{파라미터}\\times\\text{batch}}{\\text{연산 속도}}\\right),\\quad \\text{꺾이는 batch}=\\frac{989}{3.35}\\approx 295",
        basis: "모델로 계산한 예시. 막대 길이는 카드마다 가장 긴 막대 기준. " + SRC },

      { type: "explain", kicker: "주의", title: "batch가 만능은 아니다", arrows: false,
        steps: [
          { icon: "🙋", title: "한 사람 속도는 그대로", text: "batch는 전체 처리량을 올린다. 개인 체감 속도는 오르지 않는다." },
          { icon: "📉", title: "약 295를 넘으면", text: "계산이 읽기보다 길어져 오히려 한 스텝이 느려진다." },
          { icon: "🧠", title: "대화 기록 공간", text: "사용자마다 KV cache가 HBM을 차지해 무한히 묶을 수 없다. single-gpu-transformer에서 다룬다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "메모리 대역폭 병목", en: "memory-bound decode" },
          { ko: "루프라인 모델", en: "roofline model" },
          { ko: "배치 처리", en: "batching / continuous batching" },
        ],
        signals: [
          "GPU 사양표에서 TFLOPS만 보고 생성 속도를 기대할 때",
          "사용자 한 명 응답이 느린데 GPU 사용률은 낮게 나올 때",
          "서버 처리량과 개인 응답 속도가 따로 노는 것 같을 때",
        ],
        queries: ["LLM decode memory bandwidth bound", "roofline model GPU inference", "tokens per second HBM bandwidth", "continuous batching LLM serving", "weight quantization decode speed"],
        neighbors: [
          { term: "연산 병목", diff: "compute-bound. 긴 프롬프트 처리(prefill)나 큰 batch에서 생긴다." },
          { term: "지연 vs 처리량", diff: "latency는 한 사람 속도, throughput은 전체 토큰 수. batch는 뒤쪽만 올린다." },
        ] },
    ],
  });
</script>
</body>
</html>
