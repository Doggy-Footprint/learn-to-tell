<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모델을 GPU 여러 장에 쪼개면 무엇이 병목이 될까?</title>
<script type="application/json" id="ltt-meta">{"domain":"gpu","topic":"multi-gpu-nvlink","audience":"Transformer 세부는 모름. 층마다 결과를 합쳐야 한다는 정도만 안다","pattern":["hook","explain","flow","predict","compare","compare","explain","keywords"],"mode":"체험형: 두 쪼개기 방식의 패킷 흐름을 링크 속도별로 보고 병목을 예측한다","decision":"모델을 나누는 방식(텐서 병렬 vs 파이프라인 병렬)과 GPU 사이 통신 경로(NVLink vs PCIe) 선택"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  :root { --cmp: #e0a33a; --comm: #d6455d; }
  .two { display: grid; gap: 8px 24px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .two b { font-size: 14px; }
  .two svg { max-height: 22vh; }
  .fit { max-width: 520px; width: 100%; }
  .st { width: 100%; display: grid; gap: 6px; font-size: 13px; }
  .st .ltt-bar span { font-size: 12px; white-space: nowrap; }
  .big { font-size: 26px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { .big { font-size: 17px; } .st { font-size: 11px; } }
  .big small { display: block; font-size: 12px; font-weight: 600; color: var(--ltt-muted); }
  .dk-avis .big { font-size: 18px; } .dk-avis .big small { display: none; }
</style>
</head>
<body>
<script>
  // 손으로 계산한 기대값 (모델 코드보다 먼저)
  // N=8, T=2048: 합치기 1회 = 2048*8192*2 = 33,554,432 B; ring 계수 2*7/8 = 1.75 -> 58,720,256 B; 160회 -> 9.3952e9 B
  //   NVLink 통신 = 9.3952e9 / 450e9 = 20.878 ms, PCIe = 9.3952e9 / 64e9 = 146.80 ms
  //   읽기 = 17.5e9 / 3.35e12 = 5.2239 ms, 계산 = 2*70e9*2048/8/989e12 = 3.584e13/9.89e14 = 36.238 ms -> GPU 시간 36.238 ms
  //   총: NVLink 57.116 ms, PCIe 183.04 ms, 배수 3.2047
  // N=8, T=1: 통신 4,587,520 B -> NVLink 10.195 us, PCIe 71.68 us; 읽기 5.2239 ms가 GPU 시간 -> 배수 (5.2239+0.07168)/(5.2239+0.010195)=1.0117
  // 파이프라인 N=8, T=1: 8 * (17.5e9/3.35e12) = 41.791 ms + 7*16384/450e9 = 0.000255 ms
  // 계산이 읽기를 넘는 토큰 수 = 989/3.35 = 295.2
  const EXPECTED_BY_HAND = { nvC: 20.878, pcC: 146.80, mem: 5.2239, comp: 36.238, ratio2048: 3.2047, ratio1: 1.0117, pp1: 41.7913, ridgeT: 295.2 };

  const BW = 3.35e12, FLOPS = 989e12, NV = 450e9, PC = 64e9;
  const LAYERS = 80, HID = 8192, PARAMS = 70e9, WBYTES = 140e9;
  const gpuTime = (N, T) => Math.max(WBYTES / N / BW, (2 * PARAMS * T) / N / FLOPS);
  const commBytes = (N, T) => LAYERS * 2 * (2 * (N - 1) / N) * (T * HID * 2);
  const tp = (N, T, bw) => { const g = gpuTime(N, T), c = commBytes(N, T) / bw; return { g, c, total: g + c }; };
  const pp = (N, T, bw) => N * gpuTime(N, T) + ((N - 1) * T * HID * 2) / bw;
  const a = tp(8, 2048, NV), b = tp(8, 2048, PC);
  LTT.expect("NVLink 통신 ms", a.c * 1e3, EXPECTED_BY_HAND.nvC, { tol: 1e-3 });
  LTT.expect("PCIe 통신 ms", b.c * 1e3, EXPECTED_BY_HAND.pcC, { tol: 1e-2 });
  LTT.expect("읽기 ms", (WBYTES / 8 / BW) * 1e3, EXPECTED_BY_HAND.mem, { tol: 1e-3 });
  LTT.expect("계산 ms", ((2 * PARAMS * 2048) / 8 / FLOPS) * 1e3, EXPECTED_BY_HAND.comp, { tol: 1e-3 });
  LTT.expect("T=2048 배수", b.total / a.total, EXPECTED_BY_HAND.ratio2048, { tol: 1e-3 });
  LTT.expect("T=1 배수", tp(8, 1, PC).total / tp(8, 1, NV).total, EXPECTED_BY_HAND.ratio1, { tol: 1e-3 });
  LTT.expect("파이프라인 T=1 ms", pp(8, 1, NV) * 1e3, EXPECTED_BY_HAND.pp1, { tol: 1e-3 });
  LTT.expect("계산=읽기 토큰 수", FLOPS / BW, EXPECTED_BY_HAND.ridgeT, { tol: 0.1 });

  const ms = (s) => (s * 1e3 < 1 ? d3.format(".2f")(s * 1e3) : d3.format(".1f")(s * 1e3)) + " ms";
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const SRC = "H100 SXM 데이터시트 기준 HBM3 약 3.35 TB/s, BF16 dense 약 989 TFLOPS, NVLink 4 약 900 GB/s(양방향 합 → 한 방향 450 GB/s), PCIe Gen5 x16 약 64 GB/s (작성 시 원문 재확인 안 함). Llama-3-70B 규격(80층, 은닉 8192)에 파라미터 70B로 단순화. 통신 지연(latency)·실제 효율은 모델에 없다(불확실).";

  const step = (r, top) => (node) => {
    const w = document.createElement("div"); w.className = "st";
    w.innerHTML = `<div class="big">${ms(r.total)}<small>토큰 한 스텝</small></div><div></div><div>계산 ${ms(r.g)} · 통신 ${ms(r.c)}</div>`;
    node.appendChild(w);
    LTT.bar(w.children[1], [{ color: "var(--cmp)" }, { color: "var(--comm)" }, { color: "var(--ltt-line)" }])
      .set([r.g, r.c, top - r.total], [r.g / top > 0.15 ? "계산" : "", r.c / top > 0.15 ? "통신" : "", ""]);
  };

  const gpuNodes = (subs) => Object.fromEntries(subs.map((s, i) => ["g" + i, { x: 6 + i * 116, y: 20, w: 96, h: 58, label: "GPU " + (i + 1), sub: s }]));
  const chain = [{ from: "g0", to: "g1" }, { from: "g1", to: "g2" }, { from: "g2", to: "g3" }];

  LTT.deck({
    title: "모델을 GPU 여러 장에 쪼개면 무엇이 병목이 될까?",
    scenes: [
      { type: "hook", art: "🧩",
        text: "70B 모델은 140 GB.<br>GPU 한 장(80 GB)에 <u>안 들어간다</u>.",
        sub: "여러 장에 나눠 올릴 때 나누는 방식과 GPU 사이 길(NVLink인지 PCIe인지)을 정하는 이야기.",
        mount: (body) => {
          const d = document.createElement("div"); d.className = "fit"; body.appendChild(d);
          LTT.bar(d, [{ color: "var(--ltt-good)", label: "GPU 1장 80 GB" }, { color: "var(--ltt-bad)", label: "못 들어가는 60 GB" }]).set([80, 60]);
          return {};
        } },

      { type: "explain", kicker: "두 가지 쪼개기", title: "층을 가로로 자를까, 세로로 묶을까",
        steps: [
          { icon: "🍰", title: "텐서 병렬 (TP)", text: "모든 층을 N조각으로 나눠 GPU마다 1조각. 층이 끝날 때마다 부분 결과를 모두 합친다(all-reduce)." },
          { icon: "🚂", title: "파이프라인 병렬 (PP)", text: "층 묶음을 GPU마다 배정. 계산 결과를 다음 GPU로 한 번 넘긴다." },
        ], arrows: false },

      { kicker: "흐름 보기", title: "합치기 vs 넘기기, 길이 느려지면?",
        sub: "그림은 GPU 4장. 패킷 이동 시간은 링크 대역폭 비(450 / 64 ≈ 7)를 따른다.",
        mount: (body) => {
          body.innerHTML = `<div class="dk-actions"><button data-bw="nv">NVLink</button><button data-bw="pc" class="ghost">PCIe (약 7배 느림)</button></div>
            <div class="two"><div><b>텐서 병렬: 층마다 모두 합친다 (70B는 160번)</b></div><div><b>파이프라인 병렬: 다음 GPU로 넘긴다</b></div></div>`;
          const [c1, c2] = body.querySelectorAll(".two > div");
          const s1 = svgEl(), s2 = svgEl(); c1.appendChild(s1); c2.appendChild(s2);
          const tpf = LTT.flow(s1, { viewBox: "0 0 450 100", nodes: gpuNodes(["층마다 1/4", "층마다 1/4", "층마다 1/4", "층마다 1/4"]), links: chain });
          const ppf = LTT.flow(s2, { viewBox: "0 0 450 100", nodes: gpuNodes(["층 1–20", "층 21–40", "층 41–60", "층 61–80"]), links: chain });
          let bw = NV, run = 0;
          const hop = (count) => ({ count, ms: (250 * NV) / bw, gap: 110 });
          const go = async () => {
            const id = ++run; tpf.clear(); ppf.clear();
            tpf.highlight(["g0", "g1", "g2", "g3"]);
            const pass = async () => { for (let i = 0; i < 3 && id === run; i++) { ppf.highlight(["g" + i, "g" + (i + 1)]); await ppf.send("g" + i, "g" + (i + 1), hop(1)); } };
            while (id === run) {
              pass();
              await Promise.all([[0, 1], [1, 2], [2, 3], [1, 0], [2, 1], [3, 2]].map(([i, j]) => tpf.send("g" + i, "g" + j, hop(3))));
              await new Promise((r) => setTimeout(r, 300));
              if (!LTT.MOTION_MS) return;
            }
          };
          body.querySelectorAll("[data-bw]").forEach((btn) => btn.onclick = () => {
            bw = btn.dataset.bw === "nv" ? NV : PC;
            body.querySelectorAll("[data-bw]").forEach((o) => o.classList.toggle("ghost", o !== btn));
            go();
          });
          return { enter: go, leave: () => { run++; tpf.clear(); ppf.clear(); } };
        },
        basis: "패킷 수는 연출이며 실제 바이트 비를 나타내지 않는다." },

      { type: "predict", kicker: "짐작해 보기", title: "텐서 병렬 8장, 길을 PCIe로 바꾸면 무엇이 병목?",
        sub: "긴 프롬프트(토큰 2048개)를 한 스텝에 처리하는 상황.",
        question: "텐서 병렬 8-way에서 NVLink 대신 PCIe를 쓰면 무엇이 병목인가",
        choices: [{ id: "hbm", text: "GPU 메모리(HBM) 용량" }, { id: "comp", text: "GPU 연산 속도" }, { id: "comm", text: "GPU 사이 통신(합치기)" }, { id: "count", text: "GPU 개수" }],
        answer: "comm",
        answerVisual(node) {
          node.innerHTML = `<div class="two" style="grid-template-columns:1fr 1fr"><div><b>NVLink</b></div><div><b>PCIe</b></div></div>`;
          const [x, y] = node.querySelectorAll(".two > div");
          step(a, b.total)(x); setTimeout(() => step(b, b.total)(y), 500);
        },
        why: `통신이다. 계산은 ${ms(a.g)}로 그대로인데 통신이 ${ms(a.c)}(NVLink)에서 ${ms(b.c)}(PCIe)로 늘어 전체가 <b>${d3.format(".1f")(b.total / a.total)}배</b> 느려진다. <span class="ltt-tag">모델로 계산한 예시</span>` },

      { type: "compare", kicker: "같은 8장, 다른 길과 일", title: "언제 통신이 시간을 먹나", cols: 3,
        sub: "텐서 병렬 8-way. 막대 길이는 세 카드 공통 기준(가장 긴 스텝).",
        items: [
          { label: "NVLink · 프롬프트 2048토큰", visual: step(a, b.total), tone: "good", verdict: "기준" },
          { label: "PCIe · 프롬프트 2048토큰", visual: step(b, b.total), tone: "bad", verdict: "약 3.2배 느림", noteAfter: true, note: "통신이 계산보다 길다." },
          { label: "PCIe · 답변 토큰 1개", visual: step(tp(8, 1, PC), b.total), tone: "warn", verdict: "바이트로는 차이 1% 남짓", noteAfter: true, note: "160번 합치는 지연(latency)은 모델 밖. 실제로는 더 클 수 있다(미검증)." },
        ],
        basis: "모델로 계산한 예시. " + SRC },

      { type: "compare", kicker: "답변 생성 지연", title: "요청 하나, 토큰 하나를 만드는 데 걸리는 시간",
        sub: "GPU 8장, 토큰 1개 스텝. 막대 길이는 두 카드 공통 기준.",
        items: [
          { label: "텐서 병렬 · NVLink", visual: step(tp(8, 1, NV), pp(8, 1, NV)), tone: "good", verdict: "짧다", noteAfter: true, note: "8장이 동시에 1/8씩 읽는다." },
          { label: "파이프라인 병렬 · NVLink", visual: step({ g: pp(8, 1, NV), c: 0, total: pp(8, 1, NV) }, pp(8, 1, NV)), tone: "warn", verdict: "약 8배 길다", noteAfter: true, note: "한 번에 한 장씩만 일하고 나머지는 쉰다. 통신은 거의 없다." },
        ],
        basis: "모델로 계산한 예시. 파이프라인은 마이크로배치 없이 요청 하나일 때다. " + SRC },

      { type: "explain", kicker: "선택 기준", title: "길이 나누는 방식을 정한다", arrows: false,
        tex: "\\text{통신량}=80\\ \\text{층}\\times 2\\ \\text{회}\\times\\frac{2(N-1)}{N}\\times(\\text{토큰 수}\\times 8192\\times 2\\ \\text{B}),\\quad t=\\max(\\text{읽기},\\text{계산})+\\text{통신}",
        steps: [
          { icon: "🔗", title: "같은 서버(NVLink)", text: "텐서 병렬. 읽는 표가 GPU당 1/N이 되어 지연이 줄어든다." },
          { icon: "🌐", title: "느린 길(서버 사이)", text: "통신이 적은 파이프라인 병렬. 대신 요청이 적으면 GPU들이 번갈아 쉰다." },
          { icon: "⚠️", title: "PCIe + 텐서 병렬", text: "토큰이 많은 구간(프롬프트 처리)에서 통신이 계산을 압도한다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "텐서 병렬", en: "tensor parallelism" },
          { ko: "파이프라인 병렬", en: "pipeline parallelism" },
          { ko: "올리듀스", en: "all-reduce / NVLink" },
        ],
        signals: [
          "모델 가중치가 GPU 한 장 메모리보다 클 때",
          "GPU를 늘렸는데 속도가 비례해 오르지 않을 때",
          "클라우드 인스턴스 사양에 NVLink/NVSwitch 유무가 나뉠 때",
        ],
        queries: ["tensor parallel vs pipeline parallel inference", "all-reduce communication volume ring", "NVLink vs PCIe tensor parallel", "Megatron-LM tensor parallelism", "pipeline bubble microbatch"],
        neighbors: [
          { term: "데이터 병렬", diff: "모델 전체를 GPU마다 복제해 요청을 나눈다. 모델이 한 장에 들어갈 때만 가능." },
          { term: "전문가 병렬", diff: "MoE의 expert를 GPU에 나눈다. 통신은 all-to-all이다." },
        ] },
    ],
  });
</script>
</body>
</html>
