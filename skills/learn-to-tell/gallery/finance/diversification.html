<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>두 자산을 섞으면 위험은 얼마나 줄까?</title>
<script type="application/json" id="ltt-meta">{"domain":"경제·금융","topic":"분산투자와 상관계수","audience":"표준편차를 변동성(위험)으로 읽을 줄 아는 사람","pattern":["hook","terms","figure","predict","compare:table","bars:full","bars","statement","summary","keywords"],"theme":"ledger","medium":"경제 신문 차트·표","mode":"체험형: 용어를 풀고 엇갈림이 상쇄를 만드는 모습을 신문식 꺾은선으로 단계별로 본 뒤, 섞은 변동성을 짐작하고 100칸으로 답을 본다","decision":"자산 간 상관계수와 비중이 포트폴리오 변동성을 얼마나 줄이는지"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>

<style>
  .ltt-cf text { font-family: var(--ltt-mono); font-size: 13px; fill: var(--ltt-muted); }
  .ltt-cf .grid line { stroke: var(--ltt-line-2); stroke-width: 1; }
  .ltt-cf .zero { stroke: var(--ltt-ink); stroke-width: 1.2; }
  .spark svg { width: 220px; max-width: 100%; height: auto; }
  .wl { display: flex; gap: 14px; font-size: 13px; color: var(--ltt-muted); margin-top: 6px; }
  .tv { width: 100%; max-width: 240px; max-height: 110px; }
  .tv text { font: 700 12px var(--ltt-font); fill: var(--ltt-ink-2); }
  .wl i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body>
<script>
  // EXPECTED_BY_HAND (모델 코드보다 먼저 손계산. σ1=σ2=20, 분산 0.04 기준)
  // w=.5, ρ=.3: .25*.04 + .25*.04 + 2*.25*.3*.04 = .01+.01+.006 = .026 -> sqrt = 16.1245%
  // w=.5, ρ=1: 분산 .04 -> 20%.  w=.5, ρ=-1: .01+.01-.02 = 0 -> 0%.  ρ=0: .02 -> 14.1421%
  // N=10, ρ=.3: .04*(.1+.9*.3) = .0148 -> 12.1655%.  N->inf: sqrt(.3)*20 = 10.9545%
  // ρ=.8, w=.5: .02+2*.25*.8*.04 = .036 -> 18.9737%.  하한 sqrt(.8)*20 = 17.8885%
  // 기대수익률 w=.5: .5*8+.5*5 = 6.5%
  const EXPECTED_BY_HAND = { base: 16.1245, rho1: 20, rhoM1: 0, rho0: 14.1421, n10: 12.1655, floor: 10.9545, crisis: 18.9737, crisisFloor: 17.8885, ret: 6.5 };
  const S = 20, MU1 = 8, MU2 = 5;
  const vol = (w, rho) => Math.sqrt(Math.max(0, w * w * S * S + (1 - w) ** 2 * S * S + 2 * w * (1 - w) * rho * S * S));
  const volN = (n, rho) => S * Math.sqrt(1 / n + (1 - 1 / n) * rho);
  const floorVol = (rho) => S * Math.sqrt(Math.max(rho, 0));
  const ret = (w) => w * MU1 + (1 - w) * MU2;
  LTT.expect("w=.5 ρ=.3", vol(0.5, 0.3), EXPECTED_BY_HAND.base, { tol: 1e-3 });
  LTT.expect("ρ=1", vol(0.5, 1), EXPECTED_BY_HAND.rho1, { tol: 1e-9 });
  LTT.expect("ρ=-1", vol(0.5, -1), EXPECTED_BY_HAND.rhoM1, { tol: 1e-6 });
  LTT.expect("ρ=0", vol(0.5, 0), EXPECTED_BY_HAND.rho0, { tol: 1e-3 });
  LTT.expect("N=10 ρ=.3", volN(10, 0.3), EXPECTED_BY_HAND.n10, { tol: 1e-3 });
  LTT.expect("하한 ρ=.3", floorVol(0.3), EXPECTED_BY_HAND.floor, { tol: 1e-3 });
  LTT.expect("위기 ρ=.8", vol(0.5, 0.8), EXPECTED_BY_HAND.crisis, { tol: 1e-3 });
  LTT.expect("위기 하한", floorVol(0.8), EXPECTED_BY_HAND.crisisFloor, { tol: 1e-3 });
  LTT.expect("기대수익률", ret(0.5), EXPECTED_BY_HAND.ret, { tol: 1e-9 });

  const f1 = d3.format(".1f"), pc = (v) => f1(v) + "%";
  // Two equal-amplitude sines with phase gap acos(ρ) have correlation ρ, so their average has amplitude √((1+ρ)/2) — the same ratio as vol(0.5, ρ)/σ.
  function waves(node, rho) {
    const VW = 240, VH = 100, phi = Math.acos(rho), xs = d3.range(0, 4 * Math.PI, 0.1);
    const svg = d3.select(node).append("svg").attr("class", "ltt-svg").attr("viewBox", `0 0 ${VW} ${VH}`);
    const x = d3.scaleLinear([0, 4 * Math.PI], [0, VW]), y = (v) => VH / 2 - v * 40;
    const path = (f, c, wd, op) => svg.append("path").attr("fill", "none").attr("stroke", c).attr("stroke-width", wd).attr("opacity", op)
      .attr("d", d3.line().x(x).y((t) => y(f(t)))(xs));
    path((t) => Math.sin(t), "var(--ltt-muted)", 2, 0.6);
    path((t) => Math.sin(t + phi), "var(--ltt-warn)", 2, 0.6);
    const avg = path((t) => (Math.sin(t) + Math.sin(t + phi)) / 2, "var(--ltt-accent)", 3.5, 1);
    const len = avg.node().getTotalLength();
    avg.attr("stroke-dasharray", len).attr("stroke-dashoffset", len).transition().duration(LTT.MOTION_MS * 2).attr("stroke-dashoffset", 0);
  }
  const rhoItem = (label, rho, tone, note) => ({ label, tone, verdict: "변동성 " + pc(vol(0.5, rho)), noteAfter: true, note,
    visual: (n) => { n.classList.add("spark"); waves(n, rho); } });

  const np = (title, dek, source) => LTT.chartFrame({ title, dek, source });

  // Fixed 0–20% axis, so every chart in the lesson is measured against the unmixed 20%.
  const volBars = (title, dek, rows) => (body) => {
    const f = np(title, dek, "계산: 변동성 20%짜리 자산, 모델로 계산한 예시");
    body.appendChild(f.el);
    const bars = LTT.hbars(f.el, { domain: [0, 20], ticks: [0, 5, 10, 15, 20], tickFormat: (t) => (t === 20 ? "20%" : t), fmt: pc,
      rows: rows.map(([label, value, tone]) => ({ label, value, tone })) });
    f.foot();
    return { enter: bars.play };
  };

  const LEG = `<div class="wl"><span><i style="background:var(--ltt-muted)"></i>자산 A</span><span><i style="background:var(--ltt-warn)"></i>자산 B</span><span><i style="background:var(--ltt-accent);height:4px"></i>반반 섞은 결과</span></div>`;

  const tv = (inner) => `<svg class="tv" viewBox="0 0 220 100" role="img">${inner}</svg>`;
  const sinPath = (x0, w, y0, amp, phase) => d3.range(0, 3 * Math.PI + 0.01, 0.15)
    .map((t, i) => (i ? "L" : "M") + (x0 + t / (3 * Math.PI) * w).toFixed(1) + "," + (y0 - amp * Math.sin(t + phase)).toFixed(1)).join("");
  const TERM_PORTFOLIO = tv(`<path d="M20,22v-8H200v8" style="fill:none;stroke:var(--ltt-ink-2);stroke-width:1.5"/><text x="110" y="10" text-anchor="middle">한 묶음</text>`
    + `<rect x="20" y="30" width="90" height="34" style="fill:var(--ltt-accent)"/><rect x="110" y="30" width="90" height="34" style="fill:var(--ltt-warn)"/>`
    + `<text x="65" y="84" text-anchor="middle">주식 50%</text><text x="155" y="84" text-anchor="middle">채권 50%</text>`);
  const TERM_VOL = tv(`<rect x="34" y="22" width="150" height="56" style="fill:var(--ltt-card-2)"/>`
    + `<line x1="34" x2="184" y1="50" y2="50" style="stroke:var(--ltt-muted);stroke-dasharray:4 3"/><text x="30" y="54" text-anchor="end" style="fill:var(--ltt-muted)">평균</text>`
    + `<polyline points="34,50 46,30 58,64 70,38 82,74 94,26 106,58 118,44 130,72 142,28 154,60 166,40 178,66 184,50" style="fill:none;stroke:var(--ltt-ink);stroke-width:2"/>`
    + `<path d="M190,22h6v56h-6" style="fill:none;stroke:var(--ltt-accent);stroke-width:1.5"/><text x="200" y="54" style="fill:var(--ltt-accent)">±</text>`
    + `<text x="110" y="94" text-anchor="middle">평균에서 벗어나는 폭</text>`);
  const TERM_CORR = tv([[1, "ρ = 1", 0], [0, "ρ = 0", Math.PI / 2], [-1, "ρ = −1", Math.PI]].map(([, label, ph], i) => {
    const x0 = 8 + i * 72;
    return `<path d="${sinPath(x0, 60, 40, 22, 0)}" style="fill:none;stroke:var(--ltt-muted);stroke-width:2"/>`
      + `<path d="${sinPath(x0, 60, 40, 22, ph)}" style="fill:none;stroke:var(--ltt-warn);stroke-width:2;stroke-dasharray:${ph ? "none" : "5 4"}"/>`
      + `<text x="${x0 + 30}" y="90" text-anchor="middle">${label}</text>`;
  }).join(""));

  function waveFigure(stage) {
    const f = np("두 자산과 반반 섞은 포트폴리오, 상관계수 0", "평균에서 벗어난 정도, 도식", "실제 수익률 경로가 아니라 상관만 보이려고 그린 도식");
    stage.appendChild(f.el);
    f.el.insertAdjacentHTML("beforeend", LEG);
    const W = 820, H = 280, L = 60, xs = d3.range(0, 4 * Math.PI + 0.05, 0.05), phi = Math.acos(0), amp = Math.sqrt(0.5);
    const x = d3.scaleLinear([0, 4 * Math.PI], [L, W - 150]), y = d3.scaleLinear([-1.2, 1.2], [H - 10, 10]);
    const svg = d3.select(f.el).append("svg").attr("viewBox", `0 0 ${W} ${H}`);
    const grid = svg.append("g").attr("class", "grid");
    [-1, 1].forEach((v) => grid.append("line").attr("x1", L).attr("x2", W - 150).attr("y1", y(v)).attr("y2", y(v)));
    svg.append("line").attr("class", "zero").attr("x1", L).attr("x2", W - 150).attr("y1", y(0)).attr("y2", y(0));
    svg.append("text").attr("x", L - 10).attr("y", y(0) + 4).attr("text-anchor", "end").text("평균");
    svg.append("text").attr("x", L - 10).attr("y", y(1) + 4).attr("text-anchor", "end").text("+");
    svg.append("text").attr("x", L - 10).attr("y", y(-1) + 4).attr("text-anchor", "end").text("−");
    const line = (fn) => d3.line().x(x).y((t) => y(fn(t)))(xs);
    const pa = svg.append("path").attr("d", line(Math.sin)).style("fill", "none").style("stroke", "var(--ltt-muted)").style("stroke-width", 2.5);
    const pb = svg.append("path").attr("d", line((t) => Math.sin(t + phi))).style("fill", "none").style("stroke", "var(--ltt-warn)").style("stroke-width", 2.5);
    const pm = svg.append("path").attr("d", line((t) => (Math.sin(t) + Math.sin(t + phi)) / 2)).style("fill", "none").style("stroke", "var(--ltt-accent)").style("stroke-width", 4);
    const len = pm.node().getTotalLength();
    const guides = svg.append("g");
    [[1, "자산 하나의 흔들림", "var(--ltt-muted)"], [amp, "섞은 결과의 흔들림", "var(--ltt-accent)"]].forEach(([v, t, c]) => {
      guides.append("line").attr("x1", L).attr("x2", W - 150).attr("y1", y(v)).attr("y2", y(v)).style("stroke", c).style("stroke-width", 1.5).style("stroke-dasharray", "4 4");
      guides.append("text").attr("x", W - 142).attr("y", y(v) + 4).text(t).style("fill", c).style("font-family", "var(--ltt-font)").style("font-weight", 700);
    });
    const ms = LTT.MOTION_MS, show = (sel, on) => sel.transition().duration(ms / 2).style("opacity", on ? 1 : 0.3);
    const steps = [
      { caption: "<b>① 각자 흔들린다</b> — 두 자산 모두 {{변동성}} 20%라고 둔다(계산용 가정). 올랐다 내렸다를 반복한다.",
        enter: () => { show(pa, 1); show(pb, 1); pm.interrupt().attr("stroke-dasharray", len).attr("stroke-dashoffset", len); guides.style("opacity", 0); } },
      { caption: "<b>② 엇갈린 만큼 상쇄</b> — 한쪽이 오를 때 다른 쪽이 덜 오르거나 내리면, 둘을 합친 값은 덜 흔들린다.",
        enter: () => { show(pa, 0); show(pb, 0); guides.style("opacity", 0); pm.attr("stroke-dasharray", len).attr("stroke-dashoffset", len).transition().duration(ms * 2).attr("stroke-dashoffset", 0); } },
      { caption: "<b>③ 얼마나 엇갈리나가 결정</b> — {{상관계수}}가 1이면 상쇄가 없고, 0이면 꽤 상쇄되고, −1이면 완전히 상쇄된다. 이 그림은 0인 경우다.",
        enter: () => { show(pa, 0); show(pb, 0); pm.interrupt().attr("stroke-dashoffset", 0); guides.transition().duration(ms).style("opacity", 1); } },
    ];
    LTT.stepper(f.el, steps, { interval: 2600 });
    f.foot();
  }

  function overviewFigure(stage) {
    const host = document.createElement("div");
    host.className = "ltt-cf";
    stage.appendChild(host);
    const GAP = 24, ZW = 320, ZH = 270, W = 4 * ZW + 3 * GAP, H = ZH, BX = 118, BW = 120, UNIT = BW / S;
    const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${W} ${H}`).style("width", "100%").style("height", "auto");
    const ink = (sel, c) => sel.style("fill", c).style("font-family", "var(--ltt-font)");
    const zone = (n, x, head, foot) => {
      const g = svg.append("g").attr("transform", `translate(${x},0)`);
      g.append("rect").attr("width", ZW).attr("height", ZH).attr("rx", 8).style("fill", "var(--ltt-card-2)");
      g.append("circle").attr("cx", 24).attr("cy", 26).attr("r", 13).style("fill", "var(--ltt-accent)");
      ink(g.append("text").attr("x", 24).attr("y", 31).attr("text-anchor", "middle").text(n), "var(--ltt-on-accent)").style("font-weight", 700).style("font-size", "18px");
      ink(g.append("text").attr("x", 46).attr("y", 31).text(head), "var(--ltt-ink)").style("font-weight", 700).style("font-size", "20px");
      foot.forEach((line, i) => ink(g.append("text").attr("x", 16).attr("y", ZH - 38 + i * 22).text(line), "var(--ltt-ink-2)").style("font-weight", 700).style("font-size", "18px"));
      return g;
    };
    const ref = (g) => g.append("line").attr("x1", BX + BW).attr("x2", BX + BW).attr("y1", 48).attr("y2", 48 + 4 * 34).style("stroke", "var(--ltt-muted)").style("stroke-dasharray", "4 4");
    const bars = (g, rows) => (ref(g), rows).forEach(([label, v, c], i) => {
      const y = 58 + i * 34;
      ink(g.append("text").attr("x", BX - 10).attr("y", y + 18).attr("text-anchor", "end").text(label), "var(--ltt-ink-2)").style("font-size", "18px");
      g.append("rect").attr("x", BX).attr("y", y).attr("width", Math.max(v * UNIT, 2)).attr("height", 24).style("fill", c);
      ink(g.append("text").attr("x", BX + v * UNIT + 8).attr("y", y + 19).text(pc(v)), "var(--ltt-ink)").style("stroke", "var(--ltt-card-2)").style("stroke-width", 4).style("paint-order", "stroke").style("font-family", "var(--ltt-mono)").style("font-size", "18px");
    });

    const a = zone("1", 0, "엇갈린 만큼 상쇄된다", ["줄어드는 위험은", "엇갈린 만큼이다"]);
    const wx = d3.scaleLinear([0, 4 * Math.PI], [24, ZW - 24]), wy = d3.scaleLinear([-1.2, 1.2], [176, 60]), xs = d3.range(0, 4 * Math.PI + 0.05, 0.05);
    const wl = (fn, c, wd) => a.append("path").attr("d", d3.line().x(wx).y((t) => wy(fn(t)))(xs)).style("fill", "none").style("stroke", c).style("stroke-width", wd);
    a.append("line").attr("x1", 24).attr("x2", ZW - 24).attr("y1", wy(0)).attr("y2", wy(0)).style("stroke", "var(--ltt-line-2)");
    wl(Math.sin, "var(--ltt-muted)", 2).style("opacity", 0.7);
    wl((t) => Math.cos(t), "var(--ltt-warn)", 2).style("opacity", 0.7);
    wl((t) => (Math.sin(t) + Math.cos(t)) / 2, "var(--ltt-accent)", 4);
    ink(a.append("text").attr("x", ZW - 16).attr("y", 56).attr("text-anchor", "end").text("A·B는 엇갈려 움직임"), "var(--ltt-muted)").style("font-size", "17px");
    ink(a.append("text").attr("x", ZW - 16).attr("y", 208).attr("text-anchor", "end").text("섞으면 폭이 줄어듦"), "var(--ltt-accent)").style("font-size", "17px").style("font-weight", 700);

    const b = zone("2", ZW + GAP, "짝에 따라 크기가 다르다", ["고를 때는 같이 움직이는", "정도를 먼저 본다"]);
    bars(b, [["ρ = 1", vol(0.5, 1), "var(--ltt-bad)"], ["ρ = 0.3", vol(0.5, 0.3), "var(--ltt-warn)"], ["ρ = 0", vol(0.5, 0), "var(--ltt-good)"], ["ρ = −1", vol(0.5, -1), "var(--ltt-good)"]]);

    const c = zone("3", 2 * (ZW + GAP), "계속 더해도 바닥이 있다", ["줄일 수 있는 위험에는", "바닥이 있다"]);
    bars(c, [["N = 1", S, "var(--ltt-muted)"], ["N = 2", volN(2, 0.3), "var(--ltt-accent)"], ["N = 10", volN(10, 0.3), "var(--ltt-accent)"], ["N → ∞ 바닥", floorVol(0.3), "var(--ltt-ink-2)"]]);

    const d = zone("4", 3 * (ZW + GAP), "위기 때는 같이 떨어진다", ["분산 효과는 위기 때", "가장 약해진다"]);
    bars(d, [["평시 ρ=0.3", vol(0.5, 0.3), "var(--ltt-accent)"], ["위기 ρ=0.8", vol(0.5, 0.8), "var(--ltt-bad)"], ["위기 바닥", floorVol(0.8), "var(--ltt-ink-2)"]]);
    ink(d.append("text").attr("x", BX + BW + 4).attr("y", 44).text("20%"), "var(--ltt-muted)").style("font-size", "16px");
  }

  LTT.deck({
    title: "두 자산을 섞으면 위험은 얼마나 줄까?",
    theme: "ledger",
    glossary: {
      "체계적 위험": "시장 전체가 함께 움직여서 생기는 위험. 자산을 아무리 많이 섞어도 없어지지 않는다(경기 침체, 금리 변화 등).",
    },
    scenes: [
      { type: "hook", art: "chart", kicker: "{{포트폴리오}} 비중 정하기",
        pre: "흔들림이 20%인 자산 둘을 반반 섞으면",
        text: "여전히 <u>20%</u>만큼 흔들릴까?",
        sub: "결과를 정하는 것은 두 자산이 '얼마나 같이 움직이나'다. 이 수업을 마치면 섞을 자산을 고를 때 무엇을 물어야 하는지, 섞어도 남는 위험이 무엇인지 말할 수 있다. 투자 조언이 아니라 계산 예시다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "포트폴리오", en: "portfolio", icon: "layers", visual: TERM_PORTFOLIO, plain: "여러 자산을 정한 비중으로 함께 담은 묶음.", example: "주식 ETF 50% + 채권 ETF 50%." },
          { key: "변동성", en: "volatility", icon: "trend", visual: TERM_VOL, plain: "수익률이 평균에서 얼마나 크게 흔들리는지를 표준편차로 잰 값. 클수록 위험하다.", example: "연 변동성 20%면 한 해 수익률이 평균에서 ±20%쯤 흔들리는 게 보통이다." },
          { key: "상관계수", en: "correlation ρ", icon: "link", visual: TERM_CORR, plain: "두 자산이 같은 방향으로 움직이는 정도. 1이면 늘 같이, 0이면 무관, −1이면 늘 반대로.", example: "같은 지수를 따르는 ETF 둘은 거의 1." },
        ] },
