<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행렬은 공간을 어떻게 바꾸는가?</title>
<script type="application/json" id="ltt-meta">{"domain":"선형대수","topic":"행렬 = 공간의 변환, det = 면적 배율, 곱 = 합성","audience":"벡터와 행렬 곱셈 계산 규칙은 안다","pattern":["hook","terms","figure","compare","sweep:split","predict","statement","explain","summary","keywords"],"theme":"paper","medium":"교과서 그림: 크게 그린 격자 변형과 그 옆의 행렬 읽기","mode":"체험형: 용어를 풀고 격자가 변형되는 모습을 보며 열·det·곱 순서를 읽은 뒤, 곱 순서를 짐작해 본다","decision":"행렬의 열(기저 벡터가 가는 곳)과 det로 변환의 모양·면적 배율·가역성을 읽고, 곱 순서를 정한다"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .cmpp svg { max-width: 170px; }
  .cmpp svg, .pl svg, .ab svg { overflow: hidden; border-radius: 14px; }
  .pl { display: grid; gap: 12px 28px; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); align-items: center; width: 100%; }
  .pl svg { max-height: 62vh; }
  .tb { display: grid; gap: 16px clamp(24px, 4vw, 64px); grid-template-columns: minmax(0, 560px) minmax(0, 380px); align-items: center; justify-content: center; width: 100%; }
  .tb svg { max-height: 58vh; overflow: hidden; border-radius: var(--ltt-r-sm); margin: 0 auto; }
  .tb .mx p { margin: 0 0 14px; }
  .tb .mx .lg { font-family: var(--ltt-font-display); font-size: clamp(17px, 1.6vw, 21px); line-height: 1.6; }
  @media (max-width: 720px) { .pl, .tb { grid-template-columns: 1fr; justify-items: center; } .pl svg, .tb svg { max-height: 30vh; } }
  .ord { display: flex; align-items: flex-start; gap: 6px; font-family: var(--ltt-font-display); font-size: clamp(54px, 7vw, 96px); line-height: 1; color: var(--ltt-ink); }
  .ord > span { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ord small { font: 600 14px var(--ltt-mono); color: var(--ltt-muted); white-space: nowrap; }
  .ord .first b { color: var(--ltt-accent); } .ord .first small { color: var(--ltt-accent); }
  .ord b { font-weight: 700; } .ord .pa { color: var(--ltt-muted); font-weight: 400; }
  .mx { font-size: clamp(16px, 1.5vw, 19px); }
  .i-hat { color: var(--ltt-accent); font-weight: 750; } .j-hat { color: var(--ltt-good); font-weight: 750; }
  .sl { display: grid; gap: 0 16px; grid-template-columns: 1fr 1fr; width: 100%; }
  .sl .ltt-param { margin: 0 0 6px; }
  .ab { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; text-align: center; }
  .ab svg { max-height: 26vh; margin: 0 auto; }
</style>
</head>
<body>
<script>
  const EXPECTED_BY_HAND = {
    detA: 2, areaA: 2, rotDet: 1, shearDet: 1, scaleDet: 3, projDet: 0, reflDet: -1,
    iHatA: [2, 0], jHatA: [1, 1],
    AB: [[0, -2], [1, 0]],
    BA: [[0, -1], [2, 0]],
  };
  const det = (m) => m[0][0] * m[1][1] - m[0][1] * m[1][0];
  const mul = (p, q) => [
    [p[0][0] * q[0][0] + p[0][1] * q[1][0], p[0][0] * q[0][1] + p[0][1] * q[1][1]],
    [p[1][0] * q[0][0] + p[1][1] * q[1][0], p[1][0] * q[0][1] + p[1][1] * q[1][1]],
  ];
  const apply = (m, v) => [m[0][0] * v[0] + m[0][1] * v[1], m[1][0] * v[0] + m[1][1] * v[1]];
  const shoelace = (pts) => Math.abs(d3.sum(pts, (p, i) => p[0] * pts[(i + 1) % pts.length][1] - pts[(i + 1) % pts.length][0] * p[1])) / 2;
  const SQUARE = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const A = [[2, 1], [0, 1]], SC = [[2, 0], [0, 1]], RO = [[0, -1], [1, 0]], I = [[1, 0], [0, 1]];
  const rot30 = [[Math.cos(Math.PI / 6), -0.5], [0.5, Math.cos(Math.PI / 6)]];
  LTT.expect("det A", det(A), EXPECTED_BY_HAND.detA, { tol: 1e-9 });
  LTT.expect("정사각형 변환 후 넓이 (shoelace)", shoelace(SQUARE.map((p) => apply(A, p))), EXPECTED_BY_HAND.areaA, { tol: 1e-9 });
  LTT.expect("det 회전 30°", det(rot30), EXPECTED_BY_HAND.rotDet, { tol: 1e-9 });
  LTT.expect("det 전단", det([[1, 1], [0, 1]]), EXPECTED_BY_HAND.shearDet, { tol: 1e-9 });
  LTT.expect("det 스케일(2,1.5)", det([[2, 0], [0, 1.5]]), EXPECTED_BY_HAND.scaleDet, { tol: 1e-9 });
  LTT.expect("det 투영", det([[.5, .5], [.5, .5]]), EXPECTED_BY_HAND.projDet, { tol: 1e-9 });
  LTT.expect("det y=x 반사", det([[0, 1], [1, 0]]), EXPECTED_BY_HAND.reflDet, { tol: 1e-9 });
  LTT.expect("î 도착점 x", apply(A, [1, 0])[0], EXPECTED_BY_HAND.iHatA[0], { tol: 1e-9 });
  LTT.expect("ĵ 도착점 y", apply(A, [0, 1])[1], EXPECTED_BY_HAND.jHatA[1], { tol: 1e-9 });
  LTT.expect("AB[0][1]", mul(SC, RO)[0][1], EXPECTED_BY_HAND.AB[0][1], { tol: 1e-9 });
  LTT.expect("BA[1][0]", mul(RO, SC)[1][0], EXPECTED_BY_HAND.BA[1][0], { tol: 1e-9 });
  LTT.expect("BA[0][1]", mul(RO, SC)[0][1], EXPECTED_BY_HAND.BA[0][1], { tol: 1e-9 });

  const fmt = (x) => { const r = Math.round(x * 100) / 100; return (Object.is(r, -0) ? 0 : r).toString(); };
  const HATS = [{ v: [1, 0], color: "var(--ltt-accent)", label: "î" }, { v: [0, 1], color: "var(--ltt-good)", label: "ĵ" }];
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const mkPlane = (node, range = 4, size = 360) => { const s = svgEl(); node.appendChild(s); return LTT.plane(s, { range, size, vectors: HATS, shape: SQUARE }); };
  const tv = (body) => `<svg class="ltt-svg" viewBox="0 0 220 100" style="max-height:110px">${body}</svg>`;
  const tx = (x, y, s, st = "") => `<text x="${x}" y="${y}" text-anchor="middle" style="${st}">${s}</text>`;
  const arw = (x1, y1, x2, y2, c, w = 2.5) => {
    const a = Math.atan2(y2 - y1, x2 - x1), tip = (t) => [x2 - 8 * Math.cos(a + t), y2 - 8 * Math.sin(a + t)].map((n) => n.toFixed(1));
    return `<line x1="${x1}" y1="${y1}" x2="${(x2 - 6 * Math.cos(a)).toFixed(1)}" y2="${(y2 - 6 * Math.sin(a)).toFixed(1)}" style="stroke:${c};stroke-width:${w}"/><polygon points="${x2},${y2} ${tip(0.45)} ${tip(-0.45)}" style="fill:${c}"/>`;
  };
  const poly = (pts, st) => `<polygon points="${pts.map((p) => p.join(",")).join(" ")}" style="${st}"/>`;
  const gridSvg = (m, ox, oy, u) => {
    const P = (x, y) => { const [a, b] = apply(m, [x, y]); return `${(ox + a * u).toFixed(1)},${(oy - b * u).toFixed(1)}`; };
    return d3.range(4).map((k) => `<path d="M${P(k, 0)}L${P(k, 3)}M${P(0, k)}L${P(3, k)}" style="stroke:var(--ltt-line-2);stroke-width:1.5"/>`).join("")
      + `<circle cx="${ox}" cy="${oy}" r="4" style="fill:var(--ltt-accent)"/>`;
  };
  const TERM_VIS = {
    linear: tv(gridSvg(I, 12, 84, 22) + arw(86, 50, 108, 50, "var(--ltt-muted)", 2) + gridSvg([[1, 0.5], [0, 1]], 116, 84, 22)),
    basis: tv(d3.range(4).map((k) => `<path d="M${30 + k * 30} 14V80" style="stroke:var(--ltt-line);stroke-width:1"/>`).join("") + d3.range(3).map((k) => `<path d="M30 ${80 - k * 30}H132" style="stroke:var(--ltt-line);stroke-width:1"/>`).join("")
      + [0, 1, 2].map((k) => arw(30 + k * 30, 80, 60 + k * 30, 80, "var(--ltt-accent)", k ? 1.5 : 3)).join("")
      + [0, 1].map((k) => arw(120, 80 - k * 30, 120, 50 - k * 30, "var(--ltt-good)", 1.5)).join("") + arw(30, 80, 30, 50, "var(--ltt-good)", 3)
      + `<circle cx="120" cy="20" r="4" style="fill:var(--ltt-ink)"/>` + tx(46, 96, "î", "font-weight:750;fill:var(--ltt-accent)") + tx(18, 70, "ĵ", "font-weight:750;fill:var(--ltt-good)")
      + tx(176, 24, "(3,2)", "font-size:12px;font-weight:700") + tx(184, 64, "î 3개 + ĵ 2개", "font-size:11px;fill:var(--ltt-muted)")),
    det: tv(poly([[14, 74], [46, 74], [46, 42], [14, 42]], "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2") + tx(30, 92, "넓이 1", "font-size:12px")
      + arw(58, 58, 88, 58, "var(--ltt-muted)", 2)
      + poly([[100, 74], [164, 74], [196, 42], [132, 42]], "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2") + tx(148, 92, "넓이 2 → det 2", "font-size:12px;font-weight:700")),
  };
  const minis = [];
  const card = (m) => (node) => { const p = mkPlane(node, 3); node.classList.add("cmpp"); minis.push([p, m]); };
  let colPlane = null;
  const playCols = async () => { if (!colPlane) return; await colPlane.to(I, 0); await new Promise((r) => setTimeout(r, 400)); colPlane.to(A, 1600); };
  function columnsFigure(node) {
    const w = node.appendChild(LTT.h("div", "tb"));
    w.innerHTML = `<div></div><div class="mx"><p><span data-tex="A=\\begin{bmatrix}2&1\\\\0&1\\end{bmatrix}"></span></p>
      <p class="lg"><span class="i-hat">첫째 열 (2,0)</span> = î가 가는 곳<br><span class="j-hat">둘째 열 (1,1)</span> = ĵ가 가는 곳</p>
      <p>색칠한 칸(넓이 1)이 두 열이 만드는 평행사변형, 밑변 2 × 높이 1 = 넓이 <b>2</b>가 된다. 이 넓이가 det다.</p>
      <div class="dk-actions"><button>다시 보기</button></div></div>`;
    LTT.math(w);
    colPlane = mkPlane(w.firstElementChild, 4, 560);
    w.querySelector("button").onclick = playCols;
  }

  LTT.deck({
    title: "행렬은 공간을 어떻게 바꾸는가?",
    theme: "paper",
    scenes: [
      { type: "hook", art: "layers", kicker: "행렬이 데이터에 하는 일 읽기",
        pre: "행렬은 숫자 표가 아니라",
        text: "공간 전체를 <u>움직이는 동작</u>이다.",
        sub: "신경망 레이어나 그래픽 변환의 행렬을 보고 '이 연산이 데이터를 어떻게 바꾸나'를 읽는 법이다. 이 수업을 마치면 행렬의 두 열과 det 하나로 변환의 모양, 넓이 변화, 되돌릴 수 있는지를 말할 수 있다." },

      { type: "terms", title: "먼저, 이 수업에서 쓰는 말", en: "Terms",
        terms: [
          { key: "선형 변환", en: "linear transformation", icon: "layers", visual: TERM_VIS.linear, plain: "평면 위 모든 점을 한꺼번에 옮기되, 격자선은 곧은 평행선으로 남고 원점은 제자리인 이동. 2×2 행렬 하나가 이런 이동 하나다.", example: "회전, 늘이기, 비스듬히 밀기(전단), 거울 반사." },
          { key: "기저 벡터", en: "î, ĵ", icon: "arrow", visual: TERM_VIS.basis, plain: "가로 1칸 화살표 î=(1,0)과 세로 1칸 화살표 ĵ=(0,1). 모든 점은 이 둘을 몇 개씩 더한 것이다.", example: "(3,2) = î 3개 + ĵ 2개." },
          { key: "행렬식", en: "determinant · det", icon: "ruler", visual: TERM_VIS.det, plain: "변환 뒤 넓이가 몇 배가 되는지 나타내는 숫자 하나. 음수면 거울처럼 뒤집히고, 0이면 평면이 선으로 찌부러진다.", example: "det 2 = 넓이 2배." },
        ] },

      { type: "figure", kicker: "열 = 도착점", title: "행렬의 두 열은 î와 ĵ가 가는 곳이다", en: "Columns",
        figure: columnsFigure,
        enter: () => playCols(),
        caption: "A가 평면 전체를 옮기는 모습. 옅은 바탕 선이 원래 격자, 색이 든 선이 옮겨진 격자다. 화살표 î는 첫째 열로, 화살표 ĵ는 둘째 열로 간다.",
        narration: [
          "모든 점은 î와 ĵ를 몇 개씩 더한 것이므로, 두 {{기저 벡터}}가 어디로 가는지만 알면 나머지 점이 어디로 갈지 다 정해진다. 행렬의 첫째 열이 î의 도착점, 둘째 열이 ĵ의 도착점이다. 곱셈 규칙대로 A·(1,0)을 계산하면 정확히 첫째 열이 나온다.",
        ],
        takeaway: "행렬을 읽을 때는 두 열을 'î와 ĵ의 도착점'으로 본다.",
        recall: "2×2 행렬의 첫째 열과 둘째 열은 각각 무엇을 알려 주는가?",
        ask: "\"이 행렬의 열이 각각 어디를 가리키는지 그려 줘\"" },

      { type: "compare", kicker: "네 가지 행렬", title: "모양으로 det(넓이 배율)를 읽는다", layout: "stack",
        narration: "같은 격자에 행렬 네 개를 각각 적용했다. 색칠한 칸은 넓이 1인 정사각형이 간 곳, 두 화살표는 î와 ĵ의 도착점이다. 칸이 넓어졌는지, 뒤집혔는지(î에서 ĵ로 도는 방향이 시계 방향으로 바뀜), 납작해졌는지 보고 det를 짐작한 뒤 판정을 열자.",
        items: [
          { label: "[[0.87, −0.5], [0.5, 0.87]]", visual: card(rot30), tone: "good", verdict: "회전 · det 1", noteAfter: true, note: "모양·넓이 그대로, 방향만 돈다." },
          { label: "[[2, 0], [0, 1.5]]", visual: card([[2, 0], [0, 1.5]]), tone: "good", verdict: "늘이기 · det 3", noteAfter: true, note: "넓이 2 × 1.5배." },
          { label: "[[0, 1], [1, 0]]", visual: card([[0, 1], [1, 0]]), tone: "warn", verdict: "y=x 반사 · det −1", noteAfter: true, note: "넓이는 같고 거울상으로 뒤집힌다." },
          { label: "[[0.5, 0.5], [0.5, 0.5]]", visual: card([[.5, .5], [.5, .5]]), tone: "bad", verdict: "찌부러뜨리기 · det 0", noteAfter: true, note: "평면이 직선이 된다. 원래대로 되돌릴 수 없다." },
        ],
        enter: () => minis.forEach(([p, m]) => { p.to(I, 0); setTimeout(() => p.to(m, 1400), 300); }),
        basis: "카드 제목은 행 단위로 적었다: [[a, b], [c, d]]의 첫째 열은 (a, c)다. 회전 30°는 cos 30° ≈ 0.87, sin 30° = 0.5로 표기했다.",
        takeaway: "det가 넓이 배율, 부호가 뒤집힘, 0이 '되돌릴 수 없음'을 말한다.",
        recall: "det의 크기, 부호, 그리고 det = 0은 각각 변환에 대해 무엇을 말하는가?" },

      { kicker: "직접 바꿔 보기", title: "네 숫자를 움직이며 det를 지켜본다", en: "Try it", layout: "split", bare: true,
        narration: [
          "행렬 [[a, b], [c, d]]의 네 숫자를 바꿔 보자. 큰 숫자가 지금 행렬의 {{행렬식}}이다.",
          "det가 0에 가까워지면 격자가 납작해지고, 0을 지나 음수가 되면 뒤집혀 거울상이 된다. ad − bc는 두 열이 만드는 평행사변형의 넓이를 계산한 식이고, ad와 bc가 같아지면 0이 된다.",
        ],
        mount: (body) => {
          body.innerHTML = `<div class="pl"><div></div><div><div class="ltt-hero"><span id="dv">1</span><small>= det</small></div><p id="dn"></p>
            <div class="gl"></div><div class="sl">${["a", "b", "c", "d"].map((k, i) => `<label class="ltt-param">${k} <b id="${k}-v"></b><input type="range" id="${k}" min="-2" max="2" step="0.01" value="${[1, 0, 0, 1][i]}"></label>`).join("")}</div></div></div>`;
          const p = mkPlane(body.querySelector(".pl > div"), 5, 460);
          LTT.sweep({
            params: { a: { fmt }, b: { fmt }, c: { fmt }, d: { fmt } },
            render: ({ a, b, c, d }) => {
              const m = [[a, b], [c, d]], dt = det(m);
              p.to(m, 0);
              LTT.tween("dv", dt, d3.format(".2f"));
              LTT.$("dn").innerHTML = Math.abs(dt) < 0.01 ? '<span class="ltt-tag bad">넓이 0</span> 직선으로 찌부러짐: 되돌릴 수 없음'
                : dt < 0 ? '<span class="ltt-tag warn">det&lt;0</span> 방향이 뒤집힘(거울상)' : '<span class="ltt-tag good">det&gt;0</span> 방향 유지';
            },
            goal: { el: body.querySelector(".gl"), target: '<span class="ltt-tag bad">det 0</span>',
              text: "네 숫자를 하나도 0으로 두지 않고, 평면을 직선으로 찌부러뜨려 되돌릴 수 없게 만들어 본다.",
              check: ({ a, b, c, d }) => Math.abs(det([[a, b], [c, d]])) < 0.01 && [a, b, c, d].every((x) => Math.abs(x) >= 0.1) },
          });
          return {};
        },
        tex: "\\det\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}=ad-bc",
        basis: "슬라이더 −2~2는 격자가 화면을 벗어나지 않게 고른 표시용 범위다.",
        takeaway: "det는 ad − bc, 두 열이 만드는 평행사변형의 넓이다.",
        recall: "[[a, b], [c, d]]의 det는 어떻게 계산하고, 격자 그림에서 무엇의 넓이인가?" },

      { type: "predict", kicker: "짐작해 보기", title: "늘이기와 회전, 순서를 바꾸면 결과도 같을까?",
        sub: "행렬 두 개를 곱하면 두 변환을 이어서 하는 것이다. ABx = A(Bx)이므로 오른쪽 B를 먼저, A를 나중에 적용한다.",
        visual: () => LTT.facts([
          { icon: "ruler", value: "A", label: "가로 2배로 늘이기" },
          { icon: "refresh", value: "B", label: "90° 회전" },
          { icon: "question", value: "AB vs BA", label: "같은 변환일까?" },
        ]),
        question: "A=가로 2배, B=90° 회전일 때 AB와 BA는 같은 변환인가",
