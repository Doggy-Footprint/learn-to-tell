<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B+tree 노드 분할이 루트까지 전파</title>
<script type="application/json" id="ltt-meta">{"topic": "B+tree 노드 분할", "audience": "백엔드 개발자", "theme": "blueprint", "medium": "DB 내부 구조 도해", "decision": "인덱스 설계와 페이지 크기 이해"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.tree{width:100%;height:auto;display:block;overflow:visible}
.tree .edge{stroke:var(--ltt-line-2);stroke-width:2;fill:none}
.tree .edge.path{stroke:var(--ltt-accent);stroke-width:3}
.tree .edge.ghost{stroke:var(--ltt-muted);stroke-dasharray:5 5}
.tree .link{fill:none;stroke:var(--ltt-muted);stroke-dasharray:4 4}
.tree marker path{fill:var(--ltt-muted)}
.tree .node{transition:transform .6s ease}
.tree .node.fresh{animation:appear .5s ease}
@keyframes appear{from{opacity:0}to{opacity:1}}
.tree .box{fill:var(--ltt-card);stroke:var(--ltt-line-2);stroke-width:1.5}
.tree .node.path .box{stroke:var(--ltt-accent);stroke-width:2.5}
.tree .node.new .box{stroke:var(--ltt-accent);stroke-width:2.5;fill:var(--ltt-accent-soft)}
.tree .node.bad .box{stroke:var(--ltt-bad);stroke-width:2.5;fill:var(--ltt-bad-soft)}
.tree .node.ghost .box{fill:none;stroke:var(--ltt-muted);stroke-dasharray:5 4}
.tree .node.chip .box{fill:var(--ltt-accent-soft);stroke:var(--ltt-accent)}
.tree text{fill:var(--ltt-ink);font-size:15px;text-anchor:middle;dominant-baseline:central}
.tree .node.ghost text{fill:var(--ltt-muted)}
.tree .tag{font-size:12px;fill:var(--ltt-muted)}
.tree .tag.bad{fill:var(--ltt-bad)}
.tree .tag.new{fill:var(--ltt-accent)}
.tree .lvl{font-size:13px;fill:var(--ltt-muted);text-anchor:start}
@media (prefers-reduced-motion: reduce){.tree .node{transition:none}.tree .node.fresh{animation:none}}
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
// 행 높이: 루트, 분할로 생긴 중간 행, 내부 행, 리프 행
const TOP = 50, SPLIT = 120, MID = 190, MID2 = 230, LEAF = 340, CHIP = 272;

const mk = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};

// 리프 행: 왼쪽에서 오른쪽으로 A·B·C·D·E. 노드 최대 4키, 5키가 되면 넘친다.
// S0 높이 3: 루트 R → N2 → 리프. 경로 R·N2·A가 모두 4키로 가득 찼다.
// S1 리프 A가 둘로 갈라지고(A1·A2), 25가 N2로 올라가 N2가 5키로 넘친다.
// S2 N2가 둘로 갈라지고 가운데 60이 올라가 루트가 5키로 넘친다.
// S3 루트가 둘로 갈라지고 가운데 200이 올라가 새 루트 T가 맨 위에 생긴다.
// S4 모든 노드의 깊이가 1 늘어 트리 높이가 4가 된다.
const STAGES = [
  { h: 3,
    nodes: [
      { id: "R", k: [100, 200, 300, 400], x: 410, y: TOP, cls: "path", tag: "4/4 가득" },
      { id: "N2", k: [30, 60, 80, 90], x: 410, y: MID, cls: "path", tag: "4/4 가득" },
      { id: "G", g: "나머지 자식 4개", x: 900, y: MID, cls: "ghost" },
      { id: "A", k: [10, 20, 22, 28], x: 110, y: LEAF, cls: "path", tag: "4/4 가득" },
      { id: "B", k: [30, 40, 50], x: 260, y: LEAF },
      { id: "C", k: [60, 70], x: 410, y: LEAF },
      { id: "D", k: [80, 85], x: 560, y: LEAF },
      { id: "E", k: [90, 95], x: 710, y: LEAF },
      { id: "chip", t: "삽입 25", x: 110, y: CHIP, cls: "chip" },
    ],
    edges: [["R", "N2", "path"], ["R", "G", "ghost"], ["N2", "A", "path"], ["N2", "B"], ["N2", "C"], ["N2", "D"], ["N2", "E"]],
    links: [["A", "B"], ["B", "C"], ["C", "D"], ["D", "E"]] },
  { h: 3,
    nodes: [
      { id: "R", k: [100, 200, 300, 400], x: 410, y: TOP, cls: "path", tag: "4/4 가득" },
      { id: "N2", k: [25, 30, 60, 80, 90], x: 410, y: MID, cls: "bad", tag: "5키 → 넘침" },
      { id: "G", g: "나머지 자식 4개", x: 900, y: MID, cls: "ghost" },
      { id: "A1", k: [10, 20, 22], x: 110, y: LEAF, cls: "path" },
      { id: "A2", k: [25, 28], x: 260, y: LEAF, nw: true, tag: "새 리프" },
      { id: "B", k: [30, 40, 50], x: 410, y: LEAF },
      { id: "C", k: [60, 70], x: 560, y: LEAF },
      { id: "D", k: [80, 85], x: 710, y: LEAF },
      { id: "E", k: [90, 95], x: 860, y: LEAF },
    ],
    edges: [["R", "N2", "path"], ["R", "G", "ghost"], ["N2", "A1", "path"], ["N2", "A2", "path"], ["N2", "B"], ["N2", "C"], ["N2", "D"], ["N2", "E"]],
    links: [["A1", "A2"], ["A2", "B"], ["B", "C"], ["C", "D"], ["D", "E"]] },
  { h: 3,
    nodes: [
      { id: "R", k: [60, 100, 200, 300, 400], x: 485, y: TOP, cls: "bad", tag: "5키 → 넘침" },
      { id: "NL", k: [25, 30], x: 260, y: MID, nw: true, tag: "새 노드" },
      { id: "NR", k: [80, 90], x: 710, y: MID, nw: true, tag: "새 노드" },
      { id: "G", g: "나머지 자식 4개", x: 900, y: MID, cls: "ghost" },
      { id: "A1", k: [10, 20, 22], x: 110, y: LEAF },
      { id: "A2", k: [25, 28], x: 260, y: LEAF },
      { id: "B", k: [30, 40, 50], x: 410, y: LEAF },
      { id: "C", k: [60, 70], x: 560, y: LEAF },
      { id: "D", k: [80, 85], x: 710, y: LEAF },
      { id: "E", k: [90, 95], x: 860, y: LEAF },
    ],
    edges: [["R", "NL"], ["R", "NR"], ["R", "G", "ghost"], ["NL", "A1"], ["NL", "A2"], ["NL", "B"], ["NR", "C"], ["NR", "D"], ["NR", "E"]],
    links: [["A1", "A2"], ["A2", "B"], ["B", "C"], ["C", "D"], ["D", "E"]] },
  { h: 3,
    nodes: [
      { id: "T", k: [200], x: 667, y: TOP, nw: true, tag: "새 루트" },
      { id: "RL", k: [60, 100], x: 485, y: SPLIT, nw: true, tag: "새 노드" },
      { id: "RR", k: [300, 400], x: 850, y: SPLIT, nw: true, tag: "새 노드" },
      { id: "NL", k: [25, 30], x: 260, y: MID2 },
      { id: "NR", k: [80, 90], x: 710, y: MID2 },
      { id: "G", g: "나머지 자식 4개", x: 900, y: MID2, cls: "ghost" },
      { id: "A1", k: [10, 20, 22], x: 110, y: LEAF },
      { id: "A2", k: [25, 28], x: 260, y: LEAF },
      { id: "B", k: [30, 40, 50], x: 410, y: LEAF },
      { id: "C", k: [60, 70], x: 560, y: LEAF },
      { id: "D", k: [80, 85], x: 710, y: LEAF },
      { id: "E", k: [90, 95], x: 860, y: LEAF },
    ],
    edges: [["T", "RL", "path"], ["T", "RR", "path"], ["RL", "NL"], ["RL", "NR"], ["RR", "G", "ghost"], ["NL", "A1"], ["NL", "A2"], ["NL", "B"], ["NR", "C"], ["NR", "D"], ["NR", "E"]],
    links: [["A1", "A2"], ["A2", "B"], ["B", "C"], ["C", "D"], ["D", "E"]] },
  { h: 4,
    nodes: [
      { id: "T", k: [200], x: 667, y: TOP, nw: true, tag: "새 루트" },
      { id: "RL", k: [60, 100], x: 485, y: SPLIT, nw: true },
      { id: "RR", k: [300, 400], x: 850, y: SPLIT, nw: true },
      { id: "NL", k: [25, 30], x: 260, y: MID2 },
      { id: "NR", k: [80, 90], x: 710, y: MID2 },
      { id: "G", g: "나머지 자식 4개", x: 900, y: MID2, cls: "ghost" },
      { id: "A1", k: [10, 20, 22], x: 110, y: LEAF },
      { id: "A2", k: [25, 28], x: 260, y: LEAF },
      { id: "B", k: [30, 40, 50], x: 410, y: LEAF },
      { id: "C", k: [60, 70], x: 560, y: LEAF },
      { id: "D", k: [80, 85], x: 710, y: LEAF },
      { id: "E", k: [90, 95], x: 860, y: LEAF },
    ],
    edges: [["T", "RL", "path"], ["T", "RR"], ["RL", "NL", "path"], ["RL", "NR"], ["RR", "G", "ghost"], ["NL", "A1", "path"], ["NL", "A2"], ["NL", "B"], ["NR", "C"], ["NR", "D"], ["NR", "E"]],
    links: [["A1", "A2"], ["A2", "B"], ["B", "C"], ["C", "D"], ["D", "E"]] },
];

const CAPTIONS = [
  "① 25가 들어갈 리프 A를 찾는다. 루트 → N2 → A 경로의 세 노드가 모두 4키로 가득 찼다.",
  "② 리프 A가 5키가 되어 둘로 갈라진다. 25는 복사되어 N2로 올라가고, N2도 5키로 넘친다.",
  "③ N2가 둘로 갈라진다. 가운데 60은 복사가 아니라 이동해 루트로 올라가고, 루트도 5키로 넘친다.",
  "④ 루트가 둘로 갈라진다. 가운데 200이 올라가고, 200을 가리키는 새 루트가 맨 위에 생긴다.",
  "⑤ 새 루트가 생겨 트리 높이가 3에서 4로 커졌다. 모든 리프의 깊이가 함께 1 늘었다.",
];

const treeFigure = (container) => {
  const svg = container.appendChild(document.createElementNS(SVG, "svg"));
  svg.setAttribute("viewBox", "0 0 1040 490");
  svg.setAttribute("class", "tree");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "B+tree 삽입 시 노드 분할이 리프에서 루트로 번지고 새 루트가 생긴다");
  const defs = mk("defs", {}, svg);
  const marker = mk("marker", { id: "tree-arr", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
  mk("path", { d: "M0,0 L10,5 L0,10 z" }, marker);
  const edgeG = mk("g", {}, svg);
  const linkG = mk("g", {}, svg);
  const nodeG = mk("g", {}, svg);
  const lvl = mk("text", { x: 20, y: 470, class: "lvl" }, svg);
  const nodes = new Map();

  const draw = (i) => {
    const S = STAGES[i];
    const at = Object.fromEntries(S.nodes.map((n) => [n.id, n]));
    edgeG.replaceChildren();
    linkG.replaceChildren();
    for (const [a, b, cls] of S.edges) {
      const p = at[a], c = at[b];
      mk("line", { x1: p.x, y1: p.y + 18, x2: c.x, y2: c.y - 18, class: `edge ${cls || ""}` }, edgeG);
    }
    for (const [a, b] of S.links) {
      const p = at[a], c = at[b];
      mk("path", { d: `M${p.x} ${p.y + 18} V${p.y + 40} H${c.x} V${c.y + 18}`, class: "link", "marker-end": "url(#tree-arr)" }, linkG);
    }
    for (const [id, g] of nodes) {
      if (!at[id]) { g.remove(); nodes.delete(id); }
    }
    for (const n of S.nodes) {
      const fresh = !nodes.has(n.id);
      let g = nodes.get(n.id);
      if (!g) { g = mk("g", {}, nodeG); nodes.set(n.id, g); }
      g.setAttribute("class", ["node", n.cls, n.nw && "new", fresh && "fresh"].filter(Boolean).join(" "));
      g.style.transform = `translate(${n.x}px, ${n.y}px)`;
      g.replaceChildren();
      const text = n.t ?? n.g ?? n.k.join(" ");
      const w = n.g ? 150 : n.t ? 96 : Math.max(70, text.length * 8.4 + 24);
      mk("rect", { x: -w / 2, y: -18, width: w, height: 36, rx: 6, class: "box" }, g);
      mk("text", {}, g).textContent = text;
      if (n.tag) {
        const tagCls = n.cls === "bad" ? "bad" : n.nw ? "new" : "";
        mk("text", { y: -30, class: `tag ${tagCls}` }, g).textContent = n.tag;
      }
    }
    lvl.textContent = `트리 높이 ${S.h}`;
  };

  draw(0);
  return { el: svg, draw };
};

const scene = {
  type: "figure",
  kicker: "DB · B+tree 삽입",
  title: "분할은 아래에서 위로 번지고, 루트가 넘칠 때만 트리가 한 층 자란다",
  en: "A node split climbs to the root and grows the tree only there",
  sub: "노드는 최대 4키다. {{리프}}가 5키가 되면 넘쳐서 둘로 갈라지고, 그 여파가 부모로 간다.",
  figure: treeFigure,
  steps: CAPTIONS.map((caption, i) => ({ caption, enter: (k, f) => f.draw(i) })),
  basis: "근거: 8KB 페이지, 키와 포인터 약 16B로 둔 근사. {{팬아웃}} 약 500이면 높이 3 트리에 키 약 1.25억 개, 4KB면 팬아웃 약 250, 약 1,600만. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
  takeaway: "분할은 부모에 빈자리가 있으면 그 층에서 멈추고, 루트까지 번졌을 때만 트리가 한 층 자란다.",
  recall: "노드 최대 4키인 트리에서 리프가 넘칠 때 연쇄는 어디서 멈추나?",
};

LTT.expect("팬아웃 500일 때 높이 3의 키 수", 500 ** 3, 1.25e8, { tol: 0 });

LTT.deck({
  title: "B+tree 노드 분할이 루트까지 전파",
  theme: "blueprint",
  glossary: {
    "리프": "키와 데이터 위치가 담기는 맨 아래 노드. 리프끼리는 오른쪽 형제 링크로 이어진다.",
    "팬아웃": "한 노드가 가리키는 자식의 수. 노드 하나가 많이 가리킬수록 트리가 낮다.",
  },
  scenes: [scene],
});
</script>
</body>
</html>
