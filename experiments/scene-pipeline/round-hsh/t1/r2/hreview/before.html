<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B+tree 노드 분할이 루트까지 전파</title>
<script type="application/json" id="ltt-meta">{"topic": "B+tree 노드 분할", "audience": "백엔드 개발자", "theme": "blueprint", "medium": "DB 내부 구조 도해", "decision": "인덱스 설계와 페이지 크기 이해"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const CAP = 4, CELL = 28, H = 44, FAINT_W = 56;   // 페이지 용량(키 칸 수), 칸 너비, 노드 높이
const ROW = [60, 190, 320, 450];                   // 층별 y
const IDS = ["ROOT", "NR", "RR", "I1", "I2", "I2b", "I3", "Lp", "L", "R", "Ln", "CHIP"];
const LEAVES = ["Lp", "L", "R", "Ln"];             // 잎은 왼쪽에서 오른쪽 순서로 연결 리스트를 이룬다
const ROW_NAMES = ["루트", "내부", "잎"];           // 왼쪽 여백의 층 이름. 높이 4일 때는 NR 아래로 한 칸씩 내려간다
const ROW_NAMES4 = ["새 루트", "루트", "내부", "잎"];

// [x 중심, 층, 키 배열(null이면 생략된 노드), 부모 id, 상태 class]
const N = (x, r, keys, p, cls) => [x, r, keys, p, cls || (keys ? "full" : "faint")];

// 단계 0: 경로의 세 노드가 모두 꽉 찼다. 삽입 키 86이 L 위에 떠 있다.
const S0 = {
  ROOT: N(450, 0, [50, 100, 150, 200]),
  I1: N(230, 1, null, "ROOT"),
  I2: N(440, 1, [60, 70, 80, 90], "ROOT"),
  I3: N(680, 1, null, "ROOT"),
  Lp: N(290, 2, null, "I2"),
  L: N(440, 2, [81, 83, 85, 88], "I2"),
  Ln: N(590, 2, null, "I2"),
  chip: [86, 580, 262],
};
// 단계 1: 86이 L로 들어와 5칸이 되어 넘친다
const S1 = { ...S0, L: N(440, 2, [81, 83, 85, 86, 88], "I2"), chip: [86, 440, 290] };
// 단계 2: L이 3+2로 갈라진다. 새 오른쪽 잎 R을 먼저 만들고, 86은 R에 남은 채 I2로 복사된다. I2는 아직 4칸이다.
const S2 = {
  ROOT: N(450, 0, [50, 100, 150, 200]),
  I1: N(230, 1, null, "ROOT"),
  I2: N(440, 1, [60, 70, 80, 90], "ROOT"),
  I3: N(680, 1, null, "ROOT"),
  Lp: N(230, 2, null, "I2"),
  L: N(380, 2, [81, 83, 85], "I2"),
  R: N(530, 2, [86, 88], "I2", "new"),
  Ln: N(680, 2, null, "I2"),
  chip: [86, 530, 290],
};
// 단계 3: 86이 부모로 올라가 I2가 5칸이 되어 넘친다
const S3 = { ...S2, I2: N(440, 1, [60, 70, 80, 86, 90], "ROOT"), R: N(530, 2, [86, 88], "I2"), chip: [86, 470, 170] };
// 단계 4: I2가 갈라진다. 새 오른쪽 I2b가 먼저 생기고, 가운데 80은 위로 이동해 루트가 5칸이 되어 넘친다
const S4 = {
  ROOT: N(450, 0, [50, 80, 100, 150, 200]),
  I1: N(200, 1, null, "ROOT"),
  I2: N(340, 1, [60, 70], "ROOT"),
  I2b: N(560, 1, [86, 90], "ROOT", "new"),
  I3: N(740, 1, null, "ROOT"),
  Lp: N(230, 2, null, "I2"),
  L: N(400, 2, [81, 83, 85], "I2b"),
  R: N(560, 2, [86, 88], "I2b"),
  Ln: N(720, 2, null, "I2b"),
  chip: [80, 400, 145],
};
// 단계 5: 루트가 갈라진다. 오른쪽 RR이 먼저 생기고, 가운데 100이 위로 올라간다
const S5 = {
  ROOT: N(340, 0, [50, 80]),
  RR: N(660, 0, [150, 200], null, "new"),
  I1: N(200, 1, null, "ROOT"),
  I2: N(340, 1, [60, 70], "ROOT"),
  I2b: N(560, 1, [86, 90], "ROOT"),
  I3: N(760, 1, null, "RR"),
  Lp: N(230, 2, null, "I2"),
  L: N(400, 2, [81, 83, 85], "I2b"),
  R: N(560, 2, [86, 88], "I2b"),
  Ln: N(720, 2, null, "I2b"),
  chip: [100, 500, 80],
};
// 단계 6: 새 루트가 맨 마지막에 생기고, 모든 잎과 내부 노드가 한 층 내려간다
const S6 = {
  NR: N(500, 0, [100], null, "new"),
  ROOT: N(340, 1, [50, 80], "NR"),
  RR: N(660, 1, [150, 200], "NR"),
  I1: N(200, 2, null, "ROOT"),
  I2: N(340, 2, [60, 70], "ROOT"),
  I2b: N(560, 2, [86, 90], "ROOT"),
  I3: N(760, 2, null, "RR"),
  Lp: N(230, 3, null, "I2"),
  L: N(400, 3, [81, 83, 85], "I2b"),
  R: N(560, 3, [86, 88], "I2b"),
  Ln: N(720, 3, null, "I2b"),
};
const STATES = [S0, S1, S2, S3, S4, S5, S6];
const CAPTIONS = [
  "높이 3 트리. 삽입 경로의 잎·내부 노드·루트가 모두 꽉 찼다. 키 86이 들어온다",
  "키 86이 꽉 찬 잎 L에 들어와 칸이 5개가 되어 넘친다",
  "L을 3+2로 가른다. 새 잎 R이 L 바로 오른쪽에 끼고, 구분 키 86은 R에 남은 채 부모로 복사된다",
  "부모 I2가 86을 받아 5칸이 되어 넘친다. 넘침은 꽉 찬 조상까지 이어진다",
  "I2를 가른다. 새 오른쪽 I2b가 먼저 생기고, 가운데 80은 위로 이동해 두 노드 어디에도 남지 않는다. 루트가 5칸이 되어 넘친다",
  "루트를 가른다. 새 오른쪽 RR이 생기고, 가운데 100이 위로 올라간다",
  "새 루트 [100]이 맨 마지막에 생기고, 모든 잎이 한 층 내려간다. 높이 3 → 4",
];

const wOf = (s) => (s[2] ? Math.max(CAP, s[2].length) * CELL + 8 : FAINT_W);

const nodeHTML = (s, w) => {
  const [, , keys, , cls] = s;
  if (!keys) {
    return `<rect width="${w}" height="${H}" rx="6" style="fill:var(--ltt-card);stroke:var(--ltt-line-2);stroke-dasharray:4 4"/>`
      + `<text x="${w / 2}" y="27" text-anchor="middle" style="fill:var(--ltt-muted);font-size:16px">…</text>`;
  }
  const bad = keys.length > CAP;
  const edge = bad ? "var(--ltt-bad)" : cls === "new" ? "var(--ltt-accent)" : "var(--ltt-ink-2)";
  let out = `<rect width="${w}" height="${H}" rx="6" style="fill:var(--ltt-card);stroke:${edge};stroke-width:${bad || cls === "new" ? 2 : 1.5}"/>`;
  // 칸은 항상 용량만큼 그린다. 빈 칸은 점선, 넘친 칸은 bad 색
  for (let i = 0; i < Math.max(CAP, keys.length); i++) {
    const over = i >= CAP, has = i < keys.length, x = 4 + i * CELL;
    const fill = over ? "var(--ltt-bad-soft)" : has ? "var(--ltt-card-2)" : "var(--ltt-card)";
    const line = over ? "var(--ltt-bad)" : "var(--ltt-line-2)";
    out += `<rect x="${x + 2}" y="9" width="${CELL - 4}" height="26" rx="3" style="fill:${fill};stroke:${line};stroke-dasharray:${has ? "none" : "3 3"}"/>`;
    if (has) out += `<text x="${x + CELL / 2}" y="27" text-anchor="middle" class="ltt-mono" style="fill:var(--ltt-ink);font-size:13px">${keys[i]}</text>`;
  }
  return out;
};

const chipHTML = (v) => `<rect x="-22" y="-12" width="44" height="24" rx="12" style="fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:1.5"/>`
  + `<text y="5" text-anchor="middle" class="ltt-mono" style="fill:var(--ltt-ink);font-size:13px">${v}</text>`;

const figure = (el) => {
  const svg = el.appendChild(document.createElementNS(SVG, "svg"));
  svg.setAttribute("viewBox", "0 0 1000 540");
  svg.style.cssText = "display:block;width:100%;height:auto";
  const mk = (tag, attrs = {}) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const move = "transition:transform .6s ease, opacity .5s ease";
  const layer = svg.appendChild(mk("g"));                 // 선은 매 단계 다시 그린다
  const G = {};
  IDS.forEach((id) => { G[id] = svg.appendChild(mk("g", { style: move })); });
  const chip = G.CHIP;
  const height = svg.appendChild(mk("text", { x: 30, y: 40, style: "fill:var(--ltt-ink);font-size:22px;font-weight:600" }));
  // 층 이름은 높이에 따라 다시 붙인다. 높이 4에서는 한 층씩 아래로 내려간다
  const rowLabels = ROW.map((y) => svg.appendChild(mk("text", { x: 30, y: y + H / 2 + 5, style: "fill:var(--ltt-muted);font-size:13px" })));
  svg.appendChild(mk("text", { x: 30, y: 505, style: "fill:var(--ltt-muted);font-size:13px" })).textContent = "칸 하나 = 키 하나. 칸 4개짜리 페이지가 노드 하나다.";
  svg.appendChild(mk("path", { d: "M30 528 H70", style: "stroke:var(--ltt-line-2);stroke-width:2;stroke-dasharray:6 5" }));
  svg.appendChild(mk("text", { x: 80, y: 532, style: "fill:var(--ltt-muted);font-size:13px" })).textContent = "잎끼리 이어진 연결 리스트";

  const path = (d, dash) => layer.appendChild(mk("path", {
    d, style: `fill:none;stroke:var(--ltt-line-2);stroke-width:2${dash ? ";stroke-dasharray:6 5" : ""}`,
  }));

  const set = (st) => {
    IDS.forEach((id) => {
      if (id === "CHIP") return;
      const s = st[id], g = G[id];
      g.style.opacity = s ? 1 : 0;
      if (!s) return;
      const w = wOf(s);
      g.style.transform = `translate(${s[0] - w / 2}px, ${ROW[s[1]]}px)`;
      g.innerHTML = nodeHTML(s, w);
    });
    // 부모-자식 선
    layer.innerHTML = "";
    IDS.forEach((id) => {
      const s = st[id];
      if (id === "CHIP" || !s || !s[3] || !st[s[3]]) return;
      const p = st[s[3]];
      path(`M${p[0]} ${ROW[p[1]] + H} L${s[0]} ${ROW[s[1]]}`);
    });
    // 잎 연결 리스트: 보이는 잎끼리 옆으로 잇는다
    const vis = LEAVES.filter((id) => st[id]);
    vis.slice(1).forEach((id, i) => {
      const a = st[vis[i]], b = st[id];
      path(`M${a[0] + wOf(a) / 2} ${ROW[a[1]] + H / 2} L${b[0] - wOf(b) / 2} ${ROW[b[1]] + H / 2}`, true);
    });
    // 삽입 키 칩: 잎에서 부모로 올라갈 때 칩이 따라 옮겨 간다
    if (st.chip) {
      const [v, x, y] = st.chip;
      chip.innerHTML = chipHTML(v);
      chip.style.transform = `translate(${x}px, ${y}px)`;
      chip.style.opacity = 1;
    } else {
      chip.style.opacity = 0;
    }
    height.textContent = st.NR ? "높이 4" : "높이 3";
    const names = st.NR ? ROW_NAMES4 : ROW_NAMES;
    rowLabels.forEach((t, r) => { t.textContent = names[r] || ""; });
  };
  return { el: svg, set };
};

LTT.deck({
  title: "B+tree 노드 분할이 루트까지 전파",
  theme: "blueprint",
  glossary: {
    "구분 키": "부모 노드에서 자식들의 키 범위를 나누는 키.",
    "팬아웃": "노드 하나가 가리키는 자식 수. 페이지가 클수록 커진다.",
  },
  scenes: [{
    type: "figure",
    title: "꽉 찬 잎이 쪼개지면 쪼개짐은 위로 올라가고, 루트가 쪼개질 때만 트리가 높아진다",
    en: "Splits climb only through full ancestors; the root split alone adds a level",
    kicker: "B+tree · 삽입과 분할",
    sub: "노드 하나 = 페이지 하나. 칸 4개 = 키 최대 4개, 자식 최대 5개",
    figure,
    steps: STATES.map((st, i) => ({ caption: CAPTIONS[i], enter: (k, f) => f.set(st) })),
    takeaway: "잎 분할은 {{구분 키}}를 복사하고, 내부 노드 분할은 가운데 키를 옮긴다. 페이지가 클수록 {{팬아웃}}이 커서 같은 키 수에서 트리가 낮다.",
    recall: "부모가 꽉 차 있지 않았다면 분할은 어디서 멈추는가?",
    basis: "칸 수(4·5)는 설명용 모델이다. 실제 페이지의 키 수는 키 크기와 헤더에 따라 달라진다. 팬아웃 ≈ 8 KB ÷ 16 B ≈ 500, 4 KB ÷ 16 B ≈ 250(헤더 제외, 모델로 계산한 예시).",
  }],
});
</script>
</body>
</html>
