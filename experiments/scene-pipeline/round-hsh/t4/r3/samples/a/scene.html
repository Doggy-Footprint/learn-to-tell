<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA 복제 분기점: 선도 가닥과 지연 가닥</title>
<script type="application/json" id="ltt-meta">{"topic": "DNA 복제 분기점, 선도 가닥과 오카자키 절편", "audience": "생명과학 입문 학생", "theme": "paper", "medium": "교과서 도해", "decision": "복제 과정 이해"}</script>
<style>
.hk-fig { max-width: min(560px, 100%); margin: 0 auto; }
.hk-fig svg { width: 100%; max-width: 100%; height: auto; display: block; }
.hk-tpl { stroke: var(--ltt-ink-2); stroke-width: 3; }
.hk-rung { stroke: var(--ltt-line-2); stroke-width: 2; }
.hk-end, .hk-lab { fill: var(--ltt-ink-2); }
.hk-lead { stroke: var(--ltt-accent); stroke-width: 6; stroke-linecap: round; transition: opacity 0.3s; }
.hk-lag { stroke: var(--ltt-c2); stroke-width: 6; stroke-linecap: round; transition: opacity 0.3s; }
.hk-join { stroke: var(--ltt-c2); stroke-width: 6; stroke-dasharray: 3 5; transition: opacity 0.3s; }
.hk-prim { fill: var(--ltt-ink); transition: opacity 0.3s; }
.hk-fork { stroke: var(--ltt-ink); stroke-width: 1.5; stroke-dasharray: 4 4; }
.hk-ar { fill: var(--ltt-accent); }
.hk-ar2 { fill: var(--ltt-c2); }
</style>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const X0 = 60, LEAD_Y = 104, TOP_Y = 120, BOT_Y = 200, LAG_Y = 218;
const PRIMERS = [180, 300, 420], FRAG = 100;
const T = LTT.MOTION_MS ?? 700;
const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);

// 분기점이 열리는 순서대로 새 가닥을 그린다. 선도 가닥은 분기점을 따라 이어지고,
// 지연 가닥은 분기점 뒤쪽(반대 방향)에 절편을 하나씩 남긴다.
function strandFigure(root) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 640 290");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "분기점이 오른쪽으로 열리며 선도 가닥은 연속으로, 지연 가닥은 분기점과 반대 방향의 절편으로 자란다");
  svg.innerHTML = `
    <defs>
      <marker id="hk-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="hk-ar"/></marker>
      <marker id="hk-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="hk-ar2"/></marker>
    </defs>
    <line class="hk-tpl" x1="40" y1="${TOP_Y}" x2="600" y2="${TOP_Y}"/>
    <line class="hk-tpl" x1="40" y1="${BOT_Y}" x2="600" y2="${BOT_Y}"/>
    <text class="hk-end" x="22" y="${TOP_Y + 5}">3'</text>
    <text class="hk-end" x="606" y="${TOP_Y + 5}">5'</text>
    <text class="hk-end" x="22" y="${BOT_Y + 5}">5'</text>
    <text class="hk-end" x="606" y="${BOT_Y + 5}">3'</text>
    <g id="hk-rungs"></g>
    <text class="hk-lab" x="${X0}" y="${LEAD_Y - 12}">선도 가닥 (5'→3', 분기점 방향 →)</text>
    <line id="hk-lead" class="hk-lead" x1="${X0}" y1="${LEAD_Y}" x2="${X0}" y2="${LEAD_Y}" marker-end="url(#hk-ah-a)"/>
    <line id="hk-fork" class="hk-fork" x1="${X0}" y1="${LEAD_Y - 8}" x2="${X0}" y2="${LAG_Y + 8}"/>
    <text id="hk-forklab" class="hk-lab" x="${X0}" y="${LEAD_Y - 22}" text-anchor="middle">분기점</text>
    ${PRIMERS.map((p, k) => `<line id="hk-f${k}" class="hk-lag" x1="${p}" y1="${LAG_Y}" x2="${p}" y2="${LAG_Y}" marker-end="url(#hk-ah-b)"/>
      <circle id="hk-p${k}" class="hk-prim" cx="${p}" cy="${LAG_Y}" r="5"/>`).join("")}
    <line id="hk-j0" class="hk-join" x1="180" y1="${LAG_Y}" x2="200" y2="${LAG_Y}"/>
    <line id="hk-j1" class="hk-join" x1="300" y1="${LAG_Y}" x2="320" y2="${LAG_Y}"/>
    <text class="hk-lab" x="${X0}" y="${LAG_Y + 42}">지연 가닥 (5'→3', 분기점과 반대 ←)</text>
  `;
  const cap = document.createElement("p");
  cap.className = "hk-cap";
  const wrap = document.createElement("div");
  wrap.className = "hk-fig";
  wrap.append(svg, cap);
  root.appendChild(wrap);

  const st = { fx: X0, prim: [0, 0, 0], frag: [0, 0, 0], primFade: 1, join: 0 };
  const $ = (id) => svg.querySelector("#" + id);

  function draw() {
    const fx = st.fx;
    $("hk-lead").setAttribute("x2", fx);
    $("hk-lead").style.opacity = fx > X0 ? 1 : 0;
    $("hk-fork").setAttribute("x1", fx);
    $("hk-fork").setAttribute("x2", fx);
    $("hk-forklab").setAttribute("x", fx);
    // 열린 뒤 다시 짝을 이룬 나선 구간(분기점 왼쪽)에만 가로대를 그린다
    let rungs = "";
    for (let x = 40; x < fx - 2; x += 24) {
      rungs += `<line class="hk-rung" x1="${x}" y1="${TOP_Y}" x2="${x}" y2="${BOT_Y}"/>`;
    }
    $("hk-rungs").innerHTML = rungs;
    PRIMERS.forEach((p, k) => {
      const f = $("hk-f" + k);
      f.setAttribute("x2", p - FRAG * st.frag[k]);
      f.style.opacity = st.frag[k] > 0 ? 1 : 0;
      $("hk-p" + k).style.opacity = st.prim[k] ? st.primFade : 0;
    });
    $("hk-j0").style.opacity = st.join;
    $("hk-j1").style.opacity = st.join;
  }

  const tween = (ms, run) => new Promise((done) => {
    if (!ms) { run(1); draw(); return done(); }
    const t0 = performance.now();
    const frame = (now) => {
      const p = Math.min(1, (now - t0) / ms);
      run(ease(p));
      draw();
      if (p < 1) requestAnimationFrame(frame); else done();
    };
    requestAnimationFrame(frame);
  });
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));

  const beats = [
    { cap: "헬리케이스가 이중나선을 풀면 분기점이 생기고, 분기점은 오른쪽으로 전진한다.", run: () => {} },
    { cap: "선도 가닥: 프라이머 하나에서 시작해 분기점을 따라 끊김 없이 자란다.", run: (p) => { st.fx = X0 + (180 - X0) * p; } },
    { cap: "지연 가닥: 주형이 드러나면 짧은 RNA 프라이머를 놓고, 분기점과 반대쪽(←)으로 절편을 합성한다.", run: (p) => { st.prim[0] = 1; st.frag[0] = p; } },
    { cap: "분기점이 더 열리면 선도 가닥은 이어서 자란다.", run: (p) => { st.fx = 180 + 120 * p; } },
    { cap: "새 프라이머에서 다음 절편이 합성된다. 먼저 만든 절편은 분기점에서 더 멀리 남는다.", run: (p) => { st.prim[1] = 1; st.frag[1] = p; } },
    { cap: "분기점이 또 열리고, 선도 가닥은 계속 연속으로 자란다.", run: (p) => { st.fx = 300 + 120 * p; } },
    { cap: "가장 새 절편이 분기점에 가장 가깝다. 절편 하나를 확대해도 방향은 5'→3'이다.", run: (p) => { st.prim[2] = 1; st.frag[2] = p; } },
    { cap: "프라이머를 떼어내고 절편들을 연결효소로 잇는다. 두 새 가닥이 완성된다.", run: (p) => { st.primFade = 1 - p; st.join = p; } },
  ];

  draw();
  cap.textContent = beats[0].cap;
  (async () => {
    for (const b of beats) {
      cap.textContent = b.cap;
      await tween(T * 1.6, b.run);
      await pause(T * 1.2);
    }
  })();
}

LTT.deck({
  title: "DNA 복제 분기점: 선도 가닥은 연속, 지연 가닥은 끊어져 자란다",
  theme: "paper",
  glossary: {
    "선도 가닥": "분기점이 열리는 방향과 같은 쪽에서 프라이머 하나로 끊김 없이 자라는 새 DNA 가닥.",
    "지연 가닥": "분기점이 열리는 방향과 반대쪽에서 짧은 조각(오카자키 절편)을 여러 개 만들어 나중에 잇는 새 DNA 가닥.",
  },
  scenes: [
    {
      type: "hook",
      pre: "생물 · DNA 복제",
      text: "두 새 가닥은 모두 5'→3'으로 자라는데, {{선도 가닥}}은 연속이고 {{지연 가닥}}은 끊어진다",
      sub: "분기점이 열리는 순서대로, 새 가닥이 어떻게 생기는지 본다",
      art: strandFigure,
    },
  ],
});
</script>
</body>
</html>
