<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA 복제 분기점</title>
<script type="application/json" id="ltt-meta">{"topic": "DNA 복제 분기점", "audience": "생명과학 입문 학생", "theme": "paper", "medium": "교과서 도해", "decision": "복제 과정 이해"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .dn-art { width: 100%; max-width: 100%; height: auto; display: block; }
  .dn-tpl { fill: none; stroke: var(--ltt-ink-2); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: dn-draw 1s ease-out var(--d) forwards; }
  .dn-lead { fill: none; stroke: var(--ltt-accent); stroke-width: 5; stroke-linecap: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: dn-draw var(--dur) linear var(--d) forwards; }
  .dn-frag { fill: none; stroke: var(--ltt-c2); stroke-width: 5; stroke-linecap: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: dn-draw var(--dur) linear var(--d) forwards; }
  .dn-prim { opacity: 0; transform-box: fill-box; transform-origin: center;
    animation: dn-pop .4s ease-out var(--d) forwards; }
  .dn-prim-end { animation: dn-pop .4s ease-out var(--d) forwards, dn-out .8s ease var(--d2) forwards; }
  .dn-prim-lead { fill: var(--ltt-accent); }
  .dn-prim-lag { fill: var(--ltt-c2); }
  .dn-head { opacity: 0; animation: dn-in .2s ease var(--d) forwards; }
  .dn-head-lead { fill: var(--ltt-accent); }
  .dn-head-lag { fill: var(--ltt-c2); }
  .dn-lab { fill: var(--ltt-ink-2); font-size: 14px; opacity: 0; animation: dn-in .5s ease var(--d) forwards; }
  .dn-lab-key { fill: var(--ltt-ink); font-size: 15px; font-weight: 600; }
  .dn-lab-lead { fill: var(--ltt-accent); }
  .dn-lab-lag { fill: var(--ltt-c2); }
  .dn-fork { stroke: var(--ltt-ink); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
  @keyframes dn-draw { to { stroke-dashoffset: 0; } }
  @keyframes dn-pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes dn-in { to { opacity: 1; } }
  @keyframes dn-out { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .dn-tpl, .dn-lead, .dn-frag { stroke-dashoffset: 0 !important; animation: none !important; }
    .dn-prim, .dn-lab, .dn-head { opacity: 1 !important; animation: none !important; transform: none !important; }
    .dn-prim-end { opacity: 0 !important; }
  }
</style>
</head>
<body>
<script>
  // 좌표: 분기점 x=420, 주형 두 팔은 왼쪽으로 벌어진다. 분기점은 오른쪽으로 전진한다.
  // 선도 가닥은 왼쪽 프라이머에서 분기점 쪽으로(5'→3' 오른쪽), 지연 가닥 절편은 프라이머에서 왼쪽(분기점 반대)으로 자란다.
  // 가장 오래된 절편이 가장 왼쪽, 가장 새 절편이 분기점에 가깝다.
  const ART = `
<svg class="dn-art" viewBox="0 0 620 350" role="img" aria-label="DNA 복제 분기점: 선도 가닥은 분기점 쪽으로 연속으로, 지연 가닥은 분기점과 반대로 자라는 오카자키 절편으로 만들어진다">
  <path class="dn-tpl" style="--len:170; --d:0s" d="M420,162 L580,162"/>
  <path class="dn-tpl" style="--len:170; --d:0s" d="M420,178 L580,178"/>
  <path class="dn-tpl" style="--len:370; --d:.6s" d="M420,162 L60,100"/>
  <path class="dn-tpl" style="--len:370; --d:.6s" d="M420,178 L60,240"/>

  <text class="dn-lab" style="--d:1.6s" x="40" y="96">3'</text>
  <text class="dn-lab" style="--d:1.6s" x="40" y="252">5'</text>
  <text class="dn-lab" style="--d:1.6s" x="402" y="150">5'</text>
  <text class="dn-lab" style="--d:1.6s" x="394" y="200">3'</text>
  <text class="dn-lab dn-lab-key" style="--d:1.8s" x="440" y="150">분기점</text>
  <text class="dn-lab" style="--d:1.8s" x="478" y="200">복제 진행 →</text>

  <!-- 선도 가닥 -->
  <rect class="dn-prim dn-prim-end dn-prim-lead" style="--d:2.4s; --d2:12s" x="66" y="106.7" width="8" height="8"/>
  <path class="dn-lead" style="--len:341; --dur:2.2s; --d:2.6s" d="M70,110.7 L406,168.6"/>
  <polygon class="dn-head dn-head-lead" style="--d:4.8s" points="412,169.6 399.2,173.5 400.9,163.7"/>
  <text class="dn-lab dn-lab-lead" style="--d:2.6s" x="60" y="80">선도 가닥 · 연속으로 자람</text>
  <text class="dn-lab dn-lab-lead" style="--d:2.6s" x="60" y="132">5'</text>
  <text class="dn-lab dn-lab-lead" style="--d:4.8s" x="404" y="196">3'</text>

  <!-- 지연 가닥 -->
  <rect class="dn-prim dn-prim-end dn-prim-lag" style="--d:5s; --d2:12s" x="196" y="202.9" width="8" height="8"/>
  <path class="dn-frag" style="--len:142; --dur:1.4s; --d:5.3s" d="M200,206.9 L60,231"/>
  <polygon class="dn-head dn-head-lag" style="--d:6.7s" points="54,232 66.9,234.9 65.1,225.1"/>

  <rect class="dn-prim dn-prim-end dn-prim-lag" style="--d:6.9s; --d2:12s" x="296" y="185.7" width="8" height="8"/>
  <path class="dn-frag" style="--len:102; --dur:1.1s; --d:7.2s" d="M300,189.7 L200,206.9"/>
  <polygon class="dn-head dn-head-lag" style="--d:8.3s" points="194,207.9 206.8,210.8 205.2,201"/>

  <rect class="dn-prim dn-prim-end dn-prim-lag" style="--d:8.6s; --d2:12s" x="386" y="170.2" width="8" height="8"/>
  <path class="dn-frag" style="--len:92; --dur:.9s; --d:8.9s" d="M390,174.2 L300,189.7"/>
  <polygon class="dn-head dn-head-lag" style="--d:9.8s" points="294,190.7 306.8,193.6 305.2,183.8"/>

  <text class="dn-lab dn-lab-lag" style="--d:5.2s" x="60" y="268">지연 가닥 · 오카자키 절편</text>
  <text class="dn-lab dn-lab-lag" style="--d:6.7s" x="44" y="222">3'</text>
  <text class="dn-lab dn-lab-lag" style="--d:6.7s" x="206" y="224">5'</text>

  <text class="dn-lab dn-lab-key" style="--d:10.2s" x="60" y="304">← 절편마다 5'→3'이지만, 분기점과는 반대로 자란다</text>
  <text class="dn-lab" style="--d:12s" x="60" y="330">프라이머가 제거되고 절편들이 이어져 한 가닥이 된다</text>

  <rect class="dn-prim dn-prim-lead" style="--d:1.6s" x="424" y="331" width="8" height="8"/>
  <text class="dn-lab" style="--d:1.6s" x="440" y="340">RNA 프라이머</text>
</svg>`;

  const scenes = [
    {
      type: "hook",
      pre: "DNA 복제 · 분기점",
      text: "두 새 가닥은 모두 5'→3'으로 자라므로, 한쪽은 끊어져서 만들어진다",
      sub: "{{선도 가닥}}은 분기점을 따라 연속으로, {{지연 가닥}}은 {{오카자키 절편}}으로 자란다. 각 절편은 {{프라이머}}에서 시작한다.",
      art: ART
    }
  ];

  LTT.deck({
    title: "DNA 복제 분기점",
    theme: "paper",
    glossary: {
      "선도 가닥": "분기점이 열리는 쪽을 따라 끊김 없이 합성되는 새 가닥",
      "지연 가닥": "분기점과 반대로 자라서 짧은 절편으로 합성되는 새 가닥",
      "오카자키 절편": "지연 가닥에서 프라이머마다 만들어지는 짧은 DNA 조각. 나중에 이어져 한 가닥이 된다",
      "프라이머": "새 가닥을 시작하는 짧은 RNA 조각. DNA 중합효소는 프라이머 끝에서만 이어 붙일 수 있다"
    },
    scenes
  });
</script>
</body>
</html>
