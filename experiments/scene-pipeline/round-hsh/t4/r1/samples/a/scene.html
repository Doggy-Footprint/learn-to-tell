<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>DNA 복제 분기점, 선도 가닥과 오카자키 절편</title>
<script type="application/json" id="ltt-meta">{"topic": "DNA 복제 분기점", "audience": "생명과학 입문 학생", "theme": "paper", "medium": "교과서 도해", "decision": "복제 과정 이해"}</script>
<script src="/kit/vendor/d3.min.js"></script>

<style>
  .fork-art { max-width: 640px; margin: 0 auto; }
  .fork-art svg { width: 100%; height: auto; display: block; }
  .fork-art .dup { stroke: var(--ltt-ink); stroke-width: 3; fill: none; }
  .fork-art .tpl { stroke: var(--ltt-ink-2); stroke-width: 3; fill: none; }
  .fork-art .lead { stroke: var(--ltt-c1); stroke-width: 4; fill: none; stroke-linecap: round; }
  .fork-art .lag { stroke: var(--ltt-c2); stroke-width: 4; fill: none; stroke-linecap: round; }
  .fork-art .prim { fill: var(--ltt-c3); }
  .fork-art .box { fill: var(--ltt-card); stroke: var(--ltt-ink); stroke-width: 1.5; }
  .fork-art .arr { stroke: var(--ltt-ink); stroke-width: 2; fill: none; }
  .fork-art .leader { stroke: var(--ltt-ink-2); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .fork-art .arr-hot { stroke: var(--ltt-accent); stroke-width: 2.5; fill: none; }
  .fork-art .mk { fill: var(--ltt-ink); }
  .fork-art .mk-hot { fill: var(--ltt-accent); }
  .fork-art text { font-size: 13px; fill: var(--ltt-ink-2); }
  .fork-art .lbl-lead { fill: var(--ltt-c1); font-weight: 600; }
  .fork-art .lbl-hot { fill: var(--ltt-accent); font-weight: 600; }
  .fork-art .lbl-mute { fill: var(--ltt-muted); }

  /* 생성 순서대로 나타난다. 시간은 --d(시작), --t(그리는 시간)로 준다 */
  .fork-art .a-fade { opacity: 0; animation: fade .5s ease var(--d, 0s) forwards; }
  .fork-art .a-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t, .8s) ease var(--d, 0s) forwards; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fork-art .a-fade { opacity: 1; animation: none; }
    .fork-art .a-draw { stroke-dashoffset: 0; animation: none; }
  }
</style>
</head>
<body>
<script>
LTT.deck({

  <text class="a-fade" style="--d:1.6s" x="372" y="136">3'</text>

  <line class="arr a-fade" style="--d:1.4s" x1="110" y1="74" x2="190" y2="74" marker-end="url(#ah)"/>
  <text class="a-fade" style="--d:2.4s" x="350" y="240" text-anchor="middle">DNA 중합효소</text>

  <rect class="prim a-fade" style="--d:2.8s" x="185" y="232" width="10" height="10"/>
  <path class="lag a-draw" pathLength="1" style="--d:3s;--t:.9s" d="M190 236.5 L120 252"/>
  <text class="a-fade" style="--d:3s" x="108" y="268">3'</text>

  <rect class="prim a-fade" style="--d:3.9s" x="275" y="212" width="10" height="10"/>
  <path class="lag a-draw" pathLength="1" style="--d:4.1s;--t:.9s" d="M280 216.6 L200 234.3"/>

  <rect class="prim a-fade" style="--d:5s" x="379" y="189" width="10" height="10"/>
  <path class="lag a-draw" pathLength="1" style="--d:5.2s;--t:.9s" d="M384 193.5 L300 212.1"/>

  <text class="a-fade" style="--d:5.1s" x="415" y="218">RNA 프라이머</text>

  <line class="leader a-fade" style="--d:6.8s" x1="195" y1="200" x2="195" y2="226"/>
  <text class="a-fade" style="--d:6.8s" x="195" y="192" text-anchor="middle">연결효소: 틈을 잇는다</text>

  <line class="arr-hot a-fade" style="--d:6.3s" x1="300" y1="292" x2="150" y2="292" marker-end="url(#ahh)"/>
  <text class="a-fade lbl-hot" style="--d:6.3s" x="225" y="314" text-anchor="middle">지연 가닥 자라는 방향 (분기점과 반대)</text>
