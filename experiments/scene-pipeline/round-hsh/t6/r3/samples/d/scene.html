<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가비지 컬렉션 방식: 같은 순환 쌍</title>
<script type="application/json" id="ltt-meta">{"topic": "가비지 컬렉션 방식", "audience": "애플리케이션 개발자", "theme": "terminal", "medium": "힙 스냅샷·메모리 프로파일러", "decision": "메모리 누수 진단"}</script>
<style>
  .rig { display: grid; gap: 10px; min-width: 0; }
  .rig svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
const SVG = "http://www.w3.org/2000/svg";
const ROOT = { id: "root", c: 1, r: 1, l: "루트", s: "지역변수", icon: "anchor" };

// 상태 한 칸: A, B 객체, 루트가 쥔 a·b(rA·rB), 참조 peer(ab: A→B, ba: B→A)
const COUNT = [
  { cap: "① A를 만든다. 루트 a가 쥐고 있어 rc = 1", hold: 1800, A: 1, rA: 1 },
  { cap: "② B를 만든다. 루트 b가 쥐어 rc = 1", hold: 1800, A: 1, B: 1, rA: 1, rB: 1 },
  { cap: "③ A.peer = B. B를 가리키는 화살표가 생겨 B의 rc = 2", hold: 1800, A: 1, B: 1, rA: 1, rB: 1, ab: 1 },
  { cap: "④ B.peer = A. A의 rc도 2. 순환이 완성된다", hold: 2000, A: 1, B: 1, rA: 1, rB: 1, ab: 1, ba: 1 },
  { cap: "⑤ 루트가 a, b를 놓는다. rc는 1, 1로 줄고 멈춘다. 0이 아니라 해제되지 않는다", hold: 2600, A: 1, B: 1, ab: 1, ba: 1 },
  { cap: "⑥ 같은 코드를 반복하면 쌍이 쌓인다. 쌍마다 +1 MB, 계단처럼 오른다", hold: 3600, loop: true },
];

const MARK = [
  { cap: "① A를 만든다. 루트 a가 쥐고 있어 루트에서 닿는다", hold: 1800, A: 1, rA: 1, sa: "도달" },
  { cap: "② B를 만든다. 루트 b가 쥐어 역시 닿는다", hold: 1800, A: 1, B: 1, rA: 1, rB: 1, sa: "도달", sb: "도달" },
  { cap: "③ A.peer = B, B.peer = A. 화살표가 생기고 순환이 완성된다. 카운트는 없다", hold: 2000, A: 1, B: 1, rA: 1, rB: 1, ab: 1, ba: 1, sa: "도달", sb: "도달" },
  { cap: "④ 루트가 놓인다. GC가 아직 안 돌아 A, B는 메모리에 그대로 있다", hold: 2200, A: 1, B: 1, ab: 1, ba: 1, sa: "GC 전", sb: "GC 전" },
  { cap: "⑤ GC: 루트에서 출발해 mark. A, B는 표시되지 않는다", hold: 2200, A: 1, B: 1, ab: 1, ba: 1, sa: "도달 불가", sb: "도달 불가" },
  { cap: "⑥ sweep: 표시 안 된 A, B를 회수한다. 순환 여부는 판단에 영향이 없다", hold: 2000, A: 0, B: 0 },
  { cap: "⑦ 반복해도 힙은 4~20 MB 사이 톱니로 돈다. GC 때 쌓인 쌍이 한꺼번에 사라진다", hold: 3600, loop: true },
];

// 그림 한 장을 다시 그린다. 카운트는 들어오는 참조 수(rc), mark 쪽은 셀 문구로 상태를 적는다.
function board(box, st, mark) {
  box.innerHTML = "";
  const svg = box.appendChild(document.createElementNS(SVG, "svg"));
  const nodes = [ROOT];
  if (st.A) nodes.push({ id: "A", c: 0, r: 0, l: "객체 A", s: mark ? st.sa : "rc = " + (st.rA + st.ba), icon: "package" });
  if (st.B) nodes.push({ id: "B", c: 2, r: 0, l: "객체 B", s: mark ? st.sb : "rc = " + (st.rB + st.ab), icon: "package" });
  const edges = [];
  if (st.rA) edges.push({ f: "root", t: "A", l: "a" });
  if (st.rB) edges.push({ f: "root", t: "B", l: "b" });
  if (st.ab) edges.push({ f: "A", t: "B", l: "peer" });
  if (st.ba) edges.push({ f: "B", t: "A", l: "peer" });
  return LTT.diagram(svg, { cols: 3, rows: 2, cell: [170, 100], node: [128, 56], nodes, edges });
}

// 힙 시계열을 쌍 수만큼 한 점씩 그린다. 모션이 꺼져 있으면 한 번에 그린다.
function trace(plot, h) {
  const pts = [];
  let t = 0;
  return {
    reset() { clearTimeout(t); pts.length = 0; plot.set("heap", []); },
    run(n) {
      this.reset();
      if (!LTT.MOTION_MS) {
        for (let i = 0; i <= n; i++) pts.push([i, h(i)]);
        plot.set("heap", pts.slice());
        return;
      }
      const tick = (i) => {
        pts.push([i, h(i)]);
        plot.set("heap", pts.slice());
        if (i < n) t = setTimeout(() => tick(i + 1), 20);
      };
      tick(0);
    },
  };
}

// 한쪽 패널: 그림(재생), 힙 시계열, 스냅샷 목록
function sideView(el, { mark, steps, h, lines }) {
  const wrap = el.appendChild(document.createElement("div"));
  wrap.className = "rig";
  const box = wrap.appendChild(document.createElement("div"));
  const plotEl = wrap.appendChild(document.createElement("div"));
  const ctl = wrap.appendChild(document.createElement("div"));
  wrap.appendChild(LTT.mock.terminal({ title: "힙 스냅샷 비교", lines }).el);

  const plot = LTT.axisPlot(plotEl, {
    width: 340, height: 120, x: [0, 100], y: [0, 110],
    series: [{ id: "heap", color: "var(--ltt-c1)" }],
    labels: { x: "반복한 쌍", y: "힙 MB" },
  });
  const heap = trace(plot, h);

  const dg = board(box, steps[0], mark);
  dg.player(ctl, steps.map((st, i) => ({
    caption: st.cap,
    hold: st.hold,
    enter: () => {
      if (st.loop) return heap.run(100);
      if (i === 0) heap.reset();
      board(box, st, mark);
    },
  })));
}

function countSide(el) {
  sideView(el, {
    mark: false,
    steps: COUNT,
    h: (i) => 4 + i,
    lines: [
      "$ 스냅샷 비교: 100쌍 전 → 후",
      { t: "warn", text: "Node  객체 +200  retained +100 MB" },
      "보유 경로: Node.peer → Node.peer → …",
      { t: "err", text: "루트까지 이어지는 경로 없음: 순환만 남았다" },
    ],
  });
}

function markSide(el) {
  sideView(el, {
    mark: true,
    steps: MARK,
    h: (i) => 4 + (i % 16),
    lines: [
      "$ GC 직후 힙 스냅샷",
      { t: "ok", text: "Node  객체 0  retained 0 MB (회수됨)" },
      "보유 경로: 없음",
      { t: "dim", text: "도달 불가 객체는 sweep 대상이다" },
    ],
  });
}

LTT.deck({
  title: "가비지 컬렉션 방식",
  theme: "terminal",
  glossary: {
    "참조 카운팅": "객체를 가리키는 참조 수(rc)를 세고, 0이 되는 순간 회수하는 방식.",
    "mark-and-sweep": "루트에서 닿는 객체를 표시(mark)한 뒤, 표시되지 않은 객체를 회수(sweep)하는 방식.",
  },
  scenes: [{
    type: "contrast",
    kicker: "런타임 · 순환 참조",
    title: "같은 순환 쌍, 카운팅은 0을 기다리고 mark-and-sweep은 루트를 본다",
    en: "Same cycle, two collectors",
    sub: "A와 B가 서로 가리키고, 루트가 둘에게서 손을 뗀 뒤의 일이다.",
    basis: "모델로 계산한 예시. 객체 512 KB, 쌍 1 MB, GC 임계 16 MB는 설명을 위한 가정값이다.",
    takeaway: "참조 카운팅은 가리키는 화살표 수가 0이어야 회수하고, mark-and-sweep은 루트에서 닿는지로 회수한다.",
    recall: "루트를 놓은 뒤 카운트가 1, 1에서 멈추는 이유는?",
    before: { label: "참조 카운팅", sub: "{{참조 카운팅}}: 화살표를 센다", visual: countSide },
    after: { label: "mark-and-sweep", sub: "{{mark-and-sweep}}: 루트에서 닿는지 본다", visual: markSide },
  }],
});
</script>
</body>
</html>
