<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가비지 컬렉션 방식: 참조 카운팅 vs mark-and-sweep</title>
<script type="application/json" id="ltt-meta">{"topic": "가비지 컬렉션 방식", "audience": "애플리케이션 개발자", "theme": "terminal", "medium": "힙 스냅샷·메모리 프로파일러", "decision": "메모리 누수 진단"}</script>
<script type="application/json" id="ltt-checks">{"rc": {"after_b_prev": {"A": 2, "B": 1, "C": 1}, "after_drop_root": {"A": 1, "B": 1, "C": 1}}, "ms": {"mark": ["root", "C"], "sweep": ["A", "B"]}}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.gc-cap { margin: 8px 0 0; min-height: 2.6em; text-align: center; color: var(--ltt-ink); }
.gc-ctl { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
.gc-ctl button { font: inherit; white-space: nowrap; color: var(--ltt-ink); background: var(--ltt-card-2); border: 1px solid var(--ltt-line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.gc-ctl span { flex: 0 0 100%; text-align: center; color: var(--ltt-muted); }
.gc-wrap { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; }
.gc-wrap > div { min-width: 0; }
.gc-wrap svg { display: block; width: 100%; height: auto; max-width: 100%; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HOLD = 2600;
const LAST = 6; // 0 A 생성, 1 B 생성, 2 B.prev=A, 3 C 생성, 4 루트 해제, 5 mark/판정, 6 sweep/결과

const CAP = {
  rc: [
    "루트가 A를 잡는다. A의 카운트는 1",
    "A.next = B로 B가 생긴다. B의 카운트는 1",
    "B.prev = A. A를 가리키는 참조가 하나 더 생겨 A = 2",
    "루트가 C를 잡는다. C = 1",
    "루트→A를 끊는다. A = 1, B = 1. 서로를 가리키는 두 간선이 카운트를 붙든다",
    "카운트가 0이 아니므로 해제하지 않는다",
    "프로파일러: 루트 경로 없이 A, B가 남았다. 보유자는 서로뿐. 순환을 끊거나 weak ref로 푼다",
  ],
  ms: [
    "루트가 A를 잡는다. 카운트는 세지 않는다",
    "A.next = B로 B가 생긴다",
    "B.prev = A. 순환이 생겨도 수거 전에는 모두 살아 있다",
    "루트가 C를 잡는다",
    "루트→A를 끊는다. 수거 주기가 오기 전이라 A, B는 아직 있다",
    "mark: 루트에서 출발해 닿는 루트와 C만 표시한다. A, B는 표시 없음",
    "sweep: 표시 없는 A, B를 해제한다. 순환도 함께 사라진다",
  ],
};

const LOG = {
  rc: [
    "new A          rc(A)=1",
    "A.next = B     rc(B)=1",
    "B.prev = A     rc(A)=2",
    "new C          rc(C)=1",
    { t: "warn", text: "drop root→A    rc(A)=1" },
    { t: "warn", text: "rc != 0 → 해제 안 함" },
    { t: "err", text: "leak: A ⇄ B · 루트 경로 없음" },
  ],
  ms: [
    "new A",
    "A.next = B",
    "B.prev = A",
    "new C",
    { t: "warn", text: "drop root→A" },
    { t: "dim", text: "mark: root → C" },
    { t: "ok", text: "sweep: A, B 해제" },
  ],
};

const drop = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined));

// 상태 i에서 보이는 그래프. 대상은 생성 순서대로 나타난다.
function graph(i, side) {
  const rc = side === "rc";
  const aCount = i >= 2 && i <= 3 ? 2 : 1;
  const unmarked = !rc && i === 5;
  const dead = !rc && i >= 6;
  const ab = (count) => ({
    s: rc ? `rc ${count}` : unmarked ? "표시 없음" : dead ? "해제" : undefined,
    k: rc ? (i >= 4 ? "bad" : undefined) : dead ? "bad" : unmarked ? "muted" : undefined,
  });
  const link = { k: rc ? (i >= 4 ? "accent" : undefined) : dead ? "bad" : undefined, dash: dead ? true : undefined };

  const nodes = [
    drop({ id: "root", c: 0, r: 0, l: "루트", icon: "anchor", k: !rc && i >= 5 ? "good" : undefined, s: !rc && i >= 5 ? "mark" : undefined }),
    drop({ id: "a", c: 1, r: 0, l: "A", icon: "package", ...ab(aCount) }),
  ];
  if (i >= 1) nodes.push(drop({ id: "b", c: 1, r: 1, l: "B", icon: "package", ...ab(1) }));
  if (i >= 3) nodes.push(drop({ id: "c", c: 0, r: 1, l: "C", icon: "package", s: rc ? "rc 1" : i >= 5 ? "mark" : undefined, k: !rc && i >= 5 ? "good" : undefined }));

  const edges = [];
  if (i <= 3) edges.push({ id: "r-a", f: "root", t: "a", l: "root" });
  if (i === 4) edges.push({ id: "r-a", f: "root", t: "a", l: "끊김", dash: true, k: "bad" });
  if (i >= 1) edges.push(drop({ id: "a-b", f: "a", t: "b", l: "next", ...link }));
  if (i >= 2) edges.push(drop({ id: "b-a", f: "b", t: "a", l: "prev", ...link }));
  if (i >= 3) edges.push(drop({ id: "r-c", f: "root", t: "c", l: "root", k: !rc && i >= 5 ? "good" : undefined }));

  return { cols: 2, rows: 2, cell: [150, 84], node: [116, 44], nodes, edges };
}

let cur = REDUCED ? LAST : 0;
let views = [];
let timer = 0;

function show(i) {
  cur = i;
  views = views.filter((v) => v.box.isConnected);
  views.forEach((v) => v.draw(i));
  if (!views.length) clearInterval(timer);
}
function restart(play) {
  clearInterval(timer);
  if (play && !REDUCED) timer = setInterval(() => show((cur + 1) % (LAST + 1)), HOLD);
}
function go(i) { show((i + LAST + 1) % (LAST + 1)); restart(false); }

function panel(side) {
  return (el) => {
    const wrap = el.appendChild(document.createElement("div"));
    wrap.className = "gc-wrap";
    const box = wrap.appendChild(document.createElement("div"));
    const draw = (i) => {
      const svg = document.createElementNS(SVG, "svg");
      const cap = document.createElement("p");
      cap.className = "gc-cap";
      cap.textContent = CAP[side][i];
      const term = LTT.mock.terminal({
        title: side === "rc" ? "heap-snapshot · 참조 카운팅" : "heap-snapshot · mark-and-sweep",
        lines: LOG[side].slice(0, i + 1).slice(-4),
      });
      box.replaceChildren(svg, cap, term.el);
      LTT.diagram(svg, graph(i, side));
    };
    views.push({ box, draw });
    draw(cur);
    if (side === "rc") {
      const ctl = wrap.appendChild(document.createElement("div"));
      ctl.className = "gc-ctl";
      ctl.innerHTML = '<button type="button" data-d="-1">이전</button><button type="button" data-d="1">다음</button><button type="button" data-p="1">자동 재생</button><span>두 쪽이 같은 순서로 함께 넘어간다</span>';
      ctl.addEventListener("click", (e) => {
        if (e.target.dataset.p) { show(0); restart(true); return; }
        const d = Number(e.target.dataset.d);
        if (d) go(cur + d);
      });
      restart(true);
    }
  };
}

LTT.deck({
  title: "가비지 컬렉션 방식: 참조 카운팅 vs mark-and-sweep",
  theme: "terminal",
  glossary: {
    "참조 카운팅": "객체마다 자기를 가리키는 참조 수를 세고, 0이 되는 순간 해제하는 방식",
    "mark-and-sweep": "루트에서 닿는 객체에 표시(mark)를 남기고, 표시 없는 객체를 해제(sweep)하는 방식",
  },
  scenes: [{
    type: "contrast",
    kicker: "메모리 누수 진단",
    title: "루트에서 닿지 않는 순환은 참조 카운팅에서만 남는다",
    sub: "같은 객체 그래프를 같은 순서로 만든 뒤 루트를 끊는다. 4번째 단계부터 두 쪽이 갈린다.",
    before: { title: "참조 카운팅", sub: "카운트가 0이어야 해제", visual: panel("rc") },
    after: { title: "mark-and-sweep", sub: "루트에서 닿는 것만 살린다", visual: panel("ms") },
    takeaway: "{{참조 카운팅}}은 순환이 있으면 카운트가 0이 되지 않아 남고, {{mark-and-sweep}}은 루트에서 닿는지만 보아 같은 순환을 수거한다. 힙 스냅샷에서 루트 경로 없이 남은 객체는 참조 카운팅 계열 누수를 의심한다.",
    recall: "힙 스냅샷에서 루트 경로 없이 남은 객체가 보이면 무엇을 의심하나?",
    basis: "객체 4개로 줄인 모델로 계산한 예시다. 실제 런타임은 세대별·증분 수거를 함께 쓰므로 세부 동작은 다를 수 있다.",
  }],
});
</script>
</body>
</html>
