<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가비지 컬렉션 방식</title>
<script type="application/json" id="ltt-meta">{"topic":"가비지 컬렉션 방식","audience":"애플리케이션 개발자","theme":"terminal","medium":"힙 스냅샷·메모리 프로파일러","decision":"메모리 누수 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.gc-fig { width: 100%; max-width: 1000px; display: block; margin: 0 auto; font-family: inherit; }
.gc-fig text { fill: var(--ltt-ink); font-size: 15px; }
.gc-fig .mut { fill: var(--ltt-muted); }
.gc-fig .ttl { font-size: 17px; font-weight: 700; }
.gc-fig .node { fill: var(--ltt-card); stroke: var(--ltt-ink-2); stroke-width: 2; }
.gc-fig .edge { fill: none; stroke: var(--ltt-ink-2); stroke-width: 2; }
.gc-fig .edge.cut { stroke: var(--ltt-muted); stroke-dasharray: 5 5; opacity: .5; }
.gc-fig .edge.hot { stroke: var(--ltt-warn); stroke-width: 3.5; }
.gc-fig .cnt { font-weight: 700; font-size: 16px; }
.gc-fig .hotnode { stroke: var(--ltt-warn); stroke-width: 3.5; }
.gc-fig .marked { fill: var(--ltt-accent-soft); stroke: var(--ltt-accent); stroke-width: 3; }
.gc-fig .gone { opacity: .18; stroke-dasharray: 4 4; }
.gc-fig .box { fill: var(--ltt-card-2); stroke: var(--ltt-line-2); stroke-width: 1.5; }
.gc-fig .bad { fill: var(--ltt-bad); font-weight: 700; }
.gc-fig .good { fill: var(--ltt-good); font-weight: 700; }
.gc-fig .acc { fill: var(--ltt-accent); font-weight: 700; }
.gc-fig .sep { stroke: var(--ltt-line); stroke-width: 1.5; }
.gc-fig [data-s] { opacity: 0; }
.gc-fig [data-s].on { opacity: 1; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const h = (p, tag, attrs, txt) => { const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; p.appendChild(e); return e; };

function gcFigure(el) {
  const s = el.appendChild(document.createElementNS(SVG, "svg"));
  s.setAttribute("viewBox", "0 0 1000 540"); s.setAttribute("class", "gc-fig");
  h(s, "defs", {}).innerHTML = '<marker id="gca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>';
  const P = {};
  [["rc", 0, "참조 카운팅"], ["ms", 510, "mark-and-sweep"]].forEach(([id, ox, name]) => {
    const g = h(s, "g", {}); const o = (x) => ox + x;
    h(g, "text", { x: o(20), y: 28, class: "ttl" }, name);
    h(g, "line", { x1: o(20), x2: o(470), y1: 40, y2: 40, class: "sep" });
    // 간선
    const eRA = h(g, "path", { d: `M${o(92)} 98 L${o(148)} 76`, class: "edge", "marker-end": "url(#gca)" });
    const eRC = h(g, "path", { d: `M${o(80)} 116 L${o(150)} 176`, class: "edge", "marker-end": "url(#gca)" });
    const eAB = h(g, "path", { d: `M${o(198)} 58 Q${o(255)} 28 ${o(312)} 58`, class: "edge", "marker-end": "url(#gca)" });
    const eBA = h(g, "path", { d: `M${o(312)} 90 Q${o(255)} 120 ${o(198)} 90`, class: "edge", "marker-end": "url(#gca)" });
    h(g, "text", { x: o(255), y: 60, "text-anchor": "middle", class: "mut" }, ".next");
    h(g, "text", { x: o(255), y: 124, "text-anchor": "middle", class: "mut" }, ".prev");
    // 노드
    const root = h(g, "rect", { x: o(20), y: 80, width: 72, height: 38, rx: 6, class: "node" });
    h(g, "text", { x: o(56), y: 104, "text-anchor": "middle" }, "root");
    const nodes = {};
    [["A", 172, 74], ["B", 336, 74], ["C", 172, 200]].forEach(([n, x, y]) => {
      nodes[n] = h(g, "circle", { cx: o(x), cy: y, r: 26, class: "node" });
      h(g, "text", { x: o(x), y: y + 5, "text-anchor": "middle", style: "font-weight:700;font-size:17px" }, n);
    });
    const out = { g, eRA, eRC, eAB, eBA, root, nodes, ox };
    if (id === "rc") {
      out.cnt = {};
      [["A", 132, 116, 2], ["B", 370, 110, 1], ["C", 206, 236, 1]].forEach(([n, x, y, v]) => {
        out.cnt[n] = h(g, "text", { x: o(x), y, class: "cnt" }, `rc=${v}`);
      });
      out.note = h(g, "text", { x: o(20), y: 262, class: "mut" }, "");
    } else {
      out.tag = {};
      ["root", "C", "A", "B"].forEach((n) => {
        const pos = { root: [56, 138], C: [172, 240], A: [172, 118], B: [336, 118] }[n];
        out.tag[n] = h(g, "text", { x: o(pos[0]), y: pos[1], "text-anchor": "middle", class: "acc", "data-s": 1 }, "mark");
      });
      out.note = h(g, "text", { x: o(20), y: 262, class: "mut" }, "");
    }
    P[id] = out;
  });
  // 프로파일러 패널
  const prof = (id, ox, head) => {
    const g = h(s, "g", { "data-s": 1 });
    h(g, "rect", { x: ox + 20, y: 282, width: 450, height: 236, rx: 8, class: "box" });
    h(g, "text", { x: ox + 36, y: 308, class: "ttl" }, head);
    return g;
  };
  const gr = prof("rc", 0, "힙 스냅샷 · 수거 뒤 남은 객체");
  const rcRows = [];
  [["A", "rc=1", "보유자: B.prev"], ["B", "rc=1", "보유자: A.next"], ["C", "rc=1", "보유자: root"]].forEach(([n, c, r], i) => {
    const y = 342 + i * 30;
    const t = h(gr, "text", { x: 38, y, "data-s": 1 }, `${n}   ${c}   ${r}`);
    rcRows.push(t);
  });
  const rcVerdict = h(gr, "text", { x: 38, y: 462, class: "bad", "data-s": 1 }, "A, B: root에서 닿는 경로 없음, 그래도 남음");
  const rcVerdict2 = h(gr, "text", { x: 38, y: 490, class: "mut", "data-s": 1 }, "→ 보유자가 서로뿐인 객체 2개 = 누수");
  const gm = prof("ms", 510, "힙 스냅샷 · 수거 뒤 남은 객체");
  const msRow = h(gm, "text", { x: 548, y: 342, "data-s": 1 }, "C   보유자: root");
  const msRel = h(gm, "text", { x: 548, y: 372, class: "mut", "data-s": 1 }, "A, B   sweep이 해제함 (mark 안 됨)");
  const msV = h(gm, "text", { x: 548, y: 462, class: "good", "data-s": 1 }, "닿지 않는 객체가 남지 않음");
  const msV2 = h(gm, "text", { x: 548, y: 490, class: "mut", "data-s": 1 }, "→ 같은 순환도 수거됨");
  const on = (e, v) => e.classList.toggle("on", v);
  const set = (k) => {
    const rc = P.rc, ms = P.ms, cut = k >= 1;
    for (const p of [rc, ms]) {
      p.eRA.classList.toggle("cut", cut); p.eRA.setAttribute("marker-end", cut ? "" : "url(#gca)");
    }
    rc.cnt.A.textContent = cut ? "rc=1" : "rc=2";
    rc.eAB.classList.toggle("hot", cut); rc.eBA.classList.toggle("hot", cut);
    rc.nodes.A.classList.toggle("hotnode", cut); rc.nodes.B.classList.toggle("hotnode", cut);
    rc.note.textContent = k === 0 ? "카운트 = 나를 가리키는 화살표 수" : (k === 1 ? "root가 끊겨도 A↔B가 서로 1을 붙든다" : "0이 아니므로 해제되지 않는다");
    ms.note.textContent = k <= 1 ? "수거 시점이 오면 root에서 출발해 닿는 것만 표시" : (k === 2 ? "mark: root에서 닿는 것은 C뿐" : "sweep: mark 안 된 A, B 해제");
    // M&S mark (k>=2): root, C
    ms.root.classList.toggle("marked", k >= 2); ms.nodes.C.classList.toggle("marked", k >= 2);
    on(ms.tag.root, k >= 2); on(ms.tag.C, k >= 2); on(ms.tag.A, false); on(ms.tag.B, false);
    const swept = k >= 3;
    ms.nodes.A.classList.toggle("gone", swept); ms.nodes.B.classList.toggle("gone", swept);
    ms.eAB.style.opacity = swept ? .15 : ""; ms.eBA.style.opacity = swept ? .15 : "";
    ms.eRC.style.opacity = "";
    on(gr, k >= 2); on(gm, k >= 2);
    rcRows.forEach((r, i) => on(r, k >= 2)); on(rcVerdict, k >= 2); on(rcVerdict2, k >= 2);
    on(msRow, swept); on(msRel, swept); on(msV, swept); on(msV2, swept);
  };
  set(0);
  return { el: s, set };
}

const scene = {
  type: "figure", title: "루트가 끊긴 순환은 참조 카운팅에선 남고, mark-and-sweep에선 사라진다",
  kicker: "가비지 컬렉션 방식", sub: "같은 코드, 같은 그래프 두 벌. 왼쪽은 참조 카운팅, 오른쪽은 mark-and-sweep",
  figure: gcFigure,
  steps: [
    { caption: "① A.next=B, B.prev=A로 서로 연결한다. 카운트는 들어오는 화살표 수라 A=2(root, B), B=1(A), C=1(root)이다.", enter: (k, f) => f.set(0) },
    { caption: "② root→A를 끊는다. 프로그램은 A, B에 더 이상 닿지 못하지만, A↔B 화살표가 A와 B의 카운트를 1로 붙든다.", enter: (k, f) => f.set(1) },
    { caption: "③ 두 방식이 갈린다. 카운트 쪽은 0이 아니라서 그대로 두고, mark 쪽은 root에서 닿는 root와 C만 표시한다. 스냅샷에서는 A, B가 루트 경로 없이 남아 있다.", enter: (k, f) => f.set(2) },
    { caption: "④ sweep이 mark 안 된 A, B를 해제한다. 스냅샷에 루트 경로 없는 객체가 남아 있다면 순환 참조 누수를 의심한다. 순환을 끊거나 weak ref를 쓴다.", enter: (k, f) => f.set(3) },
  ],
  takeaway: "카운트가 0이 아닌 것과 루트에서 닿는 것은 다른 질문이다. 스냅샷에서 루트 경로 없이 남은 객체는 참조 카운팅 계열의 순환 누수 신호다.",
  recall: "루트가 끊긴 A↔B는 참조 카운팅과 mark-and-sweep에서 각각 어떻게 되나?"
};
LTT.deck({ title: "가비지 컬렉션 방식", theme: "terminal", glossary: {}, scenes: [scene] });
</script>
</body>
</html>
