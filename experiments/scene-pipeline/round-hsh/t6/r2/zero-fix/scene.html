<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가비지 컬렉션 방식</title>
<script type="application/json" id="ltt-meta">{"topic":"가비지 컬렉션 방식","audience":"애플리케이션 개발자","theme":"terminal","medium":"힙 스냅샷·메모리 프로파일러","decision":"메모리 누수 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.gc-wrap{display:flex;flex-direction:column;gap:10px;width:100%}
.gc-svg{width:100%;height:auto;display:block}
.gc-svg text{font-family:var(--ltt-mono, ui-monospace, monospace);font-size:15px;fill:var(--ltt-ink)}
.gc-svg .m{fill:var(--ltt-muted);font-size:13px}
.gc-svg .h{font-size:16px;font-weight:700}
.gc-svg .fade{transition:opacity .5s}
.gc-cap{font-size:15px;color:var(--ltt-ink-2);min-height:3em}
</style>
</head>
<body>
<script>
const NS = "http://www.w3.org/2000/svg";
const OFF = { L: 0, R: 520 };

// 한 단계의 화면을 통째로 다시 그린다(같은 단계로 다시 들어와도 같은 화면)
function frame(s) {
  const o = [];
  const box = (x, y, w, h, cls) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" ${cls}/>`;
  const line = (x1, y1, x2, y2, st = "var(--ltt-ink-2)", dash = "") =>
    `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${st}" stroke-width="2" fill="none" ${dash ? `stroke-dasharray="${dash}"` : ""} marker-end="url(#ah)"/>`;
  o.push(`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ltt-ink-2)"/></marker></defs>`);
  o.push(`<path d="M510 0V470" stroke="var(--ltt-line)" stroke-dasharray="4 4"/>`);
  o.push(`<text class="h" x="10" y="22">참조 카운팅 · 들어오는 참조 수 == 0이면 회수</text>`);
  o.push(`<text class="h" x="530" y="22">mark-and-sweep · 루트에서 닿지 않으면 회수</text>`);

  for (const side of ["L", "R"]) {
    const ox = OFF[side];
    const gone = side === "R" && s >= 4;           // sweep이 A, B를 치운 뒤
    const freed = s >= 2;                           // x, y 해제됨
    const cyc = s >= 1;                             // A↔B 순환 완성
    // 변수 x, y (루트)
    [["x", 70], ["y", 220]].forEach(([n, y]) => {
      if (freed) {
        o.push(box(ox + 20, y, 70, 36, `fill="none" stroke="var(--ltt-muted)" stroke-dasharray="4 3"`));
        o.push(`<text class="m" x="${ox + 55}" y="${y + 23}" text-anchor="middle">${n} 해제</text>`);
      } else {
        o.push(box(ox + 20, y, 70, 36, `fill="var(--ltt-card-2)" stroke="var(--ltt-accent)" stroke-width="2"`));
        o.push(`<text x="${ox + 55}" y="${y + 23}" text-anchor="middle">${n} (루트)</text>`);
        if (s >= 0) o.push(line(ox + 92, y + 18, ox + 220, y + 18));
      }
    });
    // 객체 A, B
    [["A", 60, "B"], ["B", 210, "A"]].forEach(([n, y, other], i) => {
      const op = gone ? 0.18 : 1;
      const rc = (s >= 2 ? 1 : s >= 1 ? 2 : 1);
      const left = side === "L";
      const kept = left && s >= 3;
      o.push(`<g class="fade" style="opacity:${op}">`);
      o.push(box(ox + 222, y, 150, 56, `fill="var(--ltt-card)" stroke="${kept ? "var(--ltt-bad)" : "var(--ltt-line-2)"}" stroke-width="2" ${gone ? 'stroke-dasharray="5 4"' : ""}`));
      o.push(`<text x="${ox + 236}" y="${y + 24}">객체 ${n}</text>`);
      o.push(`<text class="m" x="${ox + 236}" y="${y + 44}">${cyc ? "peer → " + other : "peer: null"}</text>`);
      o.push(`</g>`);
      if (left) {
        o.push(`<text x="${ox + 384}" y="${y + 34}" font-weight="700" style="fill:${s >= 2 ? "var(--ltt-bad)" : "var(--ltt-ink)"}">카운트 ${rc}</text>`);
      } else if (s >= 3 && !gone) {
        o.push(`<text x="${ox + 384}" y="${y + 34}" style="fill:var(--ltt-warn)" font-weight="700">미표시</text>`);
      } else if (gone) {
        o.push(`<text x="${ox + 384}" y="${y + 34}" style="fill:var(--ltt-good)" font-weight="700">해제됨</text>`);
      }
    });
    // peer 화살표: A→B (오른쪽 줄), B→A (왼쪽 줄)
    if (cyc && !gone) {
      o.push(line(ox + 340, 118, ox + 340, 208, "var(--ltt-c1)"));
      o.push(line(ox + 255, 208, ox + 255, 118, "var(--ltt-c2)"));
    }
  }

  // 오른쪽: 진짜 누수 — 전역 cache → C
  if (s >= 5) {
    const ox = OFF.R;
    o.push(box(ox + 20, 130, 90, 36, `fill="var(--ltt-card-2)" stroke="var(--ltt-accent)" stroke-width="2"`));
    o.push(`<text x="${ox + 65}" y="${148 + 5}" text-anchor="middle">cache (루트)</text>`);
    o.push(line(ox + 112, 148, ox + 220, 148));
    o.push(box(ox + 222, 120, 150, 56, `fill="var(--ltt-card)" stroke="var(--ltt-bad)" stroke-width="2"`));
    o.push(`<text x="${ox + 236}" y="${144}">객체 C</text><text class="m" x="${ox + 236}" y="${164}">순환 없음</text>`);
    o.push(`<text x="${ox + 384}" y="${154}" style="fill:var(--ltt-good)" font-weight="700">표시됨 → 남음</text>`);
  }

  // 스냅샷 retainer 목록
  o.push(`<path d="M0 305H1000" stroke="var(--ltt-line)"/>`);
  o.push(`<text class="h" x="10" y="332">힙 스냅샷 · retainer</text>`);
  o.push(`<text class="h" x="530" y="332">힙 스냅샷 · retainer</text>`);
  const L = [], R = [];
  if (s < 2) { L.push("A ← x, B.peer  (루트 경로 있음)", "B ← y, A.peer  (루트 경로 있음)"); R.push("A ← x, B.peer  (루트 경로 있음)", "B ← y, A.peer  (루트 경로 있음)"); }
  else if (s < 3) { L.push("A ← B.peer 하나, B ← A.peer 하나", "카운트 1 ≠ 0 → 회수 조건 불충족"); R.push("GC 사이클이 돌기 전: 아직 아무것도 안 치움"); }
  else { L.push("A ← B.peer (유일)  B ← A.peer (유일)", "루트 경로: 없음 → 서로만 붙잡고 남는다"); }
  if (s === 3) R.push("mark: 루트 0개에서 출발 → 표시 0개");
  if (s >= 4) R.push("sweep: 미표시 A, B 해제 (순환이어도 회수)");
  if (s >= 5) R.push("C ← cache[...] (루트 경로 있음) → 진짜 누수");
  L.forEach((t, i) => o.push(`<text x="10" y="${362 + i * 26}">${t}</text>`));
  R.forEach((t, i) => o.push(`<text x="530" y="${362 + i * 26}">${t}</text>`));
  if (s >= 6) o.push(`<text class="h" x="10" y="448" style="fill:var(--ltt-accent)">진단 질문: 루트에서 닿는가? 닿으면 첫 retainer를 끊고, 안 닿으면 순환 retainer를 끊거나 약한 참조로.</text>`);
  return o.join("");
}

const CAPS = [
  "① 같은 코드가 A, B를 만들고 x→A, y→B로 가리킨다. 카운트는 각각 1.",
  "② A.peer=B, B.peer=A. 객체끼리 가리켜 순환이 완성된다. 들어오는 참조가 늘어 카운트는 둘 다 2.",
  "③ x, y를 해제한다. 카운트는 1로 내려가지만 0은 아니다.",
  "④ 왼쪽은 서로가 유일한 retainer라 남는다. 오른쪽은 mark가 루트에서 출발했지만 A, B에 닿지 못한다.",
  "⑤ 다음 GC 사이클의 sweep이 표시 안 된 A, B를 해제한다. 순환이어도 누수가 아니다.",
  "⑥ tracing의 진짜 누수는 순환 없는 객체 C가 전역 cache로 루트에서 닿는 경우다.",
  "⑦ 누수 진단은 먼저 '이 객체가 루트에서 닿는가'를 묻는 일이다."
];

LTT.deck({
  title: "가비지 컬렉션 방식",
  theme: "terminal",
  glossary: {
    "retainer": "어떤 객체를 가리켜 살려 두는 쪽. 힙 스냅샷은 객체마다 retainer 사슬을 보여 준다.",
    "루트": "전역 변수와 호출 스택처럼 GC가 탐색을 시작하는 출발점."
  },
  scenes: [{
    title: "순환 참조는 참조 카운팅에서만 남고, 누수 진단은 루트 도달성부터 묻는다",
    en: "Reference counting vs mark-and-sweep on a cycle",
    kicker: "런타임 · 힙 스냅샷",
    sub: "같은 A↔B 순환을 두 방식에 놓고 x, y를 해제한다. 단계를 넘기며 본다.",
    narration: "참조 카운팅은 나를 가리키는 수가 0이어야 회수하고, mark-and-sweep은 {{루트}}에서 닿는지만 본다. 순환은 앞의 수만 올린다.",
    takeaway: "참조 카운팅은 개수(국소), mark-and-sweep은 도달성(전역)으로 회수를 정한다. 누수는 회수 조건이 충족되지 않은 것이다.",
    recall: "x, y를 해제한 뒤 A↔B 순환이 참조 카운팅에서는 남고 mark-and-sweep에서는 사라지는 이유는?",
    basis: "CPython은 참조 카운팅에 순환 탐지 GC를 더하고 JVM·V8·Go는 tracing 계열이다. 아래 그림은 순수 방식의 모델.",
    mount(body) {
      body.innerHTML = `<div class="gc-wrap"><svg class="gc-svg" viewBox="0 0 1020 470"></svg><div class="gc-cap"></div><div class="gc-ctl"></div></div>`;
      const svg = body.querySelector("svg"), cap = body.querySelector(".gc-cap");
      const draw = (i) => { svg.innerHTML = frame(i); cap.textContent = CAPS[i]; };
      draw(0);
      const st = LTT.stepper(body.querySelector(".gc-ctl"), CAPS.map((c, i) => ({
        caption: c, hold: i === 3 || i === 5 ? 3200 : 2400, enter: () => draw(i)
      })));
      return { enter() { requestAnimationFrame(() => st.play && st.play()); }, leave() { st.stop && st.stop(); } };
    }
  }]
});
</script>
</body>
</html>
