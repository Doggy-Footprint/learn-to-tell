<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가비지 컬렉션 방식</title>
<script type="application/json" id="ltt-meta">{"topic": "가비지 컬렉션 방식", "audience": "애플리케이션 개발자", "theme": "terminal", "medium": "힙 스냅샷·메모리 프로파일러", "decision": "메모리 누수 진단"}</script>
<style>
  .scn g { transition: opacity 0.4s ease; }
  .scn .ltt-basis { min-height: 2.4em; margin-top: 8px; }
  .scn .ltt-basis div + div { margin-top: 2px; }
</style>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";

// 두 쪽이 같은 상태표를 밟는다. 상태마다 x, y 참조와 A↔B 연결의 켜짐 상태를 정한다.
const STATE = [
  { x: 0, y: 0, AB: 0, BA: 0 }, // 객체 A, B만 있다
  { x: 1, y: 1, AB: 0, BA: 0 }, // 변수 x -> A, y -> B
  { x: 1, y: 1, AB: 1, BA: 1 }, // A.peer = B, B.peer = A
  { x: 0, y: 1, AB: 1, BA: 1 }, // x 해제
  { x: 0, y: 0, AB: 1, BA: 1 }, // y 해제
];

// 참조 카운트는 들어오는 참조 수다. A는 x와 B.peer(BA)에서, B는 y와 A.peer(AB)에서 들어온다.
const counts = (s) => ({ A: s.x + s.BA, B: s.y + s.AB });

const diagSpec = () => ({
  cols: 3, rows: 2, cell: [112, 116], node: [92, 54],
  nodes: [
    { id: "x", c: 0, r: 0, l: "x", s: "루트 변수", icon: "anchor" },
    { id: "y", c: 2, r: 0, l: "y", s: "루트 변수", icon: "anchor" },
    { id: "A", c: 0, r: 1, l: "A", s: "객체", icon: "package" },
    { id: "B", c: 2, r: 1, l: "B", s: "객체", icon: "package" },
  ],
  edges: [
    { id: "xA", f: "x", t: "A", l: "참조" },
    { id: "yB", f: "y", t: "B", l: "참조" },
    { id: "AB", f: "A", t: "B", l: "peer", lo: [0, -16] },
    { id: "BA", f: "B", t: "A", l: "peer", lo: [0, 16] },
  ],
});

// 각 단계: st는 상태표 행, sweep이면 A·B를 회수한 뒤 모습
const RC_STEPS = [
  { st: 0, cap: "A와 B를 만든다. 아직 서로도, 변수도 가리키지 않는다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B}`] },
  { st: 1, cap: "변수 x가 A를, y가 B를 가리킨다. 카운트가 1씩 오른다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B}`] },
  { st: 2, cap: "A.peer = B, B.peer = A로 서로 잇는다. 카운트가 2가 된다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B}`] },
  { st: 3, cap: "x를 해제한다. A 카운트가 1로 내려간다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B}`] },
  { st: 4, cap: "y를 해제한다. 둘 다 1에서 멈춘다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B}`, "A의 retainer: B뿐 · B의 retainer: A뿐"] },
  { st: 4, cap: "GC 시점. 0이 아니므로 회수 트리거가 오지 않는다.", lines: (c) => [`카운트  A ${c.A} · B ${c.B} → 회수 안 됨`, "루트 경로 0개 → 힙에 남는다"] },
];

const MS_STEPS = [
  { st: 0, cap: "A와 B를 만든다. 아직 루트에서 닿는 것이 없다.", lines: () => ["루트에서 도달: 0개"] },
  { st: 1, cap: "x가 A를, y가 B를 가리킨다. 루트에서 닿는 길이 생긴다.", lines: () => ["루트 → A, 루트 → B"] },
  { st: 2, cap: "A.peer = B, B.peer = A로 서로 잇는다. 루트 경로는 그대로다.", lines: () => ["루트 → A ↔ B"] },
  { st: 3, cap: "x를 해제한다. A는 아직 y → B → A 경로로 닿는다.", lines: () => ["루트 → y → B → A"] },
  { st: 4, cap: "y를 해제한다. 루트에서 A, B로 가는 길이 모두 끊긴다.", lines: () => ["루트에서 도달: 0개"] },
  { st: 4, cap: "mark: 루트에서 닿는 객체만 표시한다. A, B는 표시되지 않는다.", lines: () => ["표시 0개 · 미표시 A, B"] },
  { st: 4, sweep: true, cap: "sweep: 표시 안 된 A, B를 회수한다. 순환이 있어도 치운다.", lines: () => ["회수 A, B"] },
];

const paint = (dg, panel, step) => {
  const s = STATE[step.st];
  const gone = !!step.sweep;
  const fade = (id, on, edge) => {
    const el = edge ? dg.edge(id) : dg.node(id);
    if (el) el.style.opacity = on ? 1 : 0.14;
  };
  fade("x", s.x, false);
  fade("y", s.y, false);
  fade("A", !gone, false);
  fade("B", !gone, false);
  fade("xA", s.x, true);
  fade("yB", s.y, true);
  fade("AB", s.AB && !gone, true);
  fade("BA", s.BA && !gone, true);
  panel.innerHTML = step.lines(counts(s)).map((t) => `<div>${t}</div>`).join("");
};

const side = (steps) => (el) => {
  const wrap = el.appendChild(document.createElement("div"));
  wrap.className = "scn";
  const svg = wrap.appendChild(document.createElementNS(SVG, "svg"));
  const panel = wrap.appendChild(document.createElement("div"));
  panel.className = "ltt-basis";
  const dg = LTT.diagram(svg, diagSpec());
  paint(dg, panel, steps[0]);
  dg.player(wrap, steps.map((step) => ({
    caption: step.cap,
    hold: 2000,
    enter: () => paint(dg, panel, step),
  })));
};

LTT.deck({
  title: "같은 순환이어도 회수 조건이 다르다: 카운트 0 대 루트 도달성",
  theme: "terminal",
  glossary: {
    "루트": "GC가 출발점으로 삼는 전역 변수와 스택. 여기서 닿는 객체만 살아 남는다.",
  },
  scenes: [
    {
      type: "contrast",
      kicker: "런타임 · 순환 참조",
      title: "같은 순환이어도 회수 조건이 다르다: 카운트 0 대 루트 도달성",
      en: "Reference counting vs mark-and-sweep",
      sub: "같은 A↔B 순환을 두 런타임에 놓고, 변수 x, y를 차례로 해제한 뒤 GC 시점을 본다.",
      before: {
        label: "참조 카운팅",
        tone: "bad",
        visual: side(RC_STEPS),
        note: "A, B가 서로뿐인 retainer라 카운트가 0이 되지 않아 회수 트리거가 오지 않는다.",
      },
      after: {
        label: "mark-and-sweep",
        tone: "good",
        visual: side(MS_STEPS),
        note: "루트에서 닿지 않는 A, B는 mark에서 표시되지 않아 sweep이 치운다.",
      },
      takeaway: "누수는 순환이 있는가가 아니라 회수 조건이 채워졌는가다. 진단은 이 객체가 {{루트}}에서 닿는지부터 묻는다.",
      recall: "루트에서 닿는 경로가 있는데 남은 객체라면, 진단은 어느 참조를 먼저 끊어야 할까?",
      basis: "모델로 계산한 예시. 순수 참조 카운팅 기준이며, CPython은 순환 탐지 GC를 더하고 V8·JVM·Go는 tracing 계열이다.",
    },
  ],
});
</script>
</body>
</html>
