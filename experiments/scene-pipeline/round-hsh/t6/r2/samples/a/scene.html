<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가비지 컬렉션 방식 · 같은 순환, 다른 회수 조건</title>
<script type="application/json" id="ltt-meta">{"topic": "가비지 컬렉션 방식", "audience": "애플리케이션 개발자", "theme": "terminal", "medium": "힙 스냅샷·메모리 프로파일러", "decision": "메모리 누수 진단"}</script>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
const SVG = "http://www.w3.org/2000/svg";

// 두 런타임이 같은 그래프를 본다: 변수 x, y가 객체 A, B를 가리키고, A와 B는 서로를 가리킨다
const NODES = [
  { id: "x", c: 0, r: 0, l: "변수 x", s: "루트", icon: "user" },
  { id: "A", c: 1, r: 0, l: "객체 A", s: "peer → B", icon: "memory" },
  { id: "B", c: 1, r: 1, l: "객체 B", s: "peer → A", icon: "memory" },
  { id: "y", c: 0, r: 1, l: "변수 y", s: "루트", icon: "user" },
];
const EDGES = [
  { f: "x", t: "A" },
  { f: "y", t: "B" },
  { f: "A", t: "B" },
  { f: "B", t: "A" },
];

// 각 단계: [자막, 강조할 노드·엣지(null이면 전부 선명), 단계 끝 상태 문구]
const side = (steps) => (el) => {
  const wrap = el.appendChild(document.createElement("div"));
  const svg = wrap.appendChild(document.createElementNS(SVG, "svg"));
  const state = wrap.appendChild(document.createElement("div"));
  state.className = "ltt-mono";
  const dg = LTT.diagram(svg, { cols: 2, rows: 2, cell: [240, 150], node: [140, 60], nodes: NODES, edges: EDGES });
  const ctrl = wrap.appendChild(document.createElement("div"));
  dg.player(ctrl, steps.map(([caption, ids, text]) => ({
    caption,
    hold: 2400,
    enter: (d) => { d.highlight(ids); state.textContent = text; },
  })));
};

// 참조 카운팅: 카운트 = 들어오는 참조 수. 0이 되어야 회수한다.
const RC_STEPS = [
  ["객체 A, B를 만든다. 아직 가리키는 것이 없다.", ["A", "B"], "카운트  A 0 · B 0"],
  ["x는 A를, y는 B를 가리킨다.", ["x>A", "y>B"], "카운트  A 1 · B 1"],
  ["A와 B가 서로를 가리킨다. 들어오는 참조가 하나씩 늘어난다.", ["A>B", "B>A"], "카운트  A 2 · B 2"],
  ["x를 해제한다. A의 카운트가 1로 내려간다.", ["y>B", "A>B", "B>A"], "카운트  A 1 · B 2"],
  ["y도 해제한다. 둘 다 1에서 멈춘다. 0이 아니므로 회수 트리거가 오지 않는다.", ["A>B", "B>A"], "카운트  A 1 · B 1  → 회수 안 됨"],
];

// mark-and-sweep: 루트에서 닿는 객체만 표시하고, 표시 안 된 것을 쓸어 낸다.
const MS_STEPS = [
  ["객체 A, B를 만들고 x, y, A↔B로 연결한다. 같은 그래프다.", null, "표시  — (GC 전)"],
  ["x, y를 해제한다. 루트 집합에 닿는 것이 남지 않는다.", ["A", "B"], "루트에서 출발할 경로  0개"],
  ["mark: 루트에서 도달하는 객체만 표시한다. A, B는 도달되지 않아 표시 0개.", null, "표시  0개 · 미표시  A, B"],
  ["sweep: 표시되지 않은 A, B를 해제한다. 순환이 있어도 회수된다.", ["A", "B"], "표시  0개 · 해제  A, B"],
];

LTT.deck({
  title: "같은 순환이라도 카운트 방식은 남기고, 도달성 방식은 치운다",
  theme: "terminal",
  glossary: {
    "루트": "전역 변수와 실행 중인 스택처럼, 거기서 출발해 닿는 객체만 살아 있다고 보는 시작점",
  },
  scenes: [
    {
      type: "contrast",
      title: "같은 순환이라도 카운트 방식은 남기고, 도달성 방식은 치운다",
      kicker: "가비지 컬렉션 방식",
      en: "Same cycle, different question",
      sub: "A↔B 순환을 두 런타임에 놓고, 변수 x, y를 해제한 뒤 A, B가 어떻게 되는지 본다",
      before: {
        label: "참조 카운팅",
        tone: "bad",
        visual: side(RC_STEPS),
        foot: { label: "해제 직후", caption: "카운트 1로 남아, 회수 조건(0)이 영영 오지 않는다" },
      },
      after: {
        label: "mark-and-sweep",
        tone: "good",
        visual: side(MS_STEPS),
        foot: { label: "해제 직후", caption: "다음 GC 사이클에서 루트에서 닿지 않아 sweep된다" },
      },
      takeaway: "누수는 순환이 있는가가 아니라 회수 조건이 충족되었는가다. 누수 진단은 {{루트}}에서 이 객체가 닿는지부터 묻는다.",
      recall: "루트에서 닿는 경로가 있는데 남은 객체라면, 진단은 어느 참조를 먼저 끊어야 할까?",
      basis: "손 계산 예시(모델로 계산한 예시). 순수 참조 카운팅 기준이며, CPython 같은 런타임은 순환 탐지용 GC를 더한다.",
    },
  ],
});
</script>
</body>
</html>
