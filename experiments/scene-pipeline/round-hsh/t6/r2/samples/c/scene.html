<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가비지 컬렉션 방식</title>
<script type="application/json" id="ltt-meta">{"topic": "가비지 컬렉션 방식", "audience": "애플리케이션 개발자", "theme": "terminal", "medium": "힙 스냅샷·메모리 프로파일러", "decision": "메모리 누수 진단"}</script>
<style>
  .scn g { transition: opacity 0.4s ease; }
  .scn .ltt-basis { min-height: 3.6em; margin-top: 8px; }
  .scn .ltt-basis div + div { margin-top: 2px; }
</style>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";

// 두 쪽이 같은 다섯 단계를 밟는다. 단계마다 x, y 참조와 A↔B 연결의 켜짐 상태를 정한다.
const FLOW = [
  { x: 0, y: 0, AB: 0, BA: 0 }, // 객체 A, B만 만든다
  { x: 1, y: 1, AB: 0, BA: 0 }, // 변수 x -> A, y -> B
  { x: 1, y: 1, AB: 1, BA: 1 }, // A.peer = B, B.peer = A
  { x: 0, y: 0, AB: 1, BA: 1 }, // x, y 해제
  { x: 0, y: 0, AB: 1, BA: 1 }, // GC 시점
];

// 참조 카운트는 들어오는 참조 수다. A는 x와 B.peer(BA)에서, B는 y와 A.peer(AB)에서 들어온다.
const counts = (s) => ({ A: +s.x + s.BA, B: +s.y + s.AB });

const diagSpec = () => ({
  cols: 3, rows: 2, cell: [210, 130], node: [140, 60],
  nodes: [
    { id: "x", c: 0, r: 0, l: "x", s: "루트 변수", icon: "anchor" },
    { id: "y", c: 2, r: 0, l: "y", s: "루트 변수", icon: "anchor" },
    { id: "A", c: 0, r: 1, l: "A", s: "객체", icon: "package" },
    { id: "B", c: 2, r: 1, l: "B", s: "객체", icon: "package" },
  ],
  edges: [
    { id: "xA", f: "x", t: "A", l: "참조" },
    { id: "yB", f: "y", t: "B", l: "참조" },
    { id: "AB", f: "A", t: "B", l: "peer", lo: [0, -16] },
    { id: "BA", f: "B", t: "A", l: "peer", lo: [0, 16] },
  ],
});

const SIDES = {
  rc: {
    sweep: false,
    steps: [
      "A와 B를 만든다. 아직 서로도, 변수도 가리키지 않는다.",
      "변수 x가 A를, y가 B를 가리킨다. 카운트가 1씩 오른다.",
      "A.peer = B, B.peer = A로 서로 잇는다. 카운트가 2가 된다.",
      "x, y를 해제한다. 카운트는 1로 내려가지만 0이 아니다.",
      "GC 시점. 카운트가 0이 아니므로 회수 조건이 오지 않는다.",
    ],
    lines: [
      (c) => [`카운트 A=${c.A}, B=${c.B}`, "retainer 없음"],
      (c) => [`카운트 A=${c.A}, B=${c.B}`, "A의 retainer: x (루트 경로 있음)", "B의 retainer: y (루트 경로 있음)"],
      (c) => [`카운트 A=${c.A}, B=${c.B}`, "A의 retainer: x(루트), B", "B의 retainer: y(루트), A"],
      (c) => [`카운트 A=${c.A}, B=${c.B}`, "A의 retainer: B뿐, 루트 경로 없음", "B의 retainer: A뿐, 루트 경로 없음"],
      (c) => [`카운트 A=${c.A}, B=${c.B}`, "0이 아니므로 회수 안 됨 → 힙에 남는 누수"],
    ],
  },
  ms: {
    sweep: true,
    steps: [
      "A와 B를 만든다. 아직 루트에서 닿는 것이 없다.",
      "변수 x가 A를, y가 B를 가리킨다. 스냅샷에서 루트 경로가 보인다.",
      "A.peer = B, B.peer = A로 서로 잇는다. 루트 경로는 그대로다.",
      "x, y를 해제한다. 루트에서 A, B로 가는 길이 끊긴다.",
      "GC 시점. mark는 루트에서 닿은 것만 표시하고, sweep이 표시 안 된 A, B를 회수한다.",
    ],
    lines: [
      () => ["루트에서 도달하는 객체: 없음"],
      () => ["스냅샷 retainer: x → A, y → B (루트 경로 있음)"],
      () => ["스냅샷 retainer: x → A → B, y → B → A (루트 경로 있음)"],
      () => ["루트에서 도달하는 객체: 0개 (x, y 해제됨)"],
      () => ["mark 표시 0개 → sweep 대상 A, B 회수"],
    ],
  },
};

const paint = (dg, panel, cfg, i) => {
  const s = FLOW[i];
  const c = counts(s);
  const swept = cfg.sweep && i === 4;
  const fade = (id, on, edge) => {
    const el = edge ? dg.edge(id) : dg.node(id);
    if (el) el.style.opacity = on ? 1 : 0.14;
  };
  fade("x", s.x, false);
  fade("y", s.y, false);
  fade("A", !swept, false);
  fade("B", !swept, false);
  fade("xA", s.x, true);
  fade("yB", s.y, true);
  fade("AB", s.AB && !swept, true);
  fade("BA", s.BA && !swept, true);
  panel.innerHTML = cfg.lines[i](c).map((t) => `<div>${t}</div>`).join("");
};

const side = (key) => (el) => {
  const cfg = SIDES[key];
  const wrap = el.appendChild(document.createElement("div"));
  wrap.className = "scn";
  const svg = wrap.appendChild(document.createElementNS(SVG, "svg"));
  const panel = wrap.appendChild(document.createElement("div"));
  panel.className = "ltt-basis";
  const dg = LTT.diagram(svg, diagSpec());
  paint(dg, panel, cfg, 0);
  dg.player(wrap, cfg.steps.map((caption, i) => ({
    caption,
    hold: 2000,
    enter: () => paint(dg, panel, cfg, i),
  })));
};

LTT.deck({
  title: "가비지 컬렉션 방식",
  theme: "terminal",
  glossary: {
    "루트": "GC가 출발점으로 삼는 전역 변수와 스택. 여기서 닿는 객체만 살아 남는다.",
    "retainer": "어떤 객체를 붙잡고 있는 쪽. 힙 스냅샷에서 누가 이 객체를 가리키는지 보여준다.",
  },
  scenes: [
    {
      type: "contrast",
      kicker: "런타임 · 순환 참조",
      title: "순환 참조는 카운트로는 영영 안 풀리고, mark-and-sweep은 루트에서 닿지 않으면 회수한다",
      en: "Reference counting vs mark-and-sweep",
      sub: "같은 A↔B 순환을 두 런타임에 놓고, 변수 x와 y를 해제한 뒤 GC 시점을 본다.",
      narration: "x와 y를 해제해도 A와 B는 서로를 한 번씩 가리킨다. 참조 카운팅은 들어오는 참조 수가 0일 때만 회수하므로 남고, mark-and-sweep은 {{루트}}에서 닿는지만 보므로 회수한다. 그래서 누수를 볼 때는 {{붙잡는 쪽|retainer}}가 루트까지 이어지는지부터 확인한다.",
      before: { title: "참조 카운팅", visual: side("rc") },
      after: { title: "mark-and-sweep", visual: side("ms") },
      takeaway: "회수 조건이 다르다. 참조 카운팅은 카운트 0, tracing은 루트에서 닿지 않음이다.",
      recall: "힙 스냅샷에서 누수를 볼 때 가장 먼저 확인할 것은?",
      basis: "모델로 계산한 예시. 실제 CPython은 참조 카운팅에 순환 탐지 GC를 더하고, JVM·V8·Go는 tracing 계열이다.",
    },
  ],
});
</script>
</body>
</html>
