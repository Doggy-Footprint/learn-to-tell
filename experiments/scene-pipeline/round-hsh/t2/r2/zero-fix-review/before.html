<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP 혼잡 제어</title>
<script type="application/json" id="ltt-meta">{"topic":"TCP 혼잡 제어","audience":"백엔드·네트워크 개발자","theme":"lab","medium":"cwnd 시계열 플롯","decision":"전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .cw { display: grid; gap: 10px; }
  .cw svg { width: 100%; height: auto; display: block; }
  .cw .ask { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 40px; }
  .cw .ask button { font: inherit; padding: 6px 14px; border: 1px solid var(--ltt-line-2); background: var(--ltt-card); color: var(--ltt-ink); border-radius: 8px; cursor: pointer; }
  .cw .ask button:hover { border-color: var(--ltt-accent); }
  .cw .ask button.pick { border-color: var(--ltt-accent); background: var(--ltt-accent-soft); }
  .cw .ask button.right { border-color: var(--ltt-good); background: var(--ltt-good-soft); }
  .cw .ask button:disabled { cursor: default; }
  .cw .msg { color: var(--ltt-ink-2); }
  .cw .stats { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; min-height: 56px; transition: opacity .4s; }
  .cw .stats[data-off] { opacity: 0; }
  .cw .stats .ltt-stat { display: grid; gap: 2px; }
  .cw .stats .ltt-stat span { color: var(--ltt-muted); font-size: 13px; }
  .cw text { fill: var(--ltt-ink-2); font-size: 13px; }
  .cw text.m { fill: var(--ltt-muted); }
  .cw text.b { fill: var(--ltt-ink); font-weight: 600; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const X = (r) => 56 + r * (680 / 76), Y = (c) => 316 - c * (290 / 72);
const mbps = (cwnd) => cwnd * 1460 * 8 / 0.05 / 1e6;

const slow = [0, 1, 2, 3, 4, 5, 6].map((r) => [r, 2 ** r]);
const dup = [[6, 64], [6, 32]];
for (let r = 7; r <= 38; r++) dup.push([r, 32 + (r - 6)]);
dup.push([38, 32]);
for (let r = 39; r <= 70; r++) dup.push([r, 32 + (r - 38)]);
dup.push([70, 32]);
for (let r = 71; r <= 76; r++) dup.push([r, 32 + (r - 70)]);
const tout = [[6, 64], [6, 1], [7, 2], [8, 4], [9, 8], [10, 16], [11, 32]];
for (let r = 12; r <= 43; r++) tout.push([r, 32 + (r - 11)]);

const d = (pts) => pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
const mk = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n); return n; };
const txt = (parent, x, y, s, cls, anchor) => { const t = mk("text", { x, y, class: cls || "", "text-anchor": anchor || "start" }, parent); t.textContent = s; return t; };
const sleep = (ms) => new Promise((r) => setTimeout(r, LTT.MOTION_MS ? ms : 0));
const reveal = (n) => { n.style.transition = "opacity .4s"; n.style.opacity = 0; requestAnimationFrame(() => requestAnimationFrame(() => { n.style.opacity = 1; })); };

function drawPath(path, ms) {
  const len = path.getTotalLength();
  if (!LTT.MOTION_MS) return Promise.resolve();
  path.style.transition = "none";
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  path.getBoundingClientRect();
  path.style.transition = "stroke-dashoffset " + ms + "ms linear";
  path.style.strokeDashoffset = 0;
  return new Promise((r) => setTimeout(() => { path.style.strokeDasharray = path.dataset.dash || "none"; r(); }, ms));
}

const scene = {
  title: "손실이 나도 cwnd는 1로 돌아가지 않는다. 절반에서 천천히 다시 오른다",
  en: "TCP congestion control: slow start to AIMD sawtooth",
  kicker: "예측",
  sub: "가로는 RTT(왕복 시간), 세로는 cwnd(MSS). RTT 6에서 cwnd 64가 병목 한계에 닿아 패킷이 버려진다.",
  takeaway: "중복 ACK 손실은 cwnd를 절반으로, 타임아웃은 1로 떨어뜨린다. 이후엔 RTT마다 +1 MSS씩만 오르니, 처리량은 톱니 평균(최고점의 약 75%)에 머문다.",
  recall: "cwnd 64에서 중복 ACK로 손실을 감지하면 cwnd와 ssthresh는 각각 얼마가 되나?",
  basis: "Reno 기준(RFC 5681). MSS 1460 B, RTT 50 ms, 한계 cwnd 64는 가정한 예시. 모델로 계산한 예시.",
  mount(body) {
    body.innerHTML = `<div class="cw"><svg viewBox="0 0 760 350" role="img" aria-label="cwnd 시계열: slow start, 손실, 반감 후 톱니"></svg>
      <div class="ask"></div><div class="msg"></div>
      <div class="stats" data-off="1"></div></div>`;
    const svg = body.querySelector("svg"), ask = body.querySelector(".ask"), msg = body.querySelector(".msg"), stats = body.querySelector(".stats");
    let token = 0;

    function build() {
      svg.innerHTML = "";
      // 축
      for (const c of [1, 32, 64]) {
        mk("line", { x1: X(0), x2: X(76), y1: Y(c), y2: Y(c), stroke: "var(--ltt-line)", "stroke-width": 1 }, svg);
        txt(svg, X(0) - 8, Y(c) + 4, c, "m", "end");
      }
      for (const r of [0, 10, 20, 30, 40, 50, 60, 70]) txt(svg, X(r), 336, r, "m", "middle");
      mk("line", { x1: X(0), x2: X(0), y1: Y(0), y2: Y(72), stroke: "var(--ltt-ink-2)" }, svg);
      mk("line", { x1: X(0), x2: X(76), y1: Y(0), y2: Y(0), stroke: "var(--ltt-ink-2)" }, svg);
      txt(svg, X(76), 348, "RTT", "m", "end");
      txt(svg, X(0) + 4, 16, "cwnd (MSS)", "m");
      // 병목 한계
      mk("line", { x1: X(0), x2: X(76), y1: Y(64), y2: Y(64), stroke: "var(--ltt-bad)", "stroke-width": 1.5, "stroke-dasharray": "2 4" }, svg);
      txt(svg, X(76), Y(64) - 6, "병목 한계 = BDP + 큐 (64)", "m", "end");
      const g = mk("g", {}, svg);
      return g;
    }

    async function run() {
      const my = ++token;
      const ok = () => my === token;
      ask.innerHTML = ""; msg.textContent = ""; stats.dataset.off = 1; stats.innerHTML = "";
      const g = build();
      // 1. slow start
      const p1 = mk("path", { d: d(slow), fill: "none", stroke: "var(--ltt-ink)", "stroke-width": 2.5, "stroke-linejoin": "round" }, g);
      await drawPath(p1, 1400); if (!ok()) return;
      const lab1 = txt(g, X(1.2), Y(40), "slow start: RTT마다 ×2", "b"); reveal(lab1);
      slow.forEach((p) => mk("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: "var(--ltt-ink)" }, g));
      // 2. 손실
      const lx = X(6), ly = Y(64);
      const loss = mk("g", {}, g);
      mk("path", { d: `M${lx - 7} ${ly - 7}L${lx + 7} ${ly + 7}M${lx + 7} ${ly - 7}L${lx - 7} ${ly + 7}`, stroke: "var(--ltt-bad)", "stroke-width": 3, fill: "none" }, loss);
      txt(loss, lx + 14, ly - 12, "RTT 6: cwnd 64에서 패킷 손실", "b");
      reveal(loss);
      msg.textContent = "중복 ACK 3개로 손실을 감지했다. 직후 cwnd는 어디로 떨어질까?";
      const choices = [["a", "1 MSS", false], ["b", "32 MSS", true], ["c", "48 MSS", false]];
      choices.forEach(([id, label, right]) => {
        const b = document.createElement("button"); b.textContent = label; b.dataset.right = right ? 1 : "";
        b.onclick = () => answer(b, right); ask.appendChild(b);
      });
      const answer = async (btn, right) => {
        ask.querySelectorAll("button").forEach((x) => { x.disabled = true; if (x.dataset.right) x.classList.add("right"); });
        if (!right) btn.classList.add("pick");
        // 3. ssthresh 먼저, 그다음 cwnd 하강
        msg.textContent = right ? "맞다. 손실 때 cwnd 64의 절반이 ssthresh가 되고, cwnd가 그 값으로 내려온다."
          : "1은 타임아웃일 때의 값이다. 중복 ACK 손실이면 절반으로만 깎인다. 순서를 본다: ssthresh가 먼저 정해지고 cwnd가 따라 내려온다.";
        const th = mk("line", { x1: X(6), x2: X(76), y1: Y(32), y2: Y(32), stroke: "var(--ltt-accent)", "stroke-width": 1.5, "stroke-dasharray": "6 4" }, g);
        const thl = txt(g, X(76), Y(32) + 16, "ssthresh = 32 (손실 때 cwnd 64의 절반)", "m", "end");
        reveal(th); reveal(thl);
        await sleep(900); if (!ok()) return;
        // 타임아웃 경로
        const p3 = mk("path", { d: d(tout), fill: "none", stroke: "var(--ltt-warn)", "stroke-width": 2.5, "stroke-dasharray": "7 5", "stroke-linejoin": "round" }, g);
        p3.dataset.dash = "7 5";
        const p2 = mk("path", { d: d(dup.slice(0, 2 + 32)), fill: "none", stroke: "var(--ltt-accent)", "stroke-width": 3, "stroke-linejoin": "round" }, g);
        mk("rect", { x: X(6) - 5, y: Y(32) - 5, width: 10, height: 10, fill: "var(--ltt-accent)" }, g);
        await drawPath(p2, 1800); if (!ok()) return;
        txt(g, X(12), Y(32) - 22, "중복 ACK: 64 → 32, 이후 RTT마다 +1", "b");
        txt(g, X(12), Y(32) - 6, "32 RTT(1.6 s) 걸려 다시 64", "m");
        await sleep(500); if (!ok()) return;
        mk("circle", { cx: X(6), cy: Y(1), r: 5, fill: "var(--ltt-warn)" }, g);
        await drawPath(p3, 1500); if (!ok()) return;
        txt(g, X(12.5), Y(8), "타임아웃(RTO): 64 → 1, slow start로 32까지 5 RTT", "b");
        await sleep(700); if (!ok()) return;
        // 톱니 반복
        const p4 = mk("path", { d: d(dup.slice(2 + 32)), fill: "none", stroke: "var(--ltt-accent)", "stroke-width": 3 }, g);
        await drawPath(p4, 1800); if (!ok()) return;
        const avg = mk("line", { x1: X(6), x2: X(76), y1: Y(48), y2: Y(48), stroke: "var(--ltt-ink)", "stroke-width": 1.5, "stroke-dasharray": "1 5", "stroke-linecap": "round" }, g);
        const avgl = txt(g, X(76), Y(48) - 6, "톱니 평균 cwnd = 48 (최고점의 75%)", "b", "end");
        reveal(avg); reveal(avgl);
        stats.innerHTML = `
          <div class="ltt-stat"><b class="ltt-hero">${mbps(64).toFixed(1)}<small> Mbit/s</small></b><span>최고점 (cwnd 64)</span></div>
          <div class="ltt-stat"><b class="ltt-hero">${mbps(48).toFixed(1)}<small> Mbit/s</small></b><span>톱니 평균 (cwnd 48)</span></div>
          <div class="ltt-stat"><b class="ltt-hero">${mbps(1).toFixed(2)}<small> Mbit/s</small></b><span>타임아웃 직후 (cwnd 1)</span></div>
          <div class="msg" style="flex:1;min-width:260px">진단: 톱니가 32↔64로 규칙적이면 정상 AIMD다. 바닥(1)까지 자주 무너지면 타임아웃 위주의 손실이라 처리량이 떨어진다. <span class="ltt-tag">모델로 계산한 예시</span></div>`;
        stats.removeAttribute("data-off");
        const re = document.createElement("button"); re.textContent = "다시 예측"; re.onclick = run;
        ask.appendChild(re);
      };
    }
    return { enter() { run(); }, leave() { token++; } };
  }
};

LTT.expect("최고점 처리량 Mbit/s", mbps(64), 14.95, { tol: 0.01 });
LTT.expect("평균 처리량 Mbit/s", mbps(48), 11.21, { tol: 0.01 });
LTT.expect("타임아웃 직후 Mbit/s", mbps(1), 0.234, { tol: 0.001 });

LTT.deck({ title: "TCP 혼잡 제어", theme: "lab", glossary: {}, scenes: [scene] });
</script>
</body>
</html>
