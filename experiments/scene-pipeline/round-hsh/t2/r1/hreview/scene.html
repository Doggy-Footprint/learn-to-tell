<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP 혼잡 제어: 첫 손실 뒤 곡선</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const T_END = 44;

// 첫 손실(t=2) 전까지의 곡선: RTT마다 2배
const PRE = [[0, 10], [1, 20], [2, 40]];
// 실제 곡선, 시간순. 같은 t에 점이 둘이면 손실 직후의 낙하다. 손실은 t=2, 22, 42에서 40일 때 난다.
const ramp = (t0, t1, from) => Array.from({ length: t1 - t0 + 1 }, (_, i) => [t0 + i, from + i]);
const FULL = [...PRE, [2, 20], ...ramp(3, 22, 21), [22, 20], ...ramp(23, 42, 21), [42, 20], [43, 21], [44, 22]];

const text = (svg, x, y, s, fill) => {
  const n = document.createElementNS(SVG, "text");
  n.setAttribute("x", x); n.setAttribute("y", y); n.textContent = s;
  if (fill) n.style.fill = fill;
  svg.appendChild(n);
};

function plot(el) {
  const ax = LTT.axisPlot(el, {
    width: 680, height: 250, x: [0, T_END], y: [0, 48],
    labels: { x: "왕복 시간(RTT) 수", y: "보내는 양 (패킷 단위)" },
    series: [{ id: "cwnd", color: "var(--ltt-accent)" }, { id: "ssth", color: "var(--ltt-muted)", dash: true }, { id: "cap", color: "var(--ltt-muted)", dot: true }],
  });
  ax.set("cap", [[0, 40], [T_END, 40]]);
  text(el.querySelector("svg"), ax.x(10), ax.y(40) - 8, "병목 한계 40 MSS", "var(--ltt-muted)");
  return ax;
}

// 손실 점 표식: 40에서 찍히고 "손실" 라벨이 붙는다
const mark = (svg, ax, t) => {
  const c = document.createElementNS(SVG, "circle");
  c.setAttribute("cx", ax.x(t)); c.setAttribute("cy", ax.y(40)); c.setAttribute("r", 6);
  c.style.fill = "var(--ltt-ink)";
  svg.appendChild(c);
  text(svg, ax.x(t) + 10, ax.y(40) - 10, "손실", "var(--ltt-ink)");
};

// 점을 시간순으로 하나씩 그린다. from번째 점부터 간격을 두고, 그 앞은 바로 그린다.
// 같은 t의 두 점이면 손실 직후 낙하라서, 낙하 뒤 처음 한 번만 ssthresh 기준선을 낸다.
function grow(el, pts, from) {
  const ax = plot(el);
  const svg = el.querySelector("svg");
  const wait = LTT.MOTION_MS ? 90 : 0;
  let shown = false;
  let i = 0;
  const draw = () => {
    const [t, v] = pts[i];
    ax.set("cwnd", pts.slice(0, i + 1));
    if (v === 40 && pts[i + 1]?.[0] === t) mark(svg, ax, t);
    if (v === 20 && pts[i - 1]?.[0] === t && !shown) {
      shown = true;
      ax.set("ssth", [[t, 20], [T_END, 20]]);
      text(svg, ax.x(32), ax.y(20) - 8, "ssthresh 20 MSS", "var(--ltt-muted)");
    }
  };
  const step = () => {
    draw();
    i += 1;
    if (i >= pts.length) return;
    if (wait && i > from) setTimeout(step, wait);
    else step();
  };
  step();
  return { ax, svg };
}

const predictScene = {
  type: "predict",
  layout: "full",
  title: "첫 손실 뒤 곡선은 어디로 갈까?",
  sub: "세로는 한 번에 보내 둘 수 있는 양(패킷 단위), 가로는 왕복 시간(RTT) 수다.",
  question: "보내는 양이 40에 닿았을 때 패킷이 하나 버려졌다. 그 직후 곡선은?",
  visual: (el) => {
    const { svg, ax } = grow(el, PRE, 0);
    text(svg, ax.x(8), ax.y(28), "다음은?", "var(--ltt-muted)");
  },
  choices: [
    { id: "a", text: "1로 떨어졌다가 처음처럼 두 배씩 오른다" },
    { id: "b", text: "절반인 20에서 이어서 RTT마다 1씩 오른다" },
    { id: "c", text: "40을 그대로 유지한다" },
  ],
  answer: "b",
  rest: "dim",
  answerVisual: (el) => grow(el, FULL, 1),
  why: "손실이 나면 {{ssthresh}}를 40 ÷ 2 = 20으로 정하고, 보내는 양도 20으로 내려 RTT마다 1씩 오른다. 1로 떨어지는 것은 타임아웃일 때뿐이다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
  takeaway: "손실 뒤 {{cwnd}}는 절반으로 줄고, 회복은 RTT마다 1 {{MSS}}씩 한다. 그래서 곡선은 톱니가 된다.",
  recall: "중복 ACK 3개로 손실을 알았다면 보내는 양은 1로 떨어질까?",
  basis: "MSS 1,460 B, RTT 100 ms, 병목 한계 40 MSS는 가정이다.",
};

LTT.deck({
  title: "TCP 혼잡 제어: 첫 손실 뒤 곡선",
  theme: "lab",
  glossary: {
    cwnd: "혼잡 윈도. 확인 응답을 기다리지 않고 보낼 수 있는 데이터 양이다.",
    MSS: "한 패킷에 실을 수 있는 최대 데이터 크기(maximum segment size).",
    ssthresh: "slow start를 끝내고 선형 증가로 바꾸는 기준값이다. 손실 때마다 새로 정한다.",
  },
  scenes: [predictScene],
});
</script>
</body>
</html>
