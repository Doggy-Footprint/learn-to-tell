<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP 혼잡 제어: 손실 뒤 cwnd</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
// 첫 손실 전까지의 창 크기(RTT, MSS). 10 → 20 → 40은 RTT마다 2배.
const PRE = [[0, 10], [1, 20], [2, 40]];
// 손실 뒤 실제 곡선. 2 RTT에 손실 → 20에서 꺾여 선형 +1 MSS/RTT → 22 RTT에 다시 손실.
const FULL = [[0, 10], [1, 20], [2, 40], [2, 20], [22, 40], [22, 20], [42, 40], [42, 20]];

// 병목 한계 40 MSS(회색 점선), 느린 시작 기준값 20 MSS(점선, 손실 뒤에만 존재).
const windowPlot = (el, pts, full) => {
  const ax = LTT.axisPlot(el, { width: 640, height: 340, x: [0, 44], y: [0, 48],
    labels: { x: "RTT 수", y: "혼잡 윈도 (MSS)" },
    series: [{ id: "cwnd" }, { id: "cap", color: "var(--ltt-muted)", dash: true }, { id: "ss", color: "var(--ltt-ink-2)", dash: true }] });
  ax.set("cap", [[0, 40], [44, 40]]);
  ax.set("ss", full ? [[2, 20], [44, 20]] : []);
  ax.set("cwnd", pts);
  return ax;
};

LTT.deck({
  title: "TCP 혼잡 제어: 손실 뒤 cwnd",
  theme: "lab",
  glossary: {
    ssthresh: "slow start를 끝내고 congestion avoidance로 넘어가는 기준값."
  },
  scenes: [{
    type: "predict",
    kicker: "네트워크 · TCP 혼잡 제어",
    title: "손실 뒤 곡선은 어디로 갈까",
    en: "Where the curve goes after the first loss",
    sub: "가로는 RTT 수, 세로는 혼잡 윈도(MSS, 보내고 ACK를 못 받은 양의 상한). 회색 점선은 병목이 감당하는 한계 40 MSS.",
    question: "보내는 양이 40 MSS에 닿았을 때 패킷이 버려졌다. 다음 곡선은?",
    choices: [
      { id: "a", text: "1 MSS로 떨어진 뒤 다시 지수로 오른다" },
      { id: "b", text: "20 MSS(절반)에서 이어서 RTT마다 1씩 오른다" },
      { id: "c", text: "40 MSS를 그대로 유지한다" }
    ],
    answer: "b",
    visual: (el) => { windowPlot(el, PRE, false); },
    answerVisual: (node) => { windowPlot(node, FULL, true); },
    rest: "dim",
    why: "손실 순간 cwnd는 40이었다. {{ssthresh}} = 40 ÷ 2 = 20, cwnd도 20으로 내려온다. 그 뒤 RTT마다 +1 MSS로 오른다. 1로 떨어지는 것은 타임아웃일 때뿐이다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    basis: "가정: MSS 1460 B, RTT 100 ms, 병목 한계 40 MSS. Reno 계열 AIMD 기준의 예시 곡선이다.",
    takeaway: "손실에는 곱셈으로 줄이고(×0.5), 회복은 덧셈으로 한다(+1 MSS/RTT).",
    recall: "중복 ACK로 손실을 감지하면 혼잡 윈도는 어디서 다시 오르나?"
  }]
});
</script>
</body>
</html>
