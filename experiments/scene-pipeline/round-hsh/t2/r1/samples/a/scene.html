<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 손실이 나면 cwnd는 어디로 갈까?</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/plot.umd.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
// 그림 데이터 (RTT 번호, cwnd MSS). 손실은 t=2와 t=22에 난다.
const SS = [[0, 10], [1, 20], [2, 40]];                       // slow start: RTT마다 2배, t=2에서 병목 한계 40에 닿아 손실
const CAP = [[0, 40], [30, 40]];                              // 병목이 감당하는 한계 cwnd
const SSTH = [[0, 20], [30, 20]];                             // 손실 뒤에 생기는 ssthresh = 40 / 2
const ramp = (from, to, t0) => Array.from({ length: to - from + 1 }, (_, i) => [t0 + i, from + i]);
const POST = [[2, 40], [2, 20], ...ramp(21, 40, 3), [22, 20], ...ramp(21, 28, 23)]; // 손실 뒤: 절반에서 선형 +1 MSS/RTT, 톱니 반복
const FACTS = [
  { icon: "ruler", value: "1460 B", label: "MSS" },
  { icon: "clock", value: "100 ms", label: "RTT" },
  { icon: "gauge", value: "10 MSS", label: "시작 cwnd" },
  { icon: "alert", value: "40 MSS", label: "병목 한계", tone: "warn" },
];

// 점을 하나씩 늘려 시간 순서대로 그린다. reduced-motion이면 바로 그린다.
const grow = (p, id, pts, i = 1) => {
  p.set(id, pts.slice(0, i));
  if (i < pts.length) setTimeout(() => grow(p, id, pts, i + 1), 220);
};
const play = (p, id, pts) => (LTT.MOTION_MS ? grow(p, id, pts) : p.set(id, pts));

function plotInto(box, full) {
  const svg = document.createElementNS(SVG, "svg");
  box.appendChild(svg);
  const p = LTT.axisPlot(svg, {
    width: 640, height: 260, x: [0, 30], y: [0, 50],
    labels: { x: "RTT 수", y: "cwnd (MSS)" },
    series: [
      { id: "ss", color: "var(--ltt-c1)" },
      { id: "post", color: "var(--ltt-accent)" },
      { id: "cap", color: "var(--ltt-bad)", dash: true },
      { id: "ssth", color: "var(--ltt-muted)", dash: true },
    ],
  });
  p.set("cap", CAP);
  const key = document.createElement("div");
  key.className = "ltt-key";
  key.textContent = full
    ? "실선 cwnd · 빨간 점선 병목 한계 40 MSS · 회색 점선 ssthresh 20 MSS"
    : "실선 cwnd · 빨간 점선 병목 한계 40 MSS";
  box.appendChild(key);
  if (!full) {
    play(p, "ss", SS);
    return box;
  }
  p.set("ss", SS);
  p.set("ssth", SSTH);
  play(p, "post", POST);
  return box;
}

const predictScene = {
  type: "predict",
  title: "첫 손실이 나면 cwnd는 어디로 갈까?",
  question: "패킷 하나가 버려졌다. 이 뒤 곡선은 어떻게 움직일까?",
  narration: "{{cwnd}}는 RTT마다 두 배로 오르다 병목 한계에 닿는다.",
  visual: () => {
    const box = document.createElement("div");
    box.append(LTT.facts(FACTS));
    return plotInto(box, false);
  },
  choices: [
    { id: "a", text: "1 MSS로 떨어졌다가 다시 두 배씩 오른다" },
    { id: "b", text: "절반 근처에서 RTT마다 1 MSS씩 오른다" },
    { id: "c", text: "40 MSS를 유지하며 계속 간다" },
  ],
  answer: "b",
  answerVisual: () => plotInto(document.createElement("div"), true),
  basis: "MSS 1460 B, RTT 100 ms, 시작 10 MSS는 가정한 값이다.",
  why: "손실 순간 cwnd 40의 절반인 20이 {{ssthresh}}가 되고, cwnd도 20으로 내려와 RTT마다 1 MSS씩 선형으로 오른다. 1로 떨어지는 것은 타임아웃일 때뿐이다. 20 MSS면 처리량 ≈ 2.34 Mbit/s다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
  takeaway: "손실 뒤 cwnd는 절반에서 다시 시작해 RTT마다 1 MSS씩 오른다. 증가는 느리고 감소는 빨라서 톱니가 생긴다.",
  recall: "타임아웃이 나면 cwnd는 어디로 떨어질까?",
};

LTT.deck({
  title: "TCP 혼잡 제어: 손실 뒤 cwnd",
  theme: "lab",
  glossary: {
    cwnd: "혼잡 윈도우. 확인 응답을 기다리지 않고 보낼 수 있는 데이터 양(MSS 단위)",
    ssthresh: "slow start를 멈추고 선형 증가로 바꾸는 기준값",
  },
  scenes: [predictScene],
});
</script>
</body>
</html>
