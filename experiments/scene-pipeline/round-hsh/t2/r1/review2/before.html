<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP 혼잡 제어: 첫 손실 뒤 cwnd</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const T_END = 46;

// cwnd(MSS) 시계열, 시간순. 같은 t에 점이 둘이면 손실 직후의 수직 낙하다.
// 손실은 cwnd 40일 때 t = 2, 22, 42에서 난다. 낙하 뒤 20, 그 뒤 RTT마다 +1 MSS.
const full = [[0, 10], [1, 20], [2, 40], [2, 20]];
for (let t = 3; t <= 22; t++) full.push([t, 18 + t]);
full.push([22, 20]);
for (let t = 23; t <= 42; t++) full.push([t, t - 2]);
full.push([42, 20], [43, 21], [44, 22]);
const LOSS = new Set(["2,40", "22,40", "42,40"]);
// 타임아웃이면: 1 MSS부터 slow start를 다시 하다 ssthresh 20에서 꺾인다.
const TIMEOUT = [[2, 40], [2, 1], [3, 2], [4, 4], [5, 8], [6, 16], [7, 20], [8, 21]];

const text = (svg, x, y, s, tone) => {
  const n = document.createElementNS(SVG, "text");
  n.setAttribute("x", x); n.setAttribute("y", y); n.textContent = s;
  if (tone) n.style.fill = tone;
  svg.appendChild(n);
};
const dot = (svg, x, y, tone) => {
  const c = document.createElementNS(SVG, "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 6);
  c.style.fill = tone;
  svg.appendChild(c);
};

// 곡선은 시간순으로만 자란다. 손실 표식이 먼저 찍히고, 다음 점에서 cwnd가 내려가며, 그 순간 ssthresh 선이 생긴다.
function trace(el, pts, { after = false } = {}) {
  const ax = LTT.axisPlot(el, {
    width: 640, height: 250, x: [0, T_END], y: [0, 50],
    labels: { x: "시간 (RTT 수)", y: "cwnd (MSS)" },
    series: [{ id: "cwnd" }, { id: "ss", dash: true }, { id: "cap", dot: true }, { id: "avg", dash: true }, { id: "late", dash: true }],
  });
  const svg = el.querySelector("svg");
  ax.set("cap", [[0, 40], [T_END, 40]]);
  text(svg, ax.x(31), ax.y(40) - 8, "병목 한계 40 MSS", "var(--ltt-muted)");
  if (!after) text(svg, ax.x(14), ax.y(30), "첫 손실 뒤 곡선은?", "var(--ltt-ink)");

  const wait = LTT.MOTION_MS ? 90 : 0;
  let i = 0;
  const finish = () => {
    if (!after) return;
    ax.set("avg", [[3, 30], [T_END, 30]]);
    text(svg, ax.x(3), ax.y(30) - 8, "평균 30 (피크의 75%)", "var(--ltt-ink)");
    ax.set("late", TIMEOUT);
    text(svg, ax.x(9), ax.y(4), "타임아웃이면 1 MSS부터", "var(--ltt-muted)");
  };
  const step = () => {
    const [t, v] = pts[i];
    ax.set("cwnd", pts.slice(0, i + 1));
    let pause = 0;
    if (LOSS.has(`${t},${v}`)) {
      dot(svg, ax.x(t), ax.y(v), "var(--ltt-bad)");
      text(svg, ax.x(t) + 10, ax.y(v) - 10, "손실", "var(--ltt-bad)");
      pause = 600;
    }
    if (after && t === 2 && v === 20) {
      ax.set("ss", [[2, 20], [T_END, 20]]);
      text(svg, ax.x(9), ax.y(20) + 16, "ssthresh = 20 MSS (손실 때 cwnd 40의 절반)", "var(--ltt-warn)");
    }
    i += 1;
    if (i >= pts.length) { finish(); return; }
    if (wait) setTimeout(step, wait + pause);
  };
  if (wait) step();
  else while (i < pts.length) step();
}

LTT.deck({
  title: "TCP 혼잡 제어: 첫 손실 뒤 cwnd",
  theme: "lab",
  glossary: {
    cwnd: "혼잡 윈도우. 확인 응답을 기다리지 않고 한 번에 보낼 수 있는 양(MSS 단위)",
    ssthresh: "slow start를 끝내고 +1 MSS씩 선형 증가로 바꾸는 기준값. 손실 때마다 새로 정한다.",
  },
  scenes: [{
    type: "predict",
    kicker: "네트워크 · TCP 혼잡 제어",
    title: "첫 손실이 나면 곡선은 어디로 갈까?",
    sub: "가로는 RTT 수, 세로는 한 번에 보낼 수 있는 양이다.",
    narration: "{{cwnd}}는 RTT마다 두 배로 올라 병목 한계에 닿았다.",
    question: "패킷이 버려졌다는 중복 ACK 3개가 도착했다. 이 뒤 곡선은?",
    visual: (el) => {
      el.append(LTT.facts([
        { icon: "wind", value: "10 MSS", label: "연결 시작 윈도" },
        { icon: "clock", value: "100 ms", label: "왕복 시간(RTT)" },
        { icon: "alert", value: "40 MSS", label: "병목 한계", tone: "warn" },
      ]));
      trace(el, full.slice(0, 3));
    },
    choices: [
      { id: "a", text: "1 MSS로 떨어진 뒤 다시 두 배씩 오른다" },
      { id: "b", text: "절반(20 MSS)에서 RTT마다 +1 MSS로 오른다" },
      { id: "c", text: "40 MSS를 그대로 유지한다" },
    ],
    answer: "b",
    answerVisual: (el) => trace(el, full, { after: true }),
    why: "손실이 먼저 나고, 그 순간 cwnd 40의 절반이 {{ssthresh}} 20이 되어 cwnd가 내려온다. 이후 RTT마다 +1 MSS로 오르다 다시 40에서 손실이 나 톱니가 된다. 1 MSS로 떨어지는 것은 타임아웃일 때뿐이다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    takeaway: "증가는 +1 MSS씩 더하고 감소는 절반으로 곱해서 톱니가 생긴다. 처리량은 cwnd × MSS / RTT이고 평균은 피크의 75%다.",
    recall: "타임아웃이 나면 cwnd는 어디로 떨어질까?",
    basis: "MSS 1,460 B, RTT 100 ms, 시작 10 MSS, 병목 한계 40 MSS는 가정한 값이다. Reno 방식 기준.",
  }],
});
</script>
</body>
</html>
