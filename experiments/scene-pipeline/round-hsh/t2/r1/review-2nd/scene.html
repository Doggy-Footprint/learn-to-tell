<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 손실 뒤 cwnd는 어디로 갈까</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/plot.umd.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const T_END = 44, PEAK = 40, HALF = 20;

// 모델: 손실은 cwnd가 병목 한계 40에 닿을 때 난다. 손실 뒤 cwnd = 20, 그 뒤 RTT마다 +1 MSS.
const PRE = [[0, 10], [1, 20], [2, 40]];
const ramp = (t0, t1) => Array.from({ length: t1 - t0 + 1 }, (_, i) => [t0 + i, HALF + 1 + i]);
const meanCwnd = (HALF + PEAK) / 2;                       // 30
const mbps = (w) => (w * 1460 * 8 / 0.1 / 1e6).toFixed(2); // MSS 1460 B, RTT 100 ms

const put = (svg, tag, attrs, txt) => {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (txt != null) n.textContent = txt;
  svg.appendChild(n);
  return n;
};
const label = (svg, x, y, s, fill, anchor) =>
  put(svg, "text", { x, y, "font-size": 13, "text-anchor": anchor || "start", style: `fill:${fill}` }, s);
const lossMark = (svg, ax, t) => {
  put(svg, "circle", { cx: ax.x(t), cy: ax.y(PEAK), r: 6, style: "fill:var(--ltt-bad)" });
  label(svg, ax.x(t) + 10, ax.y(PEAK) - 10, "손실", "var(--ltt-bad)");
};

function makePlot(box) {
  const ax = LTT.axisPlot(box, {
    width: 760, height: 270, x: [0, T_END], y: [0, 50],
    labels: { x: "시간 (RTT 수)", y: "cwnd (MSS)" },
    series: [
      { id: "cap", color: "var(--ltt-muted)", dash: true, dot: true },
      { id: "ssth", color: "var(--ltt-warn)", dash: true },
      { id: "avg", color: "var(--ltt-ink-2)", dash: true },
      { id: "to", color: "var(--ltt-bad)", dash: true },
      { id: "cwnd", color: "var(--ltt-accent)" },
    ],
  });
  const svg = box.querySelector("svg");
  ax.set("cap", [[0, PEAK], [T_END, PEAK]]);
  label(svg, ax.x(T_END), ax.y(PEAK) - 8, "병목 한계 40", "var(--ltt-muted)", "end");
  return { ax, svg };
}

const facts = () => LTT.facts([
  { icon: "gauge", value: "10 MSS", label: "연결 시작 때 보내는 양" },
  { icon: "clock", value: "100 ms", label: "왕복 시간(RTT)" },
  { icon: "alert", value: "중복 ACK 3개", label: "손실 신호" },
]);

// 문제 상태: 첫 손실 직전까지만.
function questionFig(el) {
  el.append(facts());
  const box = el.appendChild(document.createElement("div"));
  const { ax, svg } = makePlot(box);
  ax.set("cwnd", PRE);
  lossMark(svg, ax, 2);
  label(svg, ax.x(14), ax.y(30), "손실 다음, 곡선은 어디로?", "var(--ltt-ink-2)");
}

// 공개: 생성 순서대로. 손실 → 감소 → 기준선 → 선형 상승 → 반복 → 평균.
let run = 0;
function answerFig(node) {
  node.textContent = "";
  const mine = ++run;
  const box = node.appendChild(document.createElement("div"));
  const { ax, svg } = makePlot(box);
  const acts = [];
  let pts = [];
  const add = (ms, fn) => acts.push([ms, fn]);
  const draw = () => ax.set("cwnd", pts);
  const climb = (t0, t1, ms) => ramp(t0, t1).forEach((p) => add(ms, () => { pts = pts.concat([p]); draw(); }));

  add(0, () => { pts = PRE.slice(); draw(); lossMark(svg, ax, 2); label(svg, ax.x(6), ax.y(45), "slow start: RTT마다 2배", "var(--ltt-accent)"); });
  add(700, () => {
    pts = pts.concat([[2, HALF]]); draw();
    ax.set("ssth", [[2, HALF], [T_END, HALF]]);
    label(svg, ax.x(T_END), ax.y(HALF) + 18, "ssthresh = 40 ÷ 2 = 20", "var(--ltt-warn)", "end");
  });
  add(700, () => label(svg, ax.x(7), ax.y(26) - 4, "+1 MSS / RTT", "var(--ltt-accent)"));
  climb(3, 22, 70);
  add(500, () => { lossMark(svg, ax, 22); });
  add(600, () => { pts = pts.concat([[22, HALF]]); draw(); });
  [...Array(20)].forEach((_, i) => add(45, () => { pts = pts.concat([[23 + i, HALF + 1 + i]]); draw(); }));
  add(500, () => { lossMark(svg, ax, 42); });
  add(600, () => { pts = pts.concat([[42, HALF]]); draw(); });
  add(600, () => {
    ax.set("avg", [[2, meanCwnd], [T_END, meanCwnd]]);
    label(svg, ax.x(T_END), ax.y(meanCwnd) + 18, "톱니 평균 30 = 피크의 75%", "var(--ltt-ink-2)", "end");
  });
  add(900, () => {
    ax.set("to", [[2, PEAK], [2, 1]]);
    label(svg, ax.x(2) + 8, ax.y(5), "타임아웃일 때만 1로 추락", "var(--ltt-bad)");
    label(svg, ax.x(T_END), ax.y(46), "손실 없이 평평하면 rwnd 제한(처방이 다르다)", "var(--ltt-ink-2)", "end");
  });

  if (!LTT.MOTION_MS) { acts.forEach(([, fn]) => fn()); return; }
  let i = 0;
  const next = () => {
    if (mine !== run || !node.isConnected || i >= acts.length) return;
    const [ms, fn] = acts[i++];
    setTimeout(() => { if (mine === run && node.isConnected) { fn(); next(); } }, ms);
  };
  next();
}

LTT.deck({
  title: "TCP 혼잡 제어: 손실 뒤 cwnd",
  theme: "lab",
  glossary: {
    ssthresh: "slow start를 멈추고 한 칸씩 늘리기로 바꾸는 기준값. 손실이 난 순간의 cwnd를 보고 정한다",
  },
  scenes: [{
    type: "predict",
    kicker: "네트워크 · TCP 혼잡 제어",
    title: "첫 손실 뒤 곡선은 어디로 갈까",
    sub: "cwnd(확인 응답 없이 보낼 수 있는 양, 단위 MSS=패킷 한 개 분량)가 RTT마다 2배로 올라 병목 한계 40에 닿는 순간 패킷이 버려졌다. 가로는 RTT 수, 세로는 MSS.",
    question: "손실을 알아챈 바로 다음, 보내는 양은 어떻게 변할까?",
    visual: questionFig,
    choices: [
      { id: "a", text: "1로 떨어진 뒤 다시 2배씩 오른다" },
      { id: "b", text: "절반인 20에서 RTT마다 1씩 오른다" },
      { id: "c", text: "40을 그대로 유지한다" },
    ],
    answer: "b",
    hint: "손실 신호가 중복 ACK 3개일 때의 규칙이다.",
    answerVisual: answerFig,
    why: `손실이 먼저 나고, 그 순간 cwnd 40을 보고 {{ssthresh}} = 20을 정한 뒤 cwnd를 20으로 줄인다. 이후 RTT마다 +1이라 20 RTT가 걸려 40에 다시 닿고, 같은 손실이 반복된다. 처리량은 피크 ${mbps(40)}, 직후 ${mbps(20)}, 평균 ${mbps(30)} Mbit/s. 1로 떨어지는 건 타임아웃일 때뿐이다. <span class="ltt-tag">모델로 계산한 예시</span>`,
    basis: "가정: MSS 1460 B, RTT 100 ms, 병목 한계 40 MSS, 시작 10 MSS. Reno 계열 AIMD의 예시 곡선이다.",
    takeaway: "TCP는 손실이 나면 cwnd를 절반으로 줄이고 RTT마다 1 MSS씩 올린다. 증가는 느리고 감소는 빨라 톱니가 생기며, 평균은 피크의 75%다.",
    recall: "손실 뒤 cwnd가 1로 떨어지는 것은 어떤 손실 신호일 때인가?",
  }],
});
LTT.expect("톱니 평균 처리량", +mbps(30), 3.5, { tol: 0.01 });
</script>
</body>
</html>
