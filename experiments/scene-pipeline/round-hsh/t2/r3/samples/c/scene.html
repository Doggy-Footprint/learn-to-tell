<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP 혼잡 제어: 손실 뒤 cwnd</title>
<script type="application/json" id="ltt-meta">{"topic": "TCP 혼잡 제어", "audience": "백엔드·네트워크 개발자", "theme": "lab", "medium": "cwnd 시계열 플롯", "decision": "전송 처리량 문제 진단"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const MSS = 1460, RTT_MS = 100;
// t는 RTT 단위, 값은 cwnd(MSS). slow start로 2배씩 32까지 오르고, 손실(32) 뒤 16에서 RTT마다 +1
const cwndAt = (t) => (t <= 5 ? 2 ** t : t <= 22 ? 10 + t : 16 + (t - 23));
const SAW = Array.from({ length: 24 }, (_, t) => [t, cwndAt(t)]);

// 점을 하나씩 이어 그려 시간순으로 나타나게 한다. 모션이 꺼져 있으면 바로 끝까지 그린다
function draw(plot, id, pts, done) {
  const step = LTT.MOTION_MS ? 120 : 0;
  if (!step) { plot.set(id, pts); return done && done(); }
  let i = 1;
  (function next() {
    plot.set(id, pts.slice(0, i));
    if (i++ >= pts.length) return done && done();
    setTimeout(next, step);
  })();
}

function curve(el, series) {
  return LTT.axisPlot(el, {
    width: 640, height: 250, x: [0, 24], y: [0, 36],
    labels: { x: "시간 (RTT)", y: "cwnd (MSS)" },
    series,
  });
}

const predictScene = {
  type: "predict",
  kicker: "TCP 혼잡 제어",
  title: "손실이 나면 cwnd는 어디로 떨어질까",
  sub: "곡선은 손실 직전까지 보인다. 칸마다 cwnd가 어떻게 바뀌는지 따라가 본다.",
  narration: "{{cwnd}}는 한 번에 보낼 수 있는 양(최대 세그먼트 크기 MSS 단위)이다. 패킷이 버려지면 혼잡 신호로 읽는다. 가로축은 {{RTT}} 단위다.",
  question: "cwnd가 32 MSS에서 손실이 났다. 다음 RTT의 cwnd는?",
  visual: (el) => {
    const plot = curve(el, [{ id: "cwnd" }, { id: "loss", dash: true }]);
    plot.set("loss", [[5, 0], [5, 36]]);
    draw(plot, "cwnd", SAW.slice(0, 6));
    el.append(LTT.facts([
      { icon: "gauge", value: "1460 B", label: "MSS" },
      { icon: "clock", value: "100 ms", label: "RTT" },
      { icon: "alert", value: "32 MSS", label: "손실이 난 cwnd" },
    ]));
  },
  choices: [
    { id: "1", text: "1 MSS로 돌아간다" },
    { id: "16", text: "16 MSS로 절반이 된다" },
    { id: "32", text: "32 MSS 그대로 유지된다" },
  ],
  answer: "16",
  answerVisual: (el) => {
    const plot = curve(el, [{ id: "cwnd" }, { id: "loss", dash: true }, { id: "ssthresh", dot: true }]);
    plot.set("loss", [[5, 0], [5, 36]]);
    draw(plot, "cwnd", SAW, () => plot.set("ssthresh", [[5, 16], [23, 16]]));
    el.append(LTT.callout("32에서 16으로 절반이 된다. 1로 떨어지는 것은 타임아웃(RTO)일 때뿐이다.", { tone: "accent", title: "손실 직후" }));
    el.append(LTT.h("div", "ltt-basis", "처리량 = cwnd × MSS ÷ RTT. cwnd 32는 약 3.74 Mbps, 16은 약 1.87 Mbps. <span class=\"ltt-tag muted\">모델로 계산한 예시</span>"));
  },
  why: "중복 ACK 3개는 패킷 한두 개만 빠졌다는 신호다. 그래서 cwnd를 절반으로 낮추고, 그 뒤 RTT마다 1 MSS씩 선형으로 되찾는다. 1로 돌아가는 것은 RTO가 났을 때다.",
  hint: "힌트: 손실을 알아채는 길은 두 가지다. 중복 ACK 3개와 타임아웃.",
  takeaway: "손실 뒤 cwnd는 절반으로 줄고, 그 뒤 RTT마다 1 MSS씩 되찾는다. 그래서 톱니가 된다.",
  recall: "cwnd 최고점이 32 MSS면, 톱니의 평균 cwnd는 대략 얼마일까?",
  basis: "MSS 1460 B, RTT 100 ms는 설명용 가정이다. 실제 값은 연결마다 다르다.",
  sources: "RFC 5681 (TCP 혼잡 제어)",
};

const glossary = {
  cwnd: "혼잡 창. 확인 응답을 기다리지 않고 보낼 수 있는 데이터 양이다. 단위는 MSS.",
  RTT: "왕복 시간. 패킷을 보내고 응답이 돌아오기까지 걸리는 시간이다.",
};

LTT.expect("cwnd 32 MSS의 처리량 (bps)", 32 * MSS * 8 / (RTT_MS / 1000), 3737600, { tol: 1 });

LTT.deck({ title: "TCP 혼잡 제어: 손실 뒤 cwnd", theme: "lab", glossary, scenes: [predictScene] });
</script>
</body>
</html>
