<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신용 창조와 통화 승수</title>
<script type="application/json" id="ltt-meta">{"topic": "신용 창조와 통화 승수", "audience": "경제 기사 독자", "theme": "ledger", "medium": "경제 신문 차트", "decision": "통화정책 기사 해석"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .cc-wrap { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .cc-stats { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
  .cc-stats div { display: flex; flex-direction: column; }
  .cc-stats b { font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cc-stats span { color: var(--ltt-muted); font-size: .85rem; }
  .cc-cap { min-height: 1.6em; color: var(--ltt-ink); font-size: 1rem; }
  .cc-svg { width: 100%; height: auto; display: block; }
  .cc-svg text { fill: var(--ltt-ink-2); font-size: 13px; }
  .cc-svg .v { fill: var(--ltt-ink); font-weight: 600; }
  .cc-svg .m { fill: var(--ltt-muted); font-size: 12px; }
  .cc-svg .hid { opacity: 0; }
  .cc-svg .bank { transition: opacity .45s; }
  .cc-svg .seg { transition: opacity .45s; }
  .cc-svg .res { fill: var(--ltt-accent); transition: fill .4s; }
  .cc-svg .loan { fill: var(--ltt-c2, var(--ltt-good)); transition: fill .4s; }
  .cc-svg .raw { fill: var(--ltt-line-2); }
  .cc-svg .arrow { fill: none; stroke: var(--ltt-c2, var(--ltt-good)); stroke-width: 2.5; }
  .cc-key { display: flex; gap: 18px; font-size: .85rem; color: var(--ltt-ink-2); flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<script>
const D0 = 100, N = 8, LET = "ABCDEFGH";
const f1 = (v) => (Math.round(v * 10) / 10).toLocaleString("ko-KR");
const deposit = (r, i) => D0 * Math.pow(1 - r, i);
const cumul = (r, n) => D0 * (1 - Math.pow(1 - r, n)) / r; // n라운드 누적 예금
const cap = (r) => D0 / r;

LTT.expect("r=10% 3라운드 누적", cumul(0.1, 3), 271, { tol: 1e-9 });
LTT.expect("r=5% 상한", cap(0.05), 2000, { tol: 1e-9 });

function build(body) {
  body.innerHTML = `<div class="cc-wrap">
    <div class="cc-stats">
      <div><b id="s-dep">0</b><span>예금 총액 (억 원)</span></div>
      <div><b id="s-cap">0</b><span>상한 = 최초 예금 100 ÷ 지급준비율</span></div>
      <div><b id="s-res">100</b><span>처음 들어온 준비금 (불어나지 않는다)</span></div>
    </div>
    <div class="cc-cap" id="cc-cap"></div>
    <svg class="cc-svg" id="cc-svg" viewBox="0 0 900 400" role="img" aria-label="은행 연쇄에서 예금이 불어나는 그림"></svg>
    <div class="cc-key">
      <span>${LTT.mark("square", { color: "var(--ltt-accent)", inline: true })} 지급준비금으로 남김</span>
      <span>${LTT.mark("diamond", { color: "var(--ltt-c2, var(--ltt-good))", inline: true })} 대출 → 다음 은행의 새 예금</span>
      <span class="ltt-tag muted">모델로 계산한 예시</span>
    </div>
    <div class="ltt-param">지급준비율 r <b id="rr-v"></b><div id="rr"></div></div>
    <div class="ltt-basis">이론상 상한이다. 현금 보유, 초과 준비금, 대출 수요 부족이 있으면 실제 승수는 이보다 작다.</div>
  </div>`;
}

const SVGNS = "http://www.w3.org/2000/svg";
function mk(parent, tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}

function scene(body) {
  build(body);
  const svg = body.querySelector("#cc-svg");
  const $ = (id) => body.querySelector(id);
  let timers = [];
  let raf = 0;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const stop = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); };

  // 숫자 부드럽게
  let shown = 0;
  const setDep = (to) => {
    cancelAnimationFrame(raf);
    const from = shown, t0 = performance.now(), ms = LTT.MOTION_MS ? 500 : 0;
    const tick = (t) => {
      const p = ms ? Math.min(1, (t - t0) / ms) : 1;
      shown = from + (to - from) * p;
      $("#s-dep").textContent = f1(shown);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };

  function play(rPct) {
    stop();
    const r = rPct / 100, S = 1.3, BASE = 235;
    const AX0 = 50, AXW = 800, AMAX = 2000, CY = 335;
    const X = (v) => AX0 + (v / AMAX) * AXW;
    svg.innerHTML = "";
    shown = 0;
    $("#s-dep").textContent = "0";
    $("#s-cap").textContent = f1(cap(r)) + " (" + f1(1 / r) + "배)";
    $("#s-res").textContent = D0;

    // 은행 연쇄 (위)
    const banks = [];
    for (let i = 0; i < N; i++) {
      const cx = 75 + i * 107, d = deposit(r, i);
      const g = mk(svg, "g", { class: "bank hid" });
      const hRes = r * d * S, hLoan = (1 - r) * d * S;
      const rawA = mk(g, "rect", { x: cx - 28, y: BASE - hRes - hLoan, width: 56, height: hRes + hLoan, rx: 3, class: "raw" });
      const resR = mk(g, "rect", { x: cx - 28, y: BASE - hRes, width: 56, height: hRes, rx: 2, class: "raw" });
      const loanR = mk(g, "rect", { x: cx - 28, y: BASE - hRes - hLoan, width: 56, height: hLoan, rx: 2, class: "raw" });
      mk(g, "text", { x: cx, y: BASE - hRes - hLoan - 8, "text-anchor": "middle", class: "v" }, f1(d));
      const lab = mk(svg, "text", { x: cx, y: BASE + 20, "text-anchor": "middle", class: "bank hid" }, LET[i] + " 은행");
      const rl = mk(svg, "text", { x: cx, y: BASE - hRes / 2 + 4, "text-anchor": "middle", class: "m hid", style: "fill:var(--ltt-on-dark, #fff)" }, "");
      rawA.remove();
      let arrow = null;
      if (i < N - 1) {
        const x1 = cx + 30, y1 = BASE - hRes - hLoan / 2, x2 = cx + 107 - 30, y2 = BASE - deposit(r, i + 1) * S / 2;
        arrow = mk(svg, "path", { class: "arrow hid", d: `M${x1},${y1} C${x1 + 30},${y1} ${x2 - 30},${y2} ${x2 - 2},${y2}`, "marker-end": "url(#ah)" });
      }
      banks.push({ g, lab, resR, loanR, arrow, d, cx });
    }
    const defs = mk(svg, "defs", {});
    const mkr = mk(defs, "marker", { id: "ah", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" });
    mk(mkr, "path", { d: "M0,1 L9,5 L0,9 z", style: "fill:var(--ltt-c2, var(--ltt-good))" });
    mk(svg, "text", { x: 868, y: BASE - 20, class: "m", "text-anchor": "middle" }, "…");
    mk(svg, "line", { x1: 40, x2: 860, y1: BASE, y2: BASE, stroke: "var(--ltt-line-2)" });
    mk(svg, "text", { x: 40, y: 80, class: "m" }, "은행마다 새로 생기는 예금");

    // 누적 예금 띠 (아래)
    mk(svg, "text", { x: AX0, y: CY - 26, class: "m" }, "누적 예금 총액");
    mk(svg, "rect", { x: AX0, y: CY, width: AXW, height: 26, fill: "var(--ltt-card-2)", stroke: "var(--ltt-line)" });
    const segs = [];
    for (let i = 0; i < N; i++) {
      const a = cumul(r, i), b = cumul(r, i + 1);
      segs.push(mk(svg, "rect", { x: X(a), y: CY, width: X(b) - X(a), height: 26, class: "seg hid",
        fill: i % 2 ? "var(--ltt-c1)" : "var(--ltt-ink-2)", opacity: 0, stroke: "var(--ltt-bg)" }));
    }
    [0, 500, 1000, 1500, 2000].forEach((v) => {
      mk(svg, "line", { x1: X(v), x2: X(v), y1: CY + 26, y2: CY + 32, stroke: "var(--ltt-muted)" });
      mk(svg, "text", { x: X(v), y: CY + 47, "text-anchor": "middle", class: "m" }, v);
    });
    // 상한선: 처음부터 고정
    mk(svg, "line", { x1: X(cap(r)), x2: X(cap(r)), y1: CY - 14, y2: CY + 32, stroke: "var(--ltt-bad)", "stroke-width": 2.5, "stroke-dasharray": "5 3" });
    mk(svg, "text", { x: Math.min(X(cap(r)), 800), y: CY - 18, "text-anchor": "middle", class: "v" }, "상한 " + f1(cap(r)));
    mk(svg, "text", { x: X(D0) , y: CY + 20, class: "m", style: "fill:var(--ltt-on-dark, #fff)", "text-anchor": "middle" }, "");

    const cap_ = $("#cc-cap");
    const show = (el) => { el.setAttribute("class", el.getAttribute("class").replace(" hid", "")); el.style.opacity = 1; };
    const doDeposit = (i) => {
      const b = banks[i];
      show(b.g); show(b.lab); show(segs[i]);
      segs[i].setAttribute("opacity", 1); segs[i].style.opacity = 1;
      setDep(cumul(r, i + 1));
      cap_.textContent = i === 0
        ? `최초 예금 ${D0}이 ${LET[i]} 은행에 들어온다. 예금 합계 ${f1(cumul(r, 1))}`
        : `대출이 ${LET[i]} 은행의 새 예금 ${f1(b.d)}이 됐다. 예금 합계 ${f1(cumul(r, i + 1))}`;
    };
    const doSplit = (i) => {
      const b = banks[i];
      b.resR.setAttribute("class", "res"); b.loanR.setAttribute("class", "loan");
      cap_.textContent = `${LET[i]} 은행: 예금 ${f1(b.d)} 중 ${f1(b.d * r)}을 준비금으로 남기고 ${f1(b.d * (1 - r))}을 대출한다`;
    };
    const doMove = (i) => {
      const b = banks[i];
      if (!b.arrow) return;
      show(b.arrow);
      cap_.textContent = `대출 ${f1(b.d * (1 - r))}이 지출되어 ${LET[i + 1]} 은행으로 들어간다`;
    };
    const finish = () => {
      cap_.textContent = `계속 이어지면 예금 합계는 ${f1(cap(r))}에 다가가고 넘지 못한다 (대출 ${f1(cap(r) - D0)} + 최초 ${D0})`;
    };

    if (!LTT.MOTION_MS) {
      for (let i = 0; i < N; i++) { doDeposit(i); doSplit(i); doMove(i); }
      finish();
      return;
    }
    const T = 1700;
    for (let i = 0; i < N; i++) {
      later(() => doDeposit(i), i * T);
      later(() => doSplit(i), i * T + 600);
      later(() => doMove(i), i * T + 1150);
    }
    later(finish, N * T - 300);
  }

  LTT.sweep({
    params: { rr: { kind: "steps", stops: [20, 10, 5], value: 10, fmt: (v) => v + "% → 승수 " + (100 / v) + "배" } },
    render: ({ rr }) => play(rr),
  });

  return { enter() {}, leave() { stop(); } };
}

LTT.deck({
  title: "신용 창조와 통화 승수",
  theme: "ledger",
  scenes: [{
    title: "받은 예금의 일부만 남기고 빌려주는 일이 되풀이돼 예금은 1/r배까지 불어난다",
    sub: "A 은행에 100이 들어온 뒤의 연쇄. 위는 은행별 새 예금, 아래는 그 누적 합계. 아래 손잡이로 지급준비율을 바꾸면 연쇄가 처음부터 다시 전개된다.",
    mount: scene,
    takeaway: "예금 총액의 상한은 최초 예금 ÷ 지급준비율이다. 준비금 100은 그대로이고 불어나는 것은 예금과 대출이다.",
    recall: "지급준비율이 10%에서 5%로 내려가면 상한은 어떻게 바뀌고, 실제 통화량도 그만큼 늘까?",
  }],
});
</script>
</body>
</html>
