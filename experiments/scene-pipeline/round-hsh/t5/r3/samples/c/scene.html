<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지준율이 낮을수록 예금의 상한이 커진다</title>
<script type="application/json" id="ltt-meta">{"topic": "신용 창조와 통화 승수", "audience": "경제 기사 독자", "theme": "ledger", "medium": "경제 신문 차트", "decision": "통화정책 기사 해석"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .sc-stats { display: flex; gap: 24px; align-items: baseline; }
  .sc-legend { display: flex; gap: 16px; font-size: 13px; color: var(--ltt-muted); }
  .sc-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .sc-chart { width: 100%; height: auto; }
  .sc-chart text { font-size: 12px; fill: var(--ltt-muted); }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const P = 100;                                      // 최초 예금, 억 원
const N = 10;                                       // 보여 줄 라운드 수
const RATES = [0.05, 0.10, 0.20];
const W = 640, H = 400;
const X0 = 56, DX = 50;                             // 라운드 k의 x = X0 + k·DX
const B1 = 170, H1 = 120;                           // 위 패널: 라운드별 예금, 0~100억
const B2 = 370, H2 = 150, MAX2 = 2000;              // 아래 패널: 누적 예금, 0~2,000억
const fmt = (v) => String(Math.round(v * 10) / 10);
const pct = (r) => `${Math.round(r * 100)}%`;
const ceil = (r) => P / r;                          // 수렴값 = 최초 예금 ÷ 지준율
const dep = (r, k) => P * (1 - r) ** k;             // k번째 라운드(0부터)의 예금
const cum = (r, n) => P * (1 - (1 - r) ** n) / r;   // n라운드까지 누적 예금
const res = (r, n) => P * (1 - (1 - r) ** n);       // n라운드까지 쌓인 준비금 합계
const xk = (k) => X0 + k * DX;
const y2 = (v) => B2 - (v / MAX2) * H2;

LTT.expect("지준율 10% 천장", ceil(0.10), 1000, { tol: 1e-9 });
LTT.expect("지준율 10%, 3라운드 누적 예금", cum(0.10, 3), 271, { tol: 1e-6 });
LTT.expect("지준율 10%, 5라운드 누적 예금", cum(0.10, 5), 409.51, { tol: 1e-6 });

const scene = {
  kicker: "통화",
  title: "지준율이 낮을수록 같은 예금에서 불어나는 상한이 커진다",
  en: "Lower reserve ratio, higher deposit ceiling",
  sub: "최초 예금 100억 원이 대출과 새 예금을 거치며 쌓이는 과정",
  narration: "은행은 {{지준율|지급준비율}}만큼을 준비금으로 묶고 나머지를 대출한다. 대출받은 쪽이 그 돈을 은행에 예금하면 그것이 새 예금이 되고, 같은 일이 다시 일어난다. 라운드가 거듭될수록 새 예금은 (1−지준율)배씩 줄어든다.",
  mount(body) {
    body.innerHTML = `
      <div class="sc-stats">
        <div class="ltt-stat"><span id="s-dep"></span><small>억 원 누적 예금</small></div>
        <div class="ltt-stat"><span id="s-res"></span><small>억 원 준비금 합계</small></div>
        <div class="ltt-stat"><span id="s-ceil"></span><small>억 원 천장</small></div>
        <span class="ltt-tag">모델로 계산한 예시</span>
      </div>
      <svg id="chart" class="sc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="라운드별 예금과 누적 예금"></svg>
      <div class="sc-legend"><span><i style="background:var(--ltt-accent)"></i>준비금</span><span><i style="background:var(--ltt-line-2)"></i>대출 (다음 라운드의 예금)</span><span><i style="background:var(--ltt-c1)"></i>누적 예금</span></div>
      <div class="ltt-param">지준율 <b id="r-v"></b><div id="r"></div></div>
      <div id="steps"></div>`;

    const svg = body.querySelector("#chart");
    const make = (tag, attrs, parent = svg) => {
      const n = document.createElementNS(SVG, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      parent.appendChild(n);
      return n;
    };
    const textOf = (s, attrs) => { const t = make("text", attrs); t.textContent = s; return t; };

    // 위 패널: 라운드별 예금 = 준비금 + 대출
    textOf("라운드별 예금 (억 원)", { x: X0, y: 18 });
    make("line", { x1: X0 - 10, x2: xk(N - 1) + 20, y1: B1, y2: B1, stroke: "var(--ltt-line)" });
    const bars = Array.from({ length: N }, (_, k) => ({
      res: make("rect", { x: xk(k) - 15, width: 30, fill: "var(--ltt-accent)", visibility: "hidden" }),
      loan: make("rect", { x: xk(k) - 15, width: 30, fill: "var(--ltt-line-2)", visibility: "hidden" }),
      lab: make("text", { x: xk(k), "text-anchor": "middle", visibility: "hidden" }),
    }));

    // 아래 패널: 누적 예금이 천장에 다가가는 모습
    textOf("누적 예금 (억 원)", { x: X0, y: B2 - H2 - 14 });
    make("line", { x1: X0 - 10, x2: xk(N - 1) + 20, y1: B2, y2: B2, stroke: "var(--ltt-line)" });
    const ceilLines = RATES.map((r) => {
      const y = y2(ceil(r));
      const line = make("line", { x1: X0 - 10, x2: xk(N - 1) + 20, y1: y, y2: y, "stroke-dasharray": "4 4" });
      const label = textOf(`${pct(r)} 천장 ${ceil(r).toLocaleString()}`, { x: xk(N - 1) + 26, y: y + 4 });
      return { r, line, label };
    });
    const curve = make("polyline", { fill: "none", stroke: "var(--ltt-c1)", "stroke-width": 2 });
    const dots = Array.from({ length: N }, (_, k) => make("circle", { cx: xk(k), r: 4, fill: "var(--ltt-c1)", visibility: "hidden" }));
    Array.from({ length: N }, (_, k) => textOf(`${k + 1}`, { x: xk(k), y: B2 + 16, "text-anchor": "middle" }));

    let R = 0.10, idx = 0;
    const draw = () => {
      const n = idx + 1;
      const s1 = H1 / 100;
      bars.forEach((b, k) => {
        const on = k < n ? "visible" : "hidden";
        const d = dep(R, k);
        const hr = d * R * s1, hl = d * (1 - R) * s1;
        b.res.setAttribute("y", B1 - hr);
        b.res.setAttribute("height", hr);
        b.res.setAttribute("visibility", on);
        b.loan.setAttribute("y", B1 - hr - hl);
        b.loan.setAttribute("height", hl);
        b.loan.setAttribute("visibility", on);
        b.lab.setAttribute("y", B1 - hr - hl - 6);
        b.lab.setAttribute("visibility", on);
        b.lab.textContent = fmt(d);
      });
      const pts = [];
      dots.forEach((c, k) => {
        const on = k < n;
        if (on) {
          const y = y2(cum(R, k + 1));
          c.setAttribute("cy", y);
          pts.push(`${xk(k)},${y}`);
        }
        c.setAttribute("visibility", on ? "visible" : "hidden");
      });
      curve.setAttribute("points", pts.join(" "));
      ceilLines.forEach(({ r, line, label }) => {
        const act = r === R;
        line.setAttribute("stroke", act ? "var(--ltt-ink-2)" : "var(--ltt-line-2)");
        line.setAttribute("stroke-width", act ? 2 : 1);
        label.style.fill = act ? "var(--ltt-ink)" : "var(--ltt-muted)";
      });
      body.querySelector("#s-dep").textContent = fmt(cum(R, n));
      body.querySelector("#s-res").textContent = fmt(res(R, n));
      body.querySelector("#s-ceil").textContent = ceil(R).toLocaleString();
    };

    // 라운드를 한 칸씩 넘긴다(재생·단계 버튼)
    const steps = Array.from({ length: N }, (_, k) => ({
      caption: `라운드 ${k + 1}: 준비금을 뺀 나머지가 대출되고, 대출금이 다음 예금이 된다`,
      hold: 900,
      enter: (i) => { idx = i; draw(); },
    }));
    const st = LTT.stepper(body.querySelector("#steps"), steps, { interval: 900 });

    // 지준율 손잡이: 5%·10%·20%
    LTT.sweep({
      params: { r: { kind: "steps", stops: RATES, value: 0.10, fmt: pct, label: "지준율" } },
      render: ({ r }) => { R = r; draw(); },
    });

    draw();
    return {
      enter() { LTT.MOTION_MS ? st.play() : st.go(N - 1); },
      leave() { st.stop(); },
    };
  },
  takeaway: "준비금 합계는 처음 예금 그대로인데, 대출이 새 예금을 만들어 예금 합계는 최초 예금 ÷ 지준율까지 커진다.",
  recall: "지준율을 10%에서 5%로 낮추면 천장은 몇 억 원이 되는가?",
  basis: "가정: 대출금 전액이 예금으로 돌아오고, 현금 보유와 초과 준비금이 없다. 이론 상한이며 실제 증가는 대출 수요와 은행 행동에 달려 있다.",
};

LTT.deck({
  title: "신용 창조와 통화 승수",
  theme: "ledger",
  glossary: {
    "지급준비율": "예금 중 은행이 대출하지 않고 준비금으로 쌓아 두는 비율",
  },
  scenes: [scene],
});
</script>
</body>
</html>
