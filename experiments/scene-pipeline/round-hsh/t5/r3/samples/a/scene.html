<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신용 창조와 통화 승수</title>
<script type="application/json" id="ltt-meta">{"topic": "신용 창조와 통화 승수", "audience": "경제 기사 독자", "theme": "ledger", "medium": "경제 신문 차트", "decision": "통화정책 기사 해석"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .sc-grid { display: grid; gap: 14px; }
  .sc-chain { max-width: 780px; }
  .sc-chart { width: 100%; height: auto; }
  .sc-key { display: flex; flex-wrap: wrap; gap: 16px; color: var(--ltt-muted); }
  .sc-key i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const TOTAL = 100, ROUNDS = 10, YMAX = 2100, STOPS = [0.05, 0.1, 0.2], STEP = 500;
const HL = [["dep"], ["dep", "res", "loan", "dep>res", "dep>loan"], ["loan", "next", "loan>next"]];
const eok = (v) => (Math.round(v * 10) / 10).toLocaleString("ko-KR") + "억";
const pct = (v) => Math.round(v * 100) + "%";

// 라운드별 예금·준비금·대출과 누적 합계 (억 원). 예금은 직전 대출이 다시 예금이 된 값이다.
const rounds = (r) => {
  const rows = [];
  let dep = TOTAL, sum = 0;
  for (let n = 1; n <= ROUNDS; n++) {
    sum += dep;
    rows.push({ n, dep, res: dep * r, loan: dep * (1 - r), total: sum, reserve: sum * r });
    dep *= 1 - r;
  }
  return rows;
};

const chainSpec = (row, r) => ({
  cols: 3, rows: 2, cell: [260, 110], node: [170, 56],
  nodes: [
    { id: "dep", c: 0, r: 0, l: `${row.n}라운드 예금`, s: eok(row.dep), icon: "db" },
    { id: "loan", c: 1, r: 0, l: "대출", s: eok(row.loan), icon: "send" },
    { id: "next", c: 2, r: 0, l: "다음 라운드 예금", s: eok(row.loan), icon: "db" },
    { id: "res", c: 1, r: 1, l: "지급준비금", s: eok(row.res), icon: "lock" },
  ],
  edges: [
    { f: "dep", t: "loan", l: `${pct(1 - r)} 대출` },
    { f: "loan", t: "next", l: "받은 쪽이 예금" },
    { f: "dep", t: "res", shape: "ortho", from: "bottom", to: "left", l: `${pct(r)} 쌓음` },
  ],
});

const chartScene = {
  kicker: "통화 · 지급준비율에 따라 예금이 불어나는 신용 창조",
  title: "지급준비율이 낮을수록 같은 예금에서 불어나는 상한이 커진다",
  en: "Credit creation and the money multiplier",
  sub: "최초 예금 100억 원이 대출을 거쳐 새 예금이 되는 과정. 지급준비율을 바꾸면 상한이 바뀐다.",
  narration: "은행은 예금의 {{지급준비율}}만큼만 쌓고 나머지를 빌려준다. 빌려준 돈을 받은 쪽이 다시 은행에 맡기면 그것이 새 예금이 된다. 준비금 합계는 최초 예금 100억에 머무는 반면, 예금 합계는 {{통화 승수}}가 정한 상한을 향해 쌓인다.",
  takeaway: "지급준비율이 낮을수록 상한이 커지고, 상한은 최초 예금 ÷ 지급준비율이다.",
  recall: "지급준비율이 20%이면 최초 예금 100억의 상한은 얼마인가?",
  basis: "가정: 최초 예금 100억, 현금 누출과 초과 준비금 없음. 이론상 상한이며 실제 증가는 대출 수요와 은행 행동에 달려 있다.",
  mount(body) {
    body.innerHTML = `
      <div class="sc-grid">
        <div id="chain" class="sc-chain"></div>
        <svg id="chart" class="sc-chart"></svg>
        <div class="sc-key">
          <span><i style="background: var(--ltt-c2)"></i>지급준비금 합계</span>
          <span><i style="background: var(--ltt-c1)"></i>대출이 만든 새 예금</span>
          <span><i style="background: var(--ltt-accent)"></i>선택한 지급준비율의 천장</span>
        </div>
        <div class="ltt-param">지급준비율 <b id="r-v"></b><div id="r"></div></div>
        <div class="ltt-hero" id="hero"></div>
      </div>`;

    const chain = body.querySelector("#chain");
    const chart = body.querySelector("#chart");
    const hero = body.querySelector("#hero");
    let r = 0.1, seq = 0, shown = 0, timer = null, dg = null;

    const drawChart = () => {
      const W = 720, H = 260, m = { l: 56, r: 190, t: 16, b: 36 };
      const rows = rounds(r);
      const x = d3.scaleBand(d3.range(1, ROUNDS + 1), [m.l, W - m.r]).padding(0.25);
      const y = d3.scaleLinear([0, YMAX], [H - m.b, m.t]);
      const s = d3.select(chart).attr("viewBox", `0 0 ${W} ${H}`);
      s.selectAll("*").remove();

      const grid = [0, 500, 1000, 1500, 2000];
      s.append("g").selectAll("line").data(grid).join("line")
        .attr("x1", m.l).attr("x2", W - m.r).attr("y1", (d) => y(d)).attr("y2", (d) => y(d))
        .style("stroke", "var(--ltt-line)");
      s.append("g").selectAll("text").data(grid).join("text")
        .attr("x", m.l - 8).attr("y", (d) => y(d) + 4).attr("text-anchor", "end")
        .attr("class", "ltt-mono").style("fill", "var(--ltt-muted)")
        .text((d) => d.toLocaleString("ko-KR"));
      s.append("g").selectAll("text").data(rows).join("text")
        .attr("x", (d) => x(d.n) + x.bandwidth() / 2).attr("y", H - m.b + 18).attr("text-anchor", "middle")
        .attr("class", "ltt-mono").style("fill", "var(--ltt-muted)")
        .text((d) => d.n);

      const bars = s.append("g");
      rows.slice(0, shown).forEach((d) => {
        bars.append("rect").attr("x", x(d.n)).attr("width", x.bandwidth())
          .attr("y", y(d.reserve)).attr("height", y(0) - y(d.reserve)).style("fill", "var(--ltt-c2)");
        bars.append("rect").attr("x", x(d.n)).attr("width", x.bandwidth())
          .attr("y", y(d.total)).attr("height", y(d.reserve) - y(d.total)).style("fill", "var(--ltt-c1)");
      });

      s.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(TOTAL)).attr("y2", y(TOTAL))
        .style("stroke", "var(--ltt-c2)").style("stroke-dasharray", "2 3");
      s.append("text").attr("x", W - m.r + 8).attr("y", y(TOTAL) + 4).attr("class", "ltt-mono")
        .style("fill", "var(--ltt-c2)").text(`준비금 합계 ${eok(TOTAL)}`);

      STOPS.forEach((st) => {
        const c = TOTAL / st, on = st === r, tone = on ? "var(--ltt-accent)" : "var(--ltt-muted)";
        s.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(c)).attr("y2", y(c))
          .style("stroke", tone).style("stroke-dasharray", "6 4").style("opacity", on ? 1 : 0.5);
        s.append("text").attr("x", W - m.r + 8).attr("y", y(c) + 4).attr("class", "ltt-mono")
          .style("fill", tone).text(`${pct(st)} 천장 ${eok(c)}`);
      });
    };

    const stop = () => { clearInterval(timer); timer = null; };

    // 한 라운드는 세 박자: 예금 → 준비금·대출 → 다음 예금(누적 막대 한 칸)
    const tick = () => {
      const rows = rounds(r), n = Math.floor(seq / 3), stage = seq % 3;
      if (stage === 0) {
        chain.innerHTML = "";
        const svg = document.createElementNS(SVG, "svg");
        chain.appendChild(svg);
        dg = LTT.diagram(svg, chainSpec(rows[n], r));
      }
      dg.highlight(HL[stage]);
      if (stage === 2) { shown = n + 1; drawChart(); }
      hero.innerHTML = `${eok(shown ? rows[shown - 1].total : 0)}<small>예금 합계 · 천장 ${eok(TOTAL / r)}</small>`;
      seq++;
      if (seq >= ROUNDS * 3) stop();
    };

    const restart = () => {
      stop(); seq = 0; shown = 0;
      drawChart();
      tick();
      if (LTT.MOTION_MS) timer = setInterval(tick, STEP);
      else while (seq < ROUNDS * 3) tick();
    };

    LTT.sweep({
      params: { r: { kind: "steps", stops: STOPS, value: 0.1, fmt: pct } },
      render: ({ r: v }) => { r = v; restart(); },
    });

    return { enter: restart, leave: stop };
  },
};

LTT.deck({
  title: "신용 창조와 통화 승수",
  theme: "ledger",
  glossary: {
    "지급준비율": "예금 중 은행이 대출하지 않고 따로 쌓아 두는 비율. 10%면 예금 100억 중 10억을 쌓는다는 뜻이다.",
    "통화 승수": "최초 예금이 장부상 예금 총량을 몇 배로 키우는지 나타내는 배수. 지급준비율의 역수(1 ÷ 지급준비율)이다.",
  },
  scenes: [chartScene],
});
</script>
</body>
</html>
