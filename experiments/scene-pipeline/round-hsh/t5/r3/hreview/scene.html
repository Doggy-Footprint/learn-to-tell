<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지급준비율이 낮을수록 같은 예금에서 신용 창조의 상한이 커진다</title>
<script type="application/json" id="ltt-meta">{"topic": "신용 창조와 통화 승수", "audience": "경제 기사 독자", "theme": "ledger", "medium": "경제 신문 차트", "decision": "통화정책 기사 해석"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .cc-chart { width: 100%; height: auto; display: block; }
  .cc-lbl { font-size: 13px; fill: var(--ltt-muted); }
  .cc-small { font-size: 13px; fill: var(--ltt-ink-2); font-variant-numeric: tabular-nums; }
  .cc-val { font-size: 24px; fill: var(--ltt-ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const P = 100, N = 10, RATES = [0.05, 0.10, 0.20];   // 최초 예금(억 원), 라운드 수, 지급준비율
const W = 900, H = 440;
const X0 = 90, DX = 66, BW = 36;                      // 라운드 k의 x = X0 + k·DX
const B1 = 190, S1 = 1.3;                             // 위 패널 기준선, 100억 = 130px
const B2 = 410, S2 = 160 / 2100;                      // 아래 패널 기준선, 0~2,100억
const T = 450;                                        // 한 박자(ms)
const dep = (r, k) => P * (1 - r) ** k;               // k번째 라운드(0부터) 예금
const cum = (r, n) => P * (1 - (1 - r) ** n) / r;     // n라운드까지 누적 총예금
const resCum = (r, n) => P * (1 - (1 - r) ** n);      // n라운드까지 준비금 누적
const ceil = (r) => P / r;                            // 천장 = 최초 예금 ÷ 지급준비율
const xk = (k) => X0 + k * DX;
const fmt = (v) => (Math.round(v * 10) / 10).toLocaleString("ko-KR");
const eok = (v) => fmt(v) + "억";
const pct = (r) => `${Math.round(r * 100)}%`;

LTT.expect("지급준비율 10% 천장", ceil(0.1), 1000, { tol: 1e-9 });
LTT.expect("지급준비율 10%, 5라운드 누적 예금", cum(0.1, 5), 409.51, { tol: 1e-6 });
LTT.expect("지급준비율 10%, 10라운드 준비금 누적", resCum(0.1, 10), 65.13, { tol: 0.01 });

const scene = {
  kicker: "통화 · 신용 창조",
  title: "지급준비율이 낮을수록 같은 예금에서 신용 창조의 상한이 커진다",
  en: "Lower reserve ratio, higher credit creation ceiling",
  sub: "최초 예금 100억 원. {{지급준비율}}만큼만 쌓고 나머지를 빌려주면, 빌려준 돈이 다시 예금이 된다",
  layout: "full",
  mount(body) {
    body.innerHTML = `
      <svg id="cc" class="cc-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="라운드마다 예금이 준비금과 대출로 갈라지고, 누적 총예금이 천장에 다가가는 그림"></svg>
      <div class="ltt-param">지급준비율 <b id="r-v"></b><div id="r"></div></div>`;

    const svg = body.querySelector("#cc");
    const el = (tag, attrs) => {
      const n = document.createElementNS(SVG, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      svg.appendChild(n);
      return n;
    };
    const text = (s, attrs, cls = "cc-lbl") => {
      const t = el("text", { ...attrs, class: cls });
      t.textContent = s;
      return t;
    };
    const paint = (n, props) => { Object.assign(n.style, props); return n; };
    const hidden = (n) => n.setAttribute("visibility", "hidden");
    const shown = (n) => n.setAttribute("visibility", "visible");

    // 위 패널 머리글과 범례
    text("라운드별 예금 (억 원)", { x: 50, y: 22 });
    [["예금", "var(--ltt-c1)"], ["준비금", "var(--ltt-c2)"], ["대출 → 다음 라운드 예금", "var(--ltt-line-2)"]]
      .reduce((x, [label, c]) => {
        paint(el("rect", { x, y: 11, width: 12, height: 12 }), { fill: c });
        text(label, { x: x + 18, y: 22 });
        return x + 18 + label.length * 13 + 22;
      }, 290);
    paint(el("line", { x1: X0 - 12, x2: xk(N - 1) + 30, y1: B1, y2: B1 }), { stroke: "var(--ltt-line-2)" });

    // 라운드 기둥: 준비금(아래)과 대출(위). 대출 조각은 다음 라운드 예금으로 옮겨 간다
    const cols = Array.from({ length: N }, (_, k) => ({
      res: paint(el("rect", { x: xk(k) - BW / 2, width: BW, y: B1, height: 0, visibility: "hidden" }), { fill: "var(--ltt-c2)" }),
      loan: paint(el("rect", { x: xk(k) - BW / 2, width: BW, y: B1, height: 0, visibility: "hidden" }), { fill: "var(--ltt-line-2)" }),
      top: text("", { x: xk(k), y: B1, "text-anchor": "middle", visibility: "hidden" }, "cc-small"),
    }));
    const ghost = paint(el("rect", { x: 0, y: B1, width: BW, height: 0, visibility: "hidden" }), { fill: "var(--ltt-c1)" });

    // 아래 패널: 누적 총예금이 천장에 다가가고, 준비금 누적은 최초 예금 100억에 점근한다
    text("누적 총예금 (억 원)", { x: 50, y: B2 - 170 });
    [0, 500, 1000, 1500, 2000].forEach((v) => {
      paint(el("line", { x1: X0 - 12, x2: xk(N - 1) + 30, y1: B2 - v * S2, y2: B2 - v * S2 }), { stroke: "var(--ltt-line)" });
      text(v.toLocaleString("ko-KR"), { x: X0 - 18, y: B2 - v * S2 + 4, "text-anchor": "end" }, "cc-lbl ltt-mono");
    });
    Array.from({ length: N }, (_, k) => text(`${k + 1}`, { x: xk(k), y: B2 + 18, "text-anchor": "middle" }));
    paint(el("line", { x1: X0 - 12, x2: xk(N - 1) + 30, y1: B2 - P * S2, y2: B2 - P * S2, "stroke-width": 1.5 }), { stroke: "var(--ltt-c2)", strokeDasharray: "2 3" });
    text("준비금 극한 100억", { x: xk(N - 1) + 36, y: B2 - P * S2 + 4 });
    const ceilLines = RATES.map((r) => {
      const y = B2 - ceil(r) * S2;
      const line = paint(el("line", { x1: X0 - 12, x2: xk(N - 1) + 30, y1: y, y2: y, "stroke-width": 1.5 }), { strokeDasharray: "6 4" });
      const label = text(`${pct(r)} 천장 ${ceil(r).toLocaleString("ko-KR")}억`, { x: xk(N - 1) + 36, y: y + 4 });
      return { r, line, label };
    });
    const depCurve = paint(el("polyline", { fill: "none", "stroke-width": 2 }), { stroke: "var(--ltt-c1)" });
    const resCurve = paint(el("polyline", { fill: "none", "stroke-width": 2 }), { stroke: "var(--ltt-c2)" });
    const dots = Array.from({ length: N }, (_, k) => paint(el("circle", { cx: xk(k), cy: B2, r: 4, visibility: "hidden" }), { fill: "var(--ltt-c1)" }));

    // 수치 요약: 위 패널 오른쪽
    text("누적 총예금", { x: 720, y: 52 });
    const hv = {
      dep: text("", { x: 720, y: 84 }, "cc-val"),
      res: text("", { x: 720, y: 140 }, "cc-val"),
      info: text("", { x: 720, y: 170 }),
    };
    text("준비금 합계 (극한 100억)", { x: 720, y: 108 });

    let R = 0.1, timers = [];
    const later = (ms, fn) => timers.push(setTimeout(fn, ms));
    const movers = [ghost, ...cols.flatMap((c) => [c.res, c.loan])];
    const stop = () => {
      timers.forEach(clearTimeout);
      timers = [];
      movers.forEach((n) => d3.select(n).interrupt());
    };

    // n라운드까지의 누적 곡선·점·수치
    const draw = (n) => {
      const pts = (f) => Array.from({ length: n }, (_, k) => `${xk(k)},${B2 - f(k + 1) * S2}`).join(" ");
      depCurve.setAttribute("points", pts((m) => cum(R, m)));
      resCurve.setAttribute("points", pts((m) => resCum(R, m)));
      dots.forEach((c, k) => {
        c.setAttribute("cy", B2 - cum(R, k + 1) * S2);
        c.setAttribute("visibility", k < n ? "visible" : "hidden");
      });
      hv.dep.textContent = eok(cum(R, n));
      hv.res.textContent = eok(resCum(R, n));
      hv.info.textContent = `${n} / ${N} 라운드 · 승수 ×${Math.round(1 / R)}`;
    };

    // 선택한 지급준비율의 천장만 강조한다
    const highlight = () => ceilLines.forEach(({ r, line, label }) => {
      const on = r === R;
      line.setAttribute("stroke-width", on ? 2.5 : 1.5);
      paint(line, { stroke: on ? "var(--ltt-accent)" : "var(--ltt-line-2)" });
      label.style.fill = on ? "var(--ltt-ink)" : "var(--ltt-muted)";
    });

    // 기둥을 준비금·대출로 가른다. 정지 상태는 place, 움직임은 grow가 그린다
    const place = (k) => {
      const d = dep(R, k), c = cols[k];
      c.res.setAttribute("y", B1 - R * d * S1);
      c.res.setAttribute("height", R * d * S1);
      c.loan.setAttribute("y", B1 - d * S1);
      c.loan.setAttribute("height", (1 - R) * d * S1);
      c.top.setAttribute("y", B1 - d * S1 - 8);
      c.top.textContent = fmt(d);
      [c.res, c.loan, c.top].forEach(shown);
    };
    const grow = (k) => {
      const d = dep(R, k), c = cols[k];
      c.top.setAttribute("y", B1 - d * S1 - 8);
      c.top.textContent = fmt(d);
      c.res.setAttribute("y", B1);
      c.res.setAttribute("height", 0);
      c.loan.setAttribute("y", B1 - R * d * S1);
      c.loan.setAttribute("height", 0);
      [c.res, c.loan, c.top].forEach(shown);
      d3.select(c.res).transition().duration(T).attr("y", B1 - R * d * S1).attr("height", R * d * S1);
      d3.select(c.loan).transition().duration(T).attr("y", B1 - d * S1).attr("height", (1 - R) * d * S1);
    };

    // 앞 라운드의 대출 조각이 옮겨 가 다음 라운드의 예금이 된다
    const carry = (k) => {
      const d0 = dep(R, k - 1), d = dep(R, k);
      ghost.setAttribute("x", xk(k - 1) - BW / 2);
      ghost.setAttribute("y", B1 - d0 * S1);
      ghost.setAttribute("height", d * S1);
      shown(ghost);
      d3.select(ghost).transition().duration(T).attr("x", xk(k) - BW / 2).attr("y", B1 - d * S1);
    };

    // 예금 → 준비금·대출 → 다음 예금 → 누적 한 칸, 라운드마다 두 박자
    const play = () => {
      for (let k = 0; k < N; k++) {
        const at = 2 * T * k;
        later(at, () => {
          if (k === 0) {
            ghost.setAttribute("x", xk(0) - BW / 2);
            ghost.setAttribute("y", B1 - P * S1);
            ghost.setAttribute("height", P * S1);
            shown(ghost);
          } else carry(k);
        });
        later(at + T, () => { hidden(ghost); grow(k); });
        later(at + 2 * T, () => draw(k + 1));
      }
    };

    const reset = () => {
      hidden(ghost);
      cols.forEach((c) => [c.res, c.loan, c.top].forEach(hidden));
      highlight();
      draw(0);
    };
    const finish = () => {
      hidden(ghost);
      cols.forEach((_, k) => place(k));
      draw(N);
    };
    const restart = () => {
      stop();
      reset();
      if (LTT.MOTION_MS) play();
      else finish();
    };

    LTT.sweep({
      params: { r: { kind: "steps", stops: RATES, value: 0.1, fmt: pct, label: "지급준비율" } },
      render: ({ r }) => { R = r; restart(); },
    });
    return { enter: restart, leave: stop };
  },
  takeaway: "지급준비율이 낮을수록 상한(최초 예금 ÷ 지급준비율)이 커지고, 이 배수를 {{통화 승수}}라 한다.",
  recall: "지급준비율이 20%이면 최초 예금 100억의 상한은 얼마인가?",
  basis: "모델로 계산한 예시. 가정: 대출금 전액이 예금으로 돌아오고 현금 보유·초과 준비금이 없다. 이론상 상한이며, 실제 증가는 대출 수요와 은행 행동에 달려 있다.",
};

LTT.deck({
  title: "신용 창조와 통화 승수",
  theme: "ledger",
  glossary: {
    "지급준비율": "예금 중 은행이 대출하지 않고 준비금으로 쌓아 두는 비율. 10%면 예금 100억 중 10억을 쌓는다.",
    "통화 승수": "최초 예금이 장부상 예금 총량을 몇 배로 키우는지 나타내는 배수. 이론상 1 ÷ 지급준비율이다.",
  },
  scenes: [scene],
});
</script>
</body>
</html>
