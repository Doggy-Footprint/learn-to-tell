<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raft 합의</title>
<script type="application/json" id="ltt-meta">{"topic":"Raft 합의","audience":"분산 시스템 입문 개발자","theme":"sketch","medium":"아키텍처 화이트보드","decision":"합의 기반 저장소 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.raft-q { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.raft-q .t { min-width: 120px; font-weight: 600; color: var(--ltt-ink); }
.raft-q .slots { display: flex; align-items: center; gap: 6px; }
.raft-q .slot { width: 48px; height: 34px; border: 2px solid var(--ltt-line-2); border-radius: 6px; display: grid; place-items: center; color: var(--ltt-muted); background: var(--ltt-card); transition: background .3s, color .3s, border-color .3s; }
.raft-q .slot.on { background: var(--ltt-accent); color: var(--ltt-on-dark); border-color: var(--ltt-accent); }
.raft-q .slot.dead { border-style: dashed; text-decoration: line-through; }
.raft-q .line { width: 0; height: 46px; border-left: 3px dashed var(--ltt-ink); position: relative; margin: 0 2px; }
.raft-q .line span { position: absolute; top: -18px; left: -22px; white-space: nowrap; color: var(--ltt-ink); font-weight: 600; background: var(--ltt-bg); padding: 0 3px; }
.raft-q .res { color: var(--ltt-muted); }
.raft-q .lg { display: flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--ltt-ink); font-weight: 600; }
.raft-q .cell { min-width: 84px; height: 30px; padding: 0 8px; border: 2px dashed var(--ltt-warn); border-radius: 6px; display: grid; place-items: center; background: var(--ltt-warn-soft); color: var(--ltt-ink); }
.raft-q .cell.committed { border-style: solid; border-color: var(--ltt-good); background: var(--ltt-good-soft); }
.raft-fig svg { max-height: 190px; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const N = 5, QUORUM = Math.floor(N / 2) + 1;
LTT.expect("5노드 과반", QUORUM, 3);
LTT.expect("5노드 허용 장애", N - QUORUM, 2);

const POS = { N1: [0, 1], N2: [1, 0], N3: [1, 2], N4: [3, 0], N5: [3, 2] };
// 단계별 상태: nodes {id: [term, 역할·로그, 톤]}, edges, panel {mode, on, dead, res}
const S = [
  { cap: "평시: 리더 N1이 heartbeat(빈 AppendEntries)를 보내고 팔로워는 조용하다",
    n: { N1: ["3", "리더", "accent"], N2: ["3", "팔로워"], N3: ["3", "팔로워"], N4: ["3", "팔로워"], N5: ["3", "팔로워"] },
    e: [["N1", "N2", "heartbeat"], ["N1", "N3"], ["N1", "N4"], ["N1", "N5"]], flow: true,
    p: { title: "대기", on: [], res: "표도 복제도 없다" } },
  { cap: "리더 N1 장애: heartbeat가 끊기고, 무작위 election timeout이 가장 먼저 끝난 N2가 깨어난다",
    n: { N1: ["3", "장애", "bad"], N2: ["3", "timeout 만료", "warn"], N3: ["3", "팔로워"], N4: ["3", "팔로워"], N5: ["3", "팔로워"] },
    e: [], p: { title: "대기", on: [], dead: [0], res: "리더 없음" } },
  { cap: "먼저 term을 3→4로 올리고 후보가 되어 자기에게 한 표를 준다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "후보", "accent"], N3: ["3", "팔로워"], N4: ["3", "팔로워"], N5: ["3", "팔로워"] },
    e: [], p: { title: "득표", on: [1], dead: [0], res: "1 < 3, 아직 부족" } },
  { cap: "그다음 RequestVote를 보낸다. 노드는 term당 한 표만 주고, N3·N4가 찬성해 3표째에 과반선을 넘는다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "후보", "accent"], N3: ["4", "투표함"], N4: ["4", "투표함"], N5: ["3", "응답 늦음"] },
    e: [["N2", "N3"], ["N2", "N4", "RequestVote"], ["N2", "N5"]], send: true,
    p: { title: "득표", on: [1, 2, 3], dead: [0], res: "3 ≥ 3 → 당선", good: true } },
  { cap: "N2가 term 4의 리더가 되어 곧바로 heartbeat로 권위를 알린다. 같은 term에 리더는 둘일 수 없다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "리더", "accent"], N3: ["4", "팔로워"], N4: ["4", "팔로워"], N5: ["4", "팔로워"] },
    e: [["N2", "N3"], ["N2", "N4", "heartbeat"], ["N2", "N5"]], flow: true,
    p: { title: "대기", on: [], dead: [0], res: "새 리더 확정" } },
  { cap: "클라이언트 쓰기 x: 리더 로그에 먼저 미커밋으로 생기고, AppendEntries로 팔로워에 퍼진다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "리더 · x 미커밋", "warn"], N3: ["4", "x 저장 중"], N4: ["4", "x 저장 중"], N5: ["4", "x 저장 중"] },
    e: [["N2", "N3"], ["N2", "N4", "AppendEntries"], ["N2", "N5"]], send: true,
    p: { title: "저장한 노드", on: [1], dead: [0], res: "1 < 3, 아직 미커밋", lg: "pending" } },
  { cap: "리더 포함 3번째 저장 ack에서 x가 커밋된다. N5가 늦어도 커밋은 유효하다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "리더 · x 커밋", "good"], N3: ["4", "x 저장"], N4: ["4", "x 저장"], N5: ["4", "x 늦음", "muted"] },
    e: [["N2", "N3", "ack"], ["N2", "N4"], ["N2", "N5"]],
    p: { title: "저장한 노드", on: [1, 2, 3], dead: [0], res: "3 ≥ 3 → 커밋", good: true, lg: "committed" } },
  { cap: "선출도 커밋도 같은 과반 문턱 3. 5노드는 2대 장애까지 견디니, 합의 저장소는 홀수 노드로 고른다",
    n: { N1: ["3", "장애", "bad"], N2: ["4", "리더 · x 커밋", "good"], N3: ["4", "x 저장"], N4: ["4", "x 저장"], N5: ["4", "x 늦음", "muted"] },
    e: [], p: { title: "저장한 노드", on: [1, 2, 3], dead: [0, 4], res: "5 − 3 = 2대까지 장애 허용", good: true, lg: "committed" } },
];

function raftFigure(el) {
  const wrap = el.appendChild(document.createElement("div")); wrap.className = "raft-fig";
  const svg = wrap.appendChild(document.createElementNS(SVG, "svg"));
  const panel = wrap.appendChild(document.createElement("div")); panel.className = "raft-q";
  const ctl = wrap.appendChild(document.createElement("div"));
  let token = 0, dg = null;
  function draw(i) {
    const st = S[i], my = ++token;
    svg.innerHTML = "";
    const nodes = Object.keys(POS).map((id) => {
      const [term, role, k] = st.n[id];
      return { id, c: POS[id][0], r: POS[id][1], l: id + " · term " + term, s: role, k };
    });
    const edges = st.e.map(([f, t, l]) => ({ f, t, l, dash: !!st.flow, k: "accent" }));
    dg = LTT.diagram(svg, { cols: 4, rows: 3, cell: [240, 100], node: [190, 64], width: 560, nodes, edges });
    if (st.flow && edges.length) dg.flow(edges.map((e) => e.f + ">" + e.t));
    if (st.send) edges.forEach((e) => dg.send(e.f, e.t, { count: 2, ms: 700, gap: 500 }));
    const p = st.p;
    let h = `<span class="t">${p.title}</span><span class="slots">`;
    for (let s = 0; s < N; s++) {
      if (s === QUORUM) h += `<span class="line"><span>과반 ${QUORUM}</span></span>`;
      const cls = (p.on.includes(s) ? " on" : "") + (p.dead && p.dead.includes(s) && !p.on.includes(s) ? " dead" : "");
      h += `<span class="slot${cls}">N${s + 1}</span>`;
    }
    h += `</span>${p.lg ? `<span class="lg">리더 로그 <span class="cell ${p.lg}">x ${p.lg === "committed" ? "커밋" : "미커밋"}</span></span>` : ""}<span class="res">${p.good ? '<span class="ltt-tag good">' + p.res + "</span>" : p.res}</span>`;
    panel.innerHTML = h;
  }
  const st = LTT.stepper(ctl, S.map((s, i) => ({ caption: s.cap, hold: i === 3 || i === 6 ? 4200 : 3200, enter: () => draw(i) })));
  st.play && st.play();
  return { el: wrap, leave() { st.stop && st.stop(); } };
}

LTT.deck({
  title: "Raft 합의",
  theme: "sketch",
  glossary: {
    "term": "임기 번호. 선거가 새로 열릴 때마다 1씩 오르고 줄어들지 않는다.",
    "과반": "전체 노드의 절반을 넘는 수. 5노드면 3이다.",
    "커밋": "과반 노드가 저장해 되돌릴 수 없게 확정된 로그 항목."
  },
  scenes: [{
    type: "overview",
    layout: "full",
    kicker: "Raft 한 장 정리",
    title: "Raft는 과반 투표로 리더를 뽑고, 과반이 저장하면 커밋한다",
    sub: "5노드 클러스터. 아래 칸은 {{과반}} 문턱까지 채워지는 표와 저장 수다. 단계가 자동으로 넘어가고 이전·다음으로 직접 넘길 수도 있다.",
    figure: raftFigure,
    label: "리더 장애 → 선출 → 쓰기 복제 → 커밋",
    caption: "리더 선출과 로그 커밋이 같은 {{과반}} 문턱을 쓰므로 노드 일부가 죽어도 커밋된 값은 사라지지 않는다. 노드를 고를 때는 선출과 {{커밋}}이 쓰는 과반 수로 허용 장애 수를 센다.",
    takeaway: "선출도 커밋도 과반 3(5노드). 리더만 저장한 항목은 아직 미커밋이다."
  }]
});
</script>
</body>
</html>
