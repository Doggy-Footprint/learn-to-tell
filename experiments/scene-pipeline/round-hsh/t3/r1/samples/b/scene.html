<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raft 합의 — 리더 선출과 로그 복제 개요</title>
<script type="application/json" id="ltt-meta">{"topic": "Raft 합의", "audience": "분산 시스템 입문 개발자", "theme": "sketch", "medium": "아키텍처 화이트보드", "decision": "합의 기반 저장소 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const hl = (ids) => (dg) => dg.highlight(ids && ids.length ? ids : null);
const beat = (from, to) => [from, to, {}];

// 5노드 과반 문턱 = floor(5/2)+1 = 3. 선출과 커밋이 같은 값을 쓴다.
const QUORUM = (n) => Math.floor(n / 2) + 1;

const steps = [
  { caption: "① 평시: 리더 S1이 heartbeat를 보내고, 팔로워는 조용하다", hold: 2600,
    enter: hl(["S1"]),
    send: [beat("S1", "S2"), beat("S1", "S3"), beat("S1", "S4"), beat("S1", "S5")] },
  { caption: "② S1이 죽어 heartbeat가 끊기고, S3의 election timeout이 먼저 끝난다", hold: 2600,
    enter: hl(["S3"]) },
  { caption: "③ S3가 term을 +1 하고 후보가 되어 자기 한 표를 찍은 뒤 RequestVote를 보낸다", hold: 2800,
    enter: hl(["S3"]),
    send: [beat("S3", "S2"), beat("S3", "S4"), beat("S3", "S5")] },
  { caption: `④ 노드는 term당 한 표만 준다. 자기 1표 + 2표 = ${QUORUM(5)}표, 과반을 넘어 당선`, hold: 2800,
    enter: hl(["S2", "S3", "S4"]),
    send: [beat("S2", "S3"), beat("S4", "S3")] },
  { caption: "⑤ 새 리더 S3가 빈 AppendEntries(heartbeat)로 권위를 알린다", hold: 2600,
    enter: hl(["S3"]),
    send: [beat("S3", "S2"), beat("S3", "S4"), beat("S3", "S5")] },
  { caption: "⑥ 쓰기는 리더 로그에 미커밋으로 먼저 생기고, AppendEntries로 팔로워에 퍼진다", hold: 2800,
    enter: hl(["S3"]),
    send: [beat("S3", "S2"), beat("S3", "S4"), beat("S3", "S5")] },
  { caption: `⑦ S3 + S2 + S4 = ${QUORUM(5)}표 저장 확인 → 커밋. S5가 늦어도 커밋은 유효하다`, hold: 3200,
    enter: hl(["S3", "S2", "S4"]),
    send: [beat("S2", "S3"), beat("S4", "S3")] },
];

function raft(el) {
  const s = el.appendChild(document.createElementNS(SVG, "svg"));
  const dg = LTT.diagram(s, {
    cols: 3, rows: 3, cell: [300, 190], node: [150, 60],
    nodes: [
      { id: "S1", c: 1, r: 0, l: "S1", icon: "server" },
      { id: "S2", c: 2, r: 1, l: "S2", icon: "server" },
      { id: "S3", c: 0, r: 1, l: "S3", icon: "server" },
      { id: "S4", c: 1, r: 2, l: "S4", icon: "server" },
      { id: "S5", c: 0, r: 2, l: "S5", icon: "server" },
    ],
    edges: [
      { f: "S1", t: "S2", k: "muted" }, { f: "S1", t: "S3", k: "muted" },
      { f: "S1", t: "S4", k: "muted" }, { f: "S1", t: "S5", k: "muted" },
      { f: "S3", t: "S2", k: "muted" }, { f: "S2", t: "S3", k: "muted" },
      { f: "S3", t: "S4", k: "muted" }, { f: "S4", t: "S3", k: "muted" },
      { f: "S3", t: "S5", k: "muted" }, { f: "S5", t: "S3", k: "muted" },
    ],
  });
  const player = el.appendChild(document.createElement("div"));
  dg.player(player, steps);
  return { el: s, dg };
}

const scene = {
  type: "overview",
  title: "Raft는 다수 투표로 리더를 뽑고, 다수가 저장한 항목만 커밋한다",
  en: "Raft: leader election and log replication",
  kicker: "분산 시스템 · Raft 합의",
  sub: "5노드 클러스터 · {{과반}} = 3대. 선출과 커밋이 같은 문턱을 쓴다.",
  figure: raft,
  label: "리더 선출 → 로그 복제 → 커밋",
  caption: "리더가 죽으면 과반 투표로 새 리더가 서고, 리더가 쓴 항목은 과반이 저장해야 커밋된다.",
  takeaway: "선출과 커밋이 같은 과반을 쓰므로, 노드 일부가 죽어도 합의된 값은 사라지지 않는다.",
  recall: "5노드 클러스터에서 과반은 몇 대이고, 몇 대 장애까지 견디나?",
};

LTT.deck({
  title: "Raft 합의 — 리더 선출과 로그 복제 개요",
  theme: "sketch",
  glossary: {
    "과반": "전체 노드의 절반을 넘는 수. N대면 floor(N/2)+1",
    "term": "선거 임기 번호. 한 term에 리더는 최대 한 명",
    "heartbeat": "리더가 살아 있음을 알리려고 주기적으로 보내는 빈 AppendEntries",
  },
  scenes: [scene],
});
</script>
</body>
</html>
