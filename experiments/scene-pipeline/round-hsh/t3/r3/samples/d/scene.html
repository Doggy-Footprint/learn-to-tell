<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raft 합의 — 리더 선출과 로그 복제</title>
<script type="application/json" id="ltt-meta">{"topic": "Raft 합의", "audience": "분산 시스템 입문 개발자", "theme": "sketch", "medium": "아키텍처 화이트보드", "decision": "합의 기반 저장소 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .raft-wrap { display: flex; gap: 24px; align-items: flex-start; }
  .raft-stage { flex: 1; min-width: 0; }
  .raft-side { width: 280px; display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--ltt-line); border-radius: 10px; background: var(--ltt-card); }
  .raft-row { display: grid; gap: 2px; }
  .raft-row span { color: var(--ltt-muted); }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";

// 그림: 중앙 S2가 후보에서 리더가 되고, 왼쪽 S1은 heartbeat가 끊긴 옛 리더다.
const dgSpec = {
  cols: 3, rows: 3, cell: [300, 170], node: [170, 64],
  nodes: [
    { id: "S1", c: 0, r: 1, l: "S1 · 이전 리더", s: "정지", icon: "server", k: "muted" },
    { id: "S2", c: 1, r: 1, l: "S2", icon: "server", k: "accent" },
    { id: "S3", c: 1, r: 0, l: "S3", icon: "server" },
    { id: "S4", c: 2, r: 1, l: "S4", icon: "server" },
    { id: "S5", c: 1, r: 2, l: "S5", icon: "server" },
    { id: "C", c: 0, r: 2, l: "클라이언트", icon: "user" }
  ],
  edges: [
    { id: "hb", f: "S1", t: "S2", dash: true, k: "bad", l: "heartbeat 끊김" },
    { id: "s3", f: "S2", t: "S3", l: "투표 · AppendEntries" },
    { id: "s4", f: "S2", t: "S4" },
    { id: "s5", f: "S2", t: "S5" },
    { id: "w", f: "C", t: "S2", l: "쓰기" }
  ]
};

// 단계마다 바뀌는 값. 같은 단계로 돌아가도 같은 화면이 나온다.
const STATE = [
  { term: "1", role: "S2: 타이머 만료 대기", vote: "—", lead: "1:t1 2:t1 (커밋 2)", fol: "1:t1 2:t1 (커밋 2)", store: "—", commit: "리더 2 · 팔로워 2" },
  { term: "2", role: "후보 (term +1)", vote: "자기 표 1 / 필요 3", lead: "1:t1 2:t1 (커밋 2)", fol: "1:t1 2:t1 (커밋 2)", store: "—", commit: "리더 2 · 팔로워 2" },
  { term: "2", role: "리더", vote: "3 / 5 → 과반수", lead: "1:t1 2:t1 (커밋 2)", fol: "1:t1 2:t1 (커밋 2)", store: "—", commit: "리더 2 · 팔로워 2" },
  { term: "2", role: "리더", vote: "—", lead: "1:t1 2:t1 3:t2 (미커밋)", fol: "1:t1 2:t1 (커밋 2)", store: "1 / 5", commit: "리더 2 · 팔로워 2" },
  { term: "2", role: "리더", vote: "—", lead: "1:t1 2:t1 3:t2 (미커밋)", fol: "S3·S4·S5가 3:t2 받는 중", store: "1 / 5 (복제 요청)", commit: "리더 2 · 팔로워 2" },
  { term: "2", role: "리더", vote: "—", lead: "1:t1 2:t1 3:t2 (미커밋)", fol: "S3·S4 3:t2 저장 · S5 대기", store: "3 / 5 → 과반수, 커밋", commit: "리더 3 · 팔로워 2" },
  { term: "2", role: "리더", vote: "—", lead: "1:t1 2:t1 3:t2 (커밋 3)", fol: "S3·S4 3:t2 저장 · S5 대기", store: "3 / 5 · 클라이언트 응답", commit: "리더 3 · 팔로워 2" },
  { term: "2", role: "리더", vote: "—", lead: "1:t1 2:t1 3:t2 (커밋 3)", fol: "S3·S4·S5 3:t2 (커밋 3)", store: "3 / 5", commit: "리더 3 · 팔로워 3" }
];

// 생성 순서: 타이머 → 투표 → 쓰기 append → 복제 → 과반수 커밋 → ack → 팔로워 커밋
const STEPS = [
  { caption: "리더 S1의 heartbeat가 끊긴다. 팔로워 S2의 election timeout이 먼저 끝난다." },
  { caption: "S2가 term을 2로 올리고 자기 표를 찍은 뒤 나머지 노드에 투표를 요청한다.", hot: ["S2"],
    send: [["S2", "S3", { ms: 700 }], ["S2", "S4", { ms: 700 }], ["S2", "S5", { ms: 700 }]] },
  { caption: "S3·S4가 표를 준다. 자기 표까지 3표 = 5개 중 과반수, S2가 리더가 된다.", hot: ["S3", "S4"] },
  { caption: "클라이언트 쓰기가 리더에 도착한다. 리더는 자기 로그에 먼저 적는다. 아직 미커밋이다.", hot: ["S2"],
    send: [["C", "S2", { ms: 700 }]] },
  { caption: "리더가 AppendEntries로 팔로워에 복제한다.",
    send: [["S2", "S3", { ms: 700 }], ["S2", "S4", { ms: 700 }], ["S2", "S5", { ms: 700 }]] },
  { caption: "S3·S4가 저장하면 리더 포함 3개 = 과반수다. 리더가 commitIndex를 3으로 올린다.", hot: ["S3", "S4", "S2"] },
  { caption: "커밋된 항목만 클라이언트에 응답한다(ack).", hot: ["C"] },
  { caption: "다음 heartbeat에서 팔로워도 commitIndex 3을 따라간다. 리더보다 한 박자 늦다.",
    send: [["S2", "S3", { ms: 700 }], ["S2", "S4", { ms: 700 }], ["S2", "S5", { ms: 700 }]] }
];

function raft(el) {
  const wrap = el.appendChild(LTT.h("div", "raft-wrap"));
  const stage = wrap.appendChild(LTT.h("div", "raft-stage"));
  const svg = stage.appendChild(document.createElementNS(SVG, "svg"));
  const player = stage.appendChild(LTT.h("div", "raft-player"));
  const side = wrap.appendChild(LTT.h("div", "raft-side"));
  side.innerHTML = [["term", "term (선거 번호)"], ["role", "S2 역할"], ["vote", "선거 표"], ["lead", "S2 로그"],
    ["fol", "팔로워 로그"], ["store", "저장 수 (5개 중)"], ["commit", "commitIndex"]]
    .map(([k, t]) => `<div class="raft-row"><span>${t}</span><b class="ltt-mono" data-k="${k}"></b></div>`).join("");

  const show = (i) => {
    const st = STATE[i];
    for (const k in st) side.querySelector(`[data-k="${k}"]`).textContent = st[k];
  };

  const dg = LTT.diagram(svg, dgSpec);
  dg.player(player, STEPS.map((s, i) => ({ ...s, enter: () => show(i) })));
  show(0);
  return { el: wrap, dg };
}

LTT.deck({
  title: "Raft 합의 — 리더 선출과 로그 복제",
  theme: "sketch",
  glossary: {
    "커밋": "과반수가 저장해, 새 리더가 뽑혀도 사라지지 않는다고 확정된 항목."
  },
  scenes: [{
    type: "overview",
    kicker: "분산 시스템 · Raft 리더 선출과 로그 복제 한 장 정리",
    title: "리더가 쓴 항목은 과반수가 저장해야 커밋된다",
    en: "Raft: a write commits only after a majority stores it",
    sub: "리더가 썼다고 안전한 것이 아니다. 과반수(5개 중 3개)가 저장한 뒤에 {{커밋}}이 된다.",
    figure: raft,
    label: "5노드 · 리더 1 · 팔로워 4",
    caption: "S2가 리더가 되고, 쓰기는 과반수가 저장한 뒤에야 커밋된다.",
    basis: "과반수 = floor(N/2) + 1. N=5이면 3, 허용 장애는 2대.",
    takeaway: "과반수가 저장한 항목만 커밋되고, 커밋된 항목은 새 리더에게 남는다.",
    recall: "리더가 항목을 쓴 직후 죽으면, 그 항목은 살아남을까?"
  }]
});
</script>
</body>
</html>
