<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raft 합의 — 리더 선출과 로그 복제</title>
<script type="application/json" id="ltt-meta">{"topic": "Raft 합의", "audience": "분산 시스템 입문 개발자", "theme": "sketch", "medium": "아키텍처 화이트보드", "decision": "합의 기반 저장소 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.raft { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.quorum { display: flex; align-items: center; gap: 10px; }
.quorum .pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ltt-line-2); background: transparent; }
.quorum .pip.on { background: var(--ltt-accent); border-color: var(--ltt-accent); }
.quorum .mark { width: 2px; height: 22px; background: var(--ltt-ink); margin: 0 2px; }
.cards { display: flex; gap: 8px; justify-content: center; width: 100%; }
.card { flex: 1 1 0; max-width: 190px; min-width: 0; border: 1px solid var(--ltt-line); border-radius: 10px; background: var(--ltt-card); padding: 4px 8px; }
.card.dead { opacity: .45; }
.card .head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; min-height: 46px; }
.cell { padding: 1px 5px; border-radius: 4px; border: 1px solid var(--ltt-line); }
.cell.c { background: var(--ltt-good-soft); border-color: var(--ltt-good); }
.cell.u { border-style: dashed; border-color: var(--ltt-warn); background: var(--ltt-warn-soft); }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const NAMES = ["A", "B", "C", "D", "E"];
// 오각형 배치(격자 좌표) + 오른쪽 위 클라이언트
const POS = { A: [1.5, 0], B: [2.5, 0.69], C: [2.1, 1.7], D: [0.9, 1.7], E: [0.5, 0.69] };
const MUTED = "var(--ltt-muted)", WARN = "var(--ltt-warn)", GOOD = "var(--ltt-good)", ACCENT = "var(--ltt-accent)";
const ROLE_TAG = { "리더": "good", "후보": "warn", "팔로워": "muted", "단절": "bad", "죽음": "bad" };

const pairs = [];
for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++) pairs.push([NAMES[i], NAMES[j]]);
const spec = {
  cols: 3, rows: 2.7, cell: [270, 150], node: [150, 54],
  nodes: [
    ...NAMES.map((id) => ({ id, c: POS[id][0], r: POS[id][1], l: "노드 " + id, icon: "server" })),
    { id: "CL", c: 2.95, r: -0.1, l: "클라이언트", icon: "user", k: "muted" },
  ],
  edges: [
    ...pairs.map(([f, t]) => ({ f, t, dash: true, k: "muted" })),
    { f: "CL", t: "B", both: true },
  ],
};

const sendAll = (from, tos, color) => tos.map((t) => [from, t, { color, count: 1, ms: 800 }]);
const ackAll = (froms, to, color) => froms.map((f) => [f, to, { color, count: 1, ms: 800 }]);

// 로그는 항목의 term 배열(index = 위치 + 1), commit은 커밋 경계
const BASE = {};
for (const id of NAMES) BASE[id] = { role: id === "A" ? "리더" : "팔로워", term: 2, log: [1, 2], commit: 2 };

// 생성 순서: 타이머 만료 → term 상승 → 투표 → 리더 → append → 복제 → 과반수 커밋 → ack → 팔로워 commit → 리더 사망·재선출
const BEATS = [
  { cap: "평소: 리더 A의 heartbeat가 팔로워의 타이머를 되돌린다. 로그는 index 2까지 모두 같다.", hl: ["A"], send: sendAll("A", ["B", "C", "D", "E"], MUTED) },
  { cap: "A의 heartbeat가 끊긴다. 팔로워 B의 election timeout이 가장 먼저 만료된다.", hl: ["B"], set: { A: { role: "단절" } } },
  { cap: "B가 후보가 되어 term을 2에서 3으로 먼저 올리고, 자기 표를 찍은 뒤 투표를 요청한다.", hl: ["B"], set: { B: { role: "후보", term: 3 } }, send: sendAll("B", ["C", "D", "E"], WARN) },
  { cap: "C·D·E는 term 3에서 첫 표를 B에게 준다(term당 한 표). B의 표는 자기 포함 4표로 과반수 3을 넘는다.", hl: ["B"], set: { C: { term: 3 }, D: { term: 3 }, E: { term: 3 } }, send: ackAll(["C", "D", "E"], "B", GOOD) },
  { cap: "B가 term 3의 리더가 된다. 단절된 A는 아직 term 2를 믿는다.", hl: ["B"], set: { B: { role: "리더" } } },
  { cap: "쓰기가 도착한다. B는 먼저 자기 로그 index 3(점선 칸)에 적는다. 아직 미커밋이고 저장은 1/5다.", hl: ["B", "CL"], set: { B: { log: [1, 2, 3] } }, send: sendAll("CL", ["B"], ACCENT) },
  { cap: "B가 AppendEntries로 index 3을 C·D·E에 복제한다.", hl: ["B"], send: sendAll("B", ["C", "D", "E"], ACCENT) },
  { cap: "C가 저장하고 응답한다. 저장 2/5, 과반수 3에 못 미쳐 여전히 미커밋이다.", hl: ["B", "C"], set: { C: { log: [1, 2, 3] } }, send: ackAll(["C"], "B", GOOD) },
  { cap: "D까지 저장하면 3/5. 이 순간 index 3이 커밋되고 B의 commitIndex가 3이 된다.", hl: ["B", "C", "D"], set: { D: { log: [1, 2, 3] }, B: { commit: 3 } }, send: ackAll(["D"], "B", GOOD) },
  { cap: "클라이언트 ack는 커밋 뒤에야 나간다. append 직후에는 보내지 않는다.", hl: ["B", "CL"], send: sendAll("B", ["CL"], GOOD) },
  { cap: "다음 AppendEntries로 팔로워도 commitIndex 3을 따라간다. 리더보다 한 박자 늦다. E는 이때 index 3을 받는다.", hl: ["B"], set: { C: { commit: 3 }, D: { commit: 3 }, E: { log: [1, 2, 3], commit: 3 } }, send: sendAll("B", ["C", "D", "E"], MUTED) },
  { cap: "리더 B가 죽는다. 커밋 항목을 가진 C가 후보가 되어 term 4로 올리고 표를 요청한다.", hl: ["C"], set: { B: { role: "죽음" }, C: { role: "후보", term: 4 } }, send: sendAll("C", ["D", "E"], WARN) },
  { cap: "D·E는 C의 로그가 자기만큼 최신이라 표를 준다. C가 term 4의 리더가 되고 커밋된 index 3은 남는다.", hl: ["C"], set: { C: { role: "리더" }, D: { term: 4 }, E: { term: 4 } }, send: ackAll(["D", "E"], "C", GOOD) },
  { cap: "단절이 풀린 A는 더 높은 term 4를 보고 팔로워로 내려가 index 3을 받아 따라잡는다.", hl: ["C"], set: { A: { role: "팔로워", term: 4, log: [1, 2, 3], commit: 3 } }, send: sendAll("C", ["A"], ACCENT) },
];

const states = [];
BEATS.reduce((prev, b) => {
  const s = {};
  for (const id of NAMES) s[id] = { ...prev[id], ...((b.set || {})[id] || {}) };
  states.push(s);
  return s;
}, BASE);

let panel, meter;
const render = (st) => {
  const n3 = NAMES.filter((id) => st[id].log.length >= 3).length;
  const pips = [0, 1, 2, 3, 4].map((i) => `<span class="pip ${i < n3 ? "on" : ""}"></span>` + (i === 2 ? `<span class="mark"></span>` : "")).join("");
  meter.innerHTML = `<b>index 3 저장</b>${pips}<b class="ltt-mono">${n3}/5</b><span class="ltt-basis">세로선 = 과반수 3</span>`;
  panel.innerHTML = NAMES.map((id) => {
    const n = st[id];
    const cells = n.log.map((t, i) => `<span class="cell ltt-mono ${i + 1 <= n.commit ? "c" : "u"}">${i + 1}:t${t}</span>`).join("");
    return `<div class="card ${n.role === "죽음" ? "dead" : ""}"><div class="head"><b>노드 ${id}</b><span class="ltt-tag ${ROLE_TAG[n.role]}">${n.role}</span></div>` +
      `<div class="ltt-mono">term ${n.term}</div><div class="cells">${cells}</div><div class="ltt-basis">commit ${n.commit}</div></div>`;
  }).join("");
};

const steps = BEATS.map((b, i) => ({
  caption: b.cap,
  hold: 2800,
  send: b.send || [],
  enter: (dg) => { dg.highlight(b.hl || null); render(states[i]); },
}));

const figure = (el) => {
  const wrap = document.createElement("div");
  wrap.className = "raft";
  const svg = wrap.appendChild(document.createElementNS(SVG, "svg"));
  meter = wrap.appendChild(document.createElement("div"));
  meter.className = "quorum";
  panel = wrap.appendChild(document.createElement("div"));
  panel.className = "cards";
  const ctl = wrap.appendChild(document.createElement("div"));
  el.appendChild(wrap);
  const dg = LTT.diagram(svg, spec);
  dg.player(ctl, steps);
  render(states[0]);
  return { el: wrap, dg };
};

LTT.expect("5노드 과반수", Math.floor(5 / 2) + 1, 3);
LTT.expect("5노드 허용 장애", 5 - 3, 2);

LTT.deck({
  title: "Raft 합의 — 리더 선출과 로그 복제",
  theme: "sketch",
  glossary: {
    "과반수": "전체 노드의 절반을 넘는 수. 5대면 3대다. 리더 선출과 커밋 모두 이 수로 정한다.",
    "commitIndex": "과반수가 저장을 확인한 로그의 마지막 index. 이 아래 항목만 상태 머신에 적용된다.",
  },
  scenes: [{
    type: "overview",
    kicker: "분산 시스템 · Raft 합의",
    title: "과반수에 복제된 항목만 커밋된다",
    en: "Raft: leader election and log replication",
    sub: "점선 칸은 미커밋, 초록 칸은 커밋이다. 5개 중 3개가 저장하는 순간 점선이 초록으로 바뀐다.",
    figure,
    caption: "칸 표기는 index:term. <span class=\"ltt-tag muted\">모델로 계산한 예시</span>",
    label: "5개 중 3개면 커밋",
    takeaway: "{{과반수}}(5개 중 3개)에 복제된 항목만 {{commitIndex}}가 넘어가 커밋되고, 커밋 항목은 리더가 죽어도 사라지지 않는다.",
    recall: "리더가 항목을 append한 직후 팔로워에 닿기 전에 죽으면, 그 항목은 살아남는가? 5노드 중 2개만 저장한 항목은 커밋인가?",
    basis: "과반수 = floor(N/2)+1, 노드는 term마다 한 표 (Raft 논문). N=5면 3이고, 쓰기마다 과반수 왕복을 치르는 대신 2대 장애까지 데이터가 남는다.",
  }],
});
</script>
</body>
</html>
