<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남향 vs 북향 방의 하루 채광</title>
<script type="application/json" id="ltt-meta">{"topic": "남향 vs 북향 방의 하루 채광", "audience": "집을 고르는 비전문가", "theme": "sketch", "medium": "화이트보드 단면 스케치", "decision": "방의 향 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .sec { width: 100%; }
  .sec svg { width: 100%; height: auto; display: block; overflow: hidden; }
  .sec .lbl { font-family: inherit; font-size: 16px; fill: var(--ltt-ink-2); paint-order: stroke; stroke: var(--ltt-bg); stroke-width: 4px; stroke-linejoin: round; }
  .sec .lbl.big { font-size: 19px; font-weight: 700; fill: var(--ltt-ink); }
  .sec .lbl.sm { font-size: 13px; fill: var(--ltt-muted); }
  .sec .lbl.hot { fill: var(--ltt-accent); font-weight: 700; }
  .sec .ray { fill: none; stroke: var(--ltt-accent); stroke-linecap: round; stroke-dasharray: 12 7; animation: sec-flow 1.1s linear infinite; }
  .sec .ray.go { stroke-width: 2.4; }
  .sec .ray.stop { stroke-width: 1.6; opacity: .4; }
  .sec .sky { fill: none; stroke: var(--ltt-ink-2); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 8 8; animation: sec-flow 1.6s linear infinite; }
  .sec .skyhead { fill: var(--ltt-ink-2); }
  .sec .dome { fill: none; stroke: var(--ltt-line-2); stroke-width: 1.5; stroke-dasharray: 3 7; }
  .sec .wall { fill: var(--ltt-line); }
  .sec .room { fill: var(--ltt-card); }
  .sec .wedge { fill: var(--ltt-accent-soft); }
  .sec .floorlit { stroke: var(--ltt-accent); stroke-width: 6; }
  .sec .guide { stroke: var(--ltt-muted); stroke-width: 1.5; fill: none; }
  .sec .sunc { fill: var(--ltt-accent-soft); stroke: var(--ltt-accent); stroke-width: 2.5; }
  .sec .sunt { stroke: var(--ltt-accent); stroke-width: 2.5; stroke-linecap: round; }
  .sec .arc { fill: none; stroke: var(--ltt-accent); stroke-width: 2; }
  .sec .horizon { stroke: var(--ltt-accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .sec-status { margin: .6rem 0 0; }
  .sec-pick { margin: .4rem 0 0; }
  @keyframes sec-flow { to { stroke-dashoffset: -19; } }
  @media (prefers-reduced-motion: reduce) { .sec .ray, .sec .sky { animation: none; } }
</style>
</head>
<body>
<script>
const NS = "http://www.w3.org/2000/svg";
const rad = (a) => a * Math.PI / 180;

// 단면 치수(m): 창턱 0.9, 창 위끝 2.4, 천장 2.7, 처마 돌출 0.6(창 위끝 높이), 방 깊이 4.5. 1 m = 62 px.
const S = 62, GY = 470, XP = 340;
const PL = XP + 4.5 * S, PR = PL + 8, NI = PR + 4.5 * S, XN = NI + 8;
const HY = GY - 2.4 * S, SY = GY - 0.9 * S, RT = GY - 2.7 * S - 8, VX0 = XP - 0.6 * S, CY = GY - 1.65 * S;
const D = 300, P = 13, K = 9;

// 정오 태양 고도(위도 37°)와 직사광이 닿는 바닥 구간(창에서의 거리, m)
const noonAlt = (decl) => 90 - 37 + decl;
const reach = (alt) => {
  const t = Math.tan(rad(alt));
  const near = 0.9 / t, far = Math.min(2.4 / t - 0.6, 4.5);
  return { near, far, lit: far > near };
};
LTT.expect("동지 정오 고도", noonAlt(-23.4), 30, { tol: 0.5 });
LTT.expect("춘·추분 정오 고도", noonAlt(0), 53, { tol: 0.01 });
LTT.expect("하지 정오 고도", noonAlt(23.4), 76, { tol: 0.5 });
LTT.expect("겨울 직사광 바닥 시작(m)", reach(30).near, 1.6, { tol: 0.05 });
LTT.expect("겨울 직사광 바닥 끝(m)", reach(30).far, 3.56, { tol: 0.02 });
LTT.expect("여름 직사광 유무", reach(76).lit ? 1 : 0, 0);

// 한 광선(바닥과 만나는 x0, 기울기 t)이 어디서 끝나는가
function hit(x0, t) {
  const xV = x0 + (HY - GY) / t;
  if (xV >= VX0 && xV <= XP) return [xV, HY, "stop"];
  const xR = x0 + (RT - GY) / t;
  if (xR >= XP && xR <= XN) return [xR, RT, "stop"];
  if (xR < XP) {
    if (x0 < XP) return [x0, GY, "go"];
    const yw = GY + (XP - x0) * t;
    if (yw >= HY && yw <= SY) return [x0, GY, "go"];
    return [XP, yw, "stop"];
  }
  return [x0, GY, "go"];
}

const SEASONS = {
  30: (r) => `겨울 정오: 해가 낮아(30°) 처마 밑으로 파고들어 창에서 ${r.near.toFixed(1)}~${r.far.toFixed(1)} m 바닥까지 비춘다. 밝기와 온기가 함께 든다.`,
  53: (r) => `봄·가을 정오: 해 53°. 햇빛은 바닥 앞쪽 ${r.near.toFixed(1)}~${r.far.toFixed(1)} m에만 닿는다.`,
  76: () => `여름 정오: 해가 높아(76°) 처마가 광선을 막아 창이 그늘이 된다. 같은 방, 같은 정오, 다른 결과.`,
};

const lesson = {
  kicker: "건축 · 채광",
  title: "남향 방은 겨울 해만 깊이 들이고, 북향 방은 늘 하늘빛만 받는다",
  en: "The south room takes the low winter sun; the north room gets steady sky light",
  sub: "같은 건물을 남북으로 자른 단면(북위 37°, 서울 근처, 정오). 아래 계절을 눌러 해의 높이를 바꿔 본다.",
  narration: "해는 낮 동안 남쪽 하늘을 지나므로 {{직사광}}은 남쪽 창으로만 든다. 겨울의 낮은 해는 처마 밑으로 바닥 깊이 닿고, 여름의 높은 해는 처마에 막힌다. 북쪽 창에는 하늘 전체에서 퍼진 {{천공광}}만 들어와 어둡지만 계절과 시각에 거의 변하지 않는다.",
  takeaway: "남향 방은 겨울 해(약 30°)는 바닥 깊이 들이고 여름 해(약 76°)는 처마로 막는다. 북향 방은 직사광 없이 약하고 고른 빛만 받는다.",
  recall: "여름 정오에 처마 달린 남향 방에 햇빛이 거의 들지 않는 까닭은?",
  basis: "정오 태양 고도 = 90° − 위도 ± 23.4°(동지 30°, 춘·추분 53°, 하지 76°). 빛이 닿는 깊이 = 높이 ÷ tan(고도) − 처마 돌출. 창 0.9~2.4 m, 처마 0.6 m, 방 깊이 4.5 m로 가정한 모델로 계산한 예시이며 날씨·주변 건물에 따라 달라진다. 겨울 직사광은 오전 9시~오후 3시 사이 동→남→서로 바닥 자리가 옮겨 다닌다. 여름 열 부담은 정오 남쪽보다 낮은 각도로 깊게 드는 서향 오후 햇빛이 더 크다.",
  mount(body) {
    body.innerHTML = `
      <div class="sec"><svg id="sec-svg" viewBox="0 0 1060 580" role="img" aria-label="남향 방과 북향 방의 단면: 겨울과 여름 정오 햇빛과 북쪽 창의 하늘빛"></svg></div>
      <div class="ltt-param">계절(정오) <b id="season-v"></b><div id="season"></div></div>
      <p class="sec-status" id="sec-status"></p>
      <p class="sec-pick ltt-basis">고르는 기준: 따뜻함과 밝기가 먼저면 처마 달린 남향, 눈부심 없는 고른 빛이 먼저면 북향.</p>`;
    const svg = body.querySelector("#sec-svg");
    const el = (name, attrs = {}, parent = svg) => {
      const n = document.createElementNS(NS, name);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      parent.appendChild(n);
      return n;
    };
    const text = (x, y, s, cls = "", anchor = "start") => { const n = el("text", { x, y, class: "lbl " + cls, "text-anchor": anchor }); n.textContent = s; return n; };
    const rc = window.rough ? rough.svg(svg) : null;
    const ink = (g) => { g.querySelectorAll("path").forEach((p) => { p.style.stroke = "var(--ltt-ink)"; }); return g; };
    const rline = (x1, y1, x2, y2, w = 3) => {
      if (rc) svg.appendChild(ink(rc.line(x1, y1, x2, y2, { strokeWidth: w, roughness: 1.1, bowing: 1, seed: 7 })));
      else el("line", { x1, y1, x2, y2, stroke: "var(--ltt-ink)", "stroke-width": w });
    };
    const rbox = (x, y, w, h) => {
      el("rect", { x, y, width: w, height: h, class: "wall" });
      if (rc) svg.appendChild(ink(rc.rectangle(x, y, w, h, { strokeWidth: 2.5, roughness: 1.1, seed: 11 })));
    };

    // 방 바닥색, 벽, 지붕
    el("rect", { x: XP + 8, y: RT + 8, width: PL - XP - 8, height: GY - RT - 8, class: "room" });
    el("rect", { x: PR, y: RT + 8, width: NI - PR, height: GY - RT - 8, class: "room" });
    rbox(XP, RT + 8, 8, HY - RT - 8); rbox(XP, SY, 8, GY - SY);
    rbox(PL, RT + 8, 8, GY - RT - 8);
    rbox(NI, RT + 8, 8, HY - RT - 8); rbox(NI, SY, 8, GY - SY);
    rbox(XP, RT, XN - XP + 8, 8);
    rline(0, GY, 1060, GY, 3.5);
    for (const x of [XP + 4, NI + 4]) el("line", { x1: x, y1: HY, x2: x, y2: SY, stroke: "var(--ltt-muted)", "stroke-width": 2, "stroke-dasharray": "2 3" });
    el("line", { x1: VX0, y1: HY - 2, x2: XP, y2: HY - 2, stroke: "var(--ltt-ink)", "stroke-width": 5, "stroke-linecap": "round" });

    // 햇빛이 방에 닿는 면과 광선
    const wedge = el("polygon", { class: "wedge" });
    const rays = Array.from({ length: 2 * K + 1 }, () => el("line", { class: "ray go" }));
    const floorlit = el("line", { class: "floorlit", "stroke-linecap": "butt" });

    // 북쪽 창으로 들어오는 하늘 전체의 빛
    el("path", { class: "dome", d: `M ${XN + 135} ${CY} A 135 135 0 0 0 ${XN} ${CY - 135}` });
    [[12, 337], [35, 358], [58, 384], [80, 404]].forEach(([e, yy]) => {
      const sx = XN + 130 * Math.cos(rad(e)), sy = CY - 130 * Math.sin(rad(e));
      const ex = XN + 2, ey = yy;
      const L = Math.hypot(ex - sx, ey - sy), ux = (ex - sx) / L, uy = (ey - sy) / L;
      el("line", { class: "sky", x1: sx, y1: sy, x2: ex - ux * 9, y2: ey - uy * 9 });
      el("polygon", { class: "skyhead", points: `${ex},${ey} ${ex - ux * 11 - uy * 5},${ey - uy * 11 + ux * 5} ${ex - ux * 11 + uy * 5},${ey - uy * 11 - ux * 5}` });
    });

    // 해
    const sunG = el("g");
    el("circle", { r: 13, class: "sunc" }, sunG);
    for (let i = 0; i < 8; i++) {
      const th = i * Math.PI / 4;
      el("line", { x1: Math.cos(th) * 19, y1: Math.sin(th) * 19, x2: Math.cos(th) * 26, y2: Math.sin(th) * 26, class: "sunt" }, sunG);
    }
    el("line", { x1: 30, y1: 0, x2: 96, y2: 0, class: "horizon" }, sunG);
    const arc = el("path", { class: "arc" }, sunG);
    const angT = el("text", { class: "lbl hot", "text-anchor": "start" }, sunG);

    // 눈금과 라벨
    const RY = GY + 26;
    el("line", { x1: XP, y1: RY, x2: PL, y2: RY, class: "guide" });
    for (let m = 0; m <= 4; m++) {
      el("line", { x1: XP + m * S, y1: RY - 5, x2: XP + m * S, y2: RY + 5, class: "guide" });
      text(XP + m * S, RY + 22, m === 4 ? "4 m" : String(m), "sm", "middle");
    }
    const bracket = el("line", { y1: RY, y2: RY, stroke: "var(--ltt-accent)", "stroke-width": 7 });
    const rangeT = text((XP + PL) / 2, GY + 78, "", "hot", "middle");
    text(XP - 14, RY + 5, "창에서 거리", "sm", "end");
    text((PR + NI) / 2, GY + 78, "직사광이 닿는 바닥 없음", "", "middle");
    text((PR + NI) / 2, GY + 102, "하루 종일 약하고 고른 빛", "sm", "middle");

    text(24, 32, "해는 남쪽 하늘을 지난다", "");
    text(24, GY + 30, "← 남쪽", "big");
    text(1036, GY + 30, "북쪽 →", "big", "end");
    text(XP + 20, RT + 38, "남향 방", "big");
    text(PR + 20, RT + 38, "북향 방", "big");
    text(VX0 - 8, HY - 14, "처마 0.6 m", "", "end");
    text(XP - 14, SY + 22, "창", "", "end");
    text(XN + 130, CY - 150, "하늘 전체에서 퍼진 빛", "", "end");
    text(XN + 130, CY - 130, "(직사광 아님)", "sm", "end");

    const status = body.querySelector("#sec-status");
    let cur = 30, raf = 0, first = true;

    function draw(alt) {
      const a = rad(alt), t = Math.tan(a);
      const d = [Math.cos(a), Math.sin(a)], n = [Math.sin(a), -Math.cos(a)];
      const sun = [XP - D * d[0], CY - D * d[1]];
      sunG.setAttribute("transform", `translate(${sun[0]},${sun[1]})`);
      arc.setAttribute("d", `M 54 0 A 54 54 0 0 1 ${54 * d[0]} ${54 * d[1]}`);
      angT.setAttribute("x", 66); angT.setAttribute("y", -10);
      angT.textContent = `해 높이 ${Math.round(alt)}°`;
      rays.forEach((ln, i) => {
        const k = i - K;
        const px = XP + n[0] * k * P, py = CY + n[1] * k * P;
        const x0 = px + (GY - py) / t;
        const [ex, ey, kind] = hit(x0, t);
        const lam = (x0 - sun[0]) * d[0] + (GY - sun[1]) * d[1];
        ln.setAttribute("x1", x0 - d[0] * lam); ln.setAttribute("y1", GY - d[1] * lam);
        ln.setAttribute("x2", ex); ln.setAttribute("y2", ey);
        ln.setAttribute("class", "ray " + kind);
      });
      const r = reach(alt);
      if (r.lit) {
        const yTop = HY + 0.6 * S * t;
        wedge.setAttribute("points", `${XP},${yTop} ${XP},${SY} ${XP + r.near * S},${GY} ${XP + r.far * S},${GY}`);
        floorlit.setAttribute("x1", XP + r.near * S); floorlit.setAttribute("x2", XP + r.far * S);
        floorlit.setAttribute("y1", GY - 3); floorlit.setAttribute("y2", GY - 3);
        bracket.setAttribute("x1", XP + r.near * S); bracket.setAttribute("x2", XP + r.far * S);
        rangeT.textContent = `직사광이 닿는 바닥 ${r.near.toFixed(1)} ~ ${r.far.toFixed(1)} m`;
      } else {
        wedge.setAttribute("points", "");
        for (const n2 of [floorlit, bracket]) { n2.setAttribute("x1", 0); n2.setAttribute("x2", 0); }
        rangeT.textContent = "직사광이 닿는 바닥 없음";
      }
    }

    function go(to) {
      cancelAnimationFrame(raf);
      status.textContent = SEASONS[to](reach(to));
      const ms = LTT.MOTION_MS * 2;
      if (first || !ms) { first = false; cur = to; draw(to); return; }
      const from = cur, t0 = performance.now();
      const step = (now) => {
        const u = Math.min(1, (now - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        cur = from + (to - from) * e;
        draw(cur);
        if (u < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }

    LTT.sweep({
      params: { season: { kind: "steps", stops: [30, 53, 76], value: 30, fmt: (v) => ({ 30: "겨울 30°", 53: "봄·가을 53°", 76: "여름 76°" })[v] } },
      render: ({ season }) => go(season),
    });
    go(30);
    return { leave() { cancelAnimationFrame(raf); } };
  },
};

LTT.deck({
  title: "남향 vs 북향 방의 하루 채광",
  theme: "sketch",
  glossary: {
    직사광: "해에서 곧장 닿는 빛. 밝고 따뜻하며 그림자가 선명하다.",
    천공광: "대기에 흩어져 하늘 전체에서 오는 빛. 직사광보다 훨씬 약하지만 방향이 없어 고르다.",
  },
  scenes: [lesson],
});
</script>
</body>
</html>
