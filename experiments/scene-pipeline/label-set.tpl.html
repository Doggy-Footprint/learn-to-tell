<title>장면 결함 라벨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: a labelling bench. Scene viewer at fixed 1280x800 scaled to fit on the left, checklist rail on the right, progress strip on top. */
:root {
  --bg: #eef0f1; --surface: #ffffff; --line: #d5dadd; --ink: #1b2328; --muted: #5d6870;
  --accent: #1f6672; --accent-soft: #dcecee; --bad: #b8322f; --bad-soft: #fbe6e4; --na: #8a949a; --na-soft: #e7eaec;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171a; --surface: #1a2125; --line: #2c363c; --ink: #e6ebee; --muted: #9aa6ad;
  --accent: #6cc0cc; --accent-soft: #1d3539; --bad: #ff8a80; --bad-soft: #3a2220; --na: #8f9aa1; --na-soft: #242c31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171a; --surface: #1a2125; --line: #2c363c; --ink: #e6ebee; --muted: #9aa6ad;
  --accent: #6cc0cc; --accent-soft: #1d3539; --bad: #ff8a80; --bad-soft: #3a2220; --na: #8f9aa1; --na-soft: #242c31; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-direction: column; overflow: hidden }
button { font: inherit; color: inherit }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em }
.count { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted) }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 500 }
.store { font-size: 12px; color: var(--muted) }
.store.warn { color: var(--bad) }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600 }
.btn:disabled { opacity: .45; cursor: default }
.strip { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 12px }
.dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); padding: 0; cursor: pointer }
.dot.done { background: var(--accent); border-color: var(--accent) }
.dot.part { background: linear-gradient(90deg, var(--accent) 50%, var(--surface) 50%); border-color: var(--accent) }
.dot.cur { outline: 2px solid var(--ink); outline-offset: 1px }
.dot.gap { margin-right: 10px }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: stretch }
.viewer { min-width: 0; min-height: 0; display: flex; flex-direction: column }
.stagebox { flex: 1; min-height: 0 }
.frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
.frame iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; background: #fff }
.vbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted) }
.vbar a { color: var(--accent) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: hidden }
#groups { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; border-top: 1px solid var(--line); padding-top: 10px }
.picked { flex-shrink: 0; border: 1px solid var(--line); border-radius: 6px; font-size: 13px }
.picked summary { cursor: pointer; padding: 5px 10px; font-weight: 600; color: var(--ink-2, var(--ink)) }
.picked ul { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px }
.picked li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; padding: 2px 4px; border-radius: 4px }
.picked li .pval { font-weight: 600; font-size: 12.5px }
.picked li.bad .pval { color: var(--bad) }
.picked li.ok .pval { color: var(--accent) }
.picked li.na .pval { color: var(--muted) }
.picked li button { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 1px 4px }
.picked li button:hover { color: var(--accent) }
.panel-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted) }
.panel-top strong { color: var(--ink); font-weight: 600 }
.notice { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; font-size: 13px }
.notice p { margin: 0 0 8px }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px }
legend { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 0; margin-bottom: 4px }
.item { border-radius: 5px; padding: 4px 6px; display: grid; grid-template-columns: 1fr auto; gap: 0 6px; align-items: center }
.item .name { font-weight: 500 }
.seg { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }
.seg label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 11px 2px 8px; font-size: 13px; cursor: pointer; background: var(--surface) }
.seg label:hover { border-color: var(--accent) }
.seg input { margin: 0; accent-color: var(--accent) }
.nahint { grid-column: 1 / -1; margin: 3px 0 0; font-size: 12px; color: var(--muted) }
.info { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px }
.def { grid-column: 1 / -1; margin: 4px 0 2px; font-size: 12.5px; color: var(--muted); max-width: 60ch }
.def .ex { display: block; margin-top: 2px }
textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); padding: 6px 8px }
.foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.foot .msg { font-size: 12px; color: var(--muted) }
@media (max-width: 900px) { html, body { height: auto } body { display: block; overflow: visible } main { grid-template-columns: minmax(0, 1fr) } .stagebox { flex: none } #groups { max-height: 60vh } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header>
  <h1>장면 결함 라벨</h1>
  <span class="count" id="count">– / –</span>
  <span class="badge" id="phase" hidden>파일럿</span>
  <span class="store" id="store">저장소 연결 중</span>
  <span class="spacer"></span>
  <button class="btn" id="defs" type="button">정의 접기</button>
</header>
<nav class="strip" id="strip" aria-label="장면 목록"></nav>
<main id="main">
  <section class="viewer">
    <div class="stagebox" id="stagebox"><div class="frame" id="frame"><iframe id="scene" title="평가할 장면"></iframe></div></div>
    <div class="vbar">
      <button class="btn" id="replay" type="button">처음부터 다시 보기</button>
      <a id="open" target="_blank" rel="noopener">새 탭에서 열기</a>
      <span>장면은 1280×800으로 열고 화면에 맞춰 줄였습니다. 장면 안에서는 ← → 키와 단추로 넘깁니다.</span>
    </div>
  </section>
  <form class="panel" id="form" autocomplete="off">
    <div class="panel-top"><span>항목마다 문제 있음·없음을 고릅니다. 고른 항목은 목록에서 빠지고 위 '평가함'(눌러서 펼침)에 기록됩니다.</span><span class="spacer"></span><strong id="left"></strong></div>
    <div class="notice" id="pilotDone" hidden>
      <p>파일럿 10장면을 마쳤습니다. 여기서 멈추고 Claude에게 알려 주세요. 한 번도 체크되지 않았거나 판단이 애매했던 항목을 정리한 뒤 이어서 합니다.</p>
      <button class="btn" type="button" id="pilotGo">그래도 계속하기</button>
    </div>
    <details class="picked" id="picked"><summary id="pickedSum">평가함 0개</summary><ul id="pickedList"></ul></details>
    <div id="groups"></div>
    <div>
      <label for="memo" style="font-size:12px;font-weight:600;color:var(--muted)">메모 (위 항목에 없는 문제, 판단이 애매했던 점)</label>
      <textarea id="memo"></textarea>
    </div>
    <div class="foot">
      <button class="btn" type="button" id="prev">이전</button>
      <button class="btn primary" type="submit" id="next">저장하고 다음</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>
</main>

<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const N = DATA.order.length;
let labels = {}, cur = -1, active = 0, lastInput = performance.now(), db = null, pilotAck = !!ls.get("pilotAck"), jumped = false, dirty = false;
async function leaveTo(i) { if (dirty && !(await save())) return; go(i); }

const ANS = { yes: "있음", no: "없음", na: "해당 없음" };
function choices(it) { return it.options ? [it.options[0], ["no", "문제 없음"], ...it.options.slice(1)] : [["yes", "문제 있음"], ["no", "문제 없음"], ...(it.na ? [["na", "해당 없음"]] : [])]; }
const ansText = (it, a) => (it.options && it.options.find((o) => o[0] === a)?.[1]) || ANS[a];
function buildForm() {
  const groups = [...new Set(DATA.items.map((i) => i.group))];
  $("groups").innerHTML = "";
  for (const g of groups) {
    const fs = document.createElement("fieldset"); const lg = document.createElement("legend"); lg.textContent = g; fs.append(lg);
    for (const it of DATA.items.filter((i) => i.group === g)) {
      const row = document.createElement("div"); row.className = "item"; row.dataset.id = it.id;
      const name = document.createElement("span"); name.className = "name"; name.textContent = it.label; row.append(name);
      const info = document.createElement("button"); info.type = "button"; info.className = "info"; info.textContent = "정의"; row.append(info);
      const seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("role", "radiogroup"); seg.setAttribute("aria-label", it.label);
      for (const [v, t] of choices(it)) {
        const l = document.createElement("label"); l.dataset.v = v; const r = document.createElement("input"); r.type = "radio"; r.name = "a-" + it.id; r.value = v; r.id = "a-" + it.id + "-" + v;
        l.append(r, document.createTextNode(t)); seg.append(l);
      }
      row.append(seg);
      if (it.na) { const n = document.createElement("p"); n.className = "nahint"; n.textContent = "해당 없음: " + it.na; row.append(n); }
      const def = document.createElement("p"); def.className = "def"; def.textContent = it.def;
      const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = "예: " + it.ex; def.append(ex); row.append(def);
      info.addEventListener("click", () => { def.hidden = !def.hidden; });
      fs.append(row);
    }
    $("groups").append(fs);
  }
  $("groups").addEventListener("change", (e) => {
    const row = e.target.closest(".item"); delete row.dataset.open; paintRow(row); refreshPicked(); dirty = true;
  });
  $("memo").addEventListener("input", () => { dirty = true; });
}
const answer = (row) => row.querySelector("input[type=radio]:checked")?.value;
function paintRow(row) {
  const a = answer(row);
  row.dataset.ans = a || "";
  row.hidden = !!a && !row.dataset.open;
}
function refreshPicked() {
  const list = $("pickedList"); list.innerHTML = "";
  const rows = [...document.querySelectorAll("#groups .item")], done = rows.filter((r) => answer(r));
  for (const row of done) {
    const it = DATA.items.find((i) => i.id === row.dataset.id), a = answer(row), li = document.createElement("li");
    li.className = a === "no" ? "ok" : a === "na" ? "na" : "bad";
    const name = document.createElement("span"); name.className = "pname"; name.textContent = it.label;
    const val = document.createElement("span"); val.className = "pval"; val.textContent = ansText(it, a);
    const edit = document.createElement("button"); edit.type = "button"; edit.textContent = "고치기";
    edit.addEventListener("click", () => { row.dataset.open = "1"; paintRow(row); refreshPicked(); row.scrollIntoView({ block: "nearest" }); });
    const x = document.createElement("button"); x.type = "button"; x.textContent = "지우기"; x.setAttribute("aria-label", it.label + " 평가 지우기");
    x.addEventListener("click", () => { row.querySelectorAll("input").forEach((i) => (i.checked = false)); delete row.dataset.open; paintRow(row); refreshPicked(); dirty = true; });
    li.append(name, val, edit, x); list.append(li);
  }
  const bad = done.filter((r) => !["no", "na"].includes(answer(r))).length;
  $("pickedSum").textContent = `평가함 ${done.length}개` + (bad ? ` · 문제 ${bad}개` : "");
  $("left").textContent = rows.length - done.length ? `남은 항목 ${rows.length - done.length}개` : "모든 항목을 평가했습니다";
  document.querySelectorAll("#groups fieldset").forEach((fs) => (fs.hidden = ![...fs.querySelectorAll(".item")].some((r) => !r.hidden)));
}
function readForm() {
  const answers = {};
  document.querySelectorAll("#groups .item").forEach((r) => { const a = answer(r); if (a) answers[r.dataset.id] = a; });
  return { answers, complete: Object.keys(answers).length === DATA.items.length, memo: $("memo").value.trim() };
}
function fillForm(d) {
  const a = (d && d.answers) || {};
  document.querySelectorAll("#groups input[type=radio]").forEach((x) => (x.checked = a[x.name.slice(2)] === x.value));
  document.querySelectorAll("#groups .item").forEach((r) => { delete r.dataset.open; paintRow(r); }); refreshPicked();
  $("memo").value = (d && d.memo) || "";
}
function setDefs(open) {
  document.querySelectorAll(".def").forEach((p) => (p.hidden = !open));
  $("defs").textContent = open ? "정의 접기" : "정의 펼치기"; ls.set("defsOpen", open);
}

const frame = $("frame"), iframe = $("scene"), box = $("stagebox"), narrow = matchMedia("(max-width: 900px)");
function fit() {
  const s = Math.min(box.clientWidth / 1280, narrow.matches ? Infinity : box.clientHeight / 800);
  frame.style.width = 1280 * s + "px"; frame.style.height = 800 * s + "px"; iframe.style.transform = `scale(${s})`; return s;
}
new ResizeObserver(fit).observe(box);

function strip() {
  const el = $("strip"); if (!el.childElementCount) {
    DATA.order.forEach((tok, i) => { const b = document.createElement("button"); b.type = "button"; b.className = "dot"; b.title = `${i + 1}번`; b.setAttribute("aria-label", `${i + 1}번 장면`);
      if (i === DATA.pilot - 1) b.classList.add("gap"); b.addEventListener("click", () => leaveTo(i)); el.append(b); });
  }
  [...el.children].forEach((b, i) => { const d = labels[DATA.order[i]]; b.classList.toggle("done", !!(d && d.complete)); b.classList.toggle("part", !!(d && !d.complete)); b.classList.toggle("cur", i === cur); });
  const done = DATA.order.filter((t) => labels[t] && labels[t].complete).length;
  $("count").textContent = `${cur + 1} / ${N} · 완료 ${done}`;
  $("phase").hidden = cur >= DATA.pilot;
  $("prev").disabled = cur <= 0;
  $("next").textContent = cur === N - 1 ? "저장" : "저장하고 다음";
}
function go(i) {
  if (i < 0 || i >= N) return;
  cur = i; const tok = DATA.order[i];
  iframe.src = `s/${tok}.html`; $("open").href = `s/${tok}.html`;
  fillForm(labels[tok]); dirty = false; active = 0; lastInput = performance.now(); $("msg").textContent = "";
  $("pilotDone").hidden = true; $("groups").scrollTop = 0; strip(); fit(); window.scrollTo({ top: 0 });
}
async function save() {
  const tok = DATA.order[cur], prev = labels[tok];
  const doc = { pos: cur + 1, ...readForm(), seconds: ((prev && prev.seconds) || 0) + active, scale: +fit().toFixed(3), savedAt: Date.now(), v: 3 };
  labels[tok] = doc; active = 0; dirty = false;
  if (db) { try { await db.collection("labels").doc(tok).set(doc); } catch (e) { $("msg").textContent = "저장 실패: " + (e && e.code || "알 수 없음") + ". 다시 눌러 주세요."; return false; } }
  else ls.set("labels", labels);
  return true;
}
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const left = DATA.items.length - Object.keys(readForm().answers).length;
  if (left) { $("msg").textContent = `아직 평가하지 않은 항목이 ${left}개 있습니다.`; return; }
  $("next").disabled = true;
  const ok = await save(); $("next").disabled = false; if (!ok) return;
  if (cur === DATA.pilot - 1 && !pilotAck) { strip(); $("pilotDone").hidden = false; $("msg").textContent = "저장했습니다."; $("pilotDone").scrollIntoView({ block: "nearest" }); return; }
  if (cur < N - 1) go(cur + 1); else { strip(); $("msg").textContent = "마지막 장면까지 저장했습니다."; }
});
$("pilotGo").addEventListener("click", () => { pilotAck = true; ls.set("pilotAck", true); go(cur + 1); });
$("prev").addEventListener("click", () => leaveTo(cur - 1));
$("replay").addEventListener("click", () => { iframe.src = iframe.src; });
$("defs").addEventListener("click", () => setDefs($("defs").textContent === "정의 펼치기"));

// seconds counts only while the tab is visible and the labeler acted in the last 2 minutes; an idle open tab once logged ~2 hours on one scene.
const poke = () => { lastInput = performance.now(); };
const INPUTS = ["pointerdown", "pointermove", "keydown", "wheel", "scroll"];
INPUTS.forEach((ev) => window.addEventListener(ev, poke, { passive: true, capture: true }));
iframe.addEventListener("load", () => { try { INPUTS.forEach((ev) => iframe.contentWindow.addEventListener(ev, poke, { passive: true, capture: true })); } catch {} });
setInterval(() => { if (document.visibilityState === "visible" && performance.now() - lastInput < 120000) active++; }, 1000);
buildForm(); setDefs(ls.get("defsOpen") !== false);
const firstOpen = () => DATA.order.findIndex((t) => !(labels[t] && labels[t].complete));
(async () => {
  db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db) {
    labels = ls.get("labels") || {};
    $("store").textContent = "저장소에 연결하지 못했습니다. 이 브라우저에만 임시 저장됩니다."; $("store").classList.add("warn");
    go(Math.max(0, firstOpen())); return;
  }
  $("store").textContent = "저장소 연결됨";
  db.collection("labels").onSnapshot((snap) => {
    const next = {}; snap.docs.forEach((d) => { if (d.exists) next[d.id] = d.data(); });
    labels = { ...labels, ...next };
    if (!jumped && !snap.metadata.fromCache) { jumped = true; go(Math.max(0, firstOpen() < 0 ? N - 1 : firstOpen())); } else strip();
  }, (e) => { $("store").textContent = "저장소 연결이 끊겼습니다(" + e.code + "). 새로고침해 주세요."; $("store").classList.add("warn"); });
  setTimeout(() => { if (!jumped) { jumped = true; go(Math.max(0, firstOpen())); } }, 4000);
})();
go(0);
</script>
