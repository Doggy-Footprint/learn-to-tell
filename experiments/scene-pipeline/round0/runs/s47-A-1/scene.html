<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국가별 전력 믹스</title>
<script type="application/json" id="ltt-meta">{"topic": "국가별 전력 믹스", "audience": "에너지 정책 입문자", "theme": "atlas", "medium": "에너지 통계 차트", "decision": "전원 구성 비교"}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<style>
.mx { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.mx > * { min-width: 0; }
.mx-card { background: var(--ltt-card); border: 1px solid var(--ltt-line); border-radius: 12px; padding: 16px; }
.mx-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--ltt-ink-2); margin-bottom: 8px; }
.mx-axis { position: relative; height: 18px; margin-left: 78px; margin-right: 8px; font-size: 12px; color: var(--ltt-muted); }
.mx-axis span { position: absolute; top: 0; transform: translateX(-50%); }
.mx-axis span:first-child { transform: none; }
.mx-axis span:last-child { transform: translateX(-100%); }
.mx-rows { display: grid; gap: 8px; }
.mx-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 10px; background: none; color: var(--ltt-ink); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
.mx-row[aria-pressed="true"] { border-color: var(--ltt-accent); background: var(--ltt-accent-soft); font-weight: 700; }
.mx-bar { position: relative; display: flex; height: 48px; border-radius: 6px; overflow: hidden; background: var(--ltt-card-2); }
.mx-seg { flex: none; height: 100%; width: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--ltt-on-dark); text-shadow: 0 0 3px var(--ltt-dark), 0 0 3px var(--ltt-dark); border-left: 2px solid var(--ltt-card); transition: width .9s cubic-bezier(.3, .7, .2, 1), background-color .6s; }
.mx-base { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--ltt-ink); opacity: .85; pointer-events: none; transition: left .3s; }
.mx-note { margin-top: 10px; font-size: 13px; color: var(--ltt-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mx-note i { display: inline-block; width: 0; height: 14px; border-left: 2px dashed var(--ltt-ink); }
.mx-side { display: grid; gap: 14px; }
.mx-side .ltt-param { margin: 0; }
.mx-who { font-size: 14px; color: var(--ltt-ink-2); }
.mx-who b { color: var(--ltt-ink); }
.mx-delta { font-size: 14px; color: var(--ltt-ink-2); margin-top: 2px; }
.mx-list { display: grid; gap: 6px; margin-top: 10px; }
.mx-li { display: grid; grid-template-columns: 14px minmax(0, 1fr) 52px 64px; gap: 8px; align-items: center; font-size: 14px; }
.mx-li .sw { width: 14px; height: 14px; border-radius: 3px; transition: background-color .6s; }
.mx-li .v { text-align: right; font-weight: 700; }
.mx-li .d { text-align: right; color: var(--ltt-muted); font-size: 13px; }
@media (max-width: 820px) { .mx { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .mx-seg, .mx-base, .mx-li .sw { transition: none; } }
</style>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
const SRC = [
  { n: "석탄", c: "var(--ltt-c1)" },
  { n: "가스·석유", c: "var(--ltt-c2)" },
  { n: "원자력", c: "var(--ltt-c3)" },
  { n: "수력", c: "var(--ltt-c4)" },
  { n: "풍력·태양광", c: "var(--ltt-c5)" },
  { n: "기타(바이오 등)", c: "var(--ltt-c6)" },
];
// 발전량 비중(%), 순서는 SRC와 같다. 반올림한 대략값
const MIX = {
  "한국": { 2000: [38, 20, 40, 2, 0, 0], 2010: [41, 23, 32, 1, 0, 3], 2023: [34, 28, 31, 1, 6, 0] },
  "프랑스": { 2000: [5, 4, 77, 12, 0, 2], 2010: [4, 5, 74, 12, 2, 3], 2023: [1, 7, 65, 11, 14, 2] },
  "독일": { 2000: [51, 10, 29, 4, 2, 4], 2010: [42, 14, 22, 3, 8, 11], 2023: [26, 15, 1, 3, 43, 12] },
  "중국": { 2000: [78, 3, 1, 17, 0, 1], 2010: [79, 2, 2, 16, 1, 0], 2023: [60, 3, 5, 14, 16, 2] },
};
const GROUPS = [
  { n: "화석(석탄·가스·석유)", c: "var(--ltt-muted)", idx: [0, 1] },
  { n: "무탄소(원자력·수력·풍력·태양광)", c: "var(--ltt-accent)", idx: [2, 3, 4] },
  { n: "기타(바이오 등)", c: "var(--ltt-line-2)", idx: [5] },
];
const sum = (a) => a.reduce((x, y) => x + y, 0);
const clean = (m) => m[2] + m[3] + m[4];
for (const k in MIX) for (const y in MIX[k]) LTT.expect(k + " " + y + " 합계", sum(MIX[k][y]), 100, { tol: 0 });

const energyScene = {
  title: "전력 100%를 무엇으로 채우는지는 나라마다, 해마다 다르다",
  sub: "전원은 전기를 만드는 방식이다. 연도를 바꾸면 줄이 100% 안에서 다시 나뉘고, 줄을 누르면 오른쪽에 그 나라의 숫자가 나온다.",
  takeaway: "전원 구성은 100%를 나눠 갖는 몫이라 한 전원이 커지면 다른 전원이 줄어든다.",
  recall: "독일에서 2000년에 석탄이 있던 자리를 2023년에는 무엇이 채웠나?",
  basis: "수업용으로 반올림한 대략값이다. 출처와 집계 방식에 따라 몇 %p 달라질 수 있어 불확실하다. 정책 판단 전에는 원자료로 확인한다.",
  mount(body) {
    const countries = Object.keys(MIX);
    body.innerHTML = `
      <div class="mx">
        <div class="mx-card">
          <div class="mx-head"><span>발전량 100% 중 전원별 몫</span><span class="ltt-tag muted">반올림한 대략값</span></div>
          <div class="mx-axis">${[0, 25, 50, 75, 100].map((t) => `<span style="left:${t}%">${t}%</span>`).join("")}</div>
          <div class="mx-rows" id="rows">${countries.map((c) => `
            <button type="button" class="mx-row" data-c="${c}" aria-pressed="false">
              <span>${c}</span>
              <span class="mx-bar">${SRC.map(() => `<span class="mx-seg"></span>`).join("")}<span class="mx-base"></span></span>
            </button>`).join("")}</div>
          <div class="mx-note"><i></i><span>점선은 2000년에 화석 전원이 끝나던 자리다. 그 오른쪽이 줄어든 만큼 다른 전원이 늘었다.</span></div>
        </div>
        <div class="mx-side">
          <div class="mx-card">
            <div class="ltt-param">연도 <b id="year-v"></b><div id="year"></div></div>
            <div class="ltt-param" style="margin-top:10px">보기 <b id="view-v"></b><div id="view"></div></div>
          </div>
          <div class="mx-card">
            <div class="mx-who"><b id="who"></b> 무탄소 비중</div>
            <div class="ltt-hero"><span id="hv">0</span><small>%</small></div>
            <div class="mx-delta" id="hd"></div>
            <div class="mx-list" id="list"></div>
          </div>
        </div>
      </div>`;
    const rowEls = [...body.querySelectorAll(".mx-row")];
    let sel = "독일", last = { year: 2000, view: 6 }, timers = [], shown = 0;

    const parts = (m, view) => view === 6
      ? SRC.map((s, i) => ({ n: s.n, c: s.c, v: m[i] }))
      : GROUPS.map((g) => ({ n: g.n, c: g.c, v: sum(g.idx.map((i) => m[i])) }));

    const paint = ({ year, view }) => {
      last = { year, view };
      rowEls.forEach((row) => {
        const c = row.dataset.c, m = MIX[c][year];
        row.setAttribute("aria-pressed", String(c === sel));
        const segs = row.querySelectorAll(".mx-seg");
        let w = m.slice(), col = SRC.map((s) => s.c);
        if (view === 3) {
          w = [0, 0, 0, 0, 0, 0];
          GROUPS.forEach((g) => { w[g.idx[0]] = sum(g.idx.map((i) => m[i])); col[g.idx[0]] = g.c; });
        }
        let first = true;
        segs.forEach((s, i) => {
          s.style.width = w[i] + "%";
          s.style.backgroundColor = col[i];
          s.style.borderLeftWidth = w[i] > 0 && !first ? "2px" : "0";
          s.textContent = w[i] >= 7 ? w[i] + "%" : "";
          if (w[i] > 0) first = false;
        });
        const b = MIX[c][2000];
        row.querySelector(".mx-base").style.left = (b[0] + b[1]) + "%";
      });
      const m = MIX[sel][year], m0 = MIX[sel][2000];
      body.querySelector("#who").textContent = sel + " " + year + "년";
      const to = clean(m), diff = to - clean(m0);
      LTT.tween(body.querySelector("#hv"), to, (v) => Math.round(v), 700);
      body.querySelector("#hd").textContent = year === 2000 ? "비교 기준 연도" : "2000년 대비 " + (diff >= 0 ? "+" : "−") + Math.abs(diff) + "%p";
      body.querySelector("#list").innerHTML = parts(m, view).map((p, i) => {
        const d = p.v - parts(m0, view)[i].v;
        return `<div class="mx-li"><span class="sw" style="background:${p.c}"></span><span>${p.n}</span><span class="v">${p.v}%</span><span class="d">${year === 2000 ? "" : (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d) + "%p"}</span></div>`;
      }).join("");
    };

    rowEls.forEach((row) => row.addEventListener("click", () => { sel = row.dataset.c; paint(last); }));

    LTT.sweep({
      params: {
        year: { kind: "steps", stops: [2000, 2010, 2023], value: 2000, fmt: (v) => v + "년", stopLabel: (v) => String(v) },
        view: { kind: "steps", stops: [6, 3], value: 6, fmt: (v) => (v === 6 ? "전원 6가지" : "3묶음"), stopLabel: (v) => (v === 6 ? "전원별" : "묶어서") },
      },
      render: paint,
    });

    const stop = () => { timers.forEach(clearTimeout); timers = []; };
    body.addEventListener("pointerdown", stop);
    body.addEventListener("keydown", stop);
    return {
      enter() {
        stop();
        if (!LTT.MOTION_MS) return;
        const btns = body.querySelectorAll("#year button");
        [1, 2].forEach((k, n) => timers.push(setTimeout(() => btns[k] && btns[k].click(), 1500 + n * 2400)));
      },
      leave: stop,
    };
  },
};

LTT.deck({ title: "국가별 전력 믹스", theme: "atlas", glossary: {}, scenes: [energyScene] });
</script>
</body>
</html>
