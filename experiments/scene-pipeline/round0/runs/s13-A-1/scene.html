<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 퍼널 이탈 지점</title>
<script type="application/json" id="ltt-meta">{"topic":"결제 퍼널 이탈 지점","audience":"UX 입문자","theme":"studio","medium":"제품 분석 대시보드","decision":"어느 결제 단계를 먼저 고칠까"}</script>
<style>
  .cf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; width: 100%; align-items: start; }
  .fn { position: relative; height: 374px; margin: 12px 8px 0 8px; }
  .fr { position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px; transition: opacity .5s; }
  .fr.dim { opacity: .38; }
  .nm { width: 108px; flex: none; display: flex; flex-direction: column; line-height: 1.25; }
  .nm b { font-size: 14px; color: var(--ltt-ink); }
  .nm small { font-size: 13px; color: var(--ltt-muted); }
  .tr { flex: 1; min-width: 0; height: 100%; }
  .bar { height: 100%; display: flex; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar .ok { background: var(--ltt-c1); }
  .bar .lk { background: var(--ltt-bad-soft); border: 1.5px dashed var(--ltt-bad); border-left: 0; box-sizing: border-box; border-radius: 0 6px 6px 0; }
  .gp { position: absolute; left: 120px; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ltt-bad); transition: opacity .5s; }
  .gp.dim { opacity: .38; }
  .gp svg { width: 14px; height: 14px; flex: none; }
  .lens { position: absolute; left: -8px; right: -8px; border: 2px solid var(--ltt-accent); border-radius: 12px; background: var(--ltt-accent-soft); opacity: .9; pointer-events: none; z-index: 2;
          transition: top .7s cubic-bezier(.4, 0, .2, 1), height .7s cubic-bezier(.4, 0, .2, 1); }
  .lens span { position: absolute; right: 10px; top: -11px; background: var(--ltt-accent); color: var(--ltt-card); font-size: 13px; padding: 1px 8px; border-radius: 99px; }
  .dt { height: 396px; border: 1px solid var(--ltt-line); border-radius: 14px; background: var(--ltt-card); overflow: hidden; display: flex; flex-direction: column; }
  .dh { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 8px; flex-wrap: wrap; }
  .dh .big { font-size: 34px; line-height: 1; color: var(--ltt-bad); font-weight: 700; }
  .dh small { font-size: 13px; color: var(--ltt-muted); }
  .dbody { flex: 1; min-height: 0; padding: 0 16px 14px; transform-origin: 50% 40%; }
  .zin { animation: zin .75s cubic-bezier(.2, .7, .2, 1) both; }
  .zout { animation: zout .75s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes zin { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes zout { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .scr { padding: 14px 18px; font-size: 13px; color: #222; background: #fff; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px; }
  .scr h4 { margin: 0 0 2px; font-size: 14px; }
  .scr .ln { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e6e6e6; }
  .scr .fd { border: 1px solid #c9c9c9; border-radius: 6px; padding: 5px 9px; color: #666; background: #fafafa; }
  .scr .btn { margin-top: auto; align-self: stretch; text-align: center; background: #2f6bff; color: #fff; border-radius: 8px; padding: 8px; font-weight: 600; }
  .hot { outline: 2px dashed #e5484d; outline-offset: 2px; border-radius: 4px; background: #fff1f1; }
  .why { font-size: 13px; color: #c62a2f; font-weight: 600; }
  .rk { display: grid; gap: 14px; padding: 8px 4px 0; }
  .rk .row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 118px; gap: 12px; align-items: center; font-size: 14px; }
  .rk .trk { height: 24px; background: var(--ltt-card-2); border-radius: 6px; overflow: hidden; }
  .rk .trk i { display: block; height: 100%; background: var(--ltt-bad); border-radius: 6px; }
  .rk .row.first .trk i { background: var(--ltt-bad); }
  .rk .row:not(.first) .trk i { opacity: .45; }
  .rk .num { font-size: 13px; color: var(--ltt-ink-2); text-align: right; }
  .rk .hint { font-size: 13px; color: var(--ltt-muted); }
  @media (max-width: 900px) { .cf { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
// 설명용 모델 수치: 화면에 도착한 사람 수. 마지막은 결제 완료.
const STAGES = [
  { name: "장바구니", reach: 10000, url: "shop.example/cart" },
  { name: "배송 정보", reach: 7800, url: "shop.example/checkout/shipping" },
  { name: "카드 정보", reach: 6900, url: "shop.example/checkout/card" },
  { name: "최종 확인", reach: 4000, url: "shop.example/checkout/review" },
  { name: "결제 완료", reach: 3600, url: "" },
];
const leaked = (i) => STAGES[i].reach - STAGES[i + 1].reach;
const rate = (i) => leaked(i) / STAGES[i].reach;
const pct = (v) => Math.round(v * 100) + "%";
const won = (n) => n.toLocaleString("ko-KR");

const ROW = 46, PITCH = 82, GAP = 36;
const SCREENS = [
  { why: "배송비가 이 화면에서 처음 보인다", html: `
    <h4>장바구니</h4>
    <div class="ln"><span>무선 이어폰</span><span>49,000원</span></div>
    <div class="ln"><span>충전 케이스</span><span>12,000원</span></div>
    <div class="ln hot"><span>배송비</span><span>+3,000원</span></div>
    <div class="ln"><b>합계</b><b>64,000원</b></div>
    <div class="btn">주문하기</div>` },
  { why: "가입하지 않으면 다음 단계로 갈 수 없다", html: `
    <h4>배송 정보</h4>
    <div class="fd">이름</div><div class="fd">연락처</div><div class="fd">주소</div>
    <div class="fd hot">비밀번호 (회원가입)</div>
    <div class="btn">가입하고 계속</div>` },
  { why: "오류 문구가 무엇이 틀렸는지 말하지 않는다", html: `
    <h4>카드 정보</h4>
    <div class="fd hot">1234 5678 9012 ____</div>
    <div class="why">입력값을 확인해 주세요</div>
    <div style="display:flex;gap:8px"><div class="fd" style="flex:1">유효기간</div><div class="fd" style="flex:1">CVC</div></div>
    <div class="btn">결제 정보 확인</div>` },
  { why: "여기까지 온 사람은 대부분 끝까지 간다", html: `
    <h4>주문 확인</h4>
    <div class="ln"><span>상품 2개</span><span>61,000원</span></div>
    <div class="ln"><span>배송비</span><span>3,000원</span></div>
    <div class="ln hot"><b>결제 금액</b><b>64,000원</b></div>
    <div class="btn">64,000원 결제하기</div>` },
];

function funnel(el) {
  const root = el.appendChild(LTT.h("div", "cf"));
  const left = root.appendChild(LTT.h("div", "fn"));
  const right = root.appendChild(LTT.h("div", "dt"));
  const maxReach = STAGES[0].reach;
  STAGES.forEach((s, i) => {
    const w = (s.reach / maxReach) * 100;
    const keep = i < 4 ? (STAGES[i + 1].reach / s.reach) * 100 : 100;
    const row = LTT.h("div", "fr", `<span class="nm"><b>${s.name}</b><small>${won(s.reach)}명</small></span>
      <div class="tr"><div class="bar" style="width:${w}%"><i class="ok" style="flex:${keep}"></i>${i < 4 ? `<i class="lk" style="flex:${100 - keep}"></i>` : ""}</div></div>`);
    row.style.top = i * PITCH + "px";
    row.dataset.i = i;
    left.appendChild(row);
    if (i < 4) {
      const gp = LTT.h("div", "gp", `${LTT.icon("arrow-down")}<span>−${won(leaked(i))}명 떠남 · ${pct(rate(i))}</span>`);
      gp.style.top = i * PITCH + ROW + "px";
      gp.dataset.i = i;
      left.appendChild(gp);
    }
  });
  const lens = left.appendChild(LTT.h("div", "lens", "<span></span>"));
  const lensTag = lens.firstChild;

  const paint = (kind, build) => {
    right.innerHTML = "";
    const body = right.appendChild(LTT.h("div", "dbody " + kind));
    build(body);
  };
  const ranking = (body, sorted) => {
    const order = [0, 1, 2, 3].sort((a, b) => (sorted ? rate(b) - rate(a) : a - b));
    body.appendChild(LTT.h("div", "rk", order.map((i, n) => `
      <div class="row ${sorted && n === 0 ? "first" : ""}"><b>${STAGES[i].name}</b>
        <div class="trk"><i style="width:${(rate(i) / 0.5) * 100}%"></i></div>
        <span class="num">${pct(rate(i))} · ${won(leaked(i))}명</span></div>`).join("") +
      `<div class="hint">${sorted ? "비율과 건수 모두 가장 큰 단계부터 고친다" : "화면마다 떠난 비율, 아직 순서 없음"}</div>`));
  };

  function show(k) {
    left.querySelectorAll(".fr, .gp").forEach((n) => {
      const i = +n.dataset.i;
      n.classList.toggle("dim", k >= 1 && k <= 4 && i !== k - 1);
    });
    const head = (title, big, sub) => right.insertBefore(LTT.h("div", "dh", `<span class="ltt-tag">${title}</span><span class="big">${big}</span><small>${sub}</small>`), right.firstChild);
    if (k >= 1 && k <= 4) {
      const i = k - 1;
      lens.style.top = i * PITCH - 5 + "px";
      lens.style.height = ROW + GAP + 4 + "px";
      lensTag.textContent = "확대";
      paint("zin", (body) => {
        const m = LTT.mock.browser({ url: STAGES[i].url, content: SCREENS[i].html });
        body.appendChild(m.el);
        body.appendChild(LTT.h("div", "why", SCREENS[i].why)).style.margin = "8px 2px 0";
      });
      head(`화면 ${k} · ${STAGES[i].name}`, pct(rate(i)), `${won(STAGES[i].reach)}명 중 ${won(leaked(i))}명 이탈`);
    } else {
      lens.style.top = "-8px";
      lens.style.height = "390px";
      lensTag.textContent = "전체";
      paint(k === 0 ? "" : "zout", (body) => ranking(body, k === 5));
      head(k === 5 ? "먼저 고칠 곳: 카드 정보" : "화면별 이탈률", k === 5 ? pct(rate(2)) : "", k === 5 ? `${won(leaked(2))}명이 이 화면에서 떠난다` : "10,000명이 장바구니에서 시작");
    }
  }
  show(0);
  return { el: root, show };
}

const CAP = [
  "① 전체 퍼널. 10,000명이 장바구니에서 시작해 3,600명이 결제한다. 막대 끝의 붉은 점선 띠가 그 화면에서 떠난 사람이다.",
  "② 장바구니로 확대. 2,200명(22%)이 떠난다. 배송비가 이 화면에서 처음 보이는 것이 의심 원인이다.",
  "③ 배송 정보로 이동. 900명(12%)이 떠난다. 가입 요구가 있어도 비율은 크지 않다.",
  "④ 카드 정보로 이동. 6,900명 중 2,900명(42%)이 떠난다. 비율도 건수도 가장 크다.",
  "⑤ 최종 확인으로 이동. 400명(10%)이 떠난다. 여기까지 온 사람은 대부분 끝낸다.",
  "⑥ 다시 축소. 네 화면을 이탈률로 줄 세우면 카드 정보가 첫 번째다. 먼저 고칠 곳이다.",
];

LTT.expect("카드 정보 이탈률", rate(2), 0.42029, { tol: 1e-4 });
LTT.expect("장바구니 이탈 건수", leaked(0), 2200, { tol: 0 });

LTT.deck({
  title: "결제 퍼널 이탈 지점",
  theme: "studio",
  glossary: {
    "퍼널": "사용자가 목표(결제)까지 거치는 화면 단계의 줄. 단계마다 일부가 떠나 폭이 좁아진다.",
    "이탈률": "한 화면에 도착한 사람 중 다음 단계로 가지 않고 떠난 비율.",
  },
  scenes: [{
    type: "figure",
    kicker: "UX · 결제 퍼널",
    title: "가장 많이 새는 곳은 카드 정보 입력 화면이다",
    en: "Where the checkout funnel leaks most",
    sub: "{{퍼널}}을 한 화면씩 확대하며 {{이탈률}}과 원인 후보를 본다. 오른쪽 단계 자막을 넘긴다.",
    figure: funnel,
    steps: CAP.map((caption, k) => ({ caption, enter: (_, fig) => fig.show(k) })),
    takeaway: "이탈률과 건수를 함께 보고, 가장 큰 단계부터 고친다.",
    recall: "네 화면 중 먼저 고칠 곳은 어디이고, 왜 그런가?",
    basis: "수치와 화면 원인은 설명용으로 만든 예시이다. 실제 서비스에서는 단계별 이벤트 로그로 확인한다. 모델로 계산한 예시.",
  }],
});
</script>
</body>
</html>
