<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>온도조절기 오버슈트</title>
<script type="application/json" id="ltt-meta">{"topic":"온도조절기 되먹임 루프와 오버슈트","audience":"제어 입문자","theme":"lab","medium":"실험 노트 플롯","decision":"히스테리시스 폭과 난방 지연","domain":"제어","pattern":["hook"],"mode":"카탈로그용: 장면 하나짜리. 되먹임 구조를 \"입자가 흐름\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>.tc-host{width:100%;max-width:1040px;margin:0 auto}.tc-host svg{width:100%;height:auto;display:block}.tc-host text{font-family:inherit}</style>
<style>/* 장면 하나짜리라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head><body><script>
const SVG = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 방 모델: 1차 지연. 가열 중이면 T가 35°C를 향해, 아니면 외기 5°C를 향해 간다. 계수는 가정한 예시값
const SC = { Tout: 5, Tin: 35, a: 0.05, sp: 21, h: 0.5, T0: 18.5, dt: 0.005, TMAX: 40, LD: 2 };
function sim(Ld) {
  const n = Math.round(SC.TMAX / SC.dt) + 1, lag = Math.round(Ld / SC.dt);
  const T = new Float64Array(n), cmd = new Uint8Array(n), eff = new Uint8Array(n);
  const k = 1 - Math.exp(-SC.a * SC.dt); let t = SC.T0, c = 1;
  for (let i = 0; i < n; i++) {
    if (t <= SC.sp - SC.h) c = 1; else if (t >= SC.sp + SC.h) c = 0;
    cmd[i] = c; eff[i] = i >= lag ? cmd[i - lag] : cmd[0]; T[i] = t;
    t += ((eff[i] ? SC.Tin : SC.Tout) - t) * k;
  }
  return { T, cmd, eff, n };
}
const REAL = sim(SC.LD), IDEAL = sim(0);
const argmax = (T, a, b) => { let m = a; for (let i = a; i <= b; i++) if (T[i] > T[m]) m = i; return m; };
const argmin = (T, a, b) => { let m = a; for (let i = a; i <= b; i++) if (T[i] < T[m]) m = i; return m; };
const iPk = argmax(REAL.T, 0, Math.round(12 / SC.dt)), iTr = argmin(REAL.T, iPk, iPk + Math.round(9 / SC.dt));
const PK = REAL.T[iPk], TR = REAL.T[iTr], IDEAL_MAX = IDEAL.T[argmax(IDEAL.T, Math.round(5 / SC.dt), IDEAL.n - 1)];
// 손계산: 끄는 순간 21.5°C, 2분 더 가열 → 35 − 13.5·e^(−0.1) / 켜는 순간 20.5°C, 2분 더 냉각 → 5 + 15.5·e^(−0.1)
LTT.expect("지연 2분 최고 온도(°C)", PK, 22.785, { tol: 0.03 });
LTT.expect("지연 2분 최저 온도(°C)", TR, 19.025, { tol: 0.03 });
LTT.expect("지연 0분 최고 온도(°C)", IDEAL_MAX, 21.5, { tol: 0.02 });

const W = 1040, H = 560, L = 70, R = 890, TOP = 70, B = 500, YMAX = 27, YMIN = 17;
const X = (t) => L + t / SC.TMAX * (R - L), Y = (v) => TOP + (YMAX - v) / (YMAX - YMIN) * (B - TOP);

function plot(host) {
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, "data-annotate": "" }, host);
  const defs = el("defs", {}, s), cp = el("clipPath", { id: "tc-clip" }, defs), clipR = el("rect", { x: L, y: 0, width: 0, height: H }, cp);
  // 눈금
  [18, 19, 20, 21, 22, 23].forEach((v) => {
    el("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    el("text", { x: L - 10, y: Y(v) + 5, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s).textContent = v;
  });
  [0, 10, 20, 30, 40].forEach((t) => {
    el("line", { x1: X(t), x2: X(t), y1: B, y2: B + 6, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
    el("text", { x: X(t), y: B + 26, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-muted)" }, s).textContent = t;
  });
  el("text", { x: R, y: B + 48, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s).textContent = "시간 (분) →";
  el("text", { x: L - 10, y: TOP - 18, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s).textContent = "방 온도 (°C) ↑";
  el("line", { x1: L, x2: R, y1: B, y2: B, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
  el("line", { x1: L, x2: L, y1: TOP, y2: B, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s);

  // 히스테리시스 밴드와 목표선
  el("rect", { x: L, y: Y(SC.sp + SC.h), width: R - L, height: Y(SC.sp - SC.h) - Y(SC.sp + SC.h), style: "fill:var(--ltt-accent-soft);opacity:.8" }, s);
  el("line", { x1: L, x2: R, y1: Y(SC.sp), y2: Y(SC.sp), style: "stroke:var(--ltt-accent);stroke-width:1.2;stroke-dasharray:6 5" }, s);
  el("text", { x: R + 8, y: Y(SC.sp) + 5, style: "font-size:14px;font-weight:700;fill:var(--ltt-accent)" }, s).textContent = "목표 21°C";
  el("text", { x: R + 8, y: Y(SC.sp - SC.h) + 22, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s).textContent = "밴드 ±0.5°C";

  // 실제 최고·최저 수준선
  [[PK, "최고 " + PK.toFixed(1) + "°C"], [TR, "최저 " + TR.toFixed(1) + "°C"]].forEach(([v, lab]) => {
    el("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), style: "stroke:var(--ltt-warn);stroke-width:1.2;stroke-dasharray:3 5;opacity:.8" }, s);
    el("text", { x: R + 8, y: Y(v) + 5, style: "font-size:14px;font-weight:700;fill:var(--ltt-warn)" }, s).textContent = lab;
  });

  // 겹쳐 놓은 두 실행: 지연 0분(점선)과 지연 2분(실선), 히터 실제 가열 띠
  const g = el("g", { "clip-path": "url(#tc-clip)" }, s);
  const path = (S) => { let d = ""; for (let i = 0; i < S.n; i += 4) d += (d ? "L" : "M") + X(i * SC.dt).toFixed(1) + "," + Y(S.T[i]).toFixed(1); return d; };
  el("path", { d: path(IDEAL), style: "fill:none;stroke:var(--ltt-muted);stroke-width:1.6;stroke-dasharray:5 4" }, g);
  let a = -1;
  for (let i = 0; i < REAL.n; i++) {
    if (REAL.eff[i] && a < 0) a = i;
    if ((!REAL.eff[i] || i === REAL.n - 1) && a >= 0) { el("rect", { x: X(a * SC.dt), y: B - 14, width: Math.max(1, X(i * SC.dt) - X(a * SC.dt)), height: 10, style: "fill:var(--ltt-warn);opacity:.85" }, g); a = -1; }
  }
  el("path", { d: path(REAL), style: "fill:none;stroke:var(--ltt-accent);stroke-width:2.8;stroke-linejoin:round" }, g);
  el("text", { x: L + 10, y: B - 22, style: "font-size:14px;fill:var(--ltt-warn);font-weight:700" }, s).textContent = "▮ 히터가 실제로 데우는 구간";

  // 범례와 핵심 수치
  el("line", { x1: L + 14, x2: L + 48, y1: 90, y2: 90, style: "stroke:var(--ltt-accent);stroke-width:2.8" }, s);
  el("text", { x: L + 56, y: 95, style: "font-size:14px;fill:var(--ltt-ink)" }, s).textContent = `난방 지연 ${SC.LD}분 (실제 히터)`;
  el("line", { x1: L + 14, x2: L + 48, y1: 114, y2: 114, style: "stroke:var(--ltt-muted);stroke-width:1.6;stroke-dasharray:5 4" }, s);
  el("text", { x: L + 56, y: 119, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s).textContent = "난방 지연 0분 (이상적인 히터)";
  el("text", { x: L + 14, y: 156, style: "font-size:18px;font-weight:700;fill:var(--ltt-ink)" }, s).textContent = `밴드는 ±${SC.h}°C로 정했는데`;
  el("text", { x: L + 14, y: 182, style: "font-size:18px;font-weight:700;fill:var(--ltt-warn)" }, s).textContent = `방은 ${TR.toFixed(1)} ~ ${PK.toFixed(1)}°C를 오간다`;

  // 첫 정점과 골 표식
  const px = X(iPk * SC.dt), tx = X(iTr * SC.dt);
  el("circle", { cx: px, cy: Y(PK), r: 8, style: "fill:none;stroke:var(--ltt-warn);stroke-width:2" }, s);
  el("text", { x: px, y: Y(PK) - 14, "text-anchor": "middle", style: "font-size:14px;font-weight:700;fill:var(--ltt-warn)" }, s).textContent = `오버슈트 +${(PK - SC.sp - SC.h).toFixed(1)}°C`;
  el("circle", { cx: tx, cy: Y(TR), r: 8, style: "fill:none;stroke:var(--ltt-warn);stroke-width:2" }, s);
  el("text", { x: tx, y: Y(TR) + 28, "text-anchor": "middle", style: "font-size:14px;font-weight:700;fill:var(--ltt-warn)" }, s).textContent = `언더슈트 −${(SC.sp - SC.h - TR).toFixed(1)}°C`;

  // 되먹임 루프 삽입 카드: 같은 판 위에 얹는다
  const IX = R - 320, IY = 62, IH = 160;
  el("rect", { x: IX, y: IY, width: 320, height: IH, rx: 8, style: "fill:var(--ltt-card);stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
  const ig = el("g", { transform: `translate(${IX},${IY})` }, s);
  const arrow = (x1, y1, x2, y2) => { el("line", { x1, y1, x2, y2, style: "stroke:var(--ltt-line-2);stroke-width:2" }, ig);
    const d = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(d), n = Math.sin(d);
    el("polygon", { points: `${x2},${y2} ${x2 - 9 * c + 5 * n},${y2 - 9 * n - 5 * c} ${x2 - 9 * c - 5 * n},${y2 - 9 * n + 5 * c}`, style: "fill:var(--ltt-line-2)" }, ig); };
  arrow(110, 30, 208, 30); arrow(260, 46, 260, 106); arrow(210, 122, 112, 122); arrow(60, 106, 60, 48);
  const lagTx = el("text", { x: 160, y: 22, "text-anchor": "middle", style: "font-size:14px;font-weight:700;fill:var(--ltt-warn)" }, ig); lagTx.textContent = `지연 ${SC.LD}분`;
  const pools = {
    cmd: Array.from({ length: Math.ceil(SC.LD / 0.5) + 2 }, () => el("circle", { r: 5, style: "fill:var(--ltt-accent)" }, ig)),
    heat: Array.from({ length: 4 }, () => el("circle", { r: 5, style: "fill:var(--ltt-warn)" }, ig)),
    fb: Array.from({ length: 5 }, () => el("circle", { r: 4.5, style: "fill:var(--ltt-ink-2)" }, ig)) };
  const box = (x, y, w, label) => { const r = el("rect", { x, y, width: w, height: 32, rx: 5, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1.5" }, ig);
    el("text", { x: x + w / 2, y: y + 21, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink)" }, ig).textContent = label; return r; };
  const bComp = box(10, 14, 100, "비교 ±0.5°C"), bHeat = box(210, 14, 100, "히터"), bRoom = box(210, 106, 100, "방"), bSens = box(10, 106, 100, "센서");
  const rd1 = el("text", { x: 160, y: 72, "text-anchor": "middle", style: "font-size:14px;font-weight:700" }, ig), rd2 = el("text", { x: 160, y: 92, "text-anchor": "middle", style: "font-size:14px;font-weight:700" }, ig);
  el("text", { x: 160, y: 154, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink-2)" }, ig).textContent = "↺ 센서가 방을 다시 읽는다";

  const mk = el("circle", { r: 7, style: "fill:var(--ltt-accent);stroke:var(--ltt-card);stroke-width:2" }, s);
  const mt = el("text", { "text-anchor": "middle", style: "font-size:14px;font-weight:700;fill:var(--ltt-accent)" }, s);

  const idx = (S, t) => clamp(Math.round(t / SC.dt), 0, S.n - 1);
  const lerp = (p, q, f) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
  function stream(pool, t, spacing, travel, on, pos) {
    const j1 = Math.floor(t / spacing), j0 = Math.floor((t - travel) / spacing) + 1; let k = 0;
    for (let j = j0; j <= j1 && k < pool.length; j++) { const f = (t - j * spacing) / travel; if (f < 0 || f > 1 || !on(j * spacing)) continue;
      const [x, y] = pos(f); pool[k].setAttribute("cx", x); pool[k].setAttribute("cy", y); pool[k].style.opacity = Math.sin(Math.PI * clamp(f * 1.1)) * .9 + .1; k++; }
    for (; k < pool.length; k++) pool[k].style.opacity = 0;
  }
  function draw(u) {
    const t = u * SC.TMAX, i = idx(REAL, t), Tn = REAL.T[i], cm = REAL.cmd[i], ef = REAL.eff[i];
    clipR.setAttribute("width", Math.max(0, X(t) - L));
    mk.setAttribute("cx", X(t)); mk.setAttribute("cy", Y(Tn));
    mt.setAttribute("x", clamp(X(t), L + 30, R - 20)); mt.setAttribute("y", Y(Tn) - 16); mt.textContent = Tn.toFixed(1) + "°C";
    rd1.textContent = cm ? "명령: 켬" : "명령: 끔"; rd1.style.fill = cm ? "var(--ltt-accent)" : "var(--ltt-muted)";
    rd2.textContent = ef ? "가열: 중" : "가열: 멈춤"; rd2.style.fill = ef ? "var(--ltt-warn)" : "var(--ltt-muted)";
    bComp.style.fill = cm ? "var(--ltt-accent-soft)" : "var(--ltt-card-2)"; bHeat.style.stroke = ef ? "var(--ltt-warn)" : "var(--ltt-line-2)";
    stream(pools.cmd, t, 0.5, SC.LD, (s) => REAL.cmd[idx(REAL, s)], (f) => lerp([110, 30], [210, 30], f));
    stream(pools.heat, t, 0.5, 1.5, (s) => REAL.eff[idx(REAL, s)], (f) => lerp([260, 46], [260, 106], f));
    stream(pools.fb, t, 0.5, 2, () => true, (f) => f < .5 ? lerp([210, 122], [110, 122], f * 2) : lerp([60, 106], [60, 46], (f - .5) * 2));
  }
  return { draw };
}

function loop(period, draw) { let raf = 0, t0 = 0;
  return { enter() { clearTimeout(raf); if (reduced) { draw(0.999); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } }; }

LTT.deck({ title: "온도조절기 오버슈트", theme: "lab",
  glossary: {
    "히스테리시스": "켜는 온도와 끄는 온도를 일부러 다르게 둔 폭. 목표 둘레의 이 밴드를 벗어나야 스위치가 바뀌어, 잦은 켜짐·꺼짐을 막는다",
    "난방 지연": "켜짐·꺼짐 명령이 나간 뒤 히터가 실제로 방에 열을 내거나 멈출 때까지 걸리는 시간",
    "오버슈트": "목표(또는 밴드)를 넘어서 더 나아가는 양" },
  scenes: [{ type: "hook", pre: "온도조절기", text: "21°C에서 히터를 꺼도 방은 23°C 가까이 올라간다",
    sub: "꺼짐 명령이 나가도 히터는 {{난방 지연}} 동안 더 데운다. 그만큼 {{오버슈트}}가 {{히스테리시스}} 폭보다 커진다.",
    basis: "방 모델 dT/dt = a(T∞ − T): a = 0.05/분, 가열 중 T∞ = 35°C, 멈춤 T∞ = 외기 5°C, 지연 2분. 계수는 모두 가정한 예시값이다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    mount(body) { const h = body.appendChild(document.createElement("div")); h.className = "tc-host"; const f = plot(h); f.draw(reduced ? 0.999 : 0); return loop(24000, f.draw); } }] });
</script></body></html>
