<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온도조절기 되먹임 루프와 오버슈트</title>
<script type="application/json" id="ltt-meta">{"topic":"온도조절기 되먹임 루프와 오버슈트","audience":"제어 입문자","theme":"lab","medium":"실험 노트 플롯","decision":"히스테리시스 폭과 난방 지연"}</script>
<style>
  .rig { display: grid; gap: 10px; min-width: 0; }
  .rig svg { width: 100%; height: auto; max-height: calc(100vh - 330px); min-height: 260px; display: block; }
  .rig .knobs { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; }
  .rig .knobs .ltt-param { margin: 0; }
  .rig text { font-family: inherit; }
  .rig .tk { font-size: 16px; fill: var(--ltt-muted); }
  .rig .lb { font-size: 16px; fill: var(--ltt-ink-2); }
  .rig .nd { font-size: 15px; fill: var(--ltt-ink); text-anchor: middle; dominant-baseline: central; font-weight: 600; }
  .rig .big { font-size: 44px; font-weight: 700; fill: var(--ltt-ink); text-anchor: end; font-variant-numeric: tabular-nums; }
  .rig .big small { font-size: 22px; }
  .rig .cap { font-size: 16px; fill: var(--ltt-ink-2); text-anchor: end; }
</style>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
const SP = 21, T_START = 18, T_OUT = 10, T_END = 60, DT = 0.05, SCALE = 5; // 목표, 시작, 외기(°C), 재생 길이(분), 계산 간격(분), 재생 속도(분/초)
const N = Math.round(T_END / DT);

// 방 온도 모델: 릴레이(밴드) → 지연 → 히터(1차 지연) → 방(열손실)
function simulate(h, d) {
  const T = new Float32Array(N + 1), U = new Uint8Array(N + 1), R = new Float32Array(N + 1);
  const runMax = new Float32Array(N + 1), runIdx = new Uint16Array(N + 1), cnt = new Uint8Array(N + 1);
  const lag = Math.round(d / DT);
  let t = T_START, r = 0, u = 0, prev = -1, c = 0, mx = 0, mi = 0;
  for (let i = 0; i <= N; i++) {
    if (t < SP - h) u = 1; else if (t > SP + h) u = 0;
    U[i] = u;
    if (u !== prev) { if (prev >= 0) c++; prev = u; }
    const ud = i - lag >= 0 ? U[i - lag] : 0;
    r += (ud - r) / 1.2 * DT;
    t += (-0.025 * (t - T_OUT) + 0.5 * r) * DT;
    T[i] = t; R[i] = r;
    if (t - (SP + h) > mx) { mx = t - (SP + h); mi = i; }
    runMax[i] = mx; runIdx[i] = mi; cnt[i] = c;
  }
  return { T, U, R, runMax, runIdx, cnt };
}
LTT.expect("지연 0, 밴드 ±1°C: 넘침이 작다", simulate(1, 0).runMax[N], 0.06, { tol: 0.05 });
LTT.expect("지연 8분, 밴드 ±1°C: 넘침이 크다", simulate(1, 8).runMax[N], 1.6, { tol: 0.3 });

function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function mountScene(body) {
  body.innerHTML = `<div class="rig"><svg id="plot" viewBox="0 0 900 500" role="img" aria-label="방 온도 곡선. 목표 21도 둘레의 밴드 안에서 히터를 켜고 끄지만, 난방 지연 때문에 온도가 밴드를 넘어 달린다."></svg>
    <div class="knobs"><div class="ltt-param">밴드 폭 <b id="hy-v"></b><div id="hy"></div></div>
    <div class="ltt-param">난방 지연 <b id="dl-v"></b><div id="dl"></div></div></div></div>`;
  const svg = body.querySelector("#plot");
  const L = 64, RR = 800, TP = 24, BT = 452;
  const X = (t) => L + (RR - L) * t / T_END;
  const Y = (T) => TP + (BT - TP) * (29 - T) / 13;

  // 모눈
  const grid = mk("g", {}, svg);
  for (let T = 16; T <= 28; T += 2) {
    mk("line", { x1: L, x2: RR, y1: Y(T), y2: Y(T), stroke: "var(--ltt-line)", "stroke-width": 1 }, grid);
    mk("text", { x: L - 10, y: Y(T) + 5, class: "tk", "text-anchor": "end" }, grid).textContent = T;
  }
  for (let t = 0; t <= T_END; t += 5) {
    mk("line", { x1: X(t), x2: X(t), y1: TP, y2: BT, stroke: "var(--ltt-line)", "stroke-width": 1, opacity: t % 10 ? 0.45 : 1 }, grid);
    if (t % 10 === 0) mk("text", { x: X(t), y: BT + 24, class: "tk", "text-anchor": "middle" }, grid).textContent = t;
  }
  mk("text", { x: RR, y: BT + 46, class: "lb", "text-anchor": "end" }, grid).textContent = "시간 (분)";
  mk("text", { x: L - 10, y: TP - 6, class: "lb", "text-anchor": "end" }, grid).textContent = "°C";
  mk("line", { x1: L, x2: L, y1: TP, y2: BT, stroke: "var(--ltt-ink-2)", "stroke-width": 1.5 }, grid);
  mk("line", { x1: L, x2: RR, y1: BT, y2: BT, stroke: "var(--ltt-ink-2)", "stroke-width": 1.5 }, grid);

  // 밴드·목표
  const band = mk("rect", { x: L, width: RR - L, fill: "var(--ltt-accent-soft)" }, svg);
  mk("line", { x1: L, x2: RR, y1: Y(SP), y2: Y(SP), stroke: "var(--ltt-ink-2)", "stroke-width": 1.5, "stroke-dasharray": "6 5" }, svg);
  mk("text", { x: RR + 8, y: Y(SP) + 5, class: "lb" }, svg).textContent = "목표 21°C";

  // 곡선: 같은 시계로 그려지도록 clipPath 하나를 둘이 공유
  const clip = mk("clipPath", { id: "reveal" }, svg);
  const clipRect = mk("rect", { x: L - 4, y: 0, height: 500, width: 0 }, clip);
  const curves = mk("g", { "clip-path": "url(#reveal)" }, svg);
  const ghost = mk("path", { fill: "none", stroke: "var(--ltt-muted)", "stroke-width": 2.5, "stroke-dasharray": "3 6", "stroke-linecap": "round" }, curves);
  const live = mk("path", { fill: "none", stroke: "var(--ltt-accent)", "stroke-width": 4, "stroke-linejoin": "round" }, curves);
  const head = mk("circle", { r: 7, fill: "var(--ltt-accent)", stroke: "var(--ltt-card)", "stroke-width": 2 }, svg);

  // 넘침 괄호
  const br = mk("g", { stroke: "var(--ltt-warn)", "stroke-width": 3, "stroke-linecap": "round" }, svg);
  const brL = mk("line", {}, br), brA = mk("line", {}, br), brB = mk("line", {}, br);
  const brT = mk("text", { class: "lb", style: "font-weight:700;fill:var(--ltt-ink)" }, svg);
  brT.textContent = "넘침";

  // 숫자 두 개
  const ovN = mk("text", { x: RR, y: 62, class: "big" }, svg);
  mk("text", { x: RR, y: 88, class: "cap" }, svg).textContent = "밴드 위로 넘친 최대치";
  const swN = mk("text", { x: 600, y: 62, class: "big" }, svg);
  mk("text", { x: 600, y: 88, class: "cap" }, svg).textContent = "켜고 끈 전환";

  // 범례
  const lg = mk("g", {}, svg);
  mk("line", { x1: 390, x2: 424, y1: 124, y2: 124, stroke: "var(--ltt-accent)", "stroke-width": 4 }, lg);
  const lgL = mk("text", { x: 432, y: 130, class: "lb" }, lg);
  mk("line", { x1: 560, x2: 594, y1: 124, y2: 124, stroke: "var(--ltt-muted)", "stroke-width": 2.5, "stroke-dasharray": "3 6", "stroke-linecap": "round" }, lg);
  mk("text", { x: 602, y: 130, class: "lb" }, lg).textContent = "지연 0일 때";
  mk("rect", { x: 700, y: 114, width: 18, height: 20, fill: "var(--ltt-accent-soft)", stroke: "var(--ltt-line-2)" }, lg);
  const lgB = mk("text", { x: 726, y: 130, class: "lb" }, lg);

  // 되먹임 고리 (플롯 위에 겹쳐 놓는다)
  const ins = mk("g", { transform: `translate(${L + 12},${TP + 8})` }, svg);
  mk("rect", { width: 262, height: 144, rx: 8, fill: "var(--ltt-card)", stroke: "var(--ltt-line-2)", opacity: 0.96 }, ins);
  const P = [[50, 34], [212, 34], [212, 112], [50, 112], [50, 34]];
  mk("polyline", { points: P.map((p) => p.join(",")).join(" "), fill: "none", stroke: "var(--ltt-line-2)", "stroke-width": 2 }, ins);
  const pLayer = mk("g", {}, ins);
  const nodeDefs = [["온도계", 0], ["조절기", 1], ["히터", 2], ["방", 3]];
  const nodes = nodeDefs.map(([name, k]) => {
    const g = mk("g", { transform: `translate(${P[k][0]},${P[k][1]})` }, ins);
    const r = mk("rect", { x: -37, y: -15, width: 74, height: 30, rx: 6, fill: "var(--ltt-card)", stroke: "var(--ltt-ink-2)", "stroke-width": 1.5 }, g);
    mk("text", { class: "nd" }, g).textContent = name;
    return r;
  });
  const delayT = mk("text", { x: 131, y: 70, class: "nd" }, ins);
  mk("text", { x: 131, y: 92, class: "nd", style: "font-size:14px;font-weight:400;fill:var(--ltt-muted)" }, ins).textContent = "명령이 닿기까지";

  // 상태
  let h = 1, d = 5, S = simulate(h, d), G = simulate(h, 0);
  let tnow = 0, hold = 0, spawn = 0, raf = 0, last = 0, running = false;
  const reduced = LTT.MOTION_MS === 0;
  const parts = [];

  function pathOf(A) {
    let s = "";
    for (let i = 0; i <= N; i += 4) s += (i ? "L" : "M") + X(i * DT).toFixed(1) + " " + Y(A.T[i]).toFixed(1);
    return s;
  }
  function configure() {
    S = simulate(h, d); G = simulate(h, 0);
    ghost.setAttribute("d", pathOf(G)); live.setAttribute("d", pathOf(S));
    band.setAttribute("y", Y(SP + h)); band.setAttribute("height", Y(SP - h) - Y(SP + h));
    delayT.textContent = d ? `지연 ${d}분` : "지연 없음";
    lgL.textContent = d ? `실제 (지연 ${d}분)` : "실제 (지연 0)";
    lgB.textContent = `밴드 ±${h}°C`;
    tnow = reduced ? T_END : 0; hold = 0;
    parts.splice(0).forEach((p) => p.el.remove());
    if (reduced) { for (let k = 0; k < 40; k++) advance(0.1); }
    draw();
  }

  const durs = () => [0.9, 0.4 + d / SCALE, 0.9, 0.9];
  function style(p) {
    const e = p.el;
    if (p.leg === 1 || p.leg === 2) {
      if (p.on) { e.setAttribute("fill", "var(--ltt-warn)"); e.setAttribute("stroke", "none"); e.setAttribute("r", p.leg === 2 ? 6.5 : 5.5); }
      else { e.setAttribute("fill", "var(--ltt-card)"); e.setAttribute("stroke", "var(--ltt-muted)"); e.setAttribute("stroke-width", 1.5); e.setAttribute("r", 4.5); }
    } else { e.setAttribute("fill", "var(--ltt-ink-2)"); e.setAttribute("stroke", "none"); e.setAttribute("r", 4); }
  }
  function advance(dt) {
    const i = Math.min(N, Math.floor(tnow / DT)), D = durs();
    spawn += dt;
    while (spawn >= 0.3) { spawn -= 0.3; const el = mk("circle", {}, pLayer); const p = { el, leg: 0, p: 0, on: 0 }; style(p); parts.push(p); }
    for (let k = parts.length - 1; k >= 0; k--) {
      const q = parts[k];
      q.p += dt / D[q.leg];
      while (q.p >= 1) {
        q.p -= 1; q.leg++;
        if (q.leg === 1) q.on = S.U[i];
        if (q.leg > 3) break;
        style(q);
      }
      if (q.leg > 3) { q.el.remove(); parts.splice(k, 1); continue; }
      const a = P[q.leg], b = P[q.leg + 1];
      q.el.setAttribute("cx", a[0] + (b[0] - a[0]) * q.p);
      q.el.setAttribute("cy", a[1] + (b[1] - a[1]) * q.p);
    }
  }
  function draw() {
    const i = Math.min(N, Math.floor(tnow / DT));
    clipRect.setAttribute("width", X(tnow) - L + 4);
    head.setAttribute("cx", X(tnow)); head.setAttribute("cy", Y(S.T[i]));
    nodes[1].setAttribute("fill", S.U[i] ? "var(--ltt-warn-soft)" : "var(--ltt-card)");
    nodes[2].setAttribute("fill", S.R[i] > 0.5 ? "var(--ltt-warn-soft)" : "var(--ltt-card)");
    nodes[2].setAttribute("stroke", S.R[i] > 0.5 ? "var(--ltt-warn)" : "var(--ltt-ink-2)");
    const ov = S.runMax[i];
    ovN.innerHTML = `+${ov.toFixed(1)}<small>°C</small>`;
    swN.innerHTML = `${S.cnt[i]}<small>회</small>`;
    if (ov > 0.05) {
      const x = X(S.runIdx[i] * DT), y1 = Y(SP + h), y2 = Y(SP + h + ov);
      brL.setAttribute("x1", x); brL.setAttribute("x2", x); brL.setAttribute("y1", y1); brL.setAttribute("y2", y2);
      brA.setAttribute("x1", x - 7); brA.setAttribute("x2", x + 7); brA.setAttribute("y1", y2); brA.setAttribute("y2", y2);
      brB.setAttribute("x1", x - 7); brB.setAttribute("x2", x + 7); brB.setAttribute("y1", y1); brB.setAttribute("y2", y1);
      brT.setAttribute("x", x + 12); brT.setAttribute("y", y2 - 6);
      br.removeAttribute("display"); brT.removeAttribute("display");
    } else { br.setAttribute("display", "none"); brT.setAttribute("display", "none"); }
  }
  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    if (tnow < T_END) tnow = Math.min(T_END, tnow + dt * SCALE);
    else { hold += dt; if (hold > 2.5) { tnow = 0; hold = 0; } }
    advance(dt); draw();
    raf = requestAnimationFrame(frame);
  }
  function start() { if (reduced || running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }

  LTT.sweep({
    params: {
      hy: { kind: "steps", stops: [0.5, 1, 2], value: 1, fmt: (v) => "±" + v + "°C" },
      dl: { kind: "steps", stops: [0, 2, 5, 8], value: 5, fmt: (v) => v + "분" }
    },
    render: ({ hy, dl }) => { h = hy; d = dl; configure(); }
  });
  configure();
  start();
  return { enter: start, leave: stop };
}

LTT.deck({
  title: "온도조절기 되먹임 루프와 오버슈트",
  theme: "lab",
  glossary: {
    "히스테리시스": "켜는 온도와 끄는 온도를 다르게 두어, 목표 둘레에서 잦게 켜고 끄는 것을 막는 간격",
    "오버슈트": "목표나 밴드를 지나쳐 넘어가는 양. 명령이 효과로 나타나기까지의 지연이 만든다"
  },
  scenes: [{
    type: "hook",
    kicker: "제어 · 되먹임",
    title: "히터를 꺼도 방은 더 달아올라, 온도가 밴드를 넘친다",
    en: "Thermostat feedback and overshoot",
    sub: "{{히스테리시스}} 밴드 폭과 난방 지연을 바꿔, {{오버슈트}}를 정하는 쪽이 어느 손잡이인지 본다. 점선은 지연이 0인 같은 방이다.",
    mount: mountScene,
    basis: "교육용 모델 가정: 외기 10°C, 방 열손실 0.025/분, 히터 0.5°C/분, 히터 시정수 1.2분. 모델로 계산한 예시",
    takeaway: "넘침의 크기는 난방 지연이, 켜고 끄는 횟수는 밴드 폭이 정한다.",
    recall: "밴드를 좁히면 넘침이 줄까, 켜고 끄는 횟수가 늘까?"
  }]
});
</script>
</body>
</html>
