<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-out과 p99 꼬리 지연</title>
<script type="application/json" id="ltt-meta">{"topic":"fan-out과 p99 꼬리 지연","audience":"백엔드 개발자","theme":"terminal","medium":"터미널·대시보드","decision":"한 요청이 부르는 백엔드 수","domain":"백엔드","pattern":["mount"],"mode":"카탈로그용: 장면 하나짜리. 분포 구조를 \"쪼개지고 합쳐짐\" 움직임과 작은 여러 칸 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.fo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start;width:100%}
.fo-svg,.fo-chart{width:100%;height:auto;display:block}
.fo-svg text,.fo-chart text{font-family:var(--ltt-mono)}
.fo-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.fo-l{min-width:0}
@media (max-width:820px){.fo{grid-template-columns:minmax(0,1fr)}}
</style>
<style>/* 장면 하나짜리라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const e = document.createElementNS(SVG, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const cl = (x) => Math.max(0, Math.min(1, x));

// ── 모델: 호출 하나의 지연 = 98% 빠른 경로 + 2% 느린 경로 (둘 다 로그정규, 가정한 계수)
const PS = 0.02, MU_F = Math.log(12), SG_F = 0.3, MU_S = Math.log(90), SG_S = 0.5;
const Phi = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
// 호출 하나가 t보다 느릴 확률
const S1 = (t) => (1 - PS) * Phi(-(Math.log(t) - MU_F) / SG_F) + PS * Phi(-(Math.log(t) - MU_S) / SG_S);
// 호출 n개 중 하나라도 t보다 느릴 확률 (= 요청이 t보다 느릴 확률)
const SN = (t, n) => -Math.expm1(n * Math.log1p(-S1(t)));
const p99 = (n) => { let lo = 0, hi = Math.log(5000); for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (SN(Math.exp(m), n) > 0.01) lo = m; else hi = m; } return Math.exp((lo + hi) / 2); };
const BP = p99(1);                              // 호출 하나의 p99
const anyHit = (n) => 1 - Math.pow(1 - S1(BP), n); // 호출 상위 1% 꼬리를 하나라도 만날 확률
const STOPS = [1, 2, 5, 10, 20, 50, 100], SLO = 250;
const BEST = Math.max(...STOPS.filter((n) => p99(n) <= SLO));

// 한 번의 요청: 시드 고정 난수로 호출 100개의 지연을 뽑는다 (앞 N개만 쓴다)
const roundCache = {};
function roundLats(r) {
  if (roundCache[r]) return roundCache[r];
  let seed = (r * 104729 + 17) % 2147483647; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 5; i++) rnd();
  const a = []; for (let i = 0; i < 100; i++) {
    const slow = rnd() < PS, z = Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
    a.push(Math.max(6, Math.min(590, Math.exp(slow ? MU_S + SG_S * z : MU_F + SG_F * z)))); }
  return (roundCache[r] = a);
}

const T0 = 5, TMAX = 600, fr = (t) => cl(Math.log(t / T0) / Math.log(TMAX / T0));
const CYC = 9000;
// 한 주기: 쪼개짐(0–12%) → 칸이 차오름(–62%) → 가장 느린 칸이 응답을 정함(–72%) → 머문 뒤(–90%) 다시 합쳐짐
const stateAt = (u) => u < .12 ? { s: ease(u / .12), p: 0, m: 0 } : u < .62 ? { s: 1, p: (u - .12) / .5, m: 0 }
  : u < .72 ? { s: 1, p: 1, m: ease((u - .62) / .1) } : u < .9 ? { s: 1, p: 1, m: 1 } : { s: 1 - ease((u - .9) / .1), p: 1, m: 1 };

function cellsView(host) {
  const W = 600, H = 440, GY = 84, GH = 290, CX = 300, CY = 50;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "fo-svg", "data-annotate": "" }, host);
  const tile = mk("rect", { x: 130, y: 34, width: 340, height: 32, rx: 4, style: "fill:var(--ltt-card);stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
  const tt = mk("text", { x: CX, y: 55, "text-anchor": "middle", style: "font-size:15px;font-weight:700;fill:var(--ltt-ink)" }, s);
  const clock = mk("text", { x: W, y: 20, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s);
  const g = mk("g", {}, s);
  const cnt = mk("text", { x: 0, y: 396, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s);
  const note = mk("text", { x: W, y: 396, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s); note.textContent = "칸 폭 = 응답 시간 (로그 눈금)";
  [[0, "var(--ltt-good)", `호출 p99(${Math.round(BP)}ms) 이내`], [200, "var(--ltt-bad)", "초과 (호출 상위 1%)"]].forEach(([x, c, label]) => {
    mk("rect", { x, y: 412, width: 12, height: 12, style: `fill:${c}` }, s);
    const t = mk("text", { x: x + 20, y: 424, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); t.textContent = label; });
  mk("rect", { x: 400, y: 412, width: 12, height: 12, style: "fill:none;stroke:var(--ltt-ink);stroke-width:2.5" }, s);
  const lg = mk("text", { x: 420, y: 424, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); lg.textContent = "가장 느린 1곳";
  let cells = [], N = 1;
  function set(n) {
    N = n; g.innerHTML = ""; cells = [];
    const c = n <= 5 ? n : n <= 20 ? 5 : 10, r = Math.ceil(n / c), gap = n <= 20 ? 8 : 5;
    const cw = Math.min(150, (W - (c - 1) * gap) / c), ch = Math.min(56, (GH - (r - 1) * gap) / r), x0 = (W - (c * cw + (c - 1) * gap)) / 2;
    for (let i = 0; i < n; i++) {
      const x = x0 + (i % c) * (cw + gap), y = GY + Math.floor(i / c) * (ch + gap), grp = mk("g", {}, g);
      mk("rect", { x, y, width: cw, height: ch, rx: 2, style: "fill:var(--ltt-card-2)" }, grp);
      const fill = mk("rect", { x, y, height: ch, rx: 2, width: 0 }, grp);
      const ol = mk("rect", { x: x - 2, y: y - 2, width: cw + 4, height: ch + 4, rx: 3, style: "fill:none;stroke:var(--ltt-ink);stroke-width:2.5;opacity:0" }, grp);
      cells.push({ grp, fill, ol, dx: CX - (x + cw / 2), dy: CY - (y + ch / 2), cw });
    }
  }
  function draw(st, round) {
    const lats = roundLats(round).slice(0, N), mx = Math.max(...lats), slowest = lats.indexOf(mx);
    const T = T0 * Math.pow(mx / T0, st.p); let done = 0;
    cells.forEach((c, i) => {
      const L = lats[i], d = T >= L; if (d) done++;
      c.grp.setAttribute("transform", `translate(${(1 - st.s) * c.dx},${(1 - st.s) * c.dy})`);
      c.grp.style.opacity = st.s * (i === slowest ? 1 : 1 - .72 * st.m);
      c.fill.setAttribute("width", c.cw * fr(Math.min(T, L)));
      c.fill.style.fill = d ? (L > BP ? "var(--ltt-bad)" : "var(--ltt-good)") : "var(--ltt-accent)";
      c.ol.style.opacity = i === slowest ? st.m : 0;
    });
    tt.textContent = st.m > .5 ? `응답 ${Math.round(mx)}ms = 가장 느린 1곳` : `요청 1건 → 백엔드 ${N}곳`;
    tile.style.fill = st.m > .5 ? "var(--ltt-accent-soft)" : "var(--ltt-card)";
    clock.textContent = st.s < 1 ? "" : `경과 ${Math.round(T)}ms (로그 시계)`;
    cnt.textContent = `끝난 호출 ${st.s < 1 && st.m ? N : done} / ${N}`;
    return { mx };
  }
  return { set, draw };
}

function survivalChart(host) {
  const W = 520, H = 330, L = 64, R = 500, T = 56, B = 250;
  const xs = d3.scaleLog([8, 800], [L, R]), ys = d3.scaleLog([1e-4, 1], [B, T]);
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "fo-chart", "data-annotate": "" }, host);
  [[1, "100%"], [.1, "10%"], [.01, "1%"], [.001, "0.1%"], [1e-4, "0.01%"]].forEach(([v, lb]) => {
    mk("line", { x1: L, x2: R, y1: ys(v), y2: ys(v), style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    const t = mk("text", { x: L - 8, y: ys(v) + 5, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s); t.textContent = lb; });
  [10, 30, 100, 300].forEach((v) => { mk("line", { x1: xs(v), x2: xs(v), y1: T, y2: B, style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    const t = mk("text", { x: xs(v), y: B + 22, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-muted)" }, s); t.textContent = v + "ms"; });
  mk("line", { x1: L, x2: R, y1: B, y2: B, style: "stroke:var(--ltt-ink-2);stroke-width:1.5" }, s);
  mk("line", { x1: L, x2: R, y1: ys(.01), y2: ys(.01), style: "stroke:var(--ltt-ink-2);stroke-width:1.5;stroke-dasharray:6 5" }, s);
  const yl = mk("text", { x: L, y: 18, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); yl.textContent = "그 시간보다 느린 비율";
  const xl = mk("text", { x: R, y: B + 46, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); xl.textContent = "응답 시간 (로그)";
  const gl = mk("text", { x: L + 8, y: ys(.01) - 8, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); gl.textContent = "1% 경계 = p99";
  const grid = d3.range(0, 241).map((i) => 8 * Math.pow(100, i / 240));
  const path = (f) => { const pts = []; for (const t of grid) { const v = f(t); pts.push(xs(t).toFixed(1) + "," + ys(Math.max(v, 1e-4)).toFixed(1)); if (v < 1e-4) break; } return "M" + pts.join("L"); };
  const c1 = mk("path", { d: path(S1), style: "fill:none;stroke:var(--ltt-muted);stroke-width:2.5;stroke-dasharray:5 5" }, s);
  const cN = mk("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:3.5" }, s);
  const vb = mk("line", { x1: xs(BP), x2: xs(BP), y1: T - 26, y2: B, style: "stroke:var(--ltt-muted);stroke-width:2;stroke-dasharray:4 4" }, s);
  const vr = mk("line", { y1: T - 8, y2: B, style: "stroke:var(--ltt-accent);stroke-width:2.5" }, s);
  const lb = mk("text", { x: xs(BP) - 6, y: T - 30, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s); lb.textContent = `호출 하나의 p99 ${Math.round(BP)}ms`;
  const lr = mk("text", { y: T - 12, style: "font-size:15px;font-weight:700;fill:var(--ltt-accent)" }, s);
  const dot = mk("circle", { r: 7, style: "fill:var(--ltt-ink);stroke:var(--ltt-bg);stroke-width:2;opacity:0" }, s);
  const dl = mk("text", { style: "font-size:14px;font-weight:700;fill:var(--ltt-ink);opacity:0" }, s); dl.textContent = "이번 요청";
  mk("line", { x1: L, x2: L + 30, y1: B + 70, y2: B + 70, style: "stroke:var(--ltt-muted);stroke-width:2.5;stroke-dasharray:5 5" }, s);
  const k1 = mk("text", { x: L + 38, y: B + 75, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); k1.textContent = "호출 1건";
  mk("line", { x1: L + 150, x2: L + 180, y1: B + 70, y2: B + 70, style: "stroke:var(--ltt-accent);stroke-width:3.5" }, s);
  const k2 = mk("text", { x: L + 188, y: B + 75, style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); k2.textContent = "요청 (호출 N개 중 가장 느린 것)";
  let N = 1;
  return { set(n) { N = n; const P = p99(n), x = xs(P);
      cN.setAttribute("d", path((t) => SN(t, n))); vr.setAttribute("x1", x); vr.setAttribute("x2", x);
      lr.setAttribute("x", x + (x > R - 170 ? -8 : 8)); lr.setAttribute("text-anchor", x > R - 170 ? "end" : "start"); lr.textContent = `요청 p99 ${Math.round(P)}ms`; },
    dot(mx, o) { const x = xs(mx), y = ys(Math.max(SN(mx, N), 1e-4));
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.style.opacity = o;
      dl.setAttribute("x", x > R - 100 ? x - 12 : x + 12); dl.setAttribute("y", y - 10); dl.setAttribute("text-anchor", x > R - 100 ? "end" : "start"); dl.style.opacity = o; } };
}

function mount(body) {
  body.innerHTML = `<div class="fo"><div class="fo-l" id="fo-cells"></div><div class="fo-r">
    <div class="ltt-stat"><span class="ltt-hero" id="p99"></span> <small>요청 p99 · 호출 p99의 <b id="ratio"></b></small></div>
    <div class="ltt-stat"><b id="any"></b><small> 요청이 호출 상위 1% 꼬리를 하나라도 만나는 비율</small></div>
    <div id="fo-chart"></div>
    <div class="ltt-param">한 요청이 부르는 백엔드 <b id="n-v"></b><div id="n"></div></div>
    <div id="g"></div>
    <span class="ltt-tag muted">모델로 계산한 예시</span></div></div>`;
  const cv = cellsView(body.querySelector("#fo-cells")), ch = survivalChart(body.querySelector("#fo-chart"));
  let N = 10, t0 = 0, raf = 0, running = false;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const paint = (st, round) => { const r = cv.draw(st, round); ch.dot(r.mx, st.m * st.s); };
  const still = () => paint({ s: 1, p: 1, m: 1 }, 3);
  const tick = () => { const e = Date.now() - t0; paint(stateAt((e % CYC) / CYC), Math.floor(e / CYC) + 3); raf = setTimeout(tick, 33); };
  LTT.sweep({ params: { n: { kind: "steps", stops: STOPS, value: 10, fmt: (v) => v + "곳" } },
    render: ({ n }) => { N = n; cv.set(n); ch.set(n);
      const P = p99(n); body.querySelector("#p99").textContent = Math.round(P) + "ms";
      body.querySelector("#ratio").textContent = (P / BP).toFixed(1) + "배";
      body.querySelector("#any").textContent = Math.round(anyHit(n) * 100) + "%";
      if (!running) still(); },
    goal: { el: "g", text: `요청 p99를 ${SLO}ms 안에 두면서 가장 많이 부를 수 있는 백엔드 수를 고른다`, check: ({ n }) => n === BEST } });
  return { enter() { clearTimeout(raf); if (reduced) { still(); return; } running = true; t0 = Date.now(); tick(); },
    leave() { clearTimeout(raf); running = false; still(); } };
}

LTT.deck({
  title: "fan-out과 p99 꼬리 지연", theme: "terminal",
  glossary: {
    "p99": "응답을 빠른 순으로 줄 세웠을 때 99번째 값. 100건 중 1건은 이보다 느리다",
    "fan-out": "요청 하나가 처리 중에 여러 백엔드를 동시에 부르는 구조"
  },
  scenes: [{
    title: "호출 하나는 99%가 빨라도, 백엔드 100곳을 부르는 요청은 63%가 느린 호출을 만난다",
    sub: "요청 하나가 백엔드 N곳을 동시에 부르고 가장 느린 응답을 기다린다. 한 칸이 {{p99}} 안이어도 {{fan-out}}이 커질수록 요청의 응답은 꼬리 쪽 칸이 정한다.",
    layout: "full",
    basis: "호출 지연: 98%는 빠른 경로(로그정규, 중앙값 12ms, σ=0.3), 2%는 느린 경로(중앙값 90ms, σ=0.5). 이 혼합 계수는 가정이며 실측이 아니다. 호출은 서로 독립이라 보고, 요청 지연 = N개의 최댓값이므로 P(요청 ≤ t) = F(t)^N. 예: N=100이면 1−0.99^100 ≈ 63%. 모델로 계산한 예시.",
    mount
  }]
});
LTT.expect("호출 하나의 p99 (느린 경로의 중앙값 90ms)", BP, 90, { tol: 0.5 });
LTT.expect("N=20 요청 p99", p99(20), 239.5, { tol: 3 });
LTT.expect("N=100 요청 p99", p99(100), 326, { tol: 3 });
LTT.expect("N=100 꼬리를 하나라도 만날 확률 1−0.99^100", anyHit(100), 0.634, { tol: 0.001 });
</script>
</body>
</html>
