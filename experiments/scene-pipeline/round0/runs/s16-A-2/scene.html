<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남향 vs 북향 방의 하루 채광</title>
<script type="application/json" id="ltt-meta">{"topic": "남향 vs 북향 방의 하루 채광", "audience": "집을 고르는 비전문가", "theme": "sketch", "medium": "화이트보드 단면 스케치", "decision": "방의 향 선택"}</script>
<style>
  .lt-wrap { position: relative; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lt-grid { position: relative; display: grid; grid-template-columns: minmax(120px, 160px) repeat(4, minmax(0, 1fr)); gap: 10px 12px; align-items: stretch; }
  .lt-corner { display: flex; align-items: flex-end; }
  .lt-rp { font: inherit; font-size: .9rem; color: var(--ltt-ink-2); background: var(--ltt-card); border: 1.5px solid var(--ltt-line-2); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .lt-rp:hover { border-color: var(--ltt-accent); color: var(--ltt-ink); }
  .lt-th { font-size: 1.05rem; font-weight: 700; color: var(--ltt-muted); text-align: center; padding: 4px 0; cursor: pointer; transition: color .3s; }
  .lt-th.act { color: var(--ltt-accent); }
  .lt-rowhead { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; padding-right: 4px; }
  .lt-rowhead h3 { margin: 0; font-size: 1.25rem; line-height: 1.2; display: flex; align-items: center; gap: 8px; }
  .lt-rowhead .v { font-size: .95rem; color: var(--ltt-ink); line-height: 1.35; }
  .lt-rowhead .f { font-size: .85rem; color: var(--ltt-muted); line-height: 1.35; }
  .lt-cell { min-width: 0; background: var(--ltt-card); border: 1.5px solid var(--ltt-line); border-radius: 10px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: opacity .4s, border-color .4s; }
  .lt-cell svg { display: block; width: 100%; height: auto; }
  .lt-cell .tl { display: none; font-size: .9rem; font-weight: 700; color: var(--ltt-ink-2); }
  .lt-grid.sw .lt-cell { opacity: .45; }
  .lt-grid.sw .lt-cell.act { opacity: 1; }
  .lt-cell .lt, .lt-cell .sun { transition: opacity .8s ease; }
  .lt-cell .lt { opacity: 0; }
  .lt-cell.on .lt { opacity: 1; }
  .lt-cell .sun { opacity: .3; }
  .lt-cell.on .sun, .lt-cell.act .sun { opacity: 1; }
  .lt-cell.act .sun { animation: lt-pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes lt-pulse { 50% { transform: scale(1.18); } }
  .lt-mt { display: flex; align-items: center; gap: 8px; }
  .lt-bar { position: relative; flex: 1; height: 12px; border: 1.5px solid var(--ltt-line-2); border-radius: 6px; overflow: hidden; background: var(--ltt-card-2); }
  .lt-bar i { display: block; height: 100%; width: 0; transition: width .9s ease; }
  .lt-cell.on .lt-bar i { width: calc(var(--v) * 1%); }
  .lt-row0 .lt-bar i { background: var(--ltt-c1); }
  .lt-row1 .lt-bar i { background: var(--ltt-c2); }
  .lt-mt b { min-width: 2.2em; text-align: right; font-size: 1.05rem; opacity: 0; transition: opacity .6s; font-variant-numeric: tabular-nums; }
  .lt-cell.on .lt-mt b { opacity: 1; }
  .lt-band { position: absolute; border: 2.5px solid var(--ltt-accent); border-radius: 12px; pointer-events: none; opacity: 0; transition: left .6s ease, width .6s ease, opacity .3s; }
  .lt-cap { min-height: 3.2em; font-size: 1.1rem; line-height: 1.5; color: var(--ltt-ink); padding: 8px 12px; border-left: 4px solid var(--ltt-accent); background: var(--ltt-card); border-radius: 0 8px 8px 0; }
  .lt-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: .88rem; color: var(--ltt-muted); }
  .lt-key span { display: inline-flex; align-items: center; gap: 6px; }
  .lt-key svg { width: 28px; height: 16px; }
  @media (max-width: 860px) {
    .lt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lt-corner, .lt-th, .lt-band { display: none; }
    .lt-rowhead { grid-column: 1 / -1; }
    .lt-cell .tl { display: block; }
    .lt-cell.act { border-color: var(--ltt-accent); }
  }
</style>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
</head>
<body>
<script>
// 겨울 맑은 날, 한국 위도 가정. th는 햇빛이 내려오는 기울기(dy/dx), 밝기는 0~100 비교용 값.
const COLS = [
  { t: "오전 9시", th: 0.10, south: 70, north: 28 },
  { t: "낮 12시", th: 0.47, south: 100, north: 35 },
  { t: "오후 3시", th: 0.23, south: 75, north: 30 },
  { t: "오후 5시", th: null, south: 12, north: 8 },
];
const CAPS = [
  "오전 9시, 남향 방은 낮은 해가 창으로 들어와 안쪽 벽을 비춘다. 북향 방은 해가 벽 뒤에 있어 하늘빛만 들어온다.",
  "낮 12시, 남향 방은 햇빛이 바닥 깊이 닿아 하루 중 가장 밝다. 북향 방은 아침과 거의 같다.",
  "오후 3시, 해가 기울며 남향 방의 빛이 바닥 안쪽으로 물러난다. 북향 방은 여전히 고르다.",
  "오후 5시, 해가 지면 두 방이 함께 어두워진다. 두 방의 차이는 낮 동안의 밝기와 그 오르내림이다.",
  "남향 방은 낮에 밝고 오르내림이 크다. 북향 방은 덜 밝지만 하루 내내 거의 같다. 낮에 해를 쓸 방인지, 고른 빛이 필요한 방인지로 고른다.",
];
const NS = "http://www.w3.org/2000/svg";

function arrow(x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 7;
  const p = (s) => `${x2 - h * Math.cos(a + s)},${y2 - h * Math.sin(a + s)}`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-dasharray="5 4"/><polyline points="${p(0.5)} ${x2},${y2} ${p(-0.5)}" fill="none"/>`;
}

function room(dir, c, id) {
  const south = dir === "south", b = south ? c.south : c.north, th = c.th;
  const wx = south ? 180 : 40;
  const sunY = th == null ? 128 : 90 - 56 * th;
  const edges = [70, 90, 110];
  let beam = "", rays = "", sky = "";
  if (south && th != null) {
    const L = 300;
    beam = `<g class="lt" clip-path="url(#cp${id})">
      <polygon points="180,70 ${180 - L},${70 + L * th} ${180 - L},${110 + L * th} 180,110" fill="var(--ltt-warn)" fill-opacity=".42"/>
      <line x1="180" y1="70" x2="${180 - L}" y2="${70 + L * th}" stroke="var(--ltt-warn)" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="180" y1="110" x2="${180 - L}" y2="${110 + L * th}" stroke="var(--ltt-warn)" stroke-width="2" stroke-dasharray="6 4"/></g>`;
    rays = `<g class="lt" stroke="var(--ltt-warn)" stroke-width="2.5" stroke-linecap="round">${edges.map((y) =>
      `<line x1="${224}" y1="${y - 44 * th}" x2="${183}" y2="${y - 3 * th}"/>`).join("")}</g>`;
  }
  if (!south && th != null) {
    rays = `<g class="lt" stroke="var(--ltt-warn)" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".6">${edges.map((y) =>
      `<line x1="224" y1="${y - 44 * th}" x2="190" y2="${y - 10 * th}"/>`).join("")}</g>
      <g class="lt" stroke="var(--ltt-ink-2)" stroke-width="2.5" stroke-linecap="round"><line x1="186" y1="${74}" x2="186" y2="${106}"/></g>`;
  }
  if (!south) {
    const so = Math.min(1, 0.25 + b / 45);
    sky = `<g class="lt" stroke="var(--ltt-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="${so}">
      ${arrow(6, 50, 35, 76)}${arrow(5, 90, 35, 90)}${arrow(6, 124, 35, 106)}</g>`;
  }
  const walls = south
    ? `M40 140V34H180V70M180 110V140`
    : `M180 140V34H40V70M40 110V140`;
  const sunTicks = Array.from({ length: 8 }, (_, i) => {
    const a = i * Math.PI / 4, r1 = 12, r2 = 16;
    return `<line x1="${236 + r1 * Math.cos(a)}" y1="${sunY + r1 * Math.sin(a)}" x2="${236 + r2 * Math.cos(a)}" y2="${sunY + r2 * Math.sin(a)}"/>`;
  }).join("");
  return `<svg viewBox="0 0 260 160" role="img" aria-label="${south ? "남향" : "북향"} 방 단면, ${c.t}">
    <clipPath id="cp${id}"><rect x="42" y="36" width="136" height="102"/></clipPath>
    <rect x="42" y="36" width="136" height="102" fill="var(--ltt-card-2)"/>
    <rect class="lt" x="42" y="36" width="136" height="102" fill="var(--ltt-warn-soft)" fill-opacity="${(b / 100 * 0.85).toFixed(2)}"/>
    ${beam}
    <line x1="236" y1="46" x2="236" y2="138" stroke="var(--ltt-line-2)" stroke-width="1.5" stroke-dasharray="3 5"/>
    <g filter="url(#lt-wob)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="140" x2="260" y2="140" stroke="var(--ltt-ink-2)" stroke-width="2.5"/>
      <path d="${walls}" stroke="var(--ltt-ink)" stroke-width="4"/>
      <line x1="${wx}" y1="70" x2="${wx}" y2="110" stroke="var(--ltt-c${south ? 1 : 2})" stroke-width="3" stroke-dasharray="2 4"/>
      <path d="M92 137V122H124V137M92 122V120H124V122" stroke="var(--ltt-ink-2)" stroke-width="2.5"/>
    </g>
    ${rays}${sky}
    <g class="sun" fill="var(--ltt-warn)" stroke="var(--ltt-ink)" stroke-width="2" stroke-linecap="round">
      <circle cx="236" cy="${sunY}" r="9"/><g>${sunTicks}</g></g>
  </svg>`;
}

LTT.deck({
  title: "남향 vs 북향 방의 하루 채광",
  theme: "sketch",
  glossary: {},
  scenes: [{
    kicker: "건축 · 채광",
    title: "남향 방은 낮에 해가 깊이 들고, 북향 방은 하루 내내 고르게 은은하다",
    en: "South vs north rooms across one day",
    sub: "같은 시각의 두 방을 위아래로 놓고, 시간 띠가 네 시각을 차례로 훑는다.",
    mount(body) {
      body.innerHTML = `
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lt-wob"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>
      <div class="lt-wrap">
        <div class="lt-grid" id="lt-grid">
          <div class="lt-corner"><button class="lt-rp" type="button">처음부터 다시</button></div>
          ${COLS.map((c, i) => `<div class="lt-th" data-i="${i}">${c.t}</div>`).join("")}
          ${["south", "north"].map((d, r) => `
            <div class="lt-rowhead">
              <h3>${LTT.mark(r ? "ring" : "square", { size: 16, color: `var(--ltt-c${r + 1})`, inline: true })}${r ? "북향 방" : "남향 방"}</h3>
              <div class="v">${r ? "하늘빛만 들어온다" : "햇빛이 방 깊이 든다"}</div>
              <div class="f">${r ? "그림, 모니터 작업, 여름 더위와 눈부심이 싫을 때" : "낮에 집에 있고 겨울 난방비를 아끼고 싶을 때"}</div>
            </div>
            ${COLS.map((c, i) => `<div class="lt-cell lt-row${r}" data-i="${i}">
              <div class="tl">${c.t}</div>
              ${room(d, c, `${r}${i}`)}
              <div class="lt-mt"><span class="lt-bar"><i style="--v:${r ? c.north : c.south}"></i></span><b>${r ? c.north : c.south}</b></div>
            </div>`).join("")}`).join("")}
          <div class="lt-band"></div>
        </div>
        <div class="lt-cap" aria-live="polite"></div>
        <div class="lt-key">
          <span><svg viewBox="0 0 28 16"><circle cx="14" cy="8" r="5" fill="var(--ltt-warn)" stroke="var(--ltt-ink)" stroke-width="1.5"/></svg>해</span>
          <span><svg viewBox="0 0 28 16"><rect x="2" y="2" width="24" height="12" fill="var(--ltt-warn)" fill-opacity=".42" stroke="var(--ltt-warn)" stroke-dasharray="4 3"/></svg>햇빛이 닿은 면</span>
          <span><svg viewBox="0 0 28 16"><path d="M2 8H24M19 4L24 8L19 12" fill="none" stroke="var(--ltt-muted)" stroke-width="2" stroke-dasharray="4 3"/></svg>하늘빛(간접)</span>
          <span>막대는 방 안 밝기, 단면은 왼쪽이 북쪽 오른쪽이 남쪽</span>
          <span class="ltt-tag muted">모델로 계산한 예시</span>
        </div>
      </div>`;
      const grid = body.querySelector("#lt-grid"), band = body.querySelector(".lt-band"), cap = body.querySelector(".lt-cap");
      const cells = [...body.querySelectorAll(".lt-cell")], ths = [...body.querySelectorAll(".lt-th")];
      let timers = [], cur = 4;

      function place() {
        if (cur > 3 || !ths[cur] || !ths[cur].offsetWidth) { band.style.opacity = 0; return; }
        const t = ths[cur];
        band.style.left = t.offsetLeft - 4 + "px";
        band.style.width = t.offsetWidth + 8 + "px";
        band.style.top = t.offsetTop - 2 + "px";
        band.style.height = grid.offsetHeight - t.offsetTop + 4 + "px";
        band.style.opacity = 1;
      }
      function set(k) {
        cur = k;
        grid.classList.toggle("sw", k >= 0 && k < 4);
        cells.forEach((c) => {
          const i = +c.dataset.i;
          c.classList.toggle("on", k === 4 || (k >= 0 && i <= k));
          c.classList.toggle("act", k >= 0 && k < 4 && i === k);
        });
        ths.forEach((t, i) => t.classList.toggle("act", i === k));
        cap.textContent = k >= 0 ? CAPS[k] : CAPS[0];
        place();
      }
      function stop() { timers.forEach(clearTimeout); timers = []; }
      function after(ms, fn) { timers.push(setTimeout(fn, ms)); }
      function play() {
        stop();
        set(-1);
        const step = 2600;
        for (let k = 0; k < 4; k++) after(600 + k * step, () => set(k));
        after(600 + 4 * step, () => set(4));
        after(600 + 4 * step + 5000, play);
      }
      function jump(i) { stop(); set(cur === i ? 4 : i); }

      body.querySelector(".lt-rp").addEventListener("click", () => (LTT.MOTION_MS ? play() : set(4)));
      ths.forEach((t) => t.addEventListener("click", () => jump(+t.dataset.i)));
      cells.forEach((c) => c.addEventListener("click", () => jump(+c.dataset.i)));
      if (window.ResizeObserver) new ResizeObserver(place).observe(grid);
      set(4);
      return {
        enter() { if (LTT.MOTION_MS) play(); else set(4); },
        leave() { stop(); set(4); },
      };
    },
    takeaway: "낮에 해를 쓰는 방은 남향, 하루 내내 고른 빛이 필요한 방은 북향을 고른다.",
    recall: "하루 종일 모니터 앞에서 일하는 방이라면 어느 향이 맞을까?",
    basis: "겨울 맑은 날, 한국 위도를 가정한 단면 스케치다. 밝기 값은 비교용 모델 예시이고 실측이 아니다. 여름엔 해가 높아 처마와 발코니가 남향 직사광을 줄인다.",
  }],
});
</script>
</body>
</html>
