<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node.js 이벤트 루프 한 바퀴</title>
<script type="application/json" id="ltt-meta">{"topic":"Node.js 이벤트 루프 단계","audience":"Node.js 백엔드 입문자","theme":"terminal","medium":"터미널 로그","decision":"setTimeout·setImmediate·nextTick 중 무엇으로 미룰지"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.ev-root { min-width: 0; }
.ev-wrap { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: center; min-width: 0; }
.ev-wrap svg { display: block; width: 100%; height: auto; max-width: 100%; }
.ev-log { margin: 0; min-width: 0; padding: 14px 16px; border: 1px solid var(--ltt-line); border-radius: 10px; background: var(--ltt-card-2); color: var(--ltt-ink); font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.ev-log .dim { color: var(--ltt-muted); }
.ev-log .out { opacity: 0.18; }
.ev-log .out.on { opacity: 1; color: var(--ltt-accent); }
.ev-cap { margin: 12px 0 0; min-height: 1.6em; color: var(--ltt-ink); font-size: 14px; }
@media (max-width: 820px) { .ev-wrap { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<script>
// 이벤트 루프의 다섯 단계. 각 점은 고리 위 같은 자리에 둔다.
const RING = ["timers", "pending", "poll", "check", "close"];
const PHASE = {
  timers: ["timers", "기한 지난 setTimeout"],
  pending: ["pending", "밀린 I/O 콜백"],
  poll: ["poll", "I/O 받고 기다림"],
  check: ["check", "setImmediate"],
  close: ["close", "close 콜백"],
};
const ringAt = (i) => {
  const a = ((-90 + i * 72) * Math.PI) / 180;
  return [+(380 + 190 * Math.cos(a)).toFixed(1), +(240 + 190 * Math.sin(a)).toFixed(1)];
};

// 한 바퀴의 단계. ids는 그 단계에서 밝혀 둘 노드·엣지, go는 점이 옮겨 가는 길이다.
const STEPS = [
  { cap: "① 메인 스크립트가 끝나면 nextTick 큐를 먼저 비우고, 그다음 루프에 들어간다", ids: ["hub", "hub>timers", "timers"], go: [["hub", "timers"]] },
  { cap: "② timers: 기한이 지난 setTimeout 콜백을 실행한다", ids: ["st", "st>timers", "timers>pending", "pending"], go: [["timers", "pending"]] },
  { cap: "③ pending과 poll: 밀린 I/O 콜백을 처리한다. 할 일이 없으면 기다리되, setImmediate가 있으면 기다리지 않는다", ids: ["pending>poll", "poll"], go: [["pending", "poll"]] },
  { cap: "④ check: setImmediate 콜백을 실행한다", ids: ["si", "si>check", "poll>check", "check"], go: [["poll", "check"]] },
  { cap: "⑤ close를 지나 timers로 돌아오면 한 바퀴가 끝난다. nextTick을 재귀로 걸면 바퀴가 끝나지 않는다", ids: ["check>close", "close", "close>timers"], go: [["check", "close"], ["close", "timers"]] },
];

const show = (f, i, move) => {
  f.dg.highlight(STEPS.slice(0, i + 1).flatMap((s) => s.ids));
  f.pre.querySelectorAll(".out").forEach((o) => o.classList.toggle("on", +o.dataset.s <= i + 1));
  f.cap.textContent = STEPS[i].cap;
  if (move) {
    STEPS[i].go.reduce(
      (p, [a, b]) => p.then(() => f.dg.send(a, b, { count: 1, r: 6, color: "var(--ltt-accent)", ms: 600 })),
      Promise.resolve(),
    );
  }
};

const figure = (el) => {
  const root = el.appendChild(document.createElement("div"));
  root.className = "ev-root";
  const wrap = root.appendChild(document.createElement("div"));
  wrap.className = "ev-wrap";
  const svg = wrap.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "svg"));

  const [sx] = ringAt(3);
  const nodes = RING.map((id, i) => {
    const [x, y] = ringAt(i);
    return { id, x, y, w: 160, h: 56, l: PHASE[id][0], s: PHASE[id][1] };
  });
  nodes.push(
    { id: "hub", x: 380, y: 240, w: 170, h: 60, l: "nextTick · Promise", s: "단계 사이마다 비움" },
    { id: "st", x: 120, y: 50, w: 160, h: 56, l: "setTimeout(f, 0)", s: "다음 바퀴 timers" },
    { id: "si", x: sx, y: 490, w: 160, h: 56, l: "setImmediate(f)", s: "이번 바퀴 check" },
  );
  const edges = RING.map((id, i) => ({ f: id, t: RING[(i + 1) % RING.length], shape: "curve" }));
  edges.push({ f: "st", t: "timers", dash: true }, { f: "si", t: "check", dash: true });
  RING.forEach((id) => edges.push({ f: "hub", t: id, dash: true, k: "muted" }));
  const dg = LTT.diagram(svg, { width: 760, height: 540, node: [160, 56], nodes, edges });

  const pre = wrap.appendChild(document.createElement("pre"));
  pre.className = "ltt-mono ev-log";
  pre.innerHTML = [
    '<span class="dim">$ cat main.js</span>',
    "setTimeout(console.log, 0, 'timeout')",
    "setImmediate(console.log, 'immediate')",
    "process.nextTick(console.log, 'nextTick')",
    '<span class="dim">$ node main.js</span>',
    '<span class="out" data-s="1">nextTick</span>',
    '<span class="out" data-s="2">timeout</span>',
    '<span class="out" data-s="4">immediate</span>',
  ].join("\n");

  const cap = root.appendChild(document.createElement("p"));
  cap.className = "ev-cap";
  cap.setAttribute("aria-live", "polite");
  const f = { dg, pre, cap };

  // 모션이 꺼진 환경에서는 한 바퀴가 다 그려진 최종 상태를 보인다.
  if (LTT.MOTION_MS === 0) {
    show(f, STEPS.length - 1, false);
    return { el: root, dg, pre };
  }

  // 점이 고리를 돌며 지난 길을 남긴다. 한 바퀴가 끝나면 길을 지우고 다시 돈다. 화면을 떠나면 멈춘다.
  let i = 0;
  const tick = () => {
    if (!root.isConnected) return;
    show(f, i, true);
    i = (i + 1) % STEPS.length;
    setTimeout(tick, 1800);
  };
  setTimeout(tick, 300);
  return { el: root, dg, pre };
};

const scene = {
  type: "overview",
  title: "setTimeout과 setImmediate는 같은 0이어도 다른 단계에서 돈다",
  en: "Node.js event loop phases",
  kicker: "런타임 · 이벤트 루프",
  sub: "{{이벤트 루프}}는 다섯 단계를 한 바퀴씩 돌고, 단계 사이마다 {{마이크로태스크}}를 먼저 비운다",
  figure,
  caption: "점이 한 바퀴 도는 동안 터미널에 찍히는 순서가 곧 실행 순서다.",
  label: "Node.js 이벤트 루프 한 바퀴",
  takeaway: "미룰 때는 '언제'로 고른다. 지금 호출을 끝낸 직후면 nextTick, I/O 콜백 안에서 바로 다음이면 setImmediate, 몇 밀리초 뒤면 setTimeout이다.",
  recall: "I/O 콜백 안에서 setTimeout(0)과 setImmediate를 걸면 어느 쪽이 먼저 실행될까?",
  basis: "idle·prepare 단계는 내부용이라 생략했다. 메인 모듈에서 setTimeout 0과 setImmediate의 순서는 실행 시점에 따라 바뀐다.",
  sources: "Node.js 공식 가이드 「The Node.js Event Loop, Timers, and process.nextTick()」",
};

LTT.deck({
  title: "Node.js 이벤트 루프 한 바퀴",
  theme: "terminal",
  glossary: {
    "이벤트 루프": "Node.js가 대기 중인 콜백을 정해진 단계 순서로 처리하는 고리. 한 바퀴를 돌며 다음 콜백을 찾는다.",
    "마이크로태스크": "Promise 콜백처럼 한 단계가 끝나면 다음 단계로 넘어가기 전에 먼저 실행되는 작은 작업. nextTick 큐가 이보다 먼저 비워진다.",
  },
  scenes: [scene],
});
</script>
</body>
</html>
