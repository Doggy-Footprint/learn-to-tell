<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남향과 북향의 하루 채광</title>
<script type="application/json" id="ltt-meta">{"topic":"남향 vs 북향 방의 하루 채광","audience":"집을 고르는 비전문가","theme":"sketch","medium":"화이트보드 단면 스케치","decision":"방의 향 선택","domain":"건축","pattern":["contrast"],"mode":"장면 한 장. 공간 구조를 \"강조가 훑음\" 움직임과 작은 여러 칸 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.sw-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px}
.sw-cell{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;min-width:0;transition:background .3s}
.sw-cell.hot{background:var(--ltt-accent-soft)}
.sw-cell svg{width:100%;height:auto;display:block}
.sw-cell .h{font-size:16px;font-weight:700;color:var(--ltt-ink)}
.sw-cell .d{font-size:14px;color:var(--ltt-muted);line-height:1.35}
</style>
<style>/* 장면 하나짜리라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
// 6초에 시각 다섯 칸을 한 바퀴 훑는다. 두 패널이 같은 시계를 써서 함께 움직인다
const T0 = Date.now(), P = 6000;
const HOURS = [8, 10, 12, 14, 16];

// 방 치수(m). 깊이·천장·창 높이는 가정한 값이다
const ROOM = { D: 4, H: 2.4, sill: 0.9, head: 2.1 };
// 서울 위도 37.5°, 동지 적위 −23.4°. 시각은 태양시
const LAT = 37.5, DEC = -23.44;

// 해 높이(도)와, 창 면에 수직인 단면에서 빛줄기의 기울기 t = tan(고도) / cos(방위각)
function sun(hour) {
  const H = (hour - 12) * 15 * Math.PI / 180, f = LAT * Math.PI / 180, d = DEC * Math.PI / 180;
  const alt = Math.asin(Math.sin(f) * Math.sin(d) + Math.cos(f) * Math.cos(d) * Math.cos(H));
  const x = Math.sin(f) * Math.cos(H) - Math.cos(f) * Math.tan(d), y = Math.sin(H);
  return { deg: alt * 180 / Math.PI, t: Math.tan(alt) / (x / Math.hypot(x, y)) };
}
// 남향 창의 빛: 바닥에 떨어지는 자리(시작·길이, m)와, 빛줄기가 안쪽 벽에 닿는 띠(m)
function light(t) {
  const { D, sill, head } = ROOM;
  const start = Math.min(sill / t, D), len = Math.max(0, Math.min(head / t, D) - sill / t);
  const band = head - t * D > 0 ? [Math.max(0, sill - t * D), head - t * D] : null;
  const caption = len > 0.05 ? `바닥 빛 ${len.toFixed(1)} m` : band ? "벽에만 빛" : "빛 없음";
  return { start, len, band, caption };
}
// 기대값: 정오 해 높이 29.06°, tan ≈ 0.5557, (2.1 − 0.9) / 0.5557 ≈ 2.16 m
LTT.expect("정오 남향 바닥 빛 길이", light(sun(12).t).len, 2.16, { tol: 0.01 });

const PX = 30, X0 = 20, FAR_X = X0 + ROOM.D * PX, FLOOR = 100, CEIL = FLOOR - ROOM.H * PX;
const Y_HEAD = FLOOR - ROOM.head * PX, Y_SILL = FLOOR - ROOM.sill * PX, SUN_X = 6;
const ink = (w, c = "--ltt-ink") => `stroke:var(${c});stroke-width:${w};stroke-linecap:round`;
let uid = 0;

// 한 칸: 방 단면. 남향은 창이 왼쪽(남쪽), 북향은 창이 오른쪽(북쪽)
function cell(host, hour, north) {
  const sn = sun(hour), L = north ? null : light(sn.t);
  const wrap = LTT.h("div", "sw-cell");
  wrap.innerHTML = `<div class="h">${hour}시</div>`;
  const s = mk("svg", { viewBox: "0 0 150 108" }, wrap);
  const wx = north ? FAR_X : X0, sx = north ? X0 : FAR_X;
  mk("line", { x1: X0, y1: CEIL, x2: FAR_X, y2: CEIL, style: ink(2) }, s);
  mk("line", { x1: X0, y1: FLOOR, x2: FAR_X, y2: FLOOR, style: ink(2.5) }, s);
  mk("line", { x1: sx, y1: CEIL, x2: sx, y2: FLOOR, style: ink(3) }, s);
  mk("line", { x1: wx, y1: CEIL, x2: wx, y2: Y_HEAD, style: ink(3) }, s);
  mk("line", { x1: wx, y1: Y_SILL, x2: wx, y2: FLOOR, style: ink(3) }, s);
  mk("line", { x1: wx, y1: Y_HEAD, x2: wx, y2: Y_SILL, style: ink(2, "--ltt-accent") }, s);

  // 해와 위쪽 빛줄기. 북향은 해가 남쪽 벽에 막힌다
  const sunY = Y_HEAD - (X0 - SUN_X) * sn.t, ray = "stroke:var(--ltt-accent);stroke-width:1.5;stroke-dasharray:4 3";
  mk("line", { x1: SUN_X, y1: sunY, x2: X0, y2: Y_HEAD, style: ray }, s);
  mk("circle", { cx: SUN_X, cy: sunY, r: 5, style: "fill:var(--ltt-accent)" }, s);
  if (north) {
    mk("path", { d: `M${X0 - 4},${Y_HEAD - 4}L${X0 + 4},${Y_HEAD + 4}M${X0 - 4},${Y_HEAD + 4}L${X0 + 4},${Y_HEAD - 4}`, style: ink(2, "--ltt-bad") }, s);
  } else {
    // 빛줄기는 방 밖까지 늘려 그리고, 방 안쪽만 보이도록 자른다
    const id = `sw-clip-${++uid}`, clip = mk("clipPath", { id }, s);
    mk("rect", { x: X0, y: CEIL, width: FAR_X - X0, height: FLOOR - CEIL }, clip);
    const reach = FAR_X + 30, end = (yw) => yw + (reach - X0) * sn.t;
    mk("polygon", { points: `${X0},${Y_HEAD} ${X0},${Y_SILL} ${reach},${end(Y_SILL)} ${reach},${end(Y_HEAD)}`,
      "clip-path": `url(#${id})`, style: "fill:var(--ltt-accent);opacity:.28" }, s);
    mk("line", { x1: SUN_X, y1: Y_SILL - (X0 - SUN_X) * sn.t, x2: X0, y2: Y_SILL, style: ray }, s);
    if (L.len > 0) mk("line", { x1: X0 + L.start * PX, y1: FLOOR, x2: X0 + (L.start + L.len) * PX, y2: FLOOR, style: ink(5, "--ltt-accent") }, s);
    if (L.band) mk("line", { x1: FAR_X, y1: FLOOR - L.band[1] * PX, x2: FAR_X, y2: FLOOR - L.band[0] * PX, style: ink(5, "--ltt-accent") }, s);
  }
  host.appendChild(wrap);
  wrap.appendChild(LTT.h("div", "d", `해 ${Math.round(sn.deg)}° · ${north ? "빛 없음" : L.caption}`));
  return wrap;
}

// 시각 칸 다섯 개를 한 줄에 놓는다. 강조 띠는 왼쪽에서 오른쪽으로 훑는다
function panel(north) {
  return (node) => {
    const r = LTT.h("div", "sw-row"); node.appendChild(r);
    const cells = HOURS.map((h) => cell(r, h, north));
    const mark = (i) => cells.forEach((c, j) => c.classList.toggle("hot", j === i));
    if (reduced) { mark(2); return r; }
    const f = () => { if (!r.isConnected) return; mark(Math.floor(((Date.now() - T0) % P) / P * HOURS.length)); setTimeout(f, 60); };
    requestAnimationFrame(f);
    return r;
  };
}

LTT.deck({
  title: "남향과 북향의 하루 채광", theme: "sketch",
  glossary: { "직사광": "구름 없이 해에서 곧바로 오는 빛. 창을 지나 바닥이나 벽에 밝은 자리를 만든다",
    "해 높이": "지평선에서 해까지의 각도. 겨울엔 해가 낮아 빛이 방 안쪽까지 든다" },
  scenes: [{
    type: "contrast",
    title: "같은 겨울 하루, 바닥에 빛이 드는 쪽은 남향 방뿐이다",
    sub: "단면은 남쪽이 왼쪽이다. 강조 띠가 시각을 훑으며 {{직사광}}이 떨어지는 자리를 보여 준다. 겨울 {{해 높이}}가 낮아 빛이 방 안쪽까지 든다.",
    before: { label: "북향 방 · 겨울 하루 직사광 없음", tone: "bad", visual: panel(true) },
    after: { label: "남향 방 · 낮 가운데 바닥에 빛", tone: "good", visual: panel(false) },
    basis: "서울 위도 37.5°, 동지 적위 −23.4°, 태양시로 계산. 방 깊이 4 m·창 0.9–2.1 m는 가정한 치수다. 빛줄기는 창 모서리를 지나는 직선. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    takeaway: "겨울 채광을 기준으로 고르면 창이 남쪽을 향하는 방이 유리하다. 북향 창에는 직사광이 들지 않는다.",
    recall: "북향 방도 낮에 바닥에 해가 드는 자리가 있을까?"
  }]
});
</script>
</body>
</html>
