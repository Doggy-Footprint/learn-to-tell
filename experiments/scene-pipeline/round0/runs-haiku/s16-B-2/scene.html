<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남향과 북향의 하루 채광</title>
<script type="application/json" id="ltt-meta">{"topic":"남향 vs 북향 방의 하루 채광","audience":"집을 고르는 비전문가","theme":"sketch","medium":"화이트보드 단면 스케치","decision":"방의 향 선택","domain":"건축","pattern":["contrast"],"mode":"장면 하나짜리 파일. 역할 contrast, 구조 공간, 움직임 강조가 훑음, 구도 작은 여러 칸"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.sec{display:block;width:100%;max-width:400px;height:auto;margin-top:36px}
.sec text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 파일이라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
// 위도 37.5°N, 동지 적위 -23.44°. 방 깊이 4m, 창은 바닥 위 0.9~2.1m, 그림에서 1m = 20 단위
const D2R = Math.PI / 180, LAT = 37.5 * D2R, DEC = -23.44 * D2R;
const SILL = 0.9, TOP = 2.1, DEPTH = 4, K = 20;
const HOURS = [{ h: 9, label: "오전 9시" }, { h: 12, label: "정오" }, { h: 15, label: "오후 3시" }];
// 태양시 h시의 해 방향. north는 북쪽 성분, up은 위쪽 성분
function sun(h) {
  const H = (h - 12) * 15 * D2R;
  const north = Math.cos(LAT) * Math.sin(DEC) - Math.sin(LAT) * Math.cos(DEC) * Math.cos(H);
  const up = Math.sin(LAT) * Math.sin(DEC) + Math.cos(LAT) * Math.cos(DEC) * Math.cos(H);
  return { alt: Math.asin(up) / D2R, north, up };
}
// 창에 수직인 단면에서 본 해의 기울기 t = 해 높이 / 창 법선 쪽 수평 성분. 해가 창 뒤에 있으면 빛이 없다
function patch(h, facing) {
  const s = sun(h), perp = facing === "south" ? -s.north : s.north;
  if (perp <= 0 || s.up <= 0) return null;
  const t = s.up / perp;
  return { alt: s.alt, t, near: SILL / t, far: TOP / t };
}

// 핵심 결과: 동지 정오, 남향 방에서 빛이 바닥에 닿는 가장 가까운 깊이
LTT.expect("남향 정오 빛 시작 깊이", patch(12, "south").near, 1.62, { tol: 0.01 });

// 방 하나의 단면 세 칸. 창은 왼쪽 벽, 방 깊이는 오른쪽으로 간다
function room(facing) {
  return (node) => {
    const s = mk("svg", { viewBox: "0 0 342 138", class: "sec", role: "img", "aria-label": facing === "south" ? "남향 방 단면" : "북향 방 단면" }, node);
    const hl = mk("rect", { x: 2, y: 18, width: 110, height: 124, rx: 8, style: "fill:var(--ltt-accent);opacity:0;pointer-events:none" }, s);
    const ln = (x1, y1, x2, y2, w, c) => mk("line", { x1, y1, x2, y2, style: `stroke:${c};stroke-width:${w};stroke-linecap:square` }, s);
    const CEIL = 34, FLOOR = 94, SILL_Y = FLOOR - 18, TOP_Y = FLOOR - 42;
    HOURS.forEach((t, i) => {
      const cx = 6 + i * 114, wx = cx + 10, p = patch(t.h, facing), sg = sun(t.h);
      mk("text", { x: cx + 51, y: 16, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s).textContent = t.label;
      mk("rect", { x: cx, y: 24, width: 102, height: 112, rx: 6, style: "fill:none;stroke:var(--ltt-line)" }, s);
      if (p && p.near < DEPTH) {
        const far = Math.min(p.far, DEPTH), x0 = wx + K * p.near, x1 = wx + K * far;
        mk("rect", { x: x0, y: FLOOR - 6, width: x1 - x0, height: 6, style: "fill:var(--ltt-warn-soft)" }, s);
        ln(wx, SILL_Y, x0, FLOOR, 2, "var(--ltt-warn)");
        ln(wx, TOP_Y, x1, TOP_Y + K * far * p.t, 2, "var(--ltt-warn)");
      }
      ln(wx, CEIL, wx + 80, CEIL, 2, "var(--ltt-ink-2)");
      ln(wx, CEIL, wx, TOP_Y, 4, "var(--ltt-ink)");
      ln(wx, TOP_Y, wx, SILL_Y, 3, "var(--ltt-accent)");
      ln(wx, SILL_Y, wx, FLOOR, 4, "var(--ltt-ink)");
      ln(wx + 80, CEIL, wx + 80, FLOOR, 4, "var(--ltt-ink)");
      ln(wx, FLOOR, wx + 80, FLOOR, 3, "var(--ltt-ink)");
      mk("text", { x: cx + 51, y: 112, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink)" }, s).textContent = `해 ${sg.alt.toFixed(0)}°`;
      mk("text", { x: cx + 51, y: 128, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink)" }, s).textContent =
        p && p.near < DEPTH ? `빛 ${p.near.toFixed(1)}~${Math.min(p.far, DEPTH).toFixed(1)}m` : "직사광 없음";
    });
    // 강조 띠가 세 칸을 차례로 훑는다. 한 바퀴 6초, 마지막 15%는 쉰다
    if (reduced) return s;
    const t0 = Date.now(), P = 6000;
    const f = () => { if (!s.isConnected) return; const u = ((Date.now() - t0) % P) / P, on = u < .85;
      hl.setAttribute("x", 2 + 228 * ease(Math.min(1, u / .85)));
      hl.style.opacity = on ? .14 : 0;
      setTimeout(f, 40); };
    requestAnimationFrame(f);
    return s;
  };
}

LTT.deck({
  title: "남향과 북향의 하루 채광", theme: "sketch",
  glossary: { "직사광": "해에서 곧바로 오는 빛. 창을 지나 방 바닥에 밝은 자리를 만든다" },
  scenes: [{
    type: "contrast",
    title: "남향 창은 낮은 겨울 해를 방 깊숙이 들이고, 북향 창은 직사광이 없다",
    sub: "동지 무렵 방 깊이 4m를 단면으로 본다. 강조 띠가 오전 9시, 정오, 오후 3시를 차례로 훑는다. 해가 낮을수록 {{직사광}}이 방 안쪽 깊이 든다.",
    before: { label: "북향 방 · 창이 북쪽", tone: "bad", visual: room("north") },
    after: { label: "남향 방 · 창이 남쪽", tone: "good", visual: room("south") },
    basis: "위도 37.5°N, 동지 적위 −23.44°, 태양시 기준. 해 방향을 창에 수직인 단면으로 투영해 계산. 창은 바닥 위 0.9~2.1m, 방 깊이 4m 가정. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    takeaway: "남향은 겨울 해가 방 깊숙이 빛을 보내고, 북향은 해가 늘 남쪽 하늘에 있어 창으로 직사광이 들지 않는다.",
    recall: "북향 방이 낮에도 밝은 건 직사광 때문인가?"
  }]
});
</script>
</body>
</html>
