<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 퍼널 이탈 구간</title>
<script type="application/json" id="ltt-meta">{"topic":"결제 퍼널 이탈 지점","audience":"UX 입문자","theme":"studio","medium":"제품 분석 대시보드","decision":"어느 결제 단계를 먼저 고칠까","domain":"UX","pattern":["figure"],"mode":"장면 하나짜리. 순서 구조를 확대·축소 움직임과 좌우 분할 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.fn{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center;width:1000px;max-width:100%;margin:0 auto}
.fn-pic{background:var(--ltt-card);border:1px solid var(--ltt-line);border-radius:var(--ltt-r-lg);padding:14px;min-width:0}
.fn-pic svg{display:block;overflow:hidden;width:100%;height:auto}
.fn-pic path{vector-effect:non-scaling-stroke}
.fn-list{display:flex;flex-direction:column;gap:10px;min-width:0}
.fn-row{padding:12px 16px;border:1px solid var(--ltt-line);border-radius:var(--ltt-r-lg);background:var(--ltt-card);opacity:.6;transition:opacity .3s,border-color .3s}
.fn-row.on{opacity:1;border-color:var(--ltt-accent)}
.fn-name{font-size:16px;font-weight:600;color:var(--ltt-ink)}
.fn-num{font-size:15px;color:var(--ltt-muted);margin-top:4px}
.fn-tag{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:var(--ltt-bad)}
@media (max-width:640px){.fn{grid-template-columns:minmax(0,1fr)}}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const W = 560, H = 460, ROW = 96, BAR = 44, CX = 280, PERIOD = 11200;
const FULL = [0, 0, W, H];

// 가상의 예시 수치(실제 서비스 데이터 아님). 단계마다 남은 세션 수
const STEPS = [["장바구니 담기", 10000], ["배송·주문자 정보", 7000], ["결제 수단 선택", 6400], ["카드 정보·인증", 3600], ["주문 완료", 3300]];
const DROPS = STEPS.slice(1).map(([b, to], i) => { const from = STEPS[i][1], lost = from - to; return { a: STEPS[i][0], b, from, to, lost, rate: lost / from }; });
const best = (key) => DROPS.reduce((top, d, i) => d[key] > DROPS[top][key] ? i : top, 0);
LTT.expect("잃은 사람 최다 구간", best("lost"), 0, { tol: 0 });
LTT.expect("이탈률 최고 구간", best("rate"), 2, { tol: 0 });
LTT.expect("구간 3 이탈률", DROPS[2].rate, 0.4375, { tol: 0.0005 });

// 막대 너비는 세션 수에 비례한다(10,000명 = 500). 행 i는 단계 i, 행 사이 띠가 구간 i의 이탈
const rowY = (i) => 16 + i * ROW;
const barW = (n) => n * 0.05;
const band = (k) => { const a = barW(STEPS[k][1]) / 2, b = barW(STEPS[k + 1][1]) / 2, y0 = rowY(k) + BAR, y1 = rowY(k + 1);
  return `M${CX - a},${y0}L${CX + a},${y0}L${CX + b},${y1}L${CX - b},${y1}Z`; };
// 구간 k를 확대할 시야: 그 구간 띠가 가운데 오도록 맞춘 사각형(가로세로비는 무대에 맞춤)
const boxes = DROPS.map((_, k) => {
  const bw = 340, bh = bw * H / W, yc = rowY(k) + ROW / 2;
  return [CX - bw / 2, Math.max(0, Math.min(H - bh, yc - bh / 2)), bw, bh];
});

function funnel(host) {
  const wrap = host.appendChild(document.createElement("div"));
  wrap.className = "fn live"; wrap.setAttribute("data-annotate", "");
  const pic = wrap.appendChild(document.createElement("div")); pic.className = "fn-pic";
  const svg = mk("svg", { viewBox: FULL.join(" "), role: "img", "aria-label": "결제 단계별 남은 세션 막대. 구간마다 줄어드는 띠" }, pic);
  const bands = DROPS.map((_, k) => mk("path", { d: band(k), style: "fill:var(--ltt-line);fill-opacity:.4;stroke:none" }, svg));
  const bars = STEPS.map(([, n], i) => mk("rect", { x: CX - barW(n) / 2, y: rowY(i), width: barW(n), height: BAR, rx: 6, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1.5" }, svg));
  const list = wrap.appendChild(document.createElement("div")); list.className = "fn-list";
  const rows = DROPS.map((d, i) => {
    const r = list.appendChild(document.createElement("div")); r.className = "fn-row";
    const name = r.appendChild(document.createElement("div")); name.className = "fn-name"; name.textContent = `${d.a} → ${d.b}`;
    const num = r.appendChild(document.createElement("div")); num.className = "fn-num";
    num.textContent = `${d.lost.toLocaleString("ko-KR")}명 잃음 · 이탈률 ${(d.rate * 100).toFixed(1)}%`;
    const tag = i === best("lost") ? "잃은 사람 최다" : i === best("rate") ? "이탈률 최고" : "";
    if (tag) { const t = r.appendChild(document.createElement("div")); t.className = "fn-tag"; t.textContent = tag; }
    return r;
  });
  wrap._fn = { svg, bands, bars, rows };
  return wrap;
}
// 한 주기: 구간마다 [확대 0.35 → 띠 보임 0.35 → 축소 0.30]
function draw(wrap, u) {
  const { svg, bands, bars, rows } = wrap._fn;
  const k = Math.min(DROPS.length - 1, Math.floor(u * DROPS.length)), l = u * DROPS.length - k;
  const z = Math.min(ease(clamp(l / 0.35)), 1 - ease(clamp((l - 0.7) / 0.3)));
  const box = boxes[k];
  svg.setAttribute("viewBox", FULL.map((v, j) => (v + (box[j] - v) * z).toFixed(1)).join(" "));
  bands.forEach((b, i) => { const on = i === k; b.style.fill = on ? "var(--ltt-bad-soft)" : "var(--ltt-line)"; b.style.fillOpacity = on ? 1 : .4; b.style.stroke = on ? "var(--ltt-bad)" : "none"; });
  bars.forEach((b, i) => { const on = i === k || i === k + 1; b.style.stroke = on ? "var(--ltt-ink-2)" : "var(--ltt-line-2)"; });
  rows.forEach((r, i) => r.classList.toggle("on", i === k));
}
let ticker = 0;
function play() {
  if (ticker) return;
  const t0 = Date.now();
  const f = () => { const live = document.querySelectorAll(".fn.live"); if (!live.length) { ticker = 0; return; }
    live.forEach((w) => draw(w, ((Date.now() - t0) / PERIOD) % 1)); ticker = setTimeout(f, 16); };
  ticker = setTimeout(f, 16);
}

LTT.deck({
  title: "결제 퍼널 이탈 구간", theme: "studio",
  glossary: {
    "퍼널": "사용자가 목표(주문 완료)까지 단계별로 줄어드는 흐름. 깔때기 모양으로 그린다",
    "이탈률": "이전 단계에 들어온 사람 중 다음 단계로 가지 않은 비율" },
  scenes: [{
    type: "figure", label: "단계 이탈",
    title: "잃는 사람이 가장 많은 단계와 이탈률이 가장 높은 단계는 다르다",
    sub: "{{퍼널}}이 한 구간씩 확대된다. 막대 너비는 세션 수에 비례한다. 오른쪽 목록은 그 구간에서 잃은 사람과 이탈률이다.",
    figure: (el) => { const w = funnel(el); draw(w, reduced ? 0.5 : 0); if (!reduced) play(); return { el: w }; },
    caption: "고칠 단계를 고르려면 {{이탈률}}과 잃은 사람 수를 함께 봐야 한다. 하나만 보면 다른 곳을 고치게 된다.",
    basis: "가상의 예시 수치(실제 서비스 데이터 아님). 장바구니 세션 10,000건을 가정하고 단계별 도달 수를 임의로 정했다. 이탈률 = (이전 단계 − 다음 단계) ÷ 이전 단계.",
    takeaway: "잃는 사람 수가 많은 곳과 이탈률이 높은 곳은 다를 수 있다. 두 숫자를 같이 보고 먼저 고칠 곳을 정한다."
  }]
});
</script>
</body>
</html>
