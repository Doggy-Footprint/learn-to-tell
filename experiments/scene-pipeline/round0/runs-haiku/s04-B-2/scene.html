<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키르히호프 전류 법칙</title>
<script type="application/json" id="ltt-meta">{"topic":"키르히호프 전류 법칙","audience":"회로 입문자","theme":"blueprint","medium":"회로 도면","decision":"분기점에서 전류가 어떻게 나뉘나","domain":"전기 회로","pattern":["figure"],"mode":"장면 한 장: 연결 구조를 \"점이 궤적을 그림\" 움직임과 좌우 분할 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.sec{width:1120px;max-width:100%;height:auto;display:block;margin:0 auto}
.sec text{font-family:inherit}
</style>
<style>/* 장면 하나짜리라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; parent && parent.appendChild(n); return n; };
// 헤드리스 캡처의 virtual time은 setTimeout·Date.now를 따라가므로 rAF 대신 쓴다
function loop(period, draw, finalU) {
  let id = 0, t0 = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(id); if (reduced) { draw(finalU); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(id); } };
}

// 모델로 계산한 예시: 전압 12 V, R1 = 4 Ω, R2 = 6 Ω. 두 저항은 분기점에서 같은 전압을 받는다.
// 손으로 따로 계산한 값: I1 = 3 A, I2 = 2 A, 들어온 전류 5 A (합성저항 2.4 Ω, 12 / 2.4 = 5)
const V = 12, R1 = 4, R2 = 6;
const I1 = V / R1, I2 = V / R2, Itot = V / (1 / (1 / R1 + 1 / R2));
LTT.expect("R1 쪽 전류 I1", I1, 3, { tol: 1e-6 });
LTT.expect("R2 쪽 전류 I2", I2, 2, { tol: 1e-6 });
LTT.expect("들어온 전류 V/Req", Itot, 5, { tol: 1e-6 });

const TOP = 140, BOT = 380, BAT = 100, J1 = 340, J2 = 500, RY0 = 196, RY1 = 304;
const poly = (pts) => "M" + pts.map((p) => p.join(",")).join(" L");
// 경로를 p(0~1, 길이 비례)만큼 따라간 점들. 마지막 점이 점의 현재 위치다.
function along(pts, p) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
  let left = p * total; const out = [pts[0]];
  for (let i = 0; i < segs.length; i++) {
    const a = pts[i], b = pts[i + 1];
    if (left >= segs[i]) { left -= segs[i]; out.push(b); continue; }
    const t = left / segs[i];
    out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    return out;
  }
  return out;
}
// 두 갈래 경로. 점 5개 중 3개는 R1 쪽, 2개는 R2 쪽으로 간다 (3 A : 2 A)
const ROUTE_A = [[BAT, TOP], [J1, TOP], [J1, BOT], [BAT, BOT], [BAT, TOP]];
const ROUTE_B = [[BAT, TOP], [J2, TOP], [J2, BOT], [J1, BOT], [BAT, BOT], [BAT, TOP]];
const DOTS = [
  { route: ROUTE_A, phase: 0, c: "var(--ltt-c1)" }, { route: ROUTE_A, phase: 1 / 3, c: "var(--ltt-c1)" }, { route: ROUTE_A, phase: 2 / 3, c: "var(--ltt-c1)" },
  { route: ROUTE_B, phase: 0, c: "var(--ltt-c2)" }, { route: ROUTE_B, phase: 1 / 2, c: "var(--ltt-c2)" }
];

function circuit(host) {
  const W = 1120, H = 440;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "sec", "data-annotate": "" }, host);
  const wire = (pts) => el("path", { d: poly(pts), style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:3;stroke-linejoin:round" }, s);
  const txt = (x, y, t, anchor, style) => el("text", { x, y, "text-anchor": anchor || "start", style: style || "font-size:16px;fill:var(--ltt-ink)" }, s, t);

  // 회로 도면: 왼쪽 절반
  wire([[BAT, TOP], [J2, TOP]]);
  wire([[J1, TOP], [J1, BOT]]);
  wire([[J2, TOP], [J2, BOT]]);
  wire([[J2, BOT], [BAT, BOT]]);
  wire([[BAT, TOP], [BAT, 236]]);
  wire([[BAT, 252], [BAT, BOT]]);
  el("line", { x1: BAT - 16, x2: BAT + 16, y1: 236, y2: 236, style: "stroke:var(--ltt-ink);stroke-width:5" }, s);
  el("line", { x1: BAT - 28, x2: BAT + 28, y1: 252, y2: 252, style: "stroke:var(--ltt-ink);stroke-width:2.5" }, s);
  txt(BAT - 40, 250, "12 V", "end", "font-size:18px;font-weight:800;fill:var(--ltt-ink)");
  for (const x of [J1, J2]) el("rect", { x: x - 18, y: RY0, width: 36, height: RY1 - RY0, rx: 3, style: "fill:var(--ltt-card);stroke:var(--ltt-ink);stroke-width:2.5" }, s);
  el("circle", { cx: J1, cy: TOP, r: 6, style: "fill:var(--ltt-ink)" }, s);
  el("circle", { cx: J2, cy: TOP, r: 6, style: "fill:var(--ltt-ink)" }, s);
  el("circle", { cx: J1, cy: BOT, r: 6, style: "fill:var(--ltt-ink)" }, s);
  txt(J1, 118, "분기점", "middle", "font-size:16px;font-weight:700;fill:var(--ltt-ink)");
  txt(220, 128, "I = 5 A", "middle", "font-size:16px;font-weight:700;fill:var(--ltt-ink)");
  txt(220, 412, "전지로 돌아오는 I = 5 A", "middle", "font-size:15px;fill:var(--ltt-ink-2)");
  txt(J1 - 30, 232, "R₁ = 4 Ω", "end");
  txt(J1 - 30, 258, "I₁ = 3 A", "end", "font-size:16px;font-weight:800;fill:var(--ltt-c1)");
  txt(J2 + 30, 232, "R₂ = 6 Ω");
  txt(J2 + 30, 258, "I₂ = 2 A", "start", "font-size:16px;font-weight:800;fill:var(--ltt-c2)");

  // 오른쪽 절반: 들어온 전류가 두 조각으로 나뉘는 막대
  const RX = 660;
  txt(RX, 56, "두 저항은 같은 12 V를 받는다", "start", "font-size:16px;fill:var(--ltt-muted)");
  txt(RX, 104, "들어온 전류 I = 5 A", "start", "font-size:18px;font-weight:800;fill:var(--ltt-ink)");
  el("rect", { x: RX, y: 116, width: 3 * 60, height: 30, style: "fill:var(--ltt-c1)" }, s);
  el("rect", { x: RX + 3 * 60, y: 116, width: 2 * 60, height: 30, style: "fill:var(--ltt-c2)" }, s);
  txt(RX, 172, "R₁ 쪽  I₁ = 12 ÷ 4 = 3 A", "start", "font-size:16px;font-weight:800;fill:var(--ltt-c1)");
  txt(RX, 198, "R₂ 쪽  I₂ = 12 ÷ 6 = 2 A", "start", "font-size:16px;font-weight:800;fill:var(--ltt-c2)");
  el("line", { x1: RX, x2: RX + 420, y1: 222, y2: 222, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
  txt(RX, 252, "I₁ + I₂ = 3 + 2 = 5 A", "start", "font-size:18px;font-weight:800;fill:var(--ltt-ink)");
  txt(RX, 280, "분기점에 들어온 것 = 나간 것 (키르히호프)", "start", "font-size:16px;fill:var(--ltt-ink-2)");
  txt(RX, 336, "전압이 같으니 저항이 작은 쪽으로", "start", "font-size:15px;fill:var(--ltt-ink-2)");
  txt(RX, 358, "더 많이 흐른다 (I ∝ 1/R)", "start", "font-size:15px;fill:var(--ltt-ink-2)");
  txt(RX, 384, "I₁ : I₂ = 1/4 : 1/6 = 3 : 2", "start", "font-size:15px;fill:var(--ltt-ink-2)");

  // 점: 한 점이 전지를 떠나 분기점에서 길을 골라 한 바퀴 돌며 궤적을 그린다
  const trails = DOTS.map((d) => el("path", { style: `fill:none;stroke:${d.c};stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.5` }, s));
  const heads = DOTS.map((d) => el("circle", { r: 8, style: `fill:${d.c};stroke:var(--ltt-card);stroke-width:2` }, s));
  function draw(u) {
    DOTS.forEach((d, i) => {
      const pts = along(d.route, (u + d.phase) % 1);
      const h = pts[pts.length - 1];
      trails[i].setAttribute("d", poly(pts));
      heads[i].setAttribute("cx", h[0]); heads[i].setAttribute("cy", h[1]);
    });
  }
  return { el: s, draw };
}

let F = null;
LTT.deck({
  title: "키르히호프 전류 법칙", theme: "blueprint",
  glossary: {
    "키르히호프 전류 법칙": "분기점에 들어온 전류의 합은 나가는 전류의 합과 같다",
    "분기점": "전선이 둘 이상으로 갈라지거나 모이는 점"
  },
  scenes: [{
    type: "figure", kicker: "전기 회로", title: "분기점에서 전류는 저항대로 나뉘고, 합하면 들어온 값이다",
    sub: "전하를 나타낸 점이 전지에서 나와 분기점에서 길을 골라 돌아온다. 점이 많이 지나는 길일수록 전류가 많다.",
    figure: (h) => (F = circuit(h)),
    caption: "{{분기점}}에서 5 A가 들어와 3 A와 2 A로 나뉜다. 두 값을 더하면 다시 5 A이므로 {{키르히호프 전류 법칙}}이 성립한다.",
    basis: "12 V, 4 Ω, 6 Ω은 설명용으로 고른 값이다. 계산은 옴의 법칙 I = V/R과 전류의 합(들어온 것 = 나간 것)만 쓴다.",
    mount() { return loop(9000, (u) => F.draw(u), 0.85); }
  }]
});
</script>
</body>
</html>
