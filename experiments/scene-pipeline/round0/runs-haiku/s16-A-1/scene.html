<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>남향과 북향 방의 채광</title>
<script type="application/json" id="ltt-meta">{"topic": "남향 vs 북향 방의 하루 채광", "audience": "집을 고르는 비전문가", "theme": "sketch", "medium": "화이트보드 단면 스케치", "decision": "방의 향 선택"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/rough.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .sk-fig svg { display: block; width: 100%; height: auto; overflow: visible; }
  .sk-beam, .sk-patch, .sk-dif { opacity: 0; transition: opacity var(--m, 600ms) ease; }
  .sk-lit .sk-beam, .sk-lit .sk-patch, .sk-lit .sk-dif { opacity: 1; }
  .sk-ray { fill: none; stroke: var(--ltt-accent); stroke-width: 1.4; transition: stroke-dashoffset var(--m, 600ms) linear; }
  .sk-frame { transition: transform var(--m, 600ms) ease-in-out; }
  .sk-frame-box { fill: var(--ltt-card-2); stroke: var(--ltt-line); }
  .sk-beam { fill: var(--ltt-accent-soft); }
  .sk-patch { stroke: var(--ltt-accent); stroke-width: 6; stroke-linecap: round; }
  .sk-sun { fill: var(--ltt-accent); }
  .sk-hd { fill: var(--ltt-muted); font-size: 12px; }
  .sk-hd.on { fill: var(--ltt-ink); }
  .sk-name { fill: var(--ltt-ink); font-size: 15px; font-weight: 600; }
  .sk-lbl { fill: var(--ltt-muted); font-size: 12px; }
</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const S = 30;                                                      // 1 m = 30 px
const D = 5 * S, RH = 2.7 * S, SILL = 0.9 * S, HEAD = 2.1 * S;     // 방 깊이 5 m, 천장 2.7 m, 창 0.9–2.1 m
const COL = 214, X0 = 120;                                         // 칸 간격, 첫 칸의 방 왼쪽 벽
const TIMES = [{ h: "9시", alt: 10 }, { h: "11시", alt: 24 }, { h: "13시", alt: 29 }, { h: "15시", alt: 19 }]; // 해 높이(도), 동짓날 무렵 대략
const ROWS = [{ name: "남향 방", win: "남쪽 창", south: true, floor: 150 },
              { name: "북향 방", win: "북쪽 창", south: false, floor: 292 }];

const mk = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const ink = (n) => {
  (n.tagName === "path" ? [n] : n.querySelectorAll("path")).forEach((p) => { p.style.stroke = "var(--ltt-ink-2)"; });
  return n;
};

const scene = {
  kicker: "건축 · 방의 향",
  title: "남향 방은 낮 내내 해가 들고, 북향 방은 해를 등진다",
  sub: "왼쪽이 북, 오른쪽이 남인 단면이다. 오른쪽 해의 높이가 바뀌며 빛이 닿는 자리가 옮겨 간다.",
  narration: "남향 창으로는 아침부터 오후까지 해가 들어오고, 그 빛({{직사광}})은 해가 낮을수록 방 안쪽 깊이 닿는다. 북향 창은 해와 반대쪽 벽에 있어, 해의 빛은 방 건너편 벽에 막히고 하늘에서 흩어져 들어오는 빛만 남는다.",
  basis: "위도 약 37도, 해 높이가 가장 낮은 동짓날 무렵을 대략 맞춘 단순 그림이다. 날짜와 지역에 따라 값은 달라진다.",
  takeaway: "창이 남쪽 벽에 있으면 낮 동안 해가 들고, 북쪽 벽에 있으면 직사광이 들지 않는다.",
  recall: "북향 방이 밝은 까닭은 해에서 오는 빛인가, 하늘에서 오는 빛인가?",
  mount(body) {
    const reduce = LTT.MOTION_MS === 0;
    const MS = LTT.MOTION_MS || 600;
    const W = 980, H = 330;

    const wrap = document.createElement("div");
    wrap.className = "sk-fig";
    body.appendChild(wrap);
    const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "남향 방과 북향 방의 시간별 햇빛 단면" });
    svg.style.setProperty("--m", MS + "ms");
    wrap.appendChild(svg);

    const rc = rough.svg(svg);
    const wall = (x1, y1, x2, y2) => svg.appendChild(ink(rc.line(x1, y1, x2, y2, { roughness: 1.1, strokeWidth: 1.6 })));

    const defs = mk("defs", {}, svg);
    const grad = mk("linearGradient", { id: "sk-dif", x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    mk("stop", { offset: 0 }, grad).style.stopColor = "var(--ltt-line-2)";
    mk("stop", { offset: 1 }, grad).style.stopColor = "var(--ltt-line-2)";
    grad.lastChild.style.stopOpacity = 0;

    const frame = mk("rect", { class: "sk-frame-box sk-frame", x: 112, y: 10, width: COL - 4, height: 316, rx: 10 }, svg);
    const cols = [], heads = [], rays = [];

    TIMES.forEach((t, i) => {
      const a = (t.alt * Math.PI) / 180, tn = Math.tan(a), ca = Math.cos(a), sa = Math.sin(a);
      const x0 = X0 + i * COL, xw = x0 + D;
      const g = mk("g", { class: "sk-col" }, svg);
      cols.push(g);
      rays.push([]);
      heads.push(mk("text", { class: "sk-hd", x: x0 + D / 2, y: 34, "text-anchor": "middle" }, svg));
      heads[i].textContent = t.h;

      const ray = (x1, y1, x2, y2, parent) => {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const el = mk("line", { x1, y1, x2, y2, class: "sk-ray", "stroke-dasharray": `${len} ${len}` }, parent);
        el.style.strokeDashoffset = len;
        rays[i].push({ el, len });
      };

      ROWS.forEach((row) => {
        const f = row.floor, roof = f - RH, mid = f - (SILL + HEAD) / 2;
        const wx = row.south ? xw : x0;                              // 창이 있는 벽
        const clipId = `sk-c-${i}-${row.south ? "s" : "n"}`;
        mk("rect", { x: x0, y: roof, width: D, height: RH }, mk("clipPath", { id: clipId }, defs));
        const room = mk("g", { "clip-path": `url(#${clipId})` }, g);

        if (row.south) {
          const imp = (h) => (h / tn <= D ? [xw - h / tn, f] : [x0, f - (h - D * tn)]);   // 빛이 바닥이나 안쪽 벽에 닿는 자리
          const [lx, ly] = imp(SILL), [ux, uy] = imp(HEAD);
          mk("polygon", { class: "sk-beam", points: `${xw},${f - HEAD} ${xw},${f - SILL} ${lx},${ly} ${ux},${uy}` }, room);
          mk("line", { class: "sk-patch", x1: ux, y1: uy, x2: lx, y2: ly }, room);
          ray(xw, f - HEAD, ux, uy, room);
          ray(xw, f - SILL, lx, ly, room);
        } else {
          mk("rect", { class: "sk-dif", x: x0, y: roof, width: D, height: RH, fill: "url(#sk-dif)" }, room);
        }

        wall(x0, f, xw, f);
        wall(x0, roof, xw, roof);
        if (row.south) {
          wall(x0, roof, x0, f);
          wall(xw, roof, xw, f - HEAD);
          wall(xw, f - SILL, xw, f);
        } else {
          wall(xw, roof, xw, f);
          wall(x0, roof, x0, f - HEAD);
          wall(x0, f - SILL, x0, f);
        }
        svg.appendChild(ink(rc.rectangle(wx - 3, f - HEAD, 6, HEAD - SILL, { roughness: 1, strokeWidth: 1.2 })));

        for (const h of [HEAD, SILL]) ray(xw, f - h, xw + 52 * ca, f - h - 52 * sa, g);   // 해에서 오는 빛, 북향은 벽에서 멈춘다
        mk("circle", { class: "sk-sun", cx: xw + 44 * ca, cy: mid - 44 * sa, r: 7 }, g);

        if (i === 0) {
          mk("text", { class: "sk-name", x: 14, y: f - 52 }, svg).textContent = row.name;
          mk("text", { class: "sk-lbl", x: 14, y: f - 30 }, svg).textContent = row.win;
        }
      });
    });

    const light = (i, on) => {
      cols[i].classList.toggle("sk-lit", on);
      rays[i].forEach((r) => { r.el.style.strokeDashoffset = on ? 0 : r.len; });
    };

    let idx = -1, timer = 0;
    const step = () => {
      idx = (idx + 1) % TIMES.length;
      frame.style.transform = `translateX(${idx * COL}px)`;
      light(idx, true);
      heads.forEach((h, k) => h.classList.toggle("on", k === idx));
    };

    if (reduce) {
      TIMES.forEach((_, i) => light(i, true));
      frame.style.display = "none";
    }

    return {
      enter() {
        if (reduce) return;
        clearInterval(timer);
        TIMES.forEach((_, i) => light(i, false));
        idx = -1;
        step();
        timer = setInterval(step, 1200);
      },
      leave() { clearInterval(timer); },
    };
  },
};

LTT.deck({
  title: "방의 향과 하루 채광",
  theme: "sketch",
  glossary: { "직사광": "구름 없이 태양에서 곧장 닿는 빛" },
  scenes: [scene],
});
</script>
</body>
</html>
