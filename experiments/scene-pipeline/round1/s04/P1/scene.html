<script type="application/json" id="ltt-meta">{"topic":"키르히호프 전류 법칙","audience":"회로 입문자","theme":"blueprint","medium":"회로 도면","decision":"분기점에서 전류가 어떻게 나뉘나","domain":"전기 회로","pattern":["figure"],"mode":"c1: 도면 한 장을 5단계로 읽기. 단계 버튼으로 분기점 A의 합과 저항 비율을 차례로 보인다"}</script>
<script type="application/json" id="ltt-checks">
[
{"id": "k1", "expect": "단계 1(또는 재생 시작): 본선에 6 A 화살표 하나가 A를 향한다. 방향은 전원 + → 회로 → − 이고 전자 화살표는 없다.", "reach": [{"wait": 400}]},
{"id": "k2", "expect": "반반 예상이 보이는 순간: 가지 입구에 \"3 A / 3 A?\" 점선 유령이 예상임을 알아볼 수 있게 뜬다. 실제 값으로 오해할 수 없고 실제 값과 같은 화면 색으로 쓰이지 않는다.", "reach": [{"click": "#next"}, {"wait": 700}]},
{"id": "k3", "expect": "실제 값이 찍힌 뒤: R1(6 Ω) 가지 2 A, R2(3 Ω) 가지 4 A. 저항이 작은 가지의 화살표가 더 굵고 값이 크다. 같은 가지의 저항 앞뒤 화살표 값은 같다.", "reach": [{"click": "#next"}, {"click": "#next"}, {"wait": 700}]},
{"id": "k4", "expect": "A에서 합을 맞춘 뒤: 들어오는 화살표 1개(6 A) = 나가는 두 화살표의 합(2 + 4). 부호 식 +6 −2 −4 = 0. 이것이 화면에서 가장 크고 강한 대상이다.", "reach": [{"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"wait": 700}]},
{"id": "k5", "expect": "역할 표기: \"합은 KCL(전하 보존)\", \"비율 2:4는 같은 전압 + 옴의 법칙(R2:R1)\"이 서로 다른 라벨로 나뉘어 있다.", "reach": [{"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"wait": 700}]},
{"id": "k6", "expect": "합류점 B: 2 A + 4 A 두 화살표가 합쳐져 6 A로 돌아간다. 본선과 같은 굵기로 복귀한다.", "reach": [{"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"wait": 700}]},
{"id": "k7", "expect": "그림이 칸 안에 보임: 데스크톱·모바일 폭 모두 도면 전체와 라벨이 잘리지 않는다. reduced-motion이면 마지막 단계가 정지 화면으로 나온다.", "reach": [{"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"click": "#next"}, {"wait": 700}]},
{"id": "k8", "expect": "수치 대조: LTT.expect 4건이 모두 통과하고 불일치 패널이 뜨지 않는다.", "reach": [{"wait": 400}]}
]

<style>

<style>/* 장면 하나짜리라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>

<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p, text) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); if (text != null) n.textContent = text; p && p.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
// 헤드리스 캡처의 virtual time은 setTimeout·Date.now를 따라가므로 rAF 대신 쓴다
function loop(period, draw, finalU) {
  let id = 0, t0 = 0;
  return { enter() { clearTimeout(id); if (reduced) { draw(finalU); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 33); }; f(); },
    leave() { clearTimeout(id); } };
}

// 모델: 전원 12 V에 R1 = 6 Ω, R2 = 3 Ω 병렬. 그림의 전류 값은 전부 여기서 나온다.
const V = 12, R1 = 6, R2 = 3;
const model = () => { const I1 = V / R1, I2 = V / R2, Rp = R1 * R2 / (R1 + R2); return { I1, I2, I: I1 + I2, Rp, Iviaparallel: V / Rp }; };
const M = model();
LTT.expect("R1 가지 전류 I1", M.I1, 2);
LTT.expect("R2 가지 전류 I2", M.I2, 4);
LTT.expect("분기점 A 들어온 전류 I = I1 + I2", M.I, 6);
LTT.expect("합성 저항 경로의 전류 V / Rp", M.Iviaparallel, 6);

const STEPS = [
  "① 전원이 전하를 밀어내 본선에 6 A가 흘러 분기점 A로 들어온다. 화살표는 관례 전류 방향(+ 단자 → 회로 → − 단자)이다.",
  "② 길이 둘이니 반반, 3 A와 3 A일 거라고 예상하기 쉽다. 노란 점선은 예상일 뿐 실제 값이 아니다.",
  "③ 실제로는 R2(3 Ω)로 4 A, R1(6 Ω)로 2 A. 두 가지는 양 끝이 같아 전압이 같고, 저항이 작은 쪽으로 더 흐른다. 저항을 지나도 전류는 줄지 않는다.",
  "④ 분기점 A에서 들어온 6 A = 나간 2 A + 4 A. 나뉘어도 합은 그대로다. 전하는 마디에 쌓이지도 사라지지도 않는다.",
  "⑤ 합류점 B에서 2 A와 4 A가 다시 더해져 6 A로 돌아간다. 합은 늘 지켜지지만 반반은 아니다. 저항이 같을 때만 반반이 된다."
];

function circuit(host) {
  const s = mk("svg", { viewBox: "40 30 1010 570", class: "ckt", "data-annotate": "", role: "img", "aria-label": "전원, 분기점 A, 병렬 저항 R1·R2, 합류점 B로 이루어진 회로 도면" }, host);
  const items = []; let step = reduced ? STEPS.length : 1;
  const reg = (n, from, to, dimFrom) => { n.classList.add("fx"); items.push({ n, from, to: to == null ? 9 : to, dimFrom: dimFrom == null ? 99 : dimFrom }); return n; };
  const wire = "fill:none;stroke:var(--ltt-ink-2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round";
  const AX = 330, BX = 830, YM = 260, YT = 110, YB = 410, YR = 540, XL = 60, XR = 1030;
  const WI = (I) => 2.5 * I; // 화살표 굵기는 전류에 비례

  // 도선
  mk("path", { d: `M105,${YM} H${XL} V${YR} H${XR} V${YM} H${BX}`, style: wire }, s);
  mk("path", { d: `M135,${YM} H${AX}`, style: wire }, s);
  mk("path", { d: `M${AX},${YM} V${YT} H535 M625,${YT} H${BX} V${YM}`, style: wire }, s);
  mk("path", { d: `M${AX},${YM} V${YB} H535 M625,${YB} H${BX} V${YM}`, style: wire }, s);

  // 전하 알갱이: 같은 길이당 알갱이 수가 전류에 비례한다 (간격 = 120 / I px)
  const flows = [
    { pts: [[135, YM], [AX, YM]], I: M.I, c: "var(--ltt-accent)", from: 1 },
    { pts: [[AX, YM], [AX, YT], [BX, YT], [BX, YM]], I: M.I1, c: "var(--ltt-c1)", from: 3 },
    { pts: [[AX, YM], [AX, YB], [BX, YB], [BX, YM]], I: M.I2, c: "var(--ltt-c2)", from: 3 },
    { pts: [[BX, YM], [XR, YM], [XR, YR], [XL, YR], [XL, YM], [105, YM]], I: M.I, c: "var(--ltt-accent)", from: 5 }
  ];
  flows.forEach((F) => {
    F.cum = [0]; for (let i = 1; i < F.pts.length; i++) F.cum.push(F.cum[i - 1] + Math.hypot(F.pts[i][0] - F.pts[i - 1][0], F.pts[i][1] - F.pts[i - 1][1]));
    F.len = F.cum[F.cum.length - 1]; F.sp = 120 / F.I; const n = Math.floor(F.len / F.sp);
    F.g = reg(mk("g", {}, s), F.from);
    F.dots = Array.from({ length: n }, () => mk("circle", { r: 4.5, style: `fill:${F.c}` }, F.g));
  });
  const place = (F, d) => { let i = 1; while (i < F.cum.length - 1 && d > F.cum[i]) i++;
    const k = (d - F.cum[i - 1]) / (F.cum[i] - F.cum[i - 1]), a = F.pts[i - 1], b = F.pts[i]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; };
  const flow = (t) => flows.forEach((F) => F.dots.forEach((c, k) => { const p = place(F, (k * F.sp + 45 * t) % F.len); c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); }));

  // 전원 (오른쪽 긴 판이 +)
  mk("line", { x1: 110, y1: YM - 14, x2: 110, y2: YM + 14, style: "stroke:var(--ltt-ink);stroke-width:5" }, s);
  mk("line", { x1: 135, y1: YM - 28, x2: 135, y2: YM + 28, style: "stroke:var(--ltt-ink);stroke-width:5" }, s);
  mk("text", { x: 152, y: YM - 22, style: "font-size:24px;font-weight:800;fill:var(--ltt-bad)" }, s, "+");
  mk("text", { x: 82, y: YM - 22, style: "font-size:24px;font-weight:800;fill:var(--ltt-ink-2)" }, s, "−");
  mk("text", { x: 122, y: YM + 62, "text-anchor": "middle", style: "font-size:20px;font-weight:700;fill:var(--ltt-ink)" }, s, "전원 12 V");

  // 저항
  const resistor = (y, name, ohm, c, ly) => {
    mk("rect", { x: 535, y: y - 22, width: 90, height: 44, style: "fill:var(--ltt-bg)" }, s);
    mk("polyline", { points: `535,${y} 547,${y} 555,${y - 16} 571,${y + 16} 587,${y - 16} 603,${y + 16} 611,${y} 625,${y}`, style: "fill:none;stroke:var(--ltt-ink);stroke-width:3.5;stroke-linejoin:round" }, s);
    const t = mk("text", { x: 580, y: ly, "text-anchor": "middle", style: "font-size:22px;font-weight:800" }, s);
    mk("tspan", { style: `fill:${c}` }, t, name); mk("tspan", { style: "fill:var(--ltt-ink)" }, t, ` = ${ohm} Ω`);
  };
  resistor(YT, "R1", R1, "var(--ltt-c1)", YT - 42);
  resistor(YB, "R2", R2, "var(--ltt-c2)", YB + 56);

  // 전류 화살표: 몸통 두께 = 전류 크기
  const arrow = (x1, y1, x2, y2, I, fill, ghost) => {
    const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI, w = WI(I), hl = 12 + w * 1.2, hw = w / 2 + 7;
    const g = mk("g", { transform: `translate(${x1},${y1}) rotate(${ang})` }, s);
    const d = `M0,${-w / 2} H${len - hl} V${-hw} L${len},0 L${len - hl},${hw} V${w / 2} H0 Z`;
    mk("path", { d, style: ghost ? `fill:none;stroke:var(--ltt-warn);stroke-width:2.5;stroke-dasharray:6 4` : `fill:${fill}` }, g);
    return g;
  };
  const val = (x, y, I, c, anchor, size) => mk("text", { x, y, "text-anchor": anchor || "middle", style: `font-size:${size || 26}px;font-weight:800;fill:${c}` }, s, `${I} A`);
  const ghostLab = (x, y) => mk("text", { x, y, "text-anchor": "end", style: "font-size:20px;font-weight:800;fill:var(--ltt-warn)" }, s, "예상 3 A?");
  const cA = "var(--ltt-accent)", c1 = "var(--ltt-c1)", c2 = "var(--ltt-c2)";

  // 단계 1: 본선 6 A
  reg(arrow(170, YM, 300, YM, M.I, cA), 1); reg(val(235, YM - 38, M.I, cA), 1);
  // 단계 2: 반반 유령 (예상)
  reg(arrow(AX, 235, AX, 150, 3, null, true), 2, 2); reg(ghostLab(AX - 18, 192), 2, 2);
  reg(arrow(AX, 285, AX, 370, 3, null, true), 2, 2); reg(ghostLab(AX - 18, 336), 2, 2);
  const guess = mk("text", { x: 580, y: 262, "text-anchor": "middle", style: "font-size:24px;font-weight:800;fill:var(--ltt-warn)" }, s);
  mk("tspan", { x: 580 }, guess, "예상: 3 A / 3 A ?"); mk("tspan", { x: 580, dy: 30, style: "font-size:18px;font-weight:600;fill:var(--ltt-ink-2)" }, guess, "실제 값이 아니다");
  reg(guess, 2, 2);
  // 단계 3: 실제 값 — 저항 앞(A에서 나감)과 뒤(B로 들어감)가 같다
  reg(arrow(AX, 235, AX, 150, M.I1, c1), 3); reg(val(AX - 18, 192, M.I1, c1, "end"), 3);
  reg(arrow(AX, 285, AX, 370, M.I2, c2), 3); reg(val(AX - 18, 336, M.I2, c2, "end"), 3);
  reg(arrow(BX, 150, BX, 235, M.I1, c1), 3); reg(val(BX - 18, 192, M.I1, c1, "end"), 3);
  reg(arrow(BX, 370, BX, 285, M.I2, c2), 3); reg(val(BX - 18, 336, M.I2, c2, "end"), 3);
  const ratio = mk("text", { x: 580, y: 168, "text-anchor": "middle", style: "font-size:20px" }, s);
  mk("tspan", { x: 580, style: "fill:var(--ltt-ink-2)" }, ratio, "저항이 작은 쪽이 더 굵다");
  mk("tspan", { x: 580, dy: 26, style: "font-weight:800;fill:var(--ltt-c3)" }, ratio, "비율 2 : 4 = R2 : R1");
  mk("tspan", { x: 580, dy: 26, style: "font-weight:700;fill:var(--ltt-c3)" }, ratio, "같은 전압 + 옴의 법칙");
  reg(ratio, 3, 9, 4);

  // 단계 4: A의 합 — 화면에서 가장 큰 글자
  const ringA = reg(mk("circle", { cx: AX, cy: YM, r: 30, style: "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:4;fill-opacity:.55" }, s), 4, 9, 5);
  const eq = mk("text", { x: 580, y: 276, "text-anchor": "middle", style: "font-size:38px;font-weight:800" }, s);
  mk("tspan", { style: `fill:${cA}` }, eq, "6 A"); mk("tspan", { style: "fill:var(--ltt-ink)" }, eq, " = ");
  mk("tspan", { style: `fill:${c1}` }, eq, "2 A"); mk("tspan", { style: "fill:var(--ltt-ink)" }, eq, " + "); mk("tspan", { style: `fill:${c2}` }, eq, "4 A");
  reg(eq, 4, 9, 5);
  const sign = mk("text", { x: 580, y: 308, "text-anchor": "middle", style: "font-size:22px;font-weight:700;fill:var(--ltt-ink)" }, s);
  mk("tspan", { style: `fill:${cA}` }, sign, "+6"); mk("tspan", {}, sign, "  "); mk("tspan", { style: `fill:${c1}` }, sign, "−2");
  mk("tspan", {}, sign, "  "); mk("tspan", { style: `fill:${c2}` }, sign, "−4"); mk("tspan", {}, sign, " = 0   (ΣI = 0)");
  reg(sign, 4, 9, 5);
  const kcl = mk("text", { x: 580, y: 346, "text-anchor": "middle", style: "font-size:20px" }, s);
  mk("tspan", { x: 580, style: "font-weight:800;fill:var(--ltt-accent)" }, kcl, "합 = KCL (전하 보존)");
  mk("tspan", { x: 580, dy: 26, style: "fill:var(--ltt-accent)" }, kcl, "들어온 전류 = 나간 전류");
  reg(kcl, 4, 9, 5);

  // 단계 5: 합류점 B
  reg(mk("circle", { cx: BX, cy: YM, r: 30, style: "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:4;fill-opacity:.55" }, s), 5);
  reg(arrow(860, YM, 970, YM, M.I, cA), 5); reg(val(915, YM - 38, M.I, cA), 5);
  reg(arrow(640, YR, 520, YR, M.I, cA), 5); reg(val(580, YR + 44, M.I, cA), 5);
  const beq = mk("text", { x: 930, y: 352, "text-anchor": "middle", style: "font-size:22px;font-weight:800" }, s);
  mk("tspan", { style: `fill:${c1}` }, beq, "2 A"); mk("tspan", { style: "fill:var(--ltt-ink)" }, beq, " + "); mk("tspan", { style: `fill:${c2}` }, beq, "4 A");
  mk("tspan", { style: "fill:var(--ltt-ink)" }, beq, " = "); mk("tspan", { style: `fill:${cA}` }, beq, "6 A");
  reg(beq, 5);

  // 마디
  [[AX, "분기점 A", AX - 18, YM + 38, "end"], [BX, "합류점 B", BX + 20, YM + 40, "start"]].forEach(([x, name, tx, ty, an]) => {
    mk("circle", { cx: x, cy: YM, r: 9, style: "fill:var(--ltt-ink);stroke:var(--ltt-bg);stroke-width:2" }, s);
    mk("text", { x: tx, y: ty, "text-anchor": an, style: "font-size:20px;font-weight:800;fill:var(--ltt-ink)" }, s, name);
  });

  function apply() {
    items.forEach((it) => { const vis = step >= it.from && step <= it.to; it.n.style.opacity = vis ? (step >= it.dimFrom ? 0.55 : 1) : 0; });
  }
  apply(); flow(0);
  return { el: s, flow, apply, get step() { return step; }, set step(v) { step = v; apply(); } };
}

let F = null, ui = null;
function controls(host) {
  const box = document.createElement("div"); box.className = "ctl"; host.appendChild(box);
  const say = document.createElement("div"); say.className = "say"; say.setAttribute("aria-live", "polite"); box.appendChild(say);
  const row = document.createElement("div"); row.className = "row"; box.appendChild(row);
  const mkb = (txt, cls, id) => { const b = document.createElement("button"); b.type = "button"; b.textContent = txt; if (cls) b.className = cls; if (id) b.id = id; row.appendChild(b); return b; };
  const prev = mkb("◀ 이전", "", "prev");
  const pips = STEPS.map((_, i) => mkb(String(i + 1), "pip", `pip${i + 1}`));
  const next = mkb("다음 ▶", "nx", "next");
  const go = (n) => { F.step = Math.max(1, Math.min(STEPS.length, n)); sync(); };
  function sync() {
    say.textContent = STEPS[F.step - 1];
    prev.disabled = F.step === 1; next.disabled = F.step === STEPS.length;
    pips.forEach((p, i) => p.setAttribute("aria-current", i + 1 === F.step ? "true" : "false"));
  }
  prev.onclick = () => go(F.step - 1); next.onclick = () => go(F.step + 1);
  pips.forEach((p, i) => { p.onclick = () => go(i + 1); });
  sync();
}
