<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>r5</title>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>

<script>
// ?partial adds an empty runtime entry and renames the last unknown-type scene to it; output must equal the plain run.
var partial = /[?&]partial\b/.test(location.search);
if (partial) LTT.sceneTypes.timeline = {};
var pts = [{ at: [20, 30], text: "첫 점" }, { at: [60, 70], text: "둘째 점" }];
function draw(body) { var d = document.createElement("div"); d.setAttribute("data-annotate", ""); d.style.height = "240px"; d.textContent = "그림"; body.appendChild(d); return {}; }
LTT.deck({ title: "R-5 fixture", theme: "paper", scenes: [
  { type: "figure", title: "그림 장면", caption: "캡션", figure: "<svg viewBox='0 0 100 60' width='400'><rect width='100' height='60'></rect></svg>" },
  { title: "타입 없는 장면", sub: "부제", narration: "해설 문장.", points: pts, mount: draw },
  { title: "타입 없는 장면 2", kicker: "킥", mount: draw },
  { type: "foo", title: "없는 타입", sub: "부제", narration: "해설 문장.", points: pts, mount: draw },
  { type: partial ? "timeline" : "foo", title: "없는 타입 2", narration: "해설 문장.", points: pts, mount: draw },
  { type: "keywords", terms: [{ ko: "용어" }] }
] });
</script>
