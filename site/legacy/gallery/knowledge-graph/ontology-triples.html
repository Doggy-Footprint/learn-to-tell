<title>테이블이면 충분할까, 온톨로지가 필요할까?</title>
<script type="application/json" id="ltt-meta">{"domain":"지식 표현","topic":"온톨로지 기초: 트리플·RDF·Turtle·SPARQL·RDFS/OWL 추론·열린 세계 가정·SHACL·활용","audience":"SQL 테이블과 JSON은 다뤄 봤다. RDF·OWL은 처음이다","pattern":["hook","terms","compare:table","figure","mount","figure","compare:table","figure","mount","explain:stack","predict","figure","compare","statement","compare:table","contrast","explain:strip","compare:table","explain","explain:strip","predict","summary","summary","overview","keywords"],"theme":"paper","medium":"교과서 그림: 예제 지식 그래프 한 장(elk 자동 배치)을 TBox·ABox 영역으로 나눠 그리고, 같은 그래프 위에 질의 패턴·추론으로 생긴 점선 엣지를 단계적으로 얹는다. 표기는 Turtle·SPARQL 코드 조각","mode":"체험형: 다섯 단어를 그림으로 풀고 트리플로 그래프를 쌓은 뒤, 적히지 않은 사실을 짐작하고 추론 규칙을 하나씩 켜서 새 엣지가 생기는 것을 본다. OWA와 SHACL은 같은 질문을 두 세계관으로 비교한다","decision":"데이터를 테이블 스키마로 충분히 다룰 수 있는지, 온톨로지(RDFS·OWL 추론)와 SHACL 검증을 얹어야 하는지"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>

<style>
  .kg { width: 100%; }
  .kg.wide, .ladder { width: 880px; max-width: 100%; }
  .ladder .ltt-code { width: 100%; font-size: 17px; }
  .kg svg { width: 100%; max-height: 38vh; }

  /* 이 수업의 keywords는 신호와 이웃 개념이 가운데 칸에 몰려 있어, 가운데 칸을 넓혀 줄바꿈을 줄인다. */

<body>
<script>
  // 손으로 따라간 추론 결과 (추론기 코드보다 먼저)
  // shannon a Person: wrote domain Person + shannon wrote mtc (rdfs:domain)
  // mtc writtenBy shannon: wrote inverseOf writtenBy + shannon wrote mtc (owl:inverseOf)
  // entropy prereqOf mutualInfo: entropy→condEntropy→mutualInfo, prereqOf는 추이적 (owl:TransitiveProperty)
  // kl relatedTo entropy: relatedTo는 대칭 (owl:SymmetricProperty)
  // mtc mentions entropy: covers subPropertyOf mentions (rdfs:subPropertyOf)
  // itila covers kl: 적힌 적도, 유도되는 규칙도 없다 → 거짓
  const EXPECTED_BY_HAND = { shannonPerson: true, mtcBy: true, chain: true, klSym: true, mention: true, itilaKl: false };

  const T = (s, p, o) => ({ s, p, o });
  const TBOX = [
    T("Book", "subClassOf", "Work"), T("Paper", "subClassOf", "Work"),
    T("wrote", "domain", "Person"), T("wrote", "range", "Work"), T("wrote", "inverseOf", "writtenBy"),
    T("covers", "domain", "Work"), T("covers", "range", "Concept"), T("covers", "subPropertyOf", "mentions"),
    T("prereqOf", "type", "Transitive"), T("prereqOf", "range", "Concept"), T("relatedTo", "type", "Symmetric"),
  ];
  const ABOX = [
    T("mackay", "type", "Person"), T("mackay", "wrote", "itila"), T("itila", "type", "Book"), T("itila", "covers", "entropy"), T("itila", "covers", "mutualInfo"),
    T("shannon", "wrote", "mtc"), T("mtc", "type", "Paper"), T("mtc", "covers", "entropy"),
    T("entropy", "type", "Concept"), T("entropy", "prereqOf", "condEntropy"), T("condEntropy", "prereqOf", "mutualInfo"), T("entropy", "relatedTo", "kl"),
  ];
  const RULES = ["dom", "rng", "sct", "typ", "spo", "inv", "sym", "trn"];
  // Forward chaining to a fixpoint; each derived triple keeps the rule that made it so captions can say why an edge appeared.
  const reason = (on) => {
    const all = [...TBOX, ...ABOX], seen = new Set(all.map((t) => t.s + "|" + t.p + "|" + t.o)), derived = [];
    const add = (s, p, o, rule) => { const k = s + "|" + p + "|" + o; if (seen.has(k)) return false; seen.add(k); const t = { s, p, o, rule }; all.push(t); derived.push(t); return true; };
    const schema = (s, p) => all.filter((u) => u.s === s && u.p === p).map((u) => u.o);
    for (let changed = true; changed;) {
      changed = false;
      for (const t of all.slice()) {
        if (on.sct && t.p === "subClassOf") for (const o of schema(t.o, "subClassOf")) changed = add(t.s, "subClassOf", o, "sct") || changed;
        if (on.typ && t.p === "type") for (const o of schema(t.o, "subClassOf")) changed = add(t.s, "type", o, "typ") || changed;
        if (["type", "subClassOf", "domain", "range", "inverseOf", "subPropertyOf"].includes(t.p)) continue;
        if (on.dom) for (const c of schema(t.p, "domain")) changed = add(t.s, "type", c, "dom") || changed;
        if (on.rng) for (const c of schema(t.p, "range")) changed = add(t.o, "type", c, "rng") || changed;
        if (on.spo) for (const q of schema(t.p, "subPropertyOf")) changed = add(t.s, q, t.o, "spo") || changed;
        if (on.inv) for (const q of schema(t.p, "inverseOf")) changed = add(t.o, q, t.s, "inv") || changed;
        const kinds = schema(t.p, "type");
        if (on.sym && kinds.includes("Symmetric")) changed = add(t.o, t.p, t.s, "sym") || changed;
        if (on.trn && kinds.includes("Transitive")) for (const u of all.slice()) if (u.p === t.p && u.s === t.o && u.o !== t.s) changed = add(t.s, t.p, u.o, "trn") || changed;
      }
    }
    return { derived, has: (s, p, o) => seen.has(s + "|" + p + "|" + o) };
  };
  const ruleSet = (ids) => Object.fromEntries(RULES.map((r) => [r, ids.includes(r)]));
  const FULL = reason(ruleSet(RULES));
  LTT.expect("shannon a Person", +FULL.has("shannon", "type", "Person"), +EXPECTED_BY_HAND.shannonPerson);
  LTT.expect("mtc writtenBy shannon", +FULL.has("mtc", "writtenBy", "shannon"), +EXPECTED_BY_HAND.mtcBy);
  LTT.expect("entropy prereqOf mutualInfo", +FULL.has("entropy", "prereqOf", "mutualInfo"), +EXPECTED_BY_HAND.chain);
  LTT.expect("kl relatedTo entropy", +FULL.has("kl", "relatedTo", "entropy"), +EXPECTED_BY_HAND.klSym);
  LTT.expect("mtc mentions entropy", +FULL.has("mtc", "mentions", "entropy"), +EXPECTED_BY_HAND.mention);
  LTT.expect("itila covers kl", +FULL.has("itila", "covers", "kl"), +EXPECTED_BY_HAND.itilaKl);

  // One knowledge graph for the whole lesson. Inferred edges are laid out together with asserted ones so the picture does not jump when they appear.
  const C = (id, s) => ({ id, l: "ex:" + id, s, k: "accent", group: "tbox" });
  const I = (id, s) => ({ id, l: "ex:" + id, s, group: "abox" });
  const L = (id, l) => ({ id, l, s: "리터럴", k: "muted", w: 92, group: "abox" });
  const E = (f, t, l, k) => ({ f, t, l, k: k || "", dash: false });
  const X = (f, t, l) => ({ f, t, l, k: "warn", dash: true, inf: true, main: false });
  const KG_SPEC = {
    direction: "RIGHT", node: [128, 54], spacing: [24, 32], maxWidth: false,
    groups: [{ id: "abox", l: "ABox · 실제 데이터" }, { id: "tbox", l: "TBox · 클래스 정의", k: "accent" }],
    nodes: [
      I("mackay", "맥케이"), I("shannon", "섀넌 · 타입 없음"), I("itila", "맥케이의 책"), I("mtc", "섀넌의 1948 논문"),
      L("y2003", "2003"), L("y1948", "1948"),
      I("entropy", "엔트로피"), I("condEntropy", "조건부 엔트로피"), I("mutualInfo", "상호정보량"), I("kl", "KL 발산"),
      C("Person", "사람"), C("Book", "책"), C("Paper", "논문"), C("Work", "저작물"), C("Concept", "개념"),
    ],
    edges: [
      E("mackay", "itila", "wrote", "accent"), E("shannon", "mtc", "wrote", "accent"),
      E("itila", "y2003", "year"), E("mtc", "y1948", "year"),
      E("itila", "entropy", "covers"), E("itila", "mutualInfo", "covers"), E("mtc", "entropy", "covers"),
      E("entropy", "condEntropy", "prereqOf"), E("condEntropy", "mutualInfo", "prereqOf"), E("entropy", "kl", "relatedTo"),
      E("mackay", "Person", "a", "muted"), E("itila", "Book", "a", "muted"), E("mtc", "Paper", "a", "muted"), E("entropy", "Concept", "a", "muted"),
      E("Book", "Work", "subClassOf", "muted"), E("Paper", "Work", "subClassOf", "muted"),
      X("shannon", "Person", "a"), X("mtc", "shannon", "writtenBy"), X("entropy", "mutualInfo", "prereqOf"), X("kl", "entropy", "relatedTo"),
    ],
  };
  const KG = LTT.autoLayout(KG_SPEC);
  const INF_KEY = { "shannon>Person": ["shannon", "type", "Person"], "mtc>shannon": ["mtc", "writtenBy", "shannon"], "entropy>mutualInfo": ["entropy", "prereqOf", "mutualInfo"], "kl>entropy": ["kl", "relatedTo", "entropy"] };
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const sheet = (node) => {
    const w = node.appendChild(Object.assign(document.createElement("div"), { className: "kg" }));
    return { w, svg: w.appendChild(svgEl()) };
  };
  // keep(edge) decides which inferred edges are drawn; asserted edges are always drawn.
  let kgLayout;
  const drawKG = (svg, keep = () => false) => {
    const spec = structuredClone(kgLayout);
    spec.edges = spec.edges.filter((e) => !e.inf || keep(e.f + ">" + e.t));
    svg.innerHTML = "";
    return LTT.diagram(svg, spec);
  };
  const reasonedKeep = (ids) => { const r = reason(ruleSet(ids)); return (k) => r.has(...INF_KEY[k]); };

  const LADDER = [
    "ex:Book rdfs:subClassOf ex:Work .\nex:Paper rdfs:subClassOf ex:Work .\n\nex:wrote rdfs:domain ex:Person ;\n         rdfs:range  ex:Work .\nex:covers rdfs:subPropertyOf ex:mentions .",
    "ex:wrote owl:inverseOf ex:writtenBy .\nex:relatedTo a owl:SymmetricProperty .\nex:prereqOf  a owl:TransitiveProperty .\nex:birthDate a owl:FunctionalProperty .\nex:hasISBN   a owl:InverseFunctionalProperty .",
    "ex:Book rdfs:subClassOf [ a owl:Restriction ;\n  owl:onProperty ex:writtenBy ;\n  owl:minCardinality 1 ] .\n\nex:StudyMaterial owl:unionOf ( ex:Book ex:Paper ) .\nex:Person owl:disjointWith ex:Work .\nex:AdvancedTopic owl:equivalentClass [ a owl:Restriction ;\n  owl:onProperty ex:prereqCount ; owl:minCardinality 3 ] .",
    "ex:shannon owl:sameAs dbr:Claude_Shannon .\nex:Person owl:equivalentClass foaf:Person .\nex:a owl:differentFrom ex:b .",
  ];
  const code = (src, title, marks) => LTT.mock.code({ code: src, title, marks, numbers: false }).el;

  const tv = (body) => `<svg class="ltt-svg" viewBox="0 0 220 100" style="max-height:110px">${body}</svg>`;
  const tx = (x, y, s, st = "") => `<text x="${x}" y="${y}" text-anchor="middle" style="${st}">${s}</text>`;
  const box = (x, y, w, h, st) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" style="${st}"/>`;
  const arrow = (x1, x2, y) => `<path d="M${x1} ${y}H${x2 - 6}" style="stroke:var(--ltt-ink-2);stroke-width:1.6"/><path d="M${x2 - 8} ${y - 5}L${x2} ${y}L${x2 - 8} ${y + 5}" style="fill:none;stroke:var(--ltt-ink-2);stroke-width:1.6"/>`;
  const IND = "fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1.5", CLS = "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:1.8", LIT = "fill:none;stroke:var(--ltt-muted);stroke-width:1.4;stroke-dasharray:4 3";
  const MUTED = "font-size:11px;fill:var(--ltt-muted)", BOLD = "font-size:12px;font-weight:700";
  const TERM_VIS = {
    entity: tv(box(50, 22, 120, 40, IND) + tx(110, 47, "ex:shannon", BOLD) + tx(110, 88, "이름 하나 = 대상 하나", MUTED)),
    cls: tv(`<ellipse cx="110" cy="44" rx="92" ry="34" style="${CLS}"/>` + tx(110, 26, "ex:Person", BOLD)
      + [[70, 52], [110, 58], [150, 50]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" style="fill:var(--ltt-ink-2)"/>`).join("") + tx(110, 94, "개체들의 집합", MUTED)),
    rel: tv(box(6, 26, 74, 34, IND) + tx(43, 48, "shannon", BOLD) + box(140, 26, 74, 34, IND) + tx(177, 48, "mtc", BOLD) + arrow(80, 140, 43) + tx(110, 36, "wrote", "font-size:11px;fill:var(--ltt-accent);font-weight:700") + tx(110, 88, "개체 → 개체: 그래프의 화살표", MUTED)),
    prop: tv(box(6, 26, 74, 34, IND) + tx(43, 48, "mtc", BOLD) + box(140, 26, 74, 34, LIT) + tx(177, 48, "1948", BOLD) + arrow(80, 140, 43) + tx(110, 36, "year", "font-size:11px;fill:var(--ltt-ink-2);font-weight:700") + tx(110, 88, "개체 → 값: 그래프의 잎", MUTED)),
    axiom: tv(tx(110, 30, "wrote : Person → Work", "font-size:13px;font-weight:700;font-family:var(--ltt-mono)") + `<path d="M30 46H190" style="stroke:var(--ltt-line-2)"/>`
      + tx(110, 66, "규칙도 데이터와 같은 자리에", "font-size:12px;fill:var(--ltt-ink-2)") + tx(110, 90, "추론용 · 검증용", MUTED)),
  };

  // Ten recall questions plus their reserved answer space overflow one screen, so the recap is two summary scenes;
  // each takes its `recap` range of the cards the kit would gather, keeping every takeaway exactly once.
  const splitRecap = (spec) => {
    const cards = LTT.summaryCards({}, spec.scenes);
    spec.scenes.forEach((s) => { if (s.recap) s.cards = cards.slice(...s.recap); });
    return spec;
  };

  // The deck is built after elk finishes so figures (and ?audit) measure the drawn graph, not an empty svg.
  KG.then((sp) => { kgLayout = sp; LTT.deck(splitRecap({
    title: "테이블이면 충분할까, 온톨로지가 필요할까?",
    theme: "paper",
    glossary: {
      "택소노미": "개념을 상위·하위 계층으로만 정리한 것. 폴더 트리나 태그 트리. 계층 말고 다른 종류의 연결은 적지 못한다.",
      "트리플": "<주어, 술어, 목적어> 세 칸짜리 문장 하나. RDF는 모든 사실을 이 모양으로 적고, 트리플을 모은 것이 곧 그래프다.",
      "RDF": "Resource Description Framework. 사실을 트리플로 적는 W3C 표준. '적는 법'만 정하고 의미는 RDFS·OWL이 얹는다.",
      "TBox": "terminology box. 클래스와 관계의 정의(스키마에 해당). ABox와 같은 트리플 형식으로 같은 저장소에 산다.",
      "ABox": "assertion box. 실제 개체에 대한 사실(데이터에 해당).",
      "IRI": "URL 모양의 전역 식별자. https://example.org/study#shannon 같은 이름을 접두어로 줄여 ex:shannon이라 쓴다. 두 시스템이 같은 IRI를 쓰면 같은 것을 가리킨다.",
      "리터럴": "문자열·숫자·날짜 같은 값. \"1948\"^^xsd:gYear처럼 데이터 타입이나 \"엔트로피\"@ko처럼 언어 태그를 붙인다. 목적어 칸에만 올 수 있어 항상 그래프의 잎이다.",
      "공백 노드": "blank node. 이름(IRI) 없이 '무언가 하나가 있다'고만 말하는 노드. 주소·좌표처럼 구조는 있지만 전역 정체성이 없는 값에 쓴다. 밖에서 가리킬 수 없다.",
      "Turtle": "사람이 손으로 읽고 쓰는 RDF 표기법(.ttl). '주어 술어 목적어 .'의 반복에 몇 가지 축약을 더했다.",
      "SPARQL": "RDF 그래프 질의 언어. 찾을 모양을 트리플 패턴으로 적고 모르는 자리에 ?변수를 두면, 그 모양과 맞는 값을 돌려준다.",
      "RDFS": "RDF Schema. 클래스 계층(subClassOf), 속성 계층(subPropertyOf), 정의역·치역(domain·range)만 다루는 가장 얕은 의미 층.",
      "OWL": "Web Ontology Language. RDFS 위에 관계의 성격(역·대칭·추이), 개수 제약, 집합 연산으로 만든 클래스, 동일성(sameAs)을 더한 언어.",
      "추론기": "reasoner. 명시된 트리플과 공리에 규칙을 반복 적용해 더 이상 새 사실이 나오지 않을 때까지 트리플을 만든다. 모순(일관성) 검사도 한다.",
      "열린 세계 가정": "OWA(Open World Assumption). 적혀 있지 않은 사실은 거짓이 아니라 아직 모르는 것으로 본다. OWL이 이렇게 읽는다.",
      "닫힌 세계 가정": "CWA(Closed World Assumption). 적혀 있지 않은 사실은 거짓으로 본다. SQL에서 행이 없으면 '없다'고 읽는 방식.",
      "SHACL": "Shapes Constraint Language. RDF 데이터가 정해 둔 모양(필수 속성, 개수, 타입)을 지키는지 검사하고 위반 보고서를 낸다. 닫힌 세계로 읽는다.",
      "SKOS": "개념과 '더 넓은·더 좁은 개념', 다른 체계와의 대응(exactMatch)만 다루는 가벼운 W3C 어휘. 용어 사전·태그 체계 정리에 맞다.",
      "GraphRAG": "지식 그래프에서 질문과 관련된 부분 그래프를 찾아 LLM의 컨텍스트로 넣는 방법. 답의 근거를 트리플 단위로 가리킬 수 있다.",
    },
    scenes: [
      { type: "hook", art: "network", kicker: "데이터 모델을 고르기 전에",
