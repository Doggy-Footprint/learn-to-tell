<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금리가 오르면 채권 가격은 얼마나 떨어질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"경제·금융","topic":"금리 변화와 채권 가격(듀레이션)","audience":"복리와 현재가치(할인)를 대략 알고 채권은 처음인 사람","pattern":["hook","explain","predict","compare","keywords"],"mode":"체험형: 금리 변화에 따른 가격 변화를 짐작해 본 뒤 인포그래픽 정답으로 확인한다(계산 결과 예측이라 자기 편향을 겨냥하지 않는다)","decision":"만기와 금리 변동폭에 따라 채권 가격이 얼마나 움직이는지(듀레이션)"}</script>
<link rel="stylesheet" href="/legacy/kit-v1/vendor/katex/katex.min.css">
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/vendor/katex/katex.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
  .vis svg { width: 100%; height: auto; }
  .cfkey { font-size: 13px; color: var(--ltt-muted); }
  .cfkey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; }
</style>
</head>
<body>
<script>
  // EXPECTED_BY_HAND (모델 코드보다 먼저 손계산. 쿠폰 3, 액면 100, 연 1회)
  // 10년, y=5%: 1.05^-10=0.613913, 연금계수=(1-0.613913)/0.05=7.721735 -> 3*7.721735+61.3913=84.5565 -> -15.44%
  // 10년, y=3% 수정 듀레이션: 액면가 거래(par)이므로 연금계수 (1-1.03^-10)/0.03=8.5302 -> 근사 -8.5302*2=-17.06%
  // 2년,  y=5%: 1.05^-2=0.907029, 연금계수 1.859410 -> 5.57823+90.7029=96.2811 -> -3.72%
  // 30년, y=5%: 1.05^-30=0.231377, 연금계수 15.3725 -> 46.1175+23.1377=69.2552 -> -30.74%
  const EXPECTED_BY_HAND = { p10: 84.5565, chg10: -15.44, approx10: -17.06, chg2: -3.72, chg30: -30.74, p10_3: 100 };
  const COUPON = 3, FACE = 100, Y0 = 3;
  const flows = (n) => d3.range(1, n + 1).map((t) => ({ t, cf: COUPON + (t === n ? FACE : 0) }));
  const price = (y, n) => flows(n).reduce((s, f) => s + f.cf / Math.pow(1 + y / 100, f.t), 0);
  const modDur = (y, n) => flows(n).reduce((s, f) => s + f.t * f.cf / Math.pow(1 + y / 100, f.t), 0) / price(y, n) / (1 + y / 100);
  const chg = (y, n) => (price(y, n) / price(Y0, n) - 1) * 100;
  const approx = (y, n) => -modDur(Y0, n) * (y - Y0);
  LTT.expect("10년 y=3% 가격", price(3, 10), EXPECTED_BY_HAND.p10_3, { tol: 1e-6 });
  LTT.expect("10년 y=5% 가격", price(5, 10), EXPECTED_BY_HAND.p10, { tol: 1e-3 });
  LTT.expect("10년 변화율", chg(5, 10), EXPECTED_BY_HAND.chg10, { tol: 0.01 });
  LTT.expect("10년 듀레이션 근사", approx(5, 10), EXPECTED_BY_HAND.approx10, { tol: 0.01 });
  LTT.expect("2년 변화율", chg(5, 2), EXPECTED_BY_HAND.chg2, { tol: 0.01 });
  LTT.expect("30년 변화율", chg(5, 30), EXPECTED_BY_HAND.chg30, { tol: 0.01 });

  const f1 = d3.format(".1f");
  const pct = (v) => (v > 0 ? "+" : "") + f1(v) + "%";
  // Grey bar = cash to be received in year t; blue bar = its present value at rate y. `to(y)` re-discounts with motion.
  function cashflow(node, n, y, VH = 120) {
    const VW = 480, base = VH - 4, data = flows(n);
    const svg = d3.select(node).append("svg").attr("class", "ltt-svg").attr("viewBox", `0 0 ${VW} ${VH}`);
    const x = d3.scaleBand().domain(data.map((d) => d.t)).range([0, VW]).padding(0.15);
    const h = d3.scaleLinear([0, FACE + COUPON], [0, VH - 8]);
    svg.selectAll("rect.n").data(data).join("rect").attr("fill", "var(--ltt-line)").attr("x", (d) => x(d.t)).attr("width", x.bandwidth())
      .attr("y", (d) => base - h(d.cf)).attr("height", (d) => h(d.cf));
    const pv = svg.selectAll("rect.p").data(data).join("rect").attr("fill", "var(--ltt-accent)").attr("x", (d) => x(d.t)).attr("width", x.bandwidth())
      .attr("y", base).attr("height", 0);
    const to = (yy) => pv.transition().delay((d, i) => i * (LTT.MOTION_MS ? 900 / n : 0)).duration(LTT.MOTION_MS)
      .attr("y", (d) => base - h(d.cf / Math.pow(1 + yy / 100, d.t))).attr("height", (d) => h(d.cf / Math.pow(1 + yy / 100, d.t)));
    to(y);
    return { to };
  }
  const KEY = `<span class="cfkey"><i style="background:var(--ltt-line)"></i>받을 돈<i style="background:var(--ltt-accent)"></i>지금 가치</span>`;
  const matItem = (n, tone, note) => ({ label: `${n}년 만기, 쿠폰 3%`, tone, verdict: "가격 " + pct(chg(5, n)), noteAfter: true, note,
    visual: (node) => { const c = cashflow(node, n, Y0, 90); setTimeout(() => c.to(5), 500); } });

  LTT.deck({
    title: "금리가 오르면 채권 가격은 얼마나 떨어질까?",
    scenes: [
      { type: "hook", art: "📉",
        text: "안전하다던 채권 펀드가<br>금리 인상기에 <u>두 자릿수</u> 손실을 낸다.",
        sub: "금리 상승기에 어떤 채권을 담을지 정할 때, 손실 크기는 거의 '만기(듀레이션)' 하나로 가늠한다." },

      { type: "explain", kicker: "원리", title: "채권 가격 = 미래에 받을 돈의 지금 가치",
        steps: [
          { icon: "📅", title: "정해진 돈", text: "쿠폰과 원금 100은 금액과 날짜가 고정돼 있다." },
          { icon: "🔻", title: "금리로 할인", text: "시장 금리가 오르면 미래의 돈을 지금 가치로 더 많이 깎는다." },
          { icon: "⏳", title: "먼 돈일수록 더", text: "할인은 해마다 곱해지므로 늦게 받는 원금이 가장 크게 깎인다." },
        ],
        tex: "P=\\sum_{t=1}^{n}\\frac{C_t}{(1+y)^t}",
        basis: "단순화: 액면 100, 연 1회 쿠폰, 모든 만기의 금리가 같다(평평한 수익률 곡선). 실제 채권은 반년 지급이 많고 신용위험이 얹힌다." },

      { type: "predict", kicker: "짐작해 보기", title: "쿠폰 3%·10년 채권, 금리가 3% → 5%면 가격은?",
        sub: "금리 3%일 때 이 채권은 액면 100에 거래된다.",
        question: "시장 금리 3%→5%일 때 10년 만기 3% 쿠폰 채권(연 1회 지급) 가격 변화(%)",
        choices: [{ id: "2", text: "약 −2% (금리 오른 만큼)" }, { id: "8", text: "약 −8%" }, { id: "15", text: "약 −15%" }, { id: "30", text: "약 −30%" }],
        answer: "15",
        why: `<b>${pct(chg(5, 10))}</b>, 가격 ${f1(price(5, 10))}(모델로 계산한 예시). 파란 막대가 줄어든 만큼이 손실이고, 10년째 원금이 가장 많이 줄었다.`,
        answerVisual(n) {
          const box = document.createElement("div");
          box.innerHTML = KEY;
          box.style.maxWidth = "560px";
          n.appendChild(box);
          const cf = cashflow(box, 10, Y0, 110);
          setTimeout(() => cf.to(5), 400);
        } },

      { type: "compare", kicker: "만기별", title: "같은 금리 +2%p, 만기만 다른 세 채권",
        sub: `쿠폰 3%, 금리 3% → 5%. ${KEY}`,
        revealLabel: "가격 변화 보기",
        items: [
          matItem(2, "good", "곧 원금을 돌려받아 거의 안 깎인다."),
          matItem(10, "warn", "앞의 예측 문제."),
          matItem(30, "bad", "원금이 30년 뒤라 크게 깎인다."),
        ],
        basis: "모델로 계산한 예시. 금리 1–8%, 쿠폰 3%는 교육용 가정이다." },

      { type: "explain", kicker: "어림셈", title: "변화율 ≈ −듀레이션 × 금리 변화",
        steps: [
          { icon: "📐", title: `10년물 듀레이션 ${f1(modDur(Y0, 10))}`, text: "금리 1%p 오를 때 가격이 약 이만큼(%) 내린다는 민감도." },
          { icon: "🧮", title: `근사 ${pct(approx(5, 10))}`, text: `${f1(modDur(Y0, 10))} × 2%p. 빠르게 손실 규모를 잡는다.` },
          { icon: "🌙", title: `실제 ${pct(chg(5, 10))}`, text: "가격 곡선이 볼록해 상승기엔 근사가 손실을 과대, 하락기엔 이득을 과소평가한다." },
        ],
        tex: "\\frac{\\Delta P}{P}\\approx -D_{mod}\\,\\Delta y",
        basis: "모델로 계산한 예시. 변화가 클수록 근사와 실제의 틈이 벌어진다." },

      { type: "explain", kicker: "주의", title: "가격 하락이 곧 손실은 아니다",
        steps: [
          { icon: "🏁", title: "만기 보유", text: "끝까지 들고 있으면 쿠폰과 원금 100은 그대로 받는다. 하락은 중간 매도·평가손의 이야기." },
          { icon: "🧾", title: "채권 펀드", text: "펀드는 만기가 없고 계속 갈아타므로 듀레이션만큼 흔들린다." },
          { icon: "⚠️", title: "신용위험 별개", text: "발행자 부도 위험은 이 계산에 없다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "듀레이션", en: "modified duration" }, { ko: "볼록성", en: "convexity" }],
        signals: ["금리 인상·인하 뉴스와 채권(펀드)이 같이 나올 때", "단기채와 장기채 중 하나를 골라야 할 때", "\"채권은 안전 자산\"이라는 말만으로 담으려 할 때"],
        queries: ["bond price yield relationship duration", "modified duration convexity approximation", "bond fund duration interest rate risk", "hold to maturity vs mark to market"],
        neighbors: [
          { term: "만기수익률(YTM)", diff: "지금 사서 만기까지 들 때의 수익률. 듀레이션은 가격 민감도." },
          { term: "신용 스프레드", diff: "발행자 부도 위험 때문에 더 붙는 금리. 금리 위험과 따로 움직인다." },
        ] },
    ],
  });
</script>
</body>
</html>
