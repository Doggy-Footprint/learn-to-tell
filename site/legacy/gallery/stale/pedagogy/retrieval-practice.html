<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다시 읽기와 인출 연습, 1주 뒤엔 어느 쪽이 더 남을까?</title>
<script type="application/json" id="ltt-meta">{"domain":"교육학","topic":"인출 연습(testing effect)","audience":"전제 지식 없음","pattern":["hook","explain","predict","compare","keywords"],"mode":"체험형: 다른 사람들이 참여한 실험 결과를 짐작해 본 뒤 인포그래픽 정답으로 확인한다(사용자 자신의 편향을 시험하지 않는다)","decision":"복습 시간을 다시 읽기와 인출 연습 중 어디에 쓸지"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
  :root { --read: #9aa6d4; --test: #4f6bed; }
  .pair { display: grid; gap: 8px; width: 100%; }
  .pair .ltt-bar { height: 30px; }
  .ex { font-size: 14px; text-align: center; line-height: 1.5; }
  .ex b { display: block; font-size: 30px; }
</style>
</head>
<body>
<script>
  // EXPECTED_BY_HAND: 논문 값(불확실)에서 손으로 뺀 차이. 5분 뒤 71-83=-12, 1주 뒤 61-40=21.
  const DATA = [{ read: 83, test: 71 }, { read: 40, test: 61 }];
  const EXPECTED_BY_HAND = { diff5min: -12, diff1wk: 21 };
  DATA.forEach((d, i) => LTT.expect(i ? "1주 뒤 차이" : "5분 뒤 차이", d.test - d.read, i ? EXPECTED_BY_HAND.diff1wk : EXPECTED_BY_HAND.diff5min, { tol: 0 }));

  // Bars start empty and grow on `fire`, so the ranking flip is seen as motion rather than read as numbers.
  function pair(node, d) {
    const box = document.createElement("div");
    box.className = "pair";
    node.appendChild(box);
    const mk = (c) => { const e = document.createElement("div"); box.appendChild(e); return LTT.bar(e, [{ color: c }, { color: "transparent" }]); };
    const r = mk("var(--read)"), t = mk("var(--test)");
    r.set([0, 100]); t.set([0, 100]);
    return () => { r.set([d.read, 100 - d.read], [`다시 읽기 ${d.read}%`, ""]); t.set([d.test, 100 - d.test], [`인출 ${d.test}%`, ""]); };
  }
  const SRC = "Roediger & Karpicke (2006) Psychological Science 실험 1(대학생, 산문 글, 떠올릴 때 정답 안 알려 줌). 방향과 1주 뒤 차이 약 21%p는 검색으로 확인. 83/71, 40/61 개별 값은 기억에 의존했고 원문 표로 재확인하지 못했다(불확실).";
  const ex = (icon, t) => `<div class="ex"><b>${icon}</b>${t}</div>`;

  LTT.deck({
    title: "다시 읽기와 인출 연습, 1주 뒤엔 어느 쪽이 더 남을까?",
    scenes: [
      { type: "hook", art: "📖",
        text: "네 번 읽으면 다 아는 것 같다.<br>그런데 <u>일주일 뒤</u>에도 남아 있을까?",
        sub: "시험까지 남은 복습 시간을 '다시 읽기'와 '책 덮고 떠올리기' 중 어디에 쓸지 정한다." },

      { type: "explain", kicker: "원리", title: "꺼내 본 기억이 다음에도 꺼내진다",
        steps: [
          { icon: "👀", title: "다시 읽기", text: "글이 눈앞에 있어 술술 읽힌다. 익숙함이 '안다'는 느낌을 만든다." },
          { icon: "🪝", title: "떠올리기", text: "책을 덮고 꺼내려 애쓰는 과정이 그 기억으로 가는 길을 강화한다." },
          { icon: "📆", title: "며칠 뒤 차이", text: "시험도 '꺼내기'다. 꺼내 본 연습이 많을수록 지연 시험에서 남는다." },
        ] },

      { type: "predict", kicker: "짐작해 보기", title: "1주 뒤 시험, 어느 조가 더 많이 기억했을까?",
        sub: "같은 글을 한 조는 4번 읽고, 다른 조는 1번 읽은 뒤 3번 책 없이 떠올려 썼다.",
        question: "4번 읽기 vs 1번 읽고 3번 떠올리기, 1주 뒤 어느 쪽이 더 높은가",
        choices: [{ id: "read", text: "4번 읽은 조" }, { id: "test", text: "떠올려 쓴 조" }, { id: "same", text: "비슷하다" }],
        answer: "test",
        why: "떠올려 쓴 조가 약 <b>21%p</b> 높았다. 읽은 횟수는 적었는데도.",
        answerVisual: (n) => { const fire = pair(n, DATA[1]); setTimeout(fire, 100); },
        basis: SRC },

      { type: "compare", kicker: "같은 실험, 시험 시점만 다르게", title: "5분 뒤 시험과 1주 뒤 시험에서 순위가 뒤집혔다",
        reveal: false,
        items: [
          { label: "5분 뒤 시험", visual: (n, ctx) => { const f = pair(n, DATA[0]); setTimeout(f, 300); }, tone: "warn", verdict: "다시 읽기가 12%p 앞섬",
            note: "막 읽은 내용은 아직 눈앞에 있다. 벼락치기가 '효과 있어 보이는' 이유." },
          { label: "1주 뒤 시험", visual: (n) => { const f = pair(n, DATA[1]); setTimeout(f, 900); }, tone: "good", verdict: "인출 연습이 21%p 앞섬",
            note: "읽기 조는 절반 넘게 잊었고 인출 조는 덜 잊었다." },
        ],
        basis: SRC },

      { type: "compare", kicker: "실제 공부법", title: "이 공부법들, '꺼내기'가 들어 있을까?",
        revealLabel: "판정 보기",
        items: [
          { label: "플래시카드", visual: ex("🃏", "앞면 보고 뒷면 떠올리기"), tone: "good", verdict: "인출 연습" },
          { label: "기출·연습 문제", visual: ex("📝", "답을 만들어 낸 뒤 채점"), tone: "good", verdict: "인출 연습" },
          { label: "백지 복습", visual: ex("📄", "덮고 기억나는 대로 쓰기"), tone: "good", verdict: "인출 연습", noteAfter: true, note: "맞았는지 확인하는 단계를 꼭 붙인다." },
          { label: "형광펜·요약 다시 보기", visual: ex("🖍️", "칠한 부분을 다시 읽기"), tone: "bad", verdict: "다시 읽기", noteAfter: true, note: "익숙함만 늘 수 있다." },
        ] },

      { type: "explain", kicker: "한계", title: "그대로 옮기면 안 되는 곳",
        steps: [
          { icon: "⏰", title: "시험이 곧이면", text: "몇 분 뒤 시험에서는 다시 읽기가 앞섰다." },
          { icon: "🧩", title: "처음 배우는 어려운 자료", text: "떠올릴 거리가 없으면 인출이 잘 안 된다. 먼저 이해가 필요하다." },
          { icon: "❌", title: "피드백 없음", text: "틀린 것을 떠올리면 오답이 굳을 수 있다. 정답 확인을 붙인다." },
        ],
        basis: "한 편의 글, 대학생 조건의 결과라 다른 과목·연령에 수치를 그대로 옮길 수 없다." },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "인출 연습", en: "retrieval practice" }, { ko: "시험 효과", en: "testing effect" }],
        signals: ["복습 계획을 '다시 읽기'로만 채우고 있을 때", "\"다 아는 것 같은데 시험에선 안 나온다\"는 말을 들을 때", "교육 자료에 퀴즈를 넣을지 정할 때"],
        queries: ["Roediger Karpicke 2006 testing effect", "retrieval practice vs restudy delayed test", "illusion of competence rereading", "successive relearning"],
        neighbors: [
          { term: "간격 효과", diff: "복습을 '언제' 할지. 인출 연습은 복습을 '어떻게' 할지." },
          { term: "바람직한 어려움", diff: "인출·간격·교차 연습을 묶는 상위 개념. 당장은 어렵지만 오래 남는 학습." },
        ] },
    ],
  });
</script>
</body>
</html>
