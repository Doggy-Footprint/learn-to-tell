<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같은 4번 복습, 언제 하느냐에 따라 얼마나 달라질까?</title>
<script type="application/json" id="ltt-meta">{"domain":"교육학","topic":"간격 반복과 망각 곡선","audience":"지수 함수 정도만 알면 된다","pattern":["hook","explain","predict","compare","keywords"],"mode":"체험형: 복습 일정별 기억률을 모델로 짐작해 본 뒤 인포그래픽 정답으로 확인한다(사용자 자신의 편향을 시험하지 않는다)","decision":"복습 4회를 언제 배치할지(간격)"}</script>
<link rel="stylesheet" href="/legacy/kit-v1/vendor/katex/katex.min.css">
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/vendor/katex/katex.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
  .vis svg { width: 100%; height: auto; }
  .curves { max-width: 640px; }
</style>
</head>
<body>
<script>
  const A = 4, S0 = 1;
  function schedule(times) {
    const ts = times.slice().sort((x, y) => x - y);
    let tk = 0, S = S0;
    const segs = [{ t: 0, S }];
    for (const t of ts) { const R = Math.exp(-(t - tk) / S); S = S * (1 + A * (1 - R)); tk = t; segs.push({ t, S }); }
    return (t) => { let s = segs[0]; for (const g of segs) if (g.t <= t) s = g; return Math.exp(-(t - s.t) / s.S); };
  }
  // EXPECTED_BY_HAND: 손계산(S 단계: 3.528, 9.636, 22.73, 46.83). 모델 코드보다 먼저 적음.
  const EXPECTED_BY_HAND = { spaced30: 0.7106, crammed30: 0.0 };
  LTT.expect("1,3,7,14일 복습 후 30일째", schedule([1, 3, 7, 14])(30), EXPECTED_BY_HAND.spaced30, { tol: 0.002 });
  LTT.expect("하루 몰아서 후 30일째", schedule([1 / 12, 1 / 6, 1 / 4, 1 / 3])(30), EXPECTED_BY_HAND.crammed30, { tol: 1e-4 });
  LTT.expect("복습 없이 t=1일", schedule([])(1), Math.exp(-1), { tol: 1e-9 });

  const PLANS = {
    cram: { label: "하루에 몰아서", t: [1 / 12, 1 / 6, 1 / 4, 1 / 3], c: "var(--ltt-bad)" },
    spaced: { label: "점점 넓히기 1·3·7·14일", t: [1, 3, 7, 14], c: "var(--ltt-accent)" },
    weekly: { label: "일주일 간격 7·14·21·28일", t: [7, 14, 21, 28], c: "var(--ltt-good)" },
    last: { label: "시험 직전 26–29일", t: [26, 27, 28, 29], c: "var(--ltt-warn)" },
  };
  const pc = (v) => Math.round(v * 100) + "%";
  // Draws retention over 0–60 days; the curve grows left-to-right so each review's jump is seen happening.
  function curves(node, keys, VH = 110) {
    const VW = 480, TMAX = 60, svg = d3.select(node).append("svg").attr("class", "ltt-svg").attr("viewBox", `0 0 ${VW} ${VH + 16}`);
    const x = d3.scaleLinear([0, TMAX], [4, VW - 4]), y = d3.scaleLinear([0, 1], [VH, 4]), ts = d3.range(0, TMAX + 0.05, 0.05);
    svg.append("line").attr("x1", x(30)).attr("x2", x(30)).attr("y1", 0).attr("y2", VH).attr("stroke", "var(--ltt-muted)").attr("stroke-dasharray", "4 4");
    svg.append("text").attr("x", x(30) + 4).attr("y", 12).text("시험 30일째");
    [0, 30, 60].forEach((d) => svg.append("text").attr("x", x(d)).attr("y", VH + 14).attr("text-anchor", d ? (d === 60 ? "end" : "middle") : "start").text(d + "일"));
    const paths = keys.map((k) => {
      const R = schedule(PLANS[k].t);
      return svg.append("path").attr("fill", "none").attr("stroke", PLANS[k].c).attr("stroke-width", 3).attr("d", d3.line().x(x).y((t) => y(R(t)))(ts));
    });
    const play = () => paths.forEach((p) => { const L = p.node().getTotalLength();
      p.interrupt().attr("stroke-dasharray", L).attr("stroke-dashoffset", L).transition().duration(LTT.MOTION_MS * 2.5).ease(d3.easeLinear).attr("stroke-dashoffset", 0); });
    paths.forEach((p) => p.attr("stroke-dasharray", "0 1e5"));
    return play;
  }
  const planItem = (k, tone, note) => {
    const R = schedule(PLANS[k].t);
    return { label: PLANS[k].label, tone, verdict: `30일째 ${pc(R(30))} · 60일째 ${pc(R(60))}`, noteAfter: true, note,
      visual: (n) => setTimeout(curves(n, [k], 80), 300) };
  };

  LTT.deck({
    title: "같은 4번 복습, 언제 하느냐에 따라 얼마나 달라질까?",
    scenes: [
      { type: "hook", art: "📅",
        text: "복습 횟수는 똑같이 4번.<br><u>언제</u> 하느냐만 바꾸면 한 달 뒤가 달라질까?",
        sub: "시험·자격증을 앞두고 복습 일정을 짤 때, 횟수보다 간격을 먼저 정한다." },

      { type: "explain", kicker: "원리", title: "조금 잊었을 때 복습하면 더 단단해진다",
        steps: [
          { icon: "📉", title: "잊기 시작", text: "학습 직후부터 기억률이 지수적으로 떨어진다(Ebbinghaus 1885의 근사)." },
          { icon: "🔁", title: "복습 시점", text: "막 본 직후 복습은 잊은 게 없어 얻는 것도 적다." },
          { icon: "🧱", title: "강도 S 증가", text: "어느 정도 잊었을 때 복습하면 다음엔 더 천천히 잊는다(이 모델의 가정)." },
        ],
        tex: "R(t)=e^{-(t-t_k)/S},\\qquad S \\leftarrow S\\,\\bigl(1+a\\,(1-R)\\bigr)",
        basis: "첫 학습 직후 S=1일, a=4는 예시용으로 정한 값이다(출처 없음, 불확실). 간격 학습이 몰아서 한 학습보다 지연 시험에 낫다는 방향은 Cepeda 외(2006) 메타분석이 근거." },

      { type: "predict", kicker: "짐작해 보기", title: "하루에 몰아서 vs 1·3·7·14일, 30일째 기억률 차이는?",
        question: "같은 4회 복습: 하루 몰아서(A) 대비 간격(B)의 30일째 기억률 차이(%p)",
        choices: [{ id: "5", text: "거의 없다 (5%p 안쪽)" }, { id: "20", text: "약 20%p" }, { id: "40", text: "약 40%p" }, { id: "70", text: "약 70%p" }],
        answer: "70",
        why: `간격 ${pc(schedule(PLANS.spaced.t)(30))}, 몰아서 ${pc(schedule(PLANS.cram.t)(30))} — 약 <b>70%p</b>(모델로 계산한 예시). 몰아서 한 복습은 S를 거의 키우지 못했다.`,
        answerVisual: (n) => { const c = document.createElement("div"); c.className = "curves"; n.appendChild(c); const play = curves(c, ["cram", "spaced"]); setTimeout(play, 100); } },

      { type: "compare", kicker: "일정별", title: "네 가지 복습 일정, 30일째와 60일째",
        revealLabel: "기억률 보기",
        items: [
          planItem("cram", "bad", "다음 날이면 대부분 잊는다."),
          planItem("spaced", "good", "Anki 같은 앱의 구조."),
          planItem("weekly", "good", "같은 간격도 넓으면 오래 간다."),
          planItem("last", "warn", "60일째에 빨리 떨어진다."),
        ],
        basis: "모델로 계산한 예시. a=4 가정에 따라 값이 크게 바뀐다." },

      { type: "explain", kicker: "실제와 한계", title: "어디에 쓰고, 어디서 틀리나",
        steps: [
          { icon: "🃏", title: "간격 반복 앱", text: "Anki의 SM-2 계열은 맞힐 때마다 간격을 기본 약 2.5배로 늘리고, FSRS는 기억 모델로 간격을 계산한다." },
          { icon: "📚", title: "과목마다 다름", text: "S가 얼마나 느는지는 자료·학습자·시험 형식에 따라 다르다. 모델은 방향만 믿는다." },
          { icon: "🎯", title: "시험일 기준", text: "최적 간격은 시험까지 남은 기간에 따라 길어진다는 보고가 있다(Cepeda 외 2008, 불확실)." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "간격 효과", en: "spacing effect" }, { ko: "간격 반복", en: "spaced repetition" }],
        signals: ["시험 직전에 복습을 몰아 두는 계획을 볼 때", "온보딩·교육 일정을 하루짜리로 짜려 할 때", "플래시카드 앱 간격 설정을 바꿀지 고민할 때"],
        queries: ["spacing effect Cepeda 2006 meta-analysis", "optimal review interval retention", "Ebbinghaus forgetting curve", "FSRS vs SM-2 spaced repetition"],
        neighbors: [
          { term: "인출 연습", diff: "복습을 '어떻게'(떠올리기) 할지. 간격은 '언제' 할지." },
          { term: "교차 연습", diff: "여러 유형을 섞어 연습하는 것. 시간 간격이 아니라 순서를 바꾼다." },
        ] },
    ],
  });
</script>
</body>
</html>
