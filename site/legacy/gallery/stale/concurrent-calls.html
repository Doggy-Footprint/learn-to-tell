<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 5개를 한꺼번에 부르면?</title>
<script type="application/json" id="ltt-meta">{"domain":"프론트엔드·JavaScript","topic":"Promise.all·allSettled·동시 실행 제한의 실패 동작","audience":"순차 호출과 동시 호출의 차이는 안다","pattern":["hook","motion","predict","compare","sweep","compare","keywords"],"mode":"체험형: 요청 5개의 순차 타임라인을 먼저 보이고, Promise.all의 실패 동작을 짐작한 뒤 타임라인으로 답을 보여 준다","decision":"동시 호출 방식과 실패 처리"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
  .tl { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 6px 8px; align-items: center; width: 100%; font-size: 12px; }
  .tl .tr { position: relative; height: 18px; background: repeating-linear-gradient(90deg, var(--ltt-line) 0 1px, transparent 1px calc(100% / 9)); border-radius: 4px; }
  .tl .tr i { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: #2a78d6; width: 0; transition: width .5s linear; }
  .tl .tr i.rejected { background: var(--ltt-bad); } .tl .tr i.discarded { opacity: .35; }
  .tl .tr i.never { background: none; border: 1.5px dashed #9aa1b5; }
  .tl .ret { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ltt-ink); }
  .tl-cap { font-size: 13px; color: var(--ltt-muted); margin: 6px 0 0; } .tl-cap b { color: var(--ltt-ink); }
  @media (max-width: 720px) { .tl { gap: 3px 4px; grid-template-columns: 22px 1fr; } .tl .tr { height: 10px; } }
  pre.c { font-size: 12px; background: #f4f6fb; border-radius: 8px; padding: 8px; margin: 0; white-space: pre-wrap; text-align: left; }
</style>
</head>
<body>
<script>
  // Hand-derived by an independent subagent from the variant semantics only; the model must match these, not the reverse.
    const EXPECTED_BY_HAND = [
      { label: "순차 · 실패 없음", variant: "seq", fail: false, settle: 1700, ok: 1, fulfilled: 5, rejected: 0, never: 0, lastEnd: 1700 },
      { label: "순차 · 3번째 실패", variant: "seq", fail: true, settle: 1000, ok: 0, fulfilled: 2, rejected: 1, never: 2, lastEnd: 1000 },
      { label: "all · 실패 없음", variant: "all", fail: false, settle: 500, ok: 1, fulfilled: 5, rejected: 0, never: 0, lastEnd: 500 },
      { label: "all · 3번째 실패", variant: "all", fail: true, settle: 200, ok: 0, fulfilled: 4, rejected: 1, never: 0, lastEnd: 500 },
      { label: "allSettled · 실패 없음", variant: "settled", fail: false, settle: 500, ok: 1, fulfilled: 5, rejected: 0, never: 0, lastEnd: 500 },
      { label: "allSettled · 3번째 실패", variant: "settled", fail: true, settle: 500, ok: 1, fulfilled: 4, rejected: 1, never: 0, lastEnd: 500 },
      { label: "제한 k=2 · 실패 없음", variant: "pool", k: 2, fail: false, settle: 900, ok: 1, fulfilled: 5, rejected: 0, never: 0, lastEnd: 900 },
      { label: "제한 k=2 · 3번째 실패", variant: "pool", k: 2, fail: true, settle: 900, ok: 1, fulfilled: 4, rejected: 1, never: 0, lastEnd: 900 },
      { label: "제한 k=3 · 실패 없음", variant: "pool", k: 3, fail: false, settle: 600, ok: 1, fulfilled: 5, rejected: 0, never: 0, lastEnd: 600 },
      { label: "제한 k=3 · 3번째 실패", variant: "pool", k: 3, fail: true, settle: 600, ok: 1, fulfilled: 4, rejected: 1, never: 0, lastEnd: 600 },
    ];
    const EXPECTED_ALL_FAIL_AT_RETURN = { fulfilled: 0, rejected: 1, running: 4 };
    const EXPECTED_SEQ_LANES = [[0, 300], [300, 800], [800, 1000], [1000, 1400], [1400, 1700]];
    const EXPECTED_POOL_LANES = {
      2: [[0, 300], [0, 500], [300, 500], [500, 900], [500, 800]],
      3: [[0, 300], [0, 500], [0, 200], [200, 600], [300, 600]],
    };
    const EXPECTED_POOL_SETTLE = { 1: 1700, 4: 500, 5: 500 };

    const DUR = [300, 500, 200, 400, 300];
    const FAIL_AT = 2;

    function simulate(variant, fail, k = 2) {
      const fails = (i) => fail && i === FAIL_AT;
      let lanes;
      if (variant === "seq") {
        let t = 0, stopped = false;
        lanes = DUR.map((d, i) => {
          const lane = { i, start: t, end: t + d, status: stopped ? "never" : fails(i) ? "rejected" : "fulfilled" };
          if (fails(i)) stopped = true;
          t += d;
          return lane;
        });
      } else if (variant === "pool") {
        const free = Array(k).fill(0);
        lanes = DUR.map((d, i) => {
          const slot = free.indexOf(Math.min(...free));
          const start = free[slot];
          free[slot] = start + d;
          return { i, start, end: start + d, status: fails(i) ? "rejected" : "fulfilled" };
        });
      } else {
        lanes = DUR.map((d, i) => ({ i, start: 0, end: d, status: fails(i) ? "rejected" : "fulfilled" }));
      }
      const ran = lanes.filter((l) => l.status !== "never");
      const lastEnd = Math.max(...ran.map((l) => l.end));
      const firstReject = Math.min(...ran.filter((l) => l.status === "rejected").map((l) => l.end));
      const failFast = (variant === "seq" || variant === "all") && Number.isFinite(firstReject);
      const settle = failFast ? firstReject : lastEnd;
      const ok = failFast ? 0 : 1;
      for (const l of lanes) l.discarded = variant === "all" && !ok && l.status === "fulfilled";
      const count = (s) => lanes.filter((l) => l.status === s).length;
      return {
        variant, fail, k, lanes, settle, ok, lastEnd,
        fulfilled: count("fulfilled"), rejected: count("rejected"), never: count("never"),
        atReturn: {
          fulfilled: ran.filter((l) => l.status === "fulfilled" && l.end <= settle).length,
          rejected: ran.filter((l) => l.status === "rejected" && l.end <= settle).length,
          running: ran.filter((l) => l.end > settle).length,
        },
      };
    }

    const KEY_LABEL = { settle: "반환 ms", ok: "정상 반환(1/0)", fulfilled: "성공 수", rejected: "실패 수", never: "보내지 않은 수", lastEnd: "마지막 종료 ms" };
    for (const c of EXPECTED_BY_HAND) {
      const m = simulate(c.variant, c.fail, c.k);
      for (const key of Object.keys(KEY_LABEL)) LTT.expect(`${c.label} · ${KEY_LABEL[key]}`, m[key], c[key], { tol: 0 });
    }
    const allFail = simulate("all", true).atReturn;
    for (const key of Object.keys(EXPECTED_ALL_FAIL_AT_RETURN)) {
      LTT.expect(`all · 3번째 실패 · 반환 시점 ${key}`, allFail[key], EXPECTED_ALL_FAIL_AT_RETURN[key], { tol: 0 });
    }
    simulate("seq", false).lanes.forEach((l, i) => {
      LTT.expect(`순차 R${i + 1} 시작`, l.start, EXPECTED_SEQ_LANES[i][0], { tol: 0 });
      LTT.expect(`순차 R${i + 1} 종료`, l.end, EXPECTED_SEQ_LANES[i][1], { tol: 0 });
    });
    for (const k of Object.keys(EXPECTED_POOL_LANES)) {
      simulate("pool", true, Number(k)).lanes.forEach((l, i) => {
        LTT.expect(`제한 k=${k} R${i + 1} 시작`, l.start, EXPECTED_POOL_LANES[k][i][0], { tol: 0 });
        LTT.expect(`제한 k=${k} R${i + 1} 종료`, l.end, EXPECTED_POOL_LANES[k][i][1], { tol: 0 });
      });
    }
    for (const k of Object.keys(EXPECTED_POOL_SETTLE)) {
      LTT.expect(`제한 k=${k} · 실패 · 반환 ms`, simulate("pool", true, Number(k)).settle, EXPECTED_POOL_SETTLE[k], { tol: 0 });
    }

      const sec = (ms) => d3.format(".1f")(ms / 1000);
  const MAX = 1800;
  const KEY = `<span class="ltt-key"><i style="background:#2a78d6"></i>성공</span><span class="ltt-key"><i style="background:var(--ltt-bad)"></i>실패</span><span class="ltt-key"><i style="background:#2a78d6;opacity:.35"></i>결과 버려짐</span><span class="ltt-key"><i style="border:1.5px dashed #9aa1b5"></i>보내지 않음</span>`;
  // Bars grow in simulated time (1 s of model = 1 s on screen) so "keeps running after the error" is seen, not read.
  function timeline(node, m, cap) {
    node.innerHTML = `<div class="tl">${m.lanes.map((l) => `<b>R${l.i + 1}</b><div class="tr"><i class="${l.status}${l.discarded ? " discarded" : ""}"
      style="left:${100 * l.start / MAX}%;" data-t="width ${(l.end - l.start) / 1000}s linear ${l.start / 1000}s" data-w="${100 * (l.end - l.start) / MAX}%"></i></div>`).join("")}<span class="ret" style="left:calc(36px + (100% - 36px) * ${m.settle / MAX})"></span></div>
      ${cap === false ? "" : `<p class="tl-cap"><b>${sec(m.settle)}초</b>에 ${m.ok ? "결과 반환" : "에러"}${m.lastEnd !== m.settle ? ` · 요청은 ${sec(m.lastEnd)}초까지 계속` : ""}</p>`}`;
    const bars = [...node.querySelectorAll(".tr i")];
    return { enter() {
      bars.forEach((b) => { b.style.transition = "none"; b.style.width = "0"; });
      requestAnimationFrame(() => requestAnimationFrame(() => bars.forEach((b) => { b.style.transition = LTT.MOTION_MS ? b.dataset.t : "none"; b.style.width = b.dataset.w; })));
    } };
  }
  const tlScene = (variant, fail, k) => (body) => timeline(body, simulate(variant, fail, k));
  const tlVis = (variant, k) => (node) => {
    const t = timeline(node.appendChild(document.createElement("div")), simulate(variant, true, k));
    node.firstChild.style.width = "100%";
    setTimeout(t.enter, 400);
  };

  LTT.deck({
    title: "API 5개를 한꺼번에 부르면?",
    scenes: [
      { type: "hook", art: "⚡",
        text: "await 다섯 번이면 1.7초,<br>Promise.all이면 0.5초.<br><u>하나가 실패하면</u> 이야기가 달라진다.",
        sub: "대시보드에서 API 5개를 부를 때, 빠르기보다 '실패 하나를 어떻게 다루나'가 결정을 가른다." },

      { kicker: "준비", title: "요청 5개, 각자 걸리는 시간",
        sub: "모두 성공하는 경우를 순차 await로 부르면 이렇게 줄을 선다. 세로선은 호출이 돌아오는 시점.",
        mount: tlScene("seq", false),
        basis: `${KEY}<br>요청별 소요 시간 고정 가정(0.3, 0.5, 0.2, 0.4, 0.3초). 모델로 계산한 예시.` },

      { type: "predict", kicker: "짐작해 보기", title: "Promise.all로 보냈는데 3번째가 0.2초에 실패하면?",
        question: "Promise.all로 요청 5개, 3번째가 0.2초에 실패하면? (a–d)",
        choices: [
          { id: "a", text: "0.5초 뒤, 성공 4개와 실패 1개를 함께 돌려준다" },
          { id: "b", text: "0.2초 뒤 에러, 나머지 요청은 취소된다" },
          { id: "c", text: "0.2초 뒤 에러, 나머지 요청은 계속 진행된다" },
          { id: "d", text: "1.7초 뒤 에러를 던진다" },
        ],
        answer: "c",
        answerVisual(node) {
          const t = timeline(node, simulate("all", true));
          node.insertAdjacentHTML("beforeend", `<p>${KEY}</p>`);
          setTimeout(t.enter, 100);
        },
        why: "Promise.all은 첫 실패에서 바로 reject하지만 이미 보낸 요청을 멈추지 않는다(흐린 막대: 아무도 받지 않는 결과). 취소는 AbortController로 직접 abort()해야 하고, 서버에 도달한 요청은 그래도 처리될 수 있다. (a)는 allSettled, (d)는 순차 await의 동작이다. <span class=\"ltt-tag\">근거: MDN Promise.all, AbortController</span>" },

      { type: "compare", kicker: "네 방식", title: "같은 실패, 네 가지 결말",
        sub: "모두 3번째 요청이 실패. 세로선은 호출 반환 시점(모델로 계산한 예시).",
        items: [
          { label: "순차 await", visual: tlVis("seq"), tone: "bad", verdict: "1.0초에 에러, 2개는 안 보냄" },
          { label: "Promise.all", visual: tlVis("all"), tone: "bad", verdict: "0.2초에 에러, 성공 4개 버림" },
          { label: "Promise.allSettled", visual: tlVis("settled"), tone: "good", verdict: "0.5초에 성공 4 + 실패 1" },
          { label: "동시 실행 제한 k=2", visual: tlVis("pool", 2), tone: "good", verdict: "0.9초, 동시 최대 2개" },
        ] },

      { kicker: "직접 바꿔 보기", title: "k를 움직여 총 시간과 동시 요청 수를 맞바꾼다",
        sub: "동시 실행 제한(pool): 한 번에 최대 k개만 진행하고, 하나가 끝나면 다음 요청을 보낸다.",
        mount(body) {
          body.innerHTML = `<label class="ltt-param">동시 실행 제한 k <b id="k-v"></b><input type="range" id="k" min="1" max="5" value="2" aria-label="k"></label><div id="ktl"></div>`;
          LTT.sweep({ params: { k: {} }, render: ({ k }) => timeline(document.getElementById("ktl"), simulate("pool", true, k)).enter() });
          return {};
        },
        basis: "k=1은 순차와 같은 1.7초, k=4·5는 전부 동시와 같은 0.5초. 실패는 try/catch로 기록하고 계속 처리. 모델로 계산한 예시." },

      { type: "compare", kicker: "실제 상황", title: "어떤 방식이 맞을까?",
        items: [
          { label: "대시보드 위젯 5개, 서로 독립", visual: `<pre class="c">await Promise.allSettled(
  widgets.map(load))</pre>`, tone: "good", verdict: "allSettled",
            noteAfter: true, note: "실패한 위젯만 오류로 표시하고 나머지 4개는 보인다." },
          { label: "ID 1,000개 상세 조회", visual: `<pre class="c">await Promise.all(
  ids.map(fetchOne))</pre>`, tone: "bad", verdict: "1,000개 동시 요청",
            noteAfter: true, note: "rate limit(429)에 걸리기 쉽고, 하나만 실패해도 받은 결과를 모두 잃는다." },
          { label: "같은 1,000개를 k개씩", visual: `<pre class="c">const limit = pLimit(10);
ids.map((id) => limit(() => fetchOne(id)))</pre>`, tone: "warn", verdict: "동시 수만 제한",
            noteAfter: true, note: "동시 진행 수 제한 ≠ 초당 요청 수 제한. 시간당 한도는 rate limiter와 Retry-After backoff로." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [{ ko: "빠른 실패", en: "Promise.all fail-fast" }, { ko: "전부 기다리기", en: "Promise.allSettled" }, { ko: "동시 실행 제한", en: "concurrency limit · pool" }],
        signals: ["요청 하나 실패로 화면 전체가 에러가 될 때", "대량 요청에서 429가 나기 시작할 때"],
        queries: ["Promise.all vs Promise.allSettled", "Promise.all reject cancel other promises", "AbortController fetch cancel", "p-limit concurrency"],
        neighbors: [
          { term: "Promise.race / any", diff: "첫 결과(any는 첫 성공)만 받는다." },
          { term: "rate limit (p-throttle)", diff: "초당 요청 수를 제한. 동시 실행 제한은 동시에 진행 중인 수만 제한." },
        ] },
    ],
  });
</script>
</body>
</html>
