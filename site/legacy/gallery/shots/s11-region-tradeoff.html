<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리전 수 트레이드오프</title>
<script type="application/json" id="ltt-meta">{"topic":"멀티 리전 배치의 지연과 비용","audience":"클라우드 입문 개발자","theme":"atlas","medium":"리전 지도와 비용 장부","decision":"서비스할 리전 수","domain":"클라우드","pattern":["predict"],"mode":"카탈로그용: 장면 하나짜리 본보기. 트레이드오프 구조를 \"값이 쌓임\" 움직임과 전면 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.rg{width:1000px;max-width:100%;height:auto;display:block;margin:0 auto}
.rg text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
// 사용자 분포가 고르게 퍼진 전 세계 서비스. 리전을 추가하는 순서와, 그때 전 세계 사용자 p95 왕복 지연(ms)
const REG = [
  { id: "us-east-1", p95: 190 }, { id: "eu-west-1", p95: 120 }, { id: "ap-northeast-2", p95: 78 },
  { id: "sa-east-1", p95: 64 }, { id: "ap-southeast-2", p95: 55 }, { id: "ap-south-1", p95: 49 },
  { id: "af-south-1", p95: 45 }, { id: "me-central-1", p95: 42 }];
// 월 비용(천 달러): 리전마다 같은 스택 18, 리전 쌍마다 DB 복제 전송 2.5 (inter-region 전송 약 $0.02/GB 기준)
const STACK = 18, PAIR = 2.5;
const cost = (n) => ({ stack: n * STACK, repl: PAIR * n * (n - 1) / 2 });
const total = (n) => cost(n).stack + cost(n).repl;

function regionChart(host, upto, from) {
  const W = 1000, H = 440, L = 70, R = 930, TOP = 30, BOT = 380, N = 8;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "rg", "data-annotate": "" }, host);
  const bw = 62, gx = (i) => L + (R - L) * (i + 0.5) / N;
  const yc = (v) => BOT - (BOT - TOP) * v / total(N), yl = (ms) => BOT - (BOT - TOP - 30) * ms / 200;
  el("line", { x1: L, x2: R, y1: BOT, y2: BOT, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s);
  const cols = REG.map((r, i) => {
    const g = el("g", { style: "opacity:0" }, s);
    const st = el("rect", { x: gx(i) - bw / 2, width: bw, y: BOT, height: 0, style: "fill:var(--ltt-c1)" }, g);
    const rp = el("rect", { x: gx(i) - bw / 2, width: bw, y: BOT, height: 0, style: "fill:var(--ltt-c2)" }, g);
    const num = el("text", { x: gx(i), y: BOT, "text-anchor": "middle", style: "font-size:15px;font-weight:700;fill:var(--ltt-ink)" }, g);
    const nm = el("text", { x: gx(i), y: BOT + 22, "text-anchor": "middle", style: "font-size:12px;fill:var(--ltt-muted)", class: "ltt-mono" }, g); nm.textContent = r.id;
    const k = el("text", { x: gx(i), y: BOT + 40, "text-anchor": "middle", style: "font-size:13px;fill:var(--ltt-ink-2)" }, g); k.textContent = (i + 1) + "개";
    return { g, st, rp, num };
  });
  REG.forEach((r, i) => { if (i < upto) return; el("rect", { x: gx(i) - bw / 2, y: BOT - 70, width: bw, height: 70, rx: 3, style: "fill:none;stroke:var(--ltt-line-2);stroke-width:1.5;stroke-dasharray:5 5" }, s);
    const q = el("text", { x: gx(i), y: BOT - 28, "text-anchor": "middle", style: "font-size:22px;font-weight:700;fill:var(--ltt-muted)" }, s); q.textContent = "?";
    const k = el("text", { x: gx(i), y: BOT + 40, "text-anchor": "middle", style: "font-size:13px;fill:var(--ltt-muted)" }, s); k.textContent = (i + 1) + "개"; });
  const line = el("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:3.5;stroke-linejoin:round" }, s);
  const dots = REG.map(() => el("circle", { r: 6, style: "fill:var(--ltt-accent);stroke:var(--ltt-bg);stroke-width:2.5;opacity:0" }, s));
  const ms = REG.map(() => el("text", { "text-anchor": "end", style: "font-size:14px;font-weight:700;fill:var(--ltt-accent);opacity:0;paint-order:stroke;stroke:var(--ltt-bg);stroke-width:5px" }, s));
  const lg = el("g", {}, s);
  [["var(--ltt-c1)", "리전 스택 비용"], ["var(--ltt-c2)", "리전 간 복제 비용"], ["var(--ltt-accent)", "전 세계 p95 지연 (선)"]].forEach(([c, t], i) => {
    el("rect", { x: L + i * 200, y: 4, width: 14, height: 14, rx: i === 2 ? 7 : 2, style: `fill:${c}` }, lg);
    const tx = el("text", { x: L + i * 200 + 22, y: 16, style: "font-size:14px;fill:var(--ltt-ink-2)" }, lg); tx.textContent = t; });

  const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function draw(u) {
    const span = upto - from, prog = Math.min(1, u / 0.7) * span;
    const pts = [];
    REG.forEach((r, i) => {
      const k = i < from ? 1 : Math.max(0, Math.min(1, prog - (i - from)));
      const e = ease(k), c = cost(i + 1);
      const c1 = cols[i]; c1.g.style.opacity = i < upto ? Math.min(1, k * 3) : 0;
      // 쌓임: 스택이 먼저 오르고, 그 위에 복제 비용이 쌓인다
      const hs = (BOT - yc(c.stack)) * Math.min(1, e * 1.6), hr = (BOT - yc(c.repl)) * Math.max(0, (e - 0.4) / 0.6);
      c1.st.setAttribute("y", BOT - hs); c1.st.setAttribute("height", hs);
      c1.rp.setAttribute("y", BOT - hs - hr); c1.rp.setAttribute("height", hr);
      c1.num.setAttribute("y", BOT - hs - hr - 8); c1.num.textContent = k > 0.95 ? "$" + Math.round(total(i + 1)) + "k" : "";
      if (i < upto && k > 0) { pts.push([gx(i), yl(r.p95) * k + yl(REG[Math.max(0, i - 1)].p95) * (1 - k)]);
        dots[i].setAttribute("cx", gx(i)); dots[i].setAttribute("cy", yl(r.p95)); dots[i].style.opacity = k > 0.95 ? 1 : 0;
        ms[i].setAttribute("x", gx(i) - 12); ms[i].setAttribute("y", yl(r.p95) - 14); ms[i].textContent = r.p95 + "ms"; ms[i].style.opacity = k > 0.95 ? 1 : 0;
      } else { dots[i].style.opacity = 0; ms[i].style.opacity = 0; }
    });
    line.setAttribute("d", pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(""));
  }
  draw(0.001);
  // predict의 visual에는 leave가 없어서, 화면에서 빠지면 스스로 멈춘다
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const t0 = Date.now(), period = 9000;
    const f = () => { if (!s.isConnected) return; draw(((Date.now() - t0) / period) % 1); setTimeout(f, 16); }; setTimeout(f, 16);
  } else draw(0.999);
  return s;
}

LTT.deck({
  title: "리전 수 트레이드오프", theme: "atlas",
  glossary: { "p95 지연": "요청 100개 중 느린 쪽 5개를 뺀 가장 느린 왕복 시간", "리전": "클라우드 사업자가 한 지역에 묶어 둔 데이터센터 무리" },
  scenes: [{
    type: "predict", title: "리전을 4개에서 8개로 늘리면?",
    sub: "{{리전}}을 하나 더할 때마다 막대(월 비용)는 쌓이고 선(전 세계 {{p95 지연}})은 내려간다. 빈 칸 4개를 채우면?",
    question: "리전 4개를 8개로 늘리면 지연과 비용은?",
    visual: (el) => regionChart(el, 4, 0),
    choices: [{ id: "half", text: "지연이 다시 절반쯤 줄고 비용은 두 배" }, { id: "flat", text: "지연은 20ms쯤만 줄고 비용은 두 배를 넘는다" }, { id: "same", text: "지연은 그대로, 비용만 두 배" }],
    answer: "flat",
    answerVisual: (el) => regionChart(el, 8, 4),
    why: "사용자 대부분은 이미 가까운 리전이 있어 지연은 64→42ms로 줄 뿐이다. 비용은 스택이 리전 수에 비례하고 복제가 리전 쌍(n(n−1)/2)에 비례해 $87k→$214k로 두 배를 넘는다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    basis: "지연은 리전 간 RTT 공개 측정치(CloudPing 류)를 고른 사용자 분포에 적용한 근삿값, 복제 전송은 AWS inter-region 약 $0.02/GB 기준 <span class=\"ltt-tag warn\">불확실</span>"
  }]
});
LTT.expect("리전 4개 월 비용", total(4), 87, { tol: 1e-9 });
LTT.expect("리전 8개 월 비용", total(8), 214, { tol: 1e-9 });
</script>
</body>
</html>
