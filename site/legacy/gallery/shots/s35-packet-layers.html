<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패킷 속 네 층</title>
<script type="application/json" id="ltt-meta">{"topic":"DNS·TCP·TLS·HTTP 용어","audience":"웹 요청을 디버깅하는 개발자","theme":"terminal","medium":"패킷 캡처(Wireshark 상세 창)","decision":"요청이 어느 층에서 막혔나","domain":"네트워크","pattern":["terms"],"mode":"카탈로그용: 장면 하나짜리 본보기. 순서 구조를 \"확대·축소\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.pk{width:100%;display:block}
.dk-body.sc35{display:grid!important;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)!important;gap:32px;align-items:center;width:100%}
.pk-wrap{background:var(--ltt-card);border:1px solid var(--ltt-line);border-radius:var(--ltt-r-lg);padding:14px}
.sc35 .dk-terms{display:flex!important;flex-direction:column;gap:10px;height:auto!important}
.sc35 .dk-tm{height:auto!important;min-height:0!important;flex:none!important;padding:12px 16px;opacity:.45;transition:opacity .3s,border-color .3s}
.sc35 .dk-tm.on{opacity:1;border-color:var(--ltt-accent)}
.sc35 .dk-tm .ex{display:none}
.pk text{font-family:var(--ltt-mono, ui-monospace, monospace)}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent, text) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; parent && parent.appendChild(n); return n; };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SLOT = 2.4, PERIOD = SLOT * 4;

// 같은 api.github.com 요청을 캡처했을 때 각 층의 머리 필드(포트 53·443, TLS 1.3 ClientHello의 SNI, HTTP/1.1 요청 줄)
const WEB = [
  { name: "Ethernet II", f: ["a4:83:e7:1c:02:9e → 00:1a:2b:3c:4d:5e"] },
  { name: "IPv4", f: ["10.0.0.5 → 140.82.112.6", "TTL 64"] },
  { name: "TCP", f: ["51734 → 443  [SYN] Seq=0", "Win=64240 MSS=1460"] },
  { name: "TLS 1.3", f: ["Handshake: ClientHello", "SNI = api.github.com"] },
  { name: "HTTP/1.1", f: ["GET /repos/octo/app HTTP/1.1", "Host: api.github.com"] }];
const DNS = [
  { name: "Ethernet II", f: ["a4:83:e7:1c:02:9e → 00:1a:2b:3c:4d:5e"] },
  { name: "IPv4", f: ["10.0.0.5 → 1.1.1.1", "TTL 64"] },
  { name: "UDP", f: ["60211 → 53", "Len=40"] },
  { name: "DNS", f: ["Standard query A", "api.github.com"] }];
// 단계마다 [패킷, 확대할 층]
const SHOTS = [[DNS, 3, "No. 1  10.0.0.5 → 1.1.1.1  DNS  Standard query A api.github.com"],
  [WEB, 2, "No. 3  10.0.0.5 → 140.82.112.6  TCP  51734 → 443 [SYN]"],
  [WEB, 3, "No. 6  10.0.0.5 → 140.82.112.6  TLSv1.3  Client Hello"],
  [WEB, 4, "No. 9  10.0.0.5 → 140.82.112.6  HTTP  GET /repos/octo/app"]];

function capture(host) {
  const s = mk("svg", { viewBox: "0 0 320 200", class: "pk", "data-annotate": "" }, host);
  const stacks = new Map();
  [DNS, WEB].forEach((stack) => {
    const g = mk("g", {}, s);
    const boxes = stack.map((L, i) => {
      const x = 6 + i * 12, y = 22 + i * 34, w = 308 - i * 24, h = 172 - i * 34;
      const r = mk("rect", { x, y, width: w, height: h, rx: 4, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1" }, g);
      const n = mk("text", { x: x + 6, y: y + 13, style: "font-size:10px;font-weight:700;fill:var(--ltt-ink-2)" }, g, L.name);
      L.f.forEach((t, j) => mk("text", { x: x + 6, y: y + 21 + j * 7, style: "font-size:5.6px;fill:var(--ltt-ink)" }, g, t));
      return { x, y, r, n };
    });
    stacks.set(stack, { g, boxes });
  });
  const line = mk("text", { x: 6, y: 12, style: "font-size:7px;fill:var(--ltt-accent)" }, s);
  let cur = [0, 0, 320, 200];
  const view = (v) => s.setAttribute("viewBox", v.join(" "));
  const target = (b) => [b.x - 3, b.y - 3, 140, 140 * 200 / 320];
  function show(k, z) {
    const [stack, focus, txt] = SHOTS[k];
    stacks.forEach((o, st) => { o.g.style.opacity = st === stack ? 1 : 0;
      o.boxes.forEach((b, i) => { const on = st === stack && i === focus;
        b.r.style.fill = on ? "var(--ltt-accent-soft)" : "var(--ltt-card-2)"; b.r.style.stroke = on ? "var(--ltt-accent)" : "var(--ltt-line-2)";
        b.n.style.fill = on ? "var(--ltt-accent)" : "var(--ltt-ink-2)"; }); });
    line.textContent = txt;
    const to = target(stacks.get(stack).boxes[focus]);
    view([0, 0, 320, 200].map((v, i) => v + (to[i] - v) * z));
  }
  return { el: s, show };
}

function run(fig, cards) {
  let tm = 0, t0 = 0;
  const frame = (t) => {
    const u = ((t % PERIOD) + PERIOD) % PERIOD, k = Math.floor(u / SLOT), l = u - k * SLOT;
    const z = l < .3 ? 0 : l < .9 ? ease((l - .3) / .6) : l < 1.9 ? 1 : l < 2.4 ? 1 - ease((l - 1.9) / .5) : 0;
    fig.show(k, z);
    cards.forEach((c, i) => c.classList.toggle("on", i === k));
  };
  return { enter() { clearTimeout(tm); if (reduced) { fig.show(3, 1); cards.forEach((c) => c.classList.add("on")); return; }
      t0 = Date.now(); const f = () => { frame((Date.now() - t0) / 1000); tm = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(tm); } };
}

LTT.deck({
  title: "패킷 속 네 층", theme: "terminal",
  glossary: {
    "DNS": "이름(api.github.com)을 IP 주소로 바꾸는 질의. 보통 UDP 53번 포트",
    "TCP": "두 컴퓨터 사이에 순서와 재전송을 보장하는 연결. 3-way handshake로 연다",
    "TLS": "TCP 위에서 상대를 확인하고 내용을 암호화하는 층. HTTPS의 S",
    "HTTP": "요청 줄과 헤더로 무엇을 원하는지 말하는 층. TLS 안에 암호화되어 실린다" },
  scenes: [{
    type: "terms", title: "요청 하나는 네 번의 순서로 열리고, 뒤 층은 앞 층 안에 실린다", en: "One request, four layers",
    sub: "캡처한 패킷을 차례로 확대한다. 바깥 상자일수록 먼저 열리고, 안쪽 상자는 바깥 상자의 내용물이다.",
    terms: [
      { key: "DNS", word: "① 이름 묻기", en: "DNS", icon: "search", visual: false, 
        plain: "api.github.com이 어느 주소인지 먼저 묻는다.", example: "응답이 없으면 연결 전 단계에서 멈춘다" },
      { key: "TCP", word: "② 연결 열기", en: "TCP", icon: "link", visual: false, 
        plain: "받은 주소의 443번 포트로 SYN을 보내 길을 연다.", example: "SYN만 반복되면 방화벽이나 포트를 본다" },
      { key: "TLS", word: "③ 암호 걸기", en: "TLS", icon: "lock", visual: false, 
        plain: "ClientHello로 상대 이름(SNI)을 대고 암호를 맞춘다.", example: "인증서 오류는 이 층의 실패다" },
      { key: "HTTP", word: "④ 요청 보내기", en: "HTTP", icon: "send", visual: false, 
        plain: "암호 안에서 GET 요청 줄과 Host 헤더를 보낸다.", example: "404·500은 앞 세 층이 다 성공했다는 뜻" }],
    basis: "필드 값은 api.github.com 요청을 예로 든 것. 포트 53(DNS)·443(HTTPS), TLS 1.3 ClientHello의 SNI는 RFC 1035·RFC 8446 기준.",
    mount(body) {
      body.classList.add("sc35");
      const wrap = body.insertBefore(document.createElement("div"), body.firstChild); wrap.className = "pk-wrap";
      const fig = capture(wrap); fig.show(0, 0);
      return run(fig, [...body.querySelectorAll(".dk-tm")]);
    }
  }]
});
</script>
</body>
</html>
