<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>

<script>
const SVG = "http://www.w3.org/2000/svg";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
// 세종 구문 분석 말뭉치·UD Korean 관례: 서술어가 문장의 뿌리, 체언·수식어는 오른쪽 핵심어에 기댄다
const W = [{ w: "어제", x: 110 }, { w: "철수가", x: 270 }, { w: "빨간", x: 440 }, { w: "사과를", x: 600 }, { w: "먹었다", x: 800 }];
const ARCS = [{ h: 4, d: 0, rel: "때 (obl)" }, { h: 4, d: 1, rel: "주어 (nsubj)" }, { h: 3, d: 2, rel: "꾸밈 (amod)" }, { h: 4, d: 3, rel: "목적어 (obj)" }];

function parse(host) {
  const s = mk("svg", { viewBox: "0 0 920 440", class: "dp", "data-annotate": "" }, host);
  const BASE = 330;
  const boxes = [mk("rect", { x: 380, y: BASE - 40, width: 290, height: 64, rx: 10, style: "fill:var(--ltt-accent-soft);stroke:none" }, s),
    mk("rect", { x: 40, y: BASE - 52, width: 840, height: 88, rx: 14, style: "fill:none;stroke:var(--ltt-line-2);stroke-width:1.5;stroke-dasharray:6 5" }, s)];
  const arcs = ARCS.map((a) => { const x1 = W[a.h].x, x2 = W[a.d].x, hgt = 40 + Math.abs(x1 - x2) * 0.32;
    const p = mk("path", { d: `M${x1},${BASE - 34} C${x1},${BASE - 34 - hgt} ${x2},${BASE - 34 - hgt} ${x2},${BASE - 40}`, style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:2.2" }, s);
    const tip = mk("path", { d: `M${x2 - 6},${BASE - 50} L${x2},${BASE - 38} L${x2 + 6},${BASE - 50}`, style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:2.2" }, s);
    const lab = mk("text", { x: (x1 + x2) / 2, y: BASE - 34 - hgt * 0.75 - 8, "text-anchor": "middle", style: "font-size:17px;fill:var(--ltt-ink-2);font-weight:600" }, s);
    lab.textContent = a.rel; const L = p.getTotalLength ? 600 : 600; p.style.strokeDasharray = L;
    return { p, tip, lab, L }; });
  const root = mk("text", { x: 860, y: 96, "text-anchor": "middle", style: "font-size:16px;fill:var(--ltt-accent);font-weight:700" }, s); root.textContent = "뿌리 (root)";
  const rootLine = mk("line", { x1: 800, y1: 80, x2: 800, y2: BASE - 40, style: "stroke:var(--ltt-accent);stroke-width:2.2;stroke-dasharray:4 4" }, s);
  const words = W.map((o, i) => { const t = mk("text", { x: o.x, y: BASE, "text-anchor": "middle", style: "font-size:30px;font-weight:700;fill:var(--ltt-ink)" }, s); t.textContent = o.w; return t; });
  const role = W.map((o) => mk("text", { x: o.x, y: BASE + 34, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-muted)" }, s));
  const cap = mk("text", { x: 460, y: 420, "text-anchor": "middle", style: "font-size:18px;fill:var(--ltt-ink-2)" }, s);
  const isHead = [false, false, false, true, true];
  function draw(u) {
    // 0–.18 한 줄 문장 → 어절로 쪼개짐, .18–.6 화살표가 하나씩, .6–.85 의존어가 핵심어 묶음으로 합쳐짐, .85–1 쉼
    const sp = ease(clamp(u / .16)), mg = ease(clamp((u - .62) / .2)), out = ease(clamp((u - .94) / .06));
    const split = sp * (1 - out);
    words.forEach((t, i) => { const gather = 460 + (W[i].x - 460) * (0.55 + 0.45 * split);
      t.setAttribute("x", gather); t.style.fill = isHead[i] && mg > .3 ? "var(--ltt-accent)" : "var(--ltt-ink)"; });
    arcs.forEach((a, i) => { const k = ease(clamp((u - .2 - i * .1) / .1)) * (1 - out);
      a.p.style.strokeDashoffset = a.L * (1 - k); a.tip.style.opacity = k > .95 ? 1 : 0; a.lab.style.opacity = clamp((k - .6) / .4); });
    const rk = ease(clamp((u - .58) / .06)) * (1 - out); root.style.opacity = rk; rootLine.style.opacity = rk;
    boxes[0].style.opacity = clamp(mg * 1.6 - .2) * (1 - out); boxes[1].style.opacity = clamp(mg * 1.6 - .8) * (1 - out);
    role.forEach((r, i) => { r.textContent = i === 3 ? "핵심어 ← 빨간" : i === 4 ? "핵심어 (문장 전체)" : "의존어"; r.style.opacity = clamp((u - .5) / .08) * (1 - out); });
    cap.textContent = u < .18 ? "한 줄로 붙은 문장을 어절로 쪼갠다" : u < .6 ? "화살표: 핵심어 → 의존어, 위 글자는 관계" : u < .94 ? "의존어는 핵심어와 합쳐져 한 덩어리(구)가 된다" : "";
  }
  return { el: s, draw };
}
function loop(period, draw) {
  let id = 0; const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(id); if (reduced) { draw(0.9); return; } const t0 = Date.now();
      const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(id); } };
}
LTT.deck({
  title: "의존 구문 분석", theme: "paper",
  glossary: { "핵심어": "구의 문법 성격을 정하는 말. 다른 말이 기대는 쪽(head)",
    "의존어": "핵심어에 기대어 뜻을 보태는 말(dependent)", "의존 관계": "핵심어와 의존어를 잇는 화살표에 붙은 이름(주어, 목적어, 꾸밈 등)" },
  scenes: [{
    type: "terms", title: "문장은 핵심어에 기대는 말들의 나무다", en: "Head, dependent, relation",
    sub: "화살표는 핵심어에서 의존어로 간다. 위 글자가 관계 이름이다.",
    terms: [{ key: "핵심어", word: "핵심어", en: "head", icon: "anchor", visual: false, plain: "다른 말이 기대는 쪽" },
      { key: "의존어", word: "의존어", en: "dependent", icon: "link", visual: false, plain: "핵심어에 붙어 뜻을 보탬" },
      { key: "의존 관계", word: "관계", en: "relation", icon: "arrow", visual: false, plain: "화살표의 이름" }],
    basis: "관계 이름은 Universal Dependencies v2 표기. 한국어 서술어 뿌리 관례는 UD Korean Kaist 트리뱅크.",
    mount(body) { const w = body.appendChild(document.createElement("div")); w.className = "dp-wrap";
      const f = parse(w); f.draw(0); return loop(9000, f.draw); }
  }]
});
</script>
