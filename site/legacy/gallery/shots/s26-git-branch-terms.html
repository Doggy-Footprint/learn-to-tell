<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git 브랜치 용어</title>
<script type="application/json" id="ltt-meta">{"topic":"git 브랜치, 머지, 리베이스","audience":"git 입문 개발자","theme":"sketch","medium":"화이트보드 커밋 그래프","decision":"머지와 리베이스 중 무엇을 쓸지","domain":"git","pattern":["terms"],"mode":"카탈로그용: 장면 하나짜리 본보기. 연결 구조를 \"쪼개지고 합쳐짐\" 움직임과 중앙 주인공 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.gg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.gg text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Y0 = 50, Y1 = 120, X = (i) => 30 + i * 60;

// mode: "branch" | "merge" | "rebase". 한 그래프가 갈라지고(branch), 합쳐지고(merge), 옮겨 붙는다(rebase)
function graph(mode) {
  return (host) => {
    const s = mk("svg", { viewBox: "0 0 360 170", class: "gg" }, host);
    const ink = "stroke:var(--ltt-ink);stroke-width:2.5;fill:none;stroke-linecap:round";
    mk("text", { x: 4, y: Y0 - 18, style: "font-size:13px;fill:var(--ltt-muted)" }, s).textContent = "main";
    const fl = mk("text", { x: 4, y: Y1 + 34, style: "font-size:13px;fill:var(--ltt-accent);font-weight:600" }, s); fl.textContent = "feature";
    const trunk = mk("path", { d: `M${X(0)},${Y0} L${X(2)},${Y0}`, style: ink }, s);
    const fork = mk("path", { style: ink.replace("var(--ltt-ink)", "var(--ltt-accent)") }, s);
    const join = mk("path", { style: ink.replace("var(--ltt-ink)", "var(--ltt-accent)") + ";stroke-dasharray:5 4" }, s);
    const c = (cls) => mk("circle", { r: 9, style: cls }, s);
    const mains = [0, 1, 2].map(() => c("fill:var(--ltt-card);stroke:var(--ltt-ink);stroke-width:2.5"));
    const m3 = c("fill:var(--ltt-card);stroke:var(--ltt-ink);stroke-width:2.5");
    const feats = [0, 1].map(() => c("fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2.5"));
    const mc = c("fill:var(--ltt-ink);stroke:var(--ltt-ink);stroke-width:2.5");
    const tag = mk("text", { "text-anchor": "middle", style: "font-size:12px;fill:var(--ltt-ink-2)" }, s);
    const at = (n, x, y, o = 1) => { n.setAttribute("cx", x); n.setAttribute("cy", y); n.style.opacity = o; };
    const draw = (u) => {
      mains.forEach((n, i) => at(n, X(i), Y0));
      if (mode === "branch") {
        const a = ease(clamp(u / .5)), fade = u > .9 ? 1 - (u - .9) / .1 : 1;
        trunk.setAttribute("d", `M${X(0)},${Y0} L${X(2) + 50 * a},${Y0}`);
        at(m3, X(2) + 60, Y0, 0); at(mc, 0, 0, 0); join.setAttribute("d", "");
        const fx = X(1) + 120 * a, fy = Y0 + (Y1 - Y0) * a;
        fork.setAttribute("d", `M${X(1)},${Y0} C${X(1) + 30},${Y0} ${X(1) + 20},${fy} ${fx},${fy}`); fork.style.opacity = fade;
        at(feats[0], X(1) + 60 * a, Y0 + (Y1 - Y0) * a, fade); at(feats[1], fx, fy, fade * clamp((a - .5) * 2));
        tag.textContent = "한 커밋에서 갈라진다"; tag.setAttribute("x", 180); tag.setAttribute("y", 165);
      } else {
        at(m3, X(3), Y0, 1); trunk.setAttribute("d", `M${X(0)},${Y0} L${X(3)},${Y0}`);
        if (mode === "merge") {
          const a = ease(clamp((u - .15) / .45)), fade = u > .9 ? 1 - (u - .9) / .1 : 1;
          fork.setAttribute("d", `M${X(1)},${Y0} C${X(1) + 30},${Y0} ${X(1) + 20},${Y1} ${X(2)},${Y1} L${X(3)},${Y1}`); fork.style.opacity = 1;
          at(feats[0], X(2), Y1); at(feats[1], X(3), Y1);
          const ex = X(3) + (X(4) - X(3)) * a, ey = Y1 + (Y0 - Y1) * a;
          join.setAttribute("d", `M${X(3)},${Y1} L${ex},${ey}`); join.style.opacity = fade;
          trunk.setAttribute("d", `M${X(0)},${Y0} L${X(3) + (X(4) - X(3)) * a},${Y0}`);
          at(mc, X(4), Y0, fade * clamp((a - .7) / .3));
          tag.textContent = "부모 둘인 머지 커밋이 생긴다"; tag.setAttribute("x", 180); tag.setAttribute("y", 165);
        } else {
          const a = ease(clamp((u - .15) / .5)), fade = u > .9 ? 1 - (u - .9) / .1 : 1;
          at(mc, 0, 0, 0); join.setAttribute("d", "");
          // 원래 자리(m1에서 갈라짐) → m3 뒤에 다시 붙음
          const bx = X(1) + (X(3) - X(1)) * a, by = Y0;
          const p0 = [X(2) + (X(4) - X(2)) * a, Y1 - (Y1 - Y0 - 0) * 0], p1 = [X(3) + (X(5) - X(3)) * a, Y1];
          const yy = Y1 - (Y1 - Y0) * a * 0;
          fork.setAttribute("d", `M${bx},${by} C${bx + 30},${by} ${bx + 20},${Y1} ${p0[0]},${Y1} L${p1[0]},${Y1}`);
          fork.style.opacity = fade;
          at(feats[0], p0[0], Y1, fade); at(feats[1], p1[0], Y1, fade);
          tag.textContent = a < .99 ? "커밋을 떼어 main 끝에 다시 붙인다" : "새 커밋(새 해시)으로 한 줄이 된다"; tag.setAttribute("x", 180); tag.setAttribute("y", 165);
        }
      }
    };
    if (reduced) draw(.85); else { const t0 = Date.now() + (mode === "merge" ? 400 : mode === "rebase" ? 800 : 0);
      let seen = false; draw(0); const f = () => { if (s.isConnected) seen = true; else if (seen) return; draw((((Date.now() - t0) / 6000) % 1 + 1) % 1); setTimeout(f, 16); }; f(); }
    return s;
  };
}

LTT.deck({
  title: "git 브랜치 용어", theme: "sketch",
  glossary: { "브랜치": "커밋 하나를 가리키는 움직이는 이름표. 새 커밋을 만들면 따라 앞으로 간다",
    "머지": "두 갈래의 끝을 부모 둘인 새 커밋으로 합치는 일", "리베이스": "한 갈래의 커밋을 떼어 다른 갈래 끝에 다시 쌓는 일" },
  scenes: [{
    type: "terms", title: "커밋 그래프는 갈라지고, 합쳐지고, 옮겨 붙는다",
    sub: "동그라미는 커밋, 굵은 줄은 main, 색 줄은 feature 갈래다.",
    terms: [
      { key: "브랜치", word: "브랜치", en: "branch", visual: graph("branch"), plain: "한 커밋에서 갈라져 따로 쌓는 줄", example: "git switch -c feature" },
      { key: "머지", word: "머지", en: "merge", visual: graph("merge"), plain: "두 줄 끝을 머지 커밋 하나로 묶는다. 역사는 그대로 남는다", example: "git merge feature" },
      { key: "리베이스", word: "리베이스", en: "rebase", visual: graph("rebase"), plain: "내 커밋을 main 끝으로 옮겨 다시 만든다. 해시가 바뀐다", example: "git rebase main" }
    ],
    basis: "Pro Git 3장(Git Branching) 3.1·3.2·3.6절의 그림을 따른다."
  }]
});
</script>
</body>
</html>
