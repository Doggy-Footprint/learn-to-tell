<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편향과 분산</title>
<script type="application/json" id="ltt-meta">{"topic":"편향-분산 트레이드오프","audience":"ML 입문 개발자","theme":"lab","medium":"실험 플롯","decision":"모델 복잡도(다항식 차수) 고르기","domain":"ML","pattern":["figure"],"mode":"카탈로그용: 장면 하나짜리 본보기. 트레이드오프 구조를 \"값이 쌓임\" 움직임과 중앙 주인공 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.bv-wrap{display:flex;justify-content:center}
.bv{width:820px;max-width:100%;height:auto;display:block}
.bv text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const tx = (p, x, y, t, st) => { const n = mk("text", { x, y, style: st }, p); n.textContent = t; return n; };
const ease = (x) => 1 - Math.pow(1 - x, 3);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 모델: 기대 테스트 오차 = 편향² + 분산 + 잡음(σ²=0.10). 차수 d = 1…12
const bias2 = (d) => 0.85 * Math.exp(-0.55 * (d - 1));
const vari = (d) => 0.01 * Math.exp(0.4 * (d - 1));
const NOISE = 0.10;
const D = Array.from({ length: 12 }, (_, i) => i + 1);
const total = (d) => bias2(d) + vari(d) + NOISE;
const best = D.reduce((a, d) => total(d) < total(a) ? d : a, 1);
LTT.expect("오차가 가장 작은 차수", best, 6);

function bvFig(host) {
  const W = 820, H = 500, x0 = 90, x1 = 780, y0 = 430, y1 = 40, ymax = 1.0;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "bv", "data-annotate": "" }, host);
  const X = (d) => x0 + (d - 0.5) / 12 * (x1 - x0), Y = (v) => y0 - Math.min(v, ymax) / ymax * (y0 - y1), bw = (x1 - x0) / 12 * 0.62;
  [0, 0.25, 0.5, 0.75, 1].forEach((v) => { mk("line", { x1: x0, x2: x1, y1: Y(v), y2: Y(v), style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    tx(s, x0 - 12, Y(v) + 5, v.toFixed(2), "font-size:14px;fill:var(--ltt-muted);text-anchor:end"); });
  D.forEach((d) => tx(s, X(d), y0 + 24, d, "font-size:14px;fill:var(--ltt-muted);text-anchor:middle"));
  tx(s, x0, y0 + 54, "모델 복잡도 (다항식 차수) →", "font-size:15px;fill:var(--ltt-ink-2);text-anchor:start");
  tx(s, 24, y1 - 14, "테스트 오차 (MSE)", "font-size:15px;fill:var(--ltt-ink-2)");
  const SER = [["잡음", () => NOISE, "var(--ltt-line-2)"], ["편향²", bias2, "var(--ltt-c1)"], ["분산", vari, "var(--ltt-c2)"]];
  const bars = D.map((d) => SER.map(([, f, c]) => mk("rect", { x: X(d) - bw / 2, width: bw, y: y0, height: 0, style: `fill:${c};stroke:var(--ltt-bg);stroke-width:1` }, s)));
  const pts = D.map((d) => [X(d), Y(total(d))]);
  const curve = mk("polyline", { points: "", style: "fill:none;stroke:var(--ltt-ink);stroke-width:2.5;stroke-linejoin:round" }, s);
  const head = mk("circle", { r: 6, style: "fill:var(--ltt-ink)" }, s);
  const val = tx(s, 0, 0, "", "font-size:15px;font-weight:700;fill:var(--ltt-ink);text-anchor:middle");
  const bestG = mk("g", { style: "opacity:0" }, s);
  mk("line", { x1: X(best), x2: X(best), y1: y1 + 10, y2: y0, style: "stroke:var(--ltt-accent);stroke-width:2;stroke-dasharray:5 5" }, bestG);
  tx(bestG, X(best), y1 + 2, `가장 낮은 오차 · 차수 ${best}`, "font-size:16px;font-weight:700;fill:var(--ltt-accent);text-anchor:middle");
  const lg = mk("g", { transform: `translate(${x1 - 250},${y0 + 40})` }, s);
  SER.slice().reverse().forEach(([n, , c], k) => { mk("rect", { x: k * 84, y: 0, width: 16, height: 16, style: `fill:${c}` }, lg); tx(lg, k * 84 + 24, 13, n, "font-size:15px;fill:var(--ltt-ink-2)"); });
  const nU = tx(s, X(2), Y(total(1)) - 4, "", "font-size:14px;fill:var(--ltt-muted);text-anchor:start");
  const lU = tx(s, X(1) + 4, y0 - 140, "", "");
  const sideL = tx(s, X(1.6), Y(0.98), "과소적합: 편향이 크다", "font-size:15px;font-weight:700;fill:var(--ltt-ink-2);text-anchor:start;opacity:0");
  const sideR = tx(s, X(12.4), Y(0.98), "과적합: 분산이 크다", "font-size:15px;font-weight:700;fill:var(--ltt-ink-2);text-anchor:end;opacity:0");

  // 9초 한 바퀴: 0–70% 차수마다 막대가 쌓이며 곡선이 이어진다, 70–95% 최솟값 표시로 멈춤, 끝 5% 비우기
  const draw = (u) => {
    const grow = Math.min(1, u / 0.7), fade = u > 0.95 ? 1 - (u - 0.95) / 0.05 : 1;
    let last = -1;
    D.forEach((d, i) => { const p = Math.max(0, Math.min(1, grow * 12 - i)); const e = ease(p) * fade; if (p > 0) last = i;
      let acc = 0; SER.forEach(([, f], k) => { const v = f(d) * e; const r = bars[i][k];
        r.setAttribute("y", Y(acc + v)); r.setAttribute("height", Math.max(0, Y(acc) - Y(acc + v))); acc += v; }); });
    const shown = pts.slice(0, last + 1);
    curve.setAttribute("points", shown.join(" ")); curve.style.opacity = fade;
    if (last >= 0) { head.setAttribute("cx", pts[last][0]); head.setAttribute("cy", pts[last][1] - 0); head.style.opacity = fade;
      val.setAttribute("x", pts[last][0]); val.setAttribute("y", pts[last][1] - 14); val.textContent = total(D[last]).toFixed(2); val.style.opacity = u < 0.7 ? 1 : 0; }
    else { head.style.opacity = 0; val.textContent = ""; }
    const done = u >= 0.7 ? fade : 0; bestG.style.opacity = done; sideL.style.opacity = done; sideR.style.opacity = done;
  };
  if (reduced) { draw(0.8); return { el: s }; }
  const t0 = Date.now(); const tick = () => { if (!s.isConnected && Date.now() - t0 > 500) return; draw(((Date.now() - t0) / 9000) % 1); setTimeout(tick, 16); }; tick();
  return { el: s };
}

LTT.deck({
  title: "편향과 분산", theme: "lab",
  glossary: { "편향": "모델이 너무 단순해 평균적으로 정답에서 비켜 가는 정도", "분산": "학습 데이터가 조금만 바뀌어도 예측이 흔들리는 정도" },
  scenes: [{
    type: "figure",
    title: "복잡도를 올리면 편향은 줄고 분산은 쌓인다",
    sub: "차수마다 막대가 아래부터 잡음 · {{편향}}² · {{분산}}으로 쌓이고, 검은 선이 그 합(테스트 오차)을 잇는다.",
    figure: (el) => { const w = el.appendChild(document.createElement("div")); w.className = "bv-wrap"; return bvFig(w); },
    caption: "합이 가장 낮은 차수에서 멈춘다. 그보다 단순하면 편향이, 복잡하면 분산이 오차를 키운다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    basis: "분해식 E[(y−f̂)²] = 편향² + 분산 + σ²: Hastie·Tibshirani·Friedman, The Elements of Statistical Learning 7.3절. 곡선 계수는 모양을 보이기 위한 가정이다."
  }]
});
</script>
</body>
</html>
