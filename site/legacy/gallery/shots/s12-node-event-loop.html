<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node.js 이벤트 루프</title>
<script type="application/json" id="ltt-meta">{"topic":"Node.js 이벤트 루프 단계","audience":"Node.js 백엔드 입문자","theme":"terminal","medium":"터미널 로그","decision":"setTimeout·setImmediate·nextTick 중 무엇으로 미룰지","domain":"런타임","pattern":["overview"],"mode":"카탈로그용: 장면 하나짜리 본보기. 순환 구조를 \"점이 궤적을 그림\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.el{width:1060px;max-width:100%;height:auto;display:block;margin:0 auto}
.el text{font-family:inherit}
.el .mono{font-family:var(--ltt-mono, ui-monospace, monospace)}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
// libuv 단계 순서(Node.js 공식 문서 "The Node.js Event Loop"). w는 한 바퀴에서 머무는 시간 비중으로, poll이 I/O를 기다리며 가장 오래 머문다
const PH = [
  { id: "timers", w: 1, log: "setTimeout(cb, 0) 만료 → cb()", tip: 1 },
  { id: "pending", w: 0.6, log: "미뤄 둔 TCP 오류 콜백" },
  { id: "idle·prepare", w: 0.4, log: "(내부용)" },
  { id: "poll", w: 2.6, log: "readFile 콜백 · 없으면 대기", tip: 2 },
  { id: "check", w: 1, log: "setImmediate(cb) → cb()", tip: 3 },
  { id: "close", w: 0.6, log: "socket.on('close') 콜백" }];
const TIPS = { 1: "타이머는 만료돼도 timers 단계가 와야 돈다", 2: "할 일이 없으면 poll에서 I/O를 기다린다", 3: "setImmediate는 poll 바로 뒤 check에서", 4: "nextTick·Promise는 단계 사이마다 먼저 비운다" };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function eventLoop(host) {
  const W = 1060, H = 560, cx = 530, cy = 280, R = 215, N = PH.length, GAP = 0.07;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "el", "data-annotate": "" }, host);
  const pt = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const arc = (a0, a1, r) => { const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}`; };
  const seg = PH.map((p, i) => ({ a0: i / N * 2 * Math.PI + GAP, a1: (i + 1) / N * 2 * Math.PI - GAP }));
  const arcs = PH.map((p, i) => {
    el("path", { d: arc(seg[i].a0, seg[i].a1, R), style: "fill:none;stroke:var(--ltt-line-2);stroke-width:12" }, s);
    const hi = el("path", { d: arc(seg[i].a0, seg[i].a1, R), style: "fill:none;stroke:var(--ltt-accent);stroke-width:12;opacity:0;transition:opacity .3s" }, s);
    const am = (seg[i].a0 + seg[i].a1) / 2, [lx, ly] = pt(am, R + 34);
    const anchor = Math.sin(am) > 0.3 ? "start" : Math.sin(am) < -0.3 ? "end" : "middle";
    const lab = el("text", { x: lx, y: ly + (Math.cos(am) < -0.5 ? 14 : 6), "text-anchor": anchor, class: "mono", style: "font-size:22px;font-weight:700;fill:var(--ltt-ink-2)" }, s);
    lab.textContent = p.id;
    if (p.tip) badge(...pt(am, R), p.tip);
    return { hi, lab };
  });
  // 단계 사이 틈: 마이크로태스크 큐를 비우는 자리
  const ticks = PH.map((p, i) => { const a = i / N * 2 * Math.PI, [x, y] = pt(a, R);
    return el("circle", { cx: x, cy: y, r: 6, style: "fill:var(--ltt-bg);stroke:var(--ltt-warn);stroke-width:2.5" }, s); });
  const [mx, my] = pt(0, R); badge(mx + 26, my - 22, 4);
  const mlab = el("text", { x: mx + 46, y: my - 16, style: "font-size:15px;fill:var(--ltt-warn)" }, s); mlab.textContent = "틈 = nextTick·Promise";

  // 가운데 로그(겹쳐 놓기)
  el("rect", { x: cx - 168, y: cy - 108, width: 336, height: 216, rx: 6, style: "fill:var(--ltt-card);stroke:var(--ltt-line)" }, s);
  const hd = el("text", { x: cx - 150, y: cy - 82, class: "mono", style: "font-size:13px;fill:var(--ltt-muted)" }, s); hd.textContent = "$ node server.js  # 한 바퀴 = tick";
  const lines = PH.map((p, i) => { const t = el("text", { x: cx - 150, y: cy - 50 + i * 30, class: "mono", style: "font-size:14px;fill:var(--ltt-ink);opacity:0" }, s);
    const a = el("tspan", { style: "fill:var(--ltt-accent);font-weight:700" }, t); a.textContent = p.id === "idle·prepare" ? "idle" : p.id;
    const b = el("tspan", { x: cx - 64 }, t); b.textContent = p.log; return t; });

  const trail = el("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:4;stroke-linecap:round;opacity:.55" }, s);
  const dot = el("circle", { r: 10, style: "fill:var(--ltt-accent);stroke:var(--ltt-bg);stroke-width:3" }, s);

  function badge(x, y, n) {
    el("circle", { cx: x, cy: y, r: 13, style: "fill:var(--ltt-ink);stroke:var(--ltt-bg);stroke-width:2" }, s);
    const t = el("text", { x, y: y + 5, "text-anchor": "middle", style: "font-size:14px;font-weight:700;fill:var(--ltt-bg)" }, s); t.textContent = n;
  }
  // 시간 → 각도: 단계마다 머무는 비중(w)대로 시간을 나누고, 단계 사이 틈은 짧게 멈춘다
  const TW = PH.reduce((a, p) => a + p.w, 0) + N * 0.25;
  function angleAt(u) {
    let t = u * TW;
    for (let i = 0; i < N; i++) {
      if (t < 0.25) return { a: i / N * 2 * Math.PI, k: i, tick: true };
      t -= 0.25;
      if (t < PH[i].w) { const f = ease(t / PH[i].w); return { a: seg[i].a0 - GAP + f * (seg[i].a1 - seg[i].a0 + 2 * GAP), k: i }; }
      t -= PH[i].w;
    }
    return { a: 2 * Math.PI, k: N - 1 };
  }
  function draw(u) {
    const { a, k, tick } = angleAt(u);
    const [x, y] = pt(a, R); dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    const a0 = Math.max(0, a - 1.1), n = 24; let d = "";
    for (let j = 0; j <= n; j++) { const [px, py] = pt(a0 + (a - a0) * j / n, R); d += (j ? "L" : "M") + px.toFixed(1) + "," + py.toFixed(1); }
    trail.setAttribute("d", d);
    arcs.forEach((c, i) => { const on = i === k && !tick; c.hi.style.opacity = on ? 1 : 0; c.lab.style.fill = on ? "var(--ltt-accent)" : "var(--ltt-ink-2)"; });
    ticks.forEach((c, i) => c.setAttribute("r", tick && i === k ? 10 : 6));
    lines.forEach((l, i) => { l.style.opacity = i < k || (i === k && !tick) ? (i === k ? 1 : 0.55) : 0; });
  }
  return { el: s, draw };
}

function loop(period, draw) {
  let raf = 0, t0 = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(raf); if (reduced) { draw(0.999); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } };
}

LTT.deck({
  title: "Node.js 이벤트 루프", theme: "terminal",
  glossary: { "이벤트 루프": "한 스레드가 여섯 단계를 차례로 돌며 준비된 콜백을 실행하는 고리", "마이크로태스크": "process.nextTick과 Promise 콜백. 단계가 바뀔 때마다 먼저 다 비운다" },
  scenes: [{
    type: "overview", title: "{{이벤트 루프}} 한 바퀴에 콜백이 도는 자리",
    caption: "점이 단계를 지날 때마다 가운데 로그에 그 단계의 콜백이 찍힌다. 점은 poll에서 오래 머물고, 단계 사이 틈에서 {{마이크로태스크}}를 비운다. ① " + TIPS[1] + " · ② " + TIPS[2] + " · ③ " + TIPS[3] + " · ④ " + TIPS[4],
    basis: "Node.js 공식 문서 \"The Node.js Event Loop\"의 단계 순서. 단계별 머무는 길이는 설명용 비중이다.",
    figure: (host) => { const f = eventLoop(host);
      // overview의 figure에는 leave가 없어서, 화면에서 빠지면 스스로 멈춘다
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) f.draw(0.999);
      else { let seen = false; const t0 = Date.now(); const g = () => { if (f.el.isConnected) seen = true; else if (seen) return; f.draw(((Date.now() - t0) / 10000) % 1); setTimeout(g, 16); }; g(); }
      return f.el; }
  }]
});
</script>
</body>
</html>
