<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄의 컴파일</title>
<script type="application/json" id="ltt-meta">{"topic":"소스→토큰→AST→바이트코드","audience":"컴파일러 입문 개발자","theme":"terminal","medium":"터미널 출력","decision":"컴파일 단계 구분","domain":"컴파일러","pattern":["hook"],"mode":"카탈로그용: 장면 하나짜리 본보기. 변환 구조를 \"값이 쌓임\" 움직임과 작은 여러 칸 구도로 보인다"}</script>
<script src="/legacy/kit-v1/vendor/d3.min.js"></script>
<script src="/legacy/kit-v1/ltt.js"></script>
<script src="/legacy/kit-v1/ltt-parts.js"></script>
<script src="/legacy/kit-v1/ltt-ui.js"></script>
<script src="/legacy/kit-v1/ltt-deck.js"></script>
<style>
.cp-wrap{display:flex;justify-content:center;width:100%}
.cp{width:1120px;max-width:100%;height:auto;display:block}
.cp text{font-family:var(--ltt-mono)}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const SRC = "x = a + b * 2";
// CPython 3.12 tokenize·ast.dump·dis 출력 그대로(python3.12에서 확인)
const TOK = [["NAME", "x", 0], ["OP", "=", 2], ["NAME", "a", 4], ["OP", "+", 6], ["NAME", "b", 8], ["OP", "*", 10], ["NUMBER", "2", 12]];
const AST = [{ l: "Assign", x: 110, y: 0, src: [0, 13] }, { l: "Name x", x: 55, y: 1, p: 0, src: [0, 1] }, { l: "BinOp +", x: 160, y: 1, p: 0, src: [4, 13] },
  { l: "Name a", x: 100, y: 2, p: 2, src: [4, 5] }, { l: "BinOp *", x: 200, y: 2, p: 2, src: [8, 13] },
  { l: "Name b", x: 150, y: 3, p: 4, src: [8, 9] }, { l: "Const 2", x: 225, y: 3, p: 4, src: [12, 13] }];
const OFF = [0, 2, 4, 6, 8, 12, 16, 18];
const BC = [["RESUME", "0", null], ["LOAD_NAME", "a", 3], ["LOAD_NAME", "b", 5], ["LOAD_CONST", "2", 6], ["BINARY_OP", "* ", 4],
  ["BINARY_OP", "+ ", 2], ["STORE_NAME", "x", 1], ["RETURN_CONST", "None", null]];
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
const txt = (p, x, y, s, st, anchor) => { const t = mk("text", { x, y, style: st, "text-anchor": anchor || "start" }, p); t.textContent = s; return t; };
const clamp = (v) => Math.max(0, Math.min(1, v));
// 한 주기 10초: 소스 0–.12, 토큰 .14–.38, AST .40–.62, 바이트코드 .64–.88, 나머지는 완성 상태로 멈춤
const PH = [[0, .12], [.14, .38], [.40, .62], [.64, .88]];

function pipeline(host) {
  const W = 1120, H = 470, PW = 260, GAP = 26, TOP = 64, PH_ = 340, CW = 13.2;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "cp", "data-annotate": "" }, host);
  const heads = [["소스", "문자열"], ["토큰", "tokenize"], ["AST", "ast.parse"], ["바이트코드", "dis"]];
  const px = (i) => i * (PW + GAP);
  const panes = heads.map((h, i) => { const g = mk("g", { transform: `translate(${px(i)},0)` }, s);
    mk("rect", { x: .5, y: TOP - 40, width: PW - 1, height: PH_ + 40, rx: 6, style: "fill:var(--ltt-card);stroke:var(--ltt-line-2)" }, g);
    txt(g, 16, TOP - 14, `${i + 1} ${h[0]}`, "font-size:16px;font-weight:700;fill:var(--ltt-ink)");
    txt(g, PW - 16, TOP - 14, h[1], "font-size:13px;fill:var(--ltt-muted)", "end");
    if (i < 3) mk("path", { d: `M${PW + 5},${TOP + PH_ / 2 - 20}l${GAP - 12},0m-6,-6l6,6l-6,6`, style: "fill:none;stroke:var(--ltt-muted);stroke-width:2" }, g);
    return g; });
  // 1 소스
  const srcHi = mk("rect", { y: TOP + 30, height: 30, rx: 3, style: "fill:var(--ltt-accent-soft)" }, panes[0]);
  const srcChars = [...SRC].map((c, k) => txt(panes[0], 20 + k * CW * 1.25, TOP + 52, c, "font-size:22px;fill:var(--ltt-ink)"));
  const cursor = mk("rect", { y: TOP + 34, width: 10, height: 24, style: "fill:var(--ltt-accent)" }, panes[0]);
  const srcNote = txt(panes[0], 20, TOP + 100, "", "font-size:13px;fill:var(--ltt-muted)");
  // 2 토큰
  const toks = TOK.map((t, k) => { const g = mk("g", {}, panes[1]); const y = TOP + 14 + k * 40;
    mk("rect", { x: 14, y, width: PW - 28, height: 32, rx: 4, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line)" }, g);
    txt(g, 26, y + 21, t[0], "font-size:14px;fill:var(--ltt-muted)"); txt(g, PW - 28, y + 22, `'${t[1]}'`, "font-size:17px;font-weight:700;fill:var(--ltt-accent)", "end"); return g; });
  // 3 AST
  const astG = AST.map((n, k) => { const g = mk("g", {}, panes[2]); const y = TOP + 26 + n.y * 78;
    if (n.p != null) { const p = AST[n.p]; mk("line", { x1: p.x , y1: TOP + 26 + p.y * 78 + 14, x2: n.x , y2: y - 14, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, g); }
    const w = n.l.length * 8 + 14; mk("rect", { x: n.x  - w / 2, y: y - 14, width: w, height: 28, rx: 4, style: "fill:var(--ltt-card-2);stroke:var(--ltt-accent)" }, g);
    txt(g, n.x , y + 5, n.l, "font-size:13px;fill:var(--ltt-ink)", "middle"); return g; });
  // 4 바이트코드
  const bcs = BC.map((b, k) => { const g = mk("g", {}, panes[3]); const y = TOP + 22 + k * 36;
    txt(g, 16, y, String(OFF[k]).padStart(2, "0"), "font-size:13px;fill:var(--ltt-muted)");
    txt(g, 44, y, b[0], "font-size:14px;fill:var(--ltt-ink)"); txt(g, PW - 16, y, b[1], "font-size:14px;font-weight:700;fill:var(--ltt-accent)", "end"); return g; });
  // 아래 누적 계수
  const counts = [0, 1, 2, 3].map((i) => txt(s, px(i) + PW / 2, TOP + PH_ + 44, "", "font-size:22px;font-weight:700;fill:var(--ltt-ink)", "middle"));
  const units = ["글자", "토큰", "노드", "명령"], totals = [SRC.length, TOK.length, AST.length, BC.length], groups = [srcChars, toks, astG, bcs];
  function draw(u) {
    let span = null;
    groups.forEach((items, i) => { const [a, b] = PH[i], f = clamp((u - a) / (b - a)), shown = Math.floor(f * items.length + 1e-9);
      items.forEach((n, k) => { const on = k < shown; n.style.opacity = on ? 1 : i === 0 ? 0 : .08;
        n.style.transform = on || i === 0 ? "none" : "translateY(6px)"; n.style.transition = "opacity .25s, transform .25s"; });
      counts[i].textContent = `${shown} / ${totals[i]} ${units[i]}`;
      counts[i].style.fill = shown === totals[i] ? "var(--ltt-ink)" : "var(--ltt-muted)";
      if (f > 0 && f < 1 && i > 0) { const k = Math.min(items.length - 1, shown - 1); if (k >= 0) {
        if (i === 1) span = [TOK[k][2], TOK[k][2] + TOK[k][1].length];
        if (i === 2) span = AST[k].src;
        if (i === 3) { const ai = BC[k][2]; span = ai == null ? null : AST[ai].src; } } } });
    const fs = clamp(u / PH[0][1]), typed = Math.floor(fs * SRC.length + 1e-9);
    cursor.setAttribute("x", 20 + typed * CW * 1.25); cursor.style.opacity = fs < 1 ? 1 : 0;
    srcChars.forEach((c, k) => c.style.opacity = k < typed ? 1 : 0);
    if (span) { srcHi.setAttribute("x", 16 + span[0] * CW * 1.25); srcHi.setAttribute("width", (span[1] - span[0]) * CW * 1.25 + 2); srcHi.style.opacity = 1; } else srcHi.style.opacity = 0;
    srcNote.textContent = span ? "← 지금 만드는 것의 출처" : u > PH[0][1] ? "한 줄, 13글자" : "";
  }
  return { el: s, draw };
}

function loop(period, draw) {
  let id = 0, t0 = 0; const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(id); if (reduced) { draw(.95); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 33); }; f(); },
    leave() { clearTimeout(id); } };
}

LTT.deck({
  title: "한 줄의 컴파일", theme: "terminal",
  glossary: { "토큰": "소스 글자를 이름·연산자·숫자 같은 최소 의미 단위로 자른 조각", "AST": "추상 구문 트리. 연산의 우선순위를 나무 모양으로 담은 구조" },
  scenes: [{
    type: "hook", pre: "CPython 3.12", text: "13글자 한 줄이 8개 명령이 되기까지",
    sub: "글자가 {{토큰}}으로 잘리고, {{AST}}로 묶이고, 스택 명령으로 풀린다. 바이트코드는 곱셈을 먼저 한다. 트리에서 더 깊이 있기 때문이다.",
    basis: "python3.12에서 tokenize·ast.dump·dis로 확인한 실제 출력(오프셋은 dis 기준, 단계 시간은 연출).",
    mount(body) { const w = body.appendChild(document.createElement("div")); w.className = "cp-wrap";
      const f = pipeline(w); f.draw(.95); return loop(10000, f.draw); }
  }]
});
</script>
</body>
</html>
