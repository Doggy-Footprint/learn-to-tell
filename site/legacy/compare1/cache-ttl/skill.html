<style>
  .tl { width: 100%; height: auto; display: block; }
  .tl text { font-family: var(--ltt-mono); fill: var(--ltt-ink-2); }

  .tl .base { stroke: var(--ltt-line); stroke-width: 2; }
  .tl .life { fill: var(--ltt-accent-soft); stroke: var(--ltt-accent); stroke-width: 1.5; }

  .tl .exp { stroke: var(--ltt-ink-2); stroke-dasharray: 5 4; stroke-width: 1.5; }
  .tl .chg { stroke: var(--ltt-warn); stroke-width: 2.5; }

<body>
<script>
  // EXPECTED_BY_HAND (모델 코드보다 먼저 손계산. 상품 하나의 요청 λ/s, TTL T초, 변경률 μ=1/3600/s)
  // 원본 요청/상품 = 1/(T+1/λ).  인기 λ=2: T=10 → 60/10.5 = 5.714286/분, T=60 → 60/60.5 = 0.991736/분
  // 롱테일 λ=1/600: T=10 → 3600/610 = 5.901639/시간, T=60 → 3600/660 = 5.454545/시간
  // 전체 = 200/(T+0.5) + 20000/(T+600):  T=10 51.834504, T=60 33.608815, T=300 22.887780 /s
  // hit 비율 T=60 = 1 - 33.608815/433.3333 = 0.922441
  // 오래된 응답 비율/상품 = λ(T-(1-e^{-μT})/μ)/(1+λT). 인기 T=300: 2(300-3600(1-e^{-1/12}))/601 = 0.040466
  // 전체(요청 가중) T=60 0.007644, T=120 0.015363, T=300 0.038392
  const EXPECTED_BY_HAND = { pop10: 5.714286, pop60: 0.991736, tail10: 5.901639, tail60: 5.454545, o10: 51.834504, o60: 33.608815, o300: 22.887780, hit60: 0.922441, spop300: 0.040466, s60: 0.007644, s120: 0.015363, s300: 0.038392 };

  const MU = 1 / 3600;
  const CLS = [{ id: "pop", n: 200, lam: 2 }, { id: "tail", n: 20000, lam: 1 / 600 }];
  const originPer = (T, lam) => 1 / (T + 1 / lam);
  const stalePer = (T, lam) => lam * (T - (1 - Math.exp(-MU * T)) / MU) / (1 + lam * T);
  const totalReq = CLS.reduce((a, c) => a + c.n * c.lam, 0);
  const originCls = (T, c) => c.n * originPer(T, c.lam);
  const originAll = (T) => CLS.reduce((a, c) => a + originCls(T, c), 0);
  const staleAll = (T) => CLS.reduce((a, c) => a + c.n * c.lam * stalePer(T, c.lam), 0) / totalReq;
  const hitAll = (T) => 1 - originAll(T) / totalReq;

  LTT.expect("인기 상품 원본/분 T=10", 60 * originPer(10, 2), EXPECTED_BY_HAND.pop10, { tol: 1e-4 });
  LTT.expect("인기 상품 원본/분 T=60", 60 * originPer(60, 2), EXPECTED_BY_HAND.pop60, { tol: 1e-4 });
  LTT.expect("롱테일 상품 원본/시간 T=10", 3600 * originPer(10, 1 / 600), EXPECTED_BY_HAND.tail10, { tol: 1e-4 });
  LTT.expect("롱테일 상품 원본/시간 T=60", 3600 * originPer(60, 1 / 600), EXPECTED_BY_HAND.tail60, { tol: 1e-4 });
  LTT.expect("전체 원본/초 T=10", originAll(10), EXPECTED_BY_HAND.o10, { tol: 1e-3 });
  LTT.expect("전체 원본/초 T=60", originAll(60), EXPECTED_BY_HAND.o60, { tol: 1e-3 });
  LTT.expect("전체 원본/초 T=300", originAll(300), EXPECTED_BY_HAND.o300, { tol: 1e-3 });
  LTT.expect("전체 hit 비율 T=60", hitAll(60), EXPECTED_BY_HAND.hit60, { tol: 1e-5 });
  LTT.expect("인기 상품 오래된 응답 T=300", stalePer(300, 2), EXPECTED_BY_HAND.spop300, { tol: 1e-5 });
  LTT.expect("전체 오래된 응답 T=60", staleAll(60), EXPECTED_BY_HAND.s60, { tol: 1e-5 });
  LTT.expect("전체 오래된 응답 T=120", staleAll(120), EXPECTED_BY_HAND.s120, { tol: 1e-5 });
  LTT.expect("전체 오래된 응답 T=300", staleAll(300), EXPECTED_BY_HAND.s300, { tol: 1e-5 });

  const STOPS = [10, 30, 60, 120, 300, 600, 1800, 3600];
  const fmtT = (t) => t < 60 ? t + "s" : t < 3600 ? t / 60 + "m" : t / 3600 + "h";
  const pc = (v, d = 1) => (v * 100).toFixed(d) + "%";
  const NS = "http://www.w3.org/2000/svg";
  const el = (p, tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; p.appendChild(n); return n; };

  function laneEvents(reqs, T, changes) {
    let exp = -Infinity, filled = null;
    const ev = [], lives = [];
    for (const t of reqs) {
      if (t >= exp) { filled = t; exp = t + T; lives.push([t, exp]); ev.push({ t, k: "miss" }); }
      else ev.push({ t, age: t - filled, k: changes.some((c) => c > filled && c <= t) ? "stale" : "hit" });
    }
    return { ev, lives };
  }

  const ONE = { reqs: [5, 18, 31, 52, 70, 88, 121, 140], T: 60 };

  // 타임라인: 상품 하나(또는 여러 줄)의 요청을 시간 축에 펼치고, miss는 아래 '상품 DB' 줄까지 내려 그린다. upto까지 그린다.
  function timeline({ span, lanes, upto = Infinity, W = 1000, laneH = 120, labels = false, tickEvery, labelW = 150, marks = [] }) {
    const H = lanes.length * laneH + 46;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "tl");
    const side = labelW >= 120;
    const x0 = side ? labelW : 20, x1 = W - 24;
    const x = (t) => x0 + (x1 - x0) * (t - span[0]) / (span[1] - span[0]);
    const axY = H - 34;
    el(svg, "line", { x1: x0, x2: x1, y1: axY, y2: axY, class: "ax" });
    for (let t = span[0]; t <= span[1]; t += tickEvery) {
      el(svg, "line", { x1: x(t), x2: x(t), y1: axY, y2: axY + 6, class: "ax" });
      el(svg, "text", { x: x(t), y: axY + 26, "text-anchor": "middle", "font-size": 17 }, fmtT(t));
    }
    lanes.forEach((ln, i) => {
      const top = i * laneH;
      const yb = top + (labels ? 118 : 54), yo = yb + (labels ? 54 : 40);
      if (side) {
        el(svg, "text", { x: 0, y: yb - 4, "font-size": 18, "font-weight": 700 }, ln.label);
        if (ln.sub) el(svg, "text", { x: 0, y: yb + 18, "font-size": 15 }, ln.sub);
        el(svg, "text", { x: 0, y: yo + 5, "font-size": 15 }, "상품 DB(원본)");
      } else {
        el(svg, "text", { x: x0, y: top + 20, "font-size": 18, "font-weight": 700 }, ln.label + (ln.sub ? "  · " + ln.sub : ""));
        el(svg, "text", { x: x0, y: yo + 18, "font-size": 15 }, "상품 DB(원본)");
      }
      el(svg, "line", { x1: x0, x2: x1, y1: yb, y2: yb, class: "base" });
      el(svg, "line", { x1: x0, x2: x1, y1: yo, y2: yo, class: "ax" });
      const changes = ln.changes || [];
      let lives, ev;
      if (ln.dense) {
        const starts = [];
        for (let t = span[0] + 0.5; t < span[1]; t += ln.T + 1 / ln.lam) starts.push(t);
        el(svg, "rect", { x: x0, y: yb - 6, width: x1 - x0, height: 12, class: "dense" });
        changes.forEach((c) => {
          const a = starts.filter((t) => t <= c).pop();
          if (a == null || c >= a + ln.T) return;
          el(svg, "rect", { x: x(c), y: yb - 9, width: Math.max(3, x(Math.min(a + ln.T, span[1])) - x(c)), height: 18, class: "stale-band" });
        });
        starts.forEach((t) => el(svg, "line", { x1: x(t), x2: x(t), y1: yo - 12, y2: yo, class: "miss-line" }));
        el(svg, "text", { x: x1, y: yo + 18, "text-anchor": "end", "font-size": 15 }, `원본 요청 ${starts.length}회 / 30분`);
        lives = []; ev = [];
      } else ({ lives, ev } = laneEvents(ln.reqs, ln.T, changes));
      if (ln.waits && labels) lives.forEach(([a, b], j) => {
        const c = lives[j + 1] && lives[j + 1][0];
        if (c != null && c <= upto && c > b) el(svg, "line", { x1: x(b), x2: x(c), y1: yb, y2: yb, class: "wait" });
      });
      lives.forEach(([a, b]) => {
        if (a > upto) return;
        const bb = Math.min(b, span[1], upto);
        el(svg, "rect", { x: x(a), y: yb - 34, width: Math.max(1.5, x(bb) - x(a)), height: 22, class: "life", rx: 3 });
        if (labels && x(bb) - x(a) > 150) el(svg, "text", { x: x(a) + 8, y: yb - 18, "font-size": 15 }, `저장본 · TTL ${ln.T}s`);
        changes.forEach((c) => { if (c > a && c < b && c <= upto) el(svg, "rect", { x: x(c), y: yb - 34, width: Math.max(1, x(Math.min(b, span[1], upto)) - x(c)), height: 22, class: "stale-band" }); });
        if (b <= span[1] && b <= upto && !ln.dense && lives.length < 30) {
          el(svg, "line", { x1: x(b), x2: x(b), y1: yb - 48, y2: yb + 10, class: "exp" });
          if (labels) el(svg, "text", { x: x(b), y: yb - 54, "text-anchor": "middle", "font-size": 15 }, `만료 ${b}s`);
        }
      });
      changes.forEach((c) => {
        if (c > upto) return;
        el(svg, "line", { x1: x(c), x2: x(c), y1: yb - (labels ? 70 : 40), y2: yb + 12, class: "chg" });
        el(svg, "text", { x: x(c) + 6, y: yb - (labels ? 74 : 40) + (labels ? 0 : 4), "font-size": 15 }, ln.changeLabel || "가격 변경");
      });
      ev.forEach(({ t, k, age }) => {
        if (t > upto || t > span[1]) return;
        if (k === "miss") {
          el(svg, "line", { x1: x(t), x2: x(t), y1: yb + 7, y2: yo, class: "miss-line" });
          el(svg, "circle", { cx: x(t), cy: yo, r: 4, class: "miss" });
          el(svg, "rect", { x: x(t) - 7, y: yb - 7, width: 14, height: 14, class: "miss" });
        } else if (k === "hit") el(svg, "circle", { cx: x(t), cy: yb, r: 6.5, class: "hit" });
        else el(svg, "path", { d: `M${x(t) - 7} ${yb - 7}L${x(t) + 7} ${yb + 7}M${x(t) + 7} ${yb - 7}L${x(t) - 7} ${yb + 7}`, class: "stale" });
        if (labels) el(svg, "text", { x: x(t) + 10, y: yb + 26, "font-size": 14 }, k === "miss" ? "MISS" : k === "hit" ? "HIT" : "STALE");
        if (labels && ln.ages && k !== "miss") {
          el(svg, "rect", { x: x(t - age), y: yb + 34, width: x(t) - x(t - age), height: 8, class: "age" });
          el(svg, "text", { x: x(t) + 4, y: yb + 43, "font-size": 13 }, `나이 ${age}s`);
        }
      });
      marks.filter((m) => m.lane === i).forEach((m) => {
        const cy = yb + m.dy;
        el(svg, "circle", { cx: x(m.t), cy, r: 14, class: "num" });
        el(svg, "text", { x: x(m.t), y: cy + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 700, class: "num-t" }, m.n);
      });
    });
    return svg;
  }

  function legend(items) {
    const d = document.createElement("div");
    d.className = "readout";
    d.innerHTML = items.map(([m, t]) => `<span style="margin-right:18px">${m} ${t}</span>`).join("");
    return d;
  }
  const LEG_BASE = [[LTT.mark("square", { inline: true, color: "var(--ltt-c2)", fill: true }), "MISS → 원본"], [LTT.mark("dot", { inline: true, color: "var(--ltt-c1)", fill: true }), "HIT"], ["▭", "저장본이 살아 있는 구간"]];
  const LEG_STALE = LEG_BASE.concat([[LTT.mark("cross", { inline: true, color: "var(--ltt-warn)" }), "STALE(바뀌기 전 값)"]]);

  function mini(hit) {
    const s = `<svg class="mini" viewBox="0 0 260 120">
      <rect x="4" y="40" width="64" height="38" rx="5"/><text x="36" y="64" text-anchor="middle" font-size="13">API</text>
      <rect x="98" y="40" width="64" height="38" rx="5"/><text x="130" y="64" text-anchor="middle" font-size="13">캐시</text>
      <rect x="192" y="40" width="64" height="38" rx="5"/><text x="224" y="64" text-anchor="middle" font-size="13">상품 DB</text>
      <path class="on" d="M68 59H98"/>
      <path class="${hit ? "off" : "on"}" d="M162 59H192"/>
      <text x="130" y="28" text-anchor="middle" font-size="13">${hit ? "저장본 있음 → 바로 응답" : "저장본 없음 → 원본까지"}</text>
      <text x="130" y="104" text-anchor="middle" font-size="13">${hit ? "cache=HIT 2ms" : "cache=MISS 38ms"}</text></svg>`;
    return s;
  }

  function stepsFigure(changes, extraLegend) {
    return () => {
      const wrap = document.createElement("div");
      const host = document.createElement("div");
      wrap.appendChild(host);
      wrap.appendChild(legend(extraLegend));
      const draw = (upto, ch = changes, o = {}) => { host.innerHTML = ""; host.appendChild(timeline({ span: [0, 150], lanes: [Object.assign({ label: "GET /products/1042", sub: "상품 하나", reqs: ONE.reqs, T: ONE.T, changes: ch, changeLabel: ch.length > 1 ? "가격 변경" : "가격 12,900→11,900" }, o)], upto, labels: true, tickEvery: 30, laneH: 190, labelW: 10 })); };
      draw(150);
      return { el: wrap, draw };
    };
  }

  function fieldRow(perDay, freq, harm) {
    const ticks = d3.range(perDay).map((i) => `<line x1="${4 + 292 * (i + 0.5) / Math.max(perDay, 1)}" x2="${4 + 292 * (i + 0.5) / Math.max(perDay, 1)}" y1="4" y2="22"/>`).join("");
    return `<div class="fieldv"><svg class="fday" viewBox="0 0 300 26"><rect x="4" y="4" width="292" height="18"/>${ticks}</svg><div>변경: <b>${freq}</b> · 틀리면: ${harm}</div></div>`;
  }

  function hbarsNode(rows, domain, ticks) {
    const d = document.createElement("div");
    d.style.maxWidth = "500px";
    LTT.hbars(d, { domain, ticks, fmt: (v) => v.toFixed(1) + "/s", rows });
    return d;
  }

  function tradeoffPanels(T, W = 1000, PH = 110, fs = 15) {
    const L = 70, R = 20, H = 2 * PH + 130;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "tl");
    const lx = d3.scaleLog().domain([10, 3600]).range([L, W - R]);
    const panels = [
      { y0: 34, h: PH, max: 60, f: originAll, lim: 35, name: "원본 요청 /초", fmt: (v) => v.toFixed(1) + "/s", ok: (v) => v <= 35 },
      { y0: PH + 80, h: PH, max: 0.1, f: staleAll, lim: 0.05, name: "오래된 응답 비율", fmt: (v) => pc(v), ok: (v) => v <= 0.05 },
    ];
    const ts = d3.range(0, 201).map((i) => 10 * Math.pow(360, i / 200));
    const pass = ts.filter((t) => originAll(t) <= 35 && staleAll(t) <= 0.05);
    const axY = 2 * PH + 80;
    if (pass.length) {
      el(svg, "rect", { x: lx(pass[0]), y: 34, width: lx(pass[pass.length - 1]) - lx(pass[0]), height: axY - 34, class: "pass" });
      el(svg, "text", { x: (lx(pass[0]) + lx(pass[pass.length - 1])) / 2, y: axY + 46, "text-anchor": "middle", "font-size": fs, "font-weight": 700 }, "두 한도 통과");
    }
    panels.forEach((p) => {
      const y = (v) => p.y0 + p.h - p.h * Math.min(v, p.max) / p.max;
      el(svg, "line", { x1: L, x2: W - R, y1: p.y0 + p.h, y2: p.y0 + p.h, class: "ax" });
      el(svg, "text", { x: L + 10, y: p.y0 - 12, "font-size": fs + 1, "font-weight": 700 }, p.name);
      el(svg, "line", { x1: L, x2: W - R, y1: y(p.lim), y2: y(p.lim), class: "lim" });
      el(svg, "text", { x: W - R, y: y(p.lim) - 6, "text-anchor": "end", "font-size": fs }, "한도 " + p.fmt(p.lim));
      el(svg, "path", { d: d3.line().x(lx).y((t) => y(p.f(t)))(ts.filter((t) => p.f(t) <= p.max)), class: "curve" });
      const v = p.f(T);
      el(svg, "circle", { cx: lx(T), cy: y(v), r: 8, class: p.ok(v) ? "ok" : "ng" });
      const above = y(v) - 14, below = y(v) + 26;
      const ty = Math.abs(above - y(p.lim)) < 18 || above < p.y0 + 4 ? below : above;
      el(svg, "text", { x: lx(T) + (T > 1000 ? -16 : 16), y: Math.abs(ty - y(p.lim)) < 14 ? ty + 16 : ty, "text-anchor": T > 1000 ? "end" : "start", "font-size": fs + 3, "font-weight": 700 }, p.fmt(v) + (v > p.max ? " ↑" : ""));
    });
    STOPS.forEach((t) => el(svg, "text", { x: lx(t), y: axY + 22, "text-anchor": "middle", "font-size": fs }, fmtT(t)));
    el(svg, "text", { x: L, y: axY + 46, "font-size": fs }, "가로축: TTL →");
    el(svg, "line", { x1: lx(T), x2: lx(T), y1: 34, y2: axY, class: "cur" });
    return svg;
  }

  function shareBar(T) {
    const p = originCls(T, CLS[0]), q = originCls(T, CLS[1]), tot = p + q;
    const d = document.createElement("div");
    d.className = "share";
    d.innerHTML = `<div class="share-h">원본 요청 합계 <b>${tot.toFixed(1)}/s</b> 중 몫</div>
      <div class="share-bar"><span class="s-pop" style="width:${(100 * p / tot).toFixed(1)}%"></span><span class="s-tail" style="width:${(100 * q / tot).toFixed(1)}%"></span></div>
      <div class="share-l"><span>${LTT.mark("square", { inline: true, color: "var(--ltt-c1)", fill: true })} 인기 ${p.toFixed(1)}/s</span><span>${LTT.mark("diamond", { inline: true, color: "var(--ltt-c3)", fill: true })} 롱테일 ${q.toFixed(1)}/s (${pc(q / tot, 0)})</span></div>`;
    return d;
  }

  function fieldStrip(n) {
    const rows = [["설명", "주 1회↓", "수 시간"], ["가격", "1시간 1번", "1–5분+결제 원본"], ["재고", "주문마다", "수 초+주문 원본"]];
    const d = document.createElement("div");
    d.className = "fstrip";
    d.innerHTML = `<div class="share-h">${n ? `<b class="ovn">${n}</b> ` : ""}필드별 TTL (변경 빈도 → TTL)</div>` + rows.map(([f, c, t]) => `<div class="frow"><b>${f}</b><span>${c}</span><span>→ ${t}</span></div>`).join("");
    return d;
  }

  function overviewFigure() {
    const wrap = document.createElement("div");
    wrap.className = "ov";
    const left = document.createElement("div");
    left.appendChild(timeline({ span: [0, 150], tickEvery: 30, laneH: 205, labels: true, labelW: 10,

        { label: "상품 7731", sub: "롱테일 · TTL 60s", reqs: [20, 112], T: ONE.T },
      ],
      marks: [{ lane: 0, t: 67.5, n: "1", dy: 40 }, { lane: 1, t: 100, n: "2", dy: 40 }, { lane: 0, t: 53, n: "3", dy: -23 }] }));
    left.appendChild(legend(LEG_STALE));
    left.insertAdjacentHTML("beforeend", `<div class="readout">① 원본/상품 = 1/(TTL+1/λ) · ③ 오래된 응답 ≈ μ·TTL/2</div>`);
    const right = document.createElement("div");
    right.className = "ov-r";
    const s2 = shareBar(60);
    s2.querySelector(".share-h").insertAdjacentHTML("afterbegin", `<b class="ovn">2</b> `);
    right.appendChild(s2);
    right.insertAdjacentHTML("beforeend", `<div class="share-h"><b class="ovn">4</b> 두 한도 사이의 TTL (예: 60s)</div>`);
    right.appendChild(tradeoffPanels(60, 620, 80, 20));
    right.appendChild(fieldStrip("5"));
    wrap.appendChild(left); wrap.appendChild(right);
    return wrap;
  }
