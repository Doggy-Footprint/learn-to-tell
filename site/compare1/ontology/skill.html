<title>부품 데이터: 테이블이면 충분할까, 온톨로지와 SHACL을 얹을까?</title>
<script type="application/json" id="ltt-meta">{"domain":"데이터 모델링·지식 그래프","topic":"트리플·RDF에서 RDFS/OWL 추론과 SHACL 검증까지, 부품 데이터 모델 고르기","audience":"SQL 테이블과 JSON을 다뤄 본 백엔드 개발자, RDF·OWL은 처음","pattern":["hook","terms","mount:stepper","figure","compare:table","statement","mount:stepper","terms","predict","mount:stepper","sweep","compare:table","statement","terms","predict","contrast","compare:table","figure","summary","overview","keywords"],"theme":"blueprint","medium":"데이터 모델 도면(부품 지식 그래프 도식)과 psql·Turtle·SPARQL·SHACL 검증 리포트 화면","mode":"체험형: 같은 부품 그래프 하나를 테이블 행에서 트리플로 옮기고, 질의로 맞춰 보고, 추론 규칙으로 늘리고, 검증기로 검사하며 장면마다 키워 간다","decision":"부품 데이터 모델: 테이블 vs 트리플, 추론을 켤지(물질화 비용), 검증을 OWL이 아니라 SHACL로 할지"}</script>

<style>
  .kgstage { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; width: 100%; }
  .kgstage .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .kgstage .ltt-term-mock, .kgstage .ltt-code-mock { font-size: 11px; }
  .kgstage .ltt-caption { min-height: 7.2em; }
  .tlist { font-family: var(--ltt-mono); font-size: 12.5px; line-height: 1.55; margin: 0; padding: 10px 12px; border: 1px solid var(--ltt-line-2); border-radius: var(--ltt-r, 6px); background: var(--ltt-card); }
  .tlist .h { font-family: var(--ltt-font); font-weight: 700; color: var(--ltt-muted); font-size: 12px; margin-bottom: 4px; }
  .tlist .inf { color: var(--ltt-accent); font-weight: 700; }
  .tlist .dim { color: var(--ltt-muted); }
  .bomgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: center; width: 100%; }
  .bomcol { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .bomcol .knobs { display: flex; gap: 22px; flex-wrap: wrap; }
  .bomcol .num { font-family: var(--ltt-mono); margin: 6px 0 0; color: var(--ltt-muted); }
  .bomcol .num b { color: var(--ltt-ink); font-size: 20px; }
  .glyph { font-family: var(--ltt-mono); font-size: 12px; line-height: 1.45; text-align: left; white-space: pre; margin: 0; }
  .ans2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ans2 .ltt-term-mock { font-size: 12px; }
</style>
</head>
<body>
<script>
  // Hand-derived from the formulas and rules only, before the model code below; the model must match these, not the reverse.
  const EXPECTED_BY_HAND = {
    dataTriples: 8,
    inferredAfter: { subclass: 4, domain: 5, transitive: 6 },
    elecNoReasoner: "B-18", elecReasoner: "B-18,M-200",
    q1: "B-18,M-200", q2: "B-18 daesung,M-200 hanbit", q3: "B-18,C-21,M-200",
    shacl: "C-21 MinCount,M-200 MaxCount",
    bom: [
      { b: 4, d: 2, D: 20, I: 16 },
      { b: 4, d: 4, D: 340, I: 912 },
      { b: 3, d: 5, D: 363, I: 1278 },
      { b: 2, d: 6, D: 126, I: 516 },
      { b: 6, d: 5, D: 9330, I: 35460 },
      { b: 6, d: 4, D: 1554, I: 4356 },
    ],
  };

  // ---- model: a tiny triple store, the four entailment rules this lesson uses, BGP matching, one SHACL shape, uniform BOM ----
  const T = (s, p, o) => [s, p, o];
  const DATA = [
    T("M-200", "a", "DriveMotor"), T("M-200", "partOf", "D-300"), T("M-200", "suppliedBy", "hanbit"),
    T("B-18", "a", "ElectricalPart"), T("B-18", "partOf", "D-300"), T("B-18", "suppliedBy", "daesung"),
    T("C-21", "partOf", "B-18"), T("C-21", "voltage", "3.6"),
  ];
  const SCHEMA = [
    T("DriveMotor", "subClassOf", "ElectricalPart"), T("ElectricalPart", "subClassOf", "Part"),
    T("partOf", "domain", "Part"), T("partOf", "a", "TransitiveProperty"),
  ];
  const key = (t) => t.join(" ");
  const RULES = {
    rdfs11: (g) => g.filter((x) => x[1] === "subClassOf").flatMap((x) => g.filter((y) => y[1] === "subClassOf" && y[0] === x[2]).map((y) => T(x[0], "subClassOf", y[2]))),
    rdfs9: (g) => g.filter((x) => x[1] === "a").flatMap((x) => g.filter((y) => y[1] === "subClassOf" && y[0] === x[2]).map((y) => T(x[0], "a", y[2]))),
    rdfs2: (g) => g.filter((x) => x[1] === "domain").flatMap((d) => g.filter((y) => y[1] === d[0]).map((y) => T(y[0], "a", d[2]))),
    trp: (g) => g.filter((x) => x[1] === "a" && x[2] === "TransitiveProperty").flatMap((p) =>
      g.filter((x) => x[1] === p[0]).flatMap((x) => g.filter((y) => y[1] === p[0] && y[0] === x[2]).map((y) => T(x[0], p[0], y[2])))),
  };
  function infer(base, names) {
    const seen = new Set(base.map(key)), g = base.slice(), out = [];
    for (let grew = true; grew;) {
      grew = false;
      for (const n of names) for (const t of RULES[n](g)) if (!seen.has(key(t))) { seen.add(key(t)); g.push(t); out.push(t); grew = true; }
    }
    return out;
  }
  const isVar = (x) => x[0] === "?";
  function match(patterns, g, binds = [{}]) {
    return patterns.reduce((bs, pat) => bs.flatMap((b) => g.flatMap((t) => {
      const nb = { ...b };
      for (let i = 0; i < 3; i++) {
        const p = pat[i];
        if (isVar(p)) { if (p in nb && nb[p] !== t[i]) return []; nb[p] = t[i]; } else if (p !== t[i]) return [];
      }
      return [nb];
    })), binds);
  }
  const pathPlus = (g, p, o) => { const r = new Set(), q = [o]; while (q.length) { const x = q.shift(); for (const t of g) if (t[1] === p && t[2] === x && !r.has(t[0])) { r.add(t[0]); q.push(t[0]); } } return [...r].sort(); };
  const joinSorted = (xs) => xs.slice().sort().join(",");
  const DATA_TWO_SUPPLIERS = DATA.concat([T("M-200", "suppliedBy", "daesung")]);
  function shaclPartShape(g) {
    const focus = [...new Set(g.filter((t) => t[1] === "partOf").map((t) => t[0]))].sort();
    return focus.flatMap((f) => { const n = g.filter((t) => t[0] === f && t[1] === "suppliedBy").length; return n < 1 ? [f + " MinCount"] : n > 1 ? [f + " MaxCount"] : []; });
  }
  function bom(b, d) {
    let D = 0, C = 0;
    for (let i = 1; i <= d; i++) { D += b ** i; C += i * b ** i; }
    return { D, I: C - D };
  }

  const G0 = DATA.concat(SCHEMA);
  const INF_SUB = infer(G0, ["rdfs9", "rdfs11"]);
  const INF_DOM = infer(G0, ["rdfs9", "rdfs11", "rdfs2"]);
  const INF_ALL = infer(G0, ["rdfs9", "rdfs11", "rdfs2", "trp"]);
  const Q1 = joinSorted(match([["?part", "partOf", "D-300"]], DATA).map((b) => b["?part"]));
  const Q2 = joinSorted(match([["?part", "partOf", "D-300"], ["?part", "suppliedBy", "?s"]], DATA).map((b) => b["?part"] + " " + b["?s"]));
  const Q3 = pathPlus(DATA, "partOf", "D-300").join(",");
  const ELEC0 = joinSorted(match([["?x", "a", "ElectricalPart"]], DATA).map((b) => b["?x"]));
  const ELEC1 = joinSorted(match([["?x", "a", "ElectricalPart"]], G0.concat(INF_ALL)).map((b) => b["?x"]));
  const SH = shaclPartShape(DATA_TWO_SUPPLIERS).join(",");

  const E = EXPECTED_BY_HAND, same = (a, b) => (a === b ? 1 : 0);
  LTT.expect("데이터 트리플 수", DATA.length, E.dataTriples, { tol: 0 });
  LTT.expect("rdfs9·rdfs11 뒤 추론 트리플 수", INF_SUB.length, E.inferredAfter.subclass, { tol: 0 });
  LTT.expect("rdfs2 더한 뒤 추론 트리플 수", INF_DOM.length, E.inferredAfter.domain, { tol: 0 });
  LTT.expect("전이 규칙 더한 뒤 추론 트리플 수", INF_ALL.length, E.inferredAfter.transitive, { tol: 0 });
  LTT.expect("?x a :ElectricalPart 추론 없이", same(ELEC0, E.elecNoReasoner), 1, { tol: 0 });
  LTT.expect("?x a :ElectricalPart 추론 켬", same(ELEC1, E.elecReasoner), 1, { tol: 0 });
  LTT.expect("질의1 ?part :partOf :D-300", same(Q1, E.q1), 1, { tol: 0 });
  LTT.expect("질의2 + :suppliedBy ?s", same(Q2, E.q2), 1, { tol: 0 });
  LTT.expect("질의3 :partOf+ :D-300", same(Q3, E.q3), 1, { tol: 0 });
  LTT.expect("SHACL 위반 목록", same(SH, E.shacl), 1, { tol: 0 });
  for (const c of E.bom) {
    const m = bom(c.b, c.d);
    LTT.expect(`BOM b${c.b} d${c.d} 직접 partOf`, m.D, c.D, { tol: 0 });
    LTT.expect(`BOM b${c.b} d${c.d} 추론 partOf`, m.I, c.I, { tol: 0 });
  }

  // ---- signature visual: one parts graph on fixed grid coordinates, so every scene shows the same picture in a new state ----
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  function kgSpec(o = {}) {
    const bad = (id) => o.shacl && (id === "C21" || id === "M200");
    const n = (id, c, r, l, s, k) => ({ id, c, r, l, s, k: bad(id) ? "bad" : k, flaw: bad(id) || undefined });
    const nodes = [
      n("Part", 0, 0, ":Part", "부품 · 클래스", "dark"), n("Elec", 1, 0, ":ElectricalPart", "전기부품 · 클래스", "dark"), n("Motor", 2, 0, ":DriveMotor", "구동모터 · 클래스", "dark"),
      n("M200", 2, 1, ":M-200", "모터"), n("hanbit", 3, 1, ":hanbit", "한빛모터 · 공급사"),
      n("D300", 0, 2, ":D-300", "전동드릴"), n("B18", 1, 2, ":B-18", "배터리팩"), n("daesung", 3, 2, ":daesung", "대성전기 · 공급사"),
      n("C21", 1, 3, ":C-21", "배터리셀"), n("v36", 2, 3, "3.6", "리터럴 · 숫자", "muted"),
    ];
    const edges = [
      { id: "Motor>Elec", f: "Motor", t: "Elec", l: "subClassOf", k: "muted" },
      { id: "Elec>Part", f: "Elec", t: "Part", l: "subClassOf", k: "muted" },
      { id: "M200>Motor", f: "M200", t: "Motor", l: "a" },
      { id: "M200>hanbit", f: "M200", t: "hanbit", l: "suppliedBy" },
      { id: "M200>D300", f: "M200", t: "D300", l: "partOf", shape: "ortho", from: "bottom", to: "top", via: [[2, 1.5], [0, 1.5]], lo: [-100, -11] },
      { id: "B18>Elec", f: "B18", t: "Elec", l: "a" },
      { id: "B18>D300", f: "B18", t: "D300", l: "partOf" },
      { id: "B18>daesung", f: "B18", t: "daesung", l: "suppliedBy", lo: [60, 0] },
      { id: "C21>B18", f: "C21", t: "B18", l: "partOf" },
      { id: "C21>v36", f: "C21", t: "v36", l: "voltage" },
    ];
    if (o.inferred) edges.push(
      { id: "M200>Elec", f: "M200", t: "Elec", l: "a (추론)", k: "accent", dash: true },
      { id: "C21>D300", f: "C21", t: "D300", l: "partOf (추론)", k: "accent", dash: true, lo: [-30, 8] });
    if (o.second) edges.push(
      { id: "M200>daesung", f: "M200", t: "daesung", l: "suppliedBy", k: "bad", lo: [26, -10] },
      { id: "hanbit>daesung", f: "hanbit", t: "daesung", l: "sameAs?", k: "bad", dash: true, both: true });
    return { cols: 4, rows: 4, cell: [212, 92], node: [136, 46], nodes, edges };
  }
  function drawKG(host, o) { const svg = host.appendChild(svgEl()); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "부품 지식 그래프: 클래스 세 개, 부품 네 개, 공급사 두 개, 리터럴 하나"); return LTT.diagram(svg, kgSpec(o)); }

  const INF_LABEL = { "M200>Elec": "a (추론)", "C21>D300": "partOf (추론)" };
  function showInf(f, on) {
    for (const [id, text] of Object.entries(INF_LABEL)) {
      const v = on.includes(id) ? "visible" : "hidden";
      f.dg.edge(id).style("visibility", v);
      f.host.querySelectorAll("text").forEach((t) => { if (t.textContent === text) t.style.visibility = v; });
    }
  }
  function kgStepScene(o, side, steps) {
    return (body) => {
      const wrap = body.appendChild(LTT.h("div", "kgstage"));
      const host = wrap.appendChild(LTT.h("div", "g")), f = { host, dg: drawKG(host, o) };
      const right = wrap.appendChild(LTT.h("div", "side"));
      Object.assign(f, side(right));
      LTT.stepper(right.appendChild(LTT.h("div")), steps.map((st) => ({ caption: st.caption, enter: (i) => st.enter(i, f) })));
      return {};
    };
  }

  // ---- scene 3: psql rows beside the graph they become ----
  const PSQL_HEAD = ["$ psql -c \"SELECT * FROM parts\"", { t: "dim", text: " id    | kind           | parent_id | supplier_id | voltage" }, { t: "dim", text: "-------+----------------+-----------+-------------+--------" }];
  const ROWS = {
    M200: " M-200 | DriveMotor     | D-300     | hanbit      |",
    B18: " B-18  | ElectricalPart | D-300     | daesung     |",
    C21: " C-21  |                | B-18      |             | 3.6",
  };
  function psql(term, hot) {
    term.screen.replaceChildren();
    PSQL_HEAD.forEach(term.add);
    Object.entries(ROWS).forEach(([id, text]) => term.add({ t: hot.includes(id) ? "warn" : "out", text }));
  }

  // ---- scene 7: SPARQL over the same graph ----
  const PREFIX = "PREFIX : <https://parts.example.com/id/>\n";
  const QUERIES = [
    { q: PREFIX + "SELECT ?part WHERE {\n  ?part :partOf :D-300 .\n}", head: "| part    |", rows: ["| :B-18   |", "| :M-200  |"] },
    { q: PREFIX + "SELECT ?part ?s WHERE {\n  ?part :partOf :D-300 .\n  ?part :suppliedBy ?s .\n}", head: "| part    | s        |", rows: ["| :B-18   | :daesung |", "| :M-200  | :hanbit  |"] },
    { q: PREFIX + "SELECT ?part WHERE {\n  ?part :partOf+ :D-300 .\n}", head: "| part    |", rows: ["| :B-18   |", "| :C-21   |", "| :M-200  |"] },
  ];
  function showQuery(fig, k) {
    fig.codeHost.replaceChildren(LTT.mock.code({ title: "parts.rq", code: QUERIES[k].q, marks: k === 0 ? { 3: "accent" } : k === 1 ? { 4: "accent" } : { 3: "accent" } }).el);
    fig.term.screen.replaceChildren();
    ["$ arq --data parts.ttl --query parts.rq", { t: "dim", text: QUERIES[k].head }, ...QUERIES[k].rows.map((r) => ({ t: "ok", text: r }))].forEach(fig.term.add);
    while (fig.term.screen.children.length < 6) fig.term.add({ t: "dim", text: " " });
  }

  // ---- scene 10: rule-by-rule inference list ----
  const short = (t) => `:${t[0]} ${t[1] === "a" ? "a" : t[1] === "subClassOf" ? "rdfs:subClassOf" : ":" + t[1]} :${t[2]}`;
  function inferList(host, names, label) {
    const inf = names.length ? infer(G0, names) : [];
    host.innerHTML = `<div class="h">${label} · 저장 ${G0.length}개 + 추론 ${inf.length}개</div>` +
      (inf.length ? inf.map((t) => `<div class="inf">+ ${short(t)}</div>`).join("") : `<div class="dim">(아직 추론한 트리플 없음)</div>`) +
      Array.from({ length: 6 - inf.length }, () => `<div class="dim">&nbsp;</div>`).join("");
  }

  // ---- scene 11: uniform BOM chain ----
  function chain(svg, d, b) {
    const W = 600, H = 240, x = (i) => 40 + i * (W - 80) / 6, y = 160;
    const s = d3.select(svg).attr("viewBox", `0 0 ${W} ${H}`);
    s.selectAll("*").remove();
    const names = ["D-300", "B-18", "C-21", "셀 단자", "단자 핀", "도금층", "코팅"];
    for (let i = 1; i <= d; i++) for (let j = 0; j < i - 1; j++) {
      const x1 = x(i), x2 = x(j), r = (x1 - x2) / 2;
      s.append("path").attr("d", `M${x1} ${y - 12} A ${r} ${Math.min(r, 120) * 0.9} 0 0 0 ${x2} ${y - 12}`).style("fill", "none").style("stroke", "var(--ltt-accent)").style("stroke-width", 1.5).style("stroke-dasharray", "4 4");
    }
    for (let i = 1; i <= d; i++) s.append("line").attr("x1", x(i) - 12).attr("x2", x(i - 1) + 12).attr("y1", y).attr("y2", y).style("stroke", "var(--ltt-ink)").style("stroke-width", 2);
    for (let i = 0; i <= d; i++) {
      s.append("circle").attr("cx", x(i)).attr("cy", y).attr("r", 10).style("fill", i === 0 ? "var(--ltt-ink)" : "var(--ltt-card)").style("stroke", "var(--ltt-ink)").style("stroke-width", 2);
      s.append("text").attr("x", x(i)).attr("y", y + 30).attr("text-anchor", "middle").text(names[i]).style("font-size", "12px");
      s.append("text").attr("x", x(i)).attr("y", y + 46).attr("text-anchor", "middle").text(i === 0 ? "제품 1개" : `층 ${i}: ${d3.format(",")(b ** i)}개`).style("font-size", "11px").style("fill", "var(--ltt-muted)");
    }
    s.append("text").attr("x", 4).attr("y", H - 4).text("실선 = 저장한 partOf · 점선 = 전이 추론으로 더해진 partOf (한 갈래만 그림)").style("font-size", "11px").style("fill", "var(--ltt-muted)");
  }

  // ---- small term pictures ----
  const tv = (label, inner, h = 100) => `<svg class="ltt-svg" viewBox="0 0 240 ${h}" style="max-height:${h + 10}px" role="img" aria-label="${label}">${inner}</svg>`;
  const box = (x, y, w, t, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="30" rx="4" style="fill:${o.fill || "var(--ltt-card)"};stroke:${o.stroke || "var(--ltt-ink)"};stroke-width:1.5${o.dash ? ";stroke-dasharray:4 3" : ""}"/><text x="${x + w / 2}" y="${y + 20}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${o.tc || "var(--ltt-ink)"}">${t}</text>`;
  const arr = (x1, y1, x2, y2, c = "var(--ltt-ink)", dash) => { const a = Math.atan2(y2 - y1, x2 - x1), p = (k) => `${x2 - 8 * Math.cos(a + k)},${y2 - 8 * Math.sin(a + k)}`; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c};stroke-width:2${dash ? ";stroke-dasharray:4 3" : ""}"/><polygon points="${x2},${y2} ${p(0.45)} ${p(-0.45)}" style="fill:${c}"/>`; };
  const lab = (x, y, t, c = "var(--ltt-muted)", a = "middle") => `<text x="${x}" y="${y}" text-anchor="${a}" style="font-size:11px;fill:${c}">${t}</text>`;
  const TV = {

  // ---- overview: the finished graph with each takeaway pinned to its place ----
  function overviewFigure(stage) {
    const svg = stage.appendChild(svgEl());
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "추론 엣지와 검증 위반까지 표시한 부품 그래프 위에 정리 번호 다섯 개");
    const spec = kgSpec({ inferred: true, shacl: true, second: true });
    LTT.diagram(svg, spec);
    const L = LTT.diagramLayout(spec), sel = d3.select(svg);
    const pin = (x, y, n) => {
      sel.append("circle").attr("cx", x).attr("cy", y).attr("r", 13).style("fill", "var(--ltt-ink)");
      sel.append("text").attr("x", x).attr("y", y + 5).attr("text-anchor", "middle").text(n).style("fill", "var(--ltt-card)").style("font-weight", 800).style("font-size", "14px");
    };
    const P = (id, n, dx = -4, dy = -2) => { const b = L.nodes[id]; pin(b.x + b.w + dx, b.y + dy, n); };
    P("M200", 1, 12, -10);
    P("D300", 2, 12, -10);
    P("Elec", 3, 12, -10);
    P("C21", 4, -150, -10);
    P("hanbit", 5, 12, -10);
    P("C21", 6, 14, 40);
  }

        mount(body) {
          body.innerHTML = `<div id="bom-goal"></div><div class="bomgrid"><div class="bomcol"><div class="knobs"><div class="ltt-param">조립품당 하위 부품 수 <b id="bb-v"></b><div id="bb"></div></div><div class="ltt-param">BOM 깊이 <b id="bd-v"></b><div id="bd"></div></div></div>

            <p class="ltt-basis">partOf 트리플 구성</p><div class="ltt-bar" id="bom-bar"></div>
            <p class="num">저장 <b id="bom-d">0</b> · 추론 <b id="bom-i">0</b> · 배수 <b id="bom-r">0</b></p></div>
            <svg class="ltt-svg" id="bom-chain" role="img" aria-label="드릴에서 가장 깊은 부품까지 한 갈래와 추론 partOf 호"></svg></div>`;
          const bar = LTT.bar("bom-bar", [{ color: "var(--ltt-ink)" }, { color: "var(--ltt-accent)" }]);
          const svg = body.querySelector("#bom-chain");
          const fmt = d3.format(",");
          LTT.sweep({
            params: {
              bb: { kind: "steps", stops: [2, 3, 4, 5, 6], value: 4, fmt: (v) => v + "개", label: "하위 부품 수" },
              bd: { kind: "steps", stops: [1, 2, 3, 4, 5, 6], value: 4, fmt: (v) => v + "단", label: "깊이" },
            },
            render({ bb, bd }) {
              const m = bom(bb, bd), tot = m.D + m.I;
              chain(svg, bd, bb);
              bar.set([m.D / tot * 100, m.I / tot * 100], ["저장", m.I ? "추론" : ""]);
              body.querySelector("#bom-d").textContent = fmt(m.D);
              body.querySelector("#bom-i").textContent = fmt(m.I);
              body.querySelector("#bom-r").textContent = (m.I / m.D).toFixed(2) + "배";
