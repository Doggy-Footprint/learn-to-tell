<body>
<script>
  // EXPECTED_BY_HAND (모델 코드보다 먼저 적음, 수정 왕복에서 다시 적음):
  // 순효용 = 구한 수 − 희생 수(1명). 레버·5명 → 4, 육교·5명 → 4, 육교·1명 → 0.
  // 의무론 허용(1)/불허(0): 수단이면 수와 무관하게 금지, 부작용이면 비례성(구한 수 > 희생 수)을 채울 때만 허용.
  // 레버·5명 → 1, 레버·1명 → 0(비례성 불충족), 육교·100명 → 0(제약).
  // 갈림 = 순효용 > 0 이면서 제약으로 금지. 8칸 중 육교·2, 육교·5, 육교·100 → 3칸.
  const EXPECTED_BY_HAND = { netLever5: 4, netPush5: 4, netPush1: 0, permitLever5: 1, permitLever1: 0, permitPush100: 0, divergeCells: 3 };

  const ACTS = ["lever", "push"];
  const SAVED = [1, 2, 5, 100];
  const SACRIFICED = 1;
  const ACT_NAME = { lever: "레버 당기기", push: "육교에서 밀기" };
  const net = (saved) => saved - SACRIFICED;
  // 0 허용, 1 제약 위반(수단), 2 비례성 불충족. 절대주의 의무론 + 이중 효과식 단순화라 문턱이 없다.
  const deonCode = (act, saved) => (act === "push" ? 1 : saved > SACRIFICED ? 0 : 2);
  const permitted = (act, saved) => (deonCode(act, saved) === 0 ? 1 : 0);
  const utilVerdict = (saved) => (net(saved) > 0 ? "해야 한다" : "어느 쪽도 같다");
  const diverges = (act, saved) => net(saved) > 0 && deonCode(act, saved) === 1;

  LTT.expect("순효용 레버·5명", net(5), EXPECTED_BY_HAND.netLever5, { tol: 0 });
  LTT.expect("순효용 육교·5명", net(5), EXPECTED_BY_HAND.netPush5, { tol: 0 });
  LTT.expect("순효용 육교·1명", net(1), EXPECTED_BY_HAND.netPush1, { tol: 0 });
  LTT.expect("의무론 허용 레버·5명", permitted("lever", 5), EXPECTED_BY_HAND.permitLever5, { tol: 0 });
  LTT.expect("의무론 허용 레버·1명", permitted("lever", 1), EXPECTED_BY_HAND.permitLever1, { tol: 0 });
  LTT.expect("의무론 허용 육교·100명", permitted("push", 100), EXPECTED_BY_HAND.permitPush100, { tol: 0 });
  LTT.expect("갈리는 칸 수", ACTS.reduce((n, a) => n + SAVED.filter((s) => diverges(a, s)).length, 0), EXPECTED_BY_HAND.divergeCells, { tol: 0 });

  const SRC = "Foot(1967) 'The Problem of Abortion and the Doctrine of the Double Effect'(운전사 사례) · Thomson(1976) 'Killing, Letting Die, and the Trolley Problem'(구경꾼 레버·육교·외과의) · Thomson(1985) 'The Trolley Problem' · Thomson(2008) 'Turning the Trolley'(구경꾼 레버 허용 견해를 거둬들임: 자신이 치르지 않을 비용을 남에게 치르게 한다는 이유, 운전사의 방향 틀기는 여전히 허용) · Kant(1785) 인간성 정식. '많은 의무론자가 허용'은 대략적 표현 <span class=\"ltt-tag\">불확실</span>";

  function deonCell(act, saved) {
    const c = deonCode(act, saved);
    if (c === 1) return ["수단인가? 예 — 몸을 도구로 쓴다", "→ 안 된다(금지)", "var(--ltt-bad)"];
    if (c === 2) return [`수단인가? 아니오 · 비례 ${saved} = 1 불충족`, "→ 할 근거 없음(불허)", "var(--ltt-ink)"];
    return [`수단인가? 아니오(부작용) · 비례 ${saved} > 1`, "→ 해도 된다(허용)", "var(--ltt-ink)"];
  }

  // One track drawing reused by every scene; `st` picks the case and which verdict cells are filled, so the reader watches one picture change instead of new ones.
  function trackFig(node) {
    const wrap = document.createElement("div");
    wrap.style.width = "100%";
    node.appendChild(wrap);
    const W = 980;
    function set(st) {
      wrap.innerHTML = "";
      const rows = st.rows || [{ act: st.act, saved: st.saved }];
      const PY = 318, rowH = 66, H = st.noTable ? 300 : PY + 34 + rows.length * rowH + (st.notes ? 132 : 6);
      const svg = d3.select(wrap).append("svg").attr("class", "ltt-svg trk").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img");
      const t = (x, y, s, cls, anchor) => svg.append("text").attr("x", x).attr("y", y).attr("class", cls || null).attr("text-anchor", anchor || "start").text(s);
      const ln = (d, stroke, w, dash) => svg.append("path").attr("d", d).style("fill", "none").style("stroke", stroke || "var(--ltt-ink-2)").style("stroke-width", w || 1.5).style("stroke-dasharray", dash || null);
      const showLever = st.act === "lever" || st.both;
      const showBridge = st.act === "push" || st.both;
      const person = (x, feet, tone, dash) => {
        const c = tone || "var(--ltt-ink)";
        svg.append("circle").attr("cx", x).attr("cy", feet - 34).attr("r", 8).style("fill", "var(--ltt-card)").style("stroke", c).style("stroke-width", 2).style("stroke-dasharray", dash || null);
        ln(`M${x},${feet - 26}V${feet - 12}M${x - 9},${feet - 20}H${x + 9}M${x},${feet - 12}l-7,12M${x},${feet - 12}l7,12`, c, 2, dash);
      };
      const rail = (d) => { ln(d, "var(--ltt-line-2)", 10); ln(d, "var(--ltt-ink-2)", 2.5); };
      const MY = 150, SY = 250;
      const bad = (x, y, s, anchor) => t(x, y, s, null, anchor).style("fill", "var(--ltt-bad)").style("font-weight", 700);

      if (showBridge) {
        ln("M318,88V158M432,88V158", "var(--ltt-line-2)", 6);
        svg.append("rect").attr("x", 300).attr("y", 78).attr("width", 150).attr("height", 10).style("fill", "var(--ltt-card-2)").style("stroke", "var(--ltt-ink-2)");
        t(375, 112, "육교", "sm", "middle");
      }
      rail(`M24,${MY}H956`);
      if (showLever) {
        rail(`M500,${MY}C560,${MY} 580,${SY} 650,${SY}H956`);
        ln("M462,214h40", "var(--ltt-ink-2)", 3);
        ln("M482,214l14,-30", "var(--ltt-accent)", 4);
        svg.append("circle").attr("cx", 496).attr("cy", 184).attr("r", 6).style("fill", "var(--ltt-accent)");
        t(482, 240, "레버", "hd", "middle");
        if (st.ignore) t(482, 266, "누가 당겼나: 셈에 없음", "sm", "middle").style("font-style", "italic");
      }
      svg.append("rect").attr("x", 40).attr("y", MY - 34).attr("width", 96).attr("height", 30).attr("rx", 4).style("fill", "var(--ltt-dark)");
      [60, 116].forEach((x) => svg.append("circle").attr("cx", x).attr("cy", MY - 2).attr("r", 6).style("fill", "var(--ltt-ink-2)"));
      t(88, MY - 13, "열차", null, "middle").style("fill", "var(--ltt-on-dark)").style("font-weight", 700);
      ln(`M146,${MY - 19}h46m-8,-6l8,6l-8,6`, "var(--ltt-ink)", 2);
      t(88, MY - 46, "브레이크 고장", "sm", "middle");

      const n = st.saved || 5, shown = Math.min(n, 5);
      for (let i = 0; i < shown; i++) person(740 + i * 40, MY);
      t(820, MY - 58, `주 선로 · ${n}명`, "hd", "middle");
      if (n > 5) t(948, MY - 16, "…", "hd", "end");
      if (showLever) {
        if (st.ghost) {
          person(830, SY, "var(--ltt-muted)", "3 3");
          t(790, SY - 16, "이 1명이 없다면?", "hd", "end");
        } else { person(830, SY); t(790, SY - 16, "옆 선로 · 1명", "hd", "end"); }
      }
      if (showBridge) {
        person(375, 78, st.act === "push" && st.outcomes ? "var(--ltt-bad)" : null);
        t(375, 22, "육교 위 · 1명", "hd", "middle");
      }
      if (st.outcomes) {
        bad(820, MY + 34, `그대로 두면 → ${n}명 사망`, "middle");
        if (st.ghost) t(830, SY + 30, "그래도 열차는 비켜 가고 5명이 산다", null, "middle").style("fill", "var(--ltt-good)").style("font-weight", 700);
        else if (showLever && st.act === "lever") bad(830, SY + 30, "당기면 → 이 1명 사망", "middle");
        if (st.act === "push") {
          ln(`M392,62C440,70 440,${MY - 50} 400,${MY - 30}m4,-10l-4,10l10,-2`, "var(--ltt-bad)", 2, "5 4");
          bad(462, 66, "밀면 → 그의 몸이 열차를 멈추고");
          bad(462, 88, "이 1명이 죽는다");
        }
      }

      if (st.noTable) return;
      const cx = [0, 168, 576];
      t(cx[0], PY + 4, "사례", "sm");
      t(cx[1], PY + 4, "공리주의 — 결과의 합", "hd");
      t(cx[2], PY + 4, "의무론 — 행위 검사", "hd");
      ln(`M0,${PY + 16}H${W}`, "var(--ltt-ink)", 1.5);
      rows.forEach((r, i) => {
        const y = PY + 16 + i * rowH, split = st.util && st.deon && diverges(r.act, r.saved);
        if (split) svg.append("rect").attr("x", 0).attr("y", y + 2).attr("width", W).attr("height", rowH - 4).style("fill", "var(--ltt-warn-soft)");
        t(cx[0] + 4, y + 28, ACT_NAME[r.act], "hd");
        t(cx[0] + 4, y + 52, split ? "판정 갈림" : `${r.saved}명 vs 1명`, "sm").style("fill", split ? "var(--ltt-warn)" : null).style("font-weight", split ? 800 : null);
        const verb = r.act === "push" ? ["밀면", "민다"] : ["당기면", "당긴다"];
        if (st.util) {
          t(cx[1], y + 26, `${verb[0]} ${r.saved} − 1 = ${net(r.saved) > 0 ? "+" : ""}${net(r.saved)} · 그대로 두면 0`);
          t(cx[1], y + 52, net(r.saved) > 0 ? `→ ${verb[1]}: 해야 한다` : "→ 어느 쪽도 같다", "vd").style("fill", "var(--ltt-ink)");
        } else t(cx[1], y + 40, st.utilHint || "—", "sm");
        const dc = st.deonText || (st.deon ? deonCell(r.act, r.saved) : null);
        if (dc) {
          t(cx[2], y + 26, dc[0]);
          t(cx[2], y + 52, dc[1], "vd").style("fill", dc[2] || "var(--ltt-ink)");
        } else t(cx[2], y + 40, st.deonHint || "—", "sm");
        ln(`M0,${y + rowH}H${W}`, "var(--ltt-line)", 1);
      });

      (st.marks || []).forEach(([x, y, k]) => {
        svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 12).style("fill", "var(--ltt-accent)");
        t(x, y + 5, k, null, "middle").style("fill", "var(--ltt-on-accent)").style("font-weight", 800);
      });
      if (st.notes) {
        const ny = PY + 34 + rows.length * rowH + 12;
        st.notes.forEach((s, i) => {
          const x = i < 3 ? 0 : 500, y = ny + (i % 3) * 40;
          svg.append("circle").attr("cx", x + 12).attr("cy", y + 12).attr("r", 11).style("fill", "var(--ltt-accent)");
          t(x + 12, y + 17, String(i + 1), null, "middle").style("fill", "var(--ltt-on-accent)").style("font-weight", 800).style("font-size", "13px");
          t(x + 32, y + 17, s, "sm").style("fill", "var(--ltt-ink)");
        });
      }
    }
    return { el: wrap, set };
  }

  const fig = (x, y, c) => `<circle cx="${x}" cy="${y - 22}" r="5" style="fill:var(--ltt-card);stroke:${c || "var(--ltt-ink)"};stroke-width:1.5"/><path d="M${x},${y - 17}v9m-5,-5h10m-5,5l-4,8m4,-8l4,8" style="fill:none;stroke:${c || "var(--ltt-ink)"};stroke-width:1.5"/>`;
  const ar = (x1, x2, y) => `<path d="M${x1},${y}H${x2}m-6,-5l6,5l-6,5" style="fill:none;stroke:var(--ltt-ink-2);stroke-width:1.5"/>`;
  // Beam tilted toward the 5-life pan so the picture says "more lives saved weighs more", not that the pans hold the dead.
  const TERM_UTIL = `<svg class="tv" viewBox="0 0 220 100" role="img">`
    + `<path d="M110,30V80M96,82h28" style="stroke:var(--ltt-ink-2);stroke-width:2.5;fill:none"/><path d="M40,46L180,18" style="stroke:var(--ltt-ink-2);stroke-width:2.5"/>`
    + `<path d="M14,62h52M154,34h52" style="stroke:var(--ltt-line-2);stroke-width:3"/>`
    + [24, 32, 40, 48, 56].map((x) => fig(x, 60)).join("") + fig(180, 32)
    + `<text x="40" y="80" text-anchor="middle">구하는 생명 5</text><text x="180" y="52" text-anchor="middle">구하는 생명 1</text><text x="110" y="97" text-anchor="middle">더 많이 구하는 쪽이 기운다</text></svg>`;
  const TERM_DEON = `<svg class="tv" viewBox="0 0 220 100" role="img">`
    + fig(26, 70) + ar(42, 96, 52)
    + `<rect x="104" y="20" width="12" height="62" style="fill:var(--ltt-bad-soft);stroke:var(--ltt-bad)"/><path d="M98,46l24,12M98,58l24,-12" style="stroke:var(--ltt-bad);stroke-width:2.5"/>`
    + `<path d="M130,52H200" style="stroke:var(--ltt-line-2);stroke-width:1.5;stroke-dasharray:4 4;fill:none"/><text x="166" y="44" text-anchor="middle" style="fill:var(--ltt-muted)">좋은 결과</text>`
    + `<text x="26" y="94" text-anchor="middle">행위</text><text x="110" y="96" text-anchor="middle">규칙의 선</text></svg>`;
  // Lever and footbridge side by side under the same counterfactual question, so "side effect vs means" is seen as one test with two answers.
  const MEANS_TEST = `<svg class="stv" viewBox="0 0 560 250" role="img">`
    + `<text x="140" y="22" text-anchor="middle" class="hd">레버</text><text x="420" y="22" text-anchor="middle" class="hd">육교</text>`
    + `<path d="M280,8V240" style="stroke:var(--ltt-line);stroke-width:1"/>`
    + `<path d="M20,80H250M110,80C140,80 150,130 180,130H250" style="fill:none;stroke:var(--ltt-ink-2);stroke-width:2.5"/>`
    + fig(220, 130, "var(--ltt-muted)") + [200, 216, 232].map((x) => fig(x, 80)).join("")
    + `<path d="M300,120H540" style="stroke:var(--ltt-ink-2);stroke-width:2.5"/><rect x="380" y="62" width="70" height="7" style="fill:var(--ltt-card-2);stroke:var(--ltt-ink-2)"/>`
    + fig(415, 62, "var(--ltt-muted)") + [490, 506, 522].map((x) => fig(x, 120)).join("")
    + `<text x="140" y="172" text-anchor="middle">1명이 없어도 5명이 산다</text><text x="420" y="172" text-anchor="middle">1명이 없으면 5명이 죽는다</text>`
    + `<text x="140" y="206" text-anchor="middle" class="hd">→ 예견된 부작용</text><text x="420" y="206" text-anchor="middle" class="hd" style="fill:var(--ltt-bad)">→ 구조의 수단</text>`
    + `<text x="140" y="234" text-anchor="middle">두 기준이 같은 행동</text><text x="420" y="234" text-anchor="middle" style="fill:var(--ltt-warn)">판정 정반대</text></svg>`;

  const NOTES = [
    "장면 3 · 공리주의: 결과의 합이 큰 쪽을 고른다",
    "장면 4 · 의무론: 제약 먼저, 그다음 비례성",
    "장면 6 · 수는 공리주의를, 방식은 의무론을 움직인다",
    "장면 7 · 해악이 수단이면 판정이 정반대",
    "장면 8 · 토론 사례: 누군가를 도구로 써야 하나?",
    "장면 9 · 각 입장은 상대 사례의 값을 치른다",
  ];

  LTT.deck({
    title: "결과의 합과 행위의 규칙, 두 기준은 어디서 갈리나",
    theme: "paper",
    glossary: {
      "제약": "결과가 아무리 좋아도 넘으면 안 되는 행위의 선. 예: 무고한 사람을 죽이지 말라, 속이지 말라. 영어로 constraint.",
