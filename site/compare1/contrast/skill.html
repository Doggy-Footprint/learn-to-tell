<script type="application/json" id="ltt-meta">{"domain":"UIUX","topic":"상대 휘도와 WCAG 대비비(AA/AAA, 글자 크기)","audience":"CSS 색 코드(#RRGGBB)를 읽는 UI 프론트엔드 개발자. 상대 휘도(감마 해제·채널 가중)부터 모른다","pattern":["hook","terms","predict","figure:steps","mount:split","figure:steps","terms","predict","sweep","compare:table","summary","summary","overview","keywords"],"theme":"studio","medium":"설정 화면 목업과 디자인 툴의 대비 검사 패널, 그리고 글자색·배경색을 올려 비율을 거리로 재는 밝기 눈금자(로그 축) 도면","mode":"체험형: 코드값이 빛으로 바뀌는 곡선을 단계별로 보고, 밝기 눈금자 위에서 대비비를 거리로 읽은 뒤, 설정 화면의 보조 텍스트 색과 크기를 바꿔 AA를 넘기는 가장 옅은 회색을 찾는다","decision":"설정 화면 보조 텍스트의 글자색·배경색 조합이 글자 크기에 맞는 AA/AAA 기준(4.5·3·7:1)을 넘는지 판정하고, 넘는 범위에서 가장 옅은 회색을 고르는 것"}</script>

<style>

  .swc { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }

<script>
  // Hand-computed before the model below (WCAG 2.x formulas, 0.04045 linearization threshold).
  const EXPECTED_BY_HAND = {
    lin119: 0.1845, lin10: 0.00304, L777: 0.1845, L808: 0.2159, Lr: 0.2126, Lg: 0.7152, Lb: 0.0722, code50: 187.5,
    crBW: 21, cr767: 4.542, cr777: 4.478, cr8A: 3.452, cr9E: 2.679, cr6B: 5.329, cr59: 7.005, cr3D: 10.862,
    crTw: 4.834, crTwGray: 4.393, cr767Gray: 4.127, crDark: 2.998, crLight: 1.110,
    twR: 0.0313, twG: 0.1203, twB: 0.0156,
    // Sweep goal: lightest gray of GRAYS that meets AA at that size (next lighter gray fails AA). One cell per size.
    goalCells: ["#767676@13px", "#767676@15px", "#767676@18px 굵게", "#8A8A8A@24px"],
  };

  const hexRGB = (h) => [0, 2, 4].map((i) => parseInt(h.replace("#", "").slice(i, i + 2), 16));
  const lin = (code) => { const c = code / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = (h) => { const [r, g, b] = hexRGB(h).map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const parts = (h) => { const [r, g, b] = hexRGB(h).map(lin); return [0.2126 * r, 0.7152 * g, 0.0722 * b]; };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const codeFor = (L) => 255 * (L <= 0.0031308 ? 12.92 * L : 1.055 * Math.pow(L, 1 / 2.4) - 0.055);
  const grayOf = (L) => { const c = Math.round(Math.max(0, Math.min(255, codeFor(L)))); return `rgb(${c},${c},${c})`; };
  const r2 = (x) => (Math.floor(x * 100) / 100).toFixed(2);

  // WCAG "large scale": 18pt (24px) or 14pt bold (18.67px); 18px bold is below the bold bound on purpose.
  const SIZES = {
    "13px": { css: "font-size:13px", large: false },
    "15px": { css: "font-size:15px", large: false },
    "18px 굵게": { css: "font-size:18px;font-weight:700", large: false },
    "24px": { css: "font-size:24px", large: true },
  };
  const GRAYS = ["#9E9E9E", "#8A8A8A", "#767676", "#6B6B6B", "#595959", "#3D3D3D"];
  const levelFor = (large) => (large ? { aa: 3, aaa: 4.5 } : { aa: 4.5, aaa: 7 });
  const meetsAA = (fg, sz) => ratio(fg, "#FFFFFF") >= levelFor(SIZES[sz].large).aa;
  const goalCheck = ({ fg, sz }) => { const i = GRAYS.indexOf(fg); return meetsAA(fg, sz) && (i === 0 || !meetsAA(GRAYS[i - 1], sz)); };

  const E = EXPECTED_BY_HAND, t3 = { tol: 0.001 };
  LTT.expect("lin(119)", lin(119), E.lin119, { tol: 0.0005 });
  LTT.expect("lin(10)", lin(10), E.lin10, { tol: 0.00005 });
  LTT.expect("L(#777777)", lum("#777777"), E.L777, { tol: 0.0005 });
  LTT.expect("L(#808080)", lum("#808080"), E.L808, { tol: 0.0005 });
  LTT.expect("L(#FF0000)", lum("#FF0000"), E.Lr, { tol: 0.0001 });
  LTT.expect("L(#00FF00)", lum("#00FF00"), E.Lg, { tol: 0.0001 });
  LTT.expect("L(#0000FF)", lum("#0000FF"), E.Lb, { tol: 0.0001 });
  LTT.expect("code for L=0.5", codeFor(0.5), E.code50, { tol: 0.1 });
  LTT.expect("R part of #6B7280", parts("#6B7280")[0], E.twR, { tol: 0.0005 });
  LTT.expect("G part of #6B7280", parts("#6B7280")[1], E.twG, { tol: 0.0005 });
  LTT.expect("B part of #6B7280", parts("#6B7280")[2], E.twB, { tol: 0.0005 });
  LTT.expect("CR(#000000,#FFFFFF)", ratio("#000000", "#FFFFFF"), E.crBW, t3);
  LTT.expect("CR(#000000,#595959)", ratio("#000000", "#595959"), E.crDark, t3);
  LTT.expect("CR(#F3F3F3,#FFFFFF)", ratio("#F3F3F3", "#FFFFFF"), E.crLight, t3);
  LTT.expect("CR(#767676,#FFFFFF)", ratio("#767676", "#FFFFFF"), E.cr767, t3);
  LTT.expect("CR(#777777,#FFFFFF)", ratio("#777777", "#FFFFFF"), E.cr777, t3);
  LTT.expect("CR(#8A8A8A,#FFFFFF)", ratio("#8A8A8A", "#FFFFFF"), E.cr8A, t3);
  LTT.expect("CR(#9E9E9E,#FFFFFF)", ratio("#9E9E9E", "#FFFFFF"), E.cr9E, t3);
  LTT.expect("CR(#6B6B6B,#FFFFFF)", ratio("#6B6B6B", "#FFFFFF"), E.cr6B, t3);
  LTT.expect("CR(#595959,#FFFFFF)", ratio("#595959", "#FFFFFF"), E.cr59, t3);
  LTT.expect("CR(#3D3D3D,#FFFFFF)", ratio("#3D3D3D", "#FFFFFF"), E.cr3D, t3);
  LTT.expect("CR(#6B7280,#FFFFFF)", ratio("#6B7280", "#FFFFFF"), E.crTw, t3);
  LTT.expect("CR(#6B7280,#F3F4F6)", ratio("#6B7280", "#F3F4F6"), E.crTwGray, t3);
  LTT.expect("CR(#767676,#F3F4F6)", ratio("#767676", "#F3F4F6"), E.cr767Gray, t3);
  const cells = [];  // sorted on both sides: the set matters, not the loop order
  GRAYS.forEach((fg) => Object.keys(SIZES).forEach((sz) => { if (goalCheck({ fg, sz })) cells.push(`${fg}@${sz}`); }));
  LTT.expect("sweep goal cell count", cells.length, E.goalCells.length, { tol: 0 });
  LTT.expect("sweep goal cells match hand list", cells.slice().sort().join(",") === E.goalCells.slice().sort().join(",") ? 1 : 0, 1, { tol: 0 });

  // Luminance ruler: x = ln(L + 0.05), so ln(contrast ratio) is a horizontal distance and every threshold bar has a fixed length.
  const RW = 980, X0 = 60, X1 = 890, AY = 132;
  const tx = (L) => X0 + (Math.log(L + 0.05) - Math.log(0.05)) / Math.log(21) * (X1 - X0);
  const barEnd = (xh, k) => xh - Math.log(k) / Math.log(21) * (X1 - X0);
  const ruler = (vb) => {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", vb ? `0 ${vb[0]} ${RW} ${vb[1]}` : `0 0 ${RW} 300`);
    svg.setAttribute("class", "ltt-svg rl");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "상대 휘도 눈금자: 왼쪽 검정, 오른쪽 흰색, 눈금은 L+0.05의 로그");
    let band = "";
    const n = 83, w = (X1 - X0) / n;
    for (let i = 0; i < n; i++) {
      const t = Math.log(0.05) + (i + 0.5) / n * Math.log(21), L = Math.exp(t) - 0.05;
      band += `<rect x="${X0 + i * w}" y="${AY - 12}" width="${w + 0.5}" height="24" style="fill:${grayOf(L)}"/>`;
    }
    const ticks = [0, 0.05, 0.1, 0.2, 0.5, 1].map((L) => `<line x1="${tx(L)}" x2="${tx(L)}" y1="${AY + 12}" y2="${AY + 20}" style="stroke:var(--ltt-line-2)"/><text class="tk" x="${tx(L)}" y="${AY + 36}" text-anchor="middle">${L}</text>`).join("");
    const base = `${band}<rect x="${X0}" y="${AY - 12}" width="${X1 - X0}" height="24" style="fill:none;stroke:var(--ltt-line-2)"/>${ticks}
      <text class="tk" x="${X1}" y="${AY + 56}" text-anchor="end">상대 휘도 L · 같은 배수 = 같은 간격</text>`;
    const set = (o) => {
      const lf = lum(o.fg), lb = lum(o.bg), hi = Math.max(lf, lb), lo = Math.min(lf, lb);
      const xh = tx(hi), xl = tx(lo), cr = (hi + 0.05) / (lo + 0.05), near = xh - xl < 150;
      const hx = hi === lf ? o.fg : o.bg, lx = hi === lf ? o.bg : o.fg;
      const pt = (x, h, L, anchor, dx) => `<rect x="${x - 11}" y="${AY - 18}" width="22" height="36" rx="4" style="fill:${h};stroke:var(--ltt-ink);stroke-width:2"/>
        <text class="hx" x="${x + dx}" y="${AY - 54}" text-anchor="${anchor}">${h}</text><text class="lv" x="${x + dx}" y="${AY - 34}" text-anchor="${anchor}">L ${L.toFixed(3)}</text>`;
      let s = base + pt(xl, lx, lo, near ? "end" : "middle", near ? -14 : 0) + pt(xh, hx, hi, near ? "start" : "middle", near ? 14 : 0);
      if (o.alt) {
        const xa = tx(lum(o.alt.bg));
        s += `<rect x="${xa - 9}" y="${AY - 15}" width="18" height="30" rx="3" style="fill:${o.alt.bg};stroke:var(--ltt-bad);stroke-width:2;stroke-dasharray:3 2"/>`;
      }
      if (o.bracket !== false) {
        s += `<path d="M${xl} ${AY - 76} V${AY - 84} H${xh} V${AY - 76}" style="fill:none;stroke:var(--ltt-accent);stroke-width:2"/>
          <text class="rt" x="${(xl + xh) / 2}" y="${AY - 92}" text-anchor="middle">${r2(cr)} : 1</text>`;
      }
      const bars = o.bars || [];
      bars.forEach((b, i) => {
        const y = AY + 76 + i * 28, end = barEnd(xh, b.k), ok = cr >= b.k;
        const tone = o.judge === false ? "muted" : ok ? "good" : "bad";
        s += `<line x1="${xh}" x2="${end}" y1="${y}" y2="${y}" style="stroke:var(--ltt-${tone});stroke-width:6;stroke-linecap:round"/>
          <line x1="${end}" x2="${end}" y1="${y - 9}" y2="${y + 9}" style="stroke:var(--ltt-${tone});stroke-width:2"/>
          <text class="bl" x="${end - 8}" y="${y + 5}" text-anchor="end" style="fill:var(--ltt-${tone})">${b.label}${o.judge === false ? "" : ok ? " 통과" : " 미달"}</text>`;
      });
      if (o.alt) {
        const xa = tx(lum(o.alt.bg)), y = AY + 76 + bars.length * 28, end = barEnd(xa, o.alt.k), ok = (lum(o.alt.bg) + 0.05) / (lo + 0.05) >= o.alt.k;
        s += `<line x1="${xa}" x2="${end}" y1="${y}" y2="${y}" style="stroke:var(--ltt-${ok ? "good" : "bad"});stroke-width:6;stroke-linecap:round;stroke-dasharray:10 6"/>
          <line x1="${end}" x2="${end}" y1="${y - 9}" y2="${y + 9}" style="stroke:var(--ltt-${ok ? "good" : "bad"});stroke-width:2"/>
          <text class="bl" x="${end - 8}" y="${y + 5}" text-anchor="end" style="fill:var(--ltt-${ok ? "good" : "bad"})">${o.alt.label}</text>`;
      }
      const rows = bars.length + (o.alt ? 1 : 0);
      if (rows) s += `<line x1="${xl}" x2="${xl}" y1="${AY + 18}" y2="${AY + 78 + (rows - 1) * 28}" style="stroke:var(--ltt-ink);stroke-dasharray:4 4"/>`;
      (o.marks || []).forEach((m) => {
        s += `<circle cx="${m.x}" cy="${m.y}" r="13" style="fill:var(--ltt-accent)"/><text x="${m.x}" y="${m.y + 5}" text-anchor="middle" style="font:800 15px var(--ltt-font);fill:var(--ltt-on-accent)">${m.n}</text>`;
      });
      svg.innerHTML = s;
    };
    return { el: svg, set };
  };
  const GENERIC = [{ k: 3, label: "3:1" }, { k: 4.5, label: "4.5:1" }, { k: 7, label: "7:1" }];
  const barsFor = (large) => { const v = levelFor(large); return [{ k: v.aa, label: `AA ${v.aa}:1` }, { k: v.aaa, label: `AAA ${v.aaa}:1` }]; };

  // Gamma curve with the guide lines of one or two sample codes.
  const gammaFig = () => {
    const wrap = LTT.h("div", "gm");
    const p = LTT.axisPlot(wrap, { width: 620, height: 310, x: [0, 255], y: [0, 1], margin: { l: 52, b: 44, t: 24, r: 16 },
      ticks: [[0, 64, 128, 192, 255], [0, 0.25, 0.5, 0.75]], labels: { x: "sRGB 코드값 (0–255)", y: "↑ 빛의 양 (0–1)" },
      series: [{ id: "naive", color: "var(--ltt-muted)", dash: true }, { id: "curve", color: "var(--ltt-accent)" }] });
    const mk = p.svg.append("g").attr("class", "mk");
    const guide = (code, y, label, tone, at) => {
      const [x0, y0] = p.px([code, 0]), [x1, y1] = p.px([code, y]), [xa] = p.px([0, y]);
      mk.append("path").attr("d", `M${x0},${y0} V${y1} H${xa}`).style("fill", "none").style("stroke", `var(--ltt-${tone})`).style("stroke-dasharray", "4 4").style("stroke-width", 1.5);
      mk.append("circle").attr("cx", x1).attr("cy", y1).attr("r", 6).style("fill", `var(--ltt-${tone})`);
      const left = at === "left";
      mk.append("text").attr("x", x1 + (left ? -10 : 10)).attr("y", y1 + (left ? -10 : 16)).attr("text-anchor", left ? "end" : "start").style("fill", `var(--ltt-${tone})`).text(label);
    };
    const curve = d3.range(0, 256, 3).concat([255]).map((c) => [c, lin(c)]);
    const show = (k) => {
      mk.selectAll("*").remove();
      p.set("naive", [[0, 0], [255, 1]]);
      p.set("curve", k >= 1 ? curve : []);
      if (k === 0) guide(119, 119 / 255, "#777777 → 0.467 ?", "muted", "left");
      if (k === 2) { guide(119, 119 / 255, "코드 비율 0.467", "muted", "left"); guide(119, lin(119), "빛 0.184", "accent"); }
      if (k === 3) { guide(128, lin(128), "#808080 → 빛 0.216", "accent"); guide(188, lin(188), "#BCBCBC → 빛 0.50", "accent"); }
      if (k === 4) guide(10, lin(10), "코드 10 → 0.003 (여기까지 직선 c/12.92)", "accent");
    };
    return { el: wrap, show };
  };

  // Stacked R/G/B contributions of one colour's L on a 0–scale axis.
  const stackSvg = (hex, scale, w, labelL, plain) => {
    const ps = parts(hex), x0 = labelL, sc = (w - x0 - 90) / scale, names = ["R", "G", "B"];
    let x = x0, s = `<text x="0" y="34" style="font:700 15px var(--ltt-mono);fill:var(--ltt-ink)">${hex}</text>`;
    ps.forEach((v, i) => {
      const ww = v * sc;
      s += `<rect x="${x}" y="14" width="${ww}" height="30" style="fill:var(--ltt-${["muted", "accent", "ink-2"][i]});stroke:var(--ltt-bg);stroke-width:1"/>`;
      s += `<text x="${x + ww / 2}" y="64" text-anchor="middle" style="font:13px var(--ltt-mono);fill:var(--ltt-ink-2)">${names[i]} ${v.toFixed(3)}</text>`;
      x += ww;
    });
    s += `<text x="${x + 8}" y="34" style="font:700 15px var(--ltt-mono);fill:var(--ltt-ink)">= ${lum(hex).toFixed(3)}</text>`;
    return `<svg ${plain ? 'style="width:100%;height:auto;display:block"' : 'class="ltt-svg"'} viewBox="0 0 ${w} 74" role="img" aria-label="${hex}의 상대 휘도를 R·G·B 기여분으로 쌓은 막대">${s}</svg>`;
  };

  const settingsMock = (n, bare) => {
    const b = LTT.mock.browser({ url: "app.example.com/settings/notifications", width: 420 });
    const rows = [["푸시 알림", "새 댓글과 멘션이 오면 휴대폰으로 알려 줍니다", ""], ["이메일 요약", "매주 월요일 오전 9시에 지난주 활동을 보냅니다", ""], ["방해 금지 시간", "밤 11시~오전 7시에는 알림을 보내지 않습니다", "off"]];
    b.screen.innerHTML = `<div class="set">${bare ? "" : "<h4>알림</h4>"}<div class="card">${rows.slice(0, n || 3).map(([a, c, off]) => `<div class="row"><div class="tx"><div class="t1">${a}</div><div class="t2" data-annotate>${c}</div></div><span class="tg ${off}"></span></div>`).join("")}</div></div>`;
    const paint = (fg, size) => b.screen.querySelectorAll(".t2").forEach((n) => { n.style.cssText = `${SIZES[size].css};color:${fg};margin-top:3px;line-height:1.35`; });
    return { el: b.el, paint };
  };

  const pair = (fg, bg) => `<div class="pair" style="background:${bg};color:${fg}">새 댓글과 멘션이 오면 휴대폰으로 알려 줍니다</div>`;
