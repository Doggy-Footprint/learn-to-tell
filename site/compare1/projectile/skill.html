<style>

<body>
<script>
  // 기대값: 모델 코드보다 먼저 손계산으로 적었다(ρ = 1.2 kg/m³, g = 9.81 m/s²).
  const EXPECTED_BY_HAND = {
    vtBaseball: 39.69,     // √(2·0.145·9.81 / (1.2·0.35·π·0.037²))
    vtTennis: 22.0,        // √(2·0.0575·9.81 / (1.2·0.55·π·0.0335²))
    vtPingpong: 8.38,      // √(2·0.0027·9.81 / (1.2·0.5·π·0.02²))
    vtShot: 149.4,         // √(2·7.26·9.81 / (1.2·0.47·π·0.06²))
    fallAtTau: Math.tanh(1),          // 낙하 v(t = vₜ/g) / vₜ = tanh 1
    riseU1: 0.5 * Math.log(2),        // 수직 발사 최고점 / (vₜ²/g) = ½ ln(1+u²), u = 1
    riseU2: 0.5 * Math.log(5),        // u = 2
    vacuumRel45: 1,                   // u → 0이면 R/R0(45°) = sin 90° = 1
    vacuumBest: 45,                   // u → 0이면 최적각 45°
    r0Baseball30: 900 / 9.81,         // v0²/g, v0 = 30 m/s
  };

  const G = 9.81, RHO = 1.2;
  const BALLS = {
    shot: { name: "투포환", m: 7.26, d: 0.12, cd: 0.47, v0: 13 },
    baseball: { name: "야구공", m: 0.145, d: 0.074, cd: 0.35, v0: 30 },
    tennis: { name: "테니스공", m: 0.0575, d: 0.067, cd: 0.55, v0: 25 },
    pingpong: { name: "탁구공", m: 0.0027, d: 0.04, cd: 0.5, v0: 15 },
  };
  const vt = (b) => Math.sqrt(2 * b.m * G / (RHO * b.cd * Math.PI * (b.d / 2) ** 2));
  Object.values(BALLS).forEach((b) => { b.vt = vt(b); });

  // 무차원 단위: 속도 vₜ, 시간 vₜ/g, 길이 vₜ²/g. 가속도 a = −ŷ − |v|v.
  const deriv = (s) => { const sp = Math.hypot(s[2], s[3]); return [s[2], s[3], -sp * s[2], -1 - sp * s[3]]; };
  const rk4 = (s, dt) => {
    const add = (a, b, k) => a.map((x, i) => x + b[i] * k);
    const k1 = deriv(s), k2 = deriv(add(s, k1, dt / 2)), k3 = deriv(add(s, k2, dt / 2)), k4 = deriv(add(s, k3, dt));
    return s.map((x, i) => x + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  };
  function fly(u, deg, n = 600) {
    const th = deg * Math.PI / 180, dt = Math.max(2 * u * Math.sin(th) / n, 1e-5);
    let s = [0, 0, u * Math.cos(th), u * Math.sin(th)], H = 0;
    const pts = [[0, 0]];
    for (let i = 0; i < 50 * n; i++) {
      const nx = rk4(s, dt);
      if (nx[1] < 0) { const r = s[1] / (s[1] - nx[1]), R = s[0] + r * (nx[0] - s[0]); pts.push([R, 0]); return { pts, R, H }; }
      s = nx; H = Math.max(H, s[1]); pts.push([s[0], s[1]]);
    }
    return { pts, R: s[0], H };
  }
  function fallSpeed(t, n = 2000) {
    let v = 0; const dt = t / n;
    for (let i = 0; i < n; i++) {
      const f = (w) => 1 - w * w, k1 = f(v), k2 = f(v + k1 * dt / 2), k3 = f(v + k2 * dt / 2), k4 = f(v + k3 * dt);
      v += dt / 6 * (k1 + 2 * k2 + 2 * k3 + k4);
    }
    return v;
  }
  // R0 = v0²/g를 1로 둔 좌표. u = 0은 진공 포물선.
  function traj(u, deg) {
    const th = deg * Math.PI / 180;
    if (u < 1e-6) {
      const R = Math.sin(2 * th);
      return { pts: d3.range(0, 1.0001, 0.01).map((f) => { const x = f * R; return [x, x * Math.tan(th) - x * x / (2 * Math.cos(th) ** 2)]; }), R };
    }
    const f = fly(u, deg, 400);
    return { pts: f.pts.map(([x, y]) => [x / (u * u), y / (u * u)]), R: f.R / (u * u) };
  }
  const rel = (u, deg) => traj(u, deg).R;
  const bestCache = new Map();
  function best(u) {
    if (bestCache.has(u)) return bestCache.get(u);
    let a = 15, b = 50;
    const gr = (Math.sqrt(5) - 1) / 2;
    for (let i = 0; i < 40; i++) {
      const c = b - gr * (b - a), d = a + gr * (b - a);
      if (rel(u, c) > rel(u, d)) b = d; else a = c;
    }
    const deg = (a + b) / 2, r = { deg, R: rel(u, deg) };
    bestCache.set(u, r);
    return r;
  }

  LTT.expect("vₜ 야구공 (m/s)", BALLS.baseball.vt, EXPECTED_BY_HAND.vtBaseball, { tol: 0.1 });
  LTT.expect("vₜ 테니스공 (m/s)", BALLS.tennis.vt, EXPECTED_BY_HAND.vtTennis, { tol: 0.1 });
  LTT.expect("vₜ 탁구공 (m/s)", BALLS.pingpong.vt, EXPECTED_BY_HAND.vtPingpong, { tol: 0.05 });
  LTT.expect("vₜ 투포환 (m/s)", BALLS.shot.vt, EXPECTED_BY_HAND.vtShot, { tol: 0.3 });
  LTT.expect("낙하 v(vₜ/g)/vₜ = tanh 1", fallSpeed(1), EXPECTED_BY_HAND.fallAtTau, { tol: 1e-6 });
  LTT.expect("수직 발사 최고점 u=1", fly(1, 90, 4000).H, EXPECTED_BY_HAND.riseU1, { tol: 1e-3 });
  LTT.expect("수직 발사 최고점 u=2", fly(2, 90, 4000).H, EXPECTED_BY_HAND.riseU2, { tol: 1e-3 });
  LTT.expect("u=0.01 R/R0(45°)", rel(0.01, 45), EXPECTED_BY_HAND.vacuumRel45, { tol: 1e-3 });
  LTT.expect("u=0.01 최적각", best(0.01).deg, EXPECTED_BY_HAND.vacuumBest, { tol: 0.5 });
  LTT.expect("야구공 30 m/s 진공 사거리 (m)", 30 * 30 / G, EXPECTED_BY_HAND.r0Baseball30, { tol: 0.01 });

  const pct = (x) => Math.round(x * 100) + "%";
  const NS = "http://www.w3.org/2000/svg";
  const svgIn = (node) => node.appendChild(document.createElementNS(NS, "svg"));
  const label = (svg, x, y, t, o = {}) => svg.append("text").attr("x", x).attr("y", y).attr("text-anchor", o.anchor || "start")
    .attr("class", "mk-t").style("font-size", (o.size || 13) + "px").style("fill", o.color || "var(--ltt-ink)").text(t);
  const num = (svg, x, y, n) => {
    svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 13).style("fill", "var(--ltt-ink)");
    svg.append("text").attr("x", x).attr("y", y + 5).attr("text-anchor", "middle").attr("class", "mk-t").style("font-size", "14px").style("fill", "var(--ltt-card)").text(n);
  };

  // 주 그림: R0 = v0²/g를 1로 둔 궤적 플롯.
  function trajPlot(node, o = {}) {
    const p = LTT.axisPlot(svgIn(node), {
      width: o.width || 640, height: o.height || 380, x: [0, 1.1], y: [0], equal: true, ticks: [[0, 0.25, 0.5, 0.75, 1], [0.25, 0.5]],
      labels: { x: "수평 거리 ÷ (v₀²/g)", y: "높이 ÷ (v₀²/g)" }, margin: { l: 44, r: 14, t: 12, b: 34 },
      series: o.series || [{ id: "vac", k: "muted", dash: true }, { id: "drag", k: "c1", dot: true }],
    });
    p.svg.style("overflow", "hidden");
    return p;
  }

  const TERM_VIS = {
    drag: (node) => {
      const s = d3.select(svgIn(node)).attr("viewBox", "0 0 240 110").attr("class", "ltt-svg").style("max-height", "120px");
      [[30, 1], [62, 2]].forEach(([y, k], i) => {
        s.append("circle").attr("cx", 120).attr("cy", y).attr("r", 9).style("fill", "var(--ltt-c1)");
        s.append("line").attr("x1", 131).attr("y1", y).attr("x2", 131 + 20 * k - 8).attr("y2", y).style("stroke", "var(--ltt-ink)").style("stroke-width", 2.5);
        s.append("path").attr("d", `M${131 + 20 * k - 8},${y - 5}l8,5l-8,5z`).style("fill", "var(--ltt-ink)");
        s.append("line").attr("x1", 109).attr("y1", y).attr("x2", 109 - 20 * k * k + 8).attr("y2", y).style("stroke", "var(--ltt-bad)").style("stroke-width", 2.5);
        s.append("path").attr("d", `M${109 - 20 * k * k + 8},${y - 5}l-8,5l8,5z`).style("fill", "var(--ltt-bad)");
        label(s, 228, y + 4, i ? "속도 2배" : "속도 1", { anchor: "end", size: 12 });
      });
      label(s, 8, 98, "항력 4배 (속도의 제곱)", { size: 12, color: "var(--ltt-bad)" });
    },
    vt: (node) => {
      const s = d3.select(svgIn(node)).attr("viewBox", "0 0 240 110").attr("class", "ltt-svg").style("max-height", "120px");
      const x = d3.scaleLinear([0, 3], [24, 228]), y = d3.scaleLinear([0, 1.15], [92, 8]);
      s.append("path").attr("d", `M24,8V92H228`).style("fill", "none").style("stroke", "var(--ltt-ink-2)");
      s.append("line").attr("x1", 24).attr("x2", 228).attr("y1", y(1)).attr("y2", y(1)).style("stroke", "var(--ltt-muted)").attr("stroke-dasharray", "5 4");
      s.append("path").attr("d", d3.line()(d3.range(0, 3.01, 0.05).map((t) => [x(t), y(Math.tanh(t))]))).style("fill", "none").style("stroke", "var(--ltt-c1)").style("stroke-width", 2.5);
      label(s, 226, y(1) - 6, "vₜ", { anchor: "end", size: 12 });
      label(s, 226, 106, "시간 →", { anchor: "end", size: 11, color: "var(--ltt-muted)" });
      label(s, 26, 106, "↑ 낙하 속도", { size: 11, color: "var(--ltt-muted)" });
    },
  };

  // 장면 3: 야구공을 떨어뜨렸을 때 속도-시간.
  function fallFigure(node) {
    const w = node.appendChild(LTT.h("div", "fg"));
    const b = BALLS.baseball, T = 10;
    const p = LTT.axisPlot(svgIn(w), {
      width: 760, height: 400, x: [0, T], y: [0, 50], ticks: [[0, 2, 4, 6, 8, 10], [0, 10, 20, 30, 40, 50]],
      labels: { x: "떨어진 시간 (s)", y: "낙하 속도 (m/s)" }, margin: { l: 44, r: 16, t: 14, b: 34 },
      series: [{ id: "vac", k: "muted", dash: true }, { id: "drag", k: "c1" }],
    });
    const svg = p.svg;
    const vac = d3.range(0, 50 / G, 0.05).concat([50 / G]).map((t) => [t, G * t]);
    const drag = d3.range(0, T + 0.001, 0.1).map((t) => [t, b.vt * fallSpeed(t * G / b.vt, 200)]);
    const vtLine = svg.append("g");
    vtLine.append("line").attr("x1", p.x(0)).attr("x2", p.x(T)).attr("y1", p.y(b.vt)).attr("y2", p.y(b.vt)).style("stroke", "var(--ltt-bad)").attr("stroke-dasharray", "8 5").style("stroke-width", 1.5);
    vtLine.append("text").attr("x", p.x(T) - 4).attr("y", p.y(b.vt) - 8).attr("text-anchor", "end").attr("class", "mk-t").style("font-size", "14px").style("fill", "var(--ltt-bad)").text(`종단 속도 vₜ ≈ ${b.vt.toFixed(0)} m/s`);
    const vacLab = label(svg, p.x(3.3), p.y(G * 3.3) - 6, "진공: v = g·t (계속 빨라짐)", { anchor: "end", size: 13, color: "var(--ltt-muted)" });
    const dragLab = label(svg, p.x(6), p.y(30), "항력 있음", { size: 13, color: "var(--ltt-c1)" });
    const forces = svg.append("g");
    [1.5, 3.5, 7].forEach((t) => {
      const v = b.vt * fallSpeed(t * G / b.vt, 200), [cx, cy] = p.px([t, v]), L = 46, d = L * (v / b.vt) ** 2;
      forces.append("line").attr("x1", cx - 5).attr("x2", cx - 5).attr("y1", cy + 8).attr("y2", cy + 8 + L - 7).style("stroke", "var(--ltt-ink-2)").style("stroke-width", 3);
      forces.append("path").attr("d", `M${cx - 10},${cy + 1 + L}l5,8l5,-8z`).style("fill", "var(--ltt-ink-2)");
      forces.append("line").attr("x1", cx + 5).attr("x2", cx + 5).attr("y1", cy + 8 + L).attr("y2", cy + 8 + L - d + 7).style("stroke", "var(--ltt-bad)").style("stroke-width", 3);
      forces.append("path").attr("d", `M${cx},${cy + 15 + L - d}l5,-8l5,8z`).style("fill", "var(--ltt-bad)");
    });
    label(svg, p.x(1.5) + 14, p.y(b.vt * fallSpeed(1.5 * G / b.vt, 200)) + 50, "무게 ↓ · 항력 ↑", { size: 12, color: "var(--ltt-ink-2)" });
    const half = svg.append("g");
    const th = b.vt / G * Math.atanh(0.5);
    half.append("circle").attr("cx", p.x(th)).attr("cy", p.y(b.vt / 2)).attr("r", 5).style("fill", "var(--ltt-ink)");
    half.append("text").attr("x", p.x(th) + 10).attr("y", p.y(b.vt / 2) + 18).attr("class", "mk-t").style("font-size", "13px").style("fill", "var(--ltt-ink)").text("v = vₜ/2 → 항력 = 무게의 ¼");
    return { el: w, show(k) {
      p.set("vac", vac); vacLab.style("opacity", 1);
      p.set("drag", drag); dragLab.style("opacity", 1);
      forces.style("opacity", k >= 1 ? 1 : 0);
      vtLine.style("opacity", k >= 2 ? 1 : 0); half.style("opacity", k >= 2 ? 1 : 0);
    } };
  }

  // 장면 7: v0/vₜ 위치를 로그 눈금 위에.
  const uScale = d3.scaleLog([0.05, 4], [16, 544]);
  function gauge(u) {
    return (node) => {
      node.classList.add("ga");
      const s = d3.select(svgIn(node)).attr("viewBox", "0 0 560 58").attr("class", "ltt-svg");
      s.append("rect").attr("x", uScale(0.05)).attr("y", 12).attr("width", uScale(0.25) - uScale(0.05)).attr("height", 16).style("fill", "var(--ltt-good-soft)");
      s.append("line").attr("x1", 16).attr("x2", 544).attr("y1", 28).attr("y2", 28).style("stroke", "var(--ltt-ink-2)");
      [0.1, 0.25, 0.5, 1, 2, 4].forEach((t) => {
        s.append("line").attr("x1", uScale(t)).attr("x2", uScale(t)).attr("y1", 28).attr("y2", 33).style("stroke", "var(--ltt-ink-2)");
        s.append("text").attr("x", uScale(t)).attr("y", 47).attr("text-anchor", "middle").style("font", "11px var(--ltt-mono)").style("fill", "var(--ltt-muted)").text(t);
      });
      s.append("path").attr("d", `M${uScale(u)},26l-7,-12h14z`).style("fill", "var(--ltt-ink)");
      s.append("text").attr("x", uScale(u)).attr("y", 10).attr("text-anchor", "middle").style("font", "700 11px var(--ltt-mono)").style("fill", "var(--ltt-ink)").text(u.toFixed(2));
    };
  }

  // 장면 10: 최적각 곡선.
  const U_GRID = d3.range(0, 4.001, 0.1).map((u) => +u.toFixed(2));
  function angleFigure(node) {
    const w = node.appendChild(LTT.h("div", "fg"));
    const p = LTT.axisPlot(svgIn(w), {
      width: 760, height: 400, x: [0, 4], y: [28, 47], ticks: [[0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4], [30, 35, 40, 45]],
      labels: { x: "v₀ / vₜ", y: "최대 사거리 발사각 (°)" }, margin: { l: 44, r: 16, t: 14, b: 34 },
      series: [{ id: "ref", k: "muted", dash: true }, { id: "best", k: "c1" }],
    });
    const svg = p.svg;
    const curve = U_GRID.map((u) => [u, u === 0 ? 45 : best(u).deg]);
    const balls = svg.append("g");
    Object.values(BALLS).forEach((b, i) => {
      const u = b.v0 / b.vt, [cx, cy] = p.px([u, best(u).deg]);
      balls.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 6).style("fill", "var(--ltt-card)").style("stroke", "var(--ltt-ink)").style("stroke-width", 2);
      balls.append("text").attr("x", cx + (i === 0 ? 10 : -8)).attr("y", cy + (i === 0 ? 20 : -12)).attr("text-anchor", i === 0 ? "start" : "end").attr("class", "mk-t").style("font-size", "13px").style("fill", "var(--ltt-ink)").text(`${b.name} ${u.toFixed(2)}`);
    });
    const loss = svg.append("g");
    [1, 2, 4].forEach((u) => {
      const bb = best(u), pen = 1 - rel(u, 45) / bb.R, [cx, cy] = p.px([u, bb.deg]);
      loss.append("line").attr("x1", cx).attr("x2", cx).attr("y1", p.y(45)).attr("y2", cy).style("stroke", "var(--ltt-warn)").style("stroke-width", 2);
      loss.append("text").attr("x", cx + (u === 4 ? -8 : 8)).attr("y", (p.y(45) + cy) / 2 + 4).attr("text-anchor", u === 4 ? "end" : "start").attr("class", "mk-t").style("font-size", "13px").style("fill", "var(--ltt-warn)").text(`45°로 던지면 −${(pen * 100).toFixed(1)}%`);
    });
    const bars = svg.append("g");
    const bx = p.x(1.75), by = p.y(46.4);
    label(bars, bx, by, "v₀/vₜ = 0.76에서 잃는 사거리", { size: 12, color: "var(--ltt-ink-2)" });
    [["항력 무시(진공 공식)", 1 - rel(0.76, 45), "var(--ltt-bad)"], ["45° 고집", 1 - rel(0.76, 45) / best(0.76).R, "var(--ltt-warn)"]].forEach(([t, v, c], i) => {
      const y0 = by + 12 + i * 26;
      bars.append("rect").attr("x", bx + 150).attr("y", y0).attr("width", Math.max(2, v * 400)).attr("height", 14).style("fill", c);

            <label class="ltt-param">v₀ / vₜ</label><div id="qu"></div>
            <div class="ro"><span>발사각</span><b id="qa"></b><span>최대 대비 사거리</span><b id="qr"></b><span>이 조건의 최적각</span><b id="qb"></b><span>45°일 때</span><b id="q45"></b></div>
            <p class="ltt-basis">화살표 끝 원을 호를 따라 끌거나, 누른 뒤 화살표 키로 1°씩 돌린다.</p></div></div>`;
          const p = LTT.axisPlot(svgIn(body.querySelector(".pl > div")), {
            width: 560, height: 300, x: [0, 1.1], y: [0], equal: true, ticks: [[0, 0.25, 0.5, 0.75, 1], [0.25, 0.5]],
            labels: { x: "수평 거리 ÷ 최대 사거리", y: "높이 ÷ 최대 사거리" }, margin: { l: 44, r: 14, t: 12, b: 34 },
            series: [{ id: "ref", k: "muted", dash: true }, { id: "cur", k: "c1", dot: true }],
          });
          p.svg.style("overflow", "hidden");
          const ang = (v) => v[0], AR = 0.16, rad = (d) => d * Math.PI / 180;
          p.svg.append("path").attr("d", d3.line()(d3.range(5, 85.1, 1).map((d) => p.px([AR * Math.cos(rad(d)), AR * Math.sin(rad(d))]))))
            .style("fill", "none").style("stroke", "var(--ltt-line-2)").attr("stroke-dasharray", "3 4");
          const aimLine = p.svg.append("line").style("stroke", "var(--ltt-ink)").style("stroke-width", 2.5);
          const aimHead = p.svg.append("path").style("fill", "var(--ltt-ink)");
          const ratio = (u, deg) => (u === 0 ? Math.sin(2 * deg * Math.PI / 180) : rel(u, deg) / best(u).R);
          const aim = LTT.drag(p.svg.node(), { value: [60, 0],
            toSvg: ([d]) => p.px([AR * Math.cos(rad(d)), AR * Math.sin(rad(d))]),
            fromSvg: ([sx, sy]) => [Math.atan2(p.y.invert(sy), p.x.invert(sx)) * 180 / Math.PI, 0],
            bounds: [[5, 85], [0, 0]], step: 1, label: "발사각" });
          LTT.sweep({
            params: {
              qu: { kind: "steps", stops: [0, 0.5, 1, 2, 4], value: 2, stopLabel: (v) => (v === 0 ? "0 (진공)" : String(v)) },
              qa: { control: aim },
            },
            render: ({ qu, qa }) => {
              const deg = ang(qa), Rb = qu === 0 ? 1 : best(qu).R, sc = (pts) => pts.map(([x, y]) => [x / Rb, y / Rb]);
              p.set("ref", sc(traj(qu, 45).pts));
              p.set("cur", sc(traj(qu, deg).pts));
              const [ex, ey] = p.px([AR * Math.cos(rad(deg)), AR * Math.sin(rad(deg))]), [ox, oy] = p.px([0, 0]), ph = Math.atan2(ey - oy, ex - ox);
              const tip = (t) => `${(ex - 12 * Math.cos(ph + t)).toFixed(1)},${(ey - 12 * Math.sin(ph + t)).toFixed(1)}`;
              aimLine.attr("x1", ox).attr("y1", oy).attr("x2", ex - 8 * Math.cos(ph)).attr("y2", ey - 8 * Math.sin(ph));
              aimHead.attr("d", `M${ex},${ey}L${tip(0.4)}L${tip(-0.4)}Z`);
              LTT.$("qa").textContent = deg.toFixed(1) + "°";
              LTT.$("qr").innerHTML = `<span class="ltt-tag ${ratio(qu, deg) >= 0.99 ? "good" : "warn"}">${(ratio(qu, deg) * 100).toFixed(1)}%</span>`;
              LTT.$("qb").textContent = ratio(qu, deg) >= 0.99 ? (qu === 0 ? 45 : best(qu).deg).toFixed(1) + "°" : "99%를 맞추면 공개";
              LTT.$("q45").textContent = (ratio(qu, 45) * 100).toFixed(1) + "%";
            },
            goal: { el: body.querySelector(".gl"), target: '<span class="ltt-tag good">최대의 99% 이상</span>',
              text: "v₀/vₜ = 2에서 최대 사거리의 99% 이상이 나오는 발사각을 찾는다.",
              check: ({ qu, qa }) => qu === 2 && ratio(qu, ang(qa)) >= 0.99 },
          });
          return {};
        },
        basis: "회전(마그누스 힘)·바람·부력 없음, 지면 높이에서 발사. 손 높이(1.8 m)에서 던져도 최적각은 조금만 낮아진다(30 m/s 진공에서 약 44.4°). 수치는 모델로 계산한 예시.",
        takeaway: "v₀/vₜ가 클수록 최적각은 45°보다 낮다(2에서 약 36°).",
        recall: "항력이 있으면 왜 최적각이 45°보다 낮아지나?" },

      { type: "figure", kicker: "정리 곡선", title: "최적각은 v₀/vₜ를 따라 내려가지만, 45°를 고집한 손해는 작다", en: "Best angle",
        figure: angleFigure,
        steps: [
          { caption: "실선이 v₀/vₜ마다 사거리가 가장 긴 발사각이다. 0에서 45°, 1에서 약 41°, 4에서 약 31°.", enter: (k, fig) => fig.show(0) },
          { caption: "네 공을 앞 표의 던지기 속도로 올렸다. 투포환은 45°에 붙어 있고, 탁구공은 37° 근처다.", enter: (k, fig) => fig.show(1) },
          { caption: "세로선은 45°로 던졌을 때 최대보다 잃는 사거리다. 위 막대처럼 같은 v₀/vₜ에서 항력을 무시한 손실이 각도 손실보다 훨씬 크다.", enter: (k, fig) => fig.show(2) },
        ],
        caption: "회전 없는 공, 지면 높이 발사에서 v₀/vₜ별 최대 사거리 발사각. 모델로 계산한 예시.",
        basis: "같은 v₀/vₜ에서 항력을 무시한 손실은 각도 손실의 10배 이상(최대 약 100배)이므로, 각도보다 항력 포함 여부를 먼저 정한다. 실제 타구의 최적각이 더 낮게(흔히 25–35°, 불확실) 보고되는 주된 이유는 항력(빠른 타구는 v₀/vₜ > 1)과 백스핀 양력이 함께 작용하기 때문이다. 양력은 범위 밖이다.",
        takeaway: "45°를 둬도 손해는 v₀/vₜ = 2에서 약 3%라, 항력을 넣는 결정이 먼저다.",
        recall: "v₀/vₜ = 2에서 45°로 던진 사거리 손해는 대략 얼마인가?",
        ask: "\"우리 공들의 v₀/vₜ 표를 만들어 줘\"" },

      { type: "summary", title: "공기저항과 발사각을 정할 때 떠올릴 것", en: "Recap" },

      { type: "overview", title: "v₀/vₜ 하나가 공기저항 여부와 최적각을 함께 정한다", en: "Overview",
        figure: overviewFigure,
        caption: "진공 45° 사거리를 1로 둔 궤적 위에 수업 순서대로 다섯 정리를 놓았다. 1·2는 출발점의 항력 화살표, 3은 v₀/vₜ = 0.25 궤적(5% 기준), 4는 v₀/vₜ = 2의 최적각 궤적, 5는 같은 공을 45°로 던진 점선과의 차이다." },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "종단 속도", en: "terminal velocity" },
          { ko: "제곱 항력", en: "quadratic drag" },
          { ko: "항력 계수", en: "drag coefficient" },
          { ko: "최적 발사각", en: "optimal launch angle with drag" },
        ],
        signals: [
          "게임·시뮬레이션에서 던지기·발사체 궤적을 정할 때",
          "가볍거나 큰 공(탁구공, 셔틀콕, 비치볼)이 '너무 멀리 날아간다'는 피드백",
          "최대 사거리 각도를 45°로 고정한 조준 보조가 어색할 때",
        ],
        queries: ["terminal velocity drag coefficient sphere", "projectile motion quadratic air resistance optimal angle", "game physics drag integration semi-implicit euler", "Reynolds number drag regime sphere"],
        neighbors: [
          { term: "선형 항력(스토크스)", diff: "속도에 정비례하는 항력. 아주 작고 느린 물체에서만 맞고 던지는 공은 제곱 항력이다." },
          { term: "마그누스 효과", diff: "회전하는 공이 옆·위로 휘는 힘. 이 수업은 회전 없는 공만 다뤘다." },
          { term: "발사 높이", diff: "손 높이에서 던지면 공기가 없어도 최적각이 45°보다 조금 낮다(1.8 m, 30 m/s에서 약 44.4°). 효과는 항력보다 작다." },
        ] },
    ],
  });
