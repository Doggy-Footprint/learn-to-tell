<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU가 2배 빨라지면 글 생성도 2배?</title>
<script type="application/json" id="ltt-meta">{
  "topic": "단일 GPU의 데이터 흐름: HBM 대역폭, 산술 강도, roofline, prefill과 decode",
  "audience": "백엔드 개발자, Transformer는 이름만 앎",
  "theme": "blueprint",
  "medium": "deck",
  "decision": "추론 서버 GPU 선택: FLOPS가 2배면 토큰 생성도 2배인가",
  "glossary": {
    "FLOPS": "초당 부동소수점 연산 횟수. GPU 계산부가 1초에 할 수 있는 곱셈·덧셈 수의 최대치. 1 TFLOPS = 초당 1조 번.",
    "HBM": "High Bandwidth Memory. GPU 칩 옆에 붙은 큰 메모리(H100은 80 GB). 모델 가중치가 여기에 산다.",
    "대역폭": "메모리에서 계산부로 1초에 옮길 수 있는 바이트 수. H100 HBM은 3.35 TB/s(초당 3.35조 바이트).",
    "가중치": "모델이 학습으로 얻은 숫자들(파라미터). 7B 모델은 70억 개, BF16이면 하나에 2바이트라 14 GB.",
    "BF16": "숫자 하나를 2바이트(16비트)로 저장하는 형식. LLM 추론에서 흔히 쓴다.",
    "토큰": "LLM이 한 번에 하나씩 내놓는 글 조각(대략 단어 조각 하나).",
    "decode": "답을 토큰 하나씩 이어서 만드는 단계. 토큰 하나마다 모델 전체를 한 번 통과한다.",
    "prefill": "사용자가 보낸 프롬프트 토큰 전체를 한 번에 모델에 통과시키는 첫 단계. 첫 토큰이 나오기 전 시간을 정한다.",
    "배치": "여러 요청(사용자)의 토큰을 한 번의 모델 통과로 함께 계산하는 것. 배치 크기 B = 함께 계산하는 토큰 수.",
    "SM": "Streaming Multiprocessor. GPU 계산부를 이루는 계산 단위. H100 SXM에는 132개.",
    "산술 강도": "읽은 1바이트당 하는 계산 수(FLOP ÷ 바이트). 높을수록 같은 데이터로 많이 계산한다.",
    "ridge": "GPU의 최대 계산 속도 ÷ 대역폭. 산술 강도가 이보다 낮으면 읽기가, 높으면 계산이 시간을 정한다. H100은 약 295 FLOP/B.",
    "roofline": "산술 강도(가로)에 따라 도달할 수 있는 계산 속도(세로)의 상한을 그린 그래프. 상한 = min(최대 계산 속도, 강도 × 대역폭).",
    "KV 캐시": "앞 토큰들의 어텐션 계산 결과를 저장해 두는 메모리. 대화가 길고 배치가 클수록 커지고, 매 토큰 읽어야 한다."
  }
}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.gx text{fill:var(--ltt-ink);font-size:16px}
.gx .mut{fill:var(--ltt-muted);font-size:14px}
.gx .big{font-size:30px;font-weight:700}
.gx .hot{fill:var(--ltt-warn)}
.gx .cool{fill:var(--ltt-accent)}
.gx .box{fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1.5}
.gx .wt{fill:var(--ltt-warn);opacity:.85}
.gx .wt-off{fill:var(--ltt-line);opacity:.6}
.gx .sm{fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:.8}
.gx .pipe{fill:var(--ltt-line)}
.gx .dot{fill:var(--ltt-warn)}
.gx .axis{stroke:var(--ltt-muted);stroke-width:1}
.gx .grid{stroke:var(--ltt-line);stroke-width:.6}
.gx .roof{fill:none;stroke:var(--ltt-accent);stroke-width:3}
.gx .roof2{fill:none;stroke:var(--ltt-good);stroke-width:3;stroke-dasharray:8 5}
.gx .cell{fill:var(--ltt-line);opacity:.55}
.gx .cell-on{fill:var(--ltt-warn)}
.gx .arrow{stroke:var(--ltt-ink-2);stroke-width:2;fill:none}
.gx .hot-s{stroke:var(--ltt-warn)}
svg.gx{width:100%;height:auto;display:block;max-width:980px}
.knobs{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin:4px 0 8px}
.knob{display:flex;align-items:center;gap:10px}
.knob .lab{font-weight:600;min-width:6.5em}
.knob .val{font-variant-numeric:tabular-nums;min-width:7em;display:inline-block}
.readout{display:flex;gap:28px;flex-wrap:nowrap;align-items:baseline;margin-top:6px}
.readout .ltt-stat{min-width:9em;margin:0}
#rf-svg{max-height:46vh}
.note{font-size:14px;color:var(--ltt-muted);margin-top:4px}
.ans-bars{display:grid;grid-template-columns:7em 1fr;gap:6px 10px;align-items:center;font-size:15px;min-width:420px}
.ans-bars .b{height:16px;background:var(--ltt-warn);border-radius:2px}
.ans-bars .c{height:16px;width:2px;background:var(--ltt-accent)}
</style>
</head>
<body>
<script>
// ---- 수치 모델 (outline.md "수치 모델"의 기대값과 대조) ----
const N = 7e9, W = 2 * N;           // 파라미터 수, BF16 바이트
const F = 989e12, BW = 3.35e12;     // H100 SXM BF16 dense FLOP/s, HBM B/s
const BW_H200 = 4.8e12;
const tRead = (bw) => W / bw * 1e3;              // ms
const tComp = (f, b) => b * 2 * N / f * 1e3;     // ms
const stepMs = (f, bw, b) => Math.max(tRead(bw), tComp(f, b));
const tps = (f, bw, b) => b / stepMs(f, bw, b) * 1e3;
const ridge = F / BW;

LTT.expect("t_read_ms", tRead(BW), 4.179, { tol: 0.005 });
LTT.expect("t_comp_ms", tComp(F, 1), 0.01416, { tol: 0.0001 });
LTT.expect("ridge", ridge, 295.2, { tol: 0.1 });
LTT.expect("tps_b1", tps(F, BW, 1), 239.3, { tol: 0.1 });
LTT.expect("tps_f2", tps(2 * F, BW, 1), 239.3, { tol: 0.1 });
LTT.expect("tps_bw2", tps(F, 2 * BW, 1), 478.6, { tol: 0.1 });
LTT.expect("ai_b1", (2 * N) / W, 1, { tol: 1e-9 });
LTT.expect("att_b1", 1 * BW / 1e12, 3.35, { tol: 0.001 });
LTT.expect("tps_b64", tps(F, BW, 64), 15314, { tol: 2 });
LTT.expect("tps_b512", tps(F, BW, 512), 70643, { tol: 2 });
LTT.expect("pu_b512", 1e3 / stepMs(F, BW, 512), 137.97, { tol: 0.05 });
LTT.expect("tps_b512_f2", tps(2 * F, BW, 512), 122514, { tol: 3 });
LTT.expect("prefill_ms", stepMs(F, BW, 1000), 14.16, { tol: 0.01 });
LTT.expect("prefill_f2_ms", stepMs(2 * F, BW, 1000), 7.08, { tol: 0.01 });
LTT.expect("tps_h200", tps(F, BW_H200, 1), 342.9, { tol: 0.1 });

const NS = "http://www.w3.org/2000/svg";
const fmt = (v, d) => v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

// ---- 장면 3: GPU 구조 ----
function gpuFigure(el) {
  const sm = [];
  for (let r = 0; r < 11; r++) for (let c = 0; c < 12; c++)
    sm.push(`<rect class="sm" x="${600 + c * 22}" y="${92 + r * 20}" width="18" height="16" rx="2"/>`);
  el.innerHTML = `
  <svg class="gx" viewBox="0 0 900 380" role="img" aria-label="HBM에서 계산부로 데이터가 흐르는 GPU 구조">
    <text x="40" y="40">HBM 메모리 80 GB</text>
    <rect class="box" x="40" y="60" width="190" height="260" rx="6"/>
    <rect class="wt" x="40" y="${320 - 260 * 14 / 80}" width="190" height="${260 * 14 / 80}" rx="0"/>
    <text x="52" y="${320 - 260 * 14 / 80 - 34}">▼ 7B 모델 가중치 14 GB</text>
    <text class="mut" x="52" y="${320 - 260 * 14 / 80 - 12}">칠한 높이 = 14/80 (실제 비율)</text>
    <rect class="pipe" x="230" y="180" width="340" height="26" rx="4"/>
    <g id="pipe-dots"></g>
    <text class="big hot" x="300" y="160">3.35 TB/s</text>
    <text x="262" y="236">통로: HBM 대역폭</text>
    <text class="mut" x="262" y="258">1초에 3.35조 바이트를 계산부로</text>
    <rect class="box" x="570" y="60" width="300" height="290" rx="6"/>
    <text x="600" y="84">계산부: SM 132개</text>
    ${sm.join("")}
    <text class="big cool" x="600" y="335">989 TFLOPS</text>
    <text class="mut" x="580" y="372">1초에 989조 번 계산 (BF16)</text>
    <text class="mut" x="40" y="372">크기·간격은 축척 아님</text>
  </svg>`;
  const g = el.querySelector("#pipe-dots");
  const dots = Array.from({ length: 9 }, () => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 6); c.setAttribute("cy", 193); c.setAttribute("class", "dot");
    g.appendChild(c); return c;
  });
  LTT.clock(el, (t) => {
    dots.forEach((c, i) => {
      const p = ((t / 3000) + i / dots.length) % 1;
      c.setAttribute("cx", 240 + p * 320);
    });
  }, { dur: 3000, loop: true, id: "pipe" });
}

// ---- 장면 4: 토큰 하나 = 32층 가중치 전부 읽기 ----
function decodeFigure(el) {
  const L = 32, top = 50, h = 9, gap = 1;
  let bars = "";
  for (let i = 0; i < L; i++)
    bars += `<rect data-l="${i}" class="wt-off" x="60" y="${top + i * (h + gap)}" width="200" height="${h}"/>`;
  el.innerHTML = `
  <svg class="gx" viewBox="0 0 900 400" role="img" aria-label="토큰 하나를 만들며 32층 가중치를 차례로 읽는 그림">
    <text x="60" y="36">HBM의 가중치: 32층 × 0.44 GB</text>
    ${bars}
    <text class="mut" x="14" y="${top + (L - 1) * (h + gap) + 9}">1층</text>
    <text class="mut" x="8" y="${top + 9}">32층</text>
    <line class="arrow" id="dec-arrow" x1="262" y1="55" x2="380" y2="55"/>
    <rect class="box" x="380" y="40" width="170" height="64" rx="6"/>
    <text x="394" y="68">계산부</text>
    <text class="mut" x="394" y="92">가중치 하나당 곱 1·덧셈 1</text>
    <text x="600" y="60">토큰 1개를 만드는 동안</text>
    <text class="mut" x="600" y="100">읽은 층</text>
    <text class="big" id="dec-k" x="600" y="134">0 / 32</text>
    <text class="mut" x="600" y="174">HBM에서 읽은 바이트</text>
    <text class="big hot" id="dec-gb" x="600" y="208">0.0 GB</text>
    <text class="mut" x="600" y="248">경과 시간 (3.35 TB/s로 읽을 때)</text>
    <text class="big hot" id="dec-ms" x="600" y="282">0.00 ms</text>
    <text class="mut" x="600" y="322">계산량</text>
    <text class="big cool" id="dec-fl" x="600" y="356">0.0 GFLOP</text>
    <text class="mut" x="60" y="394">느리게 재생: 실제 4.18 ms를 6초로 늘림</text>
  </svg>`;
  const rects = el.querySelectorAll("rect[data-l]");
  const arrow = el.querySelector("#dec-arrow");
  const q = (s) => el.querySelector(s);
  LTT.clock(el, (t) => {
    const k = Math.min(L, Math.floor((t / 6000) * L + 1e-9));
    rects.forEach((r, i) => {
      // 1층이 맨 아래, 32층이 맨 위
      const layer = L - 1 - i;
      r.setAttribute("class", layer < k ? "wt" : "wt-off");
    });
    const yCur = top + (L - 1 - Math.max(0, Math.min(L - 1, k - 1))) * (h + gap) + h / 2;
    arrow.setAttribute("y1", yCur); arrow.setAttribute("y2", 72);
    q("#dec-k").textContent = `${k} / 32`;
    q("#dec-gb").textContent = `${fmt(14 * k / L, 1)} GB`;
    q("#dec-ms").textContent = `${fmt(tRead(BW) * k / L, 2)} ms`;
    q("#dec-fl").textContent = `${fmt(14 * k / L, 1)} GFLOP`;
  }, { dur: 6000, id: "decode" });
}

// ---- 장면 5 정답 그림 ----
const answerBars = `
  <div class="ans-bars">
    <span>HBM 읽기</span><div class="b" style="width:100%"></div>
    <span></span><span class="note" style="margin:0">4.18 ms (그대로)</span>
    <span>계산 ×1</span><div><div class="c"></div></div>
    <span>계산 ×2</span><div><div class="c"></div></div>
    <span></span><span class="note" style="margin:0">0.014 ms → 0.007 ms (막대 최소 2px)</span>
  </div>`;

// ---- 장면 6: 두 시간 막대 + 손잡이 ----
function mountTimes(body) {
  body.innerHTML = `
    <div class="knobs">
      <div class="knob"><span class="lab">계산 속도</span><div id="kF"></div><span class="val" id="kF-v"></span></div>
      <div class="knob"><span class="lab">HBM 대역폭</span><div id="kB"></div><span class="val" id="kB-v"></span></div>
    </div>
    <svg class="gx" id="tm-svg" viewBox="0 0 900 230" role="img" aria-label="한 토큰을 만드는 동안 읽기 시간과 계산 시간 막대"></svg>
    <div class="readout">
      <div class="ltt-stat"><span id="tm-step">4.18</span><small> ms / 토큰</small></div>
      <div class="ltt-stat ltt-hero"><span id="tm-tps">239</span><small> 토큰/초 (사용자 1명)</small></div>
    </div>
    <p class="note">7B 모델, {{배치}} 1. 읽기와 계산은 겹쳐 진행된다고 둔 이상적 상한. {{KV 캐시}}·어텐션 계산은 뺐다.</p>`;
  const svg = body.querySelector("#tm-svg");
  const x0 = 150, x1 = 860, tMax = 5;
  const X = (ms) => x0 + (x1 - x0) * ms / tMax;
  LTT.sweep({
    params: {
      kF: { kind: "steps", stops: [1, 2, 4], value: 1, stopLabel: (v) => `×${v}`, fmt: (v) => `${fmt(989 * v, 0)} TFLOPS`, label: "계산 속도" },
      kB: { kind: "steps", stops: [1, 2], value: 1, stopLabel: (v) => `×${v}`, fmt: (v) => `${fmt(3.35 * v, 2)} TB/s`, label: "HBM 대역폭" }
    },
    render: (v) => {
      const tr = tRead(BW * v.kB), tc = tComp(F * v.kF, 1), st = Math.max(tr, tc);
      let ticks = "";
      for (let m = 0; m <= tMax; m++)
        ticks += `<line class="grid" x1="${X(m)}" y1="20" x2="${X(m)}" y2="180"/><text class="mut" x="${X(m) - 5}" y="200">${m}</text>`;
      svg.innerHTML = `${ticks}
        <text class="mut" x="${x1 - 20}" y="222">ms</text>
        <text x="20" y="62">HBM 읽기</text>
        <rect class="wt" x="${x0}" y="42" width="${X(tr) - x0}" height="30" rx="3"/>
        <text x="${X(tr) + 8}" y="64">${fmt(tr, 2)} ms</text>
        <text x="20" y="132">계산</text>
        <rect class="cool" x="${x0}" y="112" width="${Math.max(2, X(tc) - x0)}" height="30" rx="1"/>
        <text x="${x0 + 12}" y="134">${fmt(tc, 4)} ms <tspan class="mut">(너무 짧아 최소 2px로 그림)</tspan></text>
        <line class="arrow hot-s" x1="${X(st)}" y1="24" x2="${X(st)}" y2="176" stroke-dasharray="5 4"/>
        <text class="hot" x="${X(st) - 8}" y="100" text-anchor="end">한 토큰 시간 = 긴 쪽 →</text>`;
      body.querySelector("#tm-step").textContent = fmt(st, 2);
      body.querySelector("#tm-tps").textContent = fmt(1e3 / st, 0);
      LTT.record("knob", { scene: "times", flops: v.kF, bw: v.kB, tps: Math.round(1e3 / st) });
    }
  });
}

// ---- 장면 7: 산술 강도 격자 ----
function intensityFigure(el) {
  const cols = 25; let cells = "";
  for (let i = 0; i < 295; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    cells += `<rect class="${i === 0 ? "cell-on" : "cell"}" x="${40 + c * 17}" y="${70 + r * 17}" width="14" height="14" rx="2"/>`;
  }
  el.innerHTML = `
  <svg class="gx" viewBox="0 0 900 360" role="img" aria-label="1바이트가 도착하는 동안 가능한 계산 295칸 중 1칸만 쓰는 격자">
    <text x="40" y="40">HBM에서 1바이트가 도착하는 동안 계산부가 할 수 있는 계산: 295칸</text>
    ${cells}
    <text class="mut" x="40" y="${70 + 12 * 17 + 22}">한 칸 = 계산 1번(1 FLOP). 989 TFLOPS ÷ 3.35 TB/s = 295 FLOP/B</text>
    <line class="arrow hot-s" x1="54" y1="77" x2="490" y2="77" style="opacity:0"/>
    <text class="mut" x="500" y="100">decode, 배치 1</text>
    <text class="big hot" x="500" y="140">1 FLOP/B</text>
    <text x="500" y="172">가중치 1개(2바이트)로 계산 2번</text>
    <text class="mut" x="500" y="216">H100의 기준점(ridge)</text>
    <text class="big cool" x="500" y="256">295 FLOP/B</text>
    <text x="500" y="288">계산부는 295칸 중 1칸만 쓴다(0.3%)</text>
  </svg>`;
}

// ---- 장면 8: 배치 ----
function batchFigure(el) {
  const panel = (ox, B) => {
    let toks = "";
    for (let i = 0; i < B; i++)
      toks += `<rect class="cool" x="${ox + 250}" y="${90 + i * 40}" width="90" height="26" rx="4"/><text x="${ox + 260}" y="${108 + i * 40}" style="fill:var(--ltt-on-dark)">토큰 ${i + 1}</text>
               <line class="arrow" x1="${ox + 170}" y1="150" x2="${ox + 248}" y2="${103 + i * 40}"/>`;
    return `
      <text x="${ox}" y="44">배치 B = ${B}</text>
      <rect class="wt" x="${ox}" y="110" width="150" height="80" rx="6"/>
      <text x="${ox + 14}" y="146">가중치 14 GB</text>
      <text x="${ox + 14}" y="170">읽기 1번</text>
      ${toks}
      <text x="${ox}" y="270">계산 ${B === 1 ? "14" : "56"} GFLOP ÷ 읽기 14 GB</text>
      <text class="big ${B === 1 ? "hot" : "cool"}" x="${ox}" y="310">강도 ${B} FLOP/B</text>`;
  };
  el.innerHTML = `
  <svg class="gx" viewBox="0 0 900 330" role="img" aria-label="한 번 읽은 가중치로 토큰 1개와 4개를 계산하는 비교">
    ${panel(30, 1)}
    <line class="grid" x1="440" y1="30" x2="440" y2="320"/>
    ${panel(480, 4)}
  </svg>`;
}

// ---- 장면 9: roofline + 손잡이 ----
function mountRoof(body) {
  body.innerHTML = `
    <div class="knobs">
      <div class="knob"><span class="lab">배치 크기</span><input type="range" id="kBt"><span class="val" id="kBt-v"></span></div>
      <div class="knob"><span class="lab">계산 속도</span><div id="kR"></div><span class="val" id="kR-v"></span></div>
    </div>

  const xs = d3.scaleLog().domain([0.5, 4096]).range([90, 860]);
  const ys = d3.scaleLog().domain([1, 4000]).range([330, 30]);
  LTT.sweep({
    params: {
      kBt: { kind: "log", min: 1, max: 1024, value: 1, fmt: (v) => `${Math.round(v)}명`, label: "배치 크기" },
      kR: { kind: "steps", stops: [1, 2], value: 1, stopLabel: (v) => `×${v}`, fmt: (v) => `${fmt(989 * v, 0)} TFLOPS`, label: "계산 속도" }
    },
    render: (v) => {
      const B = Math.round(v.kBt), f = F * v.kR;
      const roof = (fl) => (I) => Math.min(fl / 1e12, I * BW / 1e12);
      const path = (fl) => {
        const pts = [0.5, fl / BW, 4096].map((I) => `${xs(I)},${ys(roof(fl)(I))}`);

      };
      let grid = "";

      const yPt = roof(f)(B);
      const st = stepMs(f, BW, B);
      svg.innerHTML = `${grid}
        <line class="axis" x1="90" y1="330" x2="860" y2="330"/><line class="axis" x1="90" y1="30" x2="90" y2="330"/>

        <text class="mut" x="96" y="22">도달 계산 속도 (TFLOPS, 로그 눈금)</text>
        <polyline class="roof" points="${path(F)}"/>
        ${v.kR === 2 ? `<polyline class="roof2" points="${path(2 * F)}"/><text x="700" y="${ys(1978) - 10}" style="fill:var(--ltt-good)">지붕 ×2: 1,978</text>` : ""}
        <text x="700" y="${ys(989) + 26}" style="fill:var(--ltt-accent)">지붕 989</text>
        <line class="grid" x1="${xs(f / BW)}" y1="${ys(f / 1e12)}" x2="${xs(f / BW)}" y2="330" stroke-dasharray="4 4" style="stroke:var(--ltt-ink-2)"/>
        <text x="${xs(f / BW) + 6}" y="320">ridge ${fmt(f / BW, 0)}</text>
        <text class="mut" x="150" y="${ys(8) }" transform="rotate(-27 150 ${ys(8)})">읽기 한계: 강도 × 3.35 TB/s</text>
        <circle class="dot" cx="${xs(B)}" cy="${ys(yPt)}" r="10" style="stroke:var(--ltt-bg);stroke-width:2"/>
        <text class="hot" x="${xs(B) + 14}" y="${ys(yPt) + (B < 200 ? 26 : 30)}">배치 ${B}: ${fmt(yPt, yPt < 10 ? 2 : 0)} TFLOPS</text>`;
      body.querySelector("#rf-step").textContent = fmt(st, 2);
      body.querySelector("#rf-tot").textContent = fmt(B / st * 1e3, 0);
      body.querySelector("#rf-pu").textContent = fmt(1e3 / st, 0);
      LTT.record("knob", { scene: "roofline", batch: B, flops: v.kR });
    }
  });
}

// ---- terms 작은 그림 ----
function tv(kind) {
  const w = (s) => `<svg class="gx" viewBox="0 0 160 70" style="max-width:170px" role="img">${s}</svg>`;
  if (kind === "flops") {
    let s = ""; for (let i = 0; i < 3; i++) for (let j = 0; j < 8; j++) s += `<rect class="sm" x="${8 + j * 18}" y="${6 + i * 15}" width="14" height="11" rx="2"/>`;
    return w(s + `<text x="54" y="68" style="font-size:12px" class="mut">곱·덧셈 유닛</text>`);
  }
  if (kind === "hbm") return w(`<rect class="box" x="50" y="4" width="60" height="58" rx="4"/><rect class="wt" x="50" y="48" width="60" height="14"/><text x="58" y="30" style="font-size:13px">80 GB</text>`);
  if (kind === "bw") return w(`<rect class="pipe" x="8" y="28" width="144" height="14" rx="3"/>${[0, 1, 2, 3, 4, 5].map((i) => `<circle class="dot" cx="${18 + i * 24}" cy="35" r="4"/>`).join("")}<text x="40" y="62" style="font-size:12px" class="mut">바이트/초 →</text>`);
  if (kind === "wt") {
    const v = ["0.12", "-0.8", "0.03", "1.4", "-0.2", "0.57"];
    return w(v.map((t, i) => `<text x="${12 + (i % 3) * 50}" y="${26 + Math.floor(i / 3) * 26}" style="font-size:14px">${t}</text>`).join(""));
  }
  if (kind === "decode") return w(["안", "녕", "하", "?"].map((t, i) => `<rect class="${i < 3 ? "cool" : "box"}" x="${6 + i * 38}" y="18" width="32" height="30" rx="4"/><text x="${15 + i * 38}" y="39" style="font-size:15px;${i < 3 ? "fill:var(--ltt-on-dark)" : ""}">${t}</text>`).join(""));
  if (kind === "batch") return w(`<rect class="wt" x="6" y="20" width="50" height="30" rx="4"/>${[0, 1, 2, 3].map((i) => `<line class="arrow" x1="56" y1="35" x2="110" y2="${8 + i * 18}"/><rect class="cool" x="110" y="${2 + i * 18}" width="44" height="12" rx="2"/>`).join("")}`);
  return "";
}
