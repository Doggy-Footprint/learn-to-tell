<script>
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function h(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

const DUR = 4200, MOVE0 = 600, ARRIVE = 3600;
const PATHS = {
  main: "M20,190 L620,190",
  side: "M20,190 L170,190 C230,190 220,90 290,90 L620,90",
  loop: "M20,190 L170,190 C230,190 220,90 290,90 L540,90 C610,90 620,190 570,190",
  routeSide: "M20,190 L170,190 C230,190 220,90 290,90 L408,90",
  routeLoop: "M20,190 L170,190 C230,190 220,90 290,90 L388,90",
  routeBridge: "M20,190 L325,190",
};
function person(g, x, y, cls) {
  const p = el("g", { class: "tp " + cls }, g);
  el("circle", { cx: x, cy: y, r: 9 }, p);
  return p;
}
function trackMap(svg, kind, t) {
  svg.setAttribute("viewBox", "0 0 640 270");
  svg.innerHTML = "";
  el("style", {}, svg).textContent = `.rail{fill:none;stroke:var(--ltt-line-2);stroke-width:6;stroke-linecap:round}
  .rail.on{stroke:var(--ltt-accent)} .ghost{fill:none;stroke:var(--ltt-muted);stroke-width:2;stroke-dasharray:6 6}
  .tp circle{stroke:var(--ltt-card);stroke-width:2} .tp.five circle{fill:var(--ltt-good)} .tp.one circle{fill:var(--ltt-warn)}
  .tp.dead circle{fill:var(--ltt-bad)} .tl{font-size:15px;fill:var(--ltt-ink)} .tm{font-size:14px;fill:var(--ltt-muted)}
  .tally{font-size:18px;fill:var(--ltt-ink);font-weight:600} .bridge{fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:2}
  .trolley{fill:var(--ltt-ink)} .lever{stroke:var(--ltt-accent);stroke-width:4;stroke-linecap:round}`;
  const p = Math.max(0, Math.min(1, (t - MOVE0) / (ARRIVE - MOVE0)));
  let routeD;
  if (kind === "bridge") {
    el("path", { d: PATHS.main, class: "rail on" }, svg);
    el("rect", { x: 330, y: 120, width: 44, height: 120, rx: 3, class: "bridge" }, svg);
    el("text", { x: 352, y: 262, "text-anchor": "middle", class: "tm" }, svg, "육교");
    routeD = PATHS.routeBridge;
  } else {
    el("path", { d: PATHS.main, class: "rail" + (t < MOVE0 ? " on" : "") }, svg);
    el("path", { d: kind === "loop" ? PATHS.loop : PATHS.side, class: "rail" + (t >= MOVE0 ? " on" : "") }, svg);
    const a = (t >= MOVE0 ? -40 : 40) * Math.PI / 180;
    el("line", { x1: 170, y1: 230, x2: 170 + 22 * Math.sin(a), y2: 230 - 22 * Math.cos(a), class: "lever" }, svg);
    el("text", { x: 170, y: 262, "text-anchor": "middle", class: "tm" }, svg, "레버");
    routeD = kind === "loop" ? PATHS.routeLoop : PATHS.routeSide;
    if (kind === "loop") {
      el("path", { d: "M424,80 L540,80 C602,80 608,176 574,178", class: "ghost" }, svg);
      el("text", { x: 470, y: 66, "text-anchor": "middle", class: "tm" }, svg, "그 사람이 없다면 전차는 고리를 돌아온다");
    }
  }
  [410, 440, 470, 500, 530].forEach((x) => person(svg, x, 190, "five"));
  el("text", { x: 470, y: 222, "text-anchor": "middle", class: "tl" }, svg, "다섯 명");
  const arrived = t >= ARRIVE;
  if (kind === "bridge") {
    const fp = Math.max(0, Math.min(1, (t - 600) / 1400));
    const fy = 136 + 54 * fp;
    if (fp > 0) {
      el("circle", { cx: 352, cy: 136, r: 9, fill: "none", stroke: "var(--ltt-muted)", "stroke-dasharray": "3 3" }, svg);
      el("line", { x1: 352, y1: 148, x2: 352, y2: Math.max(148, fy - 12), stroke: "var(--ltt-warn)", "stroke-width": 2, "stroke-dasharray": "4 3" }, svg);
      el("text", { x: 384, y: 140, "text-anchor": "start", class: "tm" }, svg, fp < 1 ? "밀려 떨어지는 중" : "육교 위 → 선로로 떨어짐");
    } else {
      el("text", { x: 384, y: 140, "text-anchor": "start", class: "tm" }, svg, "육교 위에 서 있다");
    }
    person(svg, 352, fy, arrived ? "one dead" : "one");
    el("text", { x: 352, y: fy + 30, "text-anchor": "middle", class: "tl" }, svg, "한 명");
  } else {
    const ox = kind === "loop" ? 410 : 430;
    person(svg, ox, 90, arrived ? "one dead" : "one");
    el("text", { x: ox, y: 116, "text-anchor": "middle", class: "tl" }, svg, "한 명");
  }
  const route = el("path", { d: routeD, fill: "none", stroke: "none" }, svg);
  const L = route.getTotalLength();
  const pt = route.getPointAtLength(L * p);
  const pb = route.getPointAtLength(Math.max(0, L * p - 2));
  const ang = p === 0 ? 0 : Math.atan2(pt.y - pb.y, pt.x - pb.x) * 180 / Math.PI;
  el("rect", { x: -18, y: -10, width: 36, height: 20, rx: 4, class: "trolley", transform: `translate(${pt.x},${pt.y}) rotate(${ang})` }, svg);
  el("text", { x: pt.x, y: pt.y + 30, "text-anchor": "middle", class: "tm" }, svg, p === 0 ? "전차" : "");
  el("text", { x: 20, y: 30, class: "tally" }, svg, arrived ? "구한 사람 5 · 죽은 사람 1" : "구한 사람 ? · 죽은 사람 ?");
}
function trackFigure(kind, caption) {
  return (host) => {
    const wrap = h(`<div class="tm-wrap"><svg role="img" aria-label="${caption}"></svg><div class="tm-ctl"><button type="button">다시 재생</button><span>위에서 본 선로 · 축척 아님</span></div></div>`);
    host.appendChild(wrap);
    const svg = wrap.querySelector("svg");
    const clk = LTT.clock(svg, (t) => trackMap(svg, kind, t), { dur: DUR, id: kind });
    wrap.querySelector("button").addEventListener("click", () => { LTT.record("replay", { id: kind }); clk.seek(0); clk.play(); });
  };
}

      { id: "stop", c: 2, r: 0, l: removed ? "전차가\n멈추지 않는다" : "그에게 부딪혀\n전차가 멈춘다", s: removed ? null : "그는 죽는다", k: "bad" },
      { id: "five", c: 3, r: 0, l: removed ? "다섯이 죽는다" : "다섯이 산다", k: removed ? "bad" : "good" }],
    edges: [{ f: "act", t: "fall" }, { f: "fall", t: "stop", dash: !!removed }, { f: "stop", t: "five" }] }),

const scenes = [
