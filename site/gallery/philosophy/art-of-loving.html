<script>
const SVG = "http://www.w3.org/2000/svg";
function mk(parent, tag, attrs = {}, text) {
  const n = document.createElementNS(SVG, tag);

  if (text != null) n.textContent = text;
  parent.appendChild(n);
  return n;
}
function svgIn(el, w, h) {

}

const ease = (x) => { x = clamp01(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
function note(s, x, y, txt) { return mk(s, "text", { x, y, class: "mu", "text-anchor": "end" }, txt); }

function elementsFig(el) {
  const s = svgIn(el, 960, 540);
  const defs = mk(s, "defs");
  const m = mk(defs, "marker", { id: "ar3", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" });
  mk(m, "path", { d: "M0 0 L10 5 L0 10 z", style: "fill: var(--ltt-accent)" });
  const pos = Object.fromEntries(ELEMENTS.map((e) => [e.id, e]));
  const W = 290, H = 86;
  const edgeG = EDGES.map((e) => {
    const a = pos[e.f], b = pos[e.t];
    const pt = (n, o) => {
      const dx = o.x - n.x, dy = o.y - n.y;
      const k = Math.min((W / 2 + 6) / Math.abs(dx || 1e-6), (H / 2 + 6) / Math.abs(dy || 1e-6));
      return [n.x + dx * k, n.y + dy * k];
    };
    const [x1, y1] = pt(a, b), [x2, y2] = pt(b, a);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
    const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
    const cx = mx + nx * e.bend, cy = my + ny * e.bend;
    const g = mk(s, "g");
    const p = mk(g, "path", { d: `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`, class: "la", pathLength: 1, "stroke-dasharray": 1, "marker-end": "url(#ar3)" });
    const lb = mk(g, "text", { x: e.lx, y: e.ly, "text-anchor": "middle", class: "sm" }, e.l);
    return { g, p, lb };
  });
  const nodeG = ELEMENTS.map((e) => {
    const g = mk(s, "g", { style: "cursor: pointer" });
    mk(g, "rect", { x: e.x - W / 2, y: e.y - H / 2, width: W, height: H, rx: 12, class: "boxa" });
    mk(g, "text", { x: e.x, y: e.y - 6, "text-anchor": "middle", class: "hd" }, e.name);
    mk(g, "text", { x: e.x, y: e.y + 24, "text-anchor": "middle", class: "sm" }, e.def);
    g.addEventListener("click", () => LTT.record("element", { name: e.name }));
    return g;
  });
  LTT.clock(s, (t) => {
    nodeG.forEach((g) => g.setAttribute("opacity", ease(t / 800)));
    edgeG.forEach((e, i) => {
      const k = ease((t - 1000 - i * 1200) / 900);
      e.p.setAttribute("stroke-dashoffset", 1 - k);
      e.p.setAttribute("marker-end", k > 0.98 ? "url(#ar3)" : "");
      e.lb.setAttribute("opacity", k);
    });
  }, { dur: 6000, id: "elements" });
  return { el: s };
}
