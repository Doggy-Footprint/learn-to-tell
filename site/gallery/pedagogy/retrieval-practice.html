<title>다시 읽기 vs 인출 연습 — 1주 뒤 무엇이 남나</title>
<script type="application/json" id="ltt-meta">{
  "topic": "다시 읽기와 인출 연습: 1주 뒤 기억",
  "audience": "시험을 준비하는 대학생, 주로 교재를 반복해 읽음",
  "theme": "paper",
  "medium": "deck",
  "decision": "공부 방법을 다시 읽기에서 인출 연습으로 바꿀지",
  "glossary": {
    "망각 곡선": "배운 뒤 시간이 지나며 기억이 얼마나 남는지를 그린 곡선. Ebbinghaus(1885)가 처음 측정했다.",
    "다시 읽기": "이미 읽은 교재를 한 번 더 읽는 것. 답이 눈앞에 있다.",
    "인출 연습": "책을 덮고 배운 내용을 기억에서 꺼내 보는 것(떠올려 쓰기, 문제 풀기, 플래시카드). 시험 효과(testing effect)라고도 한다.",
    "지연 시험": "공부하고 며칠 이상 지난 뒤 치르는 시험. 실제 기말고사처럼.",
    "직후 시험": "공부하고 몇 분 안에 치르는 시험.",
    "절약률": "같은 목록을 다시 외울 때 처음보다 아낀 시간의 비율. 많이 남아 있을수록 덜 들여 다시 외우므로 남은 기억의 양으로 쓴다.",
    "자유 회상": "단서나 보기 없이 기억나는 것을 모두 적는 시험.",
    "유창성 착각": "글이 술술 읽히는 익숙함을 '안다'로 잘못 느끼는 것. 다시 읽을수록 익숙함은 커진다.",
    "학습 판단": "공부 직후 '나중에 얼마나 기억할까'를 스스로 매긴 점수(judgment of learning).",
    "간격 두기": "같은 횟수의 복습을 하루에 몰지 않고 날을 나눠 하는 것(spacing).",
    "바람직한 어려움": "공부하는 동안은 더 힘들고 느리게 느껴지지만 나중에 더 오래 남게 하는 조건. 인출 연습과 간격 두기가 대표적이다(Bjork 1994).",
    "아이디어 단위": "글을 뜻 있는 작은 조각(한 가지 사실이나 주장)으로 나눈 단위. 채점자는 학생이 적은 글에 이 조각이 몇 개 들어 있는지 센다.",
    "시험 효과":"기억에서 꺼내 보는 것(시험)이 그 자체로 나중의 기억을 강하게 하는 현상(testing effect). 인출 연습 효과와 같은 말이다.",
    "%p":"퍼센트포인트. 두 퍼센트 값의 차이. 56%와 42%의 차이는 14%p."
  }
}</script>

<script src="/kit/ltt.js"></script>

<style>
  .rp-fig { width: 100%; max-width: 880px; margin: 0 auto; }
  .rp-fig svg { width: 100%; height: auto; max-height: 58vh; display: block; overflow: visible; }
  .rp-fig text { fill: var(--ltt-ink); font-size: 16px; }
  .rp-fig .muted { fill: var(--ltt-muted); }
  .rp-fig .small { font-size: 14px; }
  .rp-fig .big { font-size: 22px; font-weight: 700; }
  .rp-fig .axis { stroke: var(--ltt-line-2); stroke-width: 1.2; }
  .rp-fig .grid { stroke: var(--ltt-line); stroke-width: 1; }
  .rp-fig .note { fill: var(--ltt-muted); font-size: 14px; font-style: italic; }
  .rp-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .rp-row > .rp-fig { flex: 1 1 520px; }
  .rp-row > .rp-side { flex: 0 1 260px; }
  .rp-mini svg { width: 120px; height: 72px; }
  .rp-mini text { font-size: 13px; fill: var(--ltt-ink); }

<body>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const C_RET = 'var(--ltt-c1)';   // 인출 연습
  const C_READ = 'var(--ltt-c2)';  // 다시 읽기
  function S(tag, attrs, parent, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  function box(el, w, h) {
    const wrap = document.createElement('div');
    wrap.className = 'rp-fig';
    el.appendChild(wrap);
    const svg = S('svg', { viewBox: `0 0 ${w} ${h}`, role: 'img' }, wrap);
    return { wrap, svg };
  }
  function markSquare(g, x, y, color, s = 11) { return S('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, fill: color }, g); }
  function markDot(g, x, y, color, r = 6.5) { return S('circle', { cx: x, cy: y, r, fill: color }, g); }

  // ---- 데이터 (outline.md 주장과 근거) ----
  const EBB = [ // [일, 절약률 %], Ebbinghaus 1885
    [0.0139, 58.2], [0.0417, 44.2], [0.367, 35.8], [1, 33.7], [2, 27.8], [6, 25.4]
  ];
  const RK1 = { // Roediger & Karpicke 2006 실험 1, 아이디어 단위 회상 %
    read: [81, 54, 42], ret: [75, 68, 56], days: [5 / 1440, 2, 7]
  };
  const RK2 = [ // 실험 2: 학습 판단(1–7), 1주 뒤 회상 %
    { name: '읽기 4번', seq: 'RRRR', jol: 4.81, wk: 40 },
    { name: '읽기 3 + 떠올리기 1', seq: 'RRRT', jol: 4.21, wk: 56 },
    { name: '읽기 1 + 떠올리기 3', seq: 'RTTT', jol: 4.00, wk: 61 }
  ];

  LTT.expect('망각: 0→1일 감소 %p', 100 - EBB[3][1], 66.3, { tol: 0.05 });
  LTT.expect('망각: 1→6일 감소 %p', EBB[3][1] - EBB[5][1], 8.3, { tol: 0.05 });
  LTT.expect('실험1: 1주 차이 %p', RK1.ret[2] - RK1.read[2], 14, { tol: 0.01 });
  LTT.expect('실험1: 5분 차이 %p', RK1.read[0] - RK1.ret[0], 6, { tol: 0.01 });
  const lossRead = (RK1.read[0] - RK1.read[2]) / RK1.read[0];
  const lossRet = (RK1.ret[0] - RK1.ret[2]) / RK1.ret[0];
  LTT.expect('실험1: 다시 읽기 잃은 비율', lossRead, 0.4815, { tol: 0.001 });
  LTT.expect('실험1: 인출 연습 잃은 비율', lossRet, 0.2533, { tol: 0.001 });
  LTT.expect('실험2: RTTT−RRRR 1주 %p', RK2[2].wk - RK2[0].wk, 21, { tol: 0.01 });

  // ---- 장면 3: 망각 곡선 ----
  function forgetFig(el) {
    const W = 760, H = 380, L = 70, R = 720, T = 30, B = 320;
    const { svg } = box(el, W, H);
    const x = d => L + d / 7 * (R - L), y = p => B - p / 100 * (B - T);
    const g = S('g', {}, svg);
    for (let p = 0; p <= 100; p += 25) {
      S('line', { x1: L, x2: R, y1: y(p), y2: y(p), class: 'grid' }, g);
      S('text', { x: L - 10, y: y(p) + 5, 'text-anchor': 'end', class: 'small muted' }, g, p + '%');
    }
    for (let d = 0; d <= 7; d++) {
      S('text', { x: x(d), y: B + 24, 'text-anchor': 'middle', class: 'small muted' }, g, d === 0 ? '학습' : d + '일');
    }
    S('line', { x1: L, x2: R, y1: B, y2: B, class: 'axis' }, g);
    S('line', { x1: L, x2: L, y1: T, y2: B, class: 'axis' }, g);
    S('text', { x: R, y: B + 50, 'text-anchor': 'end', class: 'small muted' }, g, '학습 뒤 지난 시간 (일, 같은 간격 눈금)');
    S('text', { x: L, y: T - 12, class: 'small muted' }, g, '남은 기억 (절약률 %)');
    const clip = S('clipPath', { id: 'rp-forget-clip' }, svg);
    const clipRect = S('rect', { x: 0, y: 0, width: L, height: H }, clip);
    const curve = S('g', { 'clip-path': 'url(#rp-forget-clip)' }, svg);
    const pts = [[0, 100]].concat(EBB);
    S('polyline', { points: pts.map(([d, p]) => x(d) + ',' + y(p)).join(' '), fill: 'none', stroke: 'var(--ltt-accent)', 'stroke-width': 3 }, curve);
    S('circle', { cx: x(0), cy: y(100), r: 6, fill: 'var(--ltt-card)', stroke: 'var(--ltt-accent)', 'stroke-width': 2 }, curve);
    EBB.forEach(([d, p]) => S('circle', { cx: x(d), cy: y(p), r: 5, fill: 'var(--ltt-accent)' }, curve));
    const labels = S('g', {}, svg);
    S('text', { x: x(0) + 14, y: y(100) + 5, class: 'small' }, labels, '학습 직후 100% (정의값, 측정점 아님)');
    S('text', { x: x(0.0417) + 14, y: y(44.2) - 4, class: 'small' }, labels, '1시간 44.2%');
    S('text', { x: x(1) + 8, y: y(33.7) - 12, class: 'small' }, labels, '1일 33.7%');
    S('text', { x: x(2) + 8, y: y(27.8) - 12, class: 'small' }, labels, '2일 27.8%');
    S('text', { x: x(6) - 24, y: y(25.4) - 14, class: 'small', 'text-anchor': 'middle' }, labels, '6일 25.4%');
    S('text', { x: R, y: y(25.4) + 34, class: 'note', 'text-anchor': 'end' }, labels, '31일 뒤 21% (축 밖)');
    // 핵심 관계: 첫날 감소 vs 이후 5일 감소
    const br = S('g', {}, svg);
    S('line', { x1: x(1) + 4, x2: x(1) + 4, y1: y(100), y2: y(33.7), stroke: 'var(--ltt-bad)', 'stroke-width': 4 }, br);
    S('text', { x: x(1) + 14, y: y(70), class: 'big', fill: 'var(--ltt-bad)' }, br, '첫날 −66.3%p');
    S('line', { x1: x(6) + 22, x2: x(6) + 22, y1: y(33.7), y2: y(25.4), stroke: 'var(--ltt-ink-2)', 'stroke-width': 4 }, br);
    S('text', { x: x(6) + 30, y: y(29.5) + 6, class: 'small' }, br, '1→6일 −8.3%p');
    S('text', { x: L + 10, y: B - 10, class: 'note' }, svg, '점: 측정값 · 선: 측정점을 이은 직선 · Ebbinghaus (1885)');
    LTT.clock(svg, t => {
      const f = Math.min(1, t / 2200);
      clipRect.setAttribute('width', L + f * (R - L + 20));
      const show = t >= 2400 ? 1 : 0;
      labels.style.opacity = f >= 1 ? 1 : 0.0001;
      br.style.opacity = show || 0.0001;
    }, { dur: 3000, id: 'forget' });
  }

  // ---- 장면 4: 실험 설계 ----
  function designFig(el) {
    const W = 800, H = 340;
    const { svg } = box(el, W, H);
    const rows = [
      { y: 70, name: '다시 읽기 집단', second: '같은 글 다시 읽기', color: C_READ, txt: 'var(--ltt-ink)' },
      { y: 170, name: '인출 연습 집단', second: '책 덮고 떠올려 쓰기', color: C_RET, txt: 'var(--ltt-ink)' }
    ];
    S('text', { x: 200, y: 26, class: 'small muted', 'text-anchor': 'middle' }, svg, '첫 번째 시간');
    S('text', { x: 380, y: 26, class: 'small muted', 'text-anchor': 'middle' }, svg, '두 번째 시간');
    rows.forEach(r => {
      S('text', { x: 10, y: r.y + 6 }, svg, r.name);
      S('rect', { x: 125, y: r.y - 26, width: 150, height: 52, rx: 6, fill: 'var(--ltt-card-2)', stroke: 'var(--ltt-line-2)' }, svg);
      S('text', { x: 200, y: r.y + 6, 'text-anchor': 'middle' }, svg, '글 읽기');
      S('rect', { x: 290, y: r.y - 26, width: 180, height: 52, rx: 6, fill: 'none', stroke: r.color, 'stroke-width': 4 }, svg);
      S('text', { x: 380, y: r.y + 6, 'text-anchor': 'middle', style: 'font-weight:700' }, svg, r.second);
      S('path', { d: `M478 ${r.y} L 520 ${r.y} L 560 124`, stroke: 'var(--ltt-line-2)', 'stroke-width': 2, fill: 'none' }, svg);
    });
    S('text', { x: 380, y: 222 + 0, class: 'note', 'text-anchor': 'middle' }, svg, '정답 확인(피드백) 없음');
    S('text', { x: 680, y: 26, class: 'small muted', 'text-anchor': 'middle' }, svg, '최종 시험 (자유 회상)');
    ['5분 뒤', '2일 뒤', '1주 뒤'].forEach((s, i) => {
      const yy = 60 + i * 64;
      S('rect', { x: 600, y: yy - 22, width: 160, height: 44, rx: 6, fill: 'var(--ltt-card-2)', stroke: 'var(--ltt-line-2)' }, svg);
      S('text', { x: 680, y: yy + 6, 'text-anchor': 'middle' }, svg, s);
      S('line', { x1: 560, y1: 124, x2: 598, y2: yy, stroke: 'var(--ltt-line-2)', 'stroke-width': 1.5 }, svg);
    });
    S('text', { x: 680, y: 274, class: 'small', 'text-anchor': 'middle' }, svg, '시점마다 다른 학생들');
    S('text', { x: 680, y: 296, class: 'small', 'text-anchor': 'middle' }, svg, '(한 학생은 시험 한 번)');
    S('text', { x: 10, y: 320, class: 'note' }, svg, '다른 것은 두 번째 시간 하나뿐 — Roediger & Karpicke (2006) 실험 1');
  }

  // ---- 장면 6: 역전 ----
  function reversalFig(el) {
    const W = 800, H = 400, L = 70, R = 640, T = 30, B = 330;
    const { svg } = box(el, W, H);
    const x = d => L + d / 7 * (R - L), y = p => B - (p - 30) / 60 * (B - T);
    for (let p = 30; p <= 90; p += 10) {
      S('line', { x1: L, x2: R, y1: y(p), y2: y(p), class: 'grid' }, svg);
      S('text', { x: L - 10, y: y(p) + 5, 'text-anchor': 'end', class: 'small muted' }, svg, p + '%');
    }
    S('line', { x1: L, x2: R, y1: B, y2: B, class: 'axis' }, svg);
    ['5분', '2일', '1주'].forEach((s, i) => S('text', { x: x(RK1.days[i]), y: B + 24, 'text-anchor': 'middle', class: 'small muted' }, svg, s));
    S('text', { x: R, y: B + 50, 'text-anchor': 'end', class: 'small muted' }, svg, '최종 시험까지 지난 시간 (일, 같은 간격 눈금)');
    S('text', { x: L, y: T - 12, class: 'small muted' }, svg, '최종 시험에서 떠올린 내용 (%, 세로축은 30%부터)');
    const clip = S('clipPath', { id: 'rp-rev-clip' }, svg);
    const cr = S('rect', { x: 0, y: 0, width: L, height: H }, clip);
    const lines = S('g', { 'clip-path': 'url(#rp-rev-clip)' }, svg);
    const series = [
      { key: 'read', c: C_READ, mark: markSquare, label: '다시 읽기', dash: '' },
      { key: 'ret', c: C_RET, mark: markDot, label: '인출 연습', dash: '' }
    ];
    series.forEach(s => {
      const v = RK1[s.key];
      S('polyline', { points: v.map((p, i) => x(RK1.days[i]) + ',' + y(p)).join(' '), fill: 'none', stroke: s.c, 'stroke-width': 3.5 }, lines);
      v.forEach((p, i) => {
        s.mark(lines, x(RK1.days[i]), y(p), s.c);
        S('text', { x: x(RK1.days[i]) + (i === 0 ? 12 : 0), y: y(p) + (s.key === 'read' ? (i === 0 ? -8 : 26) : (i === 0 ? 26 : -14)), 'text-anchor': i === 0 ? 'start' : 'middle', class: 'small', style: 'font-weight:700' }, lines, p + '%');
      });
    });
    const end = S('g', {}, svg);
    S('line', { x1: R + 16, x2: R + 16, y1: y(56), y2: y(42), stroke: 'var(--ltt-ink)', 'stroke-width': 3 }, end);
    S('text', { x: R + 26, y: y(49) + 8, class: 'big' }, end, '14%p');
    S('text', { x: R + 26, y: y(56) - 4, class: 'small', fill: C_RET }, end, '인출 연습');
    S('text', { x: R + 26, y: y(42) + 22, class: 'small', fill: C_READ }, end, '다시 읽기');
    S('text', { x: x(2) + 18, y: y(78), class: 'small' }, end, '5분 값 대비 1주 뒤 잃은 비율:');
    S('text', { x: x(2) + 18, y: y(78) + 22, class: 'small', fill: C_READ, style: 'font-weight:700' }, end, '다시 읽기 81→42, −48%');
    S('text', { x: x(2) + 18, y: y(78) + 44, class: 'small', fill: C_RET, style: 'font-weight:700' }, end, '인출 연습 75→56, −25%');
    S('text', { x: L + 10, y: B - 10, class: 'note' }, svg, '선: 측정 3시점을 이은 직선 — 그 사이는 측정하지 않음 · Roediger & Karpicke (2006) 실험 1');
    const lg = S('g', {}, svg);
    markSquare(lg, R - 150, T + 4, C_READ); S('text', { x: R - 140, y: T + 9, class: 'small' }, lg, '다시 읽기');
    markDot(lg, R - 60, T + 4, C_RET); S('text', { x: R - 50, y: T + 9, class: 'small' }, lg, '인출 연습');
    LTT.clock(svg, t => {
      const f = Math.min(1, t / 2800);
      cr.setAttribute('width', L + f * (R - L + 30));
      end.style.opacity = t >= 3200 ? 1 : 0.0001;
    }, { dur: 4000, id: 'reversal' });
  }

  // ---- 장면 7: 자신감 vs 실제 ----
  function seqGlyph(g, x, yy, seq) {
    [...seq].forEach((c, i) => S('rect', { x: x + i * 20, y: yy - 8, width: 16, height: 16, rx: 2, fill: c === 'T' ? C_RET : 'var(--ltt-card-2)', stroke: c === 'T' ? C_RET : 'var(--ltt-line-2)' }, g));
  }
  function illusionFig(el) {
    const W = 860, H = 380;
    const { svg } = box(el, W, H);
    const rowsY = [110, 190, 270];
    S('text', { x: 10, y: 40, class: 'small muted' }, svg, '공부한 4번의 시간');
    const lg = S('g', {}, svg);
    S('rect', { x: 10, y: 52, width: 14, height: 14, fill: 'var(--ltt-card-2)', stroke: 'var(--ltt-line-2)' }, lg);
    S('text', { x: 30, y: 64, class: 'small' }, lg, '읽기');
    S('rect', { x: 80, y: 52, width: 14, height: 14, fill: C_RET }, lg);
    S('text', { x: 100, y: 64, class: 'small' }, lg, '떠올리기');
    RK2.forEach((g, i) => {
      seqGlyph(svg, 10, rowsY[i], g.seq);
      S('text', { x: 100, y: rowsY[i] + 6, class: 'small' }, svg, g.name);
    });
    // 왼쪽: 학습 판단
    const L1 = 290, W1 = 230;
    S('text', { x: L1, y: 40, style: 'font-weight:700' }, svg, '공부 직후 자신감');
    S('text', { x: L1, y: 62, class: 'small muted' }, svg, '"1주 뒤 얼마나 기억할까?" 1–7점');
    const sx = v => L1 + (v - 1) / 6 * W1;
    RK2.forEach((g, i) => {
      const top = i === 0;
      S('rect', { x: L1, y: rowsY[i] - 16, width: sx(g.jol) - L1, height: 32, fill: top ? 'var(--ltt-warn)' : 'var(--ltt-line-2)' }, svg);
      S('text', { x: sx(g.jol) + 8, y: rowsY[i] + 6, style: 'font-weight:700' }, svg, g.jol.toFixed(1));
    });
