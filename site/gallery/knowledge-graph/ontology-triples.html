<script type="application/json" id="ltt-meta">{
  "topic": "RDF 트리플·온톨로지 추론과 관계형 테이블의 차이 — 사내 데이터 통합 방식 결정",
  "audience": "관계형 DB와 SQL에 익숙한 데이터 엔지니어",
  "theme": "spec",
  "medium": "deck",
  "decision": "사내 데이터 통합: 관계형 테이블 유지 / 온톨로지(RDF) 도입 / 관계형 위 가상 그래프",
  "glossary": {
    "온톨로지": "한 분야의 개념(클래스)과 그 사이 관계를 기계가 읽을 수 있는 문장(공리)으로 적은 것. 예: '팀장은 직원의 한 종류다'.",
    "트리플": "사실 하나를 <b>주어 – 술어 – 목적어</b> 세 칸으로 적은 문장. RDF 데이터는 트리플의 집합이다.",
    "IRI": "대상 하나를 전 세계에서 하나로 가리키는 이름(URL 꼴). 예: <code>https://hanbit.co/hr/emp17</code>. 이 수업에서는 <code>:emp17</code>처럼 줄여 쓴다.",
    "리터럴": "문자열·숫자·날짜 같은 값. 트리플의 목적어 자리에만 온다. 그림에서는 네모 상자로 그린다.",
    "클래스": "같은 종류의 대상 묶음. 예: <code>:직원</code>, <code>:사람</code>. 대상이 어느 클래스에 속하는지는 <code>a</code>(rdf:type) 트리플로 적는다.",
    "추론기": "온톨로지의 규칙을 데이터에 적용해 적지 않은 트리플을 만들어 내는 프로그램(reasoner).",
    "SPARQL": "RDF 그래프에 묻는 질의 언어. 트리플 모양의 패턴(<code>?e :소속 ?d</code>)을 그래프에 맞춰 본다.",
    "rdf:type": "줄여서 <code>a</code>로 쓴다. <code>:emp17 a :팀장</code> = 'emp17은 팀장 클래스의 인스턴스다'.",
    "subClassOf": "<code>rdfs:subClassOf</code>. <code>:팀장 rdfs:subClassOf :직원</code> = '모든 팀장은 직원이다'. 전이된다.",
    "rdfs:domain": "술어에 대한 온톨로지 문장. <code>:담당 rdfs:domain :직원</code> = ':담당'의 주어 자리는 직원 클래스와 묶여 있다.",
    "SHACL": "W3C 표준 검증 언어. '직원은 이메일이 꼭 1개 있다' 같은 모양을 적고, 맞지 않는 데이터를 보고한다. 추론이 아니라 검사다.",
    "owl:sameAs": "두 IRI가 같은 대상이라는 문장. 한쪽에 대한 사실이 다른 쪽에도 성립한다.",
    "owl:hasKey": "'이 클래스의 개체는 이 속성 값이 같으면 같은 개체다'라는 규칙. 추론기가 sameAs를 만든다.",
    "subPropertyOf": "<code>rdfs:subPropertyOf</code>. <code>erp:manager rdfs:subPropertyOf :담당</code>이면 erp:manager 트리플은 :담당 트리플로도 성립한다.",
    "R2RML": "관계형 테이블을 RDF 트리플로 보는 매핑을 적는 W3C 표준. 데이터를 옮기지 않고 가상 그래프로 질의할 때도 쓴다(예: Ontop).",
    "ETL": "원천 시스템에서 뽑아(Extract) 형태를 바꿔(Transform) 대상 저장소에 넣는(Load) 작업."
  }
}</script>

<script>
(() => {
  // ---------- 데이터 모델 ----------
  const T = (s, p, o) => ({ s, p, o });
  const EMP = [{ id: 17, name: "김하나", dept: 3 }, { id: 21, name: "이도윤", dept: 3 }, { id: 30, name: "박서준", dept: 5 }];
  const DEPT = [{ id: 3, name: "데이터팀" }, { id: 5, name: "영업팀" }];
  const tableTriples = () => [
    ...EMP.flatMap((e) => [T(":emp" + e.id, ":이름", `"${e.name}"`), T(":emp" + e.id, ":소속", ":dept" + e.dept)]),
    ...DEPT.map((d) => T(":dept" + d.id, ":이름", `"${d.name}"`))];
  const k = (t) => t.s + "|" + t.p + "|" + t.o;
  // RDFS 규칙 rdfs2(domain), rdfs7(subPropertyOf), rdfs9(type 상속), rdfs11(subClassOf 전이) + OWL 2 hasKey
  function closure(input) {
    const set = new Map(input.map((t) => [k(t), t]));
    let changed = true;
    const add = (t) => { if (!set.has(k(t))) { set.set(k(t), t); changed = true; } };
    while (changed) {
      changed = false;
      const all = [...set.values()];
      for (const a of all) for (const b of all) {
        if (a.p === "subClassOf" && b.p === "subClassOf" && a.o === b.s) add(T(a.s, "subClassOf", b.o));
        if (a.p === "a" && b.p === "subClassOf" && a.o === b.s) add(T(a.s, "a", b.o));
        if (a.p === "domain" && b.p === a.s) add(T(b.s, "a", a.o));
        if (a.p === "subPropertyOf" && b.p === a.s) add(T(b.s, a.o, b.o));
      }
      for (const hk of all.filter((t) => t.p === "hasKey")) {
        const members = all.filter((t) => t.p === "a" && t.o === hk.s).map((t) => t.s);
        for (const x of members) for (const y of members) {
          if (x >= y) continue;
          const vx = all.filter((t) => t.s === x && t.p === hk.o).map((t) => t.o);
          if (all.some((t) => t.s === y && t.p === hk.o && vx.includes(t.o))) add(T(x, "sameAs", y));
        }
      }
    }
    return [...set.values()];
  }
  const ONTO = [T(":팀장", "subClassOf", ":직원"), T(":직원", "subClassOf", ":사람")];
  const TYPES = [T(":emp17", "a", ":팀장"), T(":emp21", "a", ":직원"), T(":emp30", "a", ":직원")];
  const countType = (ts, c) => new Set(ts.filter((t) => t.p === "a" && t.o === c).map((t) => t.s)).size;
  const base6 = [...ONTO, ...TYPES];
  const inf6 = closure(base6);
  const inferredTypes6 = inf6.filter((t) => t.p === "a" && !base6.some((b) => k(b) === k(t)));
  const base8 = [...base6, T(":담당", "domain", ":직원"), T("crm:u9", ":담당", "crm:acct42")];
  const inf8 = closure(base8);
  const HR = [T(":emp17", ":이름", '"김하나"'), T(":emp17", ":이메일", '"kim@hanbit.co"'), T(":emp17", ":소속", ":dept3"), T(":dept3", ":이름", '"데이터팀"')];
  const CRM = [T("crm:u9", ":이메일", '"kim@hanbit.co"'), T("crm:u9", ":담당", "crm:acct42"), T("crm:acct42", ":회사명", '"한빛물산"')];
  const merged = [...HR, ...CRM];
  const inf9 = closure([...merged, ...base8, T(":사람", "hasKey", ":이메일")]);
  const sameAs9 = inf9.filter((t) => t.p === "sameAs");
  function customersOf(ts, deptName) {
    const same = (x) => new Set([x, ...ts.filter((t) => t.p === "sameAs" && (t.s === x || t.o === x)).flatMap((t) => [t.s, t.o])]);
    const depts = ts.filter((t) => t.p === ":이름" && t.o === `"${deptName}"`).map((t) => t.s);
    const people = ts.filter((t) => t.p === ":소속" && depts.includes(t.o)).flatMap((t) => [...same(t.s)]);
    const accts = ts.filter((t) => t.p === ":담당" && people.includes(t.s)).map((t) => t.o);
    return [...new Set(ts.filter((t) => t.p === ":회사명" && accts.includes(t.s)).map((t) => t.o))];
  }
  const cust9 = customersOf(inf9, "데이터팀");

  LTT.expect("표 2개 → 트리플 수", tableTriples().length, 8);
  LTT.expect("데이터팀 직원 수(조인)", EMP.filter((e) => e.dept === 3).length, 2);
  LTT.expect("자격증 2개 추가 후 트리플 수", tableTriples().length + 2, 10);
  LTT.expect("추론된 타입 트리플 수", inferredTypes6.length, 4);
  LTT.expect("?x a :직원 (추론 끔)", countType(base6, ":직원"), 2);
  LTT.expect("?x a :직원 (추론 켬)", countType(inf6, ":직원"), 3);
  LTT.expect("?x a :사람 (추론 끔)", countType(base6, ":사람"), 0);
  LTT.expect("?x a :사람 (추론 켬)", countType(inf6, ":사람"), 3);
  LTT.expect("domain 추가 후 ?x a :직원", countType(inf8, ":직원"), 4);
  LTT.expect("HR+CRM 합집합 트리플", new Set(merged.map(k)).size, 7);
  LTT.expect("추론된 sameAs 수", sameAs9.length, 1);
  LTT.expect("데이터팀 담당 고객사 수", cust9.length, 1);

  // ---------- SVG 도우미 ----------
  const NS = "http://www.w3.org/2000/svg";
  let uid = 0;
  const add = (p, tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (text != null) e.textContent = text; p.appendChild(e); return e; };
  function svg(w, h) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.setAttribute("class", "g");
    const id = "mk" + (++uid); s.dataset.mk = id;
    const defs = add(s, "defs");
    for (const c of ["ink", "acc"]) {
      const m = add(defs, "marker", { id: `${id}-${c}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
      add(m, "path", { d: "M0,0L10,5L0,10z", class: "mk-" + c });
    }
    return s;
  }
  const textW = (s, fs = 17) => [...s].reduce((w, ch) => w + (/[ㄱ-힝]/.test(ch) ? fs : fs * 0.6), 0);
  function node(s, x, y, label, kind = "iri", w) {
    const g = add(s, "g", { class: "nd " + kind });
    const W = w || Math.max(84, textW(label) + 30), H = 40;
    if (kind === "lit") add(g, "rect", { x: x - W / 2, y: y - H / 2, width: W, height: H, rx: 3 });
    else add(g, "ellipse", { cx: x, cy: y, rx: W / 2, ry: H / 2 });
    add(g, "text", { x, y: y + 6, "text-anchor": "middle" }, label);
    return { g, x, y, w: W, h: H, kind };
  }
  function bound(n, dx, dy) {
    if (n.kind === "lit") return Math.min((n.w / 2 + 3) / Math.abs(dx || 1e-9), (n.h / 2 + 3) / Math.abs(dy || 1e-9));
    return 1 / Math.sqrt((dx / (n.w / 2 + 3)) ** 2 + (dy / (n.h / 2 + 3)) ** 2);
  }
  function edge(s, a, b, label, o = {}) {
    const dx = b.x - a.x, dy = b.y - a.y, ta = bound(a, dx, dy), tb = bound(b, -dx, -dy);
    const x1 = a.x + dx * ta, y1 = a.y + dy * ta, x2 = b.x - dx * tb, y2 = b.y - dy * tb;
    const g = add(s, "g", { class: "ed " + (o.cls || "") });
    add(g, "line", { x1, y1, x2, y2, ...(o.noArrow ? {} : { "marker-end": `url(#${s.dataset.mk}-${o.mk || "ink"})` }) });
    if (label) add(g, "text", { x: (x1 + x2) / 2 + (o.lo ? o.lo[0] : 0), y: (y1 + y2) / 2 + (o.lo ? o.lo[1] : -8), "text-anchor": o.anchor || "middle" }, label);
    return g;
  }
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const fade = (t, start, len = 400) => clamp((t - start) / len);
  const show = (el, v) => { el.style.opacity = v; };

  // ---------- 장면 3·4 그래프 ----------
  function tripleGraph(s, withAnno) {
    const n = {};
    const empY = { 17: 70, 21: 190, 30: 310 };
    for (const e of EMP) {
      n["e" + e.id] = node(s, 560, empY[e.id], ":emp" + e.id);
      n["n" + e.id] = node(s, 385, empY[e.id], `"${e.name}"`, "lit", 110);
    }
    n.d3 = node(s, 790, 110, ":dept3"); n.d5 = node(s, 790, 290, ":dept5");
    n.dn3 = node(s, 790, 200, '"데이터팀"', "lit", 120); n.dn5 = node(s, 790, 380, '"영업팀"', "lit", 120);
    const ed = {};
    for (const e of EMP) {
      ed["name" + e.id] = edge(s, n["e" + e.id], n["n" + e.id], "이름");
      ed["dept" + e.id] = edge(s, n["e" + e.id], n["d" + e.dept], "소속", e.id === 21 ? { lo: [0, 22] } : {});
    }
    ed.dname3 = edge(s, n.d3, n.dn3, "이름", { lo: [10, 6], anchor: "start" });
    ed.dname5 = edge(s, n.d5, n.dn5, "이름", { lo: [10, 6], anchor: "start" });
    const lg = add(s, "g", {});
    add(lg, "ellipse", { cx: 312, cy: 22, rx: 12, ry: 8, class: "", style: "fill:var(--ltt-card);stroke:var(--ltt-ink)" });
    add(lg, "text", { x: 330, y: 28, style: "font-size:15px" }, "IRI(자원)");
    add(lg, "rect", { x: 420, y: 14, width: 22, height: 16, style: "fill:var(--ltt-card-2);stroke:var(--ltt-muted)" });
    add(lg, "text", { x: 450, y: 28, style: "font-size:15px" }, "리터럴(값)");
    let anno = null;
    if (withAnno) {
      anno = add(s, "g", {});
      add(anno, "text", { x: 560, y: 112, "text-anchor": "middle", class: "note" }, "주어");
      add(anno, "text", { x: 474, y: 112, "text-anchor": "middle", class: "note" }, "술어");
      add(anno, "text", { x: 385, y: 112, "text-anchor": "middle", class: "note" }, "목적어");
    }
    return { n, ed, anno };
  }

  function tableBox(s, x, y, title, cols, rows) {
    add(s, "text", { x, y: y - 12, style: "font-weight:700" }, title);
    const g = add(s, "g", { class: "tb" });
    const rowsG = [];
    [cols.map((c) => c[0]), ...rows].forEach((r, i) => {
      const rg = add(g, "g", { class: i === 0 ? "th" : "" });
      let cx = x;
      r.forEach((cell, j) => {
        const w = cols[j][1];
        add(rg, "rect", { x: cx, y: y + i * 34, width: w, height: 34 });
        add(rg, "text", { x: cx + 10, y: y + i * 34 + 23, class: i === 0 ? "" : "mono", style: i === 0 ? "font-weight:700;font-size:16px" : "font-size:16px" }, String(cell));
        cx += w;
      });
      if (i > 0) rowsG.push(rg);
    });
    return rowsG;
  }

  function rowsToTriples(el) {
