<title>LLM은 보이는 것보다 더 안다 — 환각의 내부 표현</title>
<script type="application/json" id="ltt-meta">{
  "topic": "LLM 환각의 내부 표현 (Orgad et al., 2024)",
  "audience": "Transformer를 막 배운 학습자. 은닉 상태·토큰은 안다.",
  "theme": "notebook",
  "medium": "deck",
  "decision": "논문 'LLMs Know More Than They Show'를 읽고 이해하기",
  "glossary": {
    "샘플링": "다음 토큰을 확률에 따라 무작위로 뽑는 생성 방식. 같은 질문에도 매번 다른 답이 나올 수 있다.",
    "탐욕 디코딩": "매번 확률이 가장 높은 토큰만 고르는 생성 방식. 같은 질문에는 늘 같은 답이 나온다.",
    "로지스틱 회귀": "점수 w·h + b를 0~1 확률로 바꿔 두 부류를 가르는 가장 단순한 선형 분류기.",
    "오류 탐지": "모델이 낸 답이 틀렸는지를 답이 나온 뒤 판정하는 일. 이 논문에서는 은닉 상태를 읽어 판정한다."
  }
}</script>

<body>
<script>
const NS = "http://www.w3.org/2000/svg";
const SRC = "Orgad et al., 2024, “LLMs Know More Than They Show: On the Intrinsic Representation of LLM Hallucinations”, arXiv:2410.02707 (ICLR 2025)";
function svg(el, w, h) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("role", "img");
  el.appendChild(s);
  return s;
}
function add(p, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  p.appendChild(e);
  return e;
}
const GOOD = "fill:var(--ltt-good)", BAD = "fill:var(--ltt-bad)";
function dotMark(p, x, y, ok, r = 6) {
  if (ok) return add(p, "circle", { cx: x, cy: y, r, style: GOOD });
  const g = add(p, "g", { style: "stroke:var(--ltt-bad);stroke-width:3;stroke-linecap:round" });
  add(g, "line", { x1: x - r, y1: y - r, x2: x + r, y2: y + r });
  add(g, "line", { x1: x - r, y1: y + r, x2: x + r, y2: y - r });
  return g;
}
function legend(p, x, y) {
  dotMark(p, x, y, true, 6); add(p, "text", { x: x + 12, y: y + 5, class: "sm" }, "맞는 답의 은닉 상태");
  dotMark(p, x + 170, y, false, 6); add(p, "text", { x: x + 182, y: y + 5, class: "sm" }, "틀린 답의 은닉 상태");
}

/* ---------- 장면 4: 가상 probe ---------- */
const CORRECT = [[2, 1], [1.5, -1], [3, 0.5], [1, 2], [2.5, -0.5], [-0.5, 1.5]];
const WRONG = [[-2, -1], [-1.5, 1], [-3, -0.5], [-1, -2], [-2.5, 0.5], [0.5, -1.5]];
function probeHits(deg) {
  const t = deg * Math.PI / 180, w = [Math.cos(t), Math.sin(t)];
  const s = ([x, y]) => w[0] * x + w[1] * y;
  return CORRECT.filter((h) => s(h) > 0).length + WRONG.filter((h) => s(h) < 0).length;
}
[[0, 10], [45, 12], [90, 8], [135, 4], [180, 2]].forEach(([d, e]) => LTT.expect(`probe ${d}° 맞힌 점 수`, probeHits(d), e, { tol: 0 }));
LTT.expect("probe 0° 정확도(%)", Math.round(probeHits(0) / 12 * 1000) / 10, 83.3, { tol: 0.05 });

/* ---------- 장면 10–11: 가상 샘플 ---------- */
const SAMPLES = [{ a: "시드니", n: 18, p: 0.32, ok: false }, { a: "캔버라", n: 9, p: 0.81, ok: true }, { a: "멜버른", n: 3, p: 0.15, ok: false }];
const TOTAL = SAMPLES.reduce((s, d) => s + d.n, 0);
LTT.expect("샘플 합", TOTAL, 30, { tol: 0 });
LTT.expect("시드니 비율(%)", SAMPLES[0].n / TOTAL * 100, 60, { tol: 1e-9 });
LTT.expect("캔버라 비율(%)", SAMPLES[1].n / TOTAL * 100, 30, { tol: 1e-9 });
LTT.expect("멜버른 비율(%)", SAMPLES[2].n / TOTAL * 100, 10, { tol: 1e-9 });
const byVote = SAMPLES.reduce((a, b) => (b.n > a.n ? b : a));
const byProbe = SAMPLES.reduce((a, b) => (b.p > a.p ? b : a));

/* ---------- 결정적 가상 점구름 ---------- */
function noise(seed, n) {
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: n }, () => [(r() - 0.5) * 2.4, (r() - 0.5) * 2.4]);
}
const NZ = noise(11, 20);
const LBL = NZ.map((_, i) => (i < 10 ? 1 : -1));

/* ---------- 그림 함수 ---------- */
const TOKS = ["Australia", "?", "The", "capital", "is", "Canberra", "."];
const LAYERS = ["임베딩", "4층", "8층", "12층", "16층", "20층", "24층", "28층", "32층"];
const HOT = 5, READ_ROW = 4;
function streamFig(el) {
  el.classList.add("fig");
  const s = svg(el, 760, 490);
  const x0 = 120, cw = 88, y0 = 410, rh = 40;
  add(s, "text", { x: x0, y: 24, class: "sm mut" }, "가로 = 토큰 자리, 세로 = 층 (32층 모델, 4층마다 한 줄, + = 층이 더한 값. 토큰 경계는 단순화)");
  LAYERS.forEach((l, r) => add(s, "text", { x: x0 - 14, y: y0 - r * rh + 6, "text-anchor": "end", class: "sm mut" }, l));
  TOKS.forEach((t, c) => add(s, "text", { x: x0 + c * cw + cw / 2 - 4, y: y0 + 40, "text-anchor": "middle", style: c === HOT ? "font-weight:700" : "" }, t));
  add(s, "line", { x1: x0 + 2 * cw - 6, y1: 40, x2: x0 + 2 * cw - 6, y2: y0 + 46, style: "stroke:var(--ltt-line-2);stroke-dasharray:4 4" });
  add(s, "text", { x: x0 + 2 * cw - 12, y: y0 + 62, "text-anchor": "end", class: "sm mut" }, "질문");
  add(s, "text", { x: x0 + 2 * cw, y: y0 + 62, class: "sm mut" }, "모델이 생성한 답 →");
  const cells = [];
  LAYERS.forEach((_, r) => TOKS.forEach((_, c) => {
    const rect = add(s, "rect", { x: x0 + c * cw, y: y0 - r * rh - 13, width: cw - 12, height: 26, rx: 5, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line)" });
    cells.push({ r, c, rect });
  }));
  const plus = LAYERS.slice(1).map((_, i) => add(s, "text", { x: x0 + HOT * cw + cw - 4, y: y0 - (i + 1) * rh + 26, class: "sm", style: "fill:var(--ltt-accent);opacity:0" }, "+"));
  const ring = add(s, "rect", { x: x0 + HOT * cw - 6, y: y0 - READ_ROW * rh - 19, width: cw, height: 38, rx: 8, style: "fill:none;stroke:var(--ltt-warn);stroke-width:3;opacity:0" });
  const readT = add(s, "text", { x: x0 + HOT * cw + cw / 2 - 6, y: 52, "text-anchor": "middle", class: "big", style: "fill:var(--ltt-warn);opacity:0" }, "여기서 꺼내 읽는다");
  const readS = add(s, "text", { x: x0 + HOT * cw + cw / 2 - 6, y: 74, "text-anchor": "middle", class: "sm", style: "opacity:0" }, "16층 은닉 상태 = 숫자 4096개");
  const readL = add(s, "line", { x1: x0 + HOT * cw + cw / 2 - 6, y1: 82, x2: x0 + HOT * cw + cw / 2 - 6, y2: y0 - READ_ROW * rh - 20, style: "stroke:var(--ltt-warn);stroke-width:2;opacity:0" });
  const DUR = 4000, FILL = 3200;
  LTT.clock(s, (t) => {
    const k = Math.min(LAYERS.length - 1, Math.floor((t / FILL) * (LAYERS.length - 1)));
    cells.forEach(({ r, c, rect }) => {
      const on = c === HOT && r <= k;
      rect.setAttribute("style", on ? `fill:var(--ltt-accent);opacity:${0.35 + 0.65 * (r / 8)};stroke:var(--ltt-accent)` : "fill:var(--ltt-card-2);stroke:var(--ltt-line)");
    });
    plus.forEach((p, i) => p.style.opacity = i < k ? 1 : 0);
    const done = t >= FILL ? 1 : 0;
    [ring, readT, readS, readL].forEach((e) => e.style.opacity = done);
  }, { dur: DUR, id: "stream" });
  return { el: s };
}

function cloudPanel(s, ox, oy, size, pts, opts = {}) {
  const sc = size / 7;
  add(s, "rect", { x: ox, y: oy, width: size, height: size, rx: 8, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line)" });
  const cx = ox + size / 2, cy = oy + size / 2;
  if (opts.boundary) add(s, "line", { x1: cx, y1: oy + 8, x2: cx, y2: oy + size - 8, style: "stroke:var(--ltt-ink-2);stroke-width:2;stroke-dasharray:6 5" });
  pts.forEach(([x, y, ok]) => dotMark(s, cx + x * sc, cy - y * sc, ok, 5));
  return { cx, cy, sc };
}

function exactFig(el) {
  el.classList.add("fig");
  const s = svg(el, 820, 400);
  const pos = [{ n: "① 답의 첫 토큰 “The”", d: 0.25 }, { n: "② 정확한 답 토큰 “Canberra”", d: 1.4, hot: true }, { n: "③ 마지막 토큰 “.”", d: 0.7 }];
  pos.forEach((p, k) => {
    const ox = 20 + k * 270, oy = 50, size = 240;
    const pts = NZ.map(([nx, ny], i) => [LBL[i] * p.d + nx, ny, LBL[i] > 0]);
    cloudPanel(s, ox, oy, size, pts, { boundary: true });
    if (p.hot) add(s, "rect", { x: ox - 5, y: oy - 5, width: size + 10, height: size + 10, rx: 11, style: "fill:none;stroke:var(--ltt-warn);stroke-width:3" });
    add(s, "text", { x: ox + size / 2, y: oy - 16, "text-anchor": "middle", style: p.hot ? "font-weight:700" : "" }, p.n);
    const wrongSide = pts.filter(([x, , ok]) => (ok ? x <= 0 : x >= 0)).length;
    add(s, "text", { x: ox + size / 2, y: oy + size + 26, "text-anchor": "middle", class: "sm" }, `경계 반대쪽에 놓인 점 ${wrongSide}개 / 20`);
  });
  legend(s, 20, 350);
  add(s, "text", { x: 20, y: 386, class: "sm mut" }, "개념도: 같은 20개 질문을 세 토큰 자리에서 찍은 가상 점(2차원). 논문 결과의 경향만 옮겼고 점의 위치는 실제 데이터가 아니다.");
  return { el: s };
}

const TASKS = ["사실 회상 1", "사실 회상 2", "상식 추론", "수학"];
function generalFig(el) {
  el.classList.add("fig");
  const s = svg(el, 860, 420);
  const size = 220;
  const A = NZ.map(([nx, ny], i) => [LBL[i] * 1.4 + nx, ny, LBL[i] > 0]);
  const B = NZ.map(([nx, ny], i) => [ny, LBL[i] * 1.4 + nx, LBL[i] > 0]);
  cloudPanel(s, 20, 60, size, A, { boundary: true });
  cloudPanel(s, 280, 60, size, B, { boundary: true });
  add(s, "text", { x: 20 + size / 2, y: 46, "text-anchor": "middle" }, "과제 A에서 학습한 경계");
  add(s, "text", { x: 280 + size / 2, y: 46, "text-anchor": "middle" }, "같은 경계를 과제 B에 대면");
  add(s, "text", { x: 20 + size / 2, y: 60 + size + 26, "text-anchor": "middle", class: "sm" }, "좌우로 갈린다");
  add(s, "text", { x: 280 + size / 2, y: 60 + size + 26, "text-anchor": "middle", class: "sm", style: "fill:var(--ltt-bad)" }, "양쪽에 섞인다 (B는 위아래로 갈림)");
  add(s, "text", { x: 252, y: 60 + size / 2 + 6, "text-anchor": "middle", class: "big" }, "→");
  const mx = 590, my = 90, c = 52;
  add(s, "text", { x: mx + 2 * c, y: 46, "text-anchor": "middle" }, "probe 성능: 학습 과제 × 시험 과제");
  add(s, "text", { x: mx + 2 * c, y: 70, "text-anchor": "middle", class: "sm mut" }, "시험 과제 →");
  TASKS.forEach((t, i) => {
    add(s, "text", { x: mx - 8, y: my + i * c + c / 2 + 5, "text-anchor": "end", class: "sm" }, t);
    TASKS.forEach((_, j) => {
      const v = i === j ? 0.95 : (i < 2 && j < 2 ? 0.5 : 0.12);
      add(s, "rect", { x: mx + j * c, y: my + i * c, width: c - 4, height: c - 4, rx: 4, style: `fill:var(--ltt-accent);opacity:${v}` });
    });
  });
  TASKS.forEach((t, j) => add(s, "text", { x: mx + j * c + c / 2 - 2, y: my + 4 * c + 18, "text-anchor": "middle", class: "sm" }, String(j + 1)));
  add(s, "text", { x: mx - 8, y: my + 4 * c + 18, "text-anchor": "end", class: "sm mut" }, "번호 = 왼쪽 과제");
  add(s, "text", { x: mx - 120, y: my - 6, class: "sm mut" }, "학습 과제 ↓");
  add(s, "text", { x: 20, y: 390, class: "sm mut" }, "개념도: 점은 가상이고 격자 칸 값은 설명용. 대각선이 가장 진하고, 비슷한 기술을 요구하는 과제끼리만 일부 옮겨 가는 논문 §4의 경향만 옮겼다.");
  return { el: s };
}

const TYPES = [
  { n: "늘 맞음", runs: [[30, "good", "정답"]] },
  { n: "늘 같은 오답", runs: [[30, "bad", "오답 X"]] },
  { n: "두 답 경쟁", runs: [[16, "good", "정답"], [14, "bad", "오답 X"]] },
  { n: "여러 답 흩어짐", runs: [[5, "good", "정답"], [7, "bad", "오답 X"], [6, "c3", "오답 Y"], [5, "c4", "오답 Z"], [4, "c5", "오답 W"], [3, "c6", "오답 V"]] }
];
TYPES.forEach((t) => LTT.expect(`${t.n} 점 수`, t.runs.reduce((s, r) => s + r[0], 0), 30, { tol: 0 }));
function typesFig(el) {
  el.classList.add("fig");
  const s = svg(el, 860, 380);
  const x0 = 170, step = 21, y0 = 70, rh = 72;
  add(s, "text", { x: x0, y: 30, class: "sm mut" }, "같은 질문을 30번 샘플링한 답. 점 하나 = 답 하나, 색·글 = 어떤 답인지");
  TYPES.forEach((t, r) => {
    const y = y0 + r * rh;
    add(s, "text", { x: x0 - 16, y: y + 6, "text-anchor": "end" }, t.n);
    let i = 0;
    t.runs.forEach(([n, tone, label]) => {
      const start = i;
      for (let k = 0; k < n; k++, i++) {
        if (tone === "bad") dotMark(s, x0 + i * step, y, false, 6);
        else add(s, "circle", { cx: x0 + i * step, cy: y, r: 7, style: `fill:var(--ltt-${tone})` });
      }
      add(s, "text", { x: x0 + ((start + i - 1) / 2) * step, y: y + 28, "text-anchor": "middle", class: "sm mut" }, `${label} ${n}`);
    });
  });
  add(s, "text", { x: 20, y: 366, class: "sm mut" }, "가상 예시: 네 줄은 유형을 보이려고 만든 분포다. 논문은 질문마다 답 30개를 뽑아 이런 유형으로 오류를 나눈다(§5).");
  return { el: s };
}

function pickFig(el) {
  el.classList.add("fig");
  const s = svg(el, 860, 400);
  const cols = [
    { x: 30, title: "다수결: 가장 많이 나온 답", val: (d) => d.n / TOTAL, txt: (d) => `${d.n}/30 = ${Math.round(d.n / TOTAL * 100)}%`, pick: byVote },
    { x: 450, title: "probe 점수가 가장 높은 답", val: (d) => d.p, txt: (d) => `점수 ${d.p.toFixed(2)}`, pick: byProbe }
  ];
  cols.forEach((c) => {
    add(s, "text", { x: c.x, y: 40, style: "font-weight:700" }, c.title);
    SAMPLES.forEach((d, i) => {
      const y = 80 + i * 70, w = 260 * c.val(d), chosen = d === c.pick;
      add(s, "text", { x: c.x, y: y + 20 }, d.a + (d.ok ? " (정답)" : ""));
      add(s, "rect", { x: c.x + 120, y: y + 2, width: 260, height: 26, rx: 4, style: "fill:var(--ltt-card-2)" });
      add(s, "rect", { x: c.x + 120, y: y + 2, width: w, height: 26, rx: 4, style: chosen ? "fill:var(--ltt-accent)" : "fill:var(--ltt-line-2)" });
      add(s, "text", { x: c.x + 128 + Math.max(w, 0), y: y + 20, class: "sm" }, c.txt(d));
    });
    const ok = c.pick.ok;
    add(s, "text", { x: c.x, y: 320, class: "big", style: ok ? "fill:var(--ltt-good)" : "fill:var(--ltt-bad)" }, `${ok ? "✓" : "✗"} ${c.pick.a}를 고른다 — ${ok ? "정답" : "오답"}`);
  });
  add(s, "text", { x: 30, y: 376, class: "sm mut" }, "가상 예시: 횟수 18·9·3은 앞 장면의 값, probe 점수는 설명용으로 정한 값이다.");
  return { el: s };
}

function pipelineFig(el) {
  el.classList.add("fig");
  const s = svg(el, 1000, 360);
  const boxes = [
    { x: 10, t: "질문", s: "호주의 수도는?" },
    { x: 175, t: "답 생성", s: "샘플링 30회 ⑤" },
    { x: 340, t: "정확한 답 토큰", s: "“Canberra” ③" },
    { x: 505, t: "16층 은닉 상태", s: "4096차원 ①" },
    { x: 670, t: "linear probe", s: "w·h + b ② ④" },
    { x: 835, t: "점수", s: "답 고르기 ⑥" }
  ];
  boxes.forEach((b, i) => {
    add(s, "rect", { x: b.x, y: 120, width: 140, height: 90, rx: 10, style: `fill:var(--ltt-card-2);stroke:${i === 4 ? "var(--ltt-accent)" : "var(--ltt-line-2)"};stroke-width:2` });
    add(s, "text", { x: b.x + 70, y: 158, "text-anchor": "middle", style: "font-weight:700" }, b.t);
    add(s, "text", { x: b.x + 70, y: 186, "text-anchor": "middle", class: "sm" }, b.s);
    if (i < boxes.length - 1) add(s, "text", { x: b.x + 152, y: 172, "text-anchor": "middle", class: "big mut" }, "→");
  });
  const notes = [
    [580, 90, "① 토큰 자리·층마다 꺼낼 수 있는 벡터"],
    [740, 250, "② 방향 w 하나로 맞음·틀림을 가른다", "middle"],
    [415, 250, "③ 진실성 신호가 가장 강한 자리"],
    [740, 280, "④ 과제마다 따로 학습해야 한다", "middle"],

function probeScene(body) {
  body.innerHTML = `<div class="probe-wrap">
    <div class="fig" id="pfig"></div>
    <div class="probe-side">
      <div id="pgoal"></div>
      <div class="ltt-param">probe 방향 w <b id="ang-v" class="ang-v"></b><div id="ang"></div></div>
      <div class="ltt-stat"><span id="pacc" class="acc"></span><small>맞게 가른 점 (12개 중)</small></div>
      <p class="ltt-basis">점수 s = w·h. s &gt; 0이면 "맞는 답"이라고 판정한다(경계선 b = 0).</p>
      <p class="tagline"><span class="ltt-tag warn">2차원으로 줄인 가상 예시 · 실제 은닉 상태는 4096차원</span></p>
    </div></div>`;
  const s = svg(body.querySelector("#pfig"), 440, 440);
  const C0 = 220, SC = 52;
  add(s, "line", { x1: 20, y1: C0, x2: 420, y2: C0, style: "stroke:var(--ltt-line)" });
  add(s, "line", { x1: C0, y1: 20, x2: C0, y2: 420, style: "stroke:var(--ltt-line)" });
  add(s, "text", { x: 412, y: C0 - 8, "text-anchor": "end", class: "sm mut" }, "축 1");
  add(s, "text", { x: C0 + 8, y: 34, class: "sm mut" }, "축 2");
  const shade = add(s, "path", { style: "fill:var(--ltt-good-soft);opacity:.6" });
  const bline = add(s, "line", { style: "stroke:var(--ltt-ink-2);stroke-width:2;stroke-dasharray:7 5" });
  const arrow = add(s, "line", { style: "stroke:var(--ltt-accent);stroke-width:4;stroke-linecap:round" });
  const wlab = add(s, "text", { class: "sm", style: "fill:var(--ltt-accent);font-weight:700" }, "w");
  const marks = add(s, "g", {});
  const P = ([x, y]) => [C0 + x * SC, C0 - y * SC];
  LTT.sweep({
    params: { ang: { kind: "steps", stops: [0, 45, 90, 135, 180], value: 0, fmt: (v) => v + "°", stopLabel: (v) => v + "°" } },
    render: ({ ang }) => {
      const t = ang * Math.PI / 180, w = [Math.cos(t), Math.sin(t)], n = [-w[1], w[0]];
      const L = 6;
      const a = P([n[0] * L, n[1] * L]), b = P([-n[0] * L, -n[1] * L]);
      bline.setAttribute("x1", a[0]); bline.setAttribute("y1", a[1]); bline.setAttribute("x2", b[0]); bline.setAttribute("y2", b[1]);
      const fa = P([n[0] * L + w[0] * L, n[1] * L + w[1] * L]), fb = P([-n[0] * L + w[0] * L, -n[1] * L + w[1] * L]);
      shade.setAttribute("d", `M${a} L${fa} L${fb} L${b} Z`);
      const tip = P([w[0] * 1.6, w[1] * 1.6]);
      arrow.setAttribute("x1", C0); arrow.setAttribute("y1", C0); arrow.setAttribute("x2", tip[0]); arrow.setAttribute("y2", tip[1]);
      const lt = P([w[0] * 1.95, w[1] * 1.95]);
      wlab.setAttribute("x", lt[0] - 5); wlab.setAttribute("y", lt[1] + 5);
      marks.innerHTML = "";
      const sc = (h) => w[0] * h[0] + w[1] * h[1];
      const draw = (h, ok) => {
        const [x, y] = P(h);
        dotMark(marks, x, y, ok, 8);
        const right = ok ? sc(h) > 0 : sc(h) < 0;
        if (!right) add(marks, "circle", { cx: x, cy: y, r: 15, style: "fill:none;stroke:var(--ltt-warn);stroke-width:3" });
      };
      CORRECT.forEach((h) => draw(h, true));
      WRONG.forEach((h) => draw(h, false));
      const hits = probeHits(ang);
      body.querySelector("#pacc").textContent = `${hits}/12`;
    },
    goal: { el: "pgoal", text: "12개 점을 모두 맞게 가르는 방향을 찾는다", check: ({ ang }) => probeHits(ang) === 12 }
  });
  const lg = svg(body.querySelector("#pfig"), 440, 60);
  legend(lg, 14, 20);
  add(lg, "circle", { cx: 20, cy: 46, r: 8, style: "fill:none;stroke:var(--ltt-warn);stroke-width:3" });
  add(lg, "text", { x: 34, y: 51, class: "sm" }, "잘못 판정된 점 · 초록 영역 = probe가 \"맞음\"이라 부르는 쪽");
  return {};
}

function termVisual(kind) {
  return (el) => {
    el.classList.add("fig");
    const s = svg(el, 200, 90);
    if (kind === "hidden") {
      for (let i = 0; i < 10; i++) add(s, "rect", { x: 10 + i * 18, y: 30, width: 14, height: 30, rx: 2, style: `fill:var(--ltt-accent);opacity:${0.25 + ((i * 37) % 10) / 14}` });
      add(s, "text", { x: 100, y: 84, "text-anchor": "middle", class: "sm" }, "숫자 4096개 중 10개");
    } else if (kind === "stream") {
      for (let r = 0; r < 4; r++) add(s, "rect", { x: 80, y: 8 + r * 18, width: 40, height: 14, rx: 3, style: `fill:var(--ltt-accent);opacity:${0.4 + r * 0.18}` });
      add(s, "text", { x: 130, y: 40, class: "sm" }, "+ 층마다");
    } else if (kind === "probe") {
      [[30, 30], [50, 50], [40, 66]].forEach(([x, y]) => add(s, "circle", { cx: x, cy: y, r: 5, style: GOOD }));
      [[150, 24], [170, 50], [140, 66]].forEach(([x, y]) => dotMark(s, x, y, false, 5));
      add(s, "line", { x1: 100, y1: 6, x2: 100, y2: 84, style: "stroke:var(--ltt-ink-2);stroke-width:2;stroke-dasharray:5 4" });
    } else {
      ["The", "capital", "is", "Canberra", "."].forEach((t, i) => {
        const x = [4, 38, 92, 114, 182][i], w = [32, 52, 20, 66, 12][i];
        add(s, "rect", { x, y: 30, width: w, height: 28, rx: 4, style: i === 3 && kind === "exact" ?"fill:var(--ltt-warn-soft);stroke:var(--ltt-warn);stroke-width:2" : "fill:var(--ltt-card-2)" });
        add(s, "text", { x: x + w / 2, y: 50, "text-anchor": "middle", class: "sm" }, t);
      });
    }
  };
}
