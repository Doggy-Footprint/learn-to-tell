  "theme": "chalk",

  "glossary": {

    "Jacobian": "벡터 출력 함수 f의 편미분 ∂fᵢ/∂xⱼ를 모두 모은 행렬. 한 점 근처에서 f를 대신하는 선형 사상이다(MML 5.3).",
    "행렬식": "2×2 행렬이면 ad − bc. 그 선형 사상이 넓이를 몇 배로 바꾸는지(부호는 방향 뒤집힘)를 뜻한다.",
    "텐서": "축이 셋 이상인 수 배열. 이 수업에서는 2×2×3 블록(축 3개).",
    "연쇄 법칙": "합성 함수의 미분은 각 단계 미분의 곱이다. 다변수에서는 Jacobian 행렬의 곱이 된다.",
    "역전파": "출력 쪽에서 입력 쪽으로 연쇄 법칙을 계산하는 방법. 신경망 학습에서 손실의 gradient를 구한다(MML 5.6).",
    "자동미분": "프로그램을 기본 연산의 계산 그래프로 보고, 연산마다 아는 국소 미분을 연쇄 법칙으로 곱해 정확한 미분값을 내는 방법. 수치 차분도, 기호식 미분도 아니다.",
    "adjoint": "최종 출력 f를 중간 변수 v로 미분한 값 ∂f/∂v. 역전파가 출력에서 입력 쪽으로 채워 가는 값이다.",
    "forward 모드": "자동미분에서 입력 쪽부터 곱해 가는 방식. 한 번 지나면 Jacobian의 열 하나(J v)를 얻는다.",
    "reverse 모드": "자동미분에서 출력 쪽부터 곱해 가는 방식(역전파). 한 번 지나면 Jacobian의 행 하나(vᵀ J)를 얻는다.",
    "Hessian": "스칼라 함수의 2차 편미분 ∂²f/∂xᵢ∂xⱼ를 모은 n×n 행렬. 2차 편미분이 연속이면 대칭이다(MML 5.7).",
    "테일러 전개": "한 점 근처에서 함수를 다항식으로 근사하는 것. 다변수 2차까지: f(x₀+Δx) ≈ f(x₀) + (df/dx)Δx + ½ ΔxᵀHΔx (Δx: x₀에서 움직인 변위).",

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const F = (a, b) => a * a * b + a * b ** 3;
const G = (a, b) => [2 * a * b + b ** 3, a * a + 3 * a * b * b];
const H = (a, b) => [[2 * b, 2 * a + 3 * b * b], [2 * a + 3 * b * b, 6 * a * b]];
const num = (v, d = 2) => { const s = (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d); return s.replace("-", "−"); };
let uid = 0;

function svgFig(el, w, h) {
  const s = d3.select(el).append("svg").attr("class", "fig").attr("viewBox", `0 0 ${w} ${h}`).attr("data-annotate", "");
  const id = "f" + (++uid);
  const defs = s.append("defs");
  [["acc", "var(--ltt-accent)"], ["c2", "var(--ltt-c2)"], ["ink", "var(--ltt-ink)"], ["mut", "var(--ltt-muted)"]].forEach(([k, c]) => {
    defs.append("marker").attr("id", `${id}-${k}`).attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5)
      .attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto-start-reverse")
      .append("path").attr("d", "M0,0 L10,5 L0,10 z").style("fill", c);
  });
  s.mk = (k) => `url(#${id}-${k})`;
  s.clip = (x, y, w2, h2) => { const cid = `${id}-c${x}-${y}`; defs.append("clipPath").attr("id", cid).append("rect").attr("x", x).attr("y", y).attr("width", w2).attr("height", h2); return `url(#${cid})`; };
  return s;
}
function arrow(g, x1, y1, x2, y2, cls, mk) {
  return g.append("line").attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2).attr("class", cls).attr("marker-end", mk);
}
function contourPaths(g, X, Y, dom, levels, cls) {
  const n = 90, [a0, a1, b0, b1] = dom, vals = new Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) vals[j * n + i] = F(a0 + (a1 - a0) * i / (n - 1), b0 + (b1 - b0) * j / (n - 1));
  const cs = d3.contours().size([n, n]).thresholds(levels)(vals);
  const tr = d3.geoTransform({ point(x, y) { this.stream.point(X(a0 + (a1 - a0) * (x - 0.5) / (n - 1)), Y(b0 + (b1 - b0) * (y - 0.5) / (n - 1))); } });
  return g.selectAll(null).data(cs).join("path").attr("d", d3.geoPath(tr)).attr("class", cls);
}
function mapFrame(s, X, Y, ticks) {
  const g = s.append("g");
  const [x0, x1] = X.domain(), [y0, y1] = Y.domain();
  g.append("rect").attr("class", "frame").attr("x", X(x0)).attr("y", Y(y1)).attr("width", X(x1) - X(x0)).attr("height", Y(y0) - Y(y1));
  ticks.forEach(t => {
    g.append("text").attr("class", "m").attr("x", X(t)).attr("y", Y(y0) + 20).attr("text-anchor", "middle").text(num(t, 1));
    g.append("text").attr("class", "m").attr("x", X(x0) - 8).attr("y", Y(t) + 5).attr("text-anchor", "end").text(num(t, 1));
  });
  g.append("text").attr("x", X(x1)).attr("y", Y(y0) + 40).attr("text-anchor", "end").text("x₁ →");
  g.append("text").attr("x", X(x0) - 8).attr("y", Y(y1) - 10).attr("text-anchor", "start").text("↑ x₂");
  return g;
}
function blockGrid(g, x, y, rows, cols, size, cls, vals) {
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    g.append("rect").attr("x", x + j * size).attr("y", y + i * size).attr("width", size - 3).attr("height", size - 3).attr("rx", 3).attr("class", typeof cls === "function" ? cls(i, j) : cls);
    if (vals) g.append("text").attr("x", x + j * size + (size - 3) / 2).attr("y", y + i * size + size / 2 + 3).attr("text-anchor", "middle").text(vals[i][j]);
  }
}

/* ---------- 장면 3: 편미분 단면 ---------- */
function partialScene(body) {
  body.innerHTML = `<div class="side"><div class="pd-fig"></div>
    <div class="ro col"><span>x₀ = <b id="pd-x0">(1.00, 1.00)</b></span><span>∂f/∂x₁ = <b id="pd-g1">3.00</b></span><span>∂f/∂x₂ = <b id="pd-g2">4.00</b></span><span>편미분을 나란히:</span><span>df/dx = <b id="pd-row">[ 3.00  4.00 ]</b></span></div></div>`;
  const s = svgFig(body.querySelector(".pd-fig"), 920, 470);
  const X = d3.scaleLinear([-0.2, 1.8], [60, 460]), Y = d3.scaleLinear([-0.2, 1.8], [440, 40]);
  const clip = s.clip(60, 40, 400, 400);
  mapFrame(s, X, Y, [0, 0.5, 1, 1.5]);
  const gc = s.append("g").attr("clip-path", clip);
  contourPaths(gc, X, Y, [-0.2, 1.8, -0.2, 1.8], [0.25, 0.5, 1, 2, 3, 5, 8, 12], "ctr");
  const hot = s.append("g").attr("clip-path", clip), lines = s.append("g").attr("clip-path", clip), lab = s.append("g");
  const SX = d3.scaleLinear([-0.2, 1.8], [550, 900]);
  const P1 = d3.scaleLinear([-2, 15], [215, 45]), P2 = d3.scaleLinear([-2, 15], [445, 275]);
  const plots = s.append("g"), dyn = s.append("g");
  [[P1, "x₁", 40], [P2, "x₂", 270]].forEach(([P, v, top]) => {
    plots.append("rect").attr("class", "frame").attr("x", 550).attr("y", P(15)).attr("width", 350).attr("height", P(-2) - P(15));
    plots.append("line").attr("class", "grid").attr("x1", 550).attr("x2", 900).attr("y1", P(0)).attr("y2", P(0));
    [0, 1].forEach(t => plots.append("text").attr("class", "m").attr("x", SX(t)).attr("y", P(-2) + 18).attr("text-anchor", "middle").text(t));
    [0, 10].forEach(t => plots.append("text").attr("class", "m").attr("x", 544).attr("y", P(t) + 5).attr("text-anchor", "end").text(t));
    plots.append("text").attr("class", "m").attr("x", 900).attr("y", P(-2) + 18).attr("text-anchor", "end").text(v + " →");
  });
  const T = d3.range(-0.2, 1.8001, 0.02);
  const drag = LTT.drag(s.node(), { value: [1, 1], toSvg: p => [X(p[0]), Y(p[1])], fromSvg: q => [X.invert(q[0]), Y.invert(q[1])], bounds: [[0.2, 1.6], [0.2, 1.6]], step: 0.05, label: "x₀" });
  LTT.sweep({
    params: { x0: { control: drag, label: "x₀" } },
    render: ({ x0 }) => {
      const [a, b] = x0, f0 = F(a, b), [g1, g2] = G(a, b);
      hot.selectAll("*").remove(); lines.selectAll("*").remove(); lab.selectAll("*").remove(); dyn.selectAll("*").remove();
      contourPaths(hot, X, Y, [-0.2, 1.8, -0.2, 1.8], [f0], "ctr-hot");
      lines.append("line").attr("class", "l-acc").attr("x1", X(-0.2)).attr("x2", X(1.8)).attr("y1", Y(b)).attr("y2", Y(b));
      lines.append("line").attr("class", "l-c2").attr("x1", X(a)).attr("x2", X(a)).attr("y1", Y(-0.2)).attr("y2", Y(1.8));
      lab.append("text").attr("x", X(1.8) - 6).attr("y", Y(b) - 8).attr("text-anchor", "end").attr("class", "acc").text(`x₂ = ${num(b)} 고정`);
      lab.append("text").attr("x", X(a) + 8).attr("y", Y(1.8) + 20).attr("class", "c2t").text(`x₁ = ${num(a)} 고정`);
      lab.append("text").attr("x", 460).attr("y", 30).attr("text-anchor", "end").attr("class", "m").text(`굵은 등고선: f = f(x₀) = ${num(f0)}`);
      [[P1, s1 => F(s1, b), a, g1, "l-acc", `x₂ = ${num(b)} 고정 단면 f(x₁, ${num(b)})`, "acc", "∂f/∂x₁"],
       [P2, s2 => F(a, s2), b, g2, "l-c2", `x₁ = ${num(a)} 고정 단면 f(${num(a)}, x₂)`, "c2t", "∂f/∂x₂"]].forEach(([P, fn, c, sl, cls, title, tc, nm]) => {
        dyn.append("path").attr("class", "curve").attr("clip-path", null).attr("d", d3.line()(T.map(t => [SX(t), P(Math.max(-2, Math.min(15, fn(t))))])));
        const y0 = fn(c);
        dyn.append("line").attr("class", cls).attr("x1", SX(c - 0.35)).attr("x2", SX(c + 0.35)).attr("y1", P(y0 - 0.35 * sl)).attr("y2", P(y0 + 0.35 * sl));
        dyn.append("circle").attr("cx", SX(c)).attr("cy", P(y0)).attr("r", 6).style("fill", "var(--ltt-ink)");
        dyn.append("text").attr("x", 558).attr("y", P(15) + 20).attr("class", tc).text(title);
        dyn.append("text").attr("x", 558).attr("y", P(15) + 42).text(`접선 기울기 = ${nm} = ${num(sl)}`);
      });
      body.querySelector("#pd-x0").textContent = `(${num(a)}, ${num(b)})`;
      body.querySelector("#pd-g1").textContent = num(g1);
      body.querySelector("#pd-g2").textContent = num(g2);
      body.querySelector("#pd-row").textContent = `[ ${num(g1)}  ${num(g2)} ]`;
    }
  });
  return {};
}

/* ---------- 장면 4: 방향 미분 ---------- */
function directionScene(body) {
  body.innerHTML = `<div class="side"><div class="dd-fig"></div>
    <div class="ctl col"><div class="ltt-param">방향 u (바늘 = 지도 위 방향) <span class="val" id="dd-a-v"></span><div id="dd-a"></div></div>
    <div class="ro col"><span class="wide">u = <b id="dd-u">(1.00, 0.00)</b></span><span class="wide">3u₁ + 4u₂ = <b id="dd-d">3.00</b></span></div></div></div>`;
  const s = svgFig(body.querySelector(".dd-fig"), 920, 440);
  const X = d3.scaleLinear([0.2, 1.8], [50, 400]), Y = d3.scaleLinear([0.2, 1.8], [400, 50]);
  const clip = s.clip(50, 50, 350, 350);
  mapFrame(s, X, Y, [0.5, 1, 1.5]);
  contourPaths(s.append("g").attr("clip-path", clip), X, Y, [0.2, 1.8, 0.2, 1.8], [0.5, 1, 3, 5, 8], "ctr");
  contourPaths(s.append("g").attr("clip-path", clip), X, Y, [0.2, 1.8, 0.2, 1.8], [2], "ctr-hot");
  const cx = X(1), cy = Y(1), L = 130;
  const tdir = [0.8, -0.6];
  s.append("line").attr("class", "ghost").attr("x1", cx - tdir[0] * 110).attr("y1", cy + tdir[1] * 110).attr("x2", cx + tdir[0] * 110).attr("y2", cy - tdir[1] * 110);
  s.append("text").attr("class", "m").attr("x", cx - tdir[0] * 110 - 6).attr("y", cy + tdir[1] * 110 - 6).attr("text-anchor", "end").text("등고선 접선");
  const gx = cx + 0.6 * L, gy = cy - 0.8 * L;
  arrow(s, cx, cy, gx, gy, "l-acc", s.mk("acc"));
  s.append("text").attr("class", "acc").attr("x", gx + 8).attr("y", gy - 4).text("(3, 4) 방향 (gradient)");
  const q = 14, a1 = [0.6, -0.8], a2 = [0.8, 0.6];
  s.append("path").attr("class", "edge").attr("d", `M${cx + a1[0] * q},${cy + a1[1] * q} L${cx + (a1[0] + a2[0]) * q},${cy + (a1[1] + a2[1]) * q} L${cx + a2[0] * q},${cy + a2[1] * q}`);
  const uline = s.append("line").attr("class", "l-c2").attr("marker-end", s.mk("c2"));
  const ulab = s.append("text").attr("class", "c2t");
  s.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 6).style("fill", "var(--ltt-ink)");
  s.append("text").attr("x", cx - 12).attr("y", cy + 24).attr("text-anchor", "end").text("x₀ = (1, 1)");
  const AX = d3.scaleLinear([0, 360], [500, 900]), DY = d3.scaleLinear([-5.5, 5.5], [400, 60]);
  s.append("rect").attr("class", "frame").attr("x", 500).attr("y", 60).attr("width", 400).attr("height", 340);
  s.append("line").attr("class", "grid").attr("x1", 500).attr("x2", 900).attr("y1", DY(0)).attr("y2", DY(0));
  [0, 90, 180, 270, 360].forEach(t => s.append("text").attr("class", "m").attr("x", AX(t)).attr("y", 420).attr("text-anchor", "middle").text(t + "°"));
  [-5, 0, 5].forEach(t => s.append("text").attr("class", "m").attr("x", 494).attr("y", DY(t) + 5).attr("text-anchor", "end").text(num(t, 0)));
  s.append("text").attr("x", 500).attr("y", 44).text("방향 미분 3u₁ + 4u₂ (다이얼 각 α: 0° = +x₂, 시계 방향)");
  const aMax = Math.atan2(0.6, 0.8) * 180 / Math.PI;
  s.append("path").attr("class", "curve").attr("d", d3.line()(d3.range(0, 360.1, 2).map(t => { const r = t * Math.PI / 180; return [AX(t), DY(3 * Math.sin(r) + 4 * Math.cos(r))]; })));
  s.append("line").attr("class", "ghost").attr("x1", AX(aMax)).attr("x2", AX(aMax)).attr("y1", DY(5)).attr("y2", DY(-5.5));
  s.append("circle").attr("cx", AX(aMax)).attr("cy", DY(5)).attr("r", 6).style("fill", "var(--ltt-accent)");

  [0, 1, 2, 3].forEach(t => s.append("text").attr("class", "m").attr("x", IX(t)).attr("y", 320).attr("text-anchor", "middle").text(t));
  [0, 1].forEach(t => s.append("text").attr("class", "m").attr("x", 34).attr("y", IY(t) + 5).attr("text-anchor", "end").text(t));

  for (let r = 0.5; r <= 3.5; r += 0.5) og.append("circle").attr("class", "grid").attr("cx", OX(0)).attr("cy", OY(0)).attr("r", OX(r) - OX(0));
  for (let t = 0; t <= 180; t += 15) { const rr = t * Math.PI / 180; og.append("line").attr("class", "grid").attr("x1", OX(0)).attr("y1", OY(0)).attr("x2", OX(5 * Math.cos(rr))).attr("y2", OY(5 * Math.sin(rr))); }
  [-1, 0, 1, 2, 3].forEach(t => s.append("text").attr("class", "m").attr("x", OX(t)).attr("y", 320).attr("text-anchor", "middle").text(t));
  [1, 2, 3].forEach(t => s.append("text").attr("class", "m").attr("x", 414).attr("y", OY(t) + 5).attr("text-anchor", "end").text(t));
  s.append("text").attr("class", "m").attr("x", 772).attr("y", 342).attr("text-anchor", "end").text("격자: r 일정한 원, θ 일정한 직선");
  const IN = s.append("g"), OUT = s.append("g").attr("clip-path", oclip), ZM = s.append("g"), LINK = s.append("g");
  const zx = 800, zy = 44, zw = 200;
  s.append("text").attr("x", zx).attr("y", 24).text("확대");

  s.append("text").attr("class", "m").attr("x", zx + 24).attr("y", zy + zw + 25).text("실제 조각");
  s.append("line").attr("class", "ghost").attr("x1", zx).attr("x2", zx + 18).attr("y1", zy + zw + 44).attr("y2", zy + zw + 44).style("stroke", "var(--ltt-ink)");
  s.append("text").attr("class", "m").attr("x", zx + 24).attr("y", zy + zw + 49).text("J 평행사변형");
  const patch = (r, th, h, k = 16) => {
    const p = [];
    for (let i = 0; i <= k; i++) p.push([r + h * i / k, th]);
    for (let i = 0; i <= k; i++) p.push([r + h, th + h * i / k]);
    for (let i = k; i >= 0; i--) p.push([r + h * i / k, th + h]);
    for (let i = k; i >= 0; i--) p.push([r, th + h * i / k]);
    return p.map(([rr, t]) => [rr * Math.cos(t), rr * Math.sin(t)]);
  };
  LTT.sweep({
    params: {
      jr: { map: v => +v, fmt: v => num(v, 1) },
      jt: { map: v => +v, fmt: v => `${Math.round(v)}°` },
      jh: { map: v => +v, fmt: v => num(v, 2) }
    },
    render: ({ jr: r, jt: td, jh: h }) => {
      const th = td * Math.PI / 180, c = Math.cos(th), sn = Math.sin(th);

      IN.append("text").attr("class", "acc").attr("x", 40).attr("y", 76).text("→ r 방향 한 변 (h·e_r)");
      IN.append("text").attr("class", "c2t").attr("x", 40).attr("y", 98).text("→ θ 방향 한 변 (h·e_θ)");
      const pts = patch(r, th, h), P = p => [OX(p[0]), OY(p[1])];
      const o = [r * c, r * sn], v1 = [J[0][0] * h, J[1][0] * h], v2 = [J[0][1] * h, J[1][1] * h];
      const par = [o, [o[0] + v1[0], o[1] + v1[1]], [o[0] + v1[0] + v2[0], o[1] + v1[1] + v2[1]], [o[0] + v2[0], o[1] + v2[1]]];
      OUT.append("path").attr("class", "cell-acc").attr("d", d3.line()(pts.map(P)) + "Z");
      OUT.append("path").attr("class", "ghost").style("stroke", "var(--ltt-ink)").attr("d", d3.line()(par.map(P)) + "Z");
      const cen = [(r + h / 2) * Math.cos(th + h / 2), (r + h / 2) * Math.sin(th + h / 2)];
      const span = h * Math.max(1, r + h) * 1.25, k = (zw - 30) / span;
      const ZX = x => zx + zw / 2 + (x - cen[0]) * k, ZY = y => zy + zw / 2 - (y - cen[1]) * k;
      const half = span / 2 * (zw / (zw - 30));
      LINK.append("rect").attr("class", "ghost").attr("x", OX(cen[0] - half)).attr("y", OY(cen[1] + half)).attr("width", OX(cen[0] + half) - OX(cen[0] - half)).attr("height", OY(cen[1] - half) - OY(cen[1] + half));
      LINK.append("line").attr("class", "ghost").attr("x1", OX(cen[0] + half)).attr("y1", OY(cen[1] + half)).attr("x2", zx).attr("y2", zy);
      LINK.append("line").attr("class", "ghost").attr("x1", OX(cen[0] + half)).attr("y1", OY(cen[1] - half)).attr("x2", zx).attr("y2", zy + zw);
      ZM.append("path").attr("class", "cell-acc").attr("d", d3.line()(pts.map(p => [ZX(p[0]), ZY(p[1])])) + "Z");
      ZM.append("path").attr("class", "ghost").style("stroke", "var(--ltt-ink)").attr("d", d3.line()(par.map(p => [ZX(p[0]), ZY(p[1])])) + "Z");
      arrow(ZM, ZX(o[0]), ZY(o[1]), ZX(o[0] + v1[0]), ZY(o[1] + v1[1]), "l-acc", s.mk("acc"));
      arrow(ZM, ZX(o[0]), ZY(o[1]), ZX(o[0] + v2[0]), ZY(o[1] + v2[1]), "l-c2", s.mk("c2"));
      ZM.append("circle").attr("cx", ZX(o[0])).attr("cy", ZY(o[1])).attr("r", 4).style("fill", "var(--ltt-ink)");
      LINK.append("text").attr("class", "acc").attr("x", zx).attr("y", zy + zw + 76).text("J 1열 = h·(cos θ, sin θ)");
      LINK.append("text").attr("class", "c2t").attr("x", zx).attr("y", zy + zw + 98).text("J 2열 = h·(−r sin θ, r cos θ)");
      const exact = d3.polygonArea(pts) / (h * h);
      body.querySelector("#jc-mat").textContent = `[ ${num(J[0][0])}  ${num(J[0][1])} ; ${num(J[1][0])}  ${num(J[1][1])} ]`;
      body.querySelector("#jc-det").textContent = num(det);
      body.querySelector("#jc-ratio").textContent = `${num(Math.abs(exact), 3)} (= r + h/2)`;
      body.querySelector("#jc-appr").textContent = `${num(Math.abs(det), 3)} (= det J)`;
    }
  });
  return {};
}

  s.append("text").attr("x", lx).attr("y", 220).attr("class", "acc big").text("뒤로: adjoint ∂f/∂·");
  const fwd = [["a", "a = x² = " + val.a], ["b", "b = eᵃ = " + val.b], ["c", "c = a + b = " + val.c], ["d", "d = √c = " + val.d], ["e", "e = cos c = " + val.e], ["f", "f = d + e = " + val.f]];
  const bwd = [["f", "∂f/∂f = 1"], ["d", "∂f/∂d = 1,  ∂f/∂e = 1"], ["c", "∂f/∂c = 1/(2√c) − sin c = " + adj.c], ["b", "∂f/∂b = ∂f/∂c · 1 = " + adj.b], ["a", "∂f/∂a = ∂f/∂c·1 + ∂f/∂b·eᵃ = " + adj.a], ["x", "∂f/∂x = ∂f/∂a · 2x = " + adj.x]];
  const fl = fwd.map(([k, t], i) => ({ k, el: s.append("text").attr("x", lx).attr("y", 58 + i * 25).text(t) }));
  const bl = bwd.map(([k, t], i) => ({ k, el: s.append("text").attr("x", lx).attr("y", 248 + i * 25).text(t) }));

  };

  return {};
}

}

  LTT.expect("극좌표 실제 넓이비 r=2,h=0.2", area / (h * h), 2.1, { tol: 1e-3 });
  LTT.expect("det J at r=2", Math.cos(th) * r * Math.cos(th) + r * Math.sin(th) * Math.sin(th), 2, { tol: 1e-12 });
  const A = [[1, 0, 1], [0, 1, 1]], xv = [1, 2, -1], y = [-0.5, 2];
  const hv = A.map(row => row.reduce((s, v, j) => s + v * xv[j], 0)), dl = hv.map((v, i) => v - y[i]);
  LTT.expect("δ₁", dl[0], 0.5, { tol: 1e-12 }); LTT.expect("δ₂", dl[1], -1, { tol: 1e-12 });
  const dLdx = [0, 1, 2].map(j => dl[0] * A[0][j] + dl[1] * A[1][j]);
  LTT.expect("dL/dx₃", dLdx[2], -0.5, { tol: 1e-12 });
  const Lf = M => { const hh = M.map(row => row.reduce((s, v, j) => s + v * xv[j], 0)); return 0.5 * ((hh[0] - y[0]) ** 2 + (hh[1] - y[1]) ** 2); };
  LTT.expect("L", Lf(A), 0.625, { tol: 1e-12 });
  const e = 1e-6, Ap = [[1 + e, 0, 1], [0, 1, 1]], Am = [[1 - e, 0, 1], [0, 1, 1]];
  LTT.expect("dL/dA₁₁ (차분)", (Lf(Ap) - Lf(Am)) / (2 * e), 0.5, { tol: 1e-6 });
  const A23p = [[1, 0, 1], [0, 1, 1 + e]], A23m = [[1, 0, 1], [0, 1, 1 - e]];
  LTT.expect("dL/dA₂₃ (차분)", (Lf(A23p) - Lf(A23m)) / (2 * e), 1, { tol: 1e-6 });
  const fx = x => Math.sqrt(x * x + Math.exp(x * x)) + Math.cos(x * x + Math.exp(x * x));
  LTT.expect("f(1) 예 5.14", fx(1), 1.09001, { tol: 1e-4 });
  LTT.expect("df/dx(1) 차분", (fx(1 + e) - fx(1 - e)) / (2 * e), 5.98308, { tol: 1e-4 });
}
