<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행렬은 공간을 어떻게 바꾸는가</title>
<script type="application/json" id="ltt-meta">
{
  "topic": "행렬은 공간을 어떻게 바꾸는가: 열 = 기저의 상, 행렬식, 합성, 고유벡터",
  "audience": "행렬 곱 계산은 할 줄 아는 공대 1학년",
  "theme": "chalk",
  "medium": "deck",
  "decision": "없음(선형대수 수업을 따라가기 위한 기본기)",
  "glossary": {
    "행렬식": "2×2 행렬 [[a,b],[c,d]]의 수 ad − bc. 변환이 넓이를 몇 배로 바꾸는지(크기)와 방향을 뒤집는지(부호)를 알려 준다.",
    "고유벡터": "변환한 뒤에도 원래와 같은 직선(원점을 지나는) 위에 남는, 0이 아닌 벡터. Av = λv.",
    "고유값": "고유벡터가 늘어나거나 줄어든 배율 λ. 음수면 반대 방향으로 뒤집힌다.",
    "전단": "한 방향으로 미는 변환(shear). 가로 전단 [[1,1],[0,1]]은 높이 y인 점을 오른쪽으로 y만큼 민다.",
    "합성": "변환 하나를 적용한 결과에 다른 변환을 이어서 적용하는 것.",
    "평행사변형": "마주 보는 변끼리 평행한 사각형. 넓이 = 밑변 × 높이."
  }
}
</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .pl { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
  .pl text { font-family: var(--ltt-font-mono, ui-monospace, monospace); paint-order: stroke; stroke: var(--ltt-bg); stroke-width: 4px; stroke-linejoin: round; }
  .duo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
  .duo .cap { text-align: center; color: var(--ltt-muted); font-size: 15px; margin-top: 4px; }
  .duo .mid { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 16px; }
  .mx { display: inline-flex; gap: 0.7em; padding: 0.15em 0.45em; border-left: 2px solid var(--ltt-ink-2); border-right: 2px solid var(--ltt-ink-2); border-radius: 5px; font-family: var(--ltt-font-mono, ui-monospace, monospace); font-size: 20px; vertical-align: middle; }
  .mx .col { display: flex; flex-direction: column; align-items: center; padding: 0 0.15em; border-radius: 4px; }
  .mx .col i { font-style: normal; min-width: 1.6em; text-align: center; }
  .k1 { color: var(--ltt-c1); } .k2 { color: var(--ltt-c2); } .k3 { color: var(--ltt-c3); }
  .bg1 { background: color-mix(in srgb, var(--ltt-c1) 22%, transparent); }
  .bg2 { background: color-mix(in srgb, var(--ltt-c2) 22%, transparent); }
  .readout { font-family: var(--ltt-font-mono, ui-monospace, monospace); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 22ch; text-align: left; line-height: 1.7; }
  .readout b { display: inline-block; min-width: 2.2ch; text-align: right; }
  .fig-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 24px; align-items: center; }
  .side { display: flex; flex-direction: column; gap: 12px; font-size: 16px; }
  .side .note { color: var(--ltt-muted); font-size: 15px; }
  .replay { align-self: flex-start; }
  .tree text { font-size: 15px; }
  :has(> svg.hookart) { width: min(440px, 34vw) !important; height: auto !important; max-width: none !important; aspect-ratio: 1; flex: none !important; }
</style>
</head>
<body>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const mul = (M, [x, y]) => [M[0][0] * x + M[0][1] * y, M[1][0] * x + M[1][1] * y];
  const mm = (P, Q) => [
    [P[0][0] * Q[0][0] + P[0][1] * Q[1][0], P[0][0] * Q[0][1] + P[0][1] * Q[1][1]],
    [P[1][0] * Q[0][0] + P[1][1] * Q[1][0], P[1][0] * Q[0][1] + P[1][1] * Q[1][1]],
  ];
  const det = (M) => M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const lerpM = (P, Q, s) => P.map((r, i) => r.map((v, j) => v + (Q[i][j] - v) * s));
  const ease = (s) => (s < 0 ? 0 : s > 1 ? 1 : s * s * (3 - 2 * s));
  const fmt = (n) => {
    const r = Math.round(n * 10) / 10;
    const s = Number.isInteger(r) ? String(r) : r.toFixed(1);
    return (r < 0 ? "−" + s.slice(1) : s);
  };
  const pt = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;

  const I = [[1, 0], [0, 1]];
  const A = [[3, 1], [0, 2]];
  const R = [[0, -1], [1, 0]];
  const S = [[1, 1], [0, 1]];
  const C1 = "var(--ltt-c1)", C2 = "var(--ltt-c2)", C3 = "var(--ltt-c3)";
  const MUTED = "var(--ltt-muted)", GRID0 = "var(--ltt-line)", GRID1 = "var(--ltt-line-2)", INK = "var(--ltt-ink)";

  const expectV = (label, got, want) => got.forEach((g, i) => LTT.expect(`${label}[${i}]`, g, want[i]));
  const expectM = (label, got, want) => got.forEach((r, i) => expectV(`${label}[${i}]`, r, want[i]));
  expectV("A e1", mul(A, [1, 0]), [3, 0]);
  expectV("A e2", mul(A, [0, 1]), [1, 2]);
  expectV("A (1,1)", mul(A, [1, 1]), [4, 2]);
  LTT.expect("det A", det(A), 6);
  expectM("SR", mm(S, R), [[1, -1], [1, 0]]);
  expectM("RS", mm(R, S), [[0, -1], [1, 1]]);
  LTT.expect("det SR", det(mm(S, R)), 1);
  expectV("A (1,-1)", mul(A, [1, -1]), [2, -2]);
  const shoelace = (ps) => Math.abs(ps.reduce((s, p, i) => { const q = ps[(i + 1) % ps.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
  LTT.expect("평행사변형 넓이", shoelace([[0, 0], mul(A, [1, 0]), mul(A, [1, 1]), mul(A, [0, 1])]), 6);

  function Plane(host, { range = 5, size = 400, cls = "" } = {}) {
    const svg = mk("svg", { viewBox: `0 0 ${size} ${size}`, class: "pl " + cls, role: "img" });
    const u = size / (2 * range);
    const toSvg = ([x, y]) => [size / 2 + x * u, size / 2 - y * u];
    const fromSvg = ([sx, sy]) => [(sx - size / 2) / u, (size / 2 - sy) / u];
    const L = {};
    for (const n of ["back", "grid", "shape", "arrow", "label"]) L[n] = mk("g", {}, svg);
    if (host) host.appendChild(svg);
    const P = {
      svg, u, range, toSvg, fromSvg, L,
      clear(...names) { for (const n of names) L[n].replaceChildren(); },
      grid(M, { layer = "grid", color = GRID1, w = 1.2, axis = INK, axisW = 1.6 } = {}) {
        const K = Math.ceil(range * 2.5);
        for (let k = -K; k <= K; k++) {
          for (const [a, b] of [[[k, -K], [k, K]], [[-K, k], [K, k]]]) {
            const p = toSvg(mul(M, a)), q = toSvg(mul(M, b));
            mk("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: k === 0 ? axis : color, "stroke-width": k === 0 ? axisW : w }, L[layer]);
          }
        }
      },
      line(a, b, { color = MUTED, w = 1.5, dash = "", layer = "shape" } = {}) {
        const p = toSvg(a), q = toSvg(b);
        return mk("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: color, "stroke-width": w, "stroke-dasharray": dash }, L[layer]);
      },
      arrow(a, b, { color = INK, w = 3.5, dash = "", layer = "arrow", label, lx = 8, ly = -8, anchor = "start", opacity = 1 } = {}) {
        const p = toSvg(a), q = toSvg(b);
        const g = mk("g", { opacity }, L[layer]);
        const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
        if (len > 0.5) {
          const h = Math.min(13, len * 0.5), ang = Math.atan2(dy, dx);
          const bx = q[0] - h * 0.8 * Math.cos(ang), by = q[1] - h * 0.8 * Math.sin(ang);
          mk("line", { x1: p[0], y1: p[1], x2: bx, y2: by, stroke: color, "stroke-width": w, "stroke-dasharray": dash, "stroke-linecap": "round" }, g);
          mk("polygon", { points: `${q[0]},${q[1]} ${q[0] - h * Math.cos(ang - 0.42)},${q[1] - h * Math.sin(ang - 0.42)} ${q[0] - h * Math.cos(ang + 0.42)},${q[1] - h * Math.sin(ang + 0.42)}`, fill: color }, g);
        }
        if (label) mk("text", { x: q[0] + lx, y: q[1] + ly, fill: color, "font-size": 16, "font-weight": 700, "text-anchor": anchor }, g).textContent = label;
        return g;
      },
      poly(pts, { fill = "none", stroke = "none", w = 2, dash = "", layer = "shape", opacity = 1 } = {}) {
        return mk("polygon", { points: pts.map(toSvg).map((p) => p.join(",")).join(" "), fill, stroke, "stroke-width": w, "stroke-dasharray": dash, opacity }, L[layer]);
      },
      text(p, s, { color = INK, size: fs = 15, anchor = "start", dx = 0, dy = 0, weight = 500, layer = "label" } = {}) {
        const q = toSvg(p);
        const t = mk("text", { x: q[0] + dx, y: q[1] + dy, fill: color, "font-size": fs, "text-anchor": anchor, "font-weight": weight }, L[layer]);
        t.textContent = s;
        return t;
      },
      dot(p, { r = 5, color = INK, layer = "arrow" } = {}) {
        const q = toSvg(p);
        return mk("circle", { cx: q[0], cy: q[1], r, fill: color }, L[layer]);
      },
    };
    return P;
  }

  const matHTML = (M, { c1 = "k1 bg1", c2 = "k2 bg2" } = {}) =>
    `<span class="mx"><span class="col ${c1}"><i>${fmt(M[0][0])}</i><i>${fmt(M[1][0])}</i></span><span class="col ${c2}"><i>${fmt(M[0][1])}</i><i>${fmt(M[1][1])}</i></span></span>`;
  const div = (cls, html = "") => { const d = document.createElement("div"); if (cls) d.className = cls; d.innerHTML = html; return d; };

  /* ---------- hook art ---------- */
  function hookArt() {
    const p1 = Plane(null, { range: 4, size: 300 });
    p1.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    p1.grid(A, { color: GRID1, w: 1.5 });
    p1.poly([[0, 0], [1, 0], [1, 1], [0, 1]], { stroke: C3, dash: "4 4", w: 2 });
    p1.poly([[0, 0], mul(A, [1, 0]), mul(A, [1, 1]), mul(A, [0, 1])], { fill: "color-mix(in srgb, var(--ltt-c3) 35%, transparent)", stroke: C3 });
    p1.arrow([0, 0], mul(A, [1, 0]), { color: C1, w: 4 });
    p1.arrow([0, 0], mul(A, [0, 1]), { color: C2, w: 4 });
    p1.dot([0, 0], { r: 5, color: INK, layer: "label" });
    p1.svg.setAttribute("class", "pl hookart");
    p1.svg.setAttribute("style", "width:100%;height:auto;display:block");
    return p1.svg.outerHTML;
  }

  function mini(kind) {
    const p = Plane(null, { range: 3, size: 180 });
    p.grid(I, { layer: "back", color: GRID0, axis: GRID1, axisW: 1.2 });
    if (kind === "vec") p.arrow([0, 0], [2, 1], { color: C3, w: 4 });
    if (kind === "basis") { p.arrow([0, 0], [1, 0], { color: C1, w: 4 }); p.arrow([0, 0], [0, 1], { color: C2, w: 4 }); }
    if (kind === "lin") { p.grid(S, { color: GRID1, w: 1.5 }); p.dot([0, 0], { r: 5, color: INK }); }
    if (kind === "img") {
      p.arrow([0, 0], [1, 0], { color: C1, w: 3, opacity: 0.45 });
      p.line([1.1, 0.35], [2.6, 0.35], { color: MUTED, w: 1.5, dash: "3 3" });
      p.arrow([0, 0], [3, 0], { color: C1, w: 4 });
    }
    p.svg.setAttribute("style", "width:100%;max-width:150px;height:auto;display:block;margin:0 auto");
    return p.svg.outerHTML;
  }

  function overviewFigure(el) {
    const row = div("fig-row");
    const box = div("");
    const P = Plane(box, { range: 4.5, size: 440 });
    P.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    P.grid(A);
    P.line([-9, 0], [9, 0], { color: C1, dash: "6 5", w: 2, layer: "back" });
    P.line([-9, 9], [9, -9], { color: "var(--ltt-c4)", dash: "6 5", w: 2, layer: "back" });
    P.poly([[0, 0], [3, 0], [4, 2], [1, 2]], { fill: "color-mix(in srgb, var(--ltt-c1) 22%, transparent)", stroke: C1 });
    P.arrow([0, 0], [3, 0], { color: C1, w: 4 });
    P.arrow([0, 0], [1, 2], { color: C2, w: 4 });
    P.arrow([0, 0], [2, -2], { color: "var(--ltt-c4)", w: 4 });
    P.dot([0, 0], { r: 5, color: INK, layer: "label" });
    const badge = (p, n) => {
      const q = P.toSvg(p);
      const g = mk("g", {}, P.L.label);
      mk("circle", { cx: q[0], cy: q[1], r: 14, fill: "var(--ltt-accent)" }, g);
      mk("text", { x: q[0], y: q[1] + 5, "text-anchor": "middle", fill: "var(--ltt-bg)", "font-size": 15, "font-weight": 800, style: "stroke:none" }, g).textContent = n;
    };
    badge([-3.4, -3.2], 2);
    badge([3.4, 0.6], 3);
    badge([1.4, 2.6], 3);
    badge([2.3, 1.05], 4);
    badge([2.8, -2.6], 7);
    const side = div("side");
    side.append(div("", `A = ${matHTML(A)}`), div("note", "① 좌표 = e1·e2 레시피<br>② 원점 고정, 격자 평행·등간격<br>③ 열 = e1·e2의 상 (3, 0), (1, 2)<br>④ 넓이 배율 det A = 6<br>⑤ det 부호 = 방향(여기선 +)<br>⑥ 이어 하기 = 곱, 오른쪽부터<br>⑦ 고유벡터 (1, 0)×3, (1, −1)×2"));
    row.append(box, side);
    el.appendChild(row);
  }

  /* ---------- scene 3: vector recipe ---------- */
  function recipeFigure(el) {
    const row = div("fig-row");
    const box = div("");
    const P = Plane(box, { range: 4, size: 400 });
    P.grid(I);
    P.dot([0, 0], { r: 4, color: INK, layer: "label" });
    const side = div("side");
    const out = div("readout");
    side.append(out, div("note", "노란 손잡이(v의 끝)를 끌어 보자. e1 화살표 x개, e2 화살표 y개를 이으면 언제나 v의 끝에 닿는다."));
    row.append(box, side);
    el.appendChild(row);
    const drag = LTT.drag(P.svg, { value: [2, 1], toSvg: P.toSvg, fromSvg: P.fromSvg, bounds: [[-3, 3], [-3, 3]], step: 1, color: C3, label: "v" });
    LTT.sweep({
      params: { v: { control: drag, label: "v" } },
      render(vals) {
        const [x, y] = vals.v;
        P.clear("arrow", "shape");
        const sx = Math.sign(x), sy = Math.sign(y);
        for (let i = 0; i < Math.abs(x); i++) P.arrow([i * sx, 0], [(i + 1) * sx, 0], { color: C1, w: 3 });
        for (let j = 0; j < Math.abs(y); j++) P.arrow([x, j * sy], [x, (j + 1) * sy], { color: C2, w: 3 });
        if (x !== 0 || y !== 0) P.arrow([0, 0], [x, y], { color: C3, w: 4, label: "v", lx: 10, ly: y >= 0 ? -10 : 24 });
        out.innerHTML = `v = <b class="k3">${pt([x, y])}</b><br>  = <b class="k1">${fmt(x)}</b>·<span class="k1">e1</span> + <b class="k2">${fmt(y)}</b>·<span class="k2">e2</span>`;
      },
    });
  }

  /* ---------- scene 4: grid animation ---------- */
  function gridFigure(el) {
    const row = div("fig-row");
    const box = div("");
    const P = Plane(box, { range: 5, size: 420 });
    P.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    const side = div("side");
    const out = div("readout");
    const btn = document.createElement("button");
    btn.className = "ltt-btn replay";
    btn.textContent = "다시 재생";
    side.append(div("", `A = ${matHTML(A)}`), out, div("note", "흐린 격자는 변환 전 자리다. 원점(흰 점)은 움직이지 않는다."), btn);
    row.append(box, side);
    el.appendChild(row);
    const clock = LTT.clock(P.svg, (t) => {
      const s = ease(t / 3000);
      const M = lerpM(I, A, s);
      P.clear("grid", "arrow", "label", "shape");
      P.grid(M);
      P.poly([[0, 0], mul(M, [1, 0]), mul(M, [1, 1]), mul(M, [0, 1])], { fill: "color-mix(in srgb, var(--ltt-c3) 25%, transparent)" });
      const a = mul(M, [1, 0]), b = mul(M, [0, 1]);
      P.arrow([0, 0], a, { color: C1, label: "e1 → " + pt(a), ly: 24, anchor: "start", lx: -20 });
      P.arrow([0, 0], b, { color: C2, label: "e2 → " + pt(b), lx: -10, ly: -10, anchor: "end" });
      P.dot([0, 0], { r: 5, color: INK, layer: "label" });
      out.innerHTML = `<span class="k1">e1</span>의 상 <b class="k1">${pt(a)}</b><br><span class="k2">e2</span>의 상 <b class="k2">${pt(b)}</b>`;
    }, { dur: 3000, id: "grid" });
    btn.addEventListener("click", () => { clock.seek(0); clock.play(); LTT.record("replay", { figure: "grid" }); });
  }

  /* ---------- predict 1 ---------- */
  function predict1Visual(el) {
    const P = Plane(el, { range: 5, size: 360 });
    P.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    P.grid(A);
    P.arrow([0, 0], [3, 0], { color: C1, label: "e1 → (3, 0)", ly: 24, lx: -30 });
    P.arrow([0, 0], [1, 2], { color: C2, label: "e2 → (1, 2)", lx: -10, anchor: "end" });
  }
  function predict1Answer(el) {
    const P = Plane(el, { range: 5, size: 300 });
    P.grid(A);
    P.arrow([0, 0], [3, 0], { color: C1, label: "1·(3, 0)", ly: 24, lx: -40 });
    P.arrow([3, 0], [4, 2], { color: C2, label: "1·(1, 2)", lx: 8, ly: 10 });
    P.arrow([0, 0], [4, 2], { color: C3, w: 4, label: "(4, 2)", lx: -20, ly: -14 });
  }

  /* ---------- scene 6: columns ---------- */
  function columnFigure(el) {
    const wrap = div("duo");
    const left = div(""), right = div("");
    const P0 = Plane(left, { range: 4.5, size: 360 });
    P0.grid(I);
    P0.arrow([0, 0], [1, 0], { color: C1, label: "e1", ly: 24, lx: -6, layer: "shape" });
    P0.arrow([0, 0], [0, 1], { color: C2, label: "e2", lx: -10, anchor: "end", layer: "shape" });
    left.appendChild(div("cap", "원래 평면: 노란 손잡이로 v를 고른다"));
    const P1 = Plane(right, { range: 4.5, size: 360 });
    P1.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    P1.grid(A);
    P1.arrow([0, 0], [3, 0], { color: C1, label: "Ae1", ly: 24, lx: -20, layer: "shape", opacity: 0.55 });
    P1.arrow([0, 0], [1, 2], { color: C2, label: "Ae2", lx: -10, anchor: "end", layer: "shape", opacity: 0.55 });
    right.appendChild(div("cap", "A를 적용한 평면: 같은 레시피를 새 화살표로"));
    const mid = div("mid");
    const eq = div("readout");
    mid.append(div("", `A = ${matHTML(A)}`), div("note", `<span class="k1">첫째 열 = e1의 상</span><br><span class="k2">둘째 열 = e2의 상</span>`), eq);
    wrap.append(left, mid, right);
    el.appendChild(wrap);

  /* ---------- scene 9: det sweep ---------- */
  function detSweep(el) {
    const row = div("fig-row");
    const box = div("");
    const P = Plane(box, { range: 4, size: 420 });
    P.grid(I, { layer: "back", color: GRID0, axis: GRID0, axisW: 1 });
    const side = div("side");
    const out = div("readout");
    const goalEl = div("");
    side.append(out, div("note", "e2 화살표 끝의 손잡이로 e2의 상 (p, q)를 끈다. e1의 상은 (3, 0)에 고정. 깃발 모양을 보면 방향이 뒤집혔는지 알 수 있다."), goalEl);
    row.append(box, side);
    el.appendChild(row);
    const flag = [[0.15, 0.1], [0.3, 0.1], [0.3, 0.55], [0.85, 0.72], [0.3, 0.9], [0.15, 0.9]];
    let lastSign = 1;
    const drag = LTT.drag(P.svg, { value: [1, 2], toSvg: P.toSvg, fromSvg: P.fromSvg, bounds: [[-3, 3], [-3, 3]], step: 0.5, color: C2, label: "e2의 상" });
    LTT.sweep({
      params: { e2: { control: drag, label: "e2의 상" } },
      goal: { el: goalEl, text: "e2의 상을 옮겨 행렬식을 −6으로 만들어 보자", target: "목표 −6", check: (v) => 3 * v.e2[1] === -6 },
      render(vals) {
        const [p, q] = vals.e2;
        const M = [[3, p], [0, q]];
        const d = det(M);
        P.clear("grid", "shape", "arrow", "label");
        P.grid(M);
        const tone = d > 0 ? C1 : d < 0 ? "var(--ltt-bad)" : MUTED;
        P.poly([[0, 0], [3, 0], [3 + p, q], [p, q]], { fill: `color-mix(in srgb, ${tone} 28%, transparent)`, stroke: tone });
        P.poly(flag.map((f) => mul(M, f)), { fill: INK, opacity: 0.85 });
        P.arrow([0, 0], [3, 0], { color: C1, label: "(3, 0)", ly: q >= 0 ? 24 : -12, lx: -10 });
        P.arrow([0, 0], [p, q], { color: C2, label: pt([p, q]), lx: -14, ly: q >= 0 ? -12 : 26, anchor: "end" });
        out.innerHTML = `det = <span class="k1">3</span>·<span class="k2">q</span> − <span class="k2">p</span>·<span class="k1">0</span><br>    = <span class="k1">3</span>·<b class="k2">${fmt(q)}</b> − <b class="k2">${fmt(p)}</b>·<span class="k1">0</span><br>    = <b>${fmt(d)}</b><br>${d > 0 ? "넓이 ×" + fmt(d) + ", 방향 그대로" : d < 0 ? "넓이 ×" + fmt(-d) + ", 방향 뒤집힘" : "넓이 0, 평면이 선으로 눌림"}`;
        const sign = Math.sign(d);
        if (sign !== lastSign) { LTT.record("det-sign", { det: d, p, q }); lastSign = sign; }
      },
    });
  }

    const eigK = { 0: C1, 8: C1, 6: "var(--ltt-c4)", 14: "var(--ltt-c4)" };
    const clock = LTT.clock(P.svg, (t) => {
      const s = ease(t / 3000);
      const M = lerpM(I, A, s);
      P.clear("shape", "arrow", "label");
      const ring = [];
      for (let i = 0; i <= 64; i++) { const a = (i / 64) * 2 * Math.PI; ring.push(mul(M, [Math.cos(a), Math.sin(a)])); }
      P.poly(ring, { stroke: GRID1, w: 1.5 });
      for (let k = 0; k < 16; k++) {
        if (eigK[k]) continue;
        const a = (k * Math.PI) / 8;
        P.arrow([0, 0], mul(M, [Math.cos(a), Math.sin(a)]), { color: MUTED, w: 2, opacity: 0.8 });
      }
      for (const k of [0, 8, 6, 14]) {
        const a = (k * Math.PI) / 8;
        const o = mul(M, [Math.cos(a), Math.sin(a)]);
        const lab = k === 0 ? `×${fmt(1 + 2 * s)}` : k === 14 ? `×${fmt(1 + s)}` : "";
        P.arrow([0, 0], o, { color: eigK[k], w: 4, label: lab, lx: k === 0 ? 18 : 12, ly: k === 0 ? -6 : -8 });
      }
      out.innerHTML = `<span class="k1">(1, 0) 방향</span>: 길이 <b>${fmt(1 + 2 * s)}</b>배<br><span style="color:var(--ltt-c4)">(1, −1) 방향</span>: 길이 <b>${fmt(1 + s)}</b>배`;
    }, { dur: 3000, id: "eigen" });
    btn.addEventListener("click", () => { clock.seek(0); clock.play(); LTT.record("replay", { figure: "eigen" }); });
  }
