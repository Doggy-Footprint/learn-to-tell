<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn to Tell kit 카탈로그</title>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/topojson-client.min.js"></script>
<script src="/kit/vendor/plot.umd.min.js"></script>
<script src="/kit/vendor/d3-sankey.min.js"></script>
<script src="/kit/vendor/prism/prism.min.js"></script>
<script src="/kit/vendor/elk.bundled.js"></script>
<script src="/kit/vendor/rough.js"></script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<style>
  main { max-width: 1240px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .top a { font-weight: 700; text-decoration: none; }
  .themes { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .themes button { padding: 6px 12px; font-size: 13px; }
  nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 36px; }
  nav.toc a { text-decoration: none; }
  h2.grp { font-size: 15px; font-weight: 800; color: var(--ltt-accent); margin: 48px 0 14px; letter-spacing: .02em; }
  h3.part { font: 600 13px var(--ltt-mono); color: var(--ltt-muted); margin: 32px 0 12px; }
  .demo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; background: var(--ltt-card); border: 1px solid var(--ltt-line); border-radius: 24px; overflow: hidden; margin: 0 0 18px; box-shadow: var(--ltt-shadow); }
  .demo .info { grid-column: 1 / -1; padding: 20px 24px 0; }
  .demo .info h3 { margin: 0; font-size: 20px; font-weight: 850; letter-spacing: -.02em; }
  .demo .info h3 code { font-size: 15px; color: var(--ltt-accent); margin-left: 8px; font-weight: 600; }
  .demo .info p { margin: 6px 0 0; color: var(--ltt-muted); font-size: 15px; }
  .demo .info p b { color: var(--ltt-ink-2); }
  .demo .live { padding: 22px 24px 24px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .demo pre { margin: 0; padding: 18px 20px; background: var(--ltt-card-2); border-left: 1px solid var(--ltt-line); font: 12.5px/1.6 var(--ltt-mono); color: var(--ltt-ink-2); overflow: auto; max-height: 460px; white-space: pre; }
  .tok { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .tok div { font: 12px var(--ltt-mono); color: var(--ltt-muted); }
  .tok i { display: block; height: 44px; border-radius: 12px; margin-bottom: 6px; box-shadow: inset 0 0 0 1px var(--ltt-line); }
  .ics { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .ics div { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 11px var(--ltt-mono); color: var(--ltt-muted); padding: 10px 4px; border-radius: 12px; background: var(--ltt-card-2); }
  .ics .ltt-ic { font-size: 26px; color: var(--ltt-ink); }
  iframe.deck { width: 100%; height: 640px; border: 0; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--ltt-line); background: var(--ltt-bg); }
  @media (max-width: 900px) { .demo { grid-template-columns: 1fr; } .demo pre { border-left: 0; border-top: 1px solid var(--ltt-line); } }
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">← 시나리오 모음</a><span class="themes" id="themes"></span></div>
  <h1>kit 카탈로그</h1>
  <p class="ltt-lead">수업은 이 부품들을 조합해 빈 파일에서 짠다. 각 칸의 왼쪽은 실제로 동작하는 부품, 오른쪽은 그 부품을 만든 코드 그대로다. 함수 시그니처와 언제 쓰는지는 <code>kit/API.md</code>(핵심)와 <code>kit/api/</code>(부품별)에 있다.</p>
  <nav class="toc" id="toc"></nav>
  <div id="root"></div>
</main>
<script>
  const root = document.getElementById("root"), toc = document.getElementById("toc");
  const svgEl = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const div = (cls, html) => Object.assign(document.createElement("div"), { className: cls || "", innerHTML: html || "" });
  // The code panel shows each builder's own source, so what you read is exactly what renders on the left.
  function src(fn) {
    const s = fn.toString(), body = s.slice(s.indexOf("{") + 1, s.lastIndexOf("}"));
    const lines = body.replace(/^\n/, "").replace(/\s+$/, "").split("\n");
    const pad = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
    return lines.map((l) => l.slice(pad)).join("\n");
  }
  // Animations replay each time their demo scrolls into view; run at build time they would finish before anyone reaches them.
  const seen = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target._play(); }), { threshold: 0.35 });
  function whenSeen(el, play) { const d = el.closest(".demo"); d._play = play; seen.observe(d); }
  function group(title, id) {
    const h = Object.assign(document.createElement("h2"), { className: "grp", textContent: title });
    if (id) h.id = id;
    root.appendChild(h);
  }
  function part(id, doc) { root.appendChild(Object.assign(document.createElement("h3"), { className: "part", textContent: doc, id })); }
  function demo(name, sig, when, build) {
    const d = div("demo");
    d.id = name;
    d.innerHTML = `<div class="info"><h3>${name}<code>${sig}</code></h3><p>${when}</p></div><div class="live"></div><pre></pre>`;
    d.querySelector("pre").textContent = src(build);
    root.appendChild(d);
    const live = d.querySelector(".live"), ret = build(live);
    if (ret instanceof Node) live.appendChild(ret);
    toc.appendChild(LTT.chips([{ text: `<a href="#${name}">${name}</a>` }]).firstChild);
  }

  group("기초 · ltt.js", "api-base");
  const themeBox = document.getElementById("themes");
  LTT.themes.forEach((t) => {
    const b = Object.assign(document.createElement("button"), { className: "ghost", textContent: t.name, title: t.medium });
    b.onclick = () => {
      LTT.theme(t.name);
      themeBox.querySelectorAll("button").forEach((x) => x.classList.toggle("accent", x === b));
      const f = document.querySelector("iframe.deck");
      if (f) f.src = "scenes.html?theme=" + t.name;
    };
    themeBox.appendChild(b);
  });
  demo("tokens", "--ltt-*", "<b>색은 이 토큰만 쓴다.</b> 페이지 CSS에 hex를 새로 적지 않는다. 다크 모드와 테마(<code>LTT.theme(name)</code>, 덱에서는 <code>theme</code>)는 토큰이 알아서 바뀐다. 위쪽 버튼으로 테마를 바꿔 본다.", (el) => {
    const names = ["bg", "card", "card-2", "line", "line-2", "ink", "ink-2", "muted", "accent", "accent-soft", "good", "good-soft", "bad", "bad-soft", "warn", "warn-soft", "dark"];
    el.innerHTML = `<div class="tok">${names.map((n) => `<div><i style="background:var(--ltt-${n})"></i>--ltt-${n}</div>`).join("")}</div>`;
  });
  demo("icon", "LTT.icon(name, {weight, cls})", "<b>이모지 대신 쓰는 선 아이콘.</b> 문자열(SVG)을 돌려준다. globe부터 workflow까지 16개는 Lucide에서 가져왔다. hook의 art, explain·terms의 icon, diagram 노드의 icon에 이름만 넘기면 된다.", (el) => {
    el.innerHTML = `<div class="ics">${LTT.icons.map((n) => `<div>${LTT.icon(n)}${n}</div>`).join("")}</div>`;
  });
  demo("palette", "LTT.palette() · --ltt-c1…c6", "<b>여러 계열을 구분하는 범주형 색 6개.</b> 테마·다크 모드마다 배경 대비 3:1 이상이고, 적록·청황 색각 이상에서도 서로 구분되게 맞췄다. 차트에는 <code>LTT.palette()</code>(현재 테마 값 배열)나 <code>var(--ltt-c1)</code>을 쓴다. 판정(good·bad)에는 쓰지 않는다.", (el) => {
    const draw = () => {
      el.innerHTML = `<div class="tok">${LTT.palette().map((c, i) => `<div><i style="background:var(--ltt-c${i + 1})"></i>--ltt-c${i + 1} ${c}</div>`).join("")}</div>`;
    };
    draw();
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-ltt-theme", "data-theme"] });
  });
  demo("mark", "LTT.mark(kind, {size, color, weight, fill, inline})", "<b>색 말고 모양으로 계열을 가른다.</b> square·ring·dot·diamond·cross. (0,0) 중심의 SVG 문자열이라 d3 <code>g.html(...)</code>에 넣거나, <code>inline: true</code>로 본문·범례에 쓴다. 본문에서는 \"빨간 점\" 대신 \"사각형\"처럼 모양으로 가리킨다.", (el) => {
    const legend = LTT.marks.map((k, i) => `<span class="ltt-key" style="font-size:16px;color:var(--ltt-ink-2)">${LTT.mark(k, { inline: true, color: `var(--ltt-c${i + 1})` })}${k}</span>`).join("");
    el.innerHTML = `<div>${legend}</div>`;
  });
  demo("fonts", "--ltt-font · --ltt-font-display · --ltt-mono", "<b>테마 폰트는 kit에 들어 있다.</b> 본문 Pretendard, 세리프 테마(paper, ledger) 제목 Noto Serif KR, 모노 D2Coding. 세리프·모노는 KS X 1001 한글 2,350자 + 라틴만 담았고, 빠진 글자는 시스템 폰트로 넘어간다. 폰트 파일은 그 글꼴을 쓰는 화면에서만 내려받는다.", (el) => {
    el.innerHTML = `<p style="font:700 26px/1.3 'LTT Serif',serif;margin:0">세리프: 조건별 결과 figure</p>` +
      `<p style="font:16px/1.5 var(--ltt-mono);margin:0">모노: $ curl -I /api/주문 → 200 OK</p>` +
      `<p style="margin:0">본문: 그림을 읽는 법을 먼저 알려 준다.</p>`;
  });
  demo("glossary", "{{용어}} · {{보이는 말|용어}}", "<b>처음 나오는 용어에 풀이를 붙인다.</b> 덱의 <code>glossary</code>나 <code>terms</code> 장면에 정의하고, 본문에서 <code>{{용어}}</code>로 표시한다. 마우스를 올리거나 누르면 풀이가 뜬다. 정의 전에 쓰거나 한 장면에 새 용어가 3개 이상이면 덱이 경고한다.", (el) => {
    LTT.setGlossary({ "TTL": "캐시에 넣은 값을 몇 초 동안 그대로 쓸지 정한 유효 시간." }, { "TTL": 0 });
    el.innerHTML = `<p class="ltt-narr">{{TTL}}을 늘리면 DB는 편해지고, 사용자는 바뀌기 전 값을 받는다. 두 번째로 나온 {{TTL}}은 옅은 밑줄이다.</p>`;
    LTT.linkTerms(el, 0);
  });

  group("설명 · ltt-ui.js", "api-ui");
  demo("narration", "LTT.narration(html | [html])", "<b>그림만으로 이유가 안 보일 때</b> 원인 → 과정 → 결과를 2–4문장으로 쓴다. 덱에서는 장면의 <code>narration</code> 필드로 쓰면 설명 레일에 들어간다.", () => {
    return LTT.narration(["캐시는 값을 넣은 순간부터 TTL이 끝날 때까지 원본을 다시 확인하지 않는다.", "그래서 그 사이에 원본이 바뀌면 남은 시간 내내 <b>옛 값</b>을 돌려준다."]);
  });
  demo("annotate", "LTT.annotate(target, points, {tone})", "<b>그림 위 번호 ↔ 해설 목록.</b> <code>at: [x%, y%]</code>로 위치를 찍는다. 번호와 목록에 마우스를 올리면 서로 강조된다. 덱에서는 장면의 <code>points</code> 필드로 쓴다. 3개 이하.", (el) => {
    const b = LTT.mock.browser({ url: "dashboard.example.com", content: `<b style="font-size:17px">매출 대시보드</b><div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1;background:#f6f5f1;border-radius:10px;padding:10px"><small>매출</small><br><b style="font-size:20px">₩48.2M</b></div><div style="flex:1;background:#f6f5f1;border-radius:10px;padding:10px"><small>주문</small><br><b style="font-size:20px">1,284</b></div></div><div style="height:70px;margin-top:10px;border-radius:10px;background:linear-gradient(90deg,#e6e3dc 70%,#2f5bff 0)"></div>` });
    el.appendChild(b.el);
    const a = LTT.annotate(b.el, [
      { at: [30, 48], title: "숫자 카드", text: "같은 높이, 같은 배경색으로 묶는다." },
      { at: [93, 82], title: "강조는 하나", text: "가장 중요한 막대만 포인트 컬러.", tone: "good" },
    ]);
    el.appendChild(a.list);
    whenSeen(el, () => a.replay());
  });
  demo("beforeAfter", "LTT.beforeAfter({before, after})", "<b>같은 대상의 실패 예와 고친 예.</b> 각 쪽은 <code>{visual, points, foot}</code>. 덱에서는 <code>type: \"contrast\"</code> 장면이 이것을 쓴다. 고친 이유는 번호 해설에 적는다.", (el) => {
    const card = (bg, fg) => () => { const p = LTT.mock.phone({ width: 150, ratio: "9/12" }); p.screen.innerHTML = `<b>안내</b><div style="color:${fg};font-size:12px">변경 사항은 저장 후 적용돼요.</div><div style="margin-top:auto;background:${bg};color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:800;font-size:12px">저장</div>`; return p.el; };
    const ba = LTT.beforeAfter({
      before: { visual: card("#ff0000", "#aaa"), points: [{ at: [80, 42], title: "#AAA 2.32:1", text: "안 읽힌다." }] },
      after: { visual: card("#d70015", "#767676"), points: [{ at: [80, 42], title: "#767676 4.54:1", text: "AA 통과." }] },
    });
    el.appendChild(ba.el);
    whenSeen(el, () => ba.replay());
  });
  demo("facts", "LTT.facts([{icon, value, label, tone}])", "<b>상황의 조건을 숫자 카드로.</b> predict 장면의 <code>visual</code>에 넣으면 무엇을 근거로 짐작할지 보인다.", () => {
    return LTT.facts([
      { icon: "users", value: "초당 2번", label: "한 상품 요청" },
      { icon: "refresh", value: "평균 10분", label: "가격 변경 간격" },
      { icon: "hourglass", value: "60초", label: "캐시 TTL", tone: "warn" },
    ]);
  });
  demo("chips · badge", "LTT.chips([..]) · LTT.badge(kind, text)", "<b>키워드 묶음과 상태 표시.</b> 장면의 <code>chips</code> 필드는 제목 아래에 키워드를 단다. badge 종류: before, after, good, bad, warn, accent.", (el) => {
    el.appendChild(LTT.chips(["8pt 그리드", "간격 스케일", { text: "근접성", tone: "accent" }, { text: "통과", tone: "good", icon: "check" }]));
    el.appendChild(div("", ["before", "after", "warn", "accent"].map((k) => LTT.badge(k)).join(" ")));
  });
  demo("callout", "LTT.callout(html, {tone, title, icon})", "<b>흔한 오해나 주의 한 가지.</b> 장면마다 많아야 하나.", () => {
    return LTT.callout("TTL을 늘려도 원본이 거의 안 바뀌면 옛 값은 늘지 않는다. 먼저 변경 간격을 묻는다.", { tone: "warn", title: "흔한 오해" });
  });
  demo("swatches", "LTT.swatches([{color, label, w, h, r}], {caption})", "<b>'무엇을 썼나'를 보이는 미니 인포그래픽.</b> 색, 크기, 모서리 같은 값의 목록을 실물로 보인다. beforeAfter의 <code>foot</code>에 잘 맞는다.", () => {
    return LTT.swatches([4, 8, 16, 24, 32].map((v) => ({ color: v === 16 || v === 24 ? "var(--ltt-bad)" : "var(--ltt-line-2)", label: v, w: v, h: v, r: 4 })), { caption: "간격 스케일 · 4의 배수" });
  });
  demo("takeaway", "LTT.takeaway(text, sources)", "<b>장면의 핵심 한 문장.</b> 장면의 <code>takeaway</code> 필드로 쓰면 아래에 붙고, <code>summary</code> 장면이 이것들을 모은다. 장면에 <code>recall</code>(떠올리게 하는 질문)을 함께 주면 summary가 질문을 먼저 보이고 takeaway는 '답 보기' 뒤에 연다. <code>sources</code>는 '찾아볼 곳'.", () => {
    return LTT.takeaway("간격은 감으로 정하지 않는다 — 정해진 스케일에서 고른다.", ["Material 3 · Layout", "Refactoring UI"]);
  });

  demo("inspector", "LTT.inspector({title, rows: [{name, fg, bg, ratio}], min})", "<b>디자인 툴의 대비 검사 패널.</b> 글자색·배경색·대비비와 통과 태그. <code>ratio</code>를 안 주면 <code>LTT.contrast(fg, bg)</code>로 계산한다. 목업 옆에 두고 번호를 맞춘다.", (el) => {
    el.innerHTML = LTT.inspector({ title: "CONTRAST CHECK · 일반 글자", rows: [{ name: "도움말", fg: "#999999", bg: "#FFFFFF" }, { name: "고친 도움말", fg: "#6B6B6B", bg: "#FFFFFF" }] });
  });
  demo("redline", "LTT.redline(container, {selector, x}) → {update}", "<b>화면 간격을 px 막대로 잰다.</b> 대상마다 위쪽 margin을 오른쪽 여백에 측정선으로 그린다. 스타일을 바꾼 뒤 <code>update()</code>.", (el) => {
    const b = LTT.mock.browser({ url: "shop.example.com", width: 260 });
    b.screen.innerHTML = `<div style="display:flex;flex-direction:column;color:#222"><b style="font-size:17px">무선 키보드 K3</b><b style="font-size:22px;margin-top:4px">₩89,000</b><span style="font-size:13px;color:#6b6b6b;margin-top:16px">내일 도착 · 무료배송</span></div>`;
    LTT.redline(b.screen.firstChild);
    el.appendChild(b.el);
  });
  group("목업 · ltt-mock.js", "api-mock");
  demo("mock.phone · mock.browser", "LTT.mock.phone({width, ratio, dark, content}) → {el, screen}", "<b>실제 화면처럼 보이는 틀.</b> UI 예시는 맨 HTML 조각 대신 틀에 넣는다. <code>el</code>에 annotate를 걸면 번호가 틀 기준으로 찍힌다.", (el) => {
    const row = div("", ""); row.style.cssText = "display:flex;gap:20px;align-items:center;flex-wrap:wrap";
    const p = LTT.mock.phone({ width: 170, ratio: "9/14", content: "<b>메뉴</b><div style='background:#f2f1ec;border-radius:10px;padding:8px;font-size:12px;color:#767676'>메뉴 검색</div>" });
    const b = LTT.mock.browser({ url: "localhost:3000", width: 300, content: "<b>주문 내역</b><p style='color:#767676;font-size:13px'>아직 주문이 없어요</p>" });
    row.append(p.el, b.el);
    return row;
  });

  demo("autoLayout", "LTT.autoLayout({nodes, edges, groups, direction}) → Promise<diagram spec>", "<b>노드가 많아 격자 좌표를 손으로 잡기 어려울 때.</b> 좌표 없이 연결만 적으면 elk(layered)가 층으로 나눠 겹치지 않게 놓고 엣지를 직각으로 꺾는다. 노드 <code>group</code>은 그룹 id, 그룹 <code>{id, l, k, parent}</code>는 중첩 영역이 된다. <code>direction</code>은 RIGHT(기본)·DOWN, <code>spacing: [층, 노드]</code>. 결과를 그대로 <code>LTT.diagram</code>에 넣으므로 player·highlight·send를 쓸 수 있다. 같은 입력은 항상 같은 그림. <code>elk.bundled.js</code>(1.6MB)가 필요하니 이 부품을 쓰는 페이지에서만 불러온다.", async (el) => {

      nodes: [
        N("web", "웹", null, { icon: "monitor" }), N("app", "앱", null, { icon: "phone" }), N("partner", "제휴사 API", null, { icon: "link" }),
        N("cdn", "CDN", "edge", { icon: "cloud" }), N("waf", "WAF", "edge", { icon: "shield-check" }), N("lb", "로드\n밸런서", "edge", { icon: "network" }),
        N("gw", "API 게이트웨이", "core", { icon: "route" }), N("auth", "인증", "core", { icon: "key-round" }), N("order", "주문", "core", { icon: "package", k: "accent" }),

        N("payapi", "결제 요청", "pay", { icon: "send" }), N("fraud", "이상 거래\n탐지", "pay", { icon: "alert", k: "warn" }), N("pg", "PG사", null, { icon: "globe", k: "muted" }),
        N("odb", "주문 DB", "data", { icon: "db" }), N("cache", "캐시", "data", { icon: "cache" }), N("search", "검색 색인", "data", { icon: "search" }),
        N("queue", "이벤트 큐", "async", { icon: "layers" }), N("ship", "배송 연동", "async", { icon: "truck" }), N("mail", "알림 메일", "async", { icon: "mail" }), N("stats", "집계", "async", { icon: "chart" }),
        N("courier", "택배사", null, { icon: "map-pin", k: "muted" }),
      ],
      edges: [
        { f: "web", t: "cdn" }, { f: "app", t: "waf" }, { f: "cdn", t: "waf" }, { f: "waf", t: "lb" }, { f: "partner", t: "lb" }, { f: "lb", t: "gw" },
        { f: "gw", t: "auth" }, { f: "gw", t: "cart" }, { f: "gw", t: "order", k: "accent" }, { f: "cart", t: "price" }, { f: "order", t: "price" },
        { f: "order", t: "payapi", k: "accent", l: "결제" }, { f: "payapi", t: "fraud" }, { f: "fraud", t: "pg", l: "승인 요청" },
        { f: "order", t: "odb" }, { f: "price", t: "cache" }, { f: "cart", t: "cache" }, { f: "order", t: "queue", l: "주문 완료" },

  demo("state", "LTT.state(svg, {states, transitions, initial, direction}) → Promise<diagram>", "<b>무엇이 무엇으로 바뀌는가.</b> 주문 상태, 연결 상태, 재시도처럼 상태와 전이가 핵심일 때. 상태 <code>{id, l, s, k, icon, final}</code>, 전이 <code>{f, t, l, k, dash}</code>. <code>initial</code> 상태 앞에 시작 점이 붙고 <code>final</code>은 이중 테두리. 자기 자신으로의 전이는 상태 아래 <code>↻ 이벤트</code> 줄이 된다. autoLayout으로 배치하므로 <code>elk.bundled.js</code>가 필요하고, 돌려받은 diagram으로 <code>player</code>를 쓴다.", async (el) => {

  demo("sketch", "LTT.diagram(svg, {..., sketch: true}) · theme: \"sketch\"", "<b>칠판에 그린 듯한 첫 소개.</b> <code>rough.js</code>를 불러오면 sketch 테마의 diagram·autoLayout·state가 손그림 선으로 그려진다(다른 테마에서도 <code>sketch: true</code>, 끄려면 <code>sketch: false</code>). 채우기·화살표·패킷·하이라이트는 그대로이고, 같은 페이지는 매번 같은 선으로 그려진다.", (el) => {

  demo("axisPlot", "LTT.axisPlot(svg | el, {x, y, equal, ticks, labels, series}) → {set(id, points), px}", "<b>축이 고정된 함수·궤적 플롯.</b> 값을 바꿔도 축이 그대로라 곡선끼리 길이로 비교된다. <code>equal: true</code>면 x·y 축척이 같아 궤적 모양이 실제와 같다. 계열 색은 기본 <code>--ltt-c1…</code>.", (el) => {
    const p = LTT.axisPlot(el, { width: 560, height: 220, x: [0, 10], y: [0, 1.2], ticks: [5, 3], labels: { x: "시간 (s)", y: "남은 비율" },
      series: [{ id: "fast", dot: true }, { id: "slow", dash: true, dot: true }] });
    const curve = (k) => d3.range(0, 10.01, 0.1).map((t) => [t, Math.exp(-k * t)]);
    p.set("fast", curve(0.6)).set("slow", curve(0.15));
  });
  demo("lanes", "LTT.lanes(svg | el, {axis: {max, step, fmt}, lanes: [{l, s, value, text, color}]}) → {play}", "<b>시간이 어디서 드는가.</b> 단계마다 한 줄, 모두 같은 시간 축이라 300배 차이가 길이로 읽힌다.", (el) => {
    const ln = LTT.lanes(el, { axis: { max: 120, step: 20, fmt: (d) => d + " ms" },

  demo("chartFrame · hbars", "LTT.chartFrame({title, dek, source}) · LTT.hbars(el, {domain, ticks, rows}) → {play}", "<b>신문식 차트 틀과 고정 축 가로 막대.</b> 헤드라인이 주장, dek이 단위·조건, 아래 출처. hbars의 <code>tone: \"floor\"</code>는 넘을 수 없는 바닥을 점선으로 그린다. ledger 테마와 잘 맞는다.", (el) => {
    const f = LTT.chartFrame({ title: "섞을수록 줄지만 바닥이 있다", dek: "변동성(%), 서로 상관계수 0.3", source: "모델로 계산한 예시" });

    const hb = LTT.hbars(f.el, { domain: [0, 20], ticks: [0, 10, 20], fmt: (v) => v.toFixed(1) + "%",

  demo("plot", "LTT.plot(options) · LTT.plotTheme(options)", "<b>막대·선·점·분포는 Observable Plot.</b> <code>LTT.plot</code>은 테마 팔레트, 모노 눈금, 투명 배경을 기본으로 넣은 <code>Plot.plot</code>이다. 옵션은 Plot 그대로. <code>plot.umd.min.js</code>가 필요하다.", (el) => {
    const data = ["월", "화", "수", "목", "금"].flatMap((d, i) => [{ d, s: "캐시", v: 40 + i * 6 }, { d, s: "DB", v: 30 - i * 3 }]);
    el.appendChild(LTT.plot({ width: 520, height: 220, marks: [Plot.barY(data, { x: "d", y: "v", fill: "s" }), Plot.ruleY([0])], color: { legend: true }, y: { label: "요청 (천 건)" }, x: { label: null } }));

  demo("sankey", "LTT.sankey(svg | el, {nodes, links}) → {highlight}", "<b>흐름량이 어디로 갈라지는가.</b> 비용·트래픽·전환 퍼널. 띠 굵기 = 값. <code>d3-sankey.min.js</code>가 필요하다.", (el) => {
    LTT.sankey(el, { width: 640, height: 260, fmt: (v) => v + "만 건",
      nodes: [{ id: "req", l: "요청" }, { id: "hit", l: "캐시 적중" }, { id: "miss", l: "캐시 미스" }, { id: "db", l: "DB" }, { id: "err", l: "타임아웃", k: "bad" }],
      links: [{ f: "req", t: "hit", value: 82 }, { f: "req", t: "miss", value: 18 }, { f: "miss", t: "db", value: 15 }, { f: "miss", t: "err", value: 3 }] }).highlight(["miss"]);
  });
  demo("tree (d3.hierarchy)", "d3.tree · d3.treemap", "<b>계층은 kit 부품 없이 d3로.</b> 디렉터리·조직·비용 구성. 색은 <code>LTT.palette()</code>, 글자는 kit 크기를 쓴다.", (el) => {
    const root = d3.hierarchy({ name: "월 비용", children: [{ name: "컴퓨트", children: [{ name: "API", v: 42 }, { name: "배치", v: 18 }] }, { name: "저장소", children: [{ name: "DB", v: 25 }, { name: "객체", v: 9 }] }, { name: "네트워크", v: 6 }] })
      .sum((d) => d.v || 0).sort((a, b) => b.value - a.value);
    d3.treemap().size([560, 220]).paddingInner(3).paddingTop(18)(root);
    const pal = LTT.palette(), svg = d3.select(el).append("svg").attr("class", "ltt-svg").attr("viewBox", "0 0 560 220");
    const g = svg.selectAll("g").data(root.descendants().slice(1)).join("g").attr("transform", (d) => `translate(${d.x0},${d.y0})`);
    g.append("rect").attr("width", (d) => d.x1 - d.x0).attr("height", (d) => d.y1 - d.y0).attr("rx", 3)
      .style("fill", (d) => (d.children ? "none" : pal[root.children.indexOf(d.parent === root ? d : d.parent)])).style("stroke", (d) => (d.children ? "var(--ltt-line-2)" : "none"));
    g.append("text").attr("x", 6).attr("y", 13).text((d) => `${d.data.name} ${d.value}`).style("fill", (d) => (d.children ? "var(--ltt-ink-2)" : "var(--ltt-bg)")).style("font-weight", 700);
  });
  demo("units · bar · tween", "LTT.units(el, n, cols).paint(k) · LTT.bar(el, parts).set(values) · LTT.tween(el, to)", "<b>비율을 세어 볼 수 있게.</b> 100칸 그림은 '100건 중 몇 건', 막대는 구성비, tween은 숫자가 바뀌는 순간을 보인다.", (el) => {
    el.innerHTML = `<div style="display:flex;gap:20px;align-items:center"><div id="cu" style="width:160px"></div><div style="flex:1"><div class="ltt-stat"><span id="cn">0</span><small>/ 100</small></div><div id="cb" style="margin-top:10px"></div></div></div>`;
    const u = LTT.units("cu", 100);
    const b = LTT.bar("cb", [{ color: "var(--ltt-warn)" }, { color: "var(--ltt-line-2)" }, { color: "var(--ltt-accent)" }]);
    whenSeen(el, () => {
      u.paint(0); b.set([0, 0, 0]); LTT.tween("cn", 0, null, 0);
      setTimeout(() => { u.paint(5); b.set([5, 94, 1], ["5", "94", ""]); LTT.tween("cn", 5); }, 300);
    });

  demo("stepper", "LTT.stepper(el, [{caption, enter(i, dir)}], {interval}) → {go, play, stop}", "<b>한 그림을 단계별로.</b> 단계마다 자막(caption)이 그림을 읽는 법을 말한다. <code>enter</code>는 다시 들어와도 같은 화면이 되게 짠다.", (el) => {
    const box = div("", ""); box.style.cssText = "display:flex;gap:10px";
    el.appendChild(box);
    const cells = [0, 1, 2, 3].map(() => box.appendChild(div("", "")));
    cells.forEach((c) => c.style.cssText = "flex:1;height:44px;border-radius:12px;background:var(--ltt-line);transition:background .3s");
    LTT.stepper(el, ["저장", "적중", "원본 변경", "만료"].map((t, i) => ({
      caption: `<b>${i + 1}. ${t}</b> — 칸 ${i + 1}까지 칠한다.`,
      enter: (k) => cells.forEach((c, j) => c.style.background = j <= k ? (j === 2 ? "var(--ltt-warn)" : "var(--ltt-accent)") : "var(--ltt-line)"),
    })));
  });
  demo("sweep", "LTT.sweep({params: {id: {kind, map, fmt, …}}, render, goal: {el, text, target, check(values)}})", "<b>조작 자체가 배움일 때만.</b> 손잡이가 하나의 <code>render(values)</code>를 움직인다. 실사용 범위만 움직인다. 손잡이는 변수의 모양으로 고른다: 1초~1시간처럼 자릿수가 바뀌면 <code>kind: \"log\"</code>. <code>goal</code>은 <code>el</code> 안에 목표 띠(견본 <code>target</code> + 문장)를 그리고, <code>check(values)</code>가 참이 되면 '맞췄다'를 켜고 <code>goal</code> 이벤트를 남긴다. 목표는 두 자리 이상에서 맞게, 시작 위치는 목표 밖에 둔다.", (el) => {
    el.innerHTML = `<div id="sw-g"></div><label class="ltt-param">TTL <b id="sw-v"></b><input type="range" id="sw"></label><div id="sw-b"></div>`;
    const b = LTT.bar("sw-b", [{ color: "var(--ltt-warn)" }, { color: "var(--ltt-line-2)" }]);
    const pct = (sw) => Math.round(100 * sw / 1200);
    LTT.sweep({ params: { sw: { kind: "log", min: 1, max: 3600, value: 300, map: (v) => +v.toPrecision(2), fmt: (v) => v + "초" } }, render: ({ sw }) => { const s = pct(sw); b.set([s, 100 - s], [s + "%", ""]); },
      goal: { el: "sw-g", target: "<b style='color:var(--ltt-warn)'>≤ 5%</b>", text: "옛 값을 보는 비율을 5% 이하로 낮추는 TTL을 찾아보자.", check: ({ sw }) => pct(sw) <= 5 } });
  });
  demo("sweep-kinds", "kind: \"steps\" · \"dial\" · \"pad\"", "<b>손잡이 모양 = 변수 모양.</b> 고정 단계는 <code>steps</code>, 순환하는 값(각도·색상·시각)은 <code>dial</code>, 서로 묶인 두 값은 <code>pad</code>. 여기서는 색상이 원을 돌기 때문에 다이얼, 채도·명도는 한 색 안에서 함께 움직이므로 평면이다. 간격 스케일처럼 정해진 값만 쓰는 변수는 단계 버튼이다.", (el) => {
    el.innerHTML = `<div id="kn-g"></div><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <div class="ltt-param">색상 <b id="h-v"></b><div id="h"></div></div><div class="ltt-param" style="flex:1;min-width:200px">채도·명도 <b id="sl-v"></b><div id="sl"></div></div></div>
      <div class="ltt-param">테두리 두께<div id="bw"></div></div>`;
    const ring = "conic-gradient(" + [0, 60, 120, 180, 240, 300, 360].map((h) => `hsl(${h} 80% 55%)`).join(",") + ")";
    const target = `<i style="display:block;width:30px;height:30px;border-radius:8px;background:hsl(30 80% 55%)"></i>`;
    LTT.sweep({
      params: {
        h: { kind: "dial", value: 220, step: 5, ring, fmt: (v) => v + "°", label: "색상" },
        sl: { kind: "pad", x: { min: 0, max: 100, step: 5, value: 40 }, y: { min: 0, max: 100, step: 5, value: 40 }, labels: ["채도", "명도"], fmt: ([s, l]) => `${s}% · ${l}%` },
        bw: { kind: "steps", stops: [0, 1, 2, 4, 8], value: 1, fmt: (v) => v + "px" },
      },
      render: ({ h, sl: [s, l], bw }) => {
        el.querySelector("#h .mid").style.cssText = `background:hsl(${h} ${s}% ${l}%);box-shadow:0 0 0 ${bw}px var(--ltt-ink)`;
      },
      goal: { el: "kn-g", target, text: "가운데 색을 왼쪽 견본(주황)과 같게 만들어 보자.",
        check: ({ h, sl: [s, l] }) => Math.abs(h - 30) <= 10 && Math.abs(s - 80) <= 10 && Math.abs(l - 55) <= 10 },
    });
  });
  demo("drag", "LTT.drag(svg, {value, toSvg, fromSvg, bounds, step})", "<b>그림 속 대상을 직접 끈다.</b> 움직일 것이 그림에 있으면(벡터 끝, 막대 끝, 경계선) 옆 슬라이더 대신 그 대상을 잡게 한다. 돌려준 객체를 <code>sweep</code>의 <code>control</code>로 넘기면 <code>render</code>·<code>goal</code>을 그대로 쓴다.", (el) => {
    el.innerHTML = `<div id="dr-g"></div><div id="dr" style="max-width:300px"></div><p class="ltt-basis">î = <b id="i-v"></b></p>`;
    const svg = el.querySelector("#dr").appendChild(document.createElementNS("http://www.w3.org/2000/svg", "svg"));
    const p = LTT.plane(svg, { range: 3, size: 300, vectors: [{ v: [1, 0], label: "î" }, { v: [0, 1], label: "ĵ", color: "var(--ltt-good)" }], shape: [[0, 0], [1, 0], [1, 1], [0, 1]] });
    const i = LTT.drag(svg, { value: [1, 0], toSvg: p.toSvg, fromSvg: p.fromSvg, step: 0.5, bounds: [[-3, 3], [-3, 3]], label: "î 끝" });
    LTT.sweep({ params: { i: { control: i } }, render: ({ i: [a, c] }) => p.to([[a, 0], [c, 1]], 0),
      goal: { el: "dr-g", text: "î 끝을 끌어 색칠한 칸의 넓이를 2배로 만들어 보자.", check: ({ i: [a] }) => Math.abs(a) === 2 } });
  });
  demo("predict", "LTT.predict({question, choices, button, answer, show, reveal, onReset}) → {reset}", "<b>낮은 부담의 짐작.</b> 덱에서는 <code>type: \"predict\"</code>가 이것을 쓰고 '잘 모르겠다'를 자동으로 붙인다. 질문에 쓰는 용어는 앞 장면에서 풀어 둔다.", (el) => {
    el.innerHTML = `<div id="pc"><button data-choice="a">거의 0건</button><button data-choice="b">5건쯤</button><button data-choice="c">절반쯤</button></div><div class="dk-actions" style="margin-top:10px"><button id="pb" class="accent">정답 보기</button></div><p id="pa" class="ltt-hidden ltt-narr">약 5건. 평균 30초 묵은 값이 10분 안에 바뀔 확률은 5%.</p><div id="pr" class="ltt-hidden dk-actions"><button class="ghost">초기화</button></div>`;
    const pr = LTT.predict({ question: "카탈로그 예시", choices: "pc", button: "pb", answer: "b", show: ["pa", "pr"] });
    el.querySelector("#pr button").onclick = pr.reset;
  });

  demo("math", "LTT.math(scope)", "<b>수식은 KaTeX로 그린다.</b> <code>data-tex</code>가 붙은 요소를 찾아 TeX를 렌더하고, <code>data-display</code>를 같이 붙이면 블록 수식이 된다. 덱 장면에서는 <code>tex</code> 필드가 이것을 쓴다. <code>katex.min.css</code>와 <code>katex.min.js</code>가 필요하다.", (el) => {
    el.innerHTML = `<p>벡터 <span data-tex="A\\mathbf{x}"></span>는 행렬 A가 벡터 x를 옮긴 결과다.</p><div data-tex="\\det A = ad - bc" data-display></div>`;
    LTT.math(el);
  });

  group("움직임 · LTT.motion", "motion");
  demo("motion-loop", "LTT.motion.loop(draw(u), {period, beats, once, rest, el}) → {stop, play, running}", "<b>그림은 기본으로 움직인다.</b> <code>draw(u)</code>가 u = 0→1을 <code>period</code>마다 되풀이해 받는다. 덱 장면 안에서 만들면 그 장면에 들어올 때 돌고 떠나면 멈춘다. <code>beats</code>는 shot이 찍을 시각(장면 요소의 <code>data-ltt-beats</code>), reduced-motion이면 <code>rest</code> 한 장만 그린다. 시간은 <code>setTimeout</code>이라 헤드리스 가상 시간에서도 돈다.", (el) => {
    const svg = el.appendChild(svgEl());
    svg.setAttribute("class", "ltt-svg");
    svg.setAttribute("viewBox", "0 0 520 120");
    svg.innerHTML = `<line x1="30" y1="70" x2="490" y2="70" stroke="var(--ltt-line-2)" stroke-width="2"/><rect x="30" y="64" height="12" rx="6" fill="var(--ltt-accent-soft)"/><circle r="12" cy="70" fill="var(--ltt-accent)"/><text x="30" y="30"></text>`;
    const bar = svg.querySelector("rect"), dot = svg.querySelector("circle"), label = svg.querySelector("text");
    LTT.motion.loop((u) => {
      const x = 30 + 460 * u;
      dot.setAttribute("cx", x);
      bar.setAttribute("width", x - 30);
      label.textContent = "대기열 " + Math.round(u * 100) + "% 처리";
    }, { period: 3000, beats: [{ t: 1000, text: "3분의 1" }, { t: 3000, text: "다 비웠다" }], el: svg });
  });
  demo("figure-autoplay", "figure steps · autoplay: true | \"once\" | false", "<b>figure <code>steps</code>는 장면에 들어오면 혼자 넘어간다.</b> 단계마다 <code>hold</code>ms 머물고 끝에서 처음으로 돈다(<code>\"once\"</code>는 끝에서 멈춤). 이전·다음·반복 단추를 누르면 그 방문 동안 멈추고, 다시 들어오면 단계 0부터 재생한다. 덱이 필요해 iframe 안에 띄웠다.", (el) => {
    const deck = `
      LTT.deck({ title: "자동 재생", theme: "studio", scenes: [{ type: "figure", title: "요청은 캐시를 먼저 본다", caption: "단계가 혼자 넘어간다",
        figure: (el) => { el.innerHTML = '<svg class="ltt-svg" viewBox="0 0 520 140"></svg>'; return { el: el.firstChild, dg: LTT.diagram(el.firstChild, {
          cols: 3, rows: 1, cell: [170, 120], node: [130, 56],
          nodes: [{ id: "u", c: 0, r: 0, l: "요청", icon: "user" }, { id: "c", c: 1, r: 0, l: "캐시", icon: "cache" }, { id: "d", c: 2, r: 0, l: "DB", icon: "db" }],
          edges: [{ f: "u", t: "c" }, { f: "c", t: "d" }] }) }; },
        steps: [{ caption: "① 요청이 들어온다", hold: 1500, enter: (k, f) => f.dg.highlight(["u"]) },
                { caption: "② 캐시에 있으면 바로 돌려준다", hold: 1500, enter: (k, f) => f.dg.highlight(["u", "c"]) },
                { caption: "③ 없으면 DB까지 간다", hold: 1500, enter: (k, f) => f.dg.highlight(["c", "d"]) }] },
        { type: "keywords", title: "다음에 비슷한 걸 만나면", terms: [{ ko: "캐시", en: "cache" }] }] });`;
    const kit = ["vendor/d3.min.js", "ltt.js", "ltt-parts.js", "ltt-ui.js", "ltt-deck.js"].map((f) => `<script src="/kit/${f}"><\/script>`).join("");
    const f = Object.assign(document.createElement("iframe"), { className: "deck", title: "figure 자동 재생 데모" });
    f.srcdoc = `<!doctype html><meta charset="utf-8">${kit}<body><script>${deck}<\/script></body>`;
    return f;
  });

  group("장면 덱 · ltt-deck.js");
  demo("deck", "LTT.deck({title, theme, glossary, scenes})", "<b>모든 장면 타입과 형태를 한 번씩 담은 덱.</b> figure, statement, explain <code>form: strip·stack·cards</code>, compare <code>form: table</code>을 포함한다. terms 항목마다 <code>visual</code>(뜻을 보이는 작은 그림)이 있고, summary는 <code>recall</code> 질문으로 인출 연습을 한다. 장면 공통 필드는 kicker, title, en, sub, chips, narration, points, takeaway, recall, sources, ask, basis, tex, mount, layout(<code>split·stack·full</code>). 위쪽 테마 버튼을 누르면 덱도 그 테마로 바뀐다. 새 탭에서 열기: <a href=\"scenes.html\">scenes.html</a>", (el) => {
