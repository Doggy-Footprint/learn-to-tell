 "audience": "그림을 거의 그려 본 적 없는 성인 초보",

 "glossary": {

  "음형 공간": "물체 사이·안쪽에 남는 빈 공간(negative space). 물체와 경계를 공유하므로, 빈 공간의 모양을 맞게 그리면 물체의 모양도 맞게 나온다.",

  "비례": "한 부분의 길이가 기준 길이의 몇 배인지. 드로잉에서는 절대 길이가 아니라 이 비를 옮긴다.",
  "기본 도형": "구·원기둥·원뿔·직육면체처럼 단순한 입체. 복잡한 물체를 이것들의 조합으로 보고 먼저 큰 형태를 잡는다.",
  "타원": "원을 비스듬히 볼 때 보이는 모양. 눈높이에서 멀수록(더 내려다보거나 올려다볼수록) 둥글어지고, 눈높이에 가까울수록 납작해진다.",
  "수평선": "투시에서 보는 사람의 눈높이를 그림에 그은 가로선(horizon line). 바다의 수평선과 같은 높이다.",

  "1점 투시": "물체의 한 면이 그림과 평행해서, 깊이 방향 모서리만 한 소실점으로 모이는 투시. 가로·세로 모서리는 그대로 가로·세로다.",
  "2점 투시": "물체가 비스듬히 놓여 두 방향의 수평 모서리가 각각 다른 소실점으로 모이는 투시. 세로 모서리는 세로로 남는다.",

<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const F = 500;
const pr = (X, Y, Z) => [F * X / Z, -F * Y / Z];
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2);
function svg(vb, cls, fs){ const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", vb); s.setAttribute("class", "dl-fig " + (cls||"")); if (fs) s.style.fontSize = fs + "px"; return s; }
function el(parent, tag, attrs, text){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; }
const D = (pts, close) => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("") + (close ? "Z" : "");
function hull(pts){
  const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of P){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = P.length-1; i >= 0; i--){ const p = P[i]; while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function circle3(xc, Y, zc, r, n){ n = n || 120; const o = []; for (let i = 0; i < n; i++){ const a = i / n * 2 * Math.PI; o.push(pr(xc + r * Math.cos(a), Y, zc + r * Math.sin(a))); } return o; }
function ellipseRatio(xc, Y, zc, r){
  const p = circle3(xc, Y, zc, r, 3600); const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  return {w, h, ratio: h / w};
}

// --- 정물: 눈은 식탁 위 40cm, 머그잔과 상자 ---
const TBL = -40;
const MUG = {xc: -10, zc: 70, r: 4, y0: TBL, y1: TBL + 10};
function mugGeom(m){
  const top = circle3(m.xc, m.y1, m.zc, m.r), bot = circle3(m.xc, m.y0, m.zc, m.r);
  const sil = hull(top.concat(bot));
  const hx = m.xc - m.r, hy = (m.y0 + m.y1) / 2;
  const arc = (rad) => { const o = []; for (let i = 0; i <= 40; i++){ const a = Math.PI/2 + i/40*Math.PI; o.push(pr(hx + rad*Math.cos(a)*0.85, hy + rad*Math.sin(a), m.zc)); } return o; };
  const outer = arc(3.3), inner = arc(2.3), mid = arc(2.8);
  // 손잡이 안쪽 구멍: 안쪽 호 + 몸통 옆선
  const hole = inner.concat([inner[0]]);
  const front = bot.filter(p => true);
  return {top, bot, sil, outer, inner, mid, hole};
}
function boxGeom(c, w, d, h, th, ybase){
  const u = [Math.cos(th), 0, Math.sin(th)], v = [-Math.sin(th), 0, Math.cos(th)];
  const P3 = [];
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a, b]) => P3.push([c[0] + a*u[0]*w/2 + b*v[0]*d/2, ybase, c[2] + a*u[2]*w/2 + b*v[2]*d/2]));
  for (let i = 0; i < 4; i++) P3.push([P3[i][0], ybase + h, P3[i][2]]);
  const faces = [
    {idx: [0,1,2,3], n: [0,-1,0]}, {idx: [4,5,6,7], n: [0,1,0], top: true},
    {idx: [0,1,5,4], n: [-v[0],0,-v[2]]}, {idx: [1,2,6,5], n: u},
    {idx: [2,3,7,6], n: v}, {idx: [3,0,4,7], n: [-u[0],0,-u[2]]}];
  faces.forEach(fc => { const cc = [0,1,2].map(k => fc.idx.reduce((s, i) => s + P3[i][k], 0) / 4); fc.vis = fc.n[0]*cc[0] + fc.n[1]*cc[1] + fc.n[2]*cc[2] < 0; });
  const E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const edges = E.map(([a, b]) => ({a, b, vis: faces.some(fc => fc.vis && fc.idx.includes(a) && fc.idx.includes(b)), dir: (a%4===b%4) ? "y" : ((Math.min(a%4,b%4)===0 && Math.max(a%4,b%4)===1) || (Math.min(a%4,b%4)===2 && Math.max(a%4,b%4)===3) ? "u" : "v")}));
  const P2 = P3.map(p => pr(p[0], p[1], p[2]));
  return {P3, P2, faces, edges, u, v};
}
const BOX = boxGeom([4, 0, 78], 12, 9, 7, 30 * Math.PI / 180, TBL);
const MG = mugGeom(MUG);

function stillLife(s, opts){
  opts = opts || {};
  const g = el(s, "g", {});
  // 상자 면
  BOX.faces.filter(fc => fc.vis).forEach(fc => el(g, "path", {d: D(fc.idx.map(i => BOX.P2[i]), true), fill: fc.top ? "var(--ltt-card)" : "var(--ltt-card-2)", stroke: "none"}));
  el(g, "path", {d: D(MG.sil, true), fill: "var(--ltt-card)", stroke: "none"});
  return g;
}
function contourParts(){
  const box = BOX.edges.filter(e => e.vis).map(e => D([BOX.P2[e.a], BOX.P2[e.b]]));
  return [D(MG.sil, true), D(MG.top, true), D(MG.outer), D(MG.inner)].concat(box);
}
const contourD = () => contourParts().join("");
function bbox(pts, pad){ const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [Math.min(...xs)-pad, Math.min(...ys)-pad, Math.max(...xs)-Math.min(...xs)+2*pad, Math.max(...ys)-Math.min(...ys)+2*pad]; }
const SL_PTS = MG.sil.concat(MG.outer, BOX.P2);
const SL_BB = bbox(SL_PTS, 26);
const SL_VB = SL_BB.map(v => v.toFixed(1)).join(" ");
const SL_FS = +(SL_BB[2] / 42).toFixed(2);

// --- 기대값 대조 ---
const tn = pr(60, TBL, 100), tf = pr(60, TBL, 180);
const tableRatio = tf[0] / tn[0];
LTT.expect("식탁 먼 변/앞 변", tableRatio, 0.556, {tol: 0.001});
LTT.expect("식탁 보이는 깊이/앞 변", (tn[1] - tf[1]) / (2 * tn[0]), 0.148, {tol: 0.001});
const ET = ellipseRatio(0, -30, 70, 4), EB = ellipseRatio(0, -40, 70, 4);
LTT.expect("윗면 타원 높이/폭", ET.ratio, 0.429, {tol: 0.002});
LTT.expect("바닥 타원 높이/폭", EB.ratio, 0.572, {tol: 0.002});
const reading = (arm, H, Dist) => arm * H / Dist;
LTT.expect("연필 높이 눈금 D=120", reading(60, 10, 120), 5.0, {tol: 0.01});
LTT.expect("연필 폭 눈금 D=120", reading(60, 8, 120), 4.0, {tol: 0.01});
LTT.expect("높이/폭 D=300", reading(60, 10, 300) / reading(60, 8, 300), 1.25, {tol: 0.001});
LTT.expect("팔 굽힘 비", reading(45, 10, 120) / reading(60, 8, 120), 0.94, {tol: 0.003});
const th30 = 30 * Math.PI / 180;
LTT.expect("θ=30 오른쪽 소실점", pr(Math.cos(th30) * 1e7, -40, 150 + Math.sin(th30) * 1e7)[0], 866.0, {tol: 0.5});
LTT.expect("θ=30 왼쪽 소실점", pr(-Math.sin(th30) * 1e7, -40, 150 + Math.cos(th30) * 1e7)[0], -288.7, {tol: 0.5});
const LE = 35 * Math.PI / 180;
const shade = (n, L) => { const d = n[0]*L[0] + n[1]*L[1] + n[2]*L[2]; let b = 0.08 + 0.92 * Math.max(0, d); if (d < 0){ const rx = -L[0], ry = -0.7, rl = Math.hypot(rx, ry); b += 0.32 * Math.max(0, (n[0] * rx + n[1] * ry) / rl) * Math.min(1, -d * 3); } return Math.min(1, b); };
const lightVec = a => { const r = a * Math.PI / 180; return [Math.sin(r) * Math.cos(LE), Math.cos(r) * Math.cos(LE), Math.sin(LE)]; };
LTT.expect("구 중앙 밝기", shade([0, 0, 1], lightVec(-45)), 0.608, {tol: 0.001});

// --- 장면 그림들 ---
function tableFig(){
  const wrap = document.createElement("div"); wrap.className = "dl-two"; wrap.style.cssText = "width:1040px;max-width:100%";
  const a = document.createElement("div"); a.className = "dl-panel"; a.innerHTML = "<h4>아는 모양 (위에서 본 식탁)</h4>";
  const s1 = svg("-200 -150 400 300", "", 16); a.appendChild(s1);
  el(s1, "rect", {x: -150, y: -100, width: 300, height: 200, fill: "var(--ltt-card-2)", stroke: "var(--ltt-ink)", "stroke-width": 2.5});
  el(s1, "text", {x: 0, y: 125, "text-anchor": "middle"}, "폭 120cm");
  el(s1, "text", {x: 0, y: 6, "text-anchor": "middle", class: "muted"}, "깊이 80cm");
  el(s1, "text", {x: 0, y: -112, "text-anchor": "middle", class: "muted"}, "먼 변 = 앞 변 = 120cm");
  const b = document.createElement("div"); b.className = "dl-panel"; b.innerHTML = "<h4>보이는 모양 (앉은 눈, 식탁 위 40cm)</h4>";
  const s2 = svg("-340 -40 680 340", "", 24); b.appendChild(s2);
  el(s2, "line", {x1: -330, y1: 0, x2: 330, y2: 0, class: "dl-soft", "stroke-dasharray": "6 5"});
  el(s2, "text", {x: -330, y: -10, class: "muted"}, "눈높이");
  const q = [pr(-60, TBL, 100), pr(60, TBL, 100), pr(60, TBL, 180), pr(-60, TBL, 180)];
  el(s2, "path", {d: D(q, true), fill: "var(--ltt-card-2)", stroke: "var(--ltt-ink)", "stroke-width": 2.5});
  el(s2, "line", {x1: q[3][0], y1: q[3][1] - 14, x2: q[2][0], y2: q[2][1] - 14, class: "dl-acc"});
  el(s2, "text", {x: 0, y: q[2][1] - 24, "text-anchor": "middle", class: "acc"}, "먼 변 (180cm 앞)");
  el(s2, "line", {x1: q[0][0], y1: q[0][1] + 14, x2: q[1][0], y2: q[1][1] + 14, class: "dl-acc"});
  el(s2, "text", {x: 0, y: q[0][1] + 44, "text-anchor": "middle", class: "acc"}, "앞 변 (100cm 앞)");
  el(s2, "text", {x: 0, y: q[0][1] + 82, "text-anchor": "middle"}, "먼 변 ÷ 앞 변 = " + f2(tableRatio) + " (= 100 ÷ 180)");
  wrap.append(a, b);
  return wrap;
}
function contourFig(node){
  const s = svg(SL_VB, "", SL_FS); node.appendChild(s);
  stillLife(s);
  el(s, "line", {x1: SL_BB[0], y1: pr(0, TBL, 66)[1], x2: SL_BB[0] + SL_BB[2], y2: pr(0, TBL, 66)[1], class: "dl-soft", "stroke-dasharray": "2 4"});
  const ps = contourParts().map(d => el(s, "path", {d, class: "dl-ln", "stroke-width": 2.6}));
  const dot = el(s, "circle", {r: 4, fill: "var(--ltt-accent)"});
  // 그림이 문서에 붙기 전에는 getTotalLength가 0이라 길이는 그릴 때 잰다.
  let lens = null, total = 0;
  LTT.clock(s, t => {
    if (!lens || total === 0){
      lens = ps.map(p => p.getTotalLength ? p.getTotalLength() : 0);
      total = lens.reduce((a, b) => a + b, 0);
      ps.forEach((p, i) => p.setAttribute("stroke-dasharray", lens[i] + " " + (lens[i] + 1)));
    }
    let rest = total * Math.min(1, t / 6000);
    ps.forEach((p, i) => {
      const done = Math.max(0, Math.min(lens[i], rest));
      p.setAttribute("stroke-dashoffset", lens[i] - done);
      if (rest > 0 && rest <= lens[i] && p.getPointAtLength){ const q = p.getPointAtLength(done); dot.setAttribute("cx", q.x); dot.setAttribute("cy", q.y); }
      rest -= lens[i];
    });
  }, {dur: 6000, id: "contour"});
}
function negFig(node){
  const s = svg(SL_VB, "", SL_FS); node.appendChild(s);
  const defs = el(s, "defs", {});
  const mk = el(defs, "mask", {id: "dl-neg-mask"});
  el(mk, "rect", {x: SL_BB[0], y: SL_BB[1], width: SL_BB[2], height: SL_BB[3], fill: "white"});
  el(mk, "path", {d: D(MG.sil, true), fill: "black"});
  BOX.faces.filter(fc => fc.vis).forEach(fc => el(mk, "path", {d: D(fc.idx.map(i => BOX.P2[i]), true), fill: "black", stroke: "black", "stroke-width": 1}));
  const mugR = Math.max(...MG.sil.map(p => p[0])), boxL = Math.min(...BOX.P2.map(p => p[0]));
  const yTop = Math.min(...BOX.P2.map(p => p[1])), yBot = Math.max(...MG.sil.map(p => p[1]).concat(BOX.P2.map(p => p[1])));
  const mTR = pr(MUG.xc + MUG.r, MUG.y1, MUG.zc), mBR = pr(MUG.xc + MUG.r, MUG.y0, MUG.zc);
  const leftOf = idx => idx.map(i => BOX.P2[i]).reduce((a, b) => b[0] < a[0] ? b : a);
  const bTL = leftOf([4, 5, 6, 7]), bBL = leftOf([0, 1, 2, 3]);
  el(s, "path", {d: D([[mTR[0] - 6, mTR[1]], bTL, bBL, [mBR[0] - 6, mBR[1]]], true), fill: "var(--ltt-accent)", opacity: 0.55, mask: "url(#dl-neg-mask)"});
  el(s, "path", {d: D([mTR, bTL]) + D([mBR, bBL]), class: "dl-soft", "stroke-dasharray": "3 3"});
  el(s, "path", {d: D(MG.hole, true), fill: "var(--ltt-accent)", opacity: 0.75});
  el(s, "path", {d: contourD(), class: "dl-soft", "stroke-width": 1.6});
  const hc = MG.inner[20];
  el(s, "text", {x: hc[0] - 4, y: hc[1] - 30, "text-anchor": "middle", class: "acc"}, "① 손잡이 안쪽");
  el(s, "text", {x: (mugR + boxL) / 2, y: yTop - 6, "text-anchor": "middle", class: "acc"}, "② 사이");
  el(s, "text", {x: SL_BB[0] + 4, y: SL_BB[1] + SL_BB[3] - 4, class: "muted", "font-size": "0.82em"}, "손잡이 모양은 근사");
}
function shapesFig(){
  const s = svg(SL_VB, "", SL_FS);
  const base = el(s, "g", {}); stillLife(base);
  el(base, "path", {d: contourD(), class: "dl-soft"});
  const cyl = el(s, "g", {});
  el(cyl, "path", {d: D(MG.top, true), class: "dl-acc"});

}
