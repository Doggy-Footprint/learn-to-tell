<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증권화와 트랜치</title>
<script type="application/json" id="ltt-meta">{"topic":"증권화","audience":"금융 입문자","theme":"ledger","medium":"경제 신문 도해","decision":"어느 트랜치를 살까","domain":"금융","pattern":["figure"],"mode":"카탈로그용: 장면 하나짜리 본보기. 연결 구조를 \"쪼개지고 합쳐짐\" 움직임과 중앙 주인공 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.sec{width:1120px;max-width:100%;height:auto;display:block;margin:0 auto}
.sec text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (u, a, b) => ease(clamp((u - a) / (b - a)));
const lerp = (a, b, t) => a + (b - a) * t;
const el = (tag, attrs, parent, text) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; parent && parent.appendChild(n); return n; };
// 헤드리스 캡처의 virtual time은 setTimeout·Date.now를 따라가므로 rAF 대신 쓴다
function loop(period, draw, finalU) {
  let id = 0, t0 = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(id); if (reduced) { draw(finalU); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(id); } };
}

// 모델로 계산한 예시: 주택담보대출 16건(건당 62.5억) = 풀 1,000억. 손실 60억은 아래 트랜치부터 흡수한다.
const N = 16, POOL = 1000, LOSS = 60;
const TR = [{ l: "선순위", a: 800, r: "AAA · 연 4.5%", c: "var(--ltt-c1)" }, { l: "중순위", a: 150, r: "BBB · 연 7.0%", c: "var(--ltt-c2)" }, { l: "후순위", a: 50, r: "등급 없음 · 남는 이자 전부", c: "var(--ltt-c3)" }];
const absorb = (loss) => { let left = loss; return TR.slice().reverse().map((t) => { const x = Math.min(t.a, left); left -= x; return x; }).reverse(); };
LTT.expect("후순위 손실", absorb(LOSS)[2], 50);
LTT.expect("중순위 손실", absorb(LOSS)[1], 10);

function securitize(host) {
  const W = 1120, H = 580, PX = 500, PW = 120, PY = 70, PH = 400, UNIT = PH / POOL;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "sec", "data-annotate": "" }, host);
  const hdr = (x, t, anchor) => el("text", { x, y: 36, "text-anchor": anchor || "middle", style: "font-size:15px;font-weight:700;letter-spacing:.06em;fill:var(--ltt-muted)" }, s, t);
  hdr(172, "① 은행의 대출 16건"); const h2 = hdr(PX + PW / 2, "② 하나로 묶은 풀"); hdr(PX + PW + 20, "③ 순서대로 나눈 트랜치", "start");
  const loans = []; let defaultX = null;
  for (let i = 0; i < N; i++) {
    const c = i % 4, r = Math.floor(i / 4);
    const home = { x: 70 + c * 56, y: 150 + r * 66 };
    el("rect", { x: home.x, y: home.y, width: 44, height: 44, rx: 4, class: "ghost", style: "fill:none;stroke:var(--ltt-line-2);stroke-width:1.2;stroke-dasharray:3 3" }, s);
    const g = el("g", {}, s);
    el("rect", { x: 0, y: 0, width: 44, height: 44, rx: 4, style: "fill:var(--ltt-card);stroke:var(--ltt-ink-2);stroke-width:1.5" }, g);
    el("path", { d: "M12,26 L22,17 L32,26 L32,34 L12,34 Z", style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:1.6;stroke-linejoin:round" }, g);
    loans.push({ g, home, slot: { x: PX, y: PY + i * (PH / N) } });
    if (i === 13) defaultX = el("rect", { x: home.x - 3, y: home.y - 3, width: 50, height: 50, rx: 5, style: "fill:var(--ltt-bad-soft);stroke:var(--ltt-bad);stroke-width:2.5" }, s);
  }
  el("text", { x: 172, y: 440, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-ink-2)" }, s, "주택담보대출 건당 62.5억");
  const defT = el("text", { x: 172, y: 466, "text-anchor": "middle", style: "font-size:15px;font-weight:700;fill:var(--ltt-bad)" }, s, "1건 부도 → 회수 못한 60억");
  const poolR = el("rect", { x: PX, y: PY, width: PW, height: PH, style: "fill:var(--ltt-card-2);stroke:var(--ltt-ink);stroke-width:2" }, s);
  const poolT = el("text", { x: PX + PW / 2, y: PY + PH + 30, "text-anchor": "middle", style: "font-size:20px;font-weight:800;fill:var(--ltt-ink)" }, s, "풀 1,000억");
  const tr = []; let acc = 0;
  TR.forEach((t, i) => {
    const h = t.a * UNIT, y = PY + acc * UNIT; acc += t.a;
    const r = el("rect", { x: PX, y, width: PW, height: h, style: `fill:${t.c}` }, s);
    const lab = el("g", {}, s);
    const ty = i === 0 ? y + h / 2 : i === 1 ? y + h / 2 + 2 : y + h / 2 + 20;
    el("text", { x: 0, y: ty - 4, style: "font-size:20px;font-weight:800;fill:var(--ltt-ink)" }, lab, `${t.l} ${t.a}억`);
    el("text", { x: 0, y: ty + 18, style: "font-size:15px;fill:var(--ltt-ink-2)" }, lab, t.r);
    const lt = el("text", { x: 0, y: ty + 40, style: "font-size:15px;font-weight:700;fill:var(--ltt-bad)" }, lab, [" ", "−10억", "−50억 전액"][i]);
    tr.push({ r, lab, lt, y, h, dy: i * 26 });
  });
  const loss = el("rect", { x: 0, width: PW, style: "fill:var(--ltt-bad);opacity:.85" }, s);
  const lossT = el("text", { "text-anchor": "end", style: "font-size:17px;font-weight:800;fill:var(--ltt-bad)" }, s, `대출 손실 ${LOSS}억`);
  const lossS = el("text", { "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s, "아래 칸부터 깎인다");

  function draw(u) {
    const merge = seg(u, 0.32, 0.4), split = seg(u, 0.42, 0.56), hit = seg(u, 0.62, 0.78), out = 1 - seg(u, 0.92, 0.99);
    loans.forEach((L, i) => {
      const k = seg(u, 0.05 + i * 0.012, 0.22 + i * 0.012);
      const x = lerp(L.home.x, L.slot.x, k), y = lerp(L.home.y, L.slot.y, k);
      const sx = lerp(1, PW / 44, k), sy = lerp(1, (PH / N) / 44, k);
      L.g.setAttribute("transform", `translate(${x},${y}) scale(${sx},${sy})`);
      L.g.style.opacity = (1 - merge) * out;
    });
    poolR.style.opacity = merge * (1 - split) * out;
    poolT.style.opacity = merge * (1 - split) * out; h2.style.opacity = 1 - split * 0.6;
    const tx = PX;
    tr.forEach((t, i) => {
      t.r.setAttribute("x", tx); t.r.setAttribute("y", t.y + t.dy * split);
      t.r.style.opacity = merge * out;
      t.lab.setAttribute("transform", `translate(${tx + PW + 20},${t.dy * split})`);
      t.lab.style.opacity = split * out;
    });
    const bottom = tr[2].y + tr[2].h + tr[2].dy * split, lh = LOSS * UNIT * hit;
    const eq = 50 * UNIT, mz = 10 * UNIT;
    loss.setAttribute("x", tx);
    const eqH = Math.min(lh, eq), mzH = Math.max(0, lh - eq);
    loss.setAttribute("y", bottom - eqH); loss.setAttribute("height", eqH);
    mzLoss.setAttribute("x", tx); mzLoss.setAttribute("y", tr[1].y + tr[1].dy + tr[1].h - mzH); mzLoss.setAttribute("height", mzH);
    loss.style.opacity = mzLoss.style.opacity = hit > 0 ? out : 0;
    lossT.setAttribute("x", tx - 16); lossT.setAttribute("y", bottom - 22); lossS.setAttribute("x", tx - 16); lossS.setAttribute("y", bottom - 2);
    tr.forEach((t) => t.lt.style.opacity = hit * out);
    defaultX.style.opacity = defT.style.opacity = seg(u, 0.58, 0.64) * out;
    lossT.style.opacity = lossS.style.opacity = seg(u, 0.58, 0.64) * out;
  }
  const mzLoss = el("rect", { width: PW, style: "fill:var(--ltt-bad);stroke:var(--ltt-bad);stroke-width:2" }, s);
  return { el: s, draw };
}

let F = null;
LTT.deck({
  title: "증권화", theme: "ledger",
  glossary: { "증권화": "대출 여러 건을 묶어 그 원리금을 받을 권리를 증권으로 나눠 파는 것", "트랜치": "같은 풀에서 손실을 먼저 떠안는 순서로 나눈 증권 한 층" },
  scenes: [{
    type: "figure", kicker: "증권화", title: "대출을 하나로 묶고, 손실을 받는 순서로 다시 나눈다",
    sub: "가운데 풀이 주인공이다. 대출이 모여 풀이 되고, 풀이 {{트랜치}} 세 층으로 갈라진다.",
    figure: (h) => (F = securitize(h)),
    caption: "{{증권화}}에서 손실 60억이 나면 후순위 50억이 먼저 사라지고 나머지 10억만 중순위가 떠안는다. 선순위는 그대로다.",
    basis: "금액·금리는 모델로 계산한 예시. 선순위 약 80%·후순위 수 %의 구조는 주택저당증권(RMBS) 발행의 흔한 비율이다.",
    mount() { return loop(9000, (u) => F.draw(u), 0.85); }
  }]
});
</script>
</body>
</html>
