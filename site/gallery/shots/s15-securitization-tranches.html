<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>증권화</title><script src="/kit/ltt.js"></script></head><body><script>
const TR = [["선순위", 800, "AAA 4.5%", "--ltt-accent"], ["중순위", 150, "BBB 7.0%", "--ltt-warn"], ["후순위", 50, "무등급", "--ltt-muted"]];
const LOSS = 60, absorb = TR.map((t, i) => Math.max(0, Math.min(t[1], LOSS - TR.slice(i + 1).reduce((a, u) => a + u[1], 0))));
LTT.expect("후순위 손실", absorb[2], 50); LTT.expect("중순위 손실", absorb[1], 10);
const PX = 44, PW = 12, PY = 14, PH = 70, U = PH / 1000, shapes = {}, st = { gather: {}, pool: {}, split: {}, loss: {} };
const all = (id, v) => Object.keys(st).forEach((k) => (st[k][id] = { ...st[k][id], ...v }));
for (let i = 0; i < 16; i++) {
  const home = { x: 4 + (i % 4) * 8, y: 22 + Math.floor(i / 4) * 15, width: 6, height: 11 };
  if (i % 4 === 0) shapes["h" + i] = { kind: "rect", x: 3, y: home.y - 1, width: 31, height: 13, fill: "--ltt-line", opacity: 0.3 };
  shapes["l" + i] = { kind: "rect", ...home, fill: i === 13 ? "--ltt-bad" : "--ltt-ink" };
  all("l" + i, { x: PX, y: PY + i * PH / 16, width: PW, height: PH / 16 - 0.4 }); st.pool["l" + i].opacity = 0; st.split["l" + i].opacity = 0; st.loss["l" + i].opacity = 0;
}
shapes.pool = { kind: "rect", x: PX, y: PY, width: PW, height: PH, fill: "--ltt-ink", opacity: 0 }; st.pool.pool = { opacity: 1 };
let acc = 0;
TR.forEach(([name, amt, rate, fill], i) => {
  const y = PY + acc * U, h = amt * U, dy = i * 4; acc += amt;
  shapes["t" + i] = { kind: "rect", x: PX, y, width: PW, height: h, fill, opacity: 0 };
  shapes["n" + i] = { kind: "label", x: 79, y: y + dy + h / 2, text: `${name} ${amt}억 · ${rate}`, opacity: 0 };
  st.split["t" + i] = st.loss["t" + i] = { y: y + dy, opacity: 1 }; st.split["n" + i] = st.loss["n" + i] = { opacity: 1 };
  if (!absorb[i]) return;
  shapes["x" + i] = { kind: "rect", x: PX, y: y + dy + h, width: PW, height: 0, fill: "--ltt-bad", opacity: 0 };
  st.loss["x" + i] = { y: y + dy + h - absorb[i] * U, height: absorb[i] * U, opacity: 1 };
  st.loss["n" + i] = { opacity: 1, text: `${name} ${amt}억 → −${absorb[i]}억${amt === absorb[i] ? " 전액" : ""}` };
});
Object.assign(shapes, {
  a: { kind: "label", x: 18, y: 8, text: "① 대출 16건" }, b: { kind: "label", x: PX + PW / 2, y: 8, text: "② 풀 1,000억" },
  c: { kind: "label", x: 80, y: 8, text: "③ 트랜치 세 층", opacity: 0 }
  , d: { kind: "label", x: 18, y: 86, text: "1건 부도 → 손실 60억" }
});
st.split.c = st.loss.c = { opacity: 1 };
LTT.deck({
  title: "증권화", theme: "ledger", exemplar: true,
  glossary: { "증권화": "대출 여러 건을 묶어 그 원리금을 받을 권리를 증권으로 나눠 파는 것", "트랜치": "같은 풀에서 손실을 먼저 떠안는 순서로 나눈 증권 한 층" },
  scenes: [{
    type: "figure", kicker: "증권화", title: "대출을 하나로 묶고, 손실을 받는 순서로 다시 나눈다",
    sub: "가운데 풀이 주인공이다. 대출이 모여 풀이 되고, 풀이 {{트랜치}} 세 층으로 갈라진다. 흐린 칸은 떠난 대출의 자리다.",
    visual: LTT.morph({ aspect: 1.6, shapes, states: st }),
    motion: [["wait", 0.6], ["to", { state: "gather", dur: 1.8 }], ["to", { state: "pool", dur: 0.8 }], ["to", { state: "split", dur: 1.2 }], ["wait", 0.6], ["to", { state: "loss", dur: 1.8 }]],
    narration: "{{증권화}}에서 손실 60억이 나면 후순위 50억이 먼저 사라지고 나머지 10억만 중순위가 떠안는다. 선순위는 그대로다.",
    basis: "금액·금리는 모델 예시(대출 건당 62.5억). 선순위 약 80%·후순위 수 %의 구조는 주택저당증권(RMBS) 발행의 흔한 비율이다."
  }]
});
</script></body></html>
