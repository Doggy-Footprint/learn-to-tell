<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>클럭과 동적 전력</title><script src="/kit/ltt.js"></script></head><body><script>
// P = α·C·V²·f. 같은 칩이면 α·C는 상쇄되어 비율은 (f₂/f₁)·(V₂/V₁)². 같은 6 ns 창에서 클럭마다 V² 블록 하나
const SIDES = [{ name: "지금 1.0 GHz · 0.8 V", V: 0.8, n: 6, x: 2 }, { name: "목표 1.5 GHz · 1.0 V", V: 1.0, n: 9, x: 52 }];
const TOP = 26, BASE = 94, UNIT = 6.8, STEPS = 18, AR = 1.8;
const P = (x, y) => `${x} ${y}`;
LTT.expect("전력 비율 1.5GHz·1.0V / 1.0GHz·0.8V", (9 * 1.0) / (6 * 0.64), 2.34375, { tol: 1e-9 });
const shapes = {}, states = {};
SIDES.forEach((c, i) => {
  const dy = (BASE - TOP) / c.n, h = UNIT * c.V * c.V;
  shapes["t" + i] = { kind: "label", x: c.x + 22, y: 3, text: c.name };
  shapes["u" + i] = { kind: "label", x: c.x + 22, y: 11, text: `6 ns에 클럭 ${c.n}번` };
  shapes["v" + i] = { kind: "label", x: c.x + 22, y: 18, text: `블록 V² ${(c.V * c.V).toFixed(2)}` };
  shapes["w" + i] = { kind: "path", fill: "none", stroke: "--ltt-muted", strokeWidth: 2, d: Array.from({ length: c.n }, (_, k) => { const y = TOP + k * dy;
    return `${k ? "L" : "M"}${P(c.x + 2, y)} L${P(c.x + 10, y)} L${P(c.x + 10, y + dy / 2)} L${P(c.x + 2, y + dy / 2)} L${P(c.x + 2, y + dy)}`; }).join(" ") };
  shapes["c" + i] = { kind: "rect", x: c.x, y: TOP, width: 12, height: 0.8, fill: "--ltt-ink" };
  shapes["g" + i] = { kind: "rect", x: c.x + 20, y: BASE, width: 22, height: 0.6, fill: "--ltt-muted" };
  shapes["e" + i] = { kind: "label", x: c.x + 31, y: BASE - c.n * h - 5, text: `에너지 ${(c.n * c.V * c.V).toFixed(2)}`, opacity: 0 };
  for (let k = 0; k < c.n; k++) shapes[`b${i}_${k}`] = { kind: "rect", x: c.x + 22, y: BASE - (k + 1) * h - 12, width: 18, height: h - 0.8, fill: "--ltt-accent", opacity: 0 };
  for (let s = 1; s <= STEPS; s++) {
    const st = (states["s" + s] = states["s" + s] || {}), got = Math.floor(s * c.n / STEPS);
    st["c" + i] = { y: TOP + got * dy };
    for (let k = 0; k < got; k++) st[`b${i}_${k}`] = { y: BASE - (k + 1) * h, opacity: 0.85 };
  }
});
states.done = { ...states["s" + STEPS], e0: { opacity: 1 }, e1: { opacity: 1 } };
LTT.deck({
  title: "클럭과 동적 전력", theme: "blueprint", exemplar: true,
  glossary: { "동적 전력": "트랜지스터가 0과 1을 오갈 때마다 배선 정전용량을 충전·방전하며 쓰는 전력. P = α·C·V²·f",
    "DVFS": "Dynamic Voltage and Frequency Scaling. 클럭을 올릴 때 회로가 제때 동작하도록 전압도 함께 올리는 방식" },
  scenes: [{
    type: "predict", kicker: "예측", title: "클럭을 1.5배 올리면 동적 전력은 몇 배가 될까?",
    sub: "{{DVFS}} 표에서 1.0→1.5 GHz로 가려면 전압도 0.8→1.0 V로 올린다. 커서가 클럭을 지날 때마다 V² 블록이 쌓인다.",
    visual: LTT.morph({ aspect: AR, mobileAspect: 1.3, shapes, states }),
    q: "같은 칩의 {{동적 전력}}은 몇 배가 될까?",
    choices: ["1.5배", "약 1.9배", "약 2.3배", "약 3.5배"], answer: 2,
    why: "블록 개수가 1.5배(f), 블록 높이가 (1.0/0.8)² ≈ 1.56배(V²)라 1.5 × 1.56 ≈ 2.3배다.",
    motion: [...Array.from({ length: STEPS }, (_, s) => ["to", { state: "s" + (s + 1), dur: 0.33 }]), ["wait", 0.6], ["mark", "ask"], ["to", { state: "done", dur: 0.6 }], ["wait", 2]],
    takeaway: "클럭을 올리면 전압도 따라 올라 동적 전력은 주파수보다 훨씬 빨리 커진다.",
    recall: { q: "f를 1.5배, V를 1.25배 올리면 동적 전력은?", a: "1.5 × 1.25² ≈ 2.3배. 블록 개수(f)와 블록 크기(V²)가 함께 커진다." },
    basis: "P = α·C·V²·f(Weste & Harris, CMOS VLSI Design). 전압 값은 모바일 SoC DVFS 표에서 흔한 범위의 예시."
  }]
});
</script></body></html>
