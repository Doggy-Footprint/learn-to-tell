<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>코드 분할 전후</title><script src="/kit/ltt.js"></script></head><body><script>
const MODS = [["react", "react-dom", 130, "main"], ["router", "react-router", 60, "main"], ["app", "앱 코드", 140, "main"],
  ["chart", "chart.js", 200, "reports"], ["moment", "moment+로캘", 290, "reports"], ["editor", "quill 편집기", 210, "write"]];
const bundle = (side, files, map) => LTT.chart({
  x: { cats: files }, y: { label: "KB", domain: [0, 1100] }, stack: true,
  series: MODS.map(([id, label, kb, to]) => ({ id: side + id, label, type: "bar", values: files.map((f) => (map ? to + ".js" : "main.js") === f ? kb : 0) })) });
const grow = (side) => MODS.map(([id]) => ["grow", { id: side[0] + id, side, dur: 0.7 }]);
LTT.deck({
  title: "코드 분할 전후", theme: "studio", exemplar: true,
  glossary: { "번들": "빌드 도구가 여러 모듈을 묶어 만든 JS 파일", "코드 분할": "import()로 경계를 그어 화면마다 따로 받는 파일로 번들을 나누는 것" },
  scenes: [{
    type: "compare", title: "같은 모듈을 나눠 담으면 첫 화면이 받는 양이 3분의 1로 준다",
    sub: "모듈 여섯 개가 하나씩 파일 막대에 쌓인다. 막대 높이가 {{번들}} 크기다. reports·write는 그 화면에 갈 때만 받는다.",
    left: { label: "분할 전 · 한 파일", tag: "첫 화면 1,030KB", tone: "bad", visual: bundle("l", ["main.js"]), text: "모든 모듈이 main.js 하나에 쌓여 첫 화면에서 1,030KB를 받는다." },
    right: { label: "{{코드 분할}} 후", tag: "첫 화면 330KB", tone: "good", visual: bundle("r", ["main.js", "reports.js", "write.js"], true), text: "차트·날짜·편집기 모듈이 경로별 파일로 빠지고 main.js에는 330KB만 남는다." },
    motion: [...grow("left"), ["wait", 0.6], ...grow("right")],
    basis: "모듈 크기는 bundlephobia의 minified 크기 대략값으로 버전마다 다르다. 합계와 첫 화면 크기는 모델로 계산한 예시."
  }]
});
</script></body></html>
