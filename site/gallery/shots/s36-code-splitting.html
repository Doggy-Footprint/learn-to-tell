<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 분할 전후</title>
<script type="application/json" id="ltt-meta">{"topic":"앱 번들 구성과 코드 분할","audience":"프런트엔드 개발자","theme":"studio","medium":"번들 분석기 화면","decision":"무엇을 첫 화면 번들에서 떼어 낼까","domain":"프런트엔드","pattern":["contrast"],"mode":"카탈로그용: 장면 하나짜리 본보기. 부분-전체 구조를 \"선이 그려짐\" 움직임과 전면 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.bd{width:100%;display:block}
.bd text{font-family:inherit}
.ltt-ba-side{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.ltt-ba-rail{order:-1;padding:0}
.ltt-ba-stage{padding:8px}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent, text) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; parent && parent.appendChild(n); return n; };
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PERIOD = 8;
const draws = [];

// 압축 전 minified 크기의 대략값(bundlephobia 기준, 버전마다 다르다). 모델로 계산한 예시
const MODS = [
  { id: "react", l: "react-dom", kb: 130, c: 1 }, { id: "router", l: "react-router", kb: 60, c: 2 },
  { id: "app", l: "앱 코드", kb: 140, c: 3 }, { id: "chart", l: "chart.js · /reports", kb: 200, c: 4 },
  { id: "moment", l: "moment + 로캘 · /reports", kb: 290, c: 5 }, { id: "editor", l: "quill 편집기 · /write", kb: 210, c: 6 }];
const SPLIT = { react: "main", router: "main", app: "main", chart: "reports", moment: "reports", editor: "write" };
const PX = 0.27;

function bundle(host, o) {
  const s = mk("svg", { viewBox: "0 0 560 400", class: "bd" }, host);
  const rowH = 52, y0 = 40;
  const chunks = o.chunks.map((c) => ({ ...c, kb: MODS.filter((m) => o.map[m.id] === c.id).reduce((a, m) => a + m.kb, 0) }));
  mk("text", { x: 8, y: 22, style: "font-size:13px;fill:var(--ltt-muted)" }, s, "import한 모듈");
  mk("text", { x: 372, y: 22, style: "font-size:13px;fill:var(--ltt-muted)" }, s, "만들어진 파일");
  let cy = y0; const fill = {};
  chunks.forEach((c) => {
    c.y = cy; c.h = c.kb * PX; cy += c.h + 26; fill[c.id] = c.y;
    mk("rect", { x: 372, y: c.y, width: 64, height: c.h, rx: 4, style: `fill:none;stroke:var(--ltt-ink-2);stroke-width:1.5;${c.lazy ? "stroke-dasharray:5 4" : ""}` }, s);
    mk("text", { x: 446, y: c.y + 15, style: `font-size:14px;font-weight:700;fill:var(${c.lazy ? "--ltt-ink-2" : "--ltt-ink"})` }, s, c.file);
    mk("text", { x: 446, y: c.y + 33, style: "font-size:13px;fill:var(--ltt-muted)" }, s, `${c.kb.toLocaleString()} KB${c.lazy ? " · 필요할 때" : " · 첫 화면"}`);
  });
  const items = MODS.map((m, i) => {
    const y = y0 + i * rowH + 14;
    mk("circle", { cx: 150, cy: y, r: 4, style: `fill:var(--ltt-c${m.c})` }, s);
    mk("text", { x: 140, y: y - 2, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink)" }, s, m.l.split(" · ")[0]);
    mk("text", { x: 140, y: y + 14, "text-anchor": "end", style: "font-size:12px;fill:var(--ltt-muted)" }, s, m.kb + " KB" + (m.l.includes(" · ") ? " · " + m.l.split(" · ")[1] : ""));
    const c = chunks.find((k) => k.id === o.map[m.id]);
    const sy = fill[c.id], sh = m.kb * PX; fill[c.id] += sh;
    const ty = sy + sh / 2;
    const path = mk("path", { d: `M154,${y} C260,${y} 270,${ty} 370,${ty}`, style: `fill:none;stroke:var(--ltt-c${m.c});stroke-width:2;opacity:.9` }, s);
    const seg = mk("rect", { x: 373, y: sy + 0.5, width: 62, height: Math.max(0, sh - 1), style: `fill:var(--ltt-c${m.c});opacity:.85;transform-origin:373px ${sy}px` }, s);
    return { path, L: path.getTotalLength(), seg };
  });
  const first = chunks.filter((c) => !c.lazy).reduce((a, c) => a + c.kb, 0);
  const big = mk("text", { x: 8, y: 388, style: `font-size:28px;font-weight:700;fill:var(${o.tone})` }, s, first.toLocaleString() + " KB");
  mk("tspan", { dx: 12, style: "font-size:13px;font-weight:400;fill:var(--ltt-muted)" }, big, "첫 화면에서 받는 JS");
  const draw = (t) => {
    const u = t % PERIOD;
    const out = u > 7.2 ? 1 - ease(clamp((u - 7.2) / .6)) : 1;
    items.forEach((it, i) => {
      const k = ease(clamp((u - 0.3 - i * 0.45) / 0.9));
      it.path.style.strokeDasharray = it.L; it.path.style.strokeDashoffset = it.L * (1 - k); it.path.style.opacity = .9 * out;
      const g = ease(clamp((u - 0.3 - i * 0.45 - 0.8) / 0.4));
      it.seg.style.transform = `scaleY(${g})`; it.seg.style.opacity = .85 * out;
    });
  };
  draw(reduced ? 6 : 0);
  draws.push(draw);
  return s;
}

function runLoops() {
  let tm = 0, t0 = 0;
  return { enter() { clearTimeout(tm); if (reduced) return; t0 = Date.now();
      const f = () => { const t = (Date.now() - t0) / 1000; draws.forEach((g) => g(t)); tm = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(tm); } };
}

LTT.deck({
  title: "코드 분할 전후", theme: "studio",
  glossary: { "번들": "빌드 도구가 여러 모듈을 묶어 만든 JS 파일", "코드 분할": "import()로 경계를 그어 화면마다 따로 받는 파일로 번들을 나누는 것" },
  scenes: [{
    type: "contrast", title: "같은 모듈을 나눠 담으면 첫 화면이 받는 양이 3분의 1로 준다", en: "Bundle before and after code splitting",
    sub: "왼쪽 모듈에서 선이 그려져 오른쪽 {{번들}} 파일을 채운다. 막대 높이는 파일 크기다. 점선 파일은 그 화면에 갈 때만 받는다.",
    before: { label: "분할 전 · 한 파일", tone: "before", visual: (el) => bundle(el, { tone: "--ltt-bad",
      chunks: [{ id: "main", file: "main.js" }], map: Object.fromEntries(MODS.map((m) => [m.id, "main"])) }) },
    after: { label: "{{코드 분할}} 후 · 경로별 파일", tone: "after", visual: (el) => bundle(el, { tone: "--ltt-good",
      chunks: [{ id: "main", file: "main.js" }, { id: "reports", file: "reports.js", lazy: true }, { id: "write", file: "write.js", lazy: true }], map: SPLIT }) },
    basis: "모듈 크기는 bundlephobia의 minified 크기 대략값으로 버전마다 다르다. 합계와 첫 화면 크기는 모델로 계산한 예시.",
    mount: () => runLoops()
  }]
});
</script>
</body>
</html>
