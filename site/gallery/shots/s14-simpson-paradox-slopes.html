<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>심슨의 역설</title><script src="/kit/ltt.js"></script></head><body><script>
const OFF = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5], NOISE = [4, -6, 2, -3, 5, -2, 3];
const GROUPS = [["20대", 2, 180, "accent"], ["40대", 4, 205, "warn"], ["60대", 6, 230, "good"]].map(([label, cx, b, tone], gi) =>
  ({ label, tone, pts: OFF.map((o, i) => [cx + o, b - 6 * o + NOISE[(i + gi * 2) % 7]]) }));
const fit = (pts) => { const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  const m = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
  const x0 = Math.min(...pts.map((p) => p[0])) - 0.3, x1 = Math.max(...pts.map((p) => p[0])) + 0.3;
  return { m, line: [[x0, my + m * (x0 - mx)], [x1, my + m * (x1 - mx)]] }; };
const ALL = GROUPS.flatMap((g) => g.pts), POOLED = fit(ALL);
LTT.expect("합친 기울기", POOLED.m, 7.27, { tol: 0.01 });
const axes = { x: { domain: [0, 8], fmt: (v) => (v % 2 ? "" : v) }, y: { domain: [150, 260] } };
const slope = (m) => `기울기 ${m > 0 ? "+" : "−"}${Math.abs(m).toFixed(1)}`;
LTT.deck({
  title: "심슨의 역설", theme: "paper", exemplar: true,
  glossary: { "심슨의 역설": "집단마다 같은 방향인 관계가 집단을 합치면 반대 방향으로 보이는 현상", "교란 변수": "원인과 결과 양쪽에 함께 영향을 주어 관계를 왜곡하는 변수(여기서는 나이)" },
  scenes: [{
    type: "figure", kicker: "심슨의 역설", title: "합치면 오르는 선이, 나누면 셋 다 내려간다",
    sub: "같은 21명, 같은 축(가로 주당 운동 시간, 세로 LDL mg/dL)이다. {{교란 변수}}인 나이로 나누면 {{심슨의 역설}}이 드러난다.",
    takeaway: "나이대 안에서는 셋 다 내려간다. 나이가 운동과 콜레스테롤을 함께 올렸다",
    visual: LTT.multiples({ cols: 4, panels: [
      { title: "합친 21명", part: LTT.chart({ ...axes, legend: false, aspect: 0.75,
        series: [{ id: "all", type: "dot", points: ALL, tone: "ink" }, { id: "pooled", label: slope(POOLED.m), type: "line", points: POOLED.line, tone: "bad" }] }) },
      ...GROUPS.map((g) => ({ title: g.label, part: LTT.chart({ ...axes, legend: false, aspect: 0.75,
        series: [{ id: "pts", type: "dot", points: g.pts, tone: g.tone }, { id: "fit", label: slope(fit(g.pts).m), type: "line", points: fit(g.pts).line, tone: g.tone }] }) }))] }),
    motion: [
      ["draw", { id: "pooled", dur: 2 }], ["wait", 0.6],
      ["draw", { id: "fit", panel: 1, dur: 1 }], ["draw", { id: "fit", panel: 2, dur: 1 }], ["draw", { id: "fit", panel: 3, dur: 1 }]
    ],
    basis: "점은 모델 예시. 구도는 Pearl·Glymour·Jewell, Causal Inference in Statistics: A Primer(2016)의 예시"
  }]
});
</script></body></html>
