<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 세트와 메모리 계층</title><script src="/kit/ltt.js"></script></head><body><script>
// AMD Zen 4(Ryzen 9 7950X) 코어 하나 기준 대략값. 크기는 log2(바이트)
const LV = [["L1", 15, 0.8], ["L2", 20, 2.8], ["L3", 25, 10], ["DRAM", 36, 80]];
// 무작위 접근·완전 연관 가정: 각 계층이 작업 세트 중 자기 용량만큼을 맡는다
const avgNs = (e) => { let prev = 0, sum = 0; for (const [, c, ns] of LV) { const f = Math.min(1, 2 ** (c - e)); sum += (f - prev) * ns; prev = f; if (f >= 1) break; } return sum; };
LTT.expect("작업 세트 4MB 평균 지연", avgNs(22), 8.18, { tol: 0.01 });
const size = (e) => e >= 30 ? 2 ** (e - 30) + "GB" : e >= 20 ? 2 ** (e - 20) + "MB" : 2 ** (e - 10) + "KB";
const X = (e) => 54 + 40 * (e - 12) / 18, Y = (e) => 86 - 78 * (Math.log10(avgNs(e)) + 0.3) / 2.3, rowY = (i) => 8 + i * 22;
const wOf = (e) => 6 + (e - 15) * 1.75, fit = (e) => LV.findIndex(([, c]) => e <= c), N = 8;
const figure = (target) => {
  const sh = {}, st = {}, curve = [];
  for (let e = 12; e <= 30; e += 0.25) curve.push(`${X(e)} ${Y(e)}`);
  LV.forEach(([id, c], i) => { const w = Math.min(42, wOf(c));
    sh["r" + i] = { kind: "rect", x: 25 - w / 2, y: rowY(i), width: w, height: 17, fill: "--ltt-line" };
    sh["h" + i] = { kind: "rect", x: 25 - w / 2, y: rowY(i), width: w, height: 17, fill: "--ltt-accent-soft", opacity: 0 };
    if (i < 3) { sh["ref" + i] = { kind: "line", x1: X(c), y1: 8, x2: X(c), y2: 86, stroke: "--ltt-line" };
      sh["rl" + i] = { kind: "label", x: X(c) + 0.5, y: 6, text: id + " 끝", anchor: "l", tone: "muted" }; } });
  sh.ws = { kind: "rect", x: 24, y: rowY(0) + 3, width: 2, height: 11, fill: "--ltt-accent", opacity: 0.6 };
  LV.forEach(([id, c], i) => { sh["l" + i] = { kind: "label", x: 25, y: rowY(i) + 8.5, text: `${id} ${size(c)}`, cls: "strong" }; });
  sh.ax = { kind: "line", x1: 54, y1: 86, x2: 94, y2: 86, stroke: "--ltt-ink" }; sh.ay = { kind: "line", x1: 54, y1: 8, x2: 54, y2: 86, stroke: "--ltt-ink" };
  [12, 20, 30].forEach((e) => { sh["xt" + e] = { kind: "label", x: X(e), y: 92, text: size(e), tone: "muted" }; });
  [1, 10, 100].forEach((v) => { sh["yt" + v] = { kind: "label", x: 53, y: 86 - 78 * (Math.log10(v) + 0.3) / 2.3, text: v + "ns", anchor: "r", tone: "muted" }; });
  sh.curve = { kind: "path", d: "M" + curve.join(" L"), stroke: "--ltt-accent", fill: "none" };
  sh.dot = { kind: "circle", cx: X(12), cy: Y(12), r: 1.3, fill: "--ltt-accent" };
  for (let k = 1; k <= N; k++) { const e = 12 + (target - 12) * k / N, j = fit(e), w = Math.min(wOf(LV[j][1]) - 1, Math.max(2, wOf(e)));
    st["s" + k] = { ws: { x: 25 - w / 2, width: w, y: rowY(j) + 3 }, dot: { cx: X(e), cy: Y(e) } };
    LV.forEach((_, i) => { st["s" + k]["h" + i] = { opacity: i === j ? 1 : 0 }; }); }
  return LTT.morph({ aspect: 2, shapes: sh, states: st });
};
LTT.deck({
  title: "작업 세트와 메모리 계층", theme: "blueprint", exemplar: true,
  glossary: { "작업 세트": "프로그램이 짧은 시간 동안 되풀이해 만지는 데이터의 크기",
    "캐시": "CPU 가까이 둔 작고 빠른 메모리. L1이 가장 작고 빠르며 L3로 갈수록 크고 느리다" },
  scenes: [{
    type: "play", title: "작업 세트가 한 층을 넘칠 때마다 접근 지연이 계단을 오른다",
    sub: "두 그림의 가로는 같은 log 눈금이다. {{작업 세트}} 막대가 맞는 {{캐시}} 층으로 내려가고, 오른쪽 점은 그때의 평균 지연이다.",
    knobs: [{ id: "e", label: "작업 세트 log2(B)", min: 12, max: 30, value: 22, step: 1 }],
    visual: (p) => figure(p.e),
    motion: [...Array.from({ length: N }, (_, k) => ["to", { state: "s" + (k + 1), dur: 0.35 }]), ["wait", 1.4]],
    readout: (p) => [{ label: "작업 세트", value: size(p.e) }, { label: "평균 지연", value: avgNs(p.e).toFixed(1), unit: "ns", tone: avgNs(p.e) > 40 ? "bad" : "accent" }],
    goal: { text: "평균 지연이 40ns를 넘는 작업 세트를 찾는다", check: (p) => avgNs(p.e) > 40 },
    takeaway: "작업 세트가 L1·L2·L3 용량을 넘을 때마다 평균 지연은 계단으로 오른다.",
    recall: { q: "4MB 작업 세트는 어느 층에 맞고, 평균 지연은 대략 몇 ns인가?", a: "L3(32MB)에 맞고 평균 약 8ns" },
    basis: "Ryzen 9 7950X 대략값: L1d 32KB·약 4사이클, L2 1MB·약 14, L3 32MB·약 50, DRAM 약 80ns. 무작위 접근 가정."
  }]
});
</script></body></html>
