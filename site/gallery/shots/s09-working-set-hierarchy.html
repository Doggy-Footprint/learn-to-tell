<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 세트와 메모리 계층</title>
<script type="application/json" id="ltt-meta">{"topic":"작업 세트 크기와 메모리 계층","audience":"성능을 다루는 개발자","theme":"blueprint","medium":"블록 도면·지연 측정 그래프","decision":"자료 구조를 어느 크기 안에 두나","domain":"컴퓨터 구조","pattern":["mount"],"mode":"카탈로그용: 장면 하나짜리 본보기. 계층 구조를 \"모양이 바뀜\" 움직임과 전면 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.mh{width:100%;max-width:1160px;height:auto;display:block;margin:0 auto}
.mh text{font-family:inherit}
.mh-ctl{display:flex;justify-content:center}
.mh-ctl .ltt-param{min-width:520px}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const KB = 1024, MB = KB * KB, GB = MB * KB;
// AMD Zen 4(Ryzen 9 7950X) 코어 하나 기준 대략값: L1d 32KB·약 4사이클, L2 1MB·약 14사이클, L3 32MB(CCD)·약 50사이클, DRAM DDR5 약 80ns(Chips and Cheese 측정 언저리)
const LV = [{ id: "L1", cap: 32 * KB, ns: 0.8 }, { id: "L2", cap: 1 * MB, ns: 2.8 }, { id: "L3", cap: 32 * MB, ns: 10 }, { id: "DRAM", cap: 64 * GB, ns: 80 }];
// 무작위 접근·완전 연관 가정: 각 계층이 작업 세트 중 자기 용량만큼을 맡는다
function avgNs(ws) { let prev = 0, sum = 0; for (const l of LV) { const f = Math.min(1, l.cap / ws); sum += (f - prev) * l.ns; prev = f; if (f >= 1) break; } return sum; }
LTT.expect("작업 세트 4MB 평균 지연", avgNs(4 * MB), 8.18, { tol: 0.01 });
const fitLevel = (ws) => LV.findIndex((l) => ws <= l.cap);
const fmtB = (b) => b >= GB ? (b / GB).toFixed(b < 10 * GB ? 1 : 0).replace(/\.0$/, "") + "GB" : b >= MB ? (b / MB).toFixed(b < 10 * MB ? 1 : 0).replace(/\.0$/, "") + "MB" : Math.round(b / KB) + "KB";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function hierarchy(host) {
  const W = 1160, H = 440;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "mh", "data-annotate": "" }, host);
  const T = (x, y, t, st, a = "start", p = s) => { const n = mk("text", { x, y, "text-anchor": a, style: st }, p); n.textContent = t; return n; };
  // 왼쪽: 계층 피라미드. 폭은 용량의 log
  const PX = 340, rowH = 78, top = 40, wOf = (b) => 64 + (Math.log2(b) - 13) * 16;
  const rows = LV.map((l, i) => {
    const y = top + i * (rowH + 14), w = wOf(l.cap);
    const r = mk("rect", { x: PX - w / 2, y, width: w, height: rowH, rx: 4, style: "fill:var(--ltt-card);stroke:var(--ltt-line-2);stroke-width:1.5;transition:fill .3s,stroke .3s" }, s);
    const name = T(PX - w / 2 - 14, y + 34, l.id, "font-size:22px;font-weight:700;fill:var(--ltt-ink-2)", "end");
    T(PX - w / 2 - 14, y + 56, `${fmtB(l.cap)} · ${l.ns}ns`, "font-size:13px;fill:var(--ltt-muted)", "end");
    return { r, name, y, w };
  });
  const ws = mk("rect", { rx: 6, style: "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2.5;stroke-dasharray:6 4" }, s);
  const wsT = T(PX, 0, "", "font-size:15px;font-weight:700;fill:var(--ltt-ink)", "middle");
  T(PX, H - 8, "점선 상자 = 작업 세트(자주 만지는 데이터)", "font-size:14px;fill:var(--ltt-muted)", "middle");
  // 오른쪽: 평균 지연 계단
  const gx = 620, gy = 40, gw = 500, gh = 330;
  const x = d3.scaleLog().base(2).domain([4 * KB, GB]).range([gx, gx + gw]);
  const y = d3.scaleLog().domain([0.5, 100]).range([gy + gh, gy]);
  mk("line", { x1: gx, y1: gy + gh, x2: gx + gw, y2: gy + gh, style: "stroke:var(--ltt-ink-2);stroke-width:1.2" }, s);
  mk("line", { x1: gx, y1: gy, x2: gx, y2: gy + gh, style: "stroke:var(--ltt-ink-2);stroke-width:1.2" }, s);
  [1, 10, 100].forEach((v) => { mk("line", { x1: gx, y1: y(v), x2: gx + gw, y2: y(v), style: "stroke:var(--ltt-line);stroke-width:1" }, s); T(gx - 8, y(v) + 5, v + "ns", "font-size:13px;fill:var(--ltt-muted)", "end"); });
  [4 * KB, 64 * KB, MB, 16 * MB, 256 * MB, GB].forEach((v) => T(x(v), gy + gh + 22, fmtB(v), "font-size:13px;fill:var(--ltt-muted)", "middle"));
  T(gx + gw / 2, gy + gh + 48, "작업 세트 크기(log)", "font-size:14px;fill:var(--ltt-muted)", "middle");
  T(gx, gy - 14, "평균 메모리 접근 지연(log) · 모델로 계산한 예시", "font-size:14px;fill:var(--ltt-muted)");
  LV.slice(0, 3).forEach((l) => { mk("line", { x1: x(l.cap), y1: gy, x2: x(l.cap), y2: gy + gh, style: "stroke:var(--ltt-line-2);stroke-width:1;stroke-dasharray:3 4" }, s);
    T(x(l.cap) + 5, gy + 16, l.id + " 끝", "font-size:12px;fill:var(--ltt-muted)"); });
  const pts = d3.range(12, 30.01, 0.05).map((e) => [x(2 ** e), y(avgNs(2 ** e))]);
  mk("path", { d: d3.line()(pts), style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:2" }, s);
  const trail = mk("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:4;stroke-linecap:round" }, s);
  const dot = mk("circle", { r: 8, style: "fill:var(--ltt-accent);stroke:var(--ltt-bg);stroke-width:3" }, s);
  const dotT = T(0, 0, "", "font-size:17px;font-weight:700;fill:var(--ltt-ink)");

  function draw(b) {
    const k = fitLevel(b), R = rows[Math.max(0, k)], e = Math.log2(b);
    // 작업 세트 상자: 폭은 같은 log 눈금, 들어맞는 층으로 내려가며 모양이 납작해진다
    const w = Math.min(wOf(b), R.w - 10), h = Math.max(20, Math.min(rowH - 12, 60 - (e - 12) * 1.2));
    ws.setAttribute("x", PX - w / 2); ws.setAttribute("width", w); ws.setAttribute("y", R.y + (rowH - h) / 2); ws.setAttribute("height", h);
    wsT.setAttribute("y", R.y + rowH / 2 + 5); wsT.textContent = fmtB(b);
    rows.forEach((r, i) => { r.r.style.fill = i === k ? "var(--ltt-card-2)" : "var(--ltt-card)"; r.r.style.stroke = i === k ? "var(--ltt-accent)" : "var(--ltt-line-2)";
      r.name.style.fill = i === k ? "var(--ltt-accent)" : "var(--ltt-ink-2)"; });
    const ns = avgNs(b), px = x(b), py = y(ns);
    dot.setAttribute("cx", px); dot.setAttribute("cy", py);
    trail.setAttribute("d", d3.line()(pts.filter((p) => p[0] <= px).concat([[px, py]])));
    dotT.setAttribute("x", px > gx + gw - 120 ? px - 14 : px + 14); dotT.setAttribute("y", py - 14);
    dotT.setAttribute("text-anchor", px > gx + gw - 120 ? "end" : "start");
    dotT.textContent = ns.toFixed(ns < 10 ? 1 : 0) + "ns";
  }
  return { el: s, draw };
}

LTT.deck({
  title: "작업 세트와 메모리 계층", theme: "blueprint",
  glossary: { "작업 세트": "프로그램이 짧은 시간 동안 되풀이해 만지는 데이터의 크기",
    "캐시": "CPU 가까이 둔 작고 빠른 메모리. L1이 가장 작고 빠르며 L3로 갈수록 크고 느리다" },
  scenes: [{
    title: "작업 세트가 한 층을 넘칠 때마다 접근 지연이 계단을 오른다", en: "Working set vs. memory hierarchy", layout: "full",
    sub: "{{작업 세트}}가 커지면 점선 상자가 넓어지며 아래 층으로 내려간다. 오른쪽 점은 그때의 평균 지연이다. 손잡이를 잡으면 자동 재생이 멈춘다.",
    basis: "AMD Ryzen 9 7950X 코어 기준 대략값(L1d 32KB·약 4사이클, L2 1MB·약 14사이클, L3 32MB·약 50사이클, DRAM 약 80ns). 무작위 접근·완전 연관 {{캐시}} 가정.",
    mount(body) {
      body.innerHTML = `<div id="g"></div><div id="fig"></div><div class="mh-ctl"><div class="ltt-param">작업 세트 <b id="ws-v"></b><input id="ws" type="range"></div></div>`;
      const f = hierarchy(body.querySelector("#fig"));
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let timer = 0, t0 = 0, auto = !reduced;
      const stopAuto = () => { auto = false; clearTimeout(timer); };
      ["pointerdown", "keydown"].forEach((ev) => body.querySelector(".mh-ctl").addEventListener(ev, stopAuto));
      // L1 → L2 → L3 → DRAM 안쪽에서 0.9초씩 머물고 1.3초씩 옮겨 간 뒤 처음으로 돌아온다(8.8초)
      const KEYS = [13.5, 18.5, 23.5, 28.5], HOLD = 0.9, MOVE = 1.3, P = KEYS.length * (HOLD + MOVE);
      const at = (t) => { t %= P; const i = Math.floor(t / (HOLD + MOVE)), r = t - i * (HOLD + MOVE);
        const a = KEYS[i], b = KEYS[(i + 1) % KEYS.length]; return r < HOLD ? a : a + (b - a) * ease((r - HOLD) / MOVE); };
      const tick = () => { if (!auto) return; const b = 2 ** at((Date.now() - t0) / 1000); f.draw(b); body.querySelector("#ws-v").textContent = fmtB(b) + " · 자동 재생"; timer = setTimeout(tick, 16); };
      LTT.sweep({ params: { ws: { kind: "log", min: 4 * KB, max: GB, value: 16 * KB, fmt: fmtB } },
        render: ({ ws }) => { if (!auto) f.draw(ws); },
        goal: { el: "g", text: "평균 지연이 40ns를 넘는 작업 세트를 찾는다", check: ({ ws }) => avgNs(ws) > 40 } });
      f.draw(reduced ? 256 * MB : 2 ** KEYS[0]);
      return { enter() { if (!auto) return; t0 = Date.now(); tick(); }, leave() { clearTimeout(timer); } };
    },
    takeaway: "작업 세트가 L1·L2·L3 용량을 넘을 때마다 평균 지연은 대략 3배씩 계단으로 오른다.",
    recall: "4MB 작업 세트는 어느 층에 맞고, 평균 지연은 대략 몇 ns인가?"
  }]
});
</script>
</body>
</html>
