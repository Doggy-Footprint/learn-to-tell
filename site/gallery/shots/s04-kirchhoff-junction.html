<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>키르히호프 전류 법칙</title><script src="/kit/ltt.js"></script></head><body><script>
const V = 12, I2 = V / 6, I3 = V / 3, I1 = I2 + I3;
LTT.expect("I1", I1, 6, { tol: 1e-9 });
const circuit = LTT.graph({
  layout: "manual", aspect: 1.6,
  nodes: [
    { id: "bat", label: "전지 12 V", sub: "I₁ = 6 A", icon: "bolt", at: [12, 50] }, { id: "A", label: "분기점 A", shape: "round", at: [40, 12] },
    { id: "R3", label: "R₃ = 3 Ω", sub: "I₃ = 4 A", at: [40, 50] }, { id: "R2", label: "R₂ = 6 Ω", sub: "I₂ = 2 A", at: [84, 50] },
    { id: "B", label: "합류점 B", shape: "round", at: [40, 88] }
  ],
  edges: [{ from: "bat", to: "A" }, { from: "A", to: "R3" }, { from: "A", to: "R2" },
    { from: "R3", to: "B" }, { from: "R2", to: "B" }, { from: "B", to: "bat" }]
});
const book = LTT.ledger([
  { id: "in", label: "A로 들어온 점", value: 0 }, { id: "r2", label: "R₂로 나간 점", value: 0, tone: "accent" },
  { id: "r3", label: "R₃로 나간 점", value: 0, tone: "accent" }, { id: "out", label: "나간 점의 합", value: 0, total: true }
]);
const flowAll = (n, dur) => [["flow", { edges: ["bat>A"], n: 3 * n, dur }], ["flow", { edges: ["A>R2", "R2>B"], n, dur }],
  ["flow", { edges: ["A>R3", "R3>B"], n: 2 * n, dur }], ["flow", { edges: ["B>bat"], n: 3 * n, dur }]];
LTT.deck({
  title: "키르히호프 전류 법칙", theme: "blueprint", exemplar: true,
  glossary: { "분기점": "도선 셋 이상이 만나는 점. 전하는 여기서 쌓이지 않고 갈래로 나뉜다" },
  scenes: [{
    type: "figure", title: "분기점에 들어온 전하는 갈래로 나뉠 뿐, 하나도 사라지지 않는다",
    sub: "점 하나가 같은 양의 전하다. 왼쪽은 회로, 오른쪽은 {{분기점}} A를 지난 점을 센 장부다.",
    visual: circuit, side: book,
    motion: [
      { par: [...flowAll(2, 2), ["pulse", { node: "A", dur: 2 }]] },
      { par: [...flowAll(2, 5), ["count", { id: "in", to: 24, digits: 0, dur: 5 }], ["count", { id: "r2", to: 8, digits: 0, dur: 5 }],
        ["count", { id: "r3", to: 16, digits: 0, dur: 5 }], ["count", { id: "out", to: 24, digits: 0, dur: 5 }]] },
      { par: flowAll(2, 1.2) }
    ],
    takeaway: "분기점에서 들어온 전류의 합은 나간 전류의 합과 같다.",
    recall: { q: "6 A가 들어와 한 갈래로 2 A가 나가면 다른 갈래는?", a: "4 A. 들어온 6 A = 나간 2 A + 4 A" },
    basis: "옴의 법칙 I = V/R: 12 V/6 Ω = 2 A, 12 V/3 Ω = 4 A. 모델로 계산한 예시."
  }]
});
</script></body></html>
