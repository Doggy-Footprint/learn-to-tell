<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세포 주기</title><script src="/kit/ltt.js"></script></head><body><script>
// 사람 배양세포 약 24시간 기준(Alberts): 고리 둘레는 실제 시간 비율, 재생 시간은 M기만 늘린다
const PH = [["G1", 11], ["S", 8], ["G2", 4], ["M", 1]];
const CX = 500, CY = 400, R = 270, pt = (a, r) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
const sector = (a0, a1) => { const [x0, y0] = pt(a0, R + 14), [x1, y1] = pt(a1, R + 14), [x2, y2] = pt(a1, R - 14), [x3, y3] = pt(a0, R - 14), big = a1 - a0 > Math.PI ? 1 : 0;
  const q = (x, y) => `${x / 10} ${y / 8}`, rr = (r) => `${r / 10} ${r / 8}`;
  return `M${q(x0, y0)} A${rr(R + 14)} 0 ${big} 1 ${q(x1, y1)} L${q(x2, y2)} A${rr(R - 14)} 0 ${big} 0 ${q(x3, y3)} Z`; };
const shapes = {}, states = { G1: {}, S: {}, G2: {}, Ma: {}, Mb: {}, back: {} };
let acc = 0;
PH.forEach(([id, h], i) => {
  const a0 = acc / 24 * 2 * Math.PI + 0.03, a1 = (acc + h) / 24 * 2 * Math.PI - 0.03, am = (a0 + a1) / 2; acc += h;
  const [lx, ly] = pt(am, R + 40), anchor = Math.sin(am) > 0.3 ? "l" : Math.sin(am) < -0.3 ? "r" : "b";
  shapes["arc" + i] = { kind: "path", d: sector(a0, a1), fill: "--ltt-line" };
  shapes["hi" + i] = { kind: "path", d: sector(a0, a1), fill: "--ltt-accent", opacity: 0 };
  shapes["ph" + i] = { kind: "label", x: lx / 10, y: ly / 8, text: `${id} ${h}시간`, anchor, cls: "strong" };
});
Object.assign(states.G1, { hi0: { opacity: 1 } }); Object.assign(states.S, { hi0: { opacity: 0 }, hi1: { opacity: 1 } });
Object.assign(states.G2, { hi1: { opacity: 0 }, hi2: { opacity: 1 } }); Object.assign(states.Ma, { hi2: { opacity: 0 }, hi3: { opacity: 1 } });
Object.assign(states.back, { hi3: { opacity: 0 } });
shapes.cell = { kind: "circle", cx: 50, cy: 50, r: 8, fill: "--ltt-accent-soft" };
shapes.cell2 = { kind: "circle", cx: 50, cy: 50, r: 8, fill: "--ltt-accent-soft", opacity: 0 };
Object.assign(states.G1, { cell: { r: 11 } }); Object.assign(states.G2, { cell: { r: 12 } });
Object.assign(states.Ma, { cell2: { r: 12, opacity: 1 } });
Object.assign(states.Mb, { cell: { cx: 42.5, r: 9 }, cell2: { cx: 57.5, r: 9 } });
Object.assign(states.back, { cell: { cx: 50, r: 8 }, cell2: { cx: 50, r: 8, opacity: 0 } });
[[-3, -3], [-1, 2], [1.4, -2.6], [3, 1.4]].forEach(([dx, dy], j) => {
  const base = { x: 49.5 + dx, y: 47.5 + dy * 1.25 };
  shapes["c" + j] = { kind: "rect", ...base, width: 1, height: 5, fill: "--ltt-ink" };
  shapes["k" + j] = { kind: "rect", ...base, width: 1, height: 5, fill: "--ltt-accent", opacity: 0 };
  Object.assign(states.S, { ["k" + j]: { x: base.x + 1.4, opacity: 1 } });
  Object.assign(states.Ma, { ["c" + j]: { x: 48.6, y: 38 + j * 6 }, ["k" + j]: { x: 50.4, y: 38 + j * 6 } });
  Object.assign(states.Mb, { ["c" + j]: { x: 42 }, ["k" + j]: { x: 57 } });
  Object.assign(states.back, { ["c" + j]: base, ["k" + j]: { ...base, opacity: 0 } });
});
["G1 · 세포가 자란다", "S · DNA를 2배로 복제", "G2 · 분열을 준비한다", "M · 둘로 나뉜다"].forEach((text, i) => {
  shapes["dna" + i] = { kind: "label", x: 50, y: 70, text, cls: "strong", opacity: i ? 0 : 1 };
});
Object.assign(states.S, { dna0: { opacity: 0 }, dna1: { opacity: 1 } }); Object.assign(states.G2, { dna1: { opacity: 0 }, dna2: { opacity: 1 } });
Object.assign(states.Ma, { dna2: { opacity: 0 }, dna3: { opacity: 1 } }); Object.assign(states.back, { dna3: { opacity: 0 }, dna0: { opacity: 1 } });
const cycle = LTT.morph({ aspect: 1.25, shapes, states });
LTT.deck({
  title: "세포 주기", theme: "paper", exemplar: true,
  glossary: { "세포 주기": "세포가 자라고 DNA를 복제한 뒤 둘로 나뉘기까지 되풀이하는 네 단계(G1, S, G2, M)" },
  scenes: [{
    type: "hook", pre: "세포 주기", text: "23시간 준비, 1시간 분열",
    sub: "{{세포 주기}} 고리의 길이는 실제 시간 비율이다. 진해진 단계마다 가운데 세포의 모양이 바뀐다. M기만 느리게 재생한다.",
    visual: cycle,
    motion: [["to", { state: "G1", dur: 2.6 }], ["to", { state: "S", dur: 2.2 }], ["to", { state: "G2", dur: 1.4 }],
      ["to", { state: "Ma", dur: 1.1 }], ["to", { state: "Mb", dur: 1.3 }], ["wait", 0.4], ["to", { state: "back", dur: 0.6 }]],
    basis: "사람 배양세포 약 24시간 주기 기준(Alberts, Molecular Biology of the Cell). 세포 종류마다 다르다."
  }]
});
</script></body></html>
