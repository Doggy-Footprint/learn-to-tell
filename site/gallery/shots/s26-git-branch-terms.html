<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>git 브랜치 용어</title><script src="/kit/ltt.js"></script></head><body><script>
const extra = ["f1", "f2", "M", "m1>f1", "f1>f2", "m3>M", "f2>M", "m3>f1"];
const commits = LTT.graph({ layout: "manual", aspect: 2.4,
  nodes: [
    { id: "m0", label: "C0", sub: "main", shape: "round", at: [8, 28] }, { id: "m1", label: "C1", shape: "round", at: [24, 28] },
    { id: "m2", label: "C2", shape: "round", at: [40, 28] }, { id: "m3", label: "C3", shape: "round", at: [56, 28] },
    { id: "M", label: "머지", sub: "부모 둘", shape: "round", tone: "accent", at: [72, 28] },
    { id: "f1", label: "F1", sub: "feature", shape: "round", tone: "accent", at: [40, 76] }, { id: "f2", label: "F2", shape: "round", tone: "accent", at: [56, 76] }],
  edges: [{ from: "m0", to: "m1" }, { from: "m1", to: "m2" }, { from: "m2", to: "m3" },
    { from: "m1", to: "f1", tone: "accent", curve: true }, { from: "f1", to: "f2", tone: "accent" },
    { from: "m3", to: "M" }, { from: "f2", to: "M", tone: "accent", dash: true }, { from: "m3", to: "f1", tone: "accent", curve: true }] });
LTT.deck({
  title: "git 브랜치 용어", theme: "sketch", exemplar: true,
  glossary: { "브랜치": "커밋 하나를 가리키는 움직이는 이름표. 새 커밋을 만들면 따라 앞으로 간다",
    "머지": "두 갈래의 끝을 부모 둘인 새 커밋으로 합치는 일", "리베이스": "한 갈래의 커밋을 떼어 다른 갈래 끝에 다시 쌓는 일" },
  scenes: [{
    type: "terms", title: "커밋 그래프는 갈라지고, 합쳐지고, 옮겨 붙는다",
    sub: "같은 커밋 그래프에서 용어마다 동작 하나만 다르다. 위 줄은 main, 아래 색 줄은 feature 갈래다.",
    visual: commits,
    terms: [
      { term: "브랜치", plain: "branch. 한 커밋에서 갈라져 따로 쌓는 줄. git switch -c feature", on: "f1" },
      { term: "머지", plain: "merge. 두 줄 끝을 머지 커밋 하나로 묶는다. 역사는 그대로. git merge feature", on: "M" },
      { term: "리베이스", plain: "rebase. 내 커밋을 main 끝으로 옮겨 다시 만든다. 해시가 바뀐다. git rebase main", on: "f2" }],
    motion: [
      ["hide", { ids: extra, dur: 0.1 }],
      { par: [["show", { ids: ["f1", "f2", "m1>f1", "f1>f2"] }], ["travel", { along: "m1>f1>f2", dur: 1.4 }]] },
      ["wait", 0.6],
      { par: [["show", { ids: ["M", "m3>M", "f2>M"] }], ["travel", { along: "f2>M", dur: 1 }], ["pulse", { node: "M", dur: 1 }]] },
      ["wait", 0.8],
      ["hide", { ids: ["M", "m3>M", "f2>M", "m1>f1"], dur: 0.4 }],
      { par: [["relayout", { to: { f1: [64, 76], f2: [84, 76] }, dur: 1.4 }], ["show", { id: "m3>f1" }],
        ["set", { node: "f1", sub: "새 해시" }], ["set", { node: "f2", sub: "새 해시" }]] },
      ["wait", 1]
    ],
    basis: "Pro Git 3장(Git Branching) 3.1·3.2·3.6절의 그림을 따른다."
  }]
});
</script></body></html>
