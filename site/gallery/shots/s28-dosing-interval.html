<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>투약 간격과 축적</title><script src="/kit/ltt.js"></script></head><body><script>
// 테오필린 성인 반감기 약 8시간(Goodman & Gilman 약동학 표), 1구획 정맥 bolus 모델. 첫 투여 최고 농도 = 1.
const HALF = 8, T = 72, N = 400;
const accum = (tau) => 1 / (1 - 2 ** (-tau / HALF));
LTT.expect("τ=8h 축적 비율", accum(8), 2, { tol: 1e-9 });
const decay = (t0) => Array.from({ length: Math.min(12, Math.floor((T - t0) / 3) + 1) }, (_, i) => [t0 + 3 * i, 2 ** (-i * 3 / HALF)]);
const sum = (tau) => Array.from({ length: 285 }, (_, i) => { const t = i / 4; let c = 0;
  for (let n = 0; n * tau <= t; n++) c += 2 ** (-(t - n * tau) / HALF); return [t, c]; });
// 회당 곡선 여럿을 한 계열로 그리려고 각 곡선을 되짚어 돌아온다(계열 ≤6, 점 ≤400이라 33h에서 자른다). to가 점끼리 잇도록 점 수를 맞추고, 끝 이름표가 x축 눈금에 겹치지 않게 마지막 투여의 꼭대기에서 끝낸다.
const doses = (tau) => { const p = [];
  for (let t0 = 0; t0 <= T; t0 += tau) { const d = decay(t0); p.push([t0, 0], ...d, ...d.reverse(), [t0, 0]); }
  p.pop(); while (p.length < N) p.unshift([0, 0]); return p; };
const ss = (tau) => ({ id: "ss" + tau, label: `τ ${tau}h: 최고 ×${accum(tau).toFixed(1)}`, type: "line", points: [[0, accum(tau)], [T, accum(tau)]], tone: "ink", dash: true });
const set = (tau) => ({ par: [["to", { id: "one", points: doses(tau), dur: 1.2 }], ["to", { id: "sum", points: sum(tau), dur: 1.2 }], ["show", { id: "ss" + tau, dur: 1.2 }]] });
LTT.deck({
  title: "투약 간격과 축적", theme: "lab", exemplar: true,
  glossary: { "반감기": "혈중 농도가 절반으로 줄어드는 데 걸리는 시간", "정상 상태": "들어오는 양과 몸이 없애는 양이 같아져 곡선이 같은 높이에서 오르내리는 상태" },
  scenes: [{
    type: "hook", pre: "약동학", text: "같은 약, 간격만 줄였는데 세 배로 쌓인다",
    sub: "흐린 선은 한 번씩 먹은 약, 굵은 선은 그 합이다. 간격이 {{반감기}}보다 짧으면 앞 약 위에 다음 약이 얹혀 {{정상 상태}}가 올라간다.",
    visual: LTT.chart({
      x: { label: "투여 뒤 시간 (h)", domain: [0, T] }, y: { label: "혈중 농도 (첫 최고 = 1)", domain: [0, 3.8] },
      series: [
        { id: "one", label: "1회분", type: "line", points: doses(16), tone: "muted" },
        { id: "sum", label: "합", type: "line", points: sum(16), tone: "accent" }, ss(16), ss(8), ss(4)],
      refs: [{ id: "half", x: HALF, label: "반감기 8h" }], aspect: 1.2 }),
    motion: [
      { par: [["hide", { ids: ["ss8", "ss4"], dur: 0.01 }], ["draw", { id: "sum", dur: 1.6 }]] }, ["wait", 1.2],
      set(8), ["wait", 1.8], set(4), ["wait", 2]
    ],
    basis: "테오필린 성인 반감기 약 8시간(Goodman & Gilman) 1구획 모델. 축적 비율 = 1 / (1 − 2^(−τ/8)). 모델로 계산한 예시."
  }]
});
</script></body></html>
