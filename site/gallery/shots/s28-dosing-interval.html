<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투약 간격과 축적</title>
<script type="application/json" id="ltt-meta">{"topic":"투약 간격에 따른 혈중 농도 곡선과 반감기","audience":"약리 입문자","theme":"lab","medium":"실험 노트 플롯","decision":"투약 간격","domain":"약리","pattern":["hook"],"mode":"카탈로그용: 장면 하나짜리 본보기. 시간 구조를 \"모양이 바뀜\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.pk-wrap{display:flex;justify-content:center}
.pk{width:900px;max-width:100%;height:auto;display:block}
.pk text{font-family:var(--ltt-mono)}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
// 테오필린 성인 비흡연자 반감기 약 8시간(Goodman & Gilman 부록 약동학 표). 1구획 정맥 bolus 모델, 첫 투여 최고 농도를 1로 둔다.
const HALF = 8, TMAX = 72, YMAX = 3.8;
const conc = (t, tau) => { let c = 0; for (let n = 0; n * tau <= t + 1e-9; n++) c += Math.pow(2, -(t - n * tau) / HALF); return c; };
const accum = (tau) => 1 / (1 - Math.pow(2, -tau / HALF));
LTT.expect("τ=8h 축적 비율", accum(8), 2, { tol: 1e-9 });
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
// 키프레임: 16h → 8h → 4h → 16h, 각 상태에서 잠깐 멈춘다
const KEYS = [16, 8, 4];
const tauAt = (u) => { const seg = u * 3, i = Math.floor(seg) % 3, f = seg - Math.floor(seg);
  const a = KEYS[i], b = KEYS[(i + 1) % 3]; return f < .55 ? a : a + (b - a) * ease((f - .55) / .45); };

function pkFigure(host) {
  const W = 900, H = 500, L = 70, R = 760, T = 90, B = 440;
  const x = (t) => L + (R - L) * t / TMAX, y = (c) => B - (B - T) * c / YMAX;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "pk", "data-annotate": "" }, host);
  for (let t = 0; t <= TMAX; t += 12) { mk("line", { x1: x(t), x2: x(t), y1: T, y2: B, style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    const tx = mk("text", { x: x(t), y: B + 24, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-muted)" }, s); tx.textContent = t; }
  for (let c = 0; c <= 3; c++) { mk("line", { x1: L, x2: R, y1: y(c), y2: y(c), style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    const tx = mk("text", { x: L - 12, y: y(c) + 5, "text-anchor": "end", style: "font-size:15px;fill:var(--ltt-muted)" }, s); tx.textContent = c; }
  const xl = mk("text", { x: R, y: B + 50, "text-anchor": "end", style: "font-size:15px;fill:var(--ltt-muted)" }, s); xl.textContent = "투여 뒤 시간 (h)";
  const yl = mk("text", { x: L - 50, y: T - 18, style: "font-size:15px;fill:var(--ltt-muted)" }, s); yl.textContent = "혈중 농도 (첫 최고 농도 = 1)";
  const singles = mk("g", {}, s);
  const plateau = mk("line", { x1: L, x2: R, style: "stroke:var(--ltt-ink-2);stroke-width:1.5;stroke-dasharray:6 5" }, s);
  const plLab = mk("text", { x: R + 8, style: "font-size:15px;fill:var(--ltt-ink-2)" }, s);
  const curve = mk("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:3;stroke-linejoin:round" }, s);
  const ticks = mk("g", {}, s);
  // 첫 투여 곡선 위에 반감기 표시
  mk("line", { x1: x(0), x2: x(HALF), y1: y(.5), y2: y(.5), style: "stroke:var(--ltt-ink);stroke-width:1.5" }, s);
  mk("circle", { cx: x(HALF), cy: y(.5), r: 5, style: "fill:var(--ltt-ink)" }, s);
  const hl = mk("text", { x: x(HALF) + 10, y: y(.5) + 22, style: "font-size:15px;fill:var(--ltt-ink)" }, s); hl.textContent = "반감기 8h → 절반";
  const read = mk("text", { x: L, y: 30, style: "font-size:22px;font-weight:700;fill:var(--ltt-ink)" }, s);
  const readSub = mk("text", { x: L + 320, y: 30, style: "font-size:18px;fill:var(--ltt-accent);font-weight:700" }, s);
  function draw(u) {
    const tau = tauAt(u);
    let d = ""; for (let t = 0; t <= TMAX; t += .2) d += (t ? "L" : "M") + x(t).toFixed(1) + "," + y(conc(t, tau)).toFixed(1);
    curve.setAttribute("d", d);
    singles.innerHTML = ""; ticks.innerHTML = "";
    for (let n = 0; n * tau <= TMAX; n++) { const t0 = n * tau; let p = "";
      for (let t = t0; t <= TMAX; t += .5) p += (t === t0 ? "M" + x(t0).toFixed(1) + "," + y(0).toFixed(1) + "L" : "L") + x(t).toFixed(1) + "," + y(Math.pow(2, -(t - t0) / HALF)).toFixed(1);
      mk("path", { d: p, style: "fill:none;stroke:var(--ltt-muted);stroke-width:1.2;stroke-dasharray:3 4;opacity:.75" }, singles);
      mk("path", { d: `M${x(t0)},${B}l-6,12h12z`, style: "fill:var(--ltt-ink-2)" }, ticks); }
    const r = accum(tau);
    plateau.setAttribute("y1", y(r)); plateau.setAttribute("y2", y(r)); plLab.setAttribute("y", y(r) + 5); plLab.textContent = "정상 상태 ×" + r.toFixed(1);
    read.textContent = "투약 간격 τ = " + tau.toFixed(1).replace(".0", "") + "시간";
    readSub.textContent = "τ / 반감기 = " + (tau / HALF).toFixed(2);
  }
  return { el: s, draw };
}

function loop(period, draw) {
  let id = 0, t0 = 0; const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(id); if (reduced) { draw(2 / 3 - .01); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); id = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(id); } };
}

LTT.deck({
  title: "투약 간격과 축적", theme: "lab",
  glossary: { "반감기": "혈중 농도가 절반으로 줄어드는 데 걸리는 시간", "정상 상태": "투여로 들어오는 양과 몸이 없애는 양이 같아져 곡선이 같은 높이에서 오르내리는 상태" },
  scenes: [{
    type: "hook", pre: "약동학", text: "같은 약, 간격만 줄였는데 세 배로 쌓인다",
    sub: "점선은 한 번씩 먹은 약, 굵은 선은 그 합이다. 간격이 {{반감기}}보다 짧아지면 앞 약이 다 빠지기 전에 다음 약이 얹혀 {{정상 상태}}가 올라간다.",
    basis: "테오필린 성인 반감기 약 8시간(Goodman & Gilman 약동학 표) 기준 1구획 모델. 축적 비율 = 1 / (1 − 2^(−τ/8)). 모델로 계산한 예시.",
    mount(body) { const w = body.appendChild(document.createElement("div")); w.className = "pk-wrap";
      const f = pkFigure(w); f.draw(2 / 3 - .01); return loop(9000, f.draw); }
  }]
});
</script>
</body>
</html>
