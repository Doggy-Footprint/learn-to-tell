<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쌓이는 기술 부채</title><script src="/kit/ltt.js"></script></head><body><script>
const TAX = [0, 1, 2, 3, 4, 5].map((i) => i * 6 * 0.25);
const upTo = (k) => TAX.map((v, i) => (i < k ? v : 0));
LTT.deck({
  title: "쌓이는 기술 부채", theme: "sketch", exemplar: true,
  glossary: { "기술 부채": "지금 빨리 가려고 미룬 설계·정리 작업. 갚기 전까지 이후 작업마다 이자(추가 시간)를 낸다" },
  scenes: [{
    type: "hook", pre: "기술 부채", text: "여섯 스프린트 만에 기능이 19% 줄었다",
    sub: "{{기술 부채}}를 갚지 않으면 스프린트마다 이자(버그·우회 작업)가 팀 용량 40점의 위쪽부터 기능 개발 자리를 먹는다.",
    visual: LTT.chart({ aspect: 1.2, x: { cats: ["S1", "S2", "S3", "S4", "S5", "S6"] }, y: { label: "용량(점)", domain: [0, 40] },
      series: [{ id: "feat", label: "기능 개발에 쓴 용량", type: "bar", values: upTo(0).map((t) => 40 - t), tone: "accent" }] }),
    motion: [["wait", 0.6], ...[2, 3, 4, 5, 6].map((k) => (["to", { id: "feat", values: upTo(k).map((t) => 40 - t), dur: 1.1 }])), ["wait", 1.5]],
    basis: "부채가 이자처럼 이후 작업을 늦춘다는 비유는 Ward Cunningham(1992). 용량·적립률·이자율은 모델로 계산한 예시."
  }]
});
</script></body></html>
