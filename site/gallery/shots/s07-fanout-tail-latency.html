<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fan-out과 꼬리 지연</title><script src="/kit/ltt.js"></script></head><body><script>
// Dean & Barroso, "The Tail at Scale"(CACM 2013): 호출 하나가 1% 확률로 1초를 넘는다
const P = 0.01, pSlow = (n) => 1 - Math.pow(1 - P, n);
LTT.expect("fan-out 100의 느린 요청 비율", pSlow(100), 0.634, { tol: 0.001 });
// 요청 한 건을 표본으로 뽑는다(fan-out마다 같은 결과가 나오도록 고정 seed)
const slowIn = (n) => { let k = 0; for (let i = 0; i < n; i++) if (((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1 < P) k++; return k; };
LTT.deck({
  title: "fan-out과 꼬리 지연", theme: "terminal", exemplar: true,
  glossary: { "fan-out": "요청 하나를 처리하려고 여러 백엔드를 동시에 부르는 것. 응답은 가장 늦은 호출이 끝나야 나간다",
    "p99": "요청을 빠른 순으로 줄 세웠을 때 99번째 백분위의 지연. 100개 중 가장 느린 1개 언저리" },
  scenes: [{
    type: "play", title: "호출을 많이 쪼갤수록 한 요청이 느린 호출에 걸릴 확률이 커진다",
    sub: "칸 하나가 {{fan-out}}된 호출 하나다. 호출마다 1%만 느리다(호출 {{p99}} 1초). 응답은 가장 늦은 칸이 차야 나간다.",
    knobs: [{ id: "fan", label: "fan-out", min: 1, max: 200, value: 100, step: 1, unit: "개", log: true }],
    visual: (p) => { const k = slowIn(p.fan);
      return LTT.units({ n: p.fan, order: "random", seed: 3, groups: [{ k: p.fan - k, label: "빠른 호출 6–25ms", tone: "accent" }, { k, label: "느린 호출 약 1초", tone: "bad" }] }); },
    motion: [["fill", { group: 0, dur: 0.6 }], ["fill", { group: 1, dur: 2.4 }], ["wait", 0.6]],
    readout: (p) => [
      { label: "느린 요청 1−0.99^N", value: Math.round(pSlow(p.fan) * 100), unit: "%", tone: pSlow(p.fan) < 0.1 ? "good" : "bad" },
      { label: "이 요청의 응답", value: slowIn(p.fan) ? "약 1초" : "25ms 이하", tone: slowIn(p.fan) ? "bad" : "good" }
    ],
    goal: { text: "느린 요청이 10% 아래로 내려가는 fan-out을 찾는다", check: (p) => pSlow(p.fan) < 0.1 },
    takeaway: "느린 요청 확률은 1 − (1 − p)^N이라, 호출의 p99가 요청의 중앙값이 된다.",
    recall: { q: "호출 1%가 느릴 때 fan-out 100이면 느린 요청은 몇 %?", a: "약 63%. 1 − 0.99^100 ≈ 0.63" },
    basis: "Dean & Barroso, “The Tail at Scale”, CACM 2013: 호출 1%가 1초를 넘으면 fan-out 100 요청의 63%가 느리다."
  }]
});
</script></body></html>
