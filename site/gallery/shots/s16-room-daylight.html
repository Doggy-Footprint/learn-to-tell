<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>방향과 채광</title><script src="/kit/ltt.js"></script></head><body><script>
const RAD = Math.PI / 180, LAT = 37.57 * RAD, DEC = -23.44 * RAD, TIMES = [8, 10, 12, 14, 16, 18], DUR = 8.4;
function sun(t) { const H = 15 * (t - 12) * RAD, sa = Math.sin(LAT) * Math.sin(DEC) + Math.cos(LAT) * Math.cos(DEC) * Math.cos(H), alt = Math.asin(sa);
  const caz = (sa * Math.sin(LAT) - Math.sin(DEC)) / (Math.cos(alt) * Math.cos(LAT));
  return { alt: alt / RAD, prof: Math.atan(Math.tan(alt) / Math.max(0.05, Math.abs(caz))) }; }
// 창 아래턱 0.9 m, 위턱 2.1 m, 방 깊이 5 m. 바닥에 닿는 직사광은 창에서 a–b m 사이
const patch = (t) => { const s = sun(t); if (s.alt <= 0) return null; const tp = Math.tan(s.prof); return { a: Math.min(5, 0.9 / tp), b: Math.min(5, 2.1 / tp), prof: s.prof }; };
LTT.expect("동지 정오 태양 고도", sun(12).alt, 90 - 37.57 - 23.44, { tol: 1e-6 });
const rooms = (south) => LTT.draw({
  aspect: 2, dur: DUR, beats: [0.7, 3.3, 6.1, 7.5],
  setup(h) {
    const CW = h.W / 3, CH = h.H / 2, U = 52, cells = TIMES.map((t, i) => {
      const g = h.g(), ox = (i % 3) * CW, oy = Math.floor(i / 3) * CH, fx = ox + 40, fy = oy + CH - 22, M = 5 * U;
      const wallX = south ? fx : fx + M, top = fy - 2.1 * U, bot = fy - 0.9 * U, p = patch(t);
      if (p && south) {
        h.el("polygon", { points: `${wallX},${top} ${wallX},${bot} ${fx + p.a * U},${fy} ${fx + p.b * U},${fy}`, fill: h.color("warn"), opacity: 0.3 }, g);
        h.el("line", { x1: fx + p.a * U, y1: fy, x2: fx + p.b * U, y2: fy, stroke: h.color("warn"), "stroke-width": 10, "stroke-linecap": "round" }, g);
        h.el("circle", { cx: Math.max(ox + 14, wallX - 46 * Math.cos(p.prof)), cy: top - 46 * Math.sin(p.prof), r: 9, class: "dot warn" }, g);
      } else if (p) h.el("polygon", { points: `${wallX},${top} ${wallX},${bot} ${wallX - 60},${fy}`, fill: h.color("muted"), opacity: 0.25 }, g);
      h.el("path", { d: `M${fx},${fy} H${fx + M} M${fx},${fy} V${fy - 2.6 * U} H${fx + M} V${fy}`, class: "e" }, g);
      h.el("line", { x1: wallX, y1: top, x2: wallX, y2: bot, class: "ref" }, g);
      h.label(fx, oy + 34, t + "시", { anchor: "l", cls: "strong" });
      h.label(fx + M, oy + 34, !p ? "해 짐" : south ? (p.b - p.a).toFixed(1) + " m" : "0 m", { anchor: "r", tone: south && p ? "warn" : "muted" });
      return { g, ox, oy };
    });
    const ring = h.el("rect", { width: CW - 12, height: CH - 12, rx: 14, class: "ring" });
    return { cells, ring };
  },
  draw(t, h, s) {
    const k = (t / DUR) * TIMES.length, i = Math.floor(k) % TIMES.length, j = (i + 1) % TIMES.length;
    const m = h.ease.inOut(h.clamp((k - Math.floor(k) - 0.6) / 0.4, 0, 1)), a = s.cells[i], b = s.cells[j];
    s.ring.setAttribute("x", h.lerp(a.ox, b.ox, m) + 6); s.ring.setAttribute("y", h.lerp(a.oy, b.oy, m) + 6);
    s.cells.forEach((c, n) => c.g.setAttribute("opacity", n === i ? 1 - 0.65 * m : n === j ? 0.35 + 0.65 * m : 0.35));
  }
});
const noon = patch(12);
LTT.deck({
  title: "방향과 채광", theme: "sketch", exemplar: true,
  glossary: { "직사광": "구름이나 벽에 반사되지 않고 해에서 곧바로 들어오는 빛" },
  scenes: [{
    type: "compare", title: "동짓날 남향 방엔 해가 바닥 깊이 들고, 북향 방엔 하루 내내 안 든다",
    sub: "방 단면을 2시간 간격으로 놓았다. 칸 위 숫자는 바닥에 닿은 {{직사광}}의 폭, 테두리가 감싼 칸이 지금 시각이다.",
    left: { label: "북향 방", tag: "직사광 0시간", tone: "bad", visual: rooms(false), text: "창으로는 하늘빛만 들어온다." },
    right: { label: "남향 방", tag: `정오 ${noon.a.toFixed(1)}–${noon.b.toFixed(1)} m`, tone: "good", visual: rooms(true), text: "해가 낮게 떠 방 안쪽까지 닿는다." },
    motion: [["wait", DUR]],
    basis: "서울(북위 37.6°) 동지, 태양시 기준. 창 높이 0.9–2.1 m, 방 깊이 5 m, 주변 건물 그림자 제외. 모델 예시"
  }]
});
</script></body></html>
