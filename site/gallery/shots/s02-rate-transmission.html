<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>금리 전달 시차</title><script src="/kit/ltt.js"></script></head><body><script>
const chain = LTT.graph({
  layout: "chain", track: true, aspect: 3.4,
  nodes: [
    { id: "base", label: "기준금리", sub: "0.25%p 인상" }, { id: "loan", label: "대출금리", sub: "은행 가산" },
    { id: "spend", label: "소비·투자", sub: "가계·기업 지출" }, { id: "price", label: "물가", sub: "소비자물가 상승률" }
  ],
  edges: [{ from: "base", to: "loan" }, { from: "loan", to: "spend" }, { from: "spend", to: "price" }]
});
LTT.deck({
  title: "금리 전달 시차", theme: "ledger", exemplar: true,
  glossary: { "기준금리": "중앙은행이 정하는 정책 금리. 은행 간 단기 금리의 기준이 된다", "시차": "정책을 바꾼 때부터 효과가 나타나기까지 걸리는 시간" },
  scenes: [{
    type: "predict", layout: "stack", title: "기준금리를 올린 효과는 물가에 언제 가장 크게 닿을까",
    sub: "{{기준금리}} 인상이 대출금리 → 소비 → 물가로 번진다. 점이 느리게 갈수록 그 구간의 {{시차}}가 길다.",
    visual: chain,
    q: "기준금리를 0.25%p 올렸다. 물가 상승률이 가장 크게 내려가는 때는?",
    choices: ["한 달 안", "6개월쯤 뒤", "1~2년 뒤"], answer: 2,
    why: "대출금리는 금방 따라오지만 가계·기업이 지출을 줄이고 그것이 가격에 번지기까지 단계마다 시차가 쌓인다. 물가는 4~8분기 뒤에 가장 크게 움직인다.",
    motion: [
      { par: [["travel", { along: "base>loan", dots: 3, dur: 0.7 }], ["set", { node: "loan", sub: "인상 후 1개월 안", tone: "accent", dur: 0.7 }]] },
      ["wait", 0.6], ["mark", "ask"],
      { par: [["travel", { along: "loan>spend", dots: 3, dur: 2.2 }], ["set", { node: "spend", sub: "인상 후 2~4분기", tone: "accent", dur: 2.2 }]] },
      { par: [["travel", { along: "spend>price", dots: 3, dur: 3.6 }], ["set", { node: "price", sub: "인상 후 4~8분기", tone: "accent", dur: 3.6 }]] },
      ["pulse", { node: "price", dur: 1.2 }]
    ],
    basis: "한국은행, 「통화정책 파급경로」: 물가에 대한 효과는 대략 1~2년 뒤 가장 크다. 시기·경제 상황에 따라 다르다."
  }]
});
</script></body></html>
