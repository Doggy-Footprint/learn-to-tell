<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 줄의 컴파일</title><script src="/kit/ltt.js"></script></head><body><script>
// 동사의 panel: n은 multiples의 몇 번째 칸에 보내는지 정한다(API.md에 없음, 오류 메시지로 확인).
// CPython 3.12 tokenize·ast.dump·dis 출력(python3.12에서 확인).
const src = LTT.code({ title: "소스 · 13글자", code: "x = a + b * 2" });
const tok = LTT.terminal({ title: "토큰 · tokenize", lines: ["NAME    'x'", "OP      '='", "NAME    'a'", "OP      '+'", "NAME    'b'", "OP      '*'", "NUMBER  '2'"] });
const ast = LTT.graph({ layout: "manual", aspect: 1.3, nodes: [
  { id: "as", at: [38, 12], label: "Assign" }, { id: "nx", at: [14, 38], label: "x" }, { id: "add", at: [62, 38], label: "BinOp +" },
  { id: "na", at: [26, 64], label: "a" }, { id: "mul", at: [68, 64], label: "BinOp *" }, { id: "nb", at: [47, 90], label: "b" }, { id: "c2", at: [84, 90], label: "2" }],
  edges: [{ from: "as", to: "nx" }, { from: "as", to: "add" }, { from: "add", to: "na" }, { from: "add", to: "mul" }, { from: "mul", to: "nb" }, { from: "mul", to: "c2" }] });
const bc = LTT.terminal({ title: "바이트코드 · dis", lines: ["0  RESUME        0", "2  LOAD_NAME     a", "4  LOAD_NAME     b", "6  LOAD_CONST    2",
  "8  BINARY_OP     *", "12 BINARY_OP     +", "16 STORE_NAME    x", "18 RETURN_CONST  None"] });
const BC_FROM = [null, "na", "nb", "c2", "mul", "add", "nx", null];
LTT.deck({
  title: "한 줄의 컴파일", theme: "terminal", exemplar: true,
  glossary: { "토큰": "소스 글자를 이름·연산자·숫자 같은 최소 의미 단위로 자른 조각", "AST": "추상 구문 트리. 연산의 우선순위를 나무 모양으로 담은 구조" },
  scenes: [{
    type: "hook", pre: "CPython 3.12", text: "13글자 한 줄이 8개 명령이 되기까지",
    sub: "글자가 {{토큰}}으로 잘리고, {{AST}}로 묶이고, 스택 명령으로 풀린다. 곱셈이 트리에서 더 깊어 먼저 실행된다.",
    visual: LTT.multiples({ cols: 2, panels: [{ title: "1 소스", part: src }, { title: "2 토큰", part: tok }, { title: "3 AST", part: ast }, { title: "4 바이트코드", part: bc }] }),
    motion: [
      ["scan", { panel: 0, from: 1, to: 1, dur: 1 }],
      ["type", { panel: 1, from: 1, to: 7, dur: 2.2 }],
      { par: [["travel", { panel: 2, along: "as>add>mul>nb", dur: 2 }], ["travel", { panel: 2, along: "as>nx", dur: 1 }]] },
      ...BC_FROM.map((id, i) => ({ par: [["type", { panel: 3, from: i + 1, to: i + 1, dur: 0.45 }], ...(id ? [["pulse", { panel: 2, node: id, dur: 0.45 }]] : [])] })),
      ["wait", 1]
    ],
    basis: "python3.12에서 tokenize·ast.dump·dis로 확인한 실제 출력(오프셋은 dis 기준, 단계 시간은 연출)."
  }]
});
</script></body></html>
