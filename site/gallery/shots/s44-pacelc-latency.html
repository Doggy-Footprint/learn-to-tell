<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일관성과 지연</title><script src="/kit/ltt.js"></script></head><body><script>
const RTT = { one: [1, 2, 3], multi: [1, 70, 140] };
const lat = (rtts, k) => [...rtts].sort((a, b) => a - b)[k - 1];
const vals = (key) => [1, 2, 3].map((k) => lat(RTT[key], k));
LTT.expect("여러 리전 QUORUM", lat(RTT.multi, 2), 70);
LTT.deck({
  title: "일관성 수준과 지연", theme: "sketch", exemplar: true,
  glossary: {
    "PACELC": "분할(P)이 나면 가용성(A)과 일관성(C) 중 하나, 평소(E)에는 지연(L)과 일관성(C) 중 하나를 고른다는 분산 DB 원칙",
    "일관성 수준": "읽기·쓰기 한 번에 몇 개 복제본의 응답을 기다릴지 정하는 값(Cassandra의 ONE·QUORUM·ALL)"
  },
  scenes: [{
    type: "figure", title: "평소에도 일관성을 높이면 지연을 낸다",
    sub: "{{PACELC}}의 E·L·C. {{일관성 수준}}이 같아도 복제본이 멀면 값이 크게 뛴다.",
    visual: LTT.chart({
      x: { label: "일관성 강해짐 → (기다릴 응답 수)", cats: ["ONE 1/3", "QUORUM 2/3", "ALL 3/3"] },
      y: { label: "읽기 지연", domain: [0, 150], unit: "ms" },
      series: [
        { id: "one", label: "한 리전", type: "line", values: vals("one"), tone: "accent" },
        { id: "multi", label: "세 리전(서울·도쿄·오레곤)", type: "line", values: vals("multi"), tone: "bad" }
      ],
      refs: [{ id: "gap", y: 70, label: "QUORUM +68ms" }]
    }),
    steps: [
      { caption: "한 리전: 복제본 왕복이 1–3ms라 ONE·QUORUM·ALL 모두 거의 0이다.", motion: [["hide", { ids: ["multi", "gap"] }], ["draw", { id: "one", dur: 1.6 }]] },
      { caption: "세 리전(서울·도쿄·오레곤): 같은 손잡이인데 기다릴 응답이 늘 때마다 바다를 건넌다.", motion: [["show", { id: "multi" }], ["draw", { id: "multi", dur: 2 }]] },
      { caption: "같은 QUORUM이 한 리전 2ms, 세 리전 70ms. 차이 68ms는 도쿄까지 한 번 더 왕복한 값이다.", motion: [["show", { id: "gap" }], ["highlight", { id: "gap", dur: 2.5 }]] }
    ],
    takeaway: "분할이 없어도 일관성 수준은 지연과 맞바꾸는 손잡이다.",
    basis: "리전 간 왕복은 클라우드 공개 ping 측정치 근사(불확실). 지연 = k번째로 빠른 복제본 왕복 시간."
  }]
});
</script></body></html>
