<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>웨이퍼 결함과 수율</title><script src="/kit/ltt.js"></script></head><body><script>
const D0 = 0.1, RW = 15, IN = (x, y) => x * x + y * y < (RW - 0.3) ** 2;
const poisson = (A) => Math.exp(-A * D0);
LTT.expect("1cm² 다이 푸아송 수율", poisson(1), 0.9048, { tol: 1e-3 });
LTT.expect("4cm² 다이 푸아송 수율", poisson(4), 0.6703, { tol: 1e-3 });
const wafer = LTT.draw({
  aspect: 16 / 10, mobileAspect: 3 / 4, dur: 8, beats: [1.5, 3.5, 6.5],
  setup(h) {
    const R = h.mobile ? 340 : 290, cx = h.mobile ? 500 : 330, cy = h.mobile ? 360 : 312, S = R / RW;
    const lx = h.mobile ? 60 : 690, ly = h.mobile ? 780 : 90, gap = h.mobile ? 95 : 50;
    const r = h.rng(7), defects = [];
    while (defects.length < Math.round(Math.PI * RW * RW * D0)) { const x = (r() * 2 - 1) * RW, y = (r() * 2 - 1) * RW; if (IN(x, y)) defects.push([x, y]); }
    h.el("circle", { cx, cy, r: R, class: "e" });
    h.label(lx, ly, "300mm 웨이퍼 · D₀ 0.1개/cm²", { anchor: "l", cls: "muted" });
    const grids = [1, 2].map((side) => {
      const g = h.g(), dice = [];
      for (let i = 0; i < 2 * RW / side; i++) for (let j = 0; j < 2 * RW / side; j++) {
        const x0 = -RW + i * side, y0 = -RW + j * side;
        if (![[0, 0], [1, 0], [0, 1], [1, 1]].every(([a, b]) => IN(x0 + a * side, y0 + b * side))) continue;
        const hit = defects.findIndex(([x, y]) => x >= x0 && x < x0 + side && y >= y0 && y < y0 + side);
        dice.push({ hit: hit < 0 ? Infinity : hit, el: h.el("rect", { x: cx + x0 * S + 1, y: cy + y0 * S + 1, width: side * S - 2, height: side * S - 2, rx: 2 }, g) });
      }
      const head = h.label(lx, ly + gap, `다이 ${side}×${side}cm · ${dice.length}개`, { anchor: "l", cls: "strong" });
      const bad = h.label(lx, ly + gap * 2, "", { anchor: "l" });
      const yl = h.label(lx, ly + gap * 3.6, "", { anchor: "l", cls: "big" });
      const model = h.label(lx, ly + gap * 5, `푸아송 e^(−A·D₀) = ${Math.round(poisson(side * side) * 100)}%`, { anchor: "l", cls: "muted" });
      h.item(side === 1 ? "small" : "big", [g, head, bad, yl, model]);
      return { dice, bad, yl };
    });
    const dots = defects.map(([x, y]) => ({ x: cx + x * S, y: cy + y * S, el: h.el("circle", { r: h.mobile ? 6 : 5, class: "dot bad" }) }));
    h.anchor("wafer", cx, cy - R);
    return { grids, dots };
  },
  draw(t, h, s) {
    const fall = h.clamp(t / 5, 0, 1), n = s.dots.length;
    let landed = 0;
    s.dots.forEach((d, k) => {
      const p = h.ease.out(h.clamp((fall - k / n * 0.8) / 0.2, 0, 1));
      if (p >= 1) landed = k + 1;
      d.el.setAttribute("cx", d.x); d.el.setAttribute("cy", d.y - (1 - p) * 200);
      d.el.setAttribute("opacity", p > 0 ? Math.min(1, p * 3) : 0);
    });
    s.grids.forEach((g) => {
      let bad = 0;
      g.dice.forEach((d) => { const b = d.hit < landed; bad += b; d.el.setAttribute("fill", h.color(b ? "bad" : "good")); d.el.setAttribute("fill-opacity", b ? 0.55 : 0.18); });
      g.bad.textContent = `떨어진 결함 ${landed}개 · 결함 다이 ${bad}개`;
      g.yl.textContent = `수율 ${Math.round((1 - bad / g.dice.length) * 100)}%`;
    });
  }
});
LTT.deck({
  title: "웨이퍼 결함과 수율", theme: "blueprint", exemplar: true,
  glossary: { "결함 밀도": "웨이퍼 면적 1cm²마다 떨어지는 치명 결함의 평균 개수(D₀)", "다이": "웨이퍼 한 장에서 잘라 내는 칩 하나" },
  scenes: [{
    type: "predict", kicker: "예측", title: "같은 웨이퍼에서 다이만 네 배 키우면 수율은?",
    sub: "점은 떨어지는 결함, 칸은 {{다이}}(칩 하나). 결함을 맞은 다이는 버린다. 결함 71개는 그대로 두고 다이만 키운다.",
    visual: wafer,
    q: "결함은 같은 자리에 같은 수로 떨어진다. 다이를 1×1cm에서 2×2cm로 바꾸면 수율은?",
    choices: ["약 90% 그대로. 결함 수가 같으니까", "약 67%로 떨어진다", "약 23%. 면적이 4배라 4배 나빠진다"], answer: 1,
    why: "결함 하나가 큰 다이를 통째로 버린다. 결함을 하나도 맞지 않을 확률은 e^(−A·{{결함 밀도}}): e^(−0.1)=90%, e^(−0.4)=67%. 결함이 겹치는 다이가 있어 4배까지는 안 간다.",
    motion: [["hide", { id: "big", dur: 0.01 }], ["wait", 7.99], ["mark", "ask"], { par: [["hide", { id: "small", dur: 0.01 }], ["show", { id: "big", dur: 0.01 }]] }, ["wait", 7.99]],
    basis: "푸아송 수율 모델 Y = e^(−A·D₀). D₀ 0.1/cm²는 성숙 공정의 예시 값이고 공정마다 다르다. 결함 군집을 반영한 음이항 모델도 쓴다."
  }]
});
</script></body></html>
