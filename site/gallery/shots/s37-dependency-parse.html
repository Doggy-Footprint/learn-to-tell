<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>의존 구문 분석</title><script src="/kit/ltt.js"></script></head><body><script>
const W = ["어제", "철수가", "빨간", "사과를", "먹었다"];
const at = (xs, ys) => Object.fromEntries(W.map((_, i) => ["w" + i, [xs[i], ys[i]]]));
const row = at([26, 38, 50, 62, 74], [60, 60, 60, 60, 60]);
const ARCS = [[4, 0, "때 obl"], [4, 1, "주어 nsubj"], [3, 2, "꾸밈 amod"], [4, 3, "목적어 obj"]];
const ids = ARCS.map(([h, d]) => `w${h}>w${d}`);
LTT.deck({
  title: "의존 구문 분석", theme: "paper", exemplar: true,
  glossary: { "핵심어": "구의 문법 성격을 정하는 말. 다른 말이 기대는 쪽(head)", "의존어": "핵심어에 기대어 뜻을 보태는 말(dependent)",
    "의존 관계": "핵심어와 의존어를 잇는 화살표에 붙은 이름(주어, 목적어, 꾸밈 등)" },
  scenes: [{
    type: "terms", title: "문장은 핵심어에 기대는 말들의 나무다",
    sub: "붙은 문장이 어절로 쪼개지고 나무로 선다. 화살표는 {{핵심어}}에서 {{의존어}}로 가고, 그 위 글자가 {{의존 관계}} 이름이다.",
    visual: LTT.graph({ layout: "manual", aspect: 1.3,
      nodes: W.map((w, i) => ({ id: "w" + i, label: w, at: row["w" + i] })),
      edges: ARCS.map(([h, d, label]) => ({ from: "w" + h, to: "w" + d, label })) }),
    terms: [{ term: "핵심어 head", plain: "다른 말이 기대는 쪽. 문장 전체의 핵심어는 서술어 '먹었다'", on: "w4" },
      { term: "의존어 dependent", plain: "핵심어에 붙어 뜻을 보태는 말. '빨간'은 '사과를'에 기댄다", on: "w2" },
      { term: "관계 relation", plain: "화살표에 붙은 이름. 주어·목적어·꾸밈", on: "w4>w1" }],
    motion: [
      ["hide", { ids, dur: 0.01 }],
      ["relayout", { to: at([10, 30, 50, 70, 90], [60, 60, 60, 60, 60]), dur: 1 }],
      ["relayout", { to: at([10, 32, 64, 80, 48], [44, 72, 90, 56, 10]), dur: 1.2 }],
      ...ids.map((id) => ["show", { id, dur: 0.8 }]),
      { par: [["highlight", { id: "w4", tone: "accent", dur: 2.4 }], ["highlight", { id: "w3", tone: "accent", dur: 2.4 }]] }
    ],
    basis: "관계 이름은 Universal Dependencies v2 표기. 한국어 서술어 뿌리 관례는 UD Korean Kaist 트리뱅크."
  }]
});
</script></body></html>
