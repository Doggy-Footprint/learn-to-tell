<script type="application/json" id="ltt-meta">{"topic":"의존 구문 분석","audience":"언어학 입문자","theme":"paper","medium":"교과서 figure","decision":"핵심어와 의존어 구분","domain":"언어학","pattern":["terms"],"mode":"카탈로그용: 장면 하나짜리 본보기. 연결 구조를 \"쪼개지고 합쳐짐\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>

<style>
.dk-terms{flex:0 0 auto!important;height:auto!important;align-items:start}
.dk-tm{min-height:0!important;height:auto!important}
.dp-wrap{display:flex;justify-content:center;flex:1 1 auto;margin-top:8px}
.dp{width:100%;max-width:900px;max-height:420px;height:auto;display:block}
.dp text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const n = document.createElementNS(SVG, tag); for (const k in a) n.setAttribute(k, a[k]); p && p.appendChild(n); return n; };
// 세종 구문 분석 말뭉치·UD Korean 관례: 서술어가 문장의 뿌리, 체언·수식어는 오른쪽 핵심어에 기댄다
const W = [{ w: "어제", x: 110 }, { w: "철수가", x: 270 }, { w: "빨간", x: 440 }, { w: "사과를", x: 600 }, { w: "먹었다", x: 800 }];
const ARCS = [{ h: 4, d: 0, rel: "때 (obl)" }, { h: 4, d: 1, rel: "주어 (nsubj)" }, { h: 3, d: 2, rel: "꾸밈 (amod)" }, { h: 4, d: 3, rel: "목적어 (obj)" }];

function parse(host) {
  const s = mk("svg", { viewBox: "0 0 920 440", class: "dp", "data-annotate": "" }, host);
  const BASE = 330, O = { opacity: 0 };
  const boxes = [mk("rect", { x: 380, y: BASE - 40, width: 290, height: 64, rx: 10, opacity: 0, style: "fill:var(--ltt-accent-soft);stroke:none" }, s),
    mk("rect", { x: 40, y: BASE - 52, width: 840, height: 88, rx: 14, opacity: 0, style: "fill:none;stroke:var(--ltt-line-2);stroke-width:1.5;stroke-dasharray:6 5" }, s)];
  const arcs = ARCS.map((a) => { const x1 = W[a.h].x, x2 = W[a.d].x, hgt = 40 + Math.abs(x1 - x2) * 0.32;
    const p = mk("path", { d: `M${x1},${BASE - 34} C${x1},${BASE - 34 - hgt} ${x2},${BASE - 34 - hgt} ${x2},${BASE - 40}`, style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:2.2" }, s);
    const tip = mk("path", { d: `M${x2 - 6},${BASE - 50} L${x2},${BASE - 38} L${x2 + 6},${BASE - 50}`, opacity: 0, style: "fill:none;stroke:var(--ltt-ink-2);stroke-width:2.2" }, s);
    const lab = mk("text", { x: (x1 + x2) / 2, y: BASE - 34 - hgt * 0.75 - 8, opacity: 0, "text-anchor": "middle", style: "font-size:17px;fill:var(--ltt-ink-2);font-weight:600" }, s);
    lab.textContent = a.rel; return { p, tip, lab }; });
  const root = mk("text", { x: 860, y: 96, opacity: 0, "text-anchor": "middle", style: "font-size:16px;fill:var(--ltt-accent);font-weight:700" }, s); root.textContent = "뿌리 (root)";
  const rootLine = mk("line", { x1: 800, y1: 80, x2: 800, y2: BASE - 40, opacity: 0, style: "stroke:var(--ltt-accent);stroke-width:2.2;stroke-dasharray:4 4" }, s);
  const words = W.map((o) => { const t = mk("text", { x: 460 + (o.x - 460) * 0.55, y: BASE, "text-anchor": "middle", style: "font-size:30px;font-weight:700;fill:var(--ltt-ink)" }, s); t.textContent = o.w; return t; });
  const role = W.map((o, i) => { const r = mk("text", { x: o.x, y: BASE + 34, opacity: 0, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-muted)" }, s);
    r.textContent = i === 3 ? "핵심어 ← 빨간" : i === 4 ? "핵심어 (문장 전체)" : "의존어"; return r; });
  const caps = ["한 줄로 붙은 문장을 어절로 쪼갠다", "화살표: 핵심어 → 의존어, 위 글자는 관계", "의존어는 핵심어와 합쳐져 한 덩어리(구)가 된다"].map((c, i) => {
    const t = mk("text", { x: 460, y: 420, opacity: i ? 0 : 1, "text-anchor": "middle", style: "font-size:18px;fill:var(--ltt-ink-2)" }, s); t.textContent = c; return t; });
  const fade = (t, el, v, text) => ({ t, morph: el, to: { opacity: v }, text });
  LTT.motion.play(s, [
    ...words.map((w, i) => ({ t: [0, 1400], morph: w, to: { x: W[i].x }, text: i ? undefined : "0–1.4s 한 줄로 붙은 문장이 어절 단위로 갈라진다" })),
    fade([1400, 1700], caps[0], 0), fade([1400, 1700], caps[1], 1),
    ...arcs.flatMap((a, i) => { const t0 = 1700 + i * 850, t1 = t0 + 850;
      return [{ t: [t0, t1], draw: a.p, text: i === 3 ? "1.7–5.1s 핵심어에서 의존어로 호가 하나씩 그려지고 그 위에 관계 이름이 얹힌다" : undefined }, fade([t1 - 250, t1], [a.tip, a.lab], 1)]; }),
    fade([5100, 5700], [root, rootLine, ...role], 1, "5.1–5.7s 뿌리 표시와 세로선이 나타나고 각 어절에 역할이 붙는다"),
    fade([5700, 6000], caps[1], 0), fade([5700, 6000], caps[2], 1),
    fade([6000, 6900], boxes[0], 1), fade([6900, 7800], boxes[1], 1, "6–7.8s 핵심어 묶음 상자가 안쪽부터 차례로 의존어를 둘러싼다"),
  ], { period: 9000 });
  return { el: s };
}
LTT.deck({
  title: "의존 구문 분석", theme: "paper",
  glossary: { "핵심어": "구의 문법 성격을 정하는 말. 다른 말이 기대는 쪽(head)",
    "의존어": "핵심어에 기대어 뜻을 보태는 말(dependent)", "의존 관계": "핵심어와 의존어를 잇는 화살표에 붙은 이름(주어, 목적어, 꾸밈 등)" },
  scenes: [{
    type: "terms", title: "문장은 핵심어에 기대는 말들의 나무다", en: "Head, dependent, relation",
    sub: "화살표는 핵심어에서 의존어로 간다. 위 글자가 관계 이름이다.",
    terms: [{ key: "핵심어", word: "핵심어", en: "head", icon: "anchor", visual: false, plain: "다른 말이 기대는 쪽" },
      { key: "의존어", word: "의존어", en: "dependent", icon: "link", visual: false, plain: "핵심어에 붙어 뜻을 보탬" },
      { key: "의존 관계", word: "관계", en: "relation", icon: "arrow", visual: false, plain: "화살표의 이름" }],
    basis: "관계 이름은 Universal Dependencies v2 표기. 한국어 서술어 뿌리 관례는 UD Korean Kaist 트리뱅크.",
    mount(body) { const w = body.appendChild(document.createElement("div")); w.className = "dp-wrap"; parse(w); }
  }]
});
</script>
</body>
</html>
