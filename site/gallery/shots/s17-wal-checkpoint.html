<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAL과 복구</title><script src="/kit/ltt.js"></script></head><body><script>
const REC = [["0/3000130", "COMMIT"], ["0/3000168", "CHECKPOINT"], ["0/3000240", "UPDATE"]];
const nodes = REC.map(([lsn, op], i) => ({ id: "w" + i, label: op, sub: "LSN …" + lsn.slice(-3), at: [16 + i * 30, 18], tone: i === 1 ? "warn" : "accent" }));
const flushCk = ["w0>data"];
LTT.deck({
  title: "WAL과 복구", theme: "terminal", exemplar: true, glossary: {},
  scenes: [{
    type: "terms", title: "로그를 먼저 쓰고, 체크포인트에서 끊어 두면, 복구는 그 뒤만 다시 읽는다",
    sub: "위 줄은 WAL에 LSN(0/3000…) 순서로 쌓이는 기록, 아래는 실제 테이블 파일이다. 초록 점은 복구가 다시 읽는 구간이다.",
    visual: LTT.graph({ layout: "manual", aspect: 2,
      nodes: [...nodes, { id: "data", label: "데이터 파일", sub: "base/ (heap)", icon: "db", at: [46, 82] }],
      edges: [...REC.slice(1).map((_, i) => ({ from: "w" + i, to: "w" + (i + 1) })),
        { from: "w0", to: "data", tone: "warn", dash: true },
        { from: "w2", to: "data", tone: "good", dash: true }] }),
    terms: [
      { term: "WAL", on: "w0", plain: "테이블을 고치기 전에 바뀐 내용을 먼저 순서대로 적는 로그. 위치는 LSN으로 센다." },
      { term: "체크포인트", on: "w1", plain: "바뀐 페이지를 모두 디스크에 쓰고, 복구를 시작할 자리를 표시하는 순간." },
      { term: "REDO 복구", on: "w2", plain: "재시작 때 마지막 체크포인트부터 WAL 끝까지 다시 적용해 잃은 변경을 되살린다." }],
    motion: [
      ["hide", { ids: [...flushCk, "w2>data"], dur: 0.01 }],
      ["travel", { along: "w0>w1", dur: 1.4 }],
      { par: [["show", { ids: flushCk, dur: 0.4 }], ["flow", { edges: flushCk, n: 2, tone: "warn", dur: 1.4 }], ["pulse", { node: "w1", tone: "warn", dur: 1.4 }]] },
      ["travel", { along: "w1>w2", dur: 0.8 }],
      ["set", { node: "w2", sub: "⚡ 전원 끊김", tone: "bad", dur: 0.8 }],
      { par: [["travel", { along: "w1>w2", tone: "good", dur: 1.2 }], ["highlight", { id: "w1", tone: "good", dur: 1.2 }]] },
      { par: [["show", { id: "w2>data", dur: 0.4 }], ["flow", { edges: ["w2>data"], n: 2, tone: "good", dur: 1.4 }]] }
    ],
    basis: "PostgreSQL 공식 문서 'WAL Configuration': checkpoint_timeout 5분, max_wal_size 1GB 기본. LSN은 예시."
  }]
});
</script></body></html>
