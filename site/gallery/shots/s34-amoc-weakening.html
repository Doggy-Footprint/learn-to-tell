<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>열염순환 약화</title><script src="/kit/ltt.js"></script></head><body><script>
// 정상: RAPID 26.5°N 관측 평균 약 17 Sv(2004–2012), 침강 약 60°N, 심층수 약 3,000 m.
// 약화: 침강 약 30% 감소를 가정한 모델 예시. 침강이 남쪽·얕은 곳으로 옮겨지고 한 바퀴가 0.7배 속도로 돈다.
// 공통 주기 50초에 정상 10바퀴, 약화 7바퀴라 반복 이음매에서 끊기지 않는다. compare 장면은 motion이 없으면 draw 시계가 멈춰 있어 wait로 장면 길이를 준다.
const section = ({ tone, laps, sink, deep, sinkLabel, sv, lens }) => LTT.draw({
  aspect: 3 / 2, dur: 50,
  setup(h) {
    const X = (lat) => 70 + (lat + 40) / 110 * 900, Y = (d) => 90 + d / 4000 * 470;
    h.el("rect", { x: X(-40), y: Y(0), width: X(70) - X(-40), height: Y(4000) - Y(0), class: "band" });
    const floor = [[-40, 4000], [-10, 4000], [20, 3600], [50, 3400], [62, 3700], [66, 1800], [70, 900]];
    h.el("path", { d: "M" + floor.map(([a, d]) => X(a) + "," + Y(d)).join("L") + `L${X(70)},${Y(4000) + 12}L${X(-40)},${Y(4000) + 12}Z`, class: "e", style: `fill:${h.color("muted")};opacity:.5` });
    [[-30, "30°S"], [0, "적도"], [26.5, "26.5°N"], [60, "60°N"]].forEach(([a, t]) => h.label(X(a), Y(0) - 8, t, { anchor: "b", cls: "muted" }));
    [1000, 2000, 3000].forEach((d) => h.label(X(-40) - 8, Y(d), d / 1000 + "km", { anchor: "r", cls: "muted" }));
    if (lens) { h.el("path", { d: `M${X(48)},${Y(0)} Q${X(58)},${Y(280)} ${X(68)},${Y(0)}Z`, style: `fill:${h.color("warn")};opacity:.3` });
      h.label(X(58), Y(0) + 40, "녹은 물", { cls: "muted", tone: "warn" }); }
    const d = `M${X(-36)},${Y(60)} L${X(sink - 4)},${Y(60)} Q${X(sink + 3)},${Y(80)} ${X(sink + 2)},${Y(deep / 2)} Q${X(sink + 1)},${Y(deep)} ${X(sink - 8)},${Y(deep)} L${X(-30)},${Y(deep)} Q${X(-38)},${Y(deep)} ${X(-38)},${Y(deep / 2)} Q${X(-38)},${Y(60)} ${X(-36)},${Y(60)}Z`;
    const loop = h.el("path", { d, class: "e", style: "stroke-dasharray:3 8;opacity:.6" });
    const L = loop.getTotalLength(), seg = L * 0.3;
    const trail = h.el("path", { d, style: `fill:none;stroke:${h.color(tone)};stroke-width:7;stroke-linecap:round;stroke-dasharray:${seg} ${L - seg}` });
    const head = h.el("circle", { r: 12, class: "dot " + tone });
    h.label(X(5), Y(60) + 30, "따뜻한 표층수 → 북쪽", { anchor: "l" });
    h.label(X(sink) - 20, Y(deep / 2), sinkLabel, { anchor: "r" });
    h.label(X(5), Y(deep) - 30, `차가운 심층수 ← 남쪽 (${deep.toLocaleString()} m)`, { anchor: "l" });
    h.label(X(-40), h.H - 30, sv, { anchor: "l", cls: "big", tone });
    h.anchor("sink", X(sink), Y(deep / 2));
    return { loop, trail, head, L, seg };
  },
  draw(t, h, s) {
    const pos = ((t * laps / 50) % 1) * s.L, [x, y] = h.along(s.loop, pos / s.L);
    s.trail.setAttribute("stroke-dashoffset", String(s.seg - pos));
    s.head.setAttribute("cx", x); s.head.setAttribute("cy", y);
  }
});
LTT.deck({
  title: "열염순환 약화", theme: "studio", exemplar: true,
  glossary: { "AMOC": "대서양 자오면 역전순환. 표층은 북쪽으로, 심층은 남쪽으로 도는 대서양의 열염순환", "Sv": "스베드럽. 초당 100만 m³의 물이 흐르는 양" },
  scenes: [{
    type: "compare", title: "북쪽 바다가 가벼워지면 컨베이어가 느려지고 얕아진다",
    sub: "대서양 남북 단면의 {{AMOC}}. 같은 시간에 점이 도는 거리를 비교한다. 흐름의 양은 {{Sv}}.",
    left: { label: "정상 · 관측", tag: "17 Sv", tone: "accent", text: "60°N에서 깊이 3,000 m까지 가라앉아 크게 돈다.",
      visual: section({ tone: "accent", laps: 10, sink: 62, deep: 3000, sinkLabel: "60°N에서 침강", sv: "17 Sv" }) },
    right: { label: "약화 · 모델 예시", tag: "약 12 Sv", tone: "warn", text: "녹은 물이 표층을 가볍게 해 더 남쪽·얕은 곳에서 덜 가라앉고 0.7배로 돈다.",
      visual: section({ tone: "warn", laps: 7, sink: 52, deep: 1900, sinkLabel: "남쪽에서 덜 침강", sv: "약 12 Sv", lens: true }) },
    motion: [["wait", 50]], hold: 0,
    basis: "정상값은 RAPID 26.5°N 2004–2012 평균 약 17 Sv(Srokosz & Bryden 2015). 약화 쪽은 침강 30% 감소를 가정한 모델 예시."
  }]
});
</script></body></html>
