<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 퍼널</title><script src="/kit/ltt.js"></script></head><body><script>
const STEPS = ["장바구니", "배송 정보", "결제 수단", "카드 인증", "주문 완료"], LEFT = [100, 84, 72, 51, 47];
const lost = LEFT.map((v, i) => (i ? LEFT[i - 1] - v : 0)), DROP = 3;
LTT.expect("가장 큰 낙폭", lost[DROP], 21);
LTT.deck({
  title: "결제 퍼널", theme: "studio", exemplar: true,
  glossary: { "퍼널": "사용자가 목표(결제 완료)까지 거치는 단계를 차례로 놓고 단계마다 남은 비율을 본 그림", "이탈": "다음 단계로 가지 않고 떠난 것" },
  scenes: [{
    type: "figure", kicker: "결제 퍼널", title: "가장 크게 새는 칸을 확대해야 고칠 곳이 보인다",
    sub: "{{퍼널}} 막대의 길이는 남은 사람, 오른쪽 21칸은 가장 큰 칸의 {{이탈}}을 사유별로 나눈 것",
    visual: LTT.chart({ x: { cats: STEPS }, y: { label: "100명 중 남은 사람", domain: [0, 110] }, stack: true, series: [
        { id: "left", label: "남음", type: "bar", values: LEFT, tone: "accent" },
        { id: "drop", label: "가장 큰 이탈 −21명", type: "bar", values: lost.map((v, i) => (i === DROP ? v : null)), tone: "bad" }] }),
    side: LTT.units({ n: 21, cols: 7, groups: [{ k: 10, label: "인증 창에서 닫음", tone: "bad" }, { k: 6, label: "카드 거절", tone: "warn" }, { k: 5, label: "인증 창 로딩 지연", tone: "accent" }] }),
    motion: [
      ["grow", { id: "left", dur: 1.6 }],
      ["grow", { id: "drop", dur: 0.8 }],
      { par: [["dim", { except: ["drop"], dur: 1.2 }], ["note", { n: 1 }]] },
      ["fill", { group: 0, dur: 0.8 }], ["fill", { group: 1, dur: 0.6 }], ["fill", { group: 2, dur: 0.6 }]
    ],
    points: [{ on: "drop", text: "결제 수단 72명 → 카드 인증 51명: 퍼널에서 가장 큰 21명 손실" }],
    narration: "결제 수단 선택 → 카드 인증에서 21명이 빠진다. 그 21명을 사유로 나누면 '인증 창에서 닫음'이 가장 크다.",
    basis: "단계 수치는 모델로 계산한 예시. 평균 장바구니 이탈률 약 70%(Baymard Institute, 2024 집계)를 참고했다."
  }]
});
</script></body></html>
