<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>편향과 분산</title><script src="/kit/ltt.js"></script></head><body><script>
// 기대 테스트 오차 = 편향² + 분산 + 잡음(σ² = 0.10). 계수는 모양을 보이기 위한 가정.
const D = Array.from({ length: 12 }, (_, i) => i + 1);
const bias2 = D.map((d) => 0.85 * Math.exp(-0.55 * (d - 1))), vari = D.map((d) => 0.01 * Math.exp(0.4 * (d - 1)));
const total = D.map((d, i) => bias2[i] + vari[i] + 0.1);
const best = D[total.indexOf(Math.min(...total))];
LTT.expect("오차가 가장 작은 차수", best, 6);
LTT.deck({
  title: "편향과 분산", theme: "lab", exemplar: true,
  glossary: { "편향": "모델이 너무 단순해 평균적으로 정답에서 비켜 가는 정도", "분산": "학습 데이터가 조금만 바뀌어도 예측이 흔들리는 정도" },
  scenes: [{
    type: "figure", title: "복잡도를 올리면 편향은 줄고 분산은 쌓인다",
    sub: "차수마다 막대가 아래부터 잡음 · {{편향}}² · {{분산}}으로 쌓이고, 선이 그 합(테스트 오차)을 잇는다.",
    visual: LTT.chart({
      x: { label: "모델 복잡도 (다항식 차수)", cats: D.map(String) }, y: { label: "테스트 오차 (MSE)", domain: [0, 1.1], fmt: (v) => v.toFixed(1) },
      series: [
        { id: "noise", label: "잡음", type: "bar", values: D.map(() => 0.1), tone: "muted" },
        { id: "bias", label: "편향²", type: "bar", values: bias2, tone: "accent" },
        { id: "var", label: "분산", type: "bar", values: vari, tone: "warn" },
        { id: "합계", type: "line", values: total, tone: "ink" }],
      refs: [{ id: "best", x: String(best), label: `최저 오차 · 차수 ${best}` }], stack: true, aspect: 1.8 }),
    narration: "합이 가장 낮은 차수는 6이다. 그보다 단순하면 편향이, 복잡하면 분산이 오차를 키운다.",
    motion: [
      ["hide", { id: "best", dur: 0.01 }],
      { par: [["grow", { dur: 5 }], ["draw", { id: "합계", dur: 5 }], ["scan", { from: "1", to: "12", dur: 5 }]] },
      ["show", { id: "best", dur: 0.6 }], ["highlight", { id: "best", keep: true, dur: 2.4 }]
    ],
    basis: "분해식 E[(y−f̂)²] = 편향² + 분산 + σ²: Hastie·Tibshirani·Friedman, ESL 7.3절. 계수는 모양을 보이기 위한 가정이다."
  }]
});
</script></body></html>
