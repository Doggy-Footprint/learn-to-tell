<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포식자와 피식자</title><script src="/kit/ltt.js"></script></head><body><script>
// 로트카-볼테라. 눈신토끼·캐나다스라소니(허드슨베이 모피 기록, 주기 약 10년)에 맞춘 매개변수
const P = { a: 0.55, b: 0.028, c: 0.84, d: 0.026 }, EX = P.c / P.d, EY = P.a / P.b;
const f = ([x, y]) => [P.a * x - P.b * x * y, P.d * x * y - P.c * y];
const orb = [[50, 8]];
for (let i = 0, h = 0.01; i < 985; i++) {
  const p = orb[i], k1 = f(p), k2 = f(p.map((v, j) => v + h / 2 * k1[j])), k3 = f(p.map((v, j) => v + h / 2 * k2[j])), k4 = f(p.map((v, j) => v + h * k3[j]));
  orb.push(p.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])));
}
const quad = ([x, y]) => x >= EX ? (y < EY ? 0 : 1) : (y >= EY ? 2 : 3);
const start = orb.findIndex((p, i) => i > 0 && quad(p) === 0 && quad(orb[i - 1]) === 3);
const arcs = [[], [], [], []];
for (let k = 0; k < orb.length; k++) {
  const p = orb[(start + k) % orb.length], q = quad(p);
  if (k % 4 === 0 || q !== quad(orb[(start + k + 1) % orb.length])) arcs[q].push(p);
  if (k && q !== quad(orb[(start + k - 1) % orb.length])) arcs[(q + 3) % 4].push(p);
}
LTT.expect("평형점 토끼(천 마리)", EX, 32.3, { tol: 0.1 });
const text = ["① 토끼가 많다 → 스라소니가 는다", "② 스라소니가 많다 → 토끼가 준다", "③ 먹이가 없다 → 스라소니가 준다", "④ 천적이 적다 → 토끼가 회복한다"];
const tones = ["accent", "bad", "muted", "good"];
LTT.deck({
  title: "포식자와 피식자", theme: "sketch", exemplar: true,
  glossary: { "평형점": "두 개체수가 더 변하지 않는 지점. 순환은 이 점을 감싸고 돈다" },
  scenes: [{
    type: "overview", title: "토끼와 스라소니는 서로를 쫓아 한 바퀴 돈다",
    sub: "점 하나가 한 해의 두 개체수다. {{평형점}}을 지나는 점선이 판을 네 구역으로 나누고, 점은 ①→②→③→④로 돈다.",
    visual: LTT.chart({
      x: { label: "토끼 수 (천 마리)", domain: [0, 75] }, y: { label: "스라소니 (천 마리)", domain: [0, 52] },
      series: arcs.map((pts, i) => ({ id: "q" + (i + 1), label: text[i][0], type: "line", points: [...pts].sort((a, b) => a[0] - b[0]), tone: tones[i] })),
      refs: [{ id: "ex", x: EX, label: "평형 32천" }, { id: "ey", y: EY, label: "평형 20천" }], aspect: 1.6 }),
    points: text.map((t, i) => ({ on: "q" + (i + 1), text: t })),
    motion: arcs.map((pts, i) => ({ par: [["point", { id: "q" + (i + 1), from: pts[0][0], to: pts[pts.length - 1][0], dur: 2.2 }], ["note", { n: i + 1 }]] })),
    basis: "로트카-볼테라 모델, 눈신토끼·캐나다스라소니 약 10년 주기(허드슨베이 기록)에 맞춘 매개변수. 모델로 계산한 예시."
  }]
});
</script></body></html>
