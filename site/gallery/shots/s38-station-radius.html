<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>역세권 가격 띠</title><script src="/kit/ltt.js"></script></head><body><script>
const price = (m) => m <= 1000 ? 4200 * (1 - 0.024 * m / 100) : 4200 * 0.76 * (1 - 0.006 * (m - 1000) / 100);
const curve = (to) => Array.from({ length: to / 50 + 1 }, (_, i) => [i * 50, Math.round(price(i * 50))]);
const R = (m) => m / 1600 * 46;
const map = (d) => LTT.morph({ aspect: 1, shapes: {
  ...Object.fromEntries([1600, 1200, 800, 400].map((m, i) => ["g" + m, { kind: "circle", cx: 50, cy: 50, r: R(m), fill: i % 2 ? "--ltt-card-2" : "--ltt-line" }])),
  ...Object.fromEntries([1600, 1200, 800, 400].map((m) => ["t" + m, { kind: "label", x: 50 + R(m) * 0.71, y: 50 - R(m) * 0.71, text: m + "m" }])),
  ring: { kind: "circle", cx: 50, cy: 50, r: R(d), fill: "--ltt-accent", opacity: 0.35 },
  rail: { kind: "rect", x: 2, y: 49, width: 96, height: 2, fill: "--ltt-ink" },
  st: { kind: "circle", cx: 50, cy: 50, r: 2.5, fill: "--ltt-ink" },
  name: { kind: "label", x: 50, y: 58, text: "선릉역" } }, states: { far: { ring: { r: R(1500) } } } });
const chart = (d) => LTT.chart({ x: { domain: [0, 1600] }, y: { domain: [2800, 4400] },
  series: [{ id: "band", label: "반경 안", type: "area", points: curve(d), tone: "accent" },
    { id: "p", label: "가격", type: "line", points: curve(1600), tone: "ink" },
    { id: "here", label: `${d}m`, type: "dot", points: [[d, Math.round(price(d))]], tone: "accent" }],
  refs: [{ id: "knee", x: 1000, label: "1km 뒤 완만" }] });
LTT.deck({
  title: "역세권 가격 띠", theme: "ledger", exemplar: true,
  glossary: { "역세권": "역에서 걸어서 닿는 거리 안의 지역. 흔히 반경 500m(도보 약 7분)" },
  scenes: [{
    type: "play", layout: "stack", title: "역에서 1km까지는 100m마다 가격이 약 2.4%씩 빠진다",
    sub: "왼쪽 원은 지도 위 반경, 오른쪽 띠는 그 반경 안의 가격. 손잡이로 반경을 옮긴다.",
    knobs: [{ id: "d", label: "역에서 거리", min: 100, max: 1500, step: 50, value: 300, unit: "m" }],
    visual: ({ d }) => LTT.multiples({ cols: 2, panels: [{ title: "지도 위 반경", part: map(d) }, { title: "거리(m)별 3.3㎡당 가격(만원)", part: chart(d) }] }),
    motion: [["wait", 0.8], { par: [["to", { panel: 0, state: "far", dur: 5 }], ["point", { panel: 1, id: "p", from: 100, to: 1500, dur: 5 }]] }, ["wait", 1.2]],
    readout: ({ d }) => [{ label: "3.3㎡당 가격", value: Math.round(price(d)).toLocaleString(), unit: "만원" },
      { label: "역 앞보다", value: "−" + Math.round((1 - price(d) / 4200) * 100), unit: "%", tone: price(d) <= 3780 ? "bad" : "ink" }],
    goal: { text: "역 앞보다 10% 이상 싸지는 첫 반경을 찾는다", check: ({ d }) => price(d) <= 3780 && price(d - 50) > 3780 },
    basis: "{{역세권}} 프리미엄이 1km 안팎에서 완만해지는 형태는 국토연구원 역세권 연구들을 따랐다. 가격과 기울기는 모델로 계산한 예시."
  }]
});
</script></body></html>
