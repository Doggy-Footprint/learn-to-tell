<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>해상 운송 리드타임</title><script src="/kit/ltt.js"></script></head><body><script>
// 부산 → 싱가포르 환적 → 수에즈 → 로테르담. 일수는 선사 공표 스케줄의 흔한 범위에서 고른 대표값, 1일 = 0.2초로 재생
const DAY = 0.2;
LTT.expect("총 리드타임", 6 + 3 + 24 + 2, 35, { tol: 0 });
const route = LTT.graph({
  layout: "manual", aspect: 1.5, mobileAspect: 1.1,
  nodes: [
    { id: "pus", label: "부산", sub: "출항", icon: "package", at: [80, 20], m: [82, 16] }, { id: "sin", label: "싱가포르", sub: "환적", icon: "refresh", at: [62, 80], m: [68, 84] },
    { id: "suez", label: "수에즈", sub: "운하 통과", ghost: true, at: [36, 46], m: [40, 50] }, { id: "rtm", label: "로테르담", sub: "통관", icon: "shield-check", at: [12, 14], m: [18, 14] }
  ],
  edges: [{ from: "pus", to: "sin", label: "6일" }, { from: "sin", to: "suez" }, { from: "suez", to: "rtm" }]
});
LTT.deck({
  title: "해상 운송 리드타임", theme: "studio", exemplar: true,
  glossary: { "출항": "ETD. 배가 선적항을 떠나는 시점. 리드타임의 출발점",
    "환적": "Transshipment. 중간 항구에서 컨테이너를 다른 배로 옮겨 싣는 일. 다음 배를 기다리는 날이 붙는다",
    "통관": "Customs clearance. 도착국 세관이 신고를 받아 물건을 내주는 절차" },
  scenes: [{
    type: "terms", title: "도착일은 배가 달린 날에 기다린 날을 더해 정해진다",
    sub: "점이 항로를 가면 배가 달린 날, 항구에서 맥박치면 기다린 날이다. 1일 = 0.2초로 재생하고 항구 아래에 D+일을 적는다.",
    visual: route,
    terms: [
      { term: "출항", plain: "배가 선적항을 떠나는 날. 리드타임은 여기서 센다.", on: "pus" },
      { term: "환적", plain: "중간 항구에서 다른 배로 옮겨 싣는다. 연결 배를 기다리는 날이 붙는다.", on: "sin" },
      { term: "통관", plain: "도착국 세관이 물건을 내줘야 창고로 간다.", on: "rtm" }
    ],
    motion: [
      ["set", { node: "pus", sub: "D+0 출항", tone: "accent", dur: 0.4 }],
      ["travel", { along: "pus>sin", dur: 6 * DAY, stay: true }], ["set", { node: "sin", sub: "D+6 입항", dur: 0.1 }],
      { par: [["pulse", { node: "sin", tone: "warn", dur: 3 * DAY }], ["set", { node: "sin", sub: "D+9 환적 출발", tone: "warn", dur: 3 * DAY }]] },
      ["travel", { along: "sin>suez>rtm", dur: 24 * DAY, stay: true }], ["set", { node: "rtm", sub: "D+33 입항", dur: 0.1 }],
      { par: [["pulse", { node: "rtm", tone: "warn", dur: 2 * DAY }], ["set", { node: "rtm", sub: "D+35 통관 완료", tone: "warn", dur: 2 * DAY }]] },
      ["wait", 1]
    ],
    takeaway: "리드타임 = 운항일 + 환적 대기 + 통관.",
    recall: { q: "환적이 한 번 더 붙으면 도착일은 어떻게 바뀌나?", a: "환적 항구에서 연결 배를 기다리는 날과 그 구간 운항일만큼 늦어진다." },
    basis: "부산–싱가포르 약 6일, 싱가포르–로테르담(수에즈 경유) 약 24일은 아시아–북유럽 정기선 스케줄의 흔한 범위. 환적 대기·통관은 화물·시기마다 크게 다르다."
  }]
});
</script></body></html>
