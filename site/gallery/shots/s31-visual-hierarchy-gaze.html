<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시선이 지나는 길</title><script src="/kit/ltt.js"></script></head><body><script>
// 예시 궤적: NN/g 시선 추적 연구(F 패턴, 2006·2017)가 보고한 훑기 모양을 단순화한 것.
const R = (x, y, width, height, fill) => ({ kind: "rect", x, y, width, height, fill });
const shapes = {
  pa: R(2, 4, 46, 92, "--ltt-card"), ta: { kind: "label", x: 25, y: 12, text: "시안 A · 모두 같은 크기" },
  ...Object.fromEntries([40, 37, 41, 36, 38, 15].map((w, i) => ["a" + i, R(5, 24 + i * 11, w, 4, i === 5 ? "--ltt-muted" : "--ltt-line")])),
  pb: R(52, 4, 46, 92, "--ltt-card"), tb: { kind: "label", x: 75, y: 12, text: "시안 B · 크기·대비로 순서" },
  hd: R(60, 22, 30, 9, "--ltt-ink"), ph: R(66, 36, 18, 20, "--ltt-line"), ds: R(63, 61, 24, 3, "--ltt-line"),
  bt: R(68, 70, 14, 9, "--ltt-accent"), btl: { kind: "label", x: 75, y: 74.5, text: "체험 시작" },
  r0: R(5, 25.5, 0, 1, "--ltt-accent"), r1: R(5, 36.5, 0, 1, "--ltt-accent"), r2: R(5, 47.5, 0, 1, "--ltt-accent"), v: R(4.5, 47.5, 1, 0, "--ltt-accent"),
  vb: R(74.5, 26, 1, 0, "--ltt-accent"),
  ...Object.fromEntries([0, 1, 2, 3].map((i) => ["f" + i, { kind: "label", x: 93, y: [26, 46, 62.5, 74.5][i], text: "①②③④"[i], opacity: 0 }])),
  dot: { kind: "circle", cx: 5, cy: 26, r: 1.8, fill: "--ltt-accent" }
};
// 상태는 앞 상태 위에 쌓아 만든다(궤적이 남아야 한다). circle은 x·y가 아니라 cx·cy로 놓인다(API.md와 다름).
const states = {}, seq = [];
let acc = {};
const add = (name, change) => { acc = { ...acc, ...change }; states[name] = acc; seq.push(name); };
add("a1", { dot: { cx: 45, cy: 26 }, r0: { width: 40 } });
add("a2", { dot: { cx: 5, cy: 37 } });
add("a3", { dot: { cx: 37, cy: 37 }, r1: { width: 32 } });
add("a4", { dot: { cx: 5, cy: 48 } });
add("a5", { dot: { cx: 22, cy: 48 }, r2: { width: 17 } });
add("a6", { dot: { cx: 5, cy: 80 }, v: { height: 32 } });
const nA = seq.length;
["hd", "ph", "ds", "bt"].forEach((id, i) => add("b" + i, { dot: { cx: 75, cy: [26, 46, 62.5, 74.5][i] }, vb: { height: [0, 20, 36.5, 48.5][i] }, ["f" + i]: { opacity: 1 } }));
LTT.deck({
  title: "시선이 지나는 길", theme: "studio", exemplar: true,
  glossary: { "시각적 위계": "크기·굵기·대비·위치로 요소의 중요도 순서를 정해, 보는 사람이 그 순서로 읽게 만드는 것",
    "F 패턴": "위계가 약한 글 화면에서 시선이 위쪽 두 줄을 가로로 훑고 왼쪽 가장자리를 따라 내려가는 모양" },
  scenes: [{
    type: "predict", title: "위계를 주면 시선은 어디부터 멈출까?",
    sub: "왼쪽 시안 A에서는 점이 {{F 패턴}}으로 줄을 훑는다. 오른쪽 시안 B는 같은 내용에 {{시각적 위계}}를 줬다.",
    visual: LTT.morph({ aspect: 2, shapes, states }),
    q: "시안 B에서 시선이 가장 먼저 멈추는 곳은?",
    choices: ["왼쪽 위 로고", "가장 크고 진한 헤드라인", "색이 있는 체험 시작 버튼"], answer: 1,
    why: "가장 크고 대비가 센 요소가 첫 시선을 받고, 시선은 크기 순서대로 내려가 버튼에서 끝난다. 색 버튼은 마지막 도착점이다.",
    motion: [
      ...seq.slice(0, nA).map((state, i) => ["to", { state, dur: i % 2 ? 0.35 : 0.9 }]), ["wait", 0.8], ["mark", "ask"],
      ...seq.slice(nA).map((state) => ["to", { state, dur: 0.7 }]), ["wait", 1.5]
    ],
    takeaway: "위계를 정하는 것은 읽는 순서를 정하는 일이다.",
    basis: "NN/g 시선 추적 연구 F-Shaped Pattern(2006, 2017 재확인). 궤적은 보고된 모양을 단순화한 예시다."
  }]
});
</script></body></html>
