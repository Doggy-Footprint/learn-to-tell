<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카르노 사이클</title><script src="/kit/ltt.js"></script></head><body><script>
// 이상기체 1 mol, γ = 5/3(헬륨), 500 K ↔ 300 K. P[kPa] = R·T / V[L]
const R = 8.314, G = 5 / 3, TH = 500, TC = 300, V1 = 10, V2 = 30, K = Math.pow(TH / TC, 1 / (G - 1)), V3 = V2 * K, V4 = V1 * K;
const QIN = R * TH * Math.log(V2 / V1), QOUT = R * TC * Math.log(V3 / V4), W = QIN - QOUT, ETA = 1 - TC / TH;
LTT.expect("카르노 효율 500K/300K", ETA, 0.4, { tol: 1e-9 });
LTT.expect("흡열 Q_in [J]", QIN, 4566.9, { tol: 0.5 });
LTT.expect("순일 W [J]", W, 1826.8, { tol: 0.5 });
const legs = [
  { title: `① 등온 팽창 +${Math.round(QIN).toLocaleString()} J`, a: V1, b: V2, T: TH },
  { title: "② 단열 팽창 500→300 K", a: V2, b: V3, T0: TH },
  { title: `③ 등온 압축 −${Math.round(QOUT).toLocaleString()} J`, a: V3, b: V4, T: TC },
  { title: "④ 단열 압축 300→500 K", a: V4, b: V1, T0: TC }];
const pts = (l) => Array.from({ length: 21 }, (_, i) => { const V = l.a * Math.pow(l.b / l.a, i / 20);
  return [V, l.T ? R * l.T / V : R * l.T0 * Math.pow(l.a, G - 1) / Math.pow(V, G)]; });
const LOOP = legs.flatMap(pts);
LTT.deck({
  title: "카르노 사이클", theme: "lab", exemplar: true,
  glossary: { "카르노 사이클": "등온 팽창 → 단열 팽창 → 등온 압축 → 단열 압축으로 되돌아오는 가역 열기관의 이상적인 한 바퀴" },
  scenes: [{
    type: "overview", title: "{{카르노 사이클}}은 네 구간을 돌아 고리 넓이만큼 일을 남긴다",
    sub: "헬륨 1 mol, 500 K ↔ 300 K, V 10 → 30 L에서 시작. 같은 P-V 축 네 칸에서 구간이 차례로 그려지고 지난 경로는 남는다.",
    visual: LTT.multiples({ cols: 2, panels: legs.map((l, i) => ({ title: l.title, part: LTT.chart({
      x: { label: "V (L)", domain: [0, 70], fmt: (v) => (v % 20 ? "" : v) }, y: { label: "P (kPa)", domain: [0, 450] }, legend: false, aspect: 1.8,
      series: [{ id: "loop", type: "area", points: LOOP, tone: "accent" }, { id: "ghost", type: "line", points: LOOP, tone: "muted", dash: true },
        ...(i ? [{ id: "done", type: "line", points: legs.slice(0, i).flatMap(pts), tone: "ink" }] : []),
        { id: "now", type: "line", points: pts(l), tone: "accent" }] }) })) }),
    side: LTT.ledger([{ id: "qin", label: "① 받은 열 Q_in", value: 0, unit: "J", total: QIN, tone: "bad" },
      { id: "qout", label: "③ 버린 열 Q_out", value: 0, unit: "J", total: QIN, tone: "accent" },
      { id: "w", label: "순일 W = 고리 넓이", value: 0, unit: "J", total: QIN, tone: "good" },
      { id: "eta", label: "효율 η = 1 − 300/500", value: 0, unit: "%" }]),
    motion: [["hide", { id: "loop", dur: 0 }],
      ...legs.map((l, i) => ({ par: [["draw", { id: "now", panel: i, dur: 1.6 }], ["point", { id: "now", panel: i, from: l.a, to: l.b, dur: 1.6 }],
        ...(i % 2 ? [] : [["count", { id: i ? "qout" : "qin", from: 0, to: Math.round(i ? QOUT : QIN), dur: 1.6 }]])] })),
      { par: [["show", { id: "loop", dur: 0.8 }], ["count", { id: "w", from: 0, to: Math.round(W), dur: 0.8 }], ["count", { id: "eta", from: 0, to: Math.round(ETA * 100), dur: 0.8 }]] }],
    takeaway: `고리 넓이 = 순일 ${Math.round(W).toLocaleString()} J. 효율 40%는 두 온도로만 정해진다`,
    basis: "등온 Q = nRT·ln(V₂/V₁), 단열 TV^(γ−1) 일정, η = 1 − T_C/T_H(Çengel & Boles 6장). 모델 계산 예시."
  }]
});
</script></body></html>
