<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>백신 콜드체인</title><script src="/kit/ltt.js"></script></head><body><script>
// 2021년 국내 화이자 백신 경로: 벨기에 푸어스 공장 → 인천공항 → 전용 물류센터 → 중앙접종센터
// zoom 동사는 글자까지 키우고 그림 밖으로 넘쳐서, 축척 변화를 지점 간격이 벌어지는 relayout으로 보인다
const route = LTT.graph({ layout: "manual", aspect: 16 / 9,
  nodes: [
    { id: "puurs", label: "푸어스 공장", sub: "벨기에", icon: "package", at: [12, 34] },
    { id: "icn", label: "인천공항", icon: "send", at: [84, 50] },
    { id: "hub", label: "물류센터", sub: "이천 일대", icon: "db", at: [86, 56] },
    { id: "ctr", label: "중앙접종센터", sub: "서울", icon: "shield-check", at: [85, 46] },
    { id: "scale", label: "지도 폭", sub: "약 10,000 km", ghost: true, at: [50, 90] }],
  edges: [{ from: "puurs", to: "icn", label: "약 11시간 비행" }, { from: "icn", to: "hub", label: "냉동 트럭" }, { from: "hub", to: "ctr", label: "냉장 차량" }] });
const view = (to, hide, show, km) => ({ par: [["relayout", { to, dur: 1.2 }], ["hide", { ids: hide }], ["show", { ids: show }], ["set", { node: "scale", sub: km }]] });
LTT.deck({
  title: "백신 콜드체인", theme: "studio", exemplar: true,
  glossary: { "콜드체인": "생산부터 접종까지 정해진 온도를 끊기지 않고 지키는 보관·운송 사슬" },
  scenes: [{
    type: "figure", kicker: "경로", title: "백신은 국가 → 도시 → 창고로 내려가며 온도 구간이 바뀐다",
    sub: "{{콜드체인}}의 구간마다 축척이 한 단계 커지고 경로를 따라 점이 간다. 오른쪽은 그 구간의 보관 온도다.",
    visual: route,
    side: LTT.ledger([
      { id: "t1", label: "① 국가 간 · 항공", value: "−90~−60", unit: "°C" },
      { id: "t2", label: "② 도시 간 · 냉동", value: "−90~−60", unit: "°C" },
      { id: "t3", label: "③ 창고 → 접종", value: "2~8", unit: "°C", tone: "warn" }]),
    steps: [
      { caption: "① 국가 간: 드라이아이스 열 차단 상자에 담아 약 11시간 비행한다.",
        motion: [view({ puurs: [12, 34], icn: [84, 50], hub: [86, 56], ctr: [85, 46] }, ["hub", "ctr", "icn>hub", "hub>ctr"], ["puurs", "icn", "puurs>icn"], "약 10,000 km"), ["travel", { along: "puurs>icn", dur: 2.2 }]] },
      { caption: "② 도시 간: 공항에서 초저온 냉동고가 있는 물류센터로 냉동 트럭이 옮긴다.",
        motion: [view({ puurs: [2, 30], icn: [20, 36], hub: [78, 62], ctr: [60, 30] }, ["puurs", "puurs>icn", "ctr"], ["hub", "icn>hub"], "약 500 km"), ["travel", { along: "icn>hub", dur: 1.6 }]] },
      { caption: "③ 창고 → 접종센터: 해동한 뒤 2~8 °C 냉장으로 옮긴다. 냉장 보관은 날짜 제한이 있다.",
        motion: [view({ icn: [4, 30], hub: [78, 64], ctr: [22, 28] }, ["icn", "icn>hub"], ["ctr", "hub>ctr"], "약 170 km"), ["travel", { along: "hub>ctr", dur: 1.6 }]] }],
    takeaway: "콜드체인은 구간마다 온도 기준이 다르고, 위험은 구간 사이의 인수인계에 몰린다.",
    basis: "코미나티 보관 조건(−90~−60 °C, 해동 뒤 2~8 °C), 질병관리청 2021년 초도 수송 보도. 물류센터 위치는 추정."
  }]
});
</script></body></html>
