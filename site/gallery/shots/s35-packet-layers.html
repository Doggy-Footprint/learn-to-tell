<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>패킷 속 네 층</title><script src="/kit/ltt.js"></script></head><body><script>
// 같은 api.github.com 요청을 캡처했을 때 각 층의 머리 필드. 위는 DNS 질의 패킷, 아래는 HTTPS 요청 패킷.
const DNS = ["Ethernet", "IPv4 → 1.1.1.1", "UDP → 포트 53", "DNS A api.github.com"];
const WEB = ["Ethernet", "IPv4 → 140.82.112.6", "TCP → 443 [SYN]", "TLS ClientHello · SNI", "HTTP GET /repos/octo/app"];
const shapes = {}, box = {};
const nest = (key, layers, y0, h0) => layers.forEach((text, i) => {
  const step = h0 / (layers.length + 0.6), id = key + i;
  box[id] = { x: 1 + i * 2.5, y: y0 + i * step, width: 98 - i * 5, height: h0 - i * step };
  shapes[id] = { kind: "rect", ...box[id], fill: "--ltt-accent", opacity: 0.1 };
  shapes[id + "t"] = { kind: "label", x: 50, y: box[id].y + step / 2, text };
});
nest("d", DNS, 2, 44); nest("w", WEB, 52, 46);
// 폰에서 가장 긴 층 이름이 그림 폭의 절반쯤이라 1.67배(60%)보다 당기면 글이 잘린다. 화면 중심을 그 층 이름에 둔다
const LENS = 60, lens = (id) => [50 - LENS / 2, Math.max(0, shapes[id + "t"].y - LENS / 2), LENS, LENS];
LTT.deck({
  title: "패킷 속 네 층", theme: "terminal", exemplar: true,
  glossary: {
    "DNS": "이름(api.github.com)을 IP 주소로 바꾸는 질의. 보통 UDP 53번 포트",
    "TCP": "두 컴퓨터 사이에 순서와 재전송을 보장하는 연결. 3-way handshake로 연다",
    "TLS": "TCP 위에서 상대를 확인하고 내용을 암호화하는 층. HTTPS의 S",
    "HTTP": "요청 줄과 헤더로 무엇을 원하는지 말하는 층. TLS 안에 암호화되어 실린다" },
  scenes: [{
    type: "terms", title: "요청 하나는 네 번의 순서로 열리고, 뒤 층은 앞 층 안에 실린다",
    sub: "위는 DNS 질의, 아래는 HTTPS 요청 패킷이다. 차례로 확대한다. 바깥 상자가 먼저 열리고, 안쪽 상자는 바깥 상자의 내용물이다.",
    visual: LTT.morph({ aspect: 1.3, shapes, states: {} }),
    terms: [
      { term: "DNS", plain: "① 이름 묻기. api.github.com이 어느 주소인지 먼저 묻는다.", on: "d3" },
      { term: "TCP", plain: "② 연결 열기. 받은 주소의 443번 포트로 SYN을 보내 길을 연다.", on: "w2" },
      { term: "TLS", plain: "③ 암호 걸기. ClientHello로 상대 이름(SNI)을 대고 암호를 맞춘다.", on: "w3" },
      { term: "HTTP", plain: "④ 요청 보내기. 암호 안에서 GET 요청 줄과 Host 헤더를 보낸다.", on: "w4" }],
    motion: [["wait", 0.8], ...["d3", "w2", "w3", "w4"].map((id, i) =>
      ({ par: [["zoom", { to: lens(id), dur: 0.7 }], ["highlight", { id, dur: 2 }], ["note", { n: i + 1, dur: 2 }]] })), ["reset", { dur: 0.6 }]],
    basis: "필드 값은 api.github.com 요청 예. 포트 53·443, TLS 1.3 ClientHello의 SNI는 RFC 1035·8446 기준."
  }]
});
</script></body></html>
