<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>노선 수와 접근성</title><script src="/kit/ltt.js"></script></head><body><script>
// 반경 10km 가상 도시 600점. 거주 밀도는 도심에서 지수로 감소(척도 3.5km, Clark 1951 모형). 도보 10분 ≈ 800m.
const RCITY = 10, WALK = 0.8, TAU = 2 * Math.PI;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PEOPLE = []; while (PEOPLE.length < 600) { const r = -3.5 * Math.log(1 - rnd()); if (r <= RCITY) PEOPLE.push({ r, a: rnd() * TAU }); }
const angles = (n) => Array.from({ length: n }, (_, k) => -Math.PI / 2 + TAU * k / n);
const nearest = (p, n) => angles(n).reduce((best, a) => { const da = Math.abs(((p.a - a) % TAU + 3 * Math.PI) % TAU - Math.PI);
  const d = da < Math.PI / 2 ? p.r * Math.sin(da) : p.r; return d < best.d ? { d, a, along: da < Math.PI / 2 ? p.r * Math.cos(da) : 0 } : best; }, { d: Infinity });
const share = (n, r0 = 0, r1 = RCITY + 1) => { const g = PEOPLE.filter((p) => p.r >= r0 && p.r < r1); return g.filter((p) => nearest(p, n).d <= WALK).length / g.length; };
LTT.expect("노선이 늘면 접근성 단조 증가", share(8) > share(4) && share(4) > share(1) ? 1 : 0, 1);

const city = (n) => LTT.draw({
  aspect: 1, dur: 5,
  setup(h) {
    const C = h.W / 2, K = (h.W / 2 - 30) / RCITY, P = (r, a) => [C + r * K * Math.cos(a), C + r * K * Math.sin(a)];
    h.el("circle", { cx: C, cy: C, r: RCITY * K, class: "e" });
    [3, 6].forEach((r) => h.el("circle", { cx: C, cy: C, r: r * K, class: "grid", style: "fill:none;stroke-dasharray:4 8" }));
    angles(n).forEach((a) => { const [x, y] = P(RCITY, a);
      h.el("line", { x1: C, y1: C, x2: x, y2: y, style: `stroke:${h.color("accent")};stroke-width:${2 * WALK * K};opacity:.14;stroke-linecap:round` });
      h.el("line", { x1: C, y1: C, x2: x, y2: y, style: `stroke:${h.color("accent")};stroke-width:5;stroke-linecap:round` }); });
    const riders = [];
    PEOPLE.forEach((p, i) => { const nb = nearest(p, n), ok = nb.d <= WALK, [x, y] = P(p.r, p.a);
      h.el("circle", { cx: x, cy: y, r: ok ? 6 : 4, class: ok ? "dot" : "dot muted", style: ok ? "" : "opacity:.3" });
      if (ok && i % 2 === 0) riders.push({ p, nb, phase: (i * 0.618) % 1, el: h.el("circle", { r: 7, class: "dot ink" }) }); });
    h.el("circle", { cx: C, cy: C, r: 16, class: "dot ink" });
    h.label(C + 24, C - 24, "도심 업무지구", { anchor: "l", cls: "strong" });
    h.anchor("core", C, C);
    return { riders, P };
  },
  // 한 주기의 앞 25%는 집에서 노선까지 걷고, 나머지 75%는 노선을 타고 도심으로 간다.
  draw(t, h, s) {
    s.riders.forEach((q) => { const u = (t / 5 + q.phase) % 1, [x0, y0] = s.P(q.p.r, q.p.a), [x1, y1] = s.P(q.nb.along, q.nb.a);
      const [x, y] = u < 0.25 ? [h.lerp(x0, x1, u / 0.25), h.lerp(y0, y1, u / 0.25)] : s.P(q.nb.along * (1 - h.ease.inOut((u - 0.25) / 0.75)), q.nb.a);
      q.el.setAttribute("cx", x); q.el.setAttribute("cy", y); });
  }
});
const pct = (v) => Math.round(v * 100);
LTT.deck({
  title: "노선 수와 접근성", theme: "studio", exemplar: true,
  glossary: { "역세권": "역에서 걸어서 닿는 범위. 여기서는 노선에서 800m(도보 약 10분) 안" },
  scenes: [{
    type: "play", title: "방사형 노선을 늘릴수록 외곽 출근자가 역에 닿는다",
    sub: "점은 출근자, 색 띠는 노선의 {{역세권}}이다. 띠 안의 사람만 걸어서 노선에 올라 도심으로 흐른다.",
    knobs: [{ id: "lines", label: "방사형 노선 수", options: [1, 2, 4, 6, 8], value: 2 }],
    visual: (p) => city(Number(p.lines)),
    readout: (p) => { const n = Number(p.lines); return [{ label: "역세권 안 출근자", value: pct(share(n)), unit: "%", tone: "accent" },
      { label: "도심 0–3km", value: pct(share(n, 0, 3)), unit: "%" }, { label: "중간 3–6km", value: pct(share(n, 3, 6)), unit: "%" },
      { label: "외곽 6–10km", value: pct(share(n, 6, 11)), unit: "%" }]; },
    goal: { text: "출근자의 3분의 2 이상이 역세권에 들게 한다", check: (p) => share(Number(p.lines)) >= 2 / 3 },
    basis: "도보 10분 ≈ 800m(보행 1.3m/s). 밀도는 도심에서 지수 감소(Clark 1951), 반경 10km 가상 도시 600점. 모델로 계산한 예시."
  }]
});
</script></body></html>
