<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노선 수와 접근성</title>
<script type="application/json" id="ltt-meta">{"topic":"노선 수에 따른 출근 인구의 대중교통 접근성","audience":"도시 계획 입문자","theme":"atlas","medium":"도시 노선도","decision":"방사형 노선 수","domain":"도시","pattern":["mount"],"mode":"카탈로그용: 장면 하나짜리 본보기. 분포 구조를 \"입자가 흐름\" 움직임과 좌우 분할 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.ta{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center;width:100%}
.ta-map{width:100%;max-width:520px;height:auto;display:block;justify-self:end}
.ta-side{display:flex;flex-direction:column;gap:18px;max-width:420px}
.ta-rings{width:100%;height:auto;display:block}
.ta-rings text,.ta-map text{font-family:var(--ltt-mono)}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const RCITY = 10, WALK = 0.8;
// 고정 시드 난수: 도심에서 멀수록 줄어드는 거주 밀도(지수 감소, 척도 3.5km). Clark(1951)의 도시 밀도 감소 모형을 따른 가상 도시.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PEOPLE = []; while (PEOPLE.length < 600) { const r = -3.5 * Math.log(1 - rnd()); if (r > RCITY) continue; const a = rnd() * 2 * Math.PI; PEOPLE.push({ r, a }); }
const lineAngles = (n) => Array.from({ length: n }, (_, k) => -Math.PI / 2 + 2 * Math.PI * k / n);
const nearest = (p, n) => { let best = { d: p.r, a: 0, along: 0 };
  for (const a of lineAngles(n)) { let da = Math.abs(((p.a - a) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
    const d = da < Math.PI / 2 ? p.r * Math.sin(da) : p.r; if (d < best.d) best = { d, a, along: da < Math.PI / 2 ? p.r * Math.cos(da) : 0 }; }
  return best; };
const share = (n) => PEOPLE.filter((p) => nearest(p, n).d <= WALK).length / PEOPLE.length;
const RINGS = [[0, 3, "도심 0–3km"], [3, 6, "중간 3–6km"], [6, 10, "외곽 6–10km"]];
const ringShare = (n, r0, r1) => { const g = PEOPLE.filter((p) => p.r >= r0 && p.r < r1); return g.filter((p) => nearest(p, n).d <= WALK).length / g.length; };
const mk = (tag, a, p) => { const e = document.createElementNS(SVG, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };

function cityMap(host) {
  const S = 520, C = S / 2, K = (S / 2 - 24) / RCITY;
  const s = mk("svg", { viewBox: `0 0 ${S} ${S}`, class: "ta-map", "data-annotate": "" }, host);
  const P = (r, a) => [C + r * K * Math.cos(a), C + r * K * Math.sin(a)];
  mk("circle", { cx: C, cy: C, r: RCITY * K, style: "fill:var(--ltt-land);stroke:var(--ltt-border);stroke-width:1.5" }, s);
  [3, 6].forEach((r) => mk("circle", { cx: C, cy: C, r: r * K, style: "fill:none;stroke:var(--ltt-border);stroke-dasharray:3 5" }, s));
  const lines = mk("g", {}, s), dots = mk("g", {}, s), rides = mk("g", {}, s);
  mk("circle", { cx: C, cy: C, r: 11, style: "fill:var(--ltt-ink);stroke:var(--ltt-bg);stroke-width:3" }, s);
  const cl = mk("text", { x: C + 16, y: C - 14, style: "font-size:14px;font-weight:700;fill:var(--ltt-ink)" }, s); cl.textContent = "도심 업무지구";
  const sc = mk("text", { x: S - 8, y: S - 8, "text-anchor": "end", style: "font-size:12px;fill:var(--ltt-muted)" }, s); sc.textContent = "반경 10km · 점 하나 = 출근자 약 1,000명";
  const nodes = PEOPLE.map((p) => { const [x, y] = P(p.r, p.a); return mk("circle", { cx: x, cy: y, r: 3.2 }, dots); });
  function set(n) {
    lines.innerHTML = ""; rides.innerHTML = "";
    lineAngles(n).forEach((a, i) => { const [x, y] = P(RCITY, a);
      mk("line", { x1: C, y1: C, x2: x, y2: y, style: `stroke:var(--ltt-c${i % 6 + 1});stroke-width:${WALK * K * 2};opacity:.16;stroke-linecap:round` }, lines);
      mk("line", { x1: C, y1: C, x2: x, y2: y, style: `stroke:var(--ltt-c${i % 6 + 1});stroke-width:4;stroke-linecap:round` }, lines);
      for (let r = 1.5; r < RCITY; r += 1.5) { const [sx, sy] = P(r, a); mk("circle", { cx: sx, cy: sy, r: 4, style: "fill:var(--ltt-bg);stroke:var(--ltt-ink-2);stroke-width:1.5" }, lines); } });
    // 출근 경로: 집 → 가장 가까운 노선(걷기) → 도심(타기). 화면에는 그리지 않고 flow가 따라가는 길로만 쓴다.
    PEOPLE.forEach((p, i) => { const nb = nearest(p, n), ok = nb.d <= WALK;
      nodes[i].setAttribute("class", ok ? "ta-in" : "");
      nodes[i].style.fill = ok ? "var(--ltt-accent)" : "var(--ltt-muted)"; nodes[i].style.opacity = ok ? .35 : .3;
      if (ok && i % 3 === 0) { const [x0, y0] = P(p.r, p.a), [x1, y1] = P(nb.along, nb.a);
        mk("path", { class: "ta-ride", d: `M${x0} ${y0}L${x1} ${y1}L${C} ${C}`, style: "fill:none;stroke:none" }, rides); } });
    LTT.motion.play(s, [
      { t: [0, 1000], morph: ".ta-in", to: { opacity: .95 }, text: "0–1s 노선 띠 안의 출근자 점만 밝아진다" },
      { t: [1000, 4000], flow: ".ta-ride", count: 2, laps: 0.75, tail: 20, r: 4.4, text: "1–4s 띠 안 출근자가 걸어서 노선에 오르고 도심으로 흐른다" },
      { t: [4000, 5000], text: "4–5s 띠 밖 점은 흐린 채 남고, 오른쪽 비율 숫자·막대는 노선 수와 함께 고정된다" },
    ]);
  }
  return { el: s, set };
}

function ringBars(host) {
  const W = 420, H = 150, L = 118, R = 380;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "ta-rings" }, host);
  const bars = RINGS.map((rg, i) => { const y = 14 + i * 46;
    const l = mk("text", { x: L - 12, y: y + 17, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s); l.textContent = rg[2];
    mk("rect", { x: L, y, width: R - L, height: 24, style: "fill:var(--ltt-card-2)" }, s);
    const b = mk("rect", { x: L, y, height: 24, style: "fill:var(--ltt-accent);transition:width .6s cubic-bezier(.3,.7,.2,1)" }, s);
    const v = mk("text", { y: y + 17, style: "font-size:14px;font-weight:700;fill:var(--ltt-ink)" }, s); return { b, v }; });
  return { set(n) { RINGS.forEach((rg, i) => { const f = ringShare(n, rg[0], rg[1]); bars[i].b.setAttribute("width", (R - L) * f);
      bars[i].v.setAttribute("x", L + (R - L) * f + 8); bars[i].v.textContent = Math.round(f * 100) + "%"; }); } };
}

LTT.expect("노선 수가 늘면 접근성 단조 증가", share(8) > share(4) && share(4) > share(1) ? 1 : 0, 1);

LTT.deck({
  title: "노선 수와 접근성", theme: "atlas",
  glossary: { "역세권": "역에서 걸어서 닿는 범위. 여기서는 노선에서 800m(도보 약 10분) 안" },
  scenes: [{
    title: "방사형 노선을 늘릴수록 외곽 출근자가 먼저 역에 닿는다",
    sub: "왼쪽 점은 출근자, 색 띠는 노선의 {{역세권}}이다. 띠 안의 사람만 걸어서 노선에 오르고 도심으로 흐른다.",
    basis: "도보 10분 ≈ 800m(보행 1.3m/s). 거주 밀도는 도심에서 지수로 감소(Clark 1951 모형), 반경 10km 가상 도시 600점. 모델로 계산한 예시.",
    mount(body) {
      body.innerHTML = `<div class="ta"><div id="mapbox"></div><div class="ta-side">
        <div class="ltt-stat"><span class="ltt-hero" id="sh"></span> <small>출근자가 역세권 안</small></div>
        <div class="ltt-param">방사형 노선 <b id="lines-v"></b><div id="lines"></div></div>
        <div id="rings"></div><div id="goal"></div>
        <span class="ltt-tag muted">모델로 계산한 예시</span></div></div>`;
      const m = cityMap(body.querySelector("#mapbox")), rb = ringBars(body.querySelector("#rings"));
      LTT.sweep({ params: { lines: { kind: "steps", stops: [1, 2, 4, 6, 8], value: 2, fmt: (v) => v + "개" } }, attract: false,
        render: ({ lines }) => { m.set(lines); rb.set(lines); body.querySelector("#sh").textContent = Math.round(share(lines) * 100) + "%"; },
        goal: { el: "goal", text: "출근자의 3분의 2 이상이 역세권에 들게 한다", check: ({ lines }) => share(lines) >= 2 / 3 } });
    }
  }]
});
</script>
</body>
</html>
