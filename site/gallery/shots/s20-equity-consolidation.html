<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결 범위</title><script src="/kit/ltt.js"></script></head><body><script>
// 폰에서는 두 나무를 위아래로 둔다(dy).
const co = (p, dx, dy) => [{ id: p + "P", label: "한빛홀딩스", at: [dx + 22, 12], m: [50, dy + 6] }, { id: p + "A", label: "한빛화학", at: [dx + 10, 50], m: [24, dy + 22] },
  { id: p + "B", label: "누리물류", at: [dx + 34, 50], m: [76, dy + 22] }, { id: p + "C", label: "한빛소재", at: [dx + 10, 88], m: [24, dy + 38] }];
const own = (p) => [{ from: p + "P", to: p + "A", label: "60%" }, { from: p + "P", to: p + "B", label: "30%", dash: true }, { from: p + "A", to: p + "C", label: "70%" }];
const trees = LTT.graph({ layout: "manual", aspect: 2, mobileAspect: 0.68, edges: [...own(""), ...own("r")], nodes: [...co("", 0, 0), ...co("r", 50, 54)] });
LTT.expect("P의 C 실질 지분", 0.6 * 0.7, 0.42, { tol: 1e-9 });
LTT.deck({
  title: "연결 범위", theme: "ledger", exemplar: true,
  glossary: { "지분법": "영향력만 있는 회사의 이익을 지분율만큼 한 줄로 반영하는 방법" },
  scenes: [{
    type: "predict", title: "손자회사 이익 100억 중 지주회사 주주 몫은?",
    sub: "왼쪽은 주주명부 그대로, 오른쪽은 같은 회사들이 연결재무제표에서 서는 자리로 옮겨 간다.",
    visual: trees,
    q: "한빛소재 순이익 100억 중 한빛홀딩스 주주 몫은?",
    choices: ["70억 (A가 C를 70%)", "42억 (60% × 70%)", "100억 (전부 연결)"], answer: 1,
    why: "지배 사슬이 이어져 한빛소재는 통째로 합산되지만, 귀속은 실질 지분 60% × 70% = 42%다. 나머지 58억은 비지배지분. 30%인 누리물류는 {{지분법}}이라 범위 밖이다.",
    motion: [
      ["travel", { along: "P>A>C", dots: 2, dur: 1.6 }],
      ["mark", "ask"],
      { par: [["hide", { ids: ["rP>rA", "rP>rB", "rA>rC"] }],
        ["relayout", { to: { rP: [72, 12], rA: [60, 50], rC: [84, 50], rB: [72, 88] }, m: { rP: [50, 60], rA: [24, 78], rC: [76, 78], rB: [50, 95] }, dur: 2.4 }]] },
      { par: ["rP", "rA", "rC"].map((n) => ["set", { node: n, tone: "good" }]).concat([["set", { node: "rB", tone: "muted" }]]) },
      ["note", { n: 1 }], ["note", { n: 2 }],
      ["wait", 2]
    ],
    points: [{ on: "rA", text: "연결 범위: 세 회사 이익을 100% 합산" }, { on: "rB", text: "지분법: 누리물류 이익의 30%만 한 줄로" }],
    basis: "K-IFRS 1110(지배력), 1028(관계기업 지분법). 회사는 가상, 금액은 모델로 계산한 예시."
  }]
});
</script></body></html>
