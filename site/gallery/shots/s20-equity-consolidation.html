<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결 범위</title>
<script type="application/json" id="ltt-meta">{"topic":"연결재무제표 범위","audience":"회계 입문자","theme":"ledger","medium":"경제 신문 차트","decision":"지배주주 귀속 이익 계산","domain":"회계","pattern":["predict"],"mode":"카탈로그용: 장면 하나짜리 본보기. 계층 구조를 \"모양이 바뀜\" 움직임과 좌우 분할 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.eq-host{width:780px;max-width:100%;aspect-ratio:780/450;margin:0 auto}
.eq{width:780px;max-width:100%;height:auto;display:block;margin:0 auto}
.eq text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
// 가상 회사. 지배력 판단: 의결권 과반(K-IFRS 1110), 20% 이상 유의적 영향력은 지분법(K-IFRS 1028)
const CO = [
  { id: "P", n: "한빛홀딩스", s: "지배회사", tree: [195, 70], box: [585, 88] },
  { id: "A", n: "한빛화학", s: "P가 60%", tree: [100, 200], box: [500, 200] },
  { id: "B", n: "누리물류", s: "P가 30%", tree: [290, 200], box: [585, 388] },
  { id: "C", n: "한빛소재", s: "A가 70%", tree: [100, 330], box: [670, 200] },
];
const EDGES = [{ f: "P", t: "A", p: 60 }, { f: "P", t: "B", p: 30 }, { f: "A", t: "C", p: 70 }];
const ownC = 0.6 * 0.7;
LTT.expect("P의 C 실질 지분", ownC, 0.42, { tol: 1e-9 });
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };

function equity(host) {
  const W = 780, H = 450, NW = 136, NH = 56;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "eq", "data-annotate": "" }, host);
  el("line", { x1: 390, x2: 390, y1: 20, y2: H - 20, style: "stroke:var(--ltt-line);stroke-width:1" }, s);
  el("text", { x: 20, y: 22, style: "font-size:14px;fill:var(--ltt-muted);font-weight:600" }, s).textContent = "주주명부: 누가 누구를 얼마나";
  el("text", { x: 410, y: 22, style: "font-size:14px;fill:var(--ltt-muted);font-weight:600" }, s).textContent = "연결재무제표: 어디까지 한 회사로";
  // 왼쪽 고정 트리
  const nodeAt = (g, c, x, y) => { const r = el("rect", { x: x - NW / 2, y: y - NH / 2, width: NW, height: NH, rx: 3, style: "fill:var(--ltt-card);stroke:var(--ltt-ink-2);stroke-width:1.4" }, g);
    el("text", { x, y: y - 4, "text-anchor": "middle", style: "font-size:16px;fill:var(--ltt-ink);font-weight:700" }, g).textContent = c.n;
    el("text", { x, y: y + 16, "text-anchor": "middle", style: "font-size:13px;fill:var(--ltt-ink-2)" }, g).textContent = c.s; return r; };
  const byId = Object.fromEntries(CO.map((c) => [c.id, c]));
  EDGES.forEach((e) => { const a = byId[e.f].tree, b = byId[e.t].tree;
    el("path", { d: `M${a[0]},${a[1] + NH / 2} V${(a[1] + b[1]) / 2} H${b[0]} V${b[1] - NH / 2}`, style: `fill:none;stroke:var(--ltt-ink-2);stroke-width:${e.p > 50 ? 3 : 1.4}` }, s);
    el("text", { x: b[0] + 8, y: (a[1] + b[1]) / 2 + 26, style: "font-size:15px;fill:var(--ltt-ink);font-weight:700" }, s).textContent = e.p + "%"; });
  CO.forEach((c) => nodeAt(s, c, c.tree[0], c.tree[1]));
  // 오른쪽: 같은 트리가 연결 범위로 모양을 바꾼다
  const scope = el("rect", { rx: 6, style: "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2" }, s);
  const scopeT = el("text", { x: 585, y: 300, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-accent);font-weight:700" }, s);
  scopeT.textContent = "연결 범위: 100% 합산";
  const eqT = el("text", { x: 585, y: 438, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-ink-2)" }, s);
  eqT.textContent = "지분법: 이익의 30%만 한 줄로";
  const rEdges = EDGES.map((e) => ({ e, p: el("path", { style: `fill:none;stroke:var(--ltt-ink-2);stroke-width:${e.p > 50 ? 3 : 1.4}` }, s) }));
  const moving = CO.map((c) => { const g = el("g", {}, s); nodeAt(g, c, 0, 0); return { c, g }; });
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const home = (c) => [c.tree[0] + 390, c.tree[1]];
  function draw(u) {
    const k = ease(clamp((u - .12) / .33)) * (1 - ease(clamp((u - .88) / .12)));
    const pos = {}; moving.forEach(({ c, g }) => { const p = lerp(home(c), c.box, k); pos[c.id] = p; g.setAttribute("transform", `translate(${p[0]},${p[1]})`); });
    rEdges.forEach(({ e, p }) => { const a = pos[e.f], b = pos[e.t];
      p.setAttribute("d", `M${a[0]},${a[1] + NH / 2} V${(a[1] + b[1]) / 2} H${b[0]} V${b[1] - NH / 2}`); p.style.opacity = 1 - k; });
    const sc = clamp((k - .6) / .4);
    scope.setAttribute("x", 585 - 165 * sc); scope.setAttribute("y", 194 - 140 * sc); scope.setAttribute("width", 330 * sc); scope.setAttribute("height", 266 * sc);
    scope.style.opacity = sc; scopeT.style.opacity = sc; eqT.style.opacity = sc;
  }
  return { el: s, draw };
}

// 장면 공통 leave는 mount에서만 불리므로 visual 함수의 반복은 문서에서 떨어지면 멈추고 숨은 동안은 그리지 않는다
function loop(period, draw, node) {
  let raf = 0, t0 = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(raf); if (reduced) { draw(0.6); return; }
      t0 = Date.now(); const f = () => { if (node && !node.isConnected) return; if (!node || node.checkVisibility()) draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } };
}

LTT.deck({
  title: "연결 범위", theme: "ledger",
  glossary: { "지분법": "영향력만 있는 회사의 이익을 지분율만큼 한 줄로 반영하는 방법" },
  scenes: [{
    type: "predict", title: "손자회사 이익 100억 중 지주회사 주주 몫은?",
    question: "한빛소재가 순이익 100억 원을 냈다. 그룹을 한 회사로 묶은 연결재무제표에는 100억이 다 들어간다. 그중 한빛홀딩스 주주에게 귀속되는 몫은?",
    visual: '<div class="eq-host"></div>',
    // kit이 visual을 재려고 그린 사본을 화면에 쓰므로, 움직이는 그림은 장면 enter에서 화면의 자리에 직접 그린다
    enter(body) { const host = body.querySelector(".eq-host"); if (!host || host.firstChild) return; const f = equity(host); f.draw(0); loop(8000, f.draw, f.el).enter(); },
    choices: [{ id: "70", text: "70억 (A가 C를 70%)" }, { id: "42", text: "42억 (60% × 70%)" }, { id: "100", text: "100억 (전부 연결)" }],
    answer: "42",
    why: "지배 사슬이 이어져 한빛소재는 통째로 합산되지만, 귀속은 실질 지분 60% × 70% = 42%다. 나머지 58억은 비지배지분이다. 30%인 누리물류는 {{지분법}}이라 상자 밖에 남는다. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    basis: "K-IFRS 1110(지배력), 1028(관계기업 지분법). 회사는 가상."
  }]
});
</script>
</body>
</html>
