<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뱅크런 되먹임</title><script src="/kit/ltt.js"></script></head><body><script>
const NODES = [["out", "예금 인출", "3월 9일 하루 420억$", "다음 날 아침 1,000억 달러가 더 인출을 기다렸다"],
  ["cash", "현금 부족", "채권을 팔아 현금 마련", "3월 8일 채권 210억 달러를 급히 팔았다"],
  ["loss", "손실 확정", "매각 손실 18억$", "만기보유 채권에 숨은 평가손이 약 150억 달러였다"],
  ["trust", "신뢰 하락", "주가 하루 −60%", "증자 발표가 오히려 경보가 됐다"],
  ["panic", "불안 확산", "예금 94% 보호 한도 밖", "25만 달러 넘는 예금은 먼저 빼는 쪽이 유리했다"]];
const ids = NODES.map(([id]) => id), AT = NODES.map((_, i) => [50 + 32 * Math.sin(i * 1.2566), 50 - 38 * Math.cos(i * 1.2566)]);
const near = (i) => ({ to: [AT[i][0] - 28, AT[i][1] - 30, 56, 60] });
LTT.deck({
  title: "뱅크런 되먹임", theme: "ledger", exemplar: true,
  glossary: { "뱅크런": "예금자들이 은행이 위험하다고 보고 한꺼번에 예금을 빼는 일", "되먹임": "결과가 다시 원인을 키우는 고리" },
  scenes: [{
    type: "overview", title: "뱅크런은 다섯 칸짜리 되먹임 고리다",
    sub: "번호를 따라가면 {{뱅크런}}의 각 칸 결과가 다음 칸의 원인이 되는 {{되먹임}}이다. 실리콘밸리은행(SVB), 2023년 3월 8–10일.",
    visual: LTT.graph({ layout: "manual", aspect: 1.7, mobileAspect: 0.8,
      nodes: [...NODES.map(([id, label, sub], i) => ({ id, label, sub, at: AT[i] })),
        { id: "core", label: "인출이 인출을 부른다", sub: "SVB 2023년 3월 8–10일", ghost: true, at: [50, 54], m: [50, 59] }],
      edges: ids.map((id, i) => ({ from: id, to: ids[(i + 1) % 5], tone: "bad" })) }),
    points: NODES.map(([id, , , text]) => ({ on: id, text })),
    motion: [["wait", 1.2], { par: [["zoom", { ...near(0), dur: 1 }], ["note", { n: 1 }]] }, ["wait", 0.8],
      ...ids.slice(1).map((id, i) => ({ par: [["travel", { along: `${ids[i]}>${id}`, tone: "bad", dur: 1.2 }], ["zoom", { ...near(i + 1), dur: 1.2 }], ["note", { n: i + 2 }]] })),
      ["wait", 0.8], { par: [["travel", { along: "panic>out", tone: "bad", dur: 1 }], ["reset", { dur: 1 }]] }, ["wait", 1]],
    takeaway: "인출 → 급매 → 손실 → 불신 → 인출은 스스로 커지는 고리다.",
    basis: "Federal Reserve(2023-04) SVB 감독 검토 보고서. 인출액·매각액·주가는 보도된 실제 값이다."
  }]
});
</script></body></html>
