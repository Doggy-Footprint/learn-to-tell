<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>얼음-알베도 되먹임</title><script src="/kit/ltt.js"></script></head><body><script>
const steps = ["warm", "ice", "albedo", "absorb"];
const view = { warm: [20, 0, 60, 60], ice: [40, 20, 60, 60], albedo: [20, 40, 60, 60], absorb: [0, 20, 60, 60] };
LTT.deck({
  title: "얼음-알베도 되먹임", theme: "paper", exemplar: true,
  glossary: { "알베도": "표면에 닿은 햇빛 가운데 되튕겨 나가는 비율. 0이면 모두 흡수, 1이면 모두 반사" },
  scenes: [{
    type: "overview", layout: "full", title: "한 장 정리: 녹을수록 더 녹는 고리",
    sub: "네 칸을 고리 순서대로 확대했다가 전체로 돌아온다. {{알베도}}가 떨어져 ④에서 ①로 이어지면 고리가 닫힌다.",
    visual: LTT.graph({
      layout: "ring", aspect: 1.6,
      nodes: [
        { id: "warm", label: "① 북극 기온 상승", sub: "2023년 평년보다 +2.6℃", icon: "trend", tone: "bad" },
        { id: "ice", label: "② 9월 해빙 감소", sub: "7.0 → 4.4 백만 km²", icon: "layers" },
        { id: "albedo", label: "③ 알베도 하락", sub: "해빙 0.7 → 바다 0.06", icon: "gauge" },
        { id: "absorb", label: "④ 바다가 더 흡수", sub: "흡수 약 30% → 94%", icon: "bolt", tone: "warn" }],
      edges: steps.map((id, i) => ({ from: id, to: steps[(i + 1) % 4] })) }),
    points: [{ on: "absorb", text: "+ 되먹임: 처음 변화를 스스로 키운다" }],
    motion: [
      ["wait", 1.2],
      ...steps.flatMap((id, i) => [
        { par: [["zoom", { to: view[id], dur: 0.9 }], ["highlight", { id, dur: 1.6 }], ...(i ? [["travel", { along: `${steps[i - 1]}>${id}`, dur: 0.9 }]] : [])] },
        ["wait", 0.6]]),
      { par: [["reset", { dur: 0.9 }], ["travel", { along: "absorb>warm", dur: 0.9 }]] },
      { par: [["travel", { along: "warm>ice>albedo>absorb>warm", dots: 3, dur: 2.4 }], ["note", { n: 1 }]] }
    ],
    basis: "해빙: NSIDC Sea Ice Index 9월 평균. 알베도: NSIDC(해빙 0.5–0.7, 바다 0.06). 기온: NASA GISTEMP 북극 근사."
  }]
});
</script></body></html>
