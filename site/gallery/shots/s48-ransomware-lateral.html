</head><body><script>
const SVG = "http://www.w3.org/2000/svg";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(period, draw) { let raf = 0, t0 = 0;

      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } }; }
const N = [{ id: "pc", l: "직원 PC", x: 50, y: 70 }, { id: "pc2", l: "직원 PC 2", x: 50, y: 190 }, { id: "fs", l: "파일 서버", x: 200, y: 70 },

const P = { pc: 0, pc2: 0, fs: 0, dc: 0, bk: 0 };
const STAGES = [
  { t: "① 초기 침투", s: "피싱 메일 첨부 실행", hot: ["pc"], flow: [], ext: true },

  { t: "④ 백업 삭제 후 암호화", s: "모든 노드에 동시 실행", hot: ["pc", "dc", "pc2", "fs", "bk"], flow: [["dc", "fs"], ["dc", "pc2"], ["dc", "bk"], ["dc", "pc"]], lock: true } ];
const at = (id) => N.find((n) => n.id === id);
const draws = [];
function panel(host, st, si) {
  const s = el("svg", { viewBox: "0 0 250 330" }, host);

  const sub = el("text", { x: 14, y: 314, style: "font-size:11.5px;fill:var(--ltt-muted)" }, s); sub.textContent = st.s;
  E.forEach(([a, b]) => el("line", { x1: at(a).x, y1: at(a).y, x2: at(b).x, y2: at(b).y, style: "stroke:var(--ltt-line-2);stroke-width:1.5" }, s));
  const nodes = N.map((n) => { const g = el("g", {}, s);
    const c = el("rect", { x: n.x - 17, y: n.y - 14, width: 34, height: 28, rx: 4, style: "fill:var(--ltt-card-2);stroke:var(--ltt-line-2);stroke-width:1.5" }, g);
    const t = el("text", { x: n.x, y: n.y + 28, "text-anchor": "middle", style: "font-size:11px;fill:var(--ltt-ink-2)" }, g); t.textContent = n.l;
    const lk = el("text", { x: n.x, y: n.y + 5, "text-anchor": "middle", style: "font-size:12px;font-weight:700;fill:var(--ltt-bad);opacity:0" }, g); lk.textContent = "ENC";
    return { n, c, lk }; });
  let ext;
  if (st.ext) { ext = el("text", { x: 14, y: 46, style: "font-size:11px;fill:var(--ltt-bad)" }, s); ext.textContent = "외부 → invoice.docm"; }
  const parts = []; st.flow.forEach((f, fi) => { for (let k = 0; k < 4; k++) parts.push({ f, off: k / 4 + fi * 0.07, c: el("circle", { r: 3.6, style: "fill:var(--ltt-bad)" }, s) }); });
  if (st.ext) for (let k = 0; k < 4; k++) parts.push({ f: null, off: k / 4, c: el("circle", { r: 3.6, style: "fill:var(--ltt-bad)" }, s) });
  function draw(u) {
    const grow = ease(clamp(u / 0.5));
    nodes.forEach((o, i) => { const k = st.hot.indexOf(o.n.id), on = k >= 0 && grow >= k / Math.max(1, st.hot.length);
      o.c.style.stroke = on ? "var(--ltt-bad)" : "var(--ltt-line-2)"; o.c.style.fill = on ? "var(--ltt-bad-soft)" : "var(--ltt-card-2)";

      p.c.setAttribute("cx", a.x + (b.x - a.x) * q); p.c.setAttribute("cy", a.y + (b.y - a.y) * q); p.c.style.opacity = Math.sin(q * Math.PI); });
  }
