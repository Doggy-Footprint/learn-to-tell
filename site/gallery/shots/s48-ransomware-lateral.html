<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜섬웨어 측면 이동</title><script src="/kit/ltt.js"></script></head><body><script>
const NODES = [{ id: "pc", label: "직원 PC", at: [22, 30] }, { id: "fs", label: "파일 서버", at: [78, 30] },
  { id: "pc2", label: "직원 PC 2", at: [22, 62] }, { id: "dc", label: "DC", at: [78, 62] }, { id: "bk", label: "백업", at: [50, 88] }];
const EDGES = [["pc", "fs"], ["pc", "dc"], ["pc", "pc2"], ["dc", "fs"], ["dc", "pc2"], ["dc", "bk"]].map(([from, to]) => ({ from, to }));
const STAGES = [
  { title: "① 초기 침투 · 피싱 메일", hot: ["pc"], flow: [] },
  { title: "② 관리자 해시 탈취", hot: ["pc"], flow: ["pc>dc"] },
  { title: "③ 측면 이동 · RDP·SMB", hot: ["pc", "dc", "pc2", "fs"], flow: ["pc>dc", "dc>fs", "dc>pc2", "dc>bk"] },
  { title: "④ 백업 삭제 후 암호화", hot: ["pc", "dc", "pc2", "fs", "bk"], flow: ["dc>fs", "dc>pc2", "dc>bk"] }];
const panel = (st, i) => ({ title: st.title, part: LTT.graph({ layout: "manual", aspect: 0.85,
  nodes: i ? NODES : [{ id: "x", label: "외부 메일", at: [22, 4], ghost: true, tone: "bad" }, ...NODES],
  edges: i ? EDGES : [{ from: "x", to: "pc", dash: true }, ...EDGES] }) });
const beat = (k) => ({ par: [
  ...(k === 0 ? [["travel", { along: "x>pc", panel: 0, tone: "bad", dots: 3, dur: 1 }]] : []),
  ...STAGES.flatMap((st, i) => [...(st.flow.length ? [["flow", { edges: st.flow, panel: i, n: 3, tone: "bad", dur: 1 }]] : []),
    ...st.hot.filter((_, j) => Math.floor(j * 3 / st.hot.length) === k).map((node) => ["set", { node, panel: i, tone: "bad", dur: 0.4 }])]),
  ...(k === 2 ? NODES.map((n) => ["set", { node: n.id, panel: 3, sub: "ENC", tone: "bad", dur: 0.4 }]) : [])] });
LTT.deck({
  title: "측면 이동", theme: "terminal", exemplar: true,
  glossary: { "측면 이동": "처음 뚫린 한 대에서 내부망의 다른 시스템으로 권한을 넓혀 옮겨 가는 공격 단계(MITRE ATT&CK TA0008)" },
  scenes: [{
    type: "hook", layout: "stack", pre: "랜섬웨어", text: "PC 한 대가 뚫리면 서버 전체가 잠긴다",
    sub: "공격자는 바로 암호화하지 않는다. 관리자 권한을 얻고 {{측면 이동}}으로 백업까지 닿은 뒤 한꺼번에 잠근다.",
    visual: LTT.multiples({ cols: 4, panels: STAGES.map(panel) }),
    motion: [0, 1, 2].map(beat), hold: 0.8,
    basis: "단계는 MITRE ATT&CK 기준. 침투부터 탐지까지 체류 기간 중앙값 약 10일(Sophos Active Adversary Report 2023)."
  }]
});
</script></body></html>
