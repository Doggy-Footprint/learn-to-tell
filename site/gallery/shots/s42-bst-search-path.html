<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이진 탐색 트리</title><script src="/kit/ltt.js"></script></head><body><script>
const KEYS = { 50: [50, 8], 30: [25, 30], 70: [75, 30], 20: [12, 52], 40: [38, 52], 60: [62, 52], 80: [88, 52], 45: [44, 74], 65: [69, 74] };
const PHONE = { 45: [40, 74], 65: [72, 74] };
const PARENT = { 30: 50, 70: 50, 20: 30, 40: 30, 60: 70, 80: 70, 45: 40, 65: 60 };
const cmp = (q, k, i) => `${i + 1}번 · ` + (q === k ? `${q} = ${k} 찾음` : `${q} ${q < k ? "<" : ">"} ${k} ${q < k ? "왼쪽" : "오른쪽"}`);
const search = (q, tone) => {
  const path = [50]; while (path.at(-1) !== q) { const k = path.at(-1), next = Object.keys(PARENT).map(Number).find((c) => PARENT[c] === k && (q < k) === (c < k)); if (!next) break; path.push(next); }
  const ids = path.map((k) => "n" + k).concat(path.at(-1) === q ? [] : ["none"]);
  LTT.expect(`${q} 탐색 비교 횟수`, path.length, 4, { tol: 0 });
  return [...ids.flatMap((id, i) => [{ par: [
      ...(i ? [["set", { node: ids[i - 1], sub: "" }]] : []),
      ["set", { node: id, sub: path[i] ? cmp(q, path[i], i) : `${q} 없음`, tone: path[i] === q ? "good" : path[i] ? tone : "bad" }],
      ["pulse", { node: id, tone, dur: 1 }]] },
      ...(ids[i + 1] ? [{ par: [["travel", { along: `${id}>${ids[i + 1]}`, tone, dur: 0.7 }], ["highlight", { id: `${id}>${ids[i + 1]}`, tone, keep: true, dur: 0.7 }]] }] : [])]),
    ["wait", 1.4], ["set", { node: ids.at(-1), sub: "" }]];
};
LTT.deck({
  title: "이진 탐색 트리", theme: "paper", exemplar: true,
  glossary: { "이진 탐색 트리": "모든 칸에서 왼쪽 아래에는 더 작은 값, 오른쪽 아래에는 더 큰 값만 두는 트리" },
  scenes: [{
    type: "figure", title: "비교 한 번마다 남은 후보가 절반으로 준다",
    sub: "{{이진 탐색 트리}}에서 값을 찾을 때 점은 위에서 한 길로만 내려간다. 작으면 왼쪽, 크면 오른쪽.",
    visual: LTT.graph({ layout: "manual", aspect: 1.6, mobileAspect: 1,
      nodes: [...Object.entries(KEYS).map(([k, at]) => ({ id: "n" + k, label: k, shape: "round", at, ...(PHONE[k] && { m: PHONE[k] }) })), { id: "none", label: "빈자리", ghost: true, at: [62, 94], m: [66, 94] }],
      edges: [...Object.entries(PARENT).map(([c, p]) => ({ from: "n" + p, to: "n" + c })), { from: "n65", to: "none", dash: true }] }),
    side: LTT.ledger([{ id: "c45", label: "45 찾기 비교", value: 4, unit: "번" }, { id: "c62", label: "62 찾기 비교", value: 4, unit: "번" }, { id: "h", label: "트리 높이", value: 4, unit: "층" }]),
    motion: [...search(45, "accent"), ...search(62, "warn")],
    narration: "45는 50 → 30 → 40 → 45, 62는 50 → 70 → 60 → 65에서 빈자리로 끝난다. 높이 4층이라 어떤 값이든 비교 4번 안에 끝난다.",
    basis: "균형 트리의 탐색 비교 횟수는 높이 ⌈log₂(n+1)⌉ 이하다. 정렬 순서로 넣어 기운 트리는 n번까지 간다(Cormen 외, CLRS 12장)."
  }]
});
</script></body></html>
