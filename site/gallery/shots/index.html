<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>움직이는 장면 본보기</title>
<script src="/kit/ltt.js"></script>
<style>
:root{--bg:var(--ltt-bg);--card:var(--ltt-card);--ink:var(--ltt-ink);--muted:var(--ltt-muted);--line:var(--ltt-line);--accent:var(--ltt-accent);--pick:var(--ltt-accent-soft)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Pretendard","Apple SD Gothic Neo",sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0 8px 0 0}.top output{font-variant-numeric:tabular-nums;color:var(--muted)}
.top input[type=text]{flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;padding:16px}
.lead{margin:12px 16px 0;max-width:70ch;color:var(--muted)}
.top a{color:var(--accent);text-decoration:none;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card.picked{outline:2px solid var(--accent);background:var(--pick)}
.frame{position:relative;aspect-ratio:1280/800;overflow:hidden;background:var(--line)}
.frame iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
.open{position:absolute;right:8px;bottom:8px;font-size:12px;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;text-decoration:none}
.missing{margin:auto;color:var(--muted);position:absolute;inset:0;display:grid;place-items:center}
header{display:flex;gap:8px;align-items:baseline;padding:8px 12px 0}header b{font-variant-numeric:tabular-nums}
.axes{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:6px 12px 0;padding:0}
.axes li{font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.note{margin:6px 12px 0;font-size:12.5px;color:var(--muted)}.note i{font-style:normal;color:var(--ink);margin-right:4px}.note.gap i{color:var(--ltt-warn)}
.card>:last-child{margin-bottom:12px}
</style></head><body>
<div class="top"><a href="../index.html">← gallery</a><h1>움직이는 장면 본보기</h1><output id="count">0개 선택</output><input type="text" id="picked" readonly placeholder="고른 번호가 여기 나온다"><button id="copy" type="button">번호 복사</button><a href="/legacy/gallery/shots/index.html">이전 버전</a></div>
<p class="lead">개념 구조·움직임·장면 역할·구도를 겹치지 않게 조합해 kit v2로 만든 장면 하나짜리 본보기다. 카드마다 무엇이 움직이는지와 옮길 원리를 적었다. 체크한 번호는 위에 모인다.</p>
<main class="grid" id="grid"></main>
<script>
const KEY = "ltt-shot-picks"; let picks = new Set();
try { picks = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch {}
const out = document.getElementById("picked"), count = document.getElementById("count"), grid = document.getElementById("grid");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function sync() {
  const l = [...picks].sort(); out.value = l.join(", "); count.textContent = l.length + "개 선택";
  document.querySelectorAll(".card").forEach((c) => { const on = picks.has(c.dataset.n); c.classList.toggle("picked", on); c.querySelector("input").checked = on; });
  try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {}
}
function scale() { document.querySelectorAll(".frame iframe").forEach((f) => { f.style.transform = "scale(" + f.parentElement.clientWidth / 1280 + ")"; }); }
fetch("axes.json").then((r) => r.json()).then((axes) => {
  grid.innerHTML = Object.keys(axes).sort().filter((n) => !axes[n].skip).map((n) => { const a = axes[n]; return `<article class="card" data-n="${n}">
  <div class="frame"><iframe data-src="${esc(a.file)}" loading="lazy" tabindex="-1" title="${esc(a.topic)}"></iframe><a class="open" href="${esc(a.file)}" target="_blank">크게 열기</a></div>
  <header><label><input type="checkbox" value="${n}"> <b>${n}</b></label><span>${esc(a.topic)}</span></header>
  <ul class="axes"><li>${esc(a.structure)}</li><li>${esc(a.theme)}</li><li>${esc(a.motion)}</li><li>${esc(a.role)}</li><li>${esc(a.composition)}</li></ul>
  <p class="note"><i>움직임</i>${esc(a.moves)}</p>
  <p class="note"><i>옮길 원리</i>${esc(a.principle)}</p>
</article>`; }).join("");
  const io = new IntersectionObserver((es) => es.forEach((e) => { const f = e.target; if (e.isIntersecting) { if (!f.src) f.src = f.dataset.src; } else if (f.src) f.removeAttribute("src"); }), { rootMargin: "200px" });
  document.querySelectorAll(".frame iframe").forEach((f) => io.observe(f));
  scale(); sync();
});
document.addEventListener("change", (e) => { if (e.target.matches("header input")) { e.target.checked ? picks.add(e.target.value) : picks.delete(e.target.value); sync(); } });
document.getElementById("copy").addEventListener("click", () => { navigator.clipboard?.writeText(out.value).catch(() => out.select()); });
addEventListener("resize", scale);
</script></body></html>
