<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>구역별 기대 득점</title><script src="/kit/ltt.js"></script></head><body><script>
// NBA.com 2023-24 리그 구역별 야투율(대략). 기대 득점 = 야투율 × 슛 점수. at = 라벨 자리(피트, 림 쪽 엔드라인이 y=0)
const Z = [
  { id: "ra", name: "림 앞", fg: 0.66, pts: 2, at: [25, 2.5] }, { id: "paint", name: "페인트", fg: 0.44, pts: 2, at: [25, 13] },
  { id: "mid", name: "미드레인지", fg: 0.42, pts: 2, at: [9, 19] }, { id: "corner", name: "코너 3점", fg: 0.39, pts: 3, at: [7, 5] },
  { id: "above", name: "윙·탑 3점", fg: 0.36, pts: 3, at: [25, 28.5] }
];
const eps = (z) => z.fg * z.pts;
LTT.expect("미드레인지 기대 득점", eps(Z[2]), 0.84, { tol: 1e-9 });
LTT.expect("코너 3점 기대 득점", eps(Z[3]), 1.17, { tol: 1e-9 });
const X = (x) => x * 2, Y = (y) => (32 - y) / 32 * 100, P = (pts) => "M" + pts.map(([x, y]) => `${X(x)},${Y(y)}`).join(" L") + " Z";
const arc = (r, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [25 + r * Math.cos(a), 5.25 + r * Math.sin(a)]; });
const yc = 5.25 + Math.sqrt(23.75 ** 2 - 22 ** 2), a3 = Math.atan2(yc - 5.25, -22);
const D = {
  above: P([[0, 0], [0, 32], [50, 32], [50, 0]]), mid: P([[3, 0], ...arc(23.75, a3, Math.PI - a3), [47, 0]]),
  corner: P([[0, 0], [0, yc], [3, yc], [3, 0]]) + P([[47, 0], [47, yc], [50, yc], [50, 0]]),
  paint: P([[17, 0], [17, 19], [33, 19], [33, 0]]), ra: P([[21, 0], ...arc(4, Math.PI, 0, 12), [29, 0]])
};
// morph의 highlight는 인라인 fill에 가려 보이지 않아, 같은 모양을 accent로 한 겹 더 깔고 state로 켠다
const shapes = { rim: { kind: "path", d: P(arc(0.75, 0, 2 * Math.PI, 16)), fill: "--ltt-ink" } }, states = { E: { "x-mid": { opacity: 0.55 } } };
[...Z].reverse().forEach((z) => {
  shapes[z.id] = { kind: "path", d: D[z.id], fill: "--ltt-card", stroke: "--ltt-line-2" };
  shapes[`h-${z.id}`] = { kind: "path", d: D[z.id], fill: "--ltt-accent", opacity: 0 };
  if (z.id === "mid") shapes["x-mid"] = { kind: "path", d: D.mid, fill: "--ltt-bad", opacity: 0 };
  states[z.id] = Object.fromEntries(Z.map((o) => [`h-${o.id}`, { opacity: o === z ? 0.45 : 0 }]));
});
Z.forEach((z) => {
  shapes[`f-${z.id}`] = { kind: "label", x: X(z.at[0]), y: Y(z.at[1]), text: `${z.name} ${Math.round(z.fg * 100)}% · ${z.pts}점` };
  shapes[`e-${z.id}`] = { kind: "label", x: X(z.at[0]), y: Y(z.at[1]), text: `${z.name} ${eps(z).toFixed(2)}점`, opacity: 0 };
  states.E[`f-${z.id}`] = { opacity: 0 }; states.E[`e-${z.id}`] = { opacity: 1 }; states.E[`h-${z.id}`] = { opacity: 0 };
});
LTT.deck({
  title: "구역별 기대 득점", theme: "sketch", exemplar: true,
  glossary: { "기대 득점": "슛 한 번에 평균으로 얻는 점수. 성공률 × 그 슛의 점수" },
  scenes: [{
    type: "predict", kicker: "슛 선택", title: "슛 한 번의 값은 어디가 가장 낮을까",
    sub: "구역을 훑으며 리그 평균 성공률과 점수를 본다. {{기대 득점}}은 둘을 곱한 값이다.",
    visual: LTT.morph({ aspect: 50 / 32, shapes, states }),
    q: "기대 득점이 가장 낮은 구역은?",
    choices: ["림 앞", "미드레인지", "윙·탑 3점"], answer: 1,
    motion: [...Z.flatMap((z) => [["to", { state: z.id, dur: 0.4 }], ["wait", 0.9]]), ["mark", "ask"], ["to", { state: "E", dur: 1 }], ["wait", 2.5]],
    why: "미드레인지는 0.42 × 2 = 0.84점, 성공률이 더 낮은 3점은 0.36 × 3 = 1.08점이다. 모델로 계산한 예시.",
    basis: "NBA.com 2023-24 리그 구역별 야투율을 반올림한 값(불확실). 자유투·파울 유도는 뺐다."
  }]
});
</script></body></html>
