<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>표본 크기와 검정력</title><script src="/kit/ltt.js"></script></head><body><script>
const PA = 0.10, PB = 0.11, D = (PB - PA) * 100;
const se = (n) => 100 * Math.sqrt((PA * (1 - PA) + PB * (1 - PB)) / n);
const Phi = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
const power = (n) => 1 - Phi(1.96 - D / se(n));
LTT.expect("n=14,732 검정력", power(14732), 0.80, { tol: 0.005 });
const XS = Array.from({ length: 161 }, (_, i) => -2 + i * 5 / 160);
const curve = (n, mu, lo = -2, hi = 3) => XS.filter((x) => x >= lo && x <= hi).map((x) => [x, Math.exp(-((x - mu) ** 2) / (2 * se(n) ** 2)) / (se(n) * 2.5066)]);
LTT.deck({
  title: "표본 크기와 검정력", theme: "studio", exemplar: true,
  glossary: { "검정력": "실제로 차이가 있을 때 실험이 그 차이를 유의하다고 잡아낼 확률. 보통 80%를 목표로 한다" },
  scenes: [{
    type: "play", title: "표본이 작으면 두 분포가 겹쳐, 진짜 1%p 개선도 대부분 놓친다",
    sub: "전환율 10%인 A와 11%인 B. 한 봉우리가 둘로 갈라지는 만큼이 {{검정력}}이다. 사용자를 늘리면 봉우리가 좁아진다.",
    knobs: [{ id: "n", label: "그룹당 사용자", min: 500, max: 50000, value: 2000, log: true, unit: "명" }],
    visual: (p) => LTT.chart({
      x: { label: "관측한 전환율 차이 B − A (%p)", domain: [-2, 3] }, y: { domain: [0, 1.2 / (se(p.n) * 2.5066)], fmt: () => "" },
      series: [
        { id: "pw", label: "검정력", type: "area", points: curve(p.n, D, 1.96 * se(p.n)), tone: "accent" },
        { id: "h0", label: "차이 없음 (H0)", type: "line", points: curve(p.n, 0), tone: "ink" },
        { id: "h1", label: "B가 +1%p (H1)", type: "line", points: curve(p.n, 0), tone: "accent" }],
      refs: [{ id: "crit", x: 1.96 * se(p.n), label: "유의 기준 1.96 SE" }] }),
    motion: [
      { par: [["hide", { id: "crit", dur: 0.3 }], ["wait", 0.6]] },
      ["to", { id: "h1", points: curve(2000, D), dur: 1.4 }],
      { par: [["draw", { id: "pw", dur: 0.8 }], ["show", { id: "crit", dur: 0.4 }]] }, ["wait", 3],
      ["hide", { ids: ["crit", "pw"], dur: 0.3 }], ["to", { id: "h1", points: curve(2000, 0), dur: 1 }]
    ],
    readout: (p) => [{ label: "검정력", value: Math.round(power(p.n) * 100), unit: "%", tone: power(p.n) >= 0.8 ? "good" : "bad" }, { label: "놓침", value: Math.round((1 - power(p.n)) * 100), unit: "%" }],
    goal: { text: "검정력 80%를 넘기는 표본을 찾는다", check: (p) => power(p.n) >= 0.8 },
    basis: "양측 α=0.05, 정규 근사, SE=√(pA(1−pA)/n+pB(1−pB)/n). 80%에 필요한 n≈14,700명. 모델 예시"
  }]
});
</script></body></html>
