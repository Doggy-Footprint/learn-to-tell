<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공유기 위치와 신호</title><script src="/kit/ltt.js"></script></head><body><script>
// 12m × 8m 아파트(m). 외벽·내력벽 콘크리트(c: 1), 방 칸막이 석고보드
const WALLS = [
  { a: [0, 0], b: [12, 0], c: 1 }, { a: [12, 0], b: [12, 8], c: 1 }, { a: [12, 8], b: [0, 8], c: 1 }, { a: [0, 8], b: [0, 0], c: 1 },
  { a: [4, 0], b: [4, 3.2], c: 1 }, { a: [4, 4.4], b: [4, 8], c: 1 }, { a: [8, 0], b: [8, 2.6], c: 0 }, { a: [8, 3.6], b: [8, 8], c: 0 },
  { a: [8, 4.5], b: [12, 4.5], c: 0 }, { a: [0, 4.5], b: [2.4, 4.5], c: 0 }, { a: [3.2, 4.5], b: [4, 4.5], c: 0 }];
// 2.4GHz 실내 경로 손실: 1m에서 -40dBm, 지수 3, 콘크리트 12dB, 석고보드 4dB
const side = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
const cross = (p, q, w) => side(p, q, w.a) * side(p, q, w.b) < 0 && side(w.a, w.b, p) * side(w.a, w.b, q) < 0;
const rssi = (r, p) => -40 - 30 * Math.log10(Math.max(1, Math.hypot(p[0] - r[0], p[1] - r[1]))) - WALLS.reduce((s, w) => s + (cross(r, p, w) ? (w.c ? 12 : 4) : 0), 0);
const FAR = [10, 2.2], CELLS = [];
for (let x = 0.25; x < 12; x += 0.5) for (let y = 0.25; y < 8; y += 0.5) CELLS.push([x, y]);
LTT.expect("벽 없이 4m 거리 신호", -40 - 30 * Math.log10(4), -58.06, { tol: 0.01 });
const band = (v) => (v >= -60 ? 0 : v >= -70 ? 1 : 2);
LTT.deck({
  title: "공유기 위치와 신호", theme: "blueprint", exemplar: true,
  glossary: { "dBm": "1mW를 기준으로 한 전력의 로그 단위. -60이 -70보다 10배 강하다", "벽 감쇠": "전파가 벽을 지날 때 잃는 세기. 콘크리트가 석고보드보다 훨씬 크다" },
  scenes: [{
    type: "play", title: "공유기를 옮기면 신호 지도가 벽을 따라 다시 그려진다",
    sub: "12m × 8m 평면도. 칸 색이 그 자리의 신호({{dBm}})이고, 벽마다 {{벽 감쇠}}만큼 깎인다. 띠가 훑는 순서로 읽는다.",
    knobs: [{ id: "x", label: "공유기 가로 위치", min: 0.5, max: 11.5, step: 0.5, value: 1.5, unit: "m" },
      { id: "y", label: "공유기 세로 위치", min: 0.5, max: 7.5, step: 0.5, value: 6.5, unit: "m" }],
    visual: (p) => LTT.chart({ x: { label: "가로 (m)", domain: [0, 12] }, y: { label: "세로 (m)", domain: [0, 8] }, aspect: 1.5,
      series: [
        ...[["-60 이상 좋음", "good"], ["-70까지 보통", "warn"], ["그 아래 약함", "bad"]].map(([label, tone], b) =>
          ({ id: "s" + b, label, type: "dot", tone, points: CELLS.filter((c) => band(rssi([p.x, p.y], c)) === b) })),
        { id: "far", label: "침실 2", type: "dot", tone: "ink", points: [FAR] },
        { id: "ap", label: "공유기", type: "dot", tone: "accent", points: [[p.x, p.y]] }],
      refs: [{ id: "w4", x: 4, label: "콘크리트 벽" }, { id: "w8", x: 8, label: "석고 벽" }, { id: "wh", y: 4.5, label: "석고 칸막이" }] }),
    readout: (p) => { const v = rssi([p.x, p.y], FAR); return [{ label: "침실 2 신호", value: v.toFixed(0), unit: "dBm", tone: ["good", "warn", "bad"][band(v)] }]; },
    goal: { text: "침실 2에서 -67dBm 이상(영상 통화 권장선)이 나오는 자리를 찾는다", check: (p) => rssi([p.x, p.y], FAR) >= -67 },
    motion: [["scan", { from: 0, to: 12, width: 1.2, dur: 4.2 }]],
    hold: 0.8,
    basis: "실내 경로 손실 지수 3, 벽 감쇠 콘크리트 12dB·석고보드 4dB(ITU-R P.1238 범위). 화면 수치는 모델로 계산한 예시."
  }]
});
</script></body></html>
