<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>달의 위상</title><script src="/kit/ltt.js"></script></head><body><script>
const SYN = 29.53;
const NAMES = [[0.03, "삭"], [0.22, "초승달"], [0.28, "상현"], [0.47, "차가는 볼록달"], [0.53, "보름"], [0.72, "기우는 볼록달"], [0.78, "하현"], [0.97, "그믐달"], [1.01, "삭"]];
const litFrac = (th) => (1 - Math.cos(th)) / 2;
LTT.expect("상현의 밝은 비율", litFrac(Math.PI / 2), 0.5, { tol: 1e-9 });
// 위상각 th(0=삭, π=보름)에서 지구에서 본 밝은 부분. 북반구 기준 차는 달은 오른쪽이 밝다
const litPath = (cx, cy, r, th) => {
  const c = Math.cos(th), rx = Math.abs(c) * r, wax = Math.sin(th) >= 0, top = `${cx},${cy - r}`, bot = `${cx},${cy + r}`;
  return wax ? `M${top} A${r},${r} 0 0 1 ${bot} A${rx},${r} 0 0 ${c > 0 ? 0 : 1} ${top}Z`
             : `M${top} A${r},${r} 0 0 0 ${bot} A${rx},${r} 0 0 ${c > 0 ? 1 : 0} ${top}Z`;
};
const fill = (h, tone) => `fill:${h.color(tone)}`;
const moon = LTT.draw({
  aspect: 1.4, mobileAspect: 4 / 5, dur: 10, beats: [1.4, 2.5, 5, 7.5],
  setup(h) {
    const m = h.mobile, E = m ? [440, 330] : [280, 380], R = m ? 230 : 210, M = m ? [500, 870] : [810, 330], MR = m ? 150 : 160;
    h.el("circle", { cx: E[0], cy: E[1], r: R, class: "e", style: "fill:none;stroke-dasharray:6 8" });
    const sx = m ? 880 : 540;
    [-2, -1, 0, 1, 2].forEach((i) => h.el("line", { x1: sx + 50, x2: sx, y1: E[1] + i * 80, y2: E[1] + i * 80, class: "ref", style: `stroke:${h.color("warn")}` }));
    h.el("circle", { cx: E[0], cy: E[1], r: 30, class: "e", style: fill(h, "muted") });
    h.label(E[0], E[1] + 42, "지구", { anchor: "t", cls: "muted" });
    h.label(sx + 50, E[1] - 200, "← 햇빛", { anchor: "r", tone: "warn", cls: "strong" });
    const sight = h.el("line", { class: "ref" });
    const orb = h.g();
    h.el("circle", { r: 20, class: "e", style: fill(h, "bg") }, orb);
    h.el("path", { d: "M0,-20 A20,20 0 0 1 0,20Z", style: fill(h, "ink") }, orb);
    h.el("circle", { cx: M[0], cy: M[1], r: MR, class: "e", style: fill(h, "bg") });
    const lit = h.el("path", { style: fill(h, "ink") });
    const ang = h.label(0, 0, "", { tone: "accent", cls: "strong" });
    const name = h.label(M[0], M[1] + MR + 18, "", { anchor: "t", cls: "big" });
    const day = h.label(M[0], M[1] + MR + (m ? 130 : 80), "", { anchor: "t", cls: "muted" });
    h.anchor("orbit", E[0], E[1] - R); h.anchor("disk", M[0], M[1]);
    return { E, R, M, MR, sight, orb, lit, ang, name, day };
  },
  draw(t, h, s) {
    const q = (t / 10) * 4, k = Math.floor(q), u = ((k + h.ease.inOut(h.clamp((q - k - 0.12) / 0.76))) / 4) % 1;
    const th = 2 * Math.PI * u, x = s.E[0] + s.R * Math.cos(th), y = s.E[1] - s.R * Math.sin(th);
    s.orb.setAttribute("transform", `translate(${x},${y})`);
    Object.entries({ x1: s.E[0], y1: s.E[1], x2: x, y2: y }).forEach(([a, v]) => s.sight.setAttribute(a, v));
    h.pos(s.ang, s.E[0] + (s.R + 46) * Math.cos(th), s.E[1] - (s.R + 46) * Math.sin(th));
    s.ang.textContent = Math.round(th * 180 / Math.PI) + "°";
    s.lit.setAttribute("d", litPath(s.M[0], s.M[1], s.MR, th));
    s.name.textContent = NAMES.find((n) => u < n[0])[1];
    s.day.textContent = `${(u * SYN).toFixed(1)}일째 · 밝은 면 ${Math.round(litFrac(th) * 100)}%`;
  }
});
LTT.deck({
  title: "달의 위상", theme: "blueprint", exemplar: true,
  glossary: { "위상": "지구에서 볼 때 달의 밝은 부분이 보이는 모양" },
  scenes: [{
    type: "hook", pre: "달의 위상", text: "달은 늘 반만 밝다",
    sub: "햇빛을 받는 반쪽은 그대로이고, 지구에서 그 반쪽을 보는 각도만 돈다. 그 각도가 {{위상}}이다.",
    visual: moon,
    basis: "삭망월 29.53일. 궤도 크기와 달 크기는 축척이 아니다."
  }]
});
</script></body></html>
