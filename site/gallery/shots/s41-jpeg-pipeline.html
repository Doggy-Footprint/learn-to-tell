<title>JPEG 압축 단계</title>
<script type="application/json" id="ltt-meta">{"topic":"JPEG 압축 단계(YCbCr→DCT→양자화)","audience":"이미지 처리 입문 개발자","theme":"studio","medium":"이미지 툴 패널","decision":"JPEG 품질값","domain":"이미지","pattern":["overview"],"mode":"카탈로그용: 장면 하나짜리 본보기. 변환 구조를 \"값이 쌓임\" 움직임과 작은 여러 칸 구도로 보인다"}</script>

<script src="/kit/ltt.js"></script>

<script src="/kit/ltt-ui.js"></script>

<style>
.jp-wrap{display:flex;justify-content:center}
.jp{width:1120px;max-width:100%;height:auto;display:block}
.jp text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// 하늘과 지붕 모서리가 걸친 8×8 블록(밝기 0–255). 실제 사진 블록과 비슷한 부드러운 기울기 + 사선 경계
const Y = [...Array(8)].map((_, r) => [...Array(8)].map((_, c) => Math.round(r + c > 8 ? 70 + 4 * r : 190 - 6 * r + 2 * c)));
// ITU-T T.81 부록 K 표 K.1 휘도 양자화표(품질 50)
const QT = [16,11,10,16,24,40,51,61, 12,12,14,19,26,58,60,55, 14,13,16,24,40,57,69,56, 14,17,22,29,51,87,80,62,
  18,22,37,56,68,109,103,77, 24,35,55,64,81,104,113,92, 49,64,78,87,103,121,120,101, 72,92,95,98,112,100,103,99];
function dct(b) { const out = [], C = (k) => k ? 1 : Math.SQRT1_2;
  for (let u = 0; u < 8; u++) for (let v = 0; v < 8; v++) { let s = 0;
    for (let x = 0; x < 8; x++) for (let y = 0; y < 8; y++) s += (b[x][y] - 128) * Math.cos((2 * x + 1) * u * Math.PI / 16) * Math.cos((2 * y + 1) * v * Math.PI / 16);
    out.push(.25 * C(u) * C(v) * s); } return out; }
const COEF = dct(Y);
const QV = COEF.map((c, i) => Math.round(c / QT[i]));
const ZZ = (() => { const o = []; for (let s = 0; s < 15; s++) { const d = []; for (let i = 0; i <= s; i++) { const r = i, c = s - i; if (r < 8 && c < 8) d.push(r * 8 + c); } o.push(...(s % 2 ? d : d.reverse())); } return o; })();
const NZ = QV.filter((v) => v !== 0).length;
const lastNZ = ZZ.reduce((a, idx, k) => QV[idx] !== 0 ? k : a, 0);

function pipeline(host) {
  const W = 1120, H = 470, PW = 250, GAP = (W - 4 * PW) / 3, CELL = 24, G = CELL * 8;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "jp", "data-annotate": "" }, host);
  const panels = [
    { n: "①", t: "RGB 화소", total: 192, unit: "값", note: "R·G·B 각 64개" },
    { n: "②", t: "YCbCr 4:2:0", total: 96, unit: "값", note: "밝기 64 + 색 16 + 16" },
    { n: "③", t: "DCT 계수", total: 64, unit: "계수", note: "에너지가 왼쪽 위로 모인다" },
    { n: "④", t: "양자화 뒤", total: NZ, unit: "0 아닌 값", note: `지그재그 ${lastNZ + 1}번째 뒤로 전부 0` }];
  const P = panels.map((p, i) => {
    const x = i * (PW + GAP), g = mk("g", { transform: `translate(${x},0)` }, s);
    mk("text", { x: 0, y: 22, style: "font-size:15px;font-weight:700;fill:var(--ltt-accent)" }, g).textContent = p.n;
    mk("text", { x: 24, y: 22, style: "font-size:17px;font-weight:700;fill:var(--ltt-ink)" }, g).textContent = p.t;
    if (i < 3) mk("path", { d: `M${PW + 8},${40 + G / 2} l${GAP - 22},0 m-7,-6 l7,6 l-7,6`, style: "fill:none;stroke:var(--ltt-muted);stroke-width:1.6" }, g);
    const cells = [], gy = 40, gx = (PW - G) / 2;
    return { ...p, g, cells, gx, gy };
  });
  // ① 채널 셋을 겹쳐 놓은 화소 격자
  ["--ltt-c1", "--ltt-c2", "--ltt-c3"].forEach((tok, ch) => { const o = (2 - ch) * 7;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const v = Y[r][c] / 255 * (ch === 2 ? 1 : .85 + .1 * ch);
      P[0].cells.push(mk("rect", { x: P[0].gx + c * (CELL - 3) + o + 8, y: P[0].gy + r * (CELL - 3) + o, width: CELL - 4, height: CELL - 4, rx: 2, style: `fill:var(${tok});fill-opacity:${(.15 + .8 * v).toFixed(2)};opacity:0` }, P[0].g)); } });
  ["B", "G", "R"].forEach((t, k) => mk("text", { x: P[0].gx + 8 + 8 * (CELL - 3) + (2 - k) * 7 + 2, y: P[0].gy + 8 * (CELL - 3) + (2 - k) * 7 + 12 - 2 * (CELL - 3) * 0 + 0, style: "font-size:12px;font-weight:600;fill:var(--ltt-muted)" }, P[0].g).textContent = t);
  // ② Y 8×8 + Cb·Cr 4×4
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) P[1].cells.push(mk("rect", { x: P[1].gx - 18 + c * 19, y: P[1].gy + r * 19 + 20, width: 17, height: 17, rx: 2, style: `fill:var(--ltt-ink);fill-opacity:${(.1 + .8 * Y[r][c] / 255).toFixed(2)};opacity:0` }, P[1].g));
  [0, 1].forEach((k) => { for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) P[1].cells.push(mk("rect", { x: P[1].gx + 140 + c * 17, y: P[1].gy + 20 + k * 82 + r * 17, width: 15, height: 15, rx: 2, style: `fill:var(${k ? "--ltt-c3" : "--ltt-c1"});fill-opacity:.35;opacity:0` }, P[1].g)); });
  mk("text", { x: P[1].gx - 18, y: P[1].gy + 14, style: "font-size:12px;fill:var(--ltt-muted)" }, P[1].g).textContent = "Y 밝기";
  mk("text", { x: P[1].gx + 140, y: P[1].gy + 14, style: "font-size:12px;fill:var(--ltt-muted)" }, P[1].g).textContent = "Cb";
  mk("text", { x: P[1].gx + 140, y: P[1].gy + 96, style: "font-size:12px;fill:var(--ltt-muted)" }, P[1].g).textContent = "Cr";
  // ③·④ 지그재그 순서로 채운다
  const maxC = Math.max(...COEF.map(Math.abs));
  [2, 3].forEach((pi) => { const p = P[pi];
    ZZ.forEach((idx) => { const r = Math.floor(idx / 8), c = idx % 8, x = p.gx + c * CELL, y = p.gy + r * CELL;
      const v = pi === 2 ? COEF[idx] : QV[idx], mag = pi === 2 ? Math.sqrt(Math.abs(v) / maxC) : (v ? 1 : 0);
      const g = mk("g", { style: "opacity:0" }, p.g);
      mk("rect", { x, y, width: CELL - 2, height: CELL - 2, rx: 2, style: pi === 2 ? `fill:var(--ltt-accent);fill-opacity:${(.06 + .9 * mag).toFixed(2)}` : (v ? "fill:var(--ltt-accent)" : "fill:var(--ltt-card-2)") }, g);
      if (pi === 3) mk("text", { x: x + CELL / 2 - 1, y: y + CELL / 2 + 4, "text-anchor": "middle", style: `font-size:${v ? 11 : 10}px;font-weight:${v ? 700 : 400};fill:${v ? "var(--ltt-on-dark)" : "var(--ltt-muted)"}` }, g).textContent = v;
      p.cells.push(g); }); });
  // 각 칸 아래 쌓이는 값 막대(192 기준 같은 축)
  const BY = 300, BW = PW, scale = BW / 192;
  P.forEach((p) => {
    mk("rect", { x: 0, y: BY, width: BW, height: 14, rx: 7, style: "fill:var(--ltt-line)" }, p.g);
    p.bar = mk("rect", { x: 0, y: BY, width: 0, height: 14, rx: 7, style: "fill:var(--ltt-ink-2)" }, p.g);
    p.num = mk("text", { x: 0, y: BY + 50, style: "font-size:30px;font-weight:700;fill:var(--ltt-ink)" }, p.g);
    mk("text", { x: 0, y: BY + 76, style: "font-size:14px;fill:var(--ltt-muted)" }, p.g).textContent = p.note;
  });
  mk("text", { x: 0, y: BY - 12, style: "font-size:12px;fill:var(--ltt-muted)" }, s).textContent = "막대 = 남은 값의 개수(같은 축, 192 = 원본)";
  mk("text", { x: W, y: H - 8, "text-anchor": "end", style: "font-size:12px;fill:var(--ltt-muted)" }, s).textContent = "8×8 블록 하나, 품질 50 휘도 양자화표 · 모델로 계산한 예시";

  function draw(u) {
    const fade = clamp((u - .93) / .07);
    P.forEach((p, i) => {
      const local = clamp((u - i * .2) / .18), n = p.cells.length, shown = Math.floor(ease(local) * n);
      p.cells.forEach((c, k) => c.style.opacity = (k < shown ? 1 : 0) * (1 - fade));
      const val = Math.round(ease(local) * p.total);
      p.bar.setAttribute("width", val * scale * (1 - fade));
      p.bar.style.fill = i === 3 ? "var(--ltt-accent)" : "var(--ltt-ink-2)";
      p.num.textContent = local > 0 ? `${val}` : "";
      if (local > 0) { const sm = mk("tspan", { style: "font-size:14px;font-weight:400;fill:var(--ltt-muted)" }, p.num); sm.textContent = ` ${p.unit}`; }
    });
  }
  return { el: s, draw };
}

function autoLoop(node, period, draw) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(.9); return; }
  const t0 = Date.now();
  // overview 그림은 figure 함수라 leave가 없다. 노드가 떨어지거나 숨겨지면 스스로 멈춘다
  const f = () => { if (!node.isConnected) return; if (node.offsetParent) draw(((Date.now() - t0) / period) % 1); setTimeout(f, 16); };
  draw(.9); setTimeout(f, 16);
}

LTT.deck({
  title: "JPEG 압축 한 장 정리", theme: "studio",
  glossary: { "DCT": "8×8 화소를 '얼마나 촘촘한 무늬가 얼마나 섞였나'의 계수 64개로 바꾸는 변환", "양자화": "계수를 표의 값으로 나눠 반올림해, 작은 계수를 0으로 버리는 단계" },
  scenes: [{
    type: "overview", kicker: "한 장 정리",
    title: "JPEG은 값을 지우기 좋은 모양으로 바꾼 뒤 지운다",
    sub: "8×8 블록 하나가 네 단계를 지난다. 막대는 각 단계 뒤 남은 값의 개수다. ②는 사람 눈이 덜 민감한 색 정보를 줄이고, ③ {{DCT}}는 개수를 그대로 두고 모양만 바꾸고, ④ {{양자화}}가 실제로 버린다.",
    figure: (el) => { const w = el.appendChild(document.createElement("div")); w.className = "jp-wrap";
      const f = pipeline(w); autoLoop(w, 9000, f.draw); return f; },
    basis: "YCbCr 4:2:0과 품질 50 양자화표는 JPEG 표준(ITU-T T.81)의 기본값이다. 블록 값은 예시로 만든 하늘·지붕 경계다."
  }]
});
</script>
</body>
