<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPEG 압축 한 장 정리</title><script src="/kit/ltt.js"></script></head><body><script>
const STAGES = [["① RGB 화소", [{ k: 192, label: "R·G·B 각 64" }]], ["② YCbCr 4:2:0", [{ k: 96, label: "밝기 64 + 색 16·16" }]],
  ["③ DCT 계수", [{ k: 64, label: "계수 64" }]], ["④ 양자화 뒤", [{ k: 16, label: "0 아닌 값 16", tone: "good" }, { k: 48, label: "0이 된 계수", tone: "muted" }]]];
LTT.deck({
  title: "JPEG 압축 한 장 정리", theme: "studio", exemplar: true,
  glossary: { "DCT": "8×8 화소를 '얼마나 촘촘한 무늬가 얼마나 섞였나'의 계수 64개로 바꾸는 변환", "양자화": "계수를 표의 값으로 나눠 반올림해, 작은 계수를 0으로 버리는 단계" },
  scenes: [{
    type: "overview", kicker: "한 장 정리", title: "JPEG은 값을 지우기 좋은 모양으로 바꾼 뒤 지운다",
    sub: "8×8 블록 하나가 네 단계를 지난다. 채운 칸이 남은 값이다. ③ {{DCT}}는 모양만 바꾸고 ④ {{양자화}}가 실제로 버린다.",
    visual: LTT.multiples({ cols: 4, panels: STAGES.map(([title, groups]) => ({ title,
      part: LTT.units({ n: 192, cols: 16, groups: groups.map((g) => ({ tone: "accent", ...g })) }) })) }),
    motion: STAGES.flatMap(([, groups], i) => groups.map((_, g) => ["fill", { panel: i, group: g, dur: 1.4 }])),
    basis: "YCbCr 4:2:0과 품질 50 양자화표는 JPEG 표준(ITU-T T.81)의 기본값이다. 블록 값은 예시로 만든 하늘·지붕 경계(모델로 계산한 예시)."
  }]
});
</script></body></html>
