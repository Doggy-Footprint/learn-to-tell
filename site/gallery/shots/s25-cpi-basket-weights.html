<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPI 바스켓 가중치</title><script src="/kit/ltt.js"></script></head><body><script>
// 품목군 연간 가격 변화(가정): 두 쪽에 같은 값을 쓴다
const ITEMS = [["식료품", 10], ["주거·전기", 2], ["교통", 4], ["기타", 1]];
const W_OLD = [0.30, 0.15, 0.11, 0.44], W_NEW = [0.15, 0.18, 0.11, 0.56];
const cpi = (w) => ITEMS.reduce((a, it, i) => a + w[i] * it[1], 0);
LTT.expect("옛 가중치 CPI 상승률", cpi(W_OLD), 4.18, { tol: 1e-9 });
LTT.expect("새 가중치 CPI 상승률", cpi(W_NEW), 2.86, { tol: 1e-9 });
const panel = (s, w) => LTT.chart({ x: { domain: [0, 12] }, y: { label: "1월 대비", domain: [0, 11], fmt: (v) => v + "%" },
  series: [...ITEMS.map(([k, r], i) => ({ id: s + i, label: `${k} +${r}%`, type: "line", points: [[0, 0], [12, r]], tone: "muted", dash: true })),
    { id: s + "cpi", label: `CPI +${cpi(w).toFixed(2)}%`, type: "line", points: [[0, 0], [12, cpi(w)]], tone: "accent" }] });
const mix = (w) => w.map((v, i) => `${ITEMS[i][0]} ${Math.round(v * 100)}`).join(" · ") + "%.";
LTT.deck({
  title: "CPI 바스켓 가중치", theme: "ledger", exemplar: true,
  glossary: { "CPI": "소비자물가지수. 가구가 사는 품목 묶음(바스켓)의 가격을 지출 비중으로 가중평균한 값", "가중치": "바스켓에서 각 품목군이 차지하는 지출 비중" },
  scenes: [{
    type: "compare", title: "같은 가격 변화도 바스켓 가중치가 바뀌면 다른 CPI가 된다",
    sub: "가로는 1월부터 지난 달 수. 두 쪽의 품목군 가격선은 똑같다. 바뀐 것은 {{가중치}}뿐이고, 색 선이 가중평균({{CPI}})이다.",
    left: { label: "옛 바스켓", tag: "식료품 30%", tone: "bad", visual: panel("L", W_OLD), text: `${mix(W_OLD)} 식료품 +10%가 30%만큼 반영된다.` },
    right: { label: "새 바스켓", tag: "식료품 15%", tone: "good", visual: panel("R", W_NEW), text: `${mix(W_NEW)} 같은 +10%가 15%만큼만 반영된다.` },
    motion: [
      { par: [0, 1, 2, 3].flatMap((i) => [["draw", { id: "L" + i, dur: 2.4 }], ["draw", { id: "R" + i, dur: 2.4, side: "right" }]]) },
      { par: [["draw", { id: "Lcpi", dur: 2.6 }], ["draw", { id: "Rcpi", dur: 2.6, side: "right" }]] },
      ["wait", 1.4]
    ],
    basis: "CPI 상승률 = Σ(품목군 가격 변화 × 가중치). 가중치는 통계청 2020년 기준 품목군 비중을 단순화. 모델로 계산한 예시."
  }]
});
</script></body></html>
