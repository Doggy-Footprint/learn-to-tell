<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>갈톤 보드</title><script src="/kit/ltt.js"></script></head><body><script>
const ROWS = 12, BALLS = 160;
const choose = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
LTT.expect("가운데 칸 확률", choose(ROWS, 6) / 2 ** ROWS, 924 / 4096, { tol: 1e-12 });
// 공마다 못 12줄에서 오른쪽(1)·왼쪽(0)을 반반으로 고른다. 칸 번호 = 오른쪽으로 튄 횟수
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const landed = Array.from({ length: BALLS }, () => Array.from({ length: ROWS }, () => (rnd() < 0.5 ? 1 : 0)).reduce((a, b) => a + b, 0));
LTT.deck({
  title: "갈톤 보드", theme: "lab", exemplar: true,
  glossary: { "갈톤 보드": "못이 삼각형으로 박힌 판. 공이 못마다 왼쪽이나 오른쪽으로 반반 튕긴다" },
  scenes: [{
    type: "predict", kicker: "확률 실험", title: "못 12줄을 지난 공은 가운데에 얼마나 모일까",
    sub: "{{갈톤 보드}}에서 공은 못을 만날 때마다 반반으로 갈린다. 칸 번호는 오른쪽으로 튄 횟수다.",
    visual: LTT.dist({ bins: { min: -0.5, max: 12.5, n: 13 }, n: BALLS, sample: landed, unit: "번" }),
    q: "공이 가운데 칸(6번)에 들어갈 확률은?",
    choices: ["약 8%", "약 23%", "약 50%"], answer: 1,
    motion: [["drop", { dur: 5 }], ["mark", "ask"], ["curve", { dur: 1.5 }], ["wait", 2]],
    why: "12번 중 6번 오른쪽인 길은 ₁₂C₆ = 924가지, 전체 2¹² = 4,096가지라 924 ÷ 4,096 ≈ 22.6%다. 가장 많이 모여도 넷 중 하나가 안 된다.",
    takeaway: "반반 선택이 쌓이면 이항분포가 되고, 줄이 많을수록 정규분포 곡선에 가까워진다.",
    basis: "공 160개 경로는 고정 시드로 만든 모의 실험이다. 모델로 계산한 예시."
  }]
});
</script></body></html>
