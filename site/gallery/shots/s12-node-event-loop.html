<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Node.js 이벤트 루프</title><script src="/kit/ltt.js"></script></head><body><script>
const loop = LTT.graph({
  layout: "ring", track: true,
  nodes: [
    { id: "timers", label: "timers", sub: "setTimeout" }, { id: "pending", label: "pending", sub: "미뤄 둔 I/O 오류" },
    { id: "idle", label: "idle·prepare", sub: "내부용" }, { id: "poll", label: "poll", sub: "I/O 콜백 · 대기" },
    { id: "check", label: "check", sub: "setImmediate" }, { id: "close", label: "close", sub: "close 이벤트" }
  ],
  edges: [{ from: "timers", to: "pending" }, { from: "pending", to: "idle" }, { from: "idle", to: "poll" }, { from: "poll", to: "check" }, { from: "check", to: "close" }, { from: "close", to: "timers" }]
});
const log = LTT.terminal({ title: "node server.js", lines: [
  { text: "timers   setTimeout(cb, 0) → cb()" }, { text: "pending  미뤄 둔 TCP 오류 콜백", tone: "dim" },
  { text: "poll     readFile 콜백" }, { text: "poll     할 일 없음 → 대기", tone: "dim" },
  { text: "check    setImmediate → cb()" }, { text: "close    socket.on('close')", tone: "dim" } ] });
LTT.deck({
  title: "Node.js 이벤트 루프", theme: "terminal", exemplar: true,
  glossary: { "이벤트 루프": "한 스레드가 여섯 단계를 차례로 돌며 준비된 콜백을 실행하는 고리" },
  scenes: [{
    type: "figure", title: "{{이벤트 루프}} 한 바퀴에 콜백이 도는 자리",
    sub: "점이 단계를 지날 때마다 오른쪽 로그에 그 단계의 콜백이 찍힌다. 점은 poll에서 가장 오래 머문다.",
    visual: loop, side: log,
    motion: [
      { par: [["travel", { along: "timers>pending", dur: 1 }], ["type", { to: 1, dur: 0.6 }], ["highlight", { id: "timers", dur: 1 }]] },
      { par: [["travel", { along: "pending>idle>poll", dur: 1.2 }], ["type", { from: 2, to: 2, dur: 0.5 }]] },
      { par: [["pulse", { node: "poll", dur: 3.2 }], ["highlight", { id: "poll", dur: 3.2 }], ["type", { from: 3, to: 4, dur: 2.4 }]] },
      { par: [["travel", { along: "poll>check", dur: 0.8 }], ["type", { from: 5, to: 5, dur: 0.4 }]] },
      { par: [["travel", { along: "check>close>timers", dur: 1.4 }], ["type", { from: 6, to: 6, dur: 0.6 }]] }
    ],
    basis: "Node.js 공식 문서 \"The Node.js Event Loop\". 단계별 머무는 길이는 설명용 비중이다."
  }]
});
</script></body></html>
