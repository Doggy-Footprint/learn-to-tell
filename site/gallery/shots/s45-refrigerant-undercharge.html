<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>냉매 부족 진단</title><script src="/kit/ltt.js"></script></head><body><script>
// boil·cond = 증발기·응축기 안에서 상이 다 바뀌는 자리(0–1). 과열 구간 = boil 뒤, 과냉 구간 = cond 뒤.
const cycle = (boil, cond, sh, sc) => LTT.graph({
  layout: "manual", aspect: 1.25,
  nodes: [
    { id: "comp", label: "압축기", at: [80, 50], shape: "round" },
    { id: "cin", label: "응축기", sub: "고압", at: [80, 10] },
    { id: "cdone", label: "다 응축", at: [78 - cond * 62, 10], m: [Math.min(78 - cond * 62, 54), 10], ghost: true },
    { id: "valve", label: "팽창밸브", at: [14, 50] },
    { id: "ein", label: "증발기", sub: "저압", at: [10, 90] },
    { id: "edone", label: "다 끓음", at: [20 + boil * 60, 90], ghost: true }
  ],
  edges: [
    { from: "comp", to: "cin", tone: "warn" }, { from: "cin", to: "cdone", tone: "muted" },
    { from: "cdone", to: "valve", tone: "accent", label: sc }, { from: "valve", to: "ein", tone: "accent" },
    { from: "ein", to: "edone", tone: "muted" }, { from: "edone", to: "comp", tone: "warn", label: sh }
  ]
});
const flowAll = (side) => ({ par: [
  ["flow", { side, edges: ["valve>ein", "ein>edone", "cdone>valve"], tone: "accent", n: 3, dur: 5 }],
  ["flow", { side, edges: ["edone>comp", "comp>cin", "cin>cdone"], tone: "warn", n: 5, dur: 5 }]
] });
LTT.deck({
  title: "냉매 부족 진단", theme: "blueprint", exemplar: true,
  glossary: {
    "과열도": "증발기 출구 기체 온도가 끓는점보다 몇 K 높은가. 액체가 일찍 다 끓으면 커진다",
    "과냉도": "응축기 출구 액체 온도가 응축점보다 몇 K 낮은가. 액체가 덜 모이면 작아진다"
  },
  scenes: [{
    type: "compare", title: "냉매가 모자라면 증발기 앞쪽에서 다 끓어 버린다",
    sub: "파란 점은 액체, 주황 점은 기체다. 다 끓은 뒤 남은 길이 {{과열도}}, 다 응축된 뒤 남은 길이 {{과냉도}}다.",
    left: { label: "정상 충전", tone: "good", visual: cycle(0.78, 0.3, "과열도 6K", "과냉도 10K"), text: "증발기 끝 가까이에서 다 끓고, 응축기 앞쪽에서 액체로 모인다." },
    right: { label: "냉매 부족(약 −40%)", tone: "bad", visual: cycle(0.22, 0.92, "과열도 22K", "과냉도 1K"), text: "증발기 앞쪽에서 이미 다 끓어 과열 구간이 길고, 응축기 끝에서야 액체가 된다." },
    motion: [
      { par: [flowAll("left"), flowAll("right")] },
      { par: [["highlight", { side: "left", id: "edone>comp", dur: 1.5 }], ["highlight", { side: "right", id: "edone>comp", dur: 1.5 }]] }
    ],
    takeaway: "과열도가 크고 과냉도가 작으면 냉매 부족을 의심한다.",
    basis: "R-410A 가정용 에어컨 기준 흔한 진단 범위(제조사 충전 가이드). 화면 숫자는 모델로 계산한 예시."
  }]
});
</script></body></html>
