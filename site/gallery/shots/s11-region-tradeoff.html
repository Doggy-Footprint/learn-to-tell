<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리전 수 트레이드오프</title><script src="/kit/ltt.js"></script></head><body><script>
const P95 = [190, 120, 78, 64, 55, 49, 45, 42];
const stack = (n) => n * 18, repl = (n) => 2.5 * n * (n - 1) / 2;
const N = [1, 2, 3, 4, 5, 6, 7, 8];
const part = (f, lo, hi, gap = null) => N.map((n, i) => (i >= lo && i < hi ? f(n, i) : gap));
const bar = (id, label, f, tone, lo, hi) => ({ id, label, type: "bar", values: part(f, lo, hi), tone });
LTT.expect("리전 4개 월 비용", stack(4) + repl(4), 87);
LTT.expect("리전 8개 월 비용", stack(8) + repl(8), 214);
LTT.deck({
  title: "리전 수 트레이드오프", theme: "studio", exemplar: true,
  glossary: { "p95 지연": "요청 100개 중 느린 쪽 5개를 뺀 가장 느린 왕복 시간", "리전": "클라우드 사업자가 한 지역에 묶어 둔 데이터센터 무리" },
  scenes: [{
    type: "predict", title: "리전을 4개에서 8개로 늘리면?",
    sub: "{{리전}}을 하나 더할 때마다 막대(월 비용 $k)는 쌓이고 선(전 세계 {{p95 지연}} ms)은 내려간다. 빈 칸 4개를 채우면?",
    visual: LTT.chart({
      x: { label: "리전 수", cats: N.map((n) => n + "개") }, y: { label: "월 비용 $k · p95 ms", domain: [0, 220] }, stack: true, aspect: 1.5,
      series: [
        bar("stackA", "리전 스택 비용", stack, "accent", 0, 4), bar("stackB", "스택 비용 5–8개", stack, "accent", 4, 8),
        bar("replA", "리전 간 복제 비용", repl, "warn", 0, 4), bar("replB", "복제 비용 5–8개", repl, "warn", 4, 8),
        { id: "p95", label: "", type: "line", values: part((n, i) => P95[i], 0, 4, null), tone: "bad" },
        { id: "p95B", label: "p95 지연 (선)", type: "line", values: P95, tone: "bad" }]
    }),
    q: "리전 4개를 8개로 늘리면 지연과 비용은?",
    choices: ["지연이 다시 절반쯤 줄고 비용은 두 배", "지연은 20ms쯤만 줄고 비용은 두 배를 넘는다", "지연은 그대로, 비용만 두 배"],
    answer: 1,
    why: "사용자 대부분은 이미 가까운 리전이 있어 지연은 64→42ms로 줄 뿐이다. 비용은 스택이 리전 수에, 복제가 리전 쌍 n(n−1)/2에 비례해 $87k→$214k로 두 배를 넘는다.",
    motion: [
      { par: [["grow", { id: "stackA", dur: 1.4 }], ["draw", { id: "p95", dur: 2.2 }]] },
      ["grow", { id: "replA", dur: 1 }],
      ["mark", "ask"],
      { par: [["grow", { id: "stackB", dur: 1.6 }], ["draw", { id: "p95B", dur: 2.6 }]] },
      ["grow", { id: "replB", dur: 1.2 }]
    ],
    basis: "지연은 리전 간 RTT 공개 측정치를 고른 사용자 분포에 적용한 근삿값, 복제 전송은 AWS inter-region 약 $0.02/GB 기준. 모델 예시"
  }]
});
</script></body></html>
