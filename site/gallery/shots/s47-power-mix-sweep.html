<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>전력 믹스 변화</title>
<script type="application/json" id="ltt-meta">{"topic":"국가별 전력 믹스","audience":"에너지 정책 입문자","theme":"atlas","medium":"에너지 통계 차트","decision":"전원 구성 비교","domain":"에너지","pattern":["mount"],"mode":"카탈로그용: 장면 하나짜리 본보기. 부분-전체 구조를 \"모양이 바뀜\" 움직임과 좌우 분할 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>.pm-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}.pm{width:880px;max-width:100%;height:auto;display:block}.pm text{font-family:inherit}</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head><body><script>
const SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
// 발전량 비중(%) 근사치. Ember Yearly Electricity Data, IEA 통계를 반올림했다.
const KINDS = [{ id: "coal", l: "석탄", c: "var(--ltt-c1)" }, { id: "gas", l: "가스", c: "var(--ltt-c2)" }, { id: "nuc", l: "원자력", c: "var(--ltt-c3)" }, { id: "ren", l: "재생에너지", c: "var(--ltt-c4)" }, { id: "oth", l: "석유·기타", c: "var(--ltt-c5)" }];
const YEARS = [2000, 2010, 2015, 2020, 2023];
const MIX = {
  "독일": { 2000: [52, 9, 29, 6, 4], 2010: [42, 14, 22, 17, 5], 2015: [42, 10, 14, 30, 4], 2020: [24, 16, 11, 45, 4], 2023: [26, 15, 1.5, 53, 4.5] },
  "한국": { 2000: [39, 10, 39, 1, 11], 2010: [44, 20, 31, 2, 3], 2015: [43, 19, 30, 5, 3], 2020: [36, 26, 29, 8, 1], 2023: [33, 27, 30, 9, 1] } };
Object.values(MIX).forEach((m) => YEARS.forEach((y) => LTT.expect("합계 " + y, m[y].reduce((a, b) => a + b, 0), 100, { tol: 0.6 })));
const W = 880, H = 440, CW = 300, T = 50, BH = 340;
function figure(host) {
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "pm", "data-annotate": "" }, host);
  const cols = Object.keys(MIX).map((name, ci) => { const x0 = ci ? W - CW - 40 : 40;
    const h = el("text", { x: x0 + CW / 2, y: T - 16, "text-anchor": "middle", style: "font-size:22px;font-weight:700;fill:var(--ltt-ink)" }, s); h.textContent = name;
    const segs = KINDS.map((k) => ({ r: el("rect", { x: x0, width: CW, rx: 3, style: `fill:${k.c};stroke:var(--ltt-bg);stroke-width:2` }, s),
      t: el("text", { x: x0 + 14, style: "font-size:15px;font-weight:600;fill:var(--ltt-on-dark)" }, s), k }));
    return { name, segs, x0 }; });
  // 가운데 연결선: 같은 전원을 두 나라 사이에 이어 모양 차이를 읽게 한다
  const links = KINDS.map((k) => el("path", { style: `fill:${k.c};opacity:.16` }, s));
  const yrs = YEARS.map((y, i) => { const t = el("text", { x: W / 2, y: T + BH / 2 + 18, opacity: i ? 0 : 1, "text-anchor": "middle", style: "font-size:52px;font-weight:700;fill:var(--ltt-ink)" }, s); t.textContent = y; return t; });
  const yrSub = el("text", { x: W / 2, y: T + BH / 2 + 46, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-muted)" }, s); yrSub.textContent = "발전량 비중";
  const geo = (name, y) => { let top = T; return MIX[name][y].map((v) => { const g = { y: top, height: v / 100 * BH }; top += g.height; return g; }); };
  function setYear(y) { cols.forEach((c) => geo(c.name, y).forEach((g, i) => { c.segs[i].r.setAttribute("y", g.y); c.segs[i].r.setAttribute("height", g.height); }));
    yrs.forEach((t, i) => t.setAttribute("opacity", YEARS[i] === y ? 1 : 0)); }
  // 띠 모양과 칸 글자는 숫자 속성 하나로 옮길 수 없어, 막대가 지금 놓인 자리를 읽어 매 프레임 다시 그린다.
  function follow() { const tops = cols.map((c) => c.segs.map((g) => { const y = +g.r.getAttribute("y"), hh = +g.r.getAttribute("height");
      g.t.setAttribute("y", y + hh / 2 + 5); g.t.textContent = hh > 22 ? `${g.k.l} ${Math.round(hh / BH * 100)}%` : ""; return [y, y + hh]; }));
    links.forEach((p, i) => { const a = tops[0][i], b = tops[1][i], xa = 40 + CW, xb = W - CW - 40, m = (xa + xb) / 2;
      p.setAttribute("d", `M${xa},${a[0]} C${m},${a[0]} ${m},${b[0]} ${xb},${b[0]} L${xb},${b[1]} C${m},${b[1]} ${m},${a[1]} ${xa},${a[1]}Z`); }); }
  setYear(YEARS[0]); follow();
  // 해마다 1.2초 옮겨 가고 0.6초 머문다. 같은 칸의 다음 비트는 앞 비트가 놓은 자리에서 시작한다.
  const TEXT = { 0: "0.6–1.8s 칸 높이가 모양을 바꾸며 다음 해로 옮겨 가고 띠도 따라 휜다", 2: "4.2–5.4s 독일은 석탄 칸이 줄고 재생에너지 칸이 커지며, 띠의 기울기가 두 쪽 차이를 보인다" };
  const beats = [{ t: [0, 600], text: "0–0.6s 첫 해: 양쪽 100% 막대가 칸 비율로 나뉘고 가운데 띠가 같은 범주를 잇는다" }];
  YEARS.slice(1).forEach((y, k) => { const t = [600 + k * 1800, 1800 + k * 1800];
    beats.push({ t, morph: yrs[k + 1], to: { opacity: 1 }, text: TEXT[k] }, { t, morph: yrs[k], to: { opacity: 0 } });
    cols.forEach((c) => geo(c.name, y).forEach((g, i) => beats.push({ t, morph: c.segs[i].r, to: g }))); });
  beats.push({ t: [7200, 8900], text: "7.2–9s 마지막 해에서 멈추고 두 막대의 최종 모양이 띠로 이어진다" });
  const handle = LTT.motion.play(s, beats, { period: 9000 });
  LTT.motion.loop(follow, { period: 9000, el: links[0] });
  return { el: s, setYear, follow, handle };
}
const scene = { title: "같은 20여 년, 독일은 석탄을 재생에너지로 바꾸고 한국은 가스를 늘렸다",
  sub: "막대는 해마다 발전량 비중이다. 저절로 연도를 돌고, 연도 단추를 누르면 그 해에 멈춘다.",
  basis: "Ember Yearly Electricity Data·IEA 통계를 반올림한 근사치(불확실, 1–2%p 차이 가능).",
  mount(body) {
    body.innerHTML = '<div class="pm-wrap"><div id="pm-fig"></div><div class="ltt-param">연도 <b id="year-v"></b> <span class="ltt-basis">(누르면 자동 재생이 멈춘다)</span><div id="year"></div></div></div>';
    const f = figure(body.querySelector("#pm-fig")); let first = true;
    LTT.sweep({ params: { year: { kind: "steps", stops: YEARS, value: 2000, fmt: (v) => v + "년" } }, attract: false,
      render: ({ year }) => { if (first) { first = false; return; } f.handle.stop(); f.setYear(year); f.follow(); } });
  } };
LTT.deck({ title: "전력 믹스", theme: "atlas", glossary: { "전력 믹스": "한 해 발전량을 전원별로 나눈 비중" }, scenes: [scene] });
</script></body></html>
