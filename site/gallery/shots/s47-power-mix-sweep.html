<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전력 믹스 변화</title><script src="/kit/ltt.js"></script></head><body><script>
// 발전량 비중(%) 근사치. Ember Yearly Electricity Data, IEA 통계를 반올림했다. 순서: 석탄·가스·원자력·재생·석유기타
const KINDS = [["coal", "석탄", "ink"], ["gas", "가스", "warn"], ["nuc", "원자력", "accent"], ["ren", "재생에너지", "good"], ["oth", "석유·기타", "muted"]];
const MIX = {
  2000: [[52, 9, 29, 6, 4], [39, 10, 39, 1, 11]], 2010: [[42, 14, 22, 17, 5], [44, 20, 31, 2, 3]],
  2015: [[42, 10, 14, 30, 4], [43, 19, 30, 5, 3]], 2020: [[24, 16, 11, 45, 4], [36, 26, 29, 8, 1]],
  2023: [[26, 15, 1.5, 53, 4.5], [33, 27, 30, 9, 1]]
};
Object.entries(MIX).forEach(([y, m]) => m.forEach((c, i) => LTT.expect(`합계 ${y} ${i}`, c.reduce((a, b) => a + b, 0), 100, { tol: 0.6 })));
const YEARS = Object.keys(MIX), TOP = 12, BH = 84, BX = [[4, 34], [66, 96]];
const frame = (y) => { const out = {};
  KINDS.forEach(([id, name], k) => { const seg = MIX[y].map((c) => [TOP + BH * c.slice(0, k).reduce((a, b) => a + b, 0) / 100, BH * c[k] / 100]);
    seg.forEach(([y0, h], ci) => { out[id + ci] = { y: y0, h };
      out[id + ci + "t"] = { y: y0 + h / 2, text: `${name.replace("에너지", "")} ${MIX[y][ci][k]}%`, opacity: h > 5 ? 1 : 0 }; });
    out[id + "b"] = { points: `34,${seg[0][0]} 66,${seg[1][0]} 66,${seg[1][0] + seg[1][1]} 34,${seg[0][0] + seg[0][1]}` }; });
  out.year = { text: y + "년" }; return out; };
const shapes = (f) => Object.assign({ de: { kind: "label", x: 19, y: 5, text: "독일", cls: "strong" }, kr: { kind: "label", x: 81, y: 5, text: "한국", cls: "strong" },
  year: { kind: "label", x: 50, y: 52, text: "", cls: "big" } },
  ...KINDS.map(([id, , tone]) => ({ [id + "b"]: { kind: "polygon", points: "", tone, opacity: 0.22 },
    ...Object.fromEntries([0, 1].flatMap((ci) => [[id + ci, { kind: "rect", x: BX[ci][0], w: 30, tone }],
      [id + ci + "t", { kind: "label", x: BX[ci][0] + 1.5, anchor: "l", cls: "chip" }]])) })), f);
const deep = (a, b) => Object.fromEntries(Object.keys(a).map((k) => [k, { ...a[k], ...(b[k] || {}) }]));
LTT.deck({
  title: "전력 믹스", theme: "studio", exemplar: true,
  glossary: { "전력 믹스": "한 해 발전량을 전원별로 나눈 비중" },
  scenes: [{
    type: "figure", title: "같은 20여 년, 독일은 석탄을 재생에너지로 바꾸고 한국은 가스를 늘렸다",
    sub: "막대 하나가 그해 {{전력 믹스}} 100%다. 연도가 바뀌면 칸의 넓이가 바뀌고, 가운데 띠가 같은 전원끼리 잇는다.",
    visual: LTT.morph({ aspect: 2, mobileAspect: 0.9, shapes: deep(shapes({}), frame(YEARS[0])),
      states: Object.fromEntries(YEARS.map((y) => [y, frame(y)])) }),
    steps: YEARS.map((y) => ({ caption: `${y}년 · 독일 석탄 ${MIX[y][0][0]}% 재생 ${MIX[y][0][3]}% · 한국 가스 ${MIX[y][1][1]}%`,
      motion: [["to", { state: y, dur: 1.2 }], ["wait", 0.6]] })),
    takeaway: "독일 재생에너지는 2020년에 처음 석탄을 넘었다. 한국은 석탄 일부를 가스로 바꿨다",
    basis: "Ember Yearly Electricity Data·IEA 통계를 반올림한 근사치(불확실, 1–2%p 차이 가능)."
  }]
});
</script></body></html>
