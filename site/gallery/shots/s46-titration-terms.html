<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>적정 곡선 용어</title><script src="/kit/ltt.js"></script></head><body><script>
// 0.10 M 아세트산 25 mL를 0.10 M NaOH로 적정. 전하 균형 [Na+]+[H+]=[OH-]+[A-]를 이분법으로 푼다.
const Ka = 1.75e-5, Kw = 1e-14;
function pH(V) { const T = 25 + V, na = 0.1 * V / T, ct = 2.5 / T; let lo = 0, hi = 14;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2, h = 10 ** -m; if (na + h - Kw / h - ct * Ka / (Ka + h) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2; }
LTT.expect("당량점 pH", pH(25), 8.73, { tol: 0.03 });
LTT.expect("반당량점 pH = pKa", pH(12.5), 4.76, { tol: 0.03 });
const pts = (a, b) => Array.from({ length: Math.round((b - a) / 0.2) + 1 }, (_, i) => a + i * 0.2).map((v) => [v, pH(v)]);
LTT.deck({
  title: "적정 곡선", theme: "lab", exemplar: true,
  glossary: {
    "완충 구간": "약산과 그 짝염기가 함께 있어 염기를 넣어도 pH가 천천히 오르는 구간",
    "당량점": "넣은 염기 몰수가 처음 산 몰수와 같아지는 점",
    "지시약": "특정 pH 범위에서 색이 바뀌어 종말점을 알려 주는 물질"
  },
  scenes: [{
    type: "terms", title: "같은 곡선 위의 세 자리",
    sub: "0.10 M 아세트산 25 mL에 0.10 M NaOH를 떨어뜨린다. 점이 곡선을 훑으며 각 용어의 구간을 밝힌다.",
    visual: LTT.chart({
      x: { label: "NaOH 부피 (mL)", domain: [0, 40] }, y: { label: "pH", domain: [0, 14] },
      series: [
        { id: "buffer", label: "완충 구간", type: "area", points: pts(2.4, 22.6), tone: "accent" },
        { id: "curve", label: "pH", type: "line", points: pts(0, 40), tone: "ink" }
      ],
      refs: [{ id: "eq", x: 25, label: "25 mL, pH 8.7" }, { id: "ind", y: 9.1, label: "페놀프탈레인 8.2–10" }]
    }),
    terms: [
      { term: "완충 구간", plain: "염기를 넣어도 pH가 거의 평평하다. 12.5 mL(반당량점)에서 pH = pKa = 4.76", on: "buffer" },
      { term: "당량점", plain: "산과 넣은 염기의 몰수가 같아지는 점. 25 mL에서 pH 8.7로 7보다 높다", on: "eq" },
      { term: "지시약", plain: "변색 범위가 수직 구간과 겹쳐야 한다. 페놀프탈레인은 맞고 메틸 오렌지(3.1–4.4)는 이르다", on: "ind" }
    ],
    motion: [
      ["hide", { ids: ["buffer", "eq", "ind"] }],
      { par: [["show", { id: "buffer" }], ["point", { id: "curve", from: 0, to: 22.6, dur: 3 }]] },
      { par: [["show", { id: "eq" }], ["point", { id: "curve", from: 22.6, to: 25, dur: 1.6 }]] },
      { par: [["show", { id: "ind" }], ["point", { id: "curve", from: 25, to: 40, dur: 2 }]] }
    ],
    basis: "Ka(아세트산) = 1.75×10⁻⁵, 전하 균형으로 계산. 변색 범위는 일반화학 교과서 표 기준. 모델로 계산한 예시."
  }]
});
</script></body></html>
