<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>적정 곡선 용어</title>
<script type="application/json" id="ltt-meta">{"topic":"산염기 적정 곡선","audience":"일반화학 입문자","theme":"lab","medium":"실험 노트 pH 플롯","decision":"지시약 고르기","domain":"화학","pattern":["terms"],"mode":"카탈로그용: 장면 하나짜리 본보기. 순서 구조를 \"강조가 훑음\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>

<script src="/kit/ltt-ui.js"></script>

<style>.tc{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}.tc text{font-family:inherit}</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head><body><script>
const SVG = "http://www.w3.org/2000/svg";
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(period, draw) { let raf = 0, t0 = 0;
  return { enter() { clearTimeout(raf); if (reduced) { draw(0.999); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } }; }
// 0.10 M 아세트산 25 mL를 0.10 M NaOH로 적정. 전하 균형 [Na+]+[H+]=[OH-]+[A-]를 이분법으로 푼다.
const Ka = 1.75e-5, Ca = 0.10, Va = 25, Cb = 0.10, Kw = 1e-14;
function pH(V) { const T = Va + V, na = Cb * V / T, ct = Ca * Va / T; let lo = 0, hi = 14;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2, h = 10 ** -m, f = na + h - Kw / h - ct * Ka / (Ka + h); if (f > 0) lo = m; else hi = m; }
  return (lo + hi) / 2; }
LTT.expect("당량점 pH", pH(25), 8.73, { tol: 0.03 });
LTT.expect("반당량점 pH = pKa", pH(12.5), 4.76, { tol: 0.03 });
const VMAX = 40, W = 340, H = 230, L = 34, R = 10, T = 12, B = 30;
const sx = (v) => L + v / VMAX * (W - L - R), sy = (p) => T + (14 - p) / 14 * (H - T - B);
const PTS = d3.range(0, VMAX + 0.01, 0.2).map((v) => [v, pH(v)]);
const ZONE = { buffer: { v0: 2.3, v1: 22.7 }, eq: { v0: 24.4, v1: 25.6 }, ind: { v0: 24.9, v1: 25.2 } };
const clocks = [];
function curve(kind) { return (host) => {
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "tc" }, host);
  for (let p = 0; p <= 14; p += 2) { el("line", { x1: L, x2: W - R, y1: sy(p), y2: sy(p), style: "stroke:var(--ltt-line);stroke-width:1" }, s);
    const t = el("text", { x: L - 6, y: sy(p) + 4, "text-anchor": "end", style: "font-size:11px;fill:var(--ltt-muted)" }, s); t.textContent = p; }
  for (let v = 0; v <= VMAX; v += 10) { const t = el("text", { x: sx(v), y: H - 12, "text-anchor": "middle", style: "font-size:11px;fill:var(--ltt-muted)" }, s); t.textContent = v; }
  const ax = el("text", { x: W - R, y: H - 1, "text-anchor": "end", style: "font-size:11px;fill:var(--ltt-muted)" }, s); ax.textContent = "NaOH 부피 (mL)";
  const ay = el("text", { x: L + 4, y: T + 10, style: "font-size:11px;fill:var(--ltt-muted)" }, s); ay.textContent = "pH";
  let band, tag;
  if (kind === "ind") { band = el("rect", { x: L, width: W - L - R, y: sy(10), height: sy(8.2) - sy(10), style: "fill:var(--ltt-warn-soft);opacity:0" }, s);
    tag = el("text", { x: sx(2), y: sy(10) - 6, style: "font-size:12px;font-weight:700;fill:var(--ltt-ink)" }, s); tag.textContent = "페놀프탈레인 pH 8.2–10"; }
  if (kind === "buffer") { band = el("rect", { x: sx(ZONE.buffer.v0), width: sx(ZONE.buffer.v1) - sx(ZONE.buffer.v0), y: T, height: H - T - B, style: "fill:var(--ltt-accent-soft);opacity:0" }, s); band.dataset.max = .6;
    tag = el("text", { x: sx(12.5), y: sy(7.4), "text-anchor": "middle", style: "font-size:12px;font-weight:700;fill:var(--ltt-ink)" }, s); tag.textContent = "pH = pKa ± 1 (4.76)"; }
  if (kind === "eq") { band = el("line", { x1: sx(25), x2: sx(25), y1: T, y2: H - B, style: "stroke:var(--ltt-ink-2);stroke-width:1.5;stroke-dasharray:4 4;opacity:0" }, s);
    tag = el("text", { x: sx(26.5), y: sy(8.73) + 4, style: "font-size:12px;font-weight:700;fill:var(--ltt-ink)" }, s); tag.textContent = "25 mL, pH 8.7"; }
  const line = d3.line().x((d) => sx(d[0])).y((d) => sy(d[1]));
  el("path", { d: line(PTS), style: "fill:none;stroke:var(--ltt-line-2);stroke-width:2" }, s);
  const lit = el("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:3.5;stroke-linecap:round" }, s);
  const dot = el("circle", { r: 5.5, style: "fill:var(--ltt-accent);stroke:var(--ltt-bg);stroke-width:2" }, s);
  const z = ZONE[kind];
  function draw(u) {
    const v = VMAX * ease(clamp(u / 0.8));
    dot.setAttribute("cx", sx(v)); dot.setAttribute("cy", sy(pH(v)));
    const inZ = PTS.filter((d) => d[0] >= z.v0 - 0.3 && d[0] <= Math.min(v, z.v1 + 0.3));
    lit.setAttribute("d", inZ.length > 1 ? line(inZ) : "");
    const on = v >= z.v0 ? 1 : 0, fade = u > 0.94 ? 1 - (u - 0.94) / 0.06 : 1;
    band.style.opacity = on * fade * (band.dataset.max || 1); tag.style.opacity = on * fade; lit.style.opacity = fade; dot.style.opacity = fade;
  }
  clocks.push(draw); draw(reduced ? 0.9 : 0);
}; }
const sync = loop(8000, (u) => clocks.forEach((d) => d(reduced ? 0.9 : u)));
LTT.deck({ title: "적정 곡선", theme: "lab",
  glossary: { "완충 구간": "약산과 그 짝염기가 함께 있어 염기를 넣어도 pH가 천천히 오르는 구간", "당량점": "넣은 염기 몰수가 처음 산 몰수와 같아지는 점", "지시약": "특정 pH 범위에서 색이 바뀌어 종말점을 알려 주는 물질" },
  scenes: [{ type: "terms", title: "같은 곡선 위의 세 자리", sub: "0.10 M 아세트산 25 mL에 0.10 M NaOH를 떨어뜨린다. 점이 곡선을 훑으며 각 용어가 가리키는 구간을 밝힌다.",
    terms: [
      { key: "완충 구간", word: "완충 구간", en: "buffer region", visual: curve("buffer"), plain: "염기를 넣어도 pH가 거의 평평하게 오른다", example: "12.5 mL(반당량점)에서 pH = pKa = 4.76" },
      { key: "당량점", word: "당량점", en: "equivalence point", visual: curve("eq"), plain: "산과 넣은 염기의 몰수가 같아지는 한 점", example: "25.0 mL에서 pH 8.7, 아세트산 이온 때문에 7보다 높다" },
      { key: "지시약", word: "지시약", en: "indicator", visual: curve("ind"), plain: "변색 범위가 곡선의 수직 구간과 겹쳐야 한다", example: "페놀프탈레인(8.2–10)은 맞고 메틸 오렌지(3.1–4.4)는 이르다" } ],
    basis: "Ka(아세트산) = 1.75×10⁻⁵, 전하 균형으로 계산. 변색 범위는 일반화학 교과서 표 기준. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    mount() { return sync; } }] });
</script></body></html>
