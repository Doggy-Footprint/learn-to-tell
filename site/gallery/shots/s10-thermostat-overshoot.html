<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>온도조절기 되먹임</title><script src="/kit/ltt.js"></script></head><body><script>
// 1차 지연 두 개(라디에이터, 방)와 on/off 히스테리시스. 상수는 단독주택 거실 규모로 맞춘 모델값
const SET = 22, BAND = 0.5, TOUT = 5, A = 0.03, B = 0.01, TAU = 12, HMAX = 40, DT = 0.25, MIN = 90;
const RUN = []; let ph = 0;
for (let t = 0, T = 17, H = 17, u = 1; t <= MIN + 1e-9; t += DT) {
  if (T >= SET + BAND) u = 0; if (T <= SET - BAND) u = 1;
  // 입자 수와 속도는 라디에이터에 남은 열(H - T)에 묶는다: 끈 뒤에도 흐름이 바로 멈추지 않는다
  const heat = Math.max(0, Math.min(1, (H - T) / (HMAX - 17))); ph += 0.004 + 0.012 * heat;
  RUN.push({ t, T, u, heat, ph });
  H += ((u ? HMAX : T) - H) / TAU * DT; T += (A * (H - T) - B * (T - TOUT)) * DT;
}
const PEAK = RUN.reduce((m, p) => p.T > m.T ? p : m), OFF = RUN.find((p, i) => i && RUN[i - 1].u && !p.u);
LTT.expect("오버슈트 최고 온도", +PEAK.T.toFixed(1), 23.5, { tol: 0.15 });
const plot = LTT.draw({
  aspect: 16 / 10, mobileAspect: 4 / 5, dur: 9, beats: [2.3, 4.8, 6.8, 8.4],
  setup(h) {
    const x = h.scale(0, MIN, 70, h.W - 50), y = h.scale(16, 28, h.H - 50, 20);
    h.el("rect", { x: x(0), width: x(MIN) - x(0), y: y(SET + BAND), height: y(SET - BAND) - y(SET + BAND), class: "band" });
    h.el("line", { x1: x(0), x2: x(MIN), y1: y(SET), y2: y(SET), class: "ref" });
    h.label(x(MIN), y(SET - BAND) + 6, "목표 22° ± 0.5", { anchor: "r", tone: "good" });
    h.ticks(18, 28, 5).forEach((v) => h.label(x(0) - 10, y(v), v + "°", { anchor: "r", cls: "muted" }));
    [0, 30, 60, 90].forEach((m) => h.label(x(m), h.H - 40, m + "분", { anchor: "t", cls: "muted" }));
    const lx = h.mobile ? 210 : 220, lw = h.W - 2 * lx, ly = h.mobile ? 60 : 36, lh = h.mobile ? 240 : 100;
    const loop = h.el("rect", { x: lx, y: ly, width: lw, height: lh, rx: 30, class: "e" });
    [[lx, ly, "온도조절기"], [lx + lw, ly, "보일러 40°"], [lx + lw, ly + lh, "라디에이터"], [lx, ly + lh, "방 공기 · 센서"]]
      .forEach(([cx, cy, t]) => h.label(cx, cy, t, { cls: "chip" }));
    const on = h.label(h.W / 2, ly + lh / 2, "켜짐 · 열이 돈다", { cls: "strong", tone: "accent" });
    const off = h.label(h.W / 2, ly + lh / 2, "꺼짐 · 남은 열이 돈다", { cls: "strong" });
    const dots = Array.from({ length: 26 }, () => h.el("circle", { r: 6, class: "dot" }));
    const trace = h.el("path", { class: "e", style: `stroke:${h.color("accent")};stroke-width:4` });
    const head = h.el("circle", { r: 8, class: "dot" });
    h.el("line", { x1: x(OFF.t), x2: x(OFF.t), y1: y(OFF.T) - 10, y2: y(16), class: "ref" });
    const offL = h.label(x(OFF.t) - 8, y(17), `${OFF.t.toFixed(0)}분 보일러 끔`, { anchor: "r" });
    const pk = h.label(x(PEAK.t) + 12, y(PEAK.T) - 4, `끈 뒤에도 ${PEAK.T.toFixed(1)}°까지`, { anchor: "l", cls: "strong", tone: "warn" });
    h.anchor("peak", x(PEAK.t), y(PEAK.T));
    return { x, y, loop, on, off, dots, trace, head, offL, pk };
  },
  draw(t, h, s) {
    const n = Math.max(1, Math.round(Math.min(1, t / 7.9) * (RUN.length - 1))), p = RUN[n];
    s.trace.setAttribute("d", RUN.slice(0, n + 1).map((q, i) => (i ? "L" : "M") + s.x(q.t) + "," + s.y(q.T)).join(""));
    s.head.setAttribute("cx", s.x(p.t)); s.head.setAttribute("cy", s.y(p.T));
    s.on.style.opacity = p.u ? 1 : 0; s.off.style.opacity = p.u ? 0 : 1;
    s.offL.style.opacity = p.t >= OFF.t ? 1 : 0; s.pk.style.opacity = p.t >= PEAK.t ? 1 : 0;
    s.dots.forEach((c, i) => { const [cx, cy] = h.along(s.loop, (i / s.dots.length + p.ph) % 1);
      c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.style.opacity = i / s.dots.length < 0.15 + 0.85 * p.heat ? 0.35 + 0.65 * p.heat : 0; });
  }
});
LTT.deck({
  title: "온도조절기 되먹임", theme: "lab", exemplar: true,
  glossary: { "오버슈트": "목표값에 닿은 뒤에도 지나쳐 넘어가는 양", "되먹임": "출력을 재서 다시 입력을 고치는 고리" },
  scenes: [{
    type: "hook", pre: "되먹임과 지연", text: "22°에서 껐는데 왜 23.5°까지 오를까",
    sub: "{{되먹임}} 고리를 도는 열 입자와 온도 곡선을 함께 본다. 끈 뒤에도 남은 열이 돌아 {{오버슈트}}가 생긴다.",
    visual: plot,
    basis: "라디에이터 지연 12분, 방 열손실 0.01/분, 바깥 5°의 1차 지연 두 개 모델. 모델로 계산한 예시."
  }]
});
</script></body></html>
