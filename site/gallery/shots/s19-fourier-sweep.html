<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸리에 변환</title>
<script type="application/json" id="ltt-meta">{"topic":"푸리에 변환","audience":"신호처리 입문자","theme":"paper","medium":"교과서 figure","decision":"스펙트럼 읽기","domain":"신호처리","pattern":["hook"],"mode":"카탈로그용: 장면 하나짜리 본보기. 변환 구조를 \"강조가 훑음\" 움직임과 겹쳐 놓기 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.ft-wrap{display:flex;justify-content:center}
.ft{width:820px;max-width:100%;height:auto;display:block}
.ft text{font-family:inherit}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
// A단조 화음: A3 220 Hz, C4 261.6 Hz, E4 329.6 Hz (평균율, A4 = 440 Hz)
const TONES = [{ f: 220, a: 1, n: "A3" }, { f: 261.6, a: 0.7, n: "C4" }, { f: 329.6, a: 0.5, n: "E4" }];
const WIN = 0.1, FS = 8000, N = WIN * FS;
const sig = (t) => TONES.reduce((s, p) => s + p.a * Math.sin(2 * Math.PI * p.f * t), 0);
const samples = Array.from({ length: N }, (_, i) => sig(i / FS));
// 해닝 창을 씌운 진폭 스펙트럼, 순음 진폭 1이 1이 되게 정규화
const hann = samples.map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
const mag = (f) => { let re = 0, im = 0; for (let i = 0; i < N; i++) { const w = hann[i] * samples[i], ph = 2 * Math.PI * f * i / FS; re += w * Math.cos(ph); im -= w * Math.sin(ph); } return 4 * Math.hypot(re, im) / N; };
const F0 = 150, F1 = 400, FN = 251;
const spec = Array.from({ length: FN }, (_, i) => { const f = F0 + (F1 - F0) * i / (FN - 1); return { f, m: mag(f) }; });
LTT.expect("220 Hz 성분 진폭", mag(220), 1, { tol: 0.06 });
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x) => Math.max(0, Math.min(1, x));
const el = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };

function fourier(host) {
  const W = 820, H = 470, L = 60, R = 780, BASE = 410, TOP = 150, WY = 92, WA = 46, SHOW = 240;
  const s = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "ft", "data-annotate": "" }, host);
  const fx = (f) => L + (f - F0) / (F1 - F0) * (R - L);
  const my = (m) => BASE - m * (BASE - TOP - 40) / 1.05;
  el("line", { x1: L, x2: R, y1: BASE, y2: BASE, style: "stroke:var(--ltt-ink-2);stroke-width:1.5" }, s);
  [150, 200, 250, 300, 350, 400].forEach((f) => {
    el("line", { x1: fx(f), x2: fx(f), y1: BASE, y2: BASE + 6, style: "stroke:var(--ltt-ink-2)" }, s);
    el("text", { x: fx(f), y: BASE + 24, "text-anchor": "middle", style: "font-size:14px;fill:var(--ltt-muted)" }, s).textContent = f;
  });
  el("text", { x: R, y: BASE + 50, "text-anchor": "end", style: "font-size:14px;fill:var(--ltt-muted)" }, s).textContent = "주파수 (Hz) →";
  el("text", { x: L, y: 24, style: "font-size:15px;fill:var(--ltt-ink-2);font-weight:600" }, s).textContent = "마이크에 들어온 파형 (앞 30 ms)";
  // 파형: 시간축을 같은 폭에 겹쳐 그린다
  let wd = ""; for (let i = 0; i < SHOW; i++) { const x = L + i / (SHOW - 1) * (R - L); wd += (i ? "L" : "M") + x.toFixed(1) + "," + (WY - samples[i] * WA / 1.9).toFixed(1); }
  el("path", { d: wd, style: "fill:none;stroke:var(--ltt-ink);stroke-width:1.6;opacity:.85" }, s);
  const probe = el("path", { style: "fill:none;stroke:var(--ltt-accent);stroke-width:1.4;opacity:.7" }, s);
  // 스펙트럼: 훑는 띠 뒤로 드러난다
  const clip = el("clipPath", { id: "ftc" }, el("defs", {}, s)); const clipR = el("rect", { x: L, y: 0, width: 0, height: H }, clip);
  let sd = `M${L},${BASE}`; spec.forEach((p) => sd += `L${fx(p.f).toFixed(1)},${my(p.m).toFixed(1)}`); sd += `L${R},${BASE}Z`;
  el("path", { d: sd, "clip-path": "url(#ftc)", style: "fill:var(--ltt-accent-soft);stroke:var(--ltt-accent);stroke-width:2" }, s);
  const band = el("rect", { y: 40, width: 26, height: BASE - 40, rx: 4, style: "fill:var(--ltt-accent);opacity:.12" }, s);
  const cur = el("line", { y1: 40, y2: BASE, style: "stroke:var(--ltt-accent);stroke-width:2" }, s);
  const curT = el("text", { y: 166, "text-anchor": "middle", style: "font-size:15px;fill:var(--ltt-accent);font-weight:700" }, s);
  const labs = TONES.map((p) => { const g = el("g", { style: "opacity:0" }, s);
    el("text", { x: fx(p.f), y: my(p.a) - 30, "text-anchor": "middle", style: "font-size:16px;fill:var(--ltt-ink);font-weight:700" }, g).textContent = p.n;
    el("text", { x: fx(p.f), y: my(p.a) - 12, "text-anchor": "middle", style: "font-size:13px;fill:var(--ltt-ink-2)" }, g).textContent = p.f + " Hz";
    return { g, f: p.f }; });
  function draw(u) {
    const sw = ease(clamp((u - .08) / .72)), fade = clamp((u - .93) / .07);
    const f = F0 + (F1 - F0) * sw, x = fx(f);
    clipR.setAttribute("width", Math.max(0, x - L));
    band.setAttribute("x", x - 13); cur.setAttribute("x1", x); cur.setAttribute("x2", x);
    curT.setAttribute("x", x); curT.textContent = Math.round(f) + " Hz";
    let pd = ""; for (let i = 0; i < SHOW; i += 1) { const xx = L + i / (SHOW - 1) * (R - L); pd += (i ? "L" : "M") + xx.toFixed(1) + "," + (WY - Math.sin(2 * Math.PI * f * i / FS) * WA * .55).toFixed(1); }
    probe.setAttribute("d", pd);
    const op = 1 - fade; [band, cur, curT, probe].forEach((n) => n.style.opacity = n === probe ? .55 * op : n === band ? .12 * op : op);
    labs.forEach((l) => l.g.style.opacity = f >= l.f - 2 ? 1 : 0);
  }
  return { el: s, draw };
}

function loop(period, draw) {
  let raf = 0, t0 = 0;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return { enter() { clearTimeout(raf); if (reduced) { draw(0.92); return; }
      t0 = Date.now(); const f = () => { draw(((Date.now() - t0) / period) % 1); raf = setTimeout(f, 16); }; f(); },
    leave() { clearTimeout(raf); } };
}

LTT.deck({
  title: "푸리에 변환", theme: "paper",
  glossary: { "스펙트럼": "신호에 어떤 주파수가 얼마만큼 들어 있는지를 주파수 축에 그린 그림" },
  scenes: [{
    type: "hook", pre: "푸리에 변환", text: "엉킨 파형 하나에 음 세 개가 숨어 있다",
    sub: "기준 사인파(가는 선)를 낮은 음부터 높은 음까지 대어 보면, 박자가 맞는 주파수에서만 {{스펙트럼}} 봉우리가 솟는다.",
    basis: "A단조 화음(A3 220 Hz, C4 261.6 Hz, E4 329.6 Hz, 진폭 1 : 0.7 : 0.5)을 100 ms 해닝 창으로 계산. <span class=\"ltt-tag\">모델로 계산한 예시</span>",
    mount(body) { const w = body.appendChild(document.createElement("div")); w.className = "ft-wrap";
      const f = fourier(w); f.draw(0); return loop(8000, f.draw); }
  }]
});
</script>
</body>
</html>
