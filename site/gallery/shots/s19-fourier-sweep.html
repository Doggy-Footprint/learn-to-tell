<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>푸리에 변환</title><script src="/kit/ltt.js"></script></head><body><script>
// A단조 화음: A3 220 Hz, C4 261.6 Hz, E4 329.6 Hz (평균율, A4 = 440 Hz)
const TONES = [{ f: 220, a: 1, n: "A3" }, { f: 261.6, a: 0.7, n: "C4" }, { f: 329.6, a: 0.5, n: "E4" }], FS = 8000, N = 800, SHOW = 225;
const samples = Array.from({ length: N }, (_, i) => TONES.reduce((s, p) => s + p.a * Math.sin(2 * Math.PI * p.f * i / FS), 0));
const hann = samples.map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
// 해닝 창을 씌운 진폭 스펙트럼, 순음 진폭 1이 1이 되게 정규화
const mag = (f) => { let re = 0, im = 0; for (let i = 0; i < N; i++) { const w = hann[i] * samples[i], ph = 2 * Math.PI * f * i / FS; re += w * Math.cos(ph); im -= w * Math.sin(ph); } return 4 * Math.hypot(re, im) / N; };
LTT.expect("220 Hz 성분 진폭", mag(220), 1, { tol: 0.06 });
// 파형(시간)과 스펙트럼(주파수)을 한 판에 겹친다: 위 띠는 앞 28 ms를 같은 폭에 늘인 파형. 225개는 두 선 끝 라벨이 겹치지 않는 길이
const tx = (i) => 150 + 250 * i / (SHOW - 1), band = (v) => 1.72 + v * 0.2;
const wave = samples.slice(0, SHOW).map((v, i) => [tx(i), band(v / 1.9 * 1.6)]);
const probe = (f) => Array.from({ length: SHOW }, (_, i) => [tx(i), band(0.9 * Math.sin(2 * Math.PI * f * i / FS))]);
const CUT = [150, 220, 261.6, 329.6, 400];
const seg = (k) => Array.from({ length: 41 }, (_, i) => { const f = CUT[k] + (CUT[k + 1] - CUT[k]) * i / 40; return [f, mag(f)]; });
LTT.deck({
  title: "푸리에 변환", theme: "paper", exemplar: true,
  glossary: { "스펙트럼": "신호에 어떤 주파수가 얼마만큼 들어 있는지를 주파수 축에 그린 그림" },
  scenes: [{
    type: "hook", pre: "푸리에 변환", text: "엉킨 파형 하나에 음 세 개가 숨어 있다",
    sub: "기준 사인파(가는 선)를 낮은 음부터 높은 음까지 대어 보면, 박자가 맞는 주파수에서만 {{스펙트럼}} 봉우리가 솟는다.",
    visual: LTT.chart({ aspect: 1.4,
      x: { label: "주파수 (Hz) · 위 띠는 앞 28 ms 파형", domain: [150, 400] }, y: { domain: [0, 2.1], fmt: () => "" },
      series: [{ id: "wave", label: "마이크 파형", type: "line", points: wave, tone: "ink" }, { id: "probe", label: "기준 사인파", type: "line", points: probe(150), tone: "accent", dash: true },
        ...[0, 1, 2, 3].map((k) => ({ id: "s" + k, label: k ? "" : "스펙트럼", type: "area", points: seg(k), tone: "accent" }))],
      refs: TONES.map((p, i) => ({ id: "r" + i, x: p.f, label: p.n })) }),
    motion: [
      ["hide", { ids: ["r0", "r1", "r2"], dur: 0.3 }],
      ...[0, 1, 2, 3].flatMap((k) => [
        { par: [["draw", { id: "s" + k, dur: 1.5 }], ["point", { id: "s" + k, from: CUT[k], to: CUT[k + 1], dur: 1.5 }], ["to", { id: "probe", points: probe(CUT[k + 1]), dur: 1.5 }]] },
        ...(k < 3 ? [["show", { id: "r" + k, dur: 0.3 }]] : [])])
    ],
    basis: "A단조 화음(A3 220, C4 261.6, E4 329.6 Hz, 진폭 1 : 0.7 : 0.5)을 100 ms 해닝 창으로 계산한 모델 예시"
  }]
});
</script></body></html>
