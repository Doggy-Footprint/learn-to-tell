<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로드 시간 예산</title><script src="/kit/ltt.js"></script></head><body><script>
const SEG = [["DNS", 100, "--ltt-c1"], ["TCP", 100, "--ltt-c1"], ["TLS", 200, "--ltt-c1"], ["TTFB", 400, "--ltt-c2"], ["HTML", 200, "--ltt-c3"], ["CSS·JS·렌더", 900, "--ltt-c3"]];
const BUDGET = 2500, TOTAL = SEG.reduce((a, s) => a + s[1], 0);
LTT.expect("합계", TOTAL, 1900, { tol: 0 });
const X = (ms) => 3 + 80 * ms / 2500, rowY = (i) => 10 + i * 11, BAR = 80;
const shapes = {}, grow = {}, fold = {};
let acc = 0;
SEG.forEach(([k, ms, fill], i) => {
  const x = X(acc), w = X(acc + ms) - x; acc += ms;
  shapes["g" + i] = { kind: "rect", x, y: rowY(i), width: w, height: 8, fill: "--ltt-line", opacity: 0.6 };
  shapes["b" + i] = { kind: "rect", x, y: rowY(i), width: 0, height: 8, fill };
  shapes["t" + i] = { kind: "label", x: x + w + 1, y: rowY(i) + 4, text: `${k} ${ms}ms`, anchor: "l", opacity: 0 };
  grow["b" + i] = { width: w }; grow["t" + i] = { opacity: 1 };
  fold["b" + i] = { y: BAR }; fold["t" + i] = { opacity: 0 };
});
shapes.lcp = { kind: "line", x1: X(BUDGET), y1: 4, x2: X(BUDGET), y2: BAR + 12, stroke: "--ltt-bad" };
shapes.lcpT = { kind: "label", x: X(BUDGET) - 1, y: 4, text: "LCP 예산 2.5초", anchor: "r", tone: "bad" };
shapes.left = { kind: "rect", x: X(TOTAL), y: BAR, width: X(BUDGET) - X(TOTAL), height: 8, fill: "--ltt-good", opacity: 0 };
shapes.leftT = { kind: "label", x: X(BUDGET), y: BAR + 14, text: `남은 ${BUDGET - TOTAL}ms`, anchor: "r", tone: "good", opacity: 0 };
shapes.sum = { kind: "label", x: X(0), y: BAR + 14, text: `합계 ${TOTAL.toLocaleString()}ms`, anchor: "l", cls: "strong", opacity: 0 };
const states = { done: { left: { opacity: 1 }, leftT: { opacity: 1 }, sum: { opacity: 1 } } };
SEG.forEach((_, i) => { states["w" + i] = {}; for (let j = 0; j <= i; j++) Object.assign(states["w" + i], { ["b" + j]: grow["b" + j], ["t" + j]: grow["t" + j] }); });
states.fold = Object.assign({}, states.w5, fold);
Object.assign(states.done, states.fold);
const budget = LTT.morph({ aspect: 1.8, shapes, states });
LTT.deck({
  title: "로드 시간 예산", theme: "sketch", exemplar: true,
  glossary: { "TTFB": "요청을 보낸 뒤 서버의 첫 바이트가 도착하기까지 걸린 시간", "LCP": "화면에서 가장 큰 콘텐츠가 그려진 시점. 2.5초 안이면 '좋음'" },
  scenes: [{
    type: "overview", title: "2.5초 예산은 연결·서버·렌더가 차례로 쌓여 채운다",
    sub: "구간마다 한 줄씩 그려진 뒤 한 막대로 내려 쌓인다. 흐린 줄은 각 구간이 시작하는 자리다.",
    visual: budget,
    points: [{ on: "g2", text: "왕복 횟수가 연결 시간을 정한다" }, { on: "g3", text: "서버가 첫 바이트를 늦게 준다" }, { on: "g5", text: "렌더를 막는 파일이 가장 길다" }],
    motion: [
      ...SEG.map((_, i) => ["to", { state: "w" + i, dur: 0.6 }]), ["wait", 0.8],
      ["to", { state: "fold", dur: 1.4 }], ["to", { state: "done", dur: 0.6 }],
      ["note", { n: 1, dur: 0.5 }], ["note", { n: 2, dur: 0.5 }], ["note", { n: 3, dur: 0.5 }]
    ],
    basis: "모바일 4G 왕복 약 100ms, TLS 1.2(2왕복) 가정. {{LCP}} 목표는 web.dev Core Web Vitals, {{TTFB}} 400ms는 예시."
  }]
});
</script></body></html>
