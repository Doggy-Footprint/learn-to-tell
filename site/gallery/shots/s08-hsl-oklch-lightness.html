<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색상 채도 명도</title>
<script type="application/json" id="ltt-meta">{"topic":"색상·채도·명도와 HSL·OKLCH 명도 차이","audience":"UI 개발자·디자이너","theme":"studio","medium":"디자인 툴 색 패널","decision":"팔레트를 HSL과 OKLCH 중 무엇으로 만들까","domain":"UI 색","pattern":["terms"],"mode":"카탈로그용: 장면 하나짜리 본보기. 변환 구조를 \"강조가 훑음\" 움직임과 중앙 주인공 구도로 보인다"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
.hl{width:100%;max-width:900px;height:auto;display:block;margin:0 auto 10px}
.hl text{font-family:inherit}
.tv{display:flex;gap:4px;height:26px;width:100%}
.tv i{flex:1;border-radius:4px}
</style>
<style>/* 장면 하나짜리 본보기라 덱 순서 lint가 늘 뜬다. 기대값 불일치만 패널로 보인다. */ #ltt-expect:not([data-fails]) { display: none; }</style>
</head>
<body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
// 견본 색은 이 장면의 내용(실제 색 값)이라 토큰 대신 hsl()/oklch()로 적는다
const lin = (c) => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
function hslToRgb(h, s, l) { const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [f(0), f(8), f(4)]; }
// Björn Ottosson의 OKLab 정의(2020)
function okL(rgb) { const [r, g, b] = rgb.map(lin);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b),
    s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s; }
LTT.expect("hsl(60 100% 50%)의 OKLCH L", okL(hslToRgb(60, 1, .5)), 0.968, { tol: 0.002 });
LTT.expect("hsl(240 100% 50%)의 OKLCH L", okL(hslToRgb(240, 1, .5)), 0.452, { tol: 0.002 });
const HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function strips(host) {
  const W = 1000, H = 372, x0 = 150, cw = 64, gap = 6;
  const s = mk("svg", { viewBox: `0 0 ${W} ${H}`, class: "hl", "data-annotate": "" }, host);
  const T = (x, y, t, st, a = "start") => { const n = mk("text", { x, y, "text-anchor": a, style: st }, s); n.textContent = t; return n; };
  const rows = [
    { y: 34, name: "HSL", sub: "L 50% 고정", col: (h) => `hsl(${h} 100% 50%)`, L: (h) => okL(hslToRgb(h, 1, .5)) },
    { y: 196, name: "OKLCH", sub: "L 0.70 고정", col: (h) => `oklch(0.70 0.13 ${h})`, L: () => 0.70 } ];
  const cols = [];
  HUES.forEach((h, i) => cols.push({ x: x0 + i * (cw + gap), h }));
  const hi = mk("rect", { y: 22, width: cw + 12, height: 314, rx: 10, style: "fill:none;stroke:var(--ltt-ink);stroke-width:2.5" }, s);
  rows.forEach((r) => {
    T(x0 - 18, r.y + 34, r.name, "font-size:22px;font-weight:700;fill:var(--ltt-ink)", "end");
    T(x0 - 18, r.y + 56, r.sub, "font-size:14px;fill:var(--ltt-muted)", "end");
    T(x0 - 18, r.y + 106, "흑백으로", "font-size:14px;fill:var(--ltt-muted)", "end");
    r.gray = []; r.vals = [];
    cols.forEach((c) => {
      mk("rect", { x: c.x, y: r.y, width: cw, height: 64, rx: 8, style: `fill:${r.col(c.h)}` }, s);
      const L = r.L(c.h);
      r.gray.push(mk("rect", { x: c.x, y: r.y + 80, width: cw, height: 40, rx: 8, style: `fill:oklch(${L.toFixed(3)} 0 0)` }, s));
      r.vals.push(T(c.x + cw / 2, r.y + 142, L.toFixed(2), "font-size:14px;font-weight:600;fill:var(--ltt-muted)", "middle"));
    });
  });
  const hueT = T(x0 + 6 * (cw + gap), 16, "", "font-size:15px;fill:var(--ltt-ink-2)", "middle");
  const readout = T(W / 2, H - 4, "", "font-size:16px;fill:var(--ltt-ink-2)", "middle");
  function draw(u) {
    const pos = ease(u) * (HUES.length - 1), i = Math.round(pos);
    hi.setAttribute("x", x0 - 6 + pos * (cw + gap));
    hueT.setAttribute("x", x0 + cw / 2 + pos * (cw + gap)); hueT.textContent = `색상 ${HUES[i]}°`;
    rows.forEach((r) => r.vals.forEach((v, j) => { v.style.fill = j === i ? "var(--ltt-ink)" : "var(--ltt-muted)"; v.style.fontSize = j === i ? "17px" : "14px"; }));
    const a = rows[0].L(HUES[i]);
    readout.textContent = `HSL은 둘 다 50%라 부르지만 눈에 보이는 명도는 ${a.toFixed(2)} · OKLCH는 어느 색상에서나 0.70`;
  }
  return { el: s, draw };
}

const tiny = (fn) => (el) => { const d = el.appendChild(document.createElement("div")); d.className = "tv";
  for (let i = 0; i < 7; i++) d.appendChild(document.createElement("i")).style.background = fn(i); return d; };

LTT.deck({
  title: "색상 채도 명도", theme: "studio",
  glossary: { "색상": "빨강·노랑·파랑처럼 색이 어느 쪽인지. 원 위의 각도(0–360°)로 적는다",
    "채도": "같은 명도의 회색에서 얼마나 멀리 떨어진 진한 색인가. OKLCH에서는 C(chroma)",
    "명도": "얼마나 밝아 보이는가. HSL의 L은 계산값이고, OKLCH의 L은 사람이 느끼는 밝기에 맞춘 값" },
  scenes: [{
    type: "terms", title: "같은 ‘명도 50%’라도 노랑과 파랑은 밝기가 다르다", en: "Hue · Chroma · Lightness",
    sub: "강조 틀이 색상을 따라 훑는다. 위는 HSL L 50%, 아래는 OKLCH L 0.70. 각 색 아래 칸은 흑백으로 바꾼 밝기다.",
    terms: [
      { key: "색상", word: "색상", en: "Hue", visual: tiny((i) => `oklch(0.70 0.13 ${i * 51})`), plain: "원 위의 각도. 바꾸면 색 이름이 바뀐다" },
      { key: "채도", word: "채도", en: "Chroma", visual: tiny((i) => `oklch(0.70 ${(i * 0.025).toFixed(3)} 250)`), plain: "회색에서 멀어진 정도. 0이면 회색" },
      { key: "명도", word: "명도", en: "Lightness", visual: tiny((i) => `oklch(${(0.3 + i * 0.1).toFixed(2)} 0.1 250)`), plain: "눈에 보이는 밝기. 글자 대비를 정한다" } ],
    mount(body) {
      const w = document.createElement("div"); body.prepend(w);
      const f = strips(w);
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      // 왼→오 훑기 4.8초, 끝에서 1초 머문 뒤 되돌아온다
      const P = 11600; let timer = 0, t0 = 0;
      const tick = () => { const t = ((Date.now() - t0) % P) / P * 11.6;
        const u = t < 4.8 ? t / 4.8 : t < 5.8 ? 1 : t < 10.6 ? 1 - (t - 5.8) / 4.8 : 0;
        f.draw(u); timer = setTimeout(tick, 16); };
      f.draw(0.18);
      return { enter() { clearTimeout(timer); if (reduced) { f.draw(2 / 11); return; } t0 = Date.now(); tick(); }, leave() { clearTimeout(timer); } };
    },
    basis: "명도 값은 sRGB를 OKLab(Ottosson 2020)으로 바꿔 계산. hsl(60 100% 50%)은 L 0.97, hsl(240 100% 50%)은 L 0.45.",
    takeaway: "HSL의 L은 같아도 보이는 밝기가 색상마다 다르고, OKLCH의 L은 색상을 바꿔도 밝기가 유지된다.",
    recall: "노랑과 파랑을 같은 밝기로 맞추려면 어떤 색 공간의 L을 고정해야 할까?"
  }]
});
</script>
</body>
</html>
