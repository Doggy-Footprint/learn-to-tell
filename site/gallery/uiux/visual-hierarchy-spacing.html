<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세련된 화면은 '차이'를 아껴 쓴다</title>
<script type="application/json" id="ltt-meta">{
  "topic": "대시보드의 시각 위계와 간격: 근접성, 위계 신호, 간격 체계, 대비 예산",
  "audience": "디자인 교육을 받지 않은 백엔드 출신 풀스택 개발자",
  "theme": "studio",
  "medium": "deck",
  "decision": "대시보드 화면에서 무엇을 강조하고 간격을 어떻게 나눌지",
  "glossary": {
    "근접성": "가까이 놓인 요소를 한 묶음으로 보는 지각 경향(게슈탈트 원리 중 하나, Wertheimer 1923). 선이나 상자 없이 간격만으로 묶음이 생긴다.",
    "위계 신호": "요소의 중요도 순서를 알리는 시각 차이. 크기·굵기·색(명도·채도)이 대표적이다. 절대값이 아니라 주변과의 차이로 읽힌다.",
    "간격 체계": "간격을 4의 배수 같은 정해진 척도(예: 4, 8, 12, 16, 24, 32, 48)에서만 고르는 규칙. 묶음 안은 작은 값, 묶음 사이는 큰 값을 쓴다.",
    "대비 예산": "한 화면에서 강한 강조(색, 큰 굵기)를 쓸 곳의 수를 미리 정해 두는 생각. 강조는 드물수록 주변과의 차이가 커진다.",
    "8pt 격자": "간격과 크기를 8(작은 조정은 4)의 배수로 맞추는 규칙. pt는 디자인 툴의 길이 단위로, 웹 화면에서는 CSS px와 같은 값으로 쓰는 경우가 많다.",
    "흐리게 보기": "화면을 흐리게(또는 눈을 가늘게 뜨고) 보아 세부를 지운 뒤 남는 덩어리로 위계를 점검하는 실무 요령(squint test). 경험칙이다.",
    "주 버튼": "화면에서 가장 권하는 동작 하나에만 쓰는 채운 버튼(primary button). 나머지 동작은 테두리만 있는 버튼으로 둔다."
  }
}</script>
<link rel="stylesheet" href="/kit/ltt.css">
<link rel="stylesheet" href="/kit/ltt-parts.css">
<link rel="stylesheet" href="/kit/ltt-ui.css">
<link rel="stylesheet" href="/kit/ltt-mock.css">
<link rel="stylesheet" href="/kit/ltt-deck.css">
<style>
  /* 목업 안은 '실제 화면'이라 hex를 쓴다 */
  .db { font-family: "Pretendard", system-ui, sans-serif; color: #1f2430; background: #fff; padding: 24px; width: 600px; box-sizing: border-box; text-align: left; }
  .db .row { display: flex; align-items: stretch; }
  .db .head { display: flex; justify-content: space-between; align-items: center; }
  .db .btn { font-size: 13px; padding: 6px 12px; border-radius: 6px; display: inline-block; }
  .db .gap-v { position: relative; }
  .db .gap-h { position: relative; flex: none; }
  .db .ann { position: absolute; font: 600 11px/1 ui-monospace, monospace; color: #3b5bdb; background: #edf2ff; padding: 1px 3px; border-radius: 3px; }
  .db .gap-v .ann { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .db .gap-h .ann { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .db .gap-v.show { background: repeating-linear-gradient(90deg, transparent 0 6px, #dbe4ff 6px 8px); }
  .db .gap-h.show { background: repeating-linear-gradient(0deg, transparent 0 6px, #dbe4ff 6px 8px); }
  .db .card { flex: 1; min-width: 0; position: relative; }
  .db .lab, .db .val, .db .del { position: relative; white-space: nowrap; }
  .db .bars { display: flex; align-items: flex-end; height: 96px; }
  .db .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 12px; }
  .db .bar i { display: block; width: 70%; }
  .db .days { display: flex; font-size: 12px; margin-top: 4px; }
  .db .days span { flex: 1; text-align: center; }
  /* before */
  .db.loud .title { font: 800 20px/1.2 inherit; font-family: inherit; color: #1d4ed8; }
  .db.loud .card { border: 2px solid #4263eb; border-radius: 8px; padding: 12px; }
  .db.loud .lab { font-weight: 700; font-size: 13px; line-height: 16px; }
  .db.loud .val { font-weight: 800; font-size: 20px; line-height: 24px; }
  .db.loud .del { font-weight: 700; font-size: 13px; line-height: 16px; }
  .db.loud .del span { padding: 0 4px; border-radius: 4px; }
  .db.loud .stitle { font-weight: 800; font-size: 15px; line-height: 18px; color: #1d4ed8; }
  .db.loud .bar { font-weight: 700; }
  /* after */
  .db.calm .title { font-weight: 600; font-size: 18px; line-height: 22px; }
  .db.calm .card { background: #f4f5f7; border-radius: 8px; padding: 16px; }
  .db.calm .lab { font-size: 13px; line-height: 16px; color: #6b7280; }
  .db.calm .val { font-weight: 600; font-size: 20px; line-height: 24px; }
  .db.calm .del { font-size: 13px; line-height: 16px; color: #6b7280; }
  .db.calm .del.bad { color: #e03131; font-weight: 700; }
  .db.calm .stitle { font-weight: 600; font-size: 15px; line-height: 18px; }
  .db.calm .bar { color: #6b7280; }
  .db.calm .days { color: #6b7280; }
  .db .mk { position: absolute; top: -10px; left: -10px; width: 22px; height: 22px; border-radius: 50%; background: var(--ltt-dark); color: var(--ltt-on-dark); font: 700 13px/22px system-ui, sans-serif; text-align: center; z-index: 2; }
  .db.kpi-only { padding: 16px; }

  /* 근접성 손잡이 장면 */
  .vh-prox { display: grid; grid-template-columns: 300px 360px; gap: 48px; align-items: start; justify-content: center; }
  .vh-list { position: relative; background: #fff; border: 1px solid var(--ltt-line); border-radius: 10px; padding: 24px 72px 24px 28px; font-family: "Pretendard", system-ui, sans-serif; color: #1f2430; }
  .vh-list { padding-right: 112px; }
  .vh-marks { position: absolute; inset: 0; pointer-events: none; }
  .vh-gap { position: absolute; right: 20px; width: 80px; box-sizing: border-box; border-left: 4px solid; display: flex; align-items: center; }
  .vh-gap span { font: 700 16px/1 system-ui, sans-serif; margin-left: 8px; white-space: nowrap; }
  .vh-gap.in { border-color: #3b5bdb; color: #3b5bdb; background: #edf2ff; }
  .vh-gap.out { border-color: #868e96; color: #495057; background: #f1f3f5; }
  .vh-list > .l, .vh-list > .v { line-height: 20px; font-size: 16px; white-space: nowrap; }
  .vh-list .l { color: #6b7280; }
  .vh-list .v { font-weight: 600; font-size: 20px; line-height: 24px; }
  .vh-read { display: flex; flex-direction: column; gap: 14px; }
  .vh-knob { display: flex; flex-direction: column; gap: 6px; }
  .vh-knob .name { font-size: 14px; color: var(--ltt-ink-2); }
  .vh-num { font-variant-numeric: tabular-nums; min-width: 5.5em; display: inline-block; }
  .vh-ratio { font-size: 44px; font-weight: 700; color: var(--ltt-ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .vh-ratio small { font-size: 15px; font-weight: 500; color: var(--ltt-muted); margin-left: 6px; }
  .vh-verdict { min-height: 4.4em; font-size: 15px; line-height: 1.45; padding: 10px 12px; border-radius: 8px; background: var(--ltt-card-2); color: var(--ltt-ink); }
  .vh-verdict b { color: var(--ltt-accent); }
  .vh-verdict.bad b { color: var(--ltt-bad); }

  /* 위계 신호 네 칸 */
  .vh-four { display: grid; grid-template-columns: repeat(4, 200px); gap: 20px; justify-content: center; }
  .vh-four .p { background: #fff; border: 1px solid var(--ltt-line); border-radius: 10px; padding: 16px 20px; font-family: "Pretendard", system-ui, sans-serif; }
  .vh-four .p h4 { margin: 0 0 12px; font-size: 14px; color: #6b7280; font-weight: 600; }
  .vh-four .w { font-size: 15px; line-height: 30px; color: #495057; white-space: nowrap; }

  /* 간격 체계 */
  .vh-scale-wrap { display: flex; gap: 48px; align-items: flex-start; justify-content: center; }
  .vh-scale-wrap svg text { font-family: "Pretendard", system-ui, sans-serif; }

  /* 대비 예산 2x2 */
  .vh-budget { display: grid; grid-template-columns: 110px 470px 470px; gap: 14px 20px; align-items: center; justify-content: center; }
  .vh-budget .hd { font-size: 14px; color: var(--ltt-ink-2); font-weight: 600; }
  .vh-budget .rl { font-size: 14px; color: var(--ltt-ink); font-weight: 600; line-height: 1.4; }
  .vh-budget .rl .ltt-tag { margin-top: 6px; display: inline-block; }
  .vh-budget .blur .db { filter: blur(5px); }
  .vh-budget .db { width: 470px; }
  .vh-budget .db .val { font-size: 18px; }

  .vh-tree svg { max-width: 100%; }
  .vh-pair { display: grid; grid-template-columns: 600px 600px; gap: 40px; justify-content: center; }
  .vh-pair .side { display: flex; flex-direction: column; gap: 10px; }
  .vh-pair .ft { font-size: 14px; color: var(--ltt-ink-2); }
  .vh-note { font-size: 13px; color: var(--ltt-muted); margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-mock.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
(() => {
  const KPI = [
    { lab: "매출", val: "4.2억 원", del: "+8.0%", good: true, vc: "#1971c2" },
    { lab: "신규 가입", val: "1,284명", del: "+3.1%", good: true, vc: "#2f9e44" },
    { lab: "이탈률", val: "5.6%", del: "+2.1%p", good: false, vc: "#e03131", alert: true },
    { lab: "평균 주문액", val: "32,800원", del: "−1.2%", good: false, vc: "#7048e8" },
  ];
  const DAYS = ["월", "화", "수", "목", "금", "토", "일"];
  const SALES = [0.52, 0.58, 0.61, 0.55, 0.66, 0.69, 0.59];
  const LOUD_BAR = ["#1971c2", "#2f9e44", "#f08c00", "#e03131", "#7048e8", "#0c8599", "#d6336c"];

  // 간격은 스페이서 요소로 넣어 측정 표시(ann)를 정확한 자리에 붙인다.
  const SP = {
    loud: { lv: 16, vd: 16, card: 16, section: 16, stitle: 16, head: 16 },
    calm: { lv: 4, vd: 4, card: 24, section: 48, stitle: 12, head: 24 },
  };
  const gv = (h, ann) => `<div class="gap-v${ann ? " show" : ""}" style="height:${h}px">${ann ? `<span class="ann">${h}</span>` : ""}</div>`;
  const gh = (w, ann) => `<div class="gap-h${ann ? " show" : ""}" style="width:${w}px">${ann ? `<span class="ann">${w}</span>` : ""}</div>`;
  const mk = (n, on) => on && n in on ?`<span class="mk" style="${on[n]}">${n}</span>` : "";

  function kpiRow(mode, o = {}) {
    const s = SP[mode], loud = mode === "loud";
    return `<div class="row">${KPI.map((k, i) => {
      const lab = loud ? `<div class="lab" data-hue style="color:#1d4ed8">${k.lab}</div>` : `<div class="lab">${k.lab}</div>`;
      const val = loud ? `<div class="val" data-hue style="color:${k.vc}">${k.val}${i === 1 ? mk(2, o.mk) : ""}</div>` : `<div class="val">${k.val}${i === 1 ? mk(2, o.mk) : ""}</div>`;
      const del = loud
        ? `<div class="del" data-hue style="color:${k.good ? "#2b8a3e" : "#c92a2a"}"><span style="background:${k.good ? "#d3f9d8" : "#ffe3e3"}">${k.del.startsWith("+") ? "▲" : "▼"} ${k.del}</span></div>`
        : `<div class="del${k.alert ? " bad" : ""}"${k.alert ? " data-hue" : ""}>${k.del}${k.alert ? mk(4, o.mk) : ""}</div>`;
      const card = `<div class="card">${i === 0 ? mk(1, o.mk) : ""}${lab}${gv(s.lv, o.ann && i === 0)}${val}${gv(s.vd, false)}${del}</div>`;
      return (i ? gh(s.card, o.ann && i === 1) : "") + card;
    }).join("")}</div>`;
  }

  function dashboard(mode, o = {}) {
    const s = SP[mode], loud = mode === "loud";
    const btns = loud
      ? `<span class="btn" style="background:#f08c00;color:#fff;font-weight:700">필터</span> <span class="btn" style="background:#3b5bdb;color:#fff;font-weight:700">내보내기</span>`
      : `<span class="btn" style="border:1px solid #cfd4da;color:#1f2430">필터</span> <span class="btn" style="background:#3b5bdb;color:#fff">내보내기</span>`;
    const max = 0.7;
    const bars = SALES.map((v, i) => `<div class="bar"><span>${v.toFixed(2)}</span><i style="height:${(v / max) * 70}px;background:${loud ? LOUD_BAR[i] : "#c5ccd6"}"></i></div>`).join("");
    return `<div class="db ${mode}">
      <div class="head"><div><div class="title">주간 운영 대시보드</div><div style="font-size:13px;color:${loud ? "#1d4ed8" : "#6b7280"};${loud ? "font-weight:700;" : ""}margin-top:4px">10.13 – 10.19</div></div><div>${btns}</div></div>
      ${gv(s.head, false)}
      ${kpiRow(mode, o)}
      <div style="position:relative">${gv(s.section, o.ann)}${mk(3, o.mk)}</div>
      <div class="stitle">일별 매출 (억 원)</div>
      ${gv(s.stitle, false)}
      <div class="bars">${bars}</div>
      <div class="days">${DAYS.map(d => `<span>${d}</span>`).join("")}</div>
    </div>`;
  }
  const kpiOnly = (mode, o) => `<div class="db ${mode} kpi-only">${kpiRow(mode, o)}</div>`;

  // 기대값: outline.md "수치 모델과 기대값"
  LTT.expect("일별 매출 합(억 원) = KPI 매출", SALES.reduce((a, b) => a + b, 0), 4.20, { tol: 0.001 });
  const countHue = html => { const t = document.createElement("template"); t.innerHTML = html; return t.content.querySelectorAll("[data-hue]").length; };
  LTT.expect("before KPI 줄 색 강조 요소 수", countHue(kpiOnly("loud")), 12);
  LTT.expect("after KPI 줄 색 강조 요소 수", countHue(kpiOnly("calm")), 1);
  const OUTER = 24;
  const ratio = inner => OUTER / inner;
  LTT.expect("근접성 비율(안쪽 8)", ratio(8), 3.0, { tol: 1e-9 });
  LTT.expect("근접성 비율(안쪽 32)", ratio(32), 0.75, { tol: 1e-9 });
  LTT.expect("after 간격 중 4의 배수가 아닌 값 수", Object.values(SP.calm).filter(v => v % 4).length, 0);
  LTT.expect("카드 사이 ÷ 라벨→값", SP.calm.card / SP.calm.lv, 6);
  LTT.expect("섹션 사이 ÷ 카드 사이", SP.calm.section / SP.calm.card, 2);

  const browser = (mode, o) => (el) => {
    const m = LTT.mock.browser({ title: "ops.example.com/weekly", width: 600, content: dashboard(mode, o) });
    el.append(m.el);
  };

  // 장면 3: 근접성 손잡이
  function proxScene(body) {
    const wrap = LTT.h("div", "vh-prox");
    const list = LTT.h("div", "vh-list");
    list.innerHTML = KPI.slice(0, 3).map(k => `<div class="l">${k.lab}</div><div class="v">${k.val}</div>`).join("");
    const read = LTT.h("div", "vh-read", `
      <div class="vh-knob"><span class="name">안쪽 간격(라벨 → 값): <b id="inner-v" class="vh-num"></b></span><div id="inner"></div></div>
      <div class="vh-knob"><span class="name">바깥 간격(값 → 다음 라벨): <b class="vh-num">${OUTER}px 고정</b></span></div>
      <div><div class="vh-ratio"><span id="vh-r">×1.0</span><small>바깥 ÷ 안쪽</small></div></div>
      <div class="vh-verdict" id="vh-verdict"></div>
      <div id="vh-goal"></div>
      <div class="ltt-basis">측정선은 줄 상자 사이 간격(CSS margin, px). 2배 기준은 실무 경험칙이다.</div>`);
    wrap.append(list, read);
    body.append(wrap);
    list.querySelectorAll(".l").forEach((el, i) => { if (i) el.style.marginTop = OUTER + "px"; });
    const marks = LTT.h("div", "vh-marks");
    list.append(marks);
    const drawMarks = () => {
      marks.innerHTML = [...list.querySelectorAll(".l, .v")].slice(1).map(el => {
        const m = parseFloat(el.style.marginTop) || 0, inner = el.classList.contains("v");
        return `<div class="vh-gap ${inner ? "in" : "out"}" style="top:${el.offsetTop - m}px;height:${m}px"><span>${inner ? "안" : "밖"} ${m}</span></div>`;
      }).join("");
    };
    LTT.sweep({
      params: { inner: { kind: "steps", stops: [4, 8, 12, 16, 24, 32], value: 24, stopLabel: v => v + "px", fmt: v => v + "px", label: "안쪽 간격" } },
      render({ inner }) {
        list.querySelectorAll(".v").forEach(el => { el.style.marginTop = inner + "px"; });
        drawMarks();
        const r = ratio(inner);
        read.querySelector("#vh-r").textContent = "×" + r.toFixed(r < 1 ? 2 : 1);
        const v = read.querySelector("#vh-verdict");
        v.classList.toggle("bad", r <= 1);
        v.innerHTML = r >= 2 ? "<b>한 쌍으로 묶인다.</b> 라벨이 바로 아래 값에 붙어 보인다."
          : r > 1 ? "<b>묶이긴 하지만 흐릿하다.</b> 차이가 작아 한눈에 짝이 갈리지 않는다."
          : r === 1 ? "<b>짝을 정할 수 없다.</b> '신규 가입'이 위 값과 아래 값에서 같은 거리에 있다."
          : "<b>잘못 묶인다.</b> 라벨이 위쪽 값에 더 가까워 앞 쌍의 일부처럼 보인다.";
        LTT.record("knob", { scene: "근접성", inner, ratio: r });
      },
      goal: { el: read.querySelector("#vh-goal"), text: "라벨과 값이 한 쌍으로 분명히 묶이게 안쪽 간격을 줄여 보세요.", target: "바깥 ÷ 안쪽 ≥ 2", check: v => ratio(v.inner) >= 2 },
    });
  }

  // 장면 4: 위계 신호 네 칸
  const WORDS = ["매출", "신규 가입", "이탈률", "평균 주문액", "방문 수", "전환율"];
  const MIX = [[17, 700, "#1971c2"], [13, 400, "#2f9e44"], [15, 700, "#e03131"], [18, 400, "#7048e8"], [14, 700, "#f08c00"], [16, 400, "#0c8599"]];
  function fourPanels(el) {
    const panel = (title, f) => `<div class="p"><h4>${title}</h4>${WORDS.map((w, i) => `<div class="w" style="${f(w, i)}">${w}</div>`).join("")}</div>`;
    const t = w => w === "이탈률";
    el.innerHTML = `<div><div class="vh-four">
      ${panel("① 크기만 다름", w => t(w) ? "font-size:21px;color:#495057" : "")}
      ${panel("② 굵기만 다름", w => t(w) ? "font-weight:800;color:#1f2430" : "")}
      ${panel("③ 색만 다름", w => t(w) ? "color:#e03131" : "")}
      ${panel("④ 모두가 제각각", (w, i) => `font-size:${MIX[i][0]}px;font-weight:${MIX[i][1]};color:${MIX[i][2]}`)}
    </div><div class="vh-note">네 칸 모두 '이탈률'이 세 번째 줄에 있다. ④의 '이탈률'은 ③과 같은 빨강에 굵기까지 더했다.</div></div>`;
  }

  // 장면 5: 간격 체계 (1.5배 확대 해부도)
  function scaleFigure(el) {
    const S = 1.5, used = { 4: "var(--ltt-c1)", 16: "var(--ltt-c3)", 24: "var(--ltt-c2)", 48: "var(--ltt-c4)" };
    const steps = [4, 8, 12, 16, 24, 32, 48];
    const ruler = `<svg width="250" height="${steps.length * 40 + 30}" viewBox="0 0 250 ${steps.length * 40 + 30}">
      <text x="0" y="16" font-size="14" fill="var(--ltt-ink-2)" font-weight="600">4의 배수 척도 (px)</text>
      ${steps.map((v, i) => `<g transform="translate(0,${36 + i * 40})">
        <text x="30" y="17" font-size="15" text-anchor="end" fill="${used[v] ? "var(--ltt-ink)" : "var(--ltt-muted)"}" font-weight="${used[v] ? 700 : 400}">${v}</text>
        <rect x="40" y="4" width="${v * S * 2}" height="18" rx="3" fill="${used[v] || "var(--ltt-line)"}"/>
        ${used[v] ? "" : `<text x="${46 + v * S * 2}" y="17" font-size="12" fill="var(--ltt-muted)">안 씀</text>`}
      </g>`).join("")}
    </svg>`;
    // 실제 px: 카드 폭 150, 여백 16, 라벨 16, 값 24, 변화율 16, 사이 4, 카드 사이 24, 섹션 사이 48
    const cw = 150, pad = 16, lab = 16, val = 24, del = 16, g = 4, cg = 24, sg = 48;
    const ch = pad + lab + g + val + g + del + pad;
    const W = (cw * 2 + cg) * S + 120, H = (ch + sg + 18 + 30) * S + 20;
    const X = v => 60 + v * S, Y = v => 10 + v * S;
    const card = (x0, k) => `
      <rect x="${X(x0)}" y="${Y(0)}" width="${cw * S}" height="${ch * S}" rx="${8 * S}" fill="var(--ltt-card-2)" stroke="var(--ltt-line-2)"/>
      <text x="${X(x0 + pad)}" y="${Y(pad + lab - 3)}" font-size="${13 * S}" fill="var(--ltt-muted)">${k.lab}</text>
      <text x="${X(x0 + pad)}" y="${Y(pad + lab + g + val - 5)}" font-size="${20 * S}" font-weight="400" fill="var(--ltt-muted)">${k.val}</text>
      <text x="${X(x0 + pad)}" y="${Y(pad + lab + g + val + g + del - 3)}" font-size="${13 * S}" fill="var(--ltt-muted)">${k.del}</text>`;
    const vgap = (x, y0, h, c, label, side = -1) => `
      <rect x="${X(x) - (side < 0 ? 0 : 0)}" y="${Y(y0)}" width="${10 * S}" height="${h * S}" fill="${c}" opacity=".85" transform="translate(${side < 0 ? -10 * S : 0},0)"/>
      <text x="${X(x) + side * (10 * S + 6)}" y="${Y(y0 + h / 2) + 7}" font-size="20" font-weight="800" fill="${c}" text-anchor="${side < 0 ? "end" : "start"}">${label}</text>`;
    const hgap = (x0, y, w, c, label) => `
      <rect x="${X(x0)}" y="${Y(y)}" width="${w * S}" height="${10 * S}" fill="${c}" opacity=".85"/>
      <text x="${X(x0 + w / 2)}" y="${Y(y) - 8}" font-size="20" font-weight="800" fill="${c}" text-anchor="middle">${label}</text>`;
    const anat = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      ${card(0, KPI[0])}${card(cw + cg, KPI[1])}
      ${vgap(cw - 12, pad + lab, g, "var(--ltt-c1)", "4")}
      ${vgap(cw - 12, 0, pad, "var(--ltt-c3)", "16")}
      ${hgap(cw, ch / 2 - 5, cg, "var(--ltt-c2)", "24")}
      ${vgap(cw * 2 + cg, ch, sg, "var(--ltt-c4)", "48", 1)}
      <line x1="${X(0)}" y1="${Y(ch + sg)}" x2="${X(cw * 2 + cg)}" y2="${Y(ch + sg)}" stroke="var(--ltt-line-2)" stroke-dasharray="4 4"/>
      <text x="${X(0)}" y="${Y(ch + sg + 15)}" font-size="${15 * S}" font-weight="600" fill="var(--ltt-ink)">일별 매출 (억 원)</text>
      <text x="${X(0)}" y="${Y(ch + sg + 42)}" font-size="13" fill="var(--ltt-muted)">다음 섹션 시작 · 그림은 실제 px의 1.5배로 확대</text>
    </svg>`;
    el.innerHTML = `<div class="vh-scale-wrap"><div>${ruler}</div><div>${anat}</div></div>`;
  }
