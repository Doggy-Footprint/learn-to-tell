<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>회색 글자의 대비</title>
<script type="application/json" id="ltt-meta">{
  "topic": "회색 글자의 대비: RGB에서 WCAG 대비비와 APCA까지",
  "audience": "hex 색과 CSS에 익숙한 프론트엔드 개발자",
  "theme": "studio",
  "medium": "deck",
  "decision": "디자인 시스템의 보조 텍스트 회색을 얼마나 옅게 할 수 있나",
  "glossary": {
    "채널": "hex 색의 두 자리씩 = 빨강(R)·초록(G)·파랑(B) 신호값 하나. 0–255. 화면에 보내는 값이지 빛의 양 자체가 아니다.",
    "선형 빛": "화면이 실제로 내보내는 빛의 양을 0(꺼짐)–1(최대)로 잰 값. 두 배면 빛도 두 배다.",
    "감마": "sRGB 신호값과 선형 빛 사이의 굽은 변환. 신호값 c(0–1)를 c ≤ 0.04045면 c/12.92, 아니면 ((c+0.055)/1.055)<sup>2.4</sup>로 푼다.",
    "상대 휘도": "눈이 느끼는 밝기에 맞춘 빛의 양. 선형 빛 R·G·B에 0.2126·0.7152·0.0722를 곱해 더한다. 검정 0, 흰색 1. 기호 L.",
    "대비비": "WCAG 2의 대비 척도. (밝은 쪽 L + 0.05) ÷ (어두운 쪽 L + 0.05). 1:1(같은 색)부터 21:1(검정·흰색)까지.",
    "AA": "WCAG 적합성 등급 중 보통 목표로 삼는 단계. 글자 대비는 본문 4.5:1, 큰 글자 3:1(SC 1.4.3).",
    "AAA": "WCAG의 더 엄격한 등급. 글자 대비는 본문 7:1, 큰 글자 4.5:1(SC 1.4.6).",
    "큰 글자": "WCAG 기준에서 18pt(24px) 이상, 또는 굵게(700) 14pt(약 18.66px) 이상인 글자.",
    "APCA": "Accessible Perceptual Contrast Algorithm. 글자 색과 배경 색의 방향(어느 쪽이 밝은지)과 글자 크기·굵기를 따로 보는 대비 계산법. WCAG 3 초안의 후보로 논의됐고 아직 표준이 아니다.",
    "Lc": "APCA가 내는 명도 대비 값(Lightness contrast). 대략 0–106, 어두운 글자/밝은 배경은 양수, 밝은 글자/어두운 배경은 음수. 기준은 절댓값으로 본다.",
    "극성": "글자가 배경보다 어두운지(어두운 글자/밝은 배경) 밝은지(밝은 글자/어두운 배경)의 방향."
  }
}</script>

<body>
<script>
// 수치 모델: WCAG 2.2 상대 휘도·대비비, APCA 0.0.98G-4g. 기대값은 outline.md 표에서 옮긴다.
const lin = v => { const c = v / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const rgbOf = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const lum = h => { const [r, g, b] = rgbOf(h); return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const gh = v => '#' + v.toString(16).padStart(2, '0').repeat(3);
const ys = h => { const [r, g, b] = rgbOf(h).map(x => x / 255); let y = 0.2126729 * r ** 2.4 + 0.7151522 * g ** 2.4 + 0.072175 * b ** 2.4; if (y < 0.022) y += (0.022 - y) ** 1.414; return y; };
const apca = (txt, bg) => {
  const yt = ys(txt), yb = ys(bg);
  if (Math.abs(yb - yt) < 0.0005) return 0;
  if (yb > yt) { const s = (yb ** 0.56 - yt ** 0.57) * 1.14; return s < 0.1 ? 0 : (s - 0.027) * 100; }
  const s = (yb ** 0.65 - yt ** 0.62) * 1.14; return s > -0.1 ? 0 : (s + 0.027) * 100;
};
const f2 = x => x.toFixed(2);
const lightest = t => { let best = 0; for (let v = 0; v < 256; v++) if (ratio(gh(v), '#ffffff') >= t) best = v; return best; };

LTT.expect('lin(128)', lin(128), 0.2159, { tol: 0.0005 });
LTT.expect('lin(119)', lin(119), 0.1845, { tol: 0.0005 });
LTT.expect('lin(118)', lin(118), 0.1812, { tol: 0.0005 });
LTT.expect('초록/파랑 빛의 양', 0.7152 / 0.0722, 9.91, { tol: 0.01 });
LTT.expect('CR #808080/흰', ratio('#808080', '#ffffff'), 3.949, { tol: 0.002 });
LTT.expect('CR #777/흰', ratio('#777777', '#ffffff'), 4.478, { tol: 0.002 });
LTT.expect('CR #767676/흰', ratio('#767676', '#ffffff'), 4.542, { tol: 0.002 });
LTT.expect('CR #949494/흰', ratio('#949494', '#ffffff'), 3.033, { tol: 0.002 });
LTT.expect('CR #595959/흰', ratio('#595959', '#ffffff'), 7.005, { tol: 0.002 });
LTT.expect('CR #666/흰', ratio('#666666', '#ffffff'), 5.742, { tol: 0.002 });
LTT.expect('CR #6B6B6B/흰', ratio('#6b6b6b', '#ffffff'), 5.329, { tol: 0.002 });
LTT.expect('CR #888/흰', ratio('#888888', '#ffffff'), 3.545, { tol: 0.002 });
LTT.expect('CR #767676/F5', ratio('#767676', '#f5f5f5'), 4.166, { tol: 0.002 });
LTT.expect('CR #707070/F5', ratio('#707070', '#f5f5f5'), 4.542, { tol: 0.002 });
LTT.expect('CR #777/검정', ratio('#777777', '#000000'), 4.689, { tol: 0.002 });
LTT.expect('CR 파랑/검정', ratio('#0000ff', '#000000'), 2.444, { tol: 0.002 });
LTT.expect('CR 초록/검정', ratio('#00ff00', '#000000'), 15.304, { tol: 0.002 });
LTT.expect('AA 최옅은 회색', lightest(4.5), 118, { tol: 0 });
LTT.expect('3:1 최옅은 회색', lightest(3), 148, { tol: 0 });
LTT.expect('7:1 최옅은 회색', lightest(7), 89, { tol: 0 });
LTT.expect('APCA #777/흰', apca('#777777', '#ffffff'), 71.1, { tol: 0.1 });
LTT.expect('APCA #777/검정', apca('#777777', '#000000'), -30.6, { tol: 0.1 });
LTT.expect('kit contrast #777/흰', LTT.contrast('#777777', '#ffffff'), 4.478, { tol: 0.01 });

const S = (w, h, inner) => `<svg class="cc-svg" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
const CH = ['#e5484d', '#30a46c', '#3e63dd'];

// 장면 2: hex → 채널 막대
function hexBars() {
  const rows = ['#777777', '#0000FF', '#00FF00'];
  let s = '';
  rows.forEach((h, i) => {
    const y = 20 + i * 110, rgb = rgbOf(h.toLowerCase());
    s += `<rect x="10" y="${y}" width="70" height="70" rx="10" fill="${h}" stroke="var(--ltt-line-2)"/>
      <text x="45" y="${y + 92}" text-anchor="middle" font-size="16" font-weight="700">${h}</text>`;
    ['R', 'G', 'B'].forEach((n, j) => {
      const yy = y + j * 24;
      s += `<text x="104" y="${yy + 16}" font-size="15" font-weight="700">${n}</text>
        <rect x="124" y="${yy + 3}" width="400" height="16" rx="3" fill="var(--ltt-card-2)"/>
        <rect x="124" y="${yy + 3}" width="${rgb[j] / 255 * 400}" height="16" rx="3" fill="${CH[j]}"/>
        <text x="534" y="${yy + 16}" font-size="15">${rgb[j]} <tspan class="mut">(${h.slice(1 + j * 2, 3 + j * 2)})</tspan></text>`;
    });
  });
  return S(640, 350, s + `<text x="124" y="346" font-size="13" class="mut">막대 끝 = 255(FF). 같은 길이의 막대가 같은 밝기를 뜻하는지는 아직 모른다</text>`);
}

// 장면 3 정답 그림·장면 4: 가중치
function weightBar(showCalc) {
  const w = [0.2126, 0.7152, 0.0722], n = ['R 빨강', 'G 초록', 'B 파랑'];
  let x = 20, s = '';
  w.forEach((k, i) => {
    const ww = k * 600;
    s += `<rect x="${x}" y="40" width="${ww}" height="90" fill="${CH[i]}"/>
      <text x="${x + ww / 2}" y="160" text-anchor="middle" font-size="16" font-weight="700">${n[i]}</text>
      <text x="${x + ww / 2}" y="182" text-anchor="middle" font-size="15">${(k * 100).toFixed(1)}%</text>`;
    x += ww;
  });
  s += `<text x="20" y="26" font-size="14" class="mut">흰색(R=G=B=255)의 상대 휘도 1을 세 채널이 나눠 갖는 몫 · 칸 넓이 = 가중치</text>`;
  if (showCalc) s += `<text x="20" y="222" font-size="16">#00FF00 → L = 0.7152 · 1 = <tspan font-weight="700">0.7152</tspan></text>
      <text x="20" y="248" font-size="16">#0000FF → L = 0.0722 · 1 = <tspan font-weight="700">0.0722</tspan></text>
      <text x="20" y="274" font-size="14" class="mut">채널이 255(=1)일 때는 감마를 풀어도 1이라 가중치가 그대로 L이 된다</text>`;
  return S(640, showCalc ? 286 : 196, s);
}

// 장면 5: 감마 곡선 (clock)
function gammaFig(el) {
  const W = 640, H = 380, X = v => 70 + v / 255 * 520, Y = y => 330 - y * 290;
  let pts = []; for (let v = 0; v <= 255; v++) pts.push([X(v), Y(lin(v))]);
  const ticks = [0, 64, 128, 192, 255].map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="330" y2="336" stroke="var(--ltt-line-2)"/><text x="${X(v)}" y="354" font-size="14" text-anchor="middle">${v}</text>`).join('')
    + [0, 0.25, 0.5, 0.75, 1].map(y => `<line x1="64" x2="590" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--ltt-line)"/><text x="58" y="${Y(y) + 5}" font-size="14" text-anchor="end">${y}</text>`).join('');
  el.innerHTML = S(W, H, `${ticks}
    <text x="330" y="376" font-size="14" text-anchor="middle" class="mut">sRGB 신호값 (hex 한 채널, 0–255)</text>
    <text x="70" y="22" font-size="14" class="mut">선형 빛 (0 = 꺼짐, 1 = 최대)</text>
    <path id="g-diag" d="M${X(0)},${Y(0)}L${X(255)},${Y(1)}" stroke="var(--ltt-muted)" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <text x="${X(200)}" y="${Y(200 / 255) - 12}" font-size="14" class="mut" text-anchor="end">신호값에 비례한다면</text>
    <path id="g-curve" fill="none" stroke="var(--ltt-accent)" stroke-width="3"/>
    <g id="g-mark" opacity="0">
      <line x1="${X(128)}" x2="${X(128)}" y1="${Y(128 / 255)}" y2="${Y(lin(128))}" stroke="var(--ltt-warn)" stroke-width="2"/>
      <circle cx="${X(128)}" cy="${Y(128 / 255)}" r="7" fill="var(--ltt-muted)"/>
      <circle cx="${X(128)}" cy="${Y(lin(128))}" r="8" fill="var(--ltt-accent)"/>
      <text x="${X(128) - 12}" y="${Y(128 / 255) - 2}" font-size="15" text-anchor="end">0.502</text>
      <text x="${X(128) + 14}" y="${Y(lin(128)) + 22}" font-size="17" font-weight="700">128 → 0.216</text>
    </g>`);
  const path = el.querySelector('#g-curve'), mark = el.querySelector('#g-mark');
  LTT.clock(el, t => {
    const n = Math.max(2, Math.round(pts.length * Math.min(1, t / 1800)));
    path.setAttribute('d', 'M' + pts.slice(0, n).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'));
    mark.setAttribute('opacity', t >= 1900 ? 1 : 0);
  }, { dur: 2400, id: 'gamma' });
}

// 장면 6: #808080 계산 단계
const P6 = [
  ['신호값', '#808080', 'R = G = B = 80(hex) = 128'],
  ['0–1로', '0.502', '128 ÷ 255'],
  ['감마 풀기', '0.216', '((0.502 + 0.055) ÷ 1.055)<tspan baseline-shift="super" font-size="11">2.4</tspan>'],
  ['상대 휘도', 'L = 0.216', '세 채널이 같아 가중치 합(=1) × 0.216'],
  ['흰 배경과 대비비', '3.95 : 1', '(1.00 + 0.05) ÷ (0.216 + 0.05)'],
];
function pipeFig() {
  let s = '';
  P6.forEach((p, i) => {
    const y = 14 + i * 74;
    s += `<g class="cc-step-box" data-i="${i}">
      <rect x="10" y="${y}" width="620" height="62" rx="10" fill="var(--ltt-card)" stroke="var(--ltt-line-2)"/>
      <text x="28" y="${y + 38}" font-size="15" class="mut">${i + 1}. ${p[0]}</text>
      <text x="230" y="${y + 40}" font-size="22" font-weight="700" class="v">${p[1]}</text>
      <text x="400" y="${y + 38}" font-size="14" class="mut">${p[2]}</text></g>`;
  });
  return S(640, 390, s);
}
// steps 대신 clock: ?shot이 마지막 상태(3.95 강조)를 찍게 한다
function pipeAnim(el) {
  el.innerHTML = pipeFig();
  const boxes = [...el.querySelectorAll('.cc-step-box')];
  LTT.clock(el, t => {
    const k = Math.min(4, Math.floor(t / 900));
    boxes.forEach(g => {
      const j = +g.dataset.i, r = g.querySelector('rect');
      g.style.opacity = j <= k ? 1 : 0.18;
      r.setAttribute('stroke', j === k ? 'var(--ltt-accent)' : 'var(--ltt-line-2)');
      r.setAttribute('stroke-width', j === k ? 3 : 1);
    });
  }, { dur: 4500, id: 'pipe' });
}

// 장면 7: 기준 자
function rulerFig() {
  const X = r => 40 + Math.log(r) / Math.log(21) * 720;
  const tk = [1, 1.5, 2, 3, 4.5, 7, 10, 15, 21];
  let s = `<rect x="${X(3)}" y="70" width="${X(4.5) - X(3)}" height="40" fill="var(--ltt-warn-soft)"/>
    <rect x="${X(4.5)}" y="70" width="${X(7) - X(4.5)}" height="40" fill="var(--ltt-good-soft)"/>
    <rect x="${X(7)}" y="70" width="${X(21) - X(7)}" height="40" fill="var(--ltt-good-soft)" opacity="0.6"/>
    <line x1="${X(1)}" x2="${X(21)}" y1="110" y2="110" stroke="var(--ltt-ink-2)" stroke-width="2"/>`;
  tk.forEach(t => s += `<line x1="${X(t)}" x2="${X(t)}" y1="104" y2="118" stroke="var(--ltt-ink-2)"/><text x="${X(t)}" y="138" font-size="15" text-anchor="middle">${t}</text>`);
  [[3, '3:1 큰 글자 AA', 50, 'end', -6], [4.5, '4.5:1 본문 AA', 50, 'start', 6], [7, '7:1 본문 AAA', 24, 'start', 6]].forEach(([t, l, y, a, dx]) => {
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="${y - 14}" y2="110" stroke="var(--ltt-ink)" stroke-width="2"/>
      <text x="${X(t) + dx}" y="${y}" font-size="15" font-weight="700" text-anchor="${a}">${l}</text>`;
  });
  s += `<circle cx="${X(3.95)}" cy="90" r="9" fill="#808080" stroke="#fff" stroke-width="2"/>
    <text x="${X(3.95)}" y="168" font-size="15" text-anchor="middle">#808080 = 3.95</text>
    <line x1="${X(3.95)}" x2="${X(3.95)}" y1="100" y2="152" stroke="#808080" stroke-dasharray="3 3"/>
    <text x="40" y="196" font-size="13" class="mut">대비비 (로그 눈금: 같은 거리 = 같은 배수) · 1 = 같은 색, 21 = 검정과 흰색</text>`;
  return S(800, 206, s);
}
function sizeSamples() {
  return `<div class="cc-card" style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end">
    <div><div style="font-size:16px;color:#808080">본문 16px</div><div style="font-size:14px;color:#333">본문 → 4.5:1 미달</div></div>
    <div><div style="font-size:18.66px;font-weight:700;color:#808080">굵게 18.66px</div><div style="font-size:14px;color:#333">큰 글자 → 3:1 통과</div></div>
    <div><div style="font-size:24px;color:#808080">보통 24px</div><div style="font-size:14px;color:#333">큰 글자 → 3:1 통과</div></div></div>
    <div class="cc-note" style="margin-top:6px">견본 글자색 = #808080(3.95:1). 비활성 컨트롤의 글자·순수 장식 글자는 기준에서 빠진다(SC 1.4.3 예외).</div>`;
}

// 장면 8: #777 예측
const p8visual = el => {
  el.innerHTML = `<div class="cc-card"><div style="color:#777777;font-size:16px">#777 본문 16px: 보조 설명이 이 색으로 쓰인다면 읽기 어떨까요?</div></div>`;
  el.appendChild(LTT.facts([
    { value: '3.95:1', label: '#808080 (128)의 흰 배경 대비비' },
    { value: '119', label: '#777의 신호값 (128보다 9 낮음)' },
    { value: '4.5:1', label: '본문 AA 기준' },
  ]));
};
const p8answer = el => {
  el.innerHTML = `<div class="cc-calc">
    <div><b>#777</b> 119 → 0.467 → 감마 풀기 <b>0.1845</b> → 1.05 ÷ 0.2345 = <b>4.48 : 1</b> <span class="cc-badge cc-no">본문 미달</span></div>
    <div><b>#767676</b> 118 → 0.463 → 감마 풀기 <b>0.1812</b> → 1.05 ÷ 0.2312 = <b>4.54 : 1</b> <span class="cc-badge cc-ok">본문 통과</span></div></div>`;
};

// 장면 9: 손잡이
function sweepScene(body) {
  body.innerHTML = `<div class="cc-sweep">
    <div>
      <div class="cc-ctrl"><label for="gv">글자 회색 값</label><input type="range" id="gv" min="0" max="255" step="1" value="119"><span id="gv-v" class="cc-val"></span></div>
