<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앵커링 효과</title>
<script type="application/json" id="ltt-meta">{
  "topic": "앵커링 효과: 처음 본 숫자가 추정을 끌어당기는가",
  "audience": "기획자. 인지 편향이라는 말은 알지만 실험 근거는 모른다",
  "theme": "paper",
  "medium": "deck",
  "decision": "가격 제시·협상에서 첫 숫자를 먼저 던질지, 받은 숫자에 어떻게 대응할지",
  "glossary": {
    "중앙값": "값을 크기순으로 늘어놓았을 때 한가운데 값. 극단값 몇 개에 덜 흔들린다.",
    "무작위 배정": "참가자를 동전 던지기처럼 우연으로 그룹에 나누는 것. 그룹 사이 차이가 처치(여기서는 앵커) 말고는 우연뿐이 되게 한다.",
    "비교 질문": "\"X보다 큰가, 작은가?\"처럼 앵커와 비교하게 하는 질문. 앵커링 실험의 첫 질문이다.",
    "절대 추정": "\"그래서 몇인가?\"처럼 값을 직접 말하게 하는 질문. 앵커의 효과는 이 답에서 잰다.",
    "조정": "앵커에서 출발해 맞다고 생각하는 쪽으로 값을 옮겨 가는 과정(anchoring-and-adjustment).",
    "선택적 접근": "selective accessibility. 비교 질문에 답하려고 '대상이 앵커와 비슷하다'는 가설을 검사하는 동안 그 가설에 맞는 지식이 떠오르기 쉬워지고, 이어지는 추정이 그 지식에 기대는 것.",
    "앵커링 지수": "(높은 앵커 그룹 추정 − 낮은 앵커 그룹 추정) ÷ (높은 앵커 − 낮은 앵커). 앵커 차이 중 몇 할이 추정 차이로 옮겨 갔는지. 0이면 영향 없음, 1이면 앵커를 그대로 따름(Jacowitz & Kahneman, 1995).",
    "유보가": "협상에서 이 값을 넘으면(또는 밑돌면) 차라리 결렬을 택하는 한계 가격. reservation price."
  }
}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>

<style>
.fig-svg { width: 100%; height: auto; display: block; max-width: 1040px; margin: 0 auto; }
.fig-svg text { fill: var(--ltt-ink); font-size: 17px; }
.fig-svg .muted { fill: var(--ltt-muted); }
.fig-svg .small { font-size: 16px; }
.fig-svg .big { font-size: 22px; font-weight: 700; }
.fig-svg .lo { fill: var(--ltt-c1); }
.fig-svg .hi { fill: var(--ltt-c2); }
.fig-svg .axis { stroke: var(--ltt-ink-2); stroke-width: 1.5; }

.ctl-val { font-variant-numeric: tabular-nums; min-width: 5.5em; display: inline-block; font-weight: 700; }

<body>
<script>
const NS = "http://www.w3.org/2000/svg";
function svgEl(w, h) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("width", w);
  s.setAttribute("class", "fig-svg");
  return s;
}
function add(parent, tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function lines(parent, x, y, arr, attrs = {}, dy = 19) {
  const t = add(parent, "text", Object.assign({ x, y }, attrs));
  arr.forEach((s, i) => add(t, "tspan", { x, dy: i ? dy : 0 }, s));
  return t;
}
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;

// ---- 수치(outline.md 기대값과 대조) ----
const UN = { lo: 10, hi: 65, estLo: 25, estHi: 45 };
const GANDHI = { lo: 9, hi: 140, estLo: 50, estHi: 67, real: 78 };
const JUDGE = { lo: 3, hi: 9, estLo: 5.28, estHi: 7.81 };
const ai = d => (d.estHi - d.estLo) / (d.hi - d.lo);
LTT.expect("앵커링 지수 UN", ai(UN), 0.3636, { tol: 0.001 });
LTT.expect("앵커링 지수 간디", ai(GANDHI), 0.1298, { tol: 0.001 });
LTT.expect("앵커링 지수 판사", ai(JUDGE), 0.4217, { tol: 0.001 });

const BOIL = { anchor: 100, c: 71 };
const adjustStop = w => Math.max(BOIL.c - w, Math.min(BOIL.c + w, BOIL.anchor));
LTT.expect("조정 모델 w=12 추정", adjustStop(12), 83);
LTT.expect("조정 모델 w=5 추정", adjustStop(5), 76);
LTT.expect("조정 모델 w=20 추정", adjustStop(20), 91);

const EVID = [38, 45, 50, 55, 62, 63, 64, 66, 70, 72];
const SA_STATES = [
  { key: "none", label: "앵커 없음", on: EVID.map(() => true), hyp: "검사하는 가설 없음: 아는 근거를 고루 떠올린다" },
  { key: "lo", label: "9세와 비교", on: EVID.map((_, i) => i < 5), hyp: "검사하는 가설: \"간디는 아주 젊어서 죽었나?\" → 젊은 쪽 근거가 떠오른다" },
  { key: "hi", label: "140세와 비교", on: EVID.map((_, i) => i >= 5), hyp: "검사하는 가설: \"간디는 아주 오래 살았나?\" → 나이 든 쪽 근거가 떠오른다" }
];
const saEstimate = st => mean(EVID.filter((_, i) => st.on[i]));
LTT.expect("선택적 접근 앵커 없음", saEstimate(SA_STATES[0]), 58.5);
LTT.expect("선택적 접근 9세", saEstimate(SA_STATES[1]), 50);
LTT.expect("선택적 접근 140세", saEstimate(SA_STATES[2]), 67);

// ---- 그림: 실험 설계 ----
function designFigure(el) {
  const s = svgEl(1000, 380);
  const laneY = { lo: 120, hi: 280 };
  const cols = [
    { x: 250, head: "① 앵커 보기" },
    { x: 500, head: "② 비교 질문" },
    { x: 750, head: "③ 절대 추정" }
  ];
  const g = {};
  g.assign = add(s, "g");
  add(g.assign, "rect", { x: 10, y: 170, width: 140, height: 60, rx: 8, class: "box" });
  lines(g.assign, 80, 196, ["참가자", "무작위 배정"], { "text-anchor": "middle" });
  add(g.assign, "path", { d: "M150 200 C 180 200, 170 120, 190 120", class: "link" });
  add(g.assign, "path", { d: "M150 200 C 180 200, 170 280, 190 280", class: "link" });
  add(g.assign, "text", { x: 150, y: 110, "text-anchor": "middle", class: "small muted" }, "그룹 A");
  add(g.assign, "text", { x: 150, y: 302, "text-anchor": "middle", class: "small muted" }, "그룹 B");

  g.anchor = add(s, "g");
  cols.forEach(c => add(s, "text", { x: c.x, y: 36, "text-anchor": "middle", class: "small muted" }, c.head));
  add(g.anchor, "rect", { x: 190, y: 50, width: 120, height: 300, rx: 10, fill: "none", stroke: "var(--ltt-accent)", "stroke-width": 2.5, "stroke-dasharray": "6 5" });
  add(g.anchor, "text", { x: 250, y: 372, "text-anchor": "middle", class: "small", fill: "var(--ltt-accent)" }, "두 그룹이 다른 곳은 여기뿐");
  [["lo", 10], ["hi", 65]].forEach(([k, v]) => {
    const y = laneY[k];
    add(g.anchor, "circle", { cx: 250, cy: y, r: 36, fill: "var(--ltt-card)", stroke: k === "lo" ? "var(--ltt-c1)" : "var(--ltt-c2)", "stroke-width": 4 });
    add(g.anchor, "text", { x: 250, y: y + 8, "text-anchor": "middle", class: "big " + k }, String(v));
  });

  g.compare = add(s, "g");
  g.estimate = add(s, "g");
  [["lo", 10], ["hi", 65]].forEach(([k, v]) => {
    const y = laneY[k];
    add(g.compare, "path", { d: `M286 ${y} L400 ${y}`, class: "link" });
    add(g.compare, "rect", { x: 400, y: y - 34, width: 200, height: 68, rx: 8, class: "box" });
    lines(g.compare, 500, y - 7, ["아프리카 국가 비율이", `${v}%보다 큰가, 작은가?`], { "text-anchor": "middle", class: "small" });
    add(g.estimate, "path", { d: `M600 ${y} L650 ${y}`, class: "link" });
    add(g.estimate, "rect", { x: 650, y: y - 34, width: 200, height: 68, rx: 8, class: "box" });
    lines(g.estimate, 750, y - 7, ["그럼 몇 %인가?", "(두 그룹 같은 질문)"], { "text-anchor": "middle", class: "small" });
  });
  g.result = add(s, "g");
  add(g.result, "path", { d: `M850 ${laneY.lo} C 890 ${laneY.lo}, 880 200, 905 200`, class: "link" });
  add(g.result, "path", { d: `M850 ${laneY.hi} C 890 ${laneY.hi}, 880 200, 905 200`, class: "link" });
  add(g.result, "rect", { x: 905, y: 160, width: 90, height: 80, rx: 8, class: "box" });
  lines(g.result, 950, 193, ["두 그룹", "추정 비교"], { "text-anchor": "middle", class: "small" });
  add(g.result, "text", { x: 950, y: 265, "text-anchor": "middle", class: "big" }, "?");
  el.appendChild(s);
  return { el: s, g };
}

// ---- 그림: 수직선 결과(UN·간디) ----
function resultLine(node, d, opt) {
  const s = svgEl(760, 230);
  const x0 = 40, x1 = 720, y = 150;
  const X = v => x0 + (v - opt.min) / (opt.max - opt.min) * (x1 - x0);
  add(s, "line", { x1: x0, x2: x1, y1: y, y2: y, class: "axis" });
  opt.ticks.forEach(t => {
    add(s, "line", { x1: X(t), x2: X(t), y1: y, y2: y + 6, class: "axis" });
    add(s, "text", { x: X(t), y: y + 24, "text-anchor": "middle", class: "small muted" }, t + opt.unit);
  });
  [["lo", d.lo, d.estLo], ["hi", d.hi, d.estHi]].forEach(([k, a, e]) => {
    const col = k === "lo" ? "var(--ltt-c1)" : "var(--ltt-c2)";
    add(s, "circle", { cx: X(a), cy: y, r: 8, fill: "var(--ltt-card)", stroke: col, "stroke-width": 3 });
    add(s, "text", { x: X(a), y: y + 46, "text-anchor": "middle", class: "small " + k }, `앵커 ${a}`);
    add(s, "rect", { x: X(e) - 7, y: 70, width: 14, height: y - 70, fill: col });
    add(s, "text", { x: X(e), y: 60, "text-anchor": "middle", class: "big " + k }, e + opt.unit);
    add(s, "path", { d: `M${X(a)} ${y - 12} Q ${(X(a) + X(e)) / 2} ${y - 40} ${X(e) + (a < e ? -10 : 10)} ${y - 30}`, fill: "none", stroke: col, "stroke-width": 1.6, "stroke-dasharray": "4 3" });
  });
  if (d.real != null) {
    add(s, "line", { x1: X(d.real), x2: X(d.real), y1: 50, y2: y, stroke: "var(--ltt-ink)", "stroke-width": 2, "stroke-dasharray": "5 4" });
    add(s, "text", { x: X(d.real) + 8, y: 46, class: "small" }, `실제 ${d.real}${opt.unit}`);
  }
  add(s, "text", { x: (X(d.estLo) + X(d.estHi)) / 2, y: 30, "text-anchor": "middle", class: "small" }, `차이 ${d.estHi - d.estLo}${opt.unitDiff}`);
  node.appendChild(s);
}

// ---- 그림: 조정 부족 ----
function adjustScene(body) {
  body.innerHTML = `<div class="adj-fig"></div>
  <div class="ctl-row"><label for="w">그럴듯한 범위의 반폭 w (확신이 없을수록 넓다)</label></div>
  <div class="ctl-row">
    <input type="range" id="w" min="3" max="20" step="1" value="12" style="width:200px">
    <span class="ctl-val" id="w-v"></span>
    <button class="ltt-btn" type="button" id="adj-replay" style="white-space:nowrap">다시 재생</button>
  </div>`;
  const s = svgEl(1000, 300);
  add(s, "text", { x: 10, y: 24, class: "small", fill: "var(--ltt-warn)", style: "fill: var(--ltt-warn)" }, "단순화한 설명용 모델");
  body.querySelector(".adj-fig").appendChild(s);
  const x0 = 50, x1 = 950, y = 170, min = 50, max = 110;
  const X = v => x0 + (v - min) / (max - min) * (x1 - x0);
  add(s, "line", { x1: x0, x2: x1, y1: y, y2: y, class: "axis" });
  for (let t = 50; t <= 110; t += 10) {
    add(s, "line", { x1: X(t), x2: X(t), y1: y, y2: y + 6, class: "axis" });
    add(s, "text", { x: X(t), y: y + 26, "text-anchor": "middle", class: "small muted" }, t + "°C");
  }
  const band = add(s, "rect", { y: y - 22, height: 44, fill: "var(--ltt-c1)", opacity: 0.16 });
  const bandL = add(s, "text", { y: y + 56, "text-anchor": "middle", class: "small lo" });
  add(s, "line", { x1: X(BOIL.c), x2: X(BOIL.c), y1: y - 30, y2: y + 30, stroke: "var(--ltt-c1)", "stroke-width": 2 });
  lines(s, X(BOIL.c), y + 82, ["범위 가운데 71°C", "(이 사람의 최선의 짐작 = 실제 약 71°C)"], { "text-anchor": "middle", class: "small" }, 17);
  add(s, "circle", { cx: X(BOIL.anchor), cy: y, r: 9, fill: "var(--ltt-card)", stroke: "var(--ltt-c2)", "stroke-width": 3 });
  lines(s, X(BOIL.anchor), y + 46, ["출발: 해수면 끓는점 100°C", "(스스로 떠올린 앵커)"], { "text-anchor": "middle", class: "small hi" }, 17);
  const trail = add(s, "line", { y1: y - 40, y2: y - 40, stroke: "var(--ltt-c2)", "stroke-width": 3 });
  const head = add(s, "path", { fill: "var(--ltt-c2)" });
  const marker = add(s, "circle", { cy: y, r: 11, fill: "var(--ltt-c2)" });
  const stopLab = add(s, "text", { y: y - 58, "text-anchor": "middle", class: "big hi" });
  const bias = add(s, "g");
  let w = 12, lastT = 2400;
  function draw(t) {
    lastT = t;
    const stop = adjustStop(w);
    band.setAttribute("x", X(BOIL.c - w)); band.setAttribute("width", X(BOIL.c + w) - X(BOIL.c - w));
    bandL.setAttribute("x", X(BOIL.c - w) + 70); bandL.textContent = "";
    const p = Math.min(1, t / 2400);
    const e = 1 - Math.pow(1 - p, 2);
    const v = BOIL.anchor - (BOIL.anchor - stop) * e;
    marker.setAttribute("cx", X(v));
    trail.setAttribute("x1", X(BOIL.anchor)); trail.setAttribute("x2", X(v) + 8);
    head.setAttribute("d", `M${X(v)} ${y - 40} l 12 -7 l 0 14 z`);
    stopLab.setAttribute("x", X(v));
    stopLab.textContent = p >= 1 ? `멈춘 추정 ${stop}°C` : `${v.toFixed(0)}°C …`;
    bias.innerHTML = "";
    if (p >= 1) {
      const yb = y - 100;
      add(bias, "path", { d: `M${X(BOIL.c)} ${yb + 8} L${X(BOIL.c)} ${yb} L${X(stop)} ${yb} L${X(stop)} ${yb + 8}`, fill: "none", stroke: "var(--ltt-bad)", "stroke-width": 2 });
      add(bias, "text", { x: (X(BOIL.c) + X(stop)) / 2, y: yb - 10, "text-anchor": "middle", class: "small", fill: "var(--ltt-bad)" }, `치우침 ${stop - BOIL.c}°C: 범위에 닿자 멈춰 덜 조정됨`);
    }
  }
  const clock = LTT.clock(s, draw, { dur: 2400, id: "adjust" });
  LTT.sweep({
    params: { w: { kind: "range", map: v => +v, fmt: v => `${v}°C`, label: "범위 반폭" } },
    render: vals => { w = vals.w; draw(lastT); }
  });
  body.querySelector("#adj-replay").addEventListener("click", () => {
    LTT.record("replay", { scene: "adjust", w });
    clock.seek(0); clock.play();
  });
  return {};
}

// ---- 그림: 선택적 접근 ----
function saScene(body) {
  body.innerHTML = `<div class="sa-fig"></div>
  <div class="ctl-row">
    <span>비교 질문:</span><div id="anc"></div>
  </div>`;
  const s = svgEl(1000, 320);
  add(s, "text", { x: 10, y: 316, class: "small", style: "fill: var(--ltt-warn)" }, "설명용 근거 10개: 실험 평균(50·67)에 맞춰 고른 값");
  body.querySelector(".sa-fig").appendChild(s);
  const x0 = 60, x1 = 940, y = 160, min = 30, max = 80;
  const X = v => x0 + (v - min) / (max - min) * (x1 - x0);
  add(s, "line", { x1: x0, x2: x1, y1: y, y2: y, class: "axis" });
  for (let t = 30; t <= 80; t += 10) {
    add(s, "line", { x1: X(t), x2: X(t), y1: y, y2: y + 6, class: "axis" });
    add(s, "text", { x: X(t), y: y + 74, "text-anchor": "middle", class: "small muted" }, t + "세");
  }
  const loArrow = add(s, "text", { x: x0 - 6, y: y - 70, class: "small lo" }, "← 앵커 9세 (눈금 밖)");
  const hiArrow = add(s, "text", { x: x1 + 6, y: y - 70, "text-anchor": "end", class: "small hi" }, "앵커 140세 (눈금 밖) →");
  const hyp = add(s, "text", { x: 500, y: 34, "text-anchor": "middle" });
  const dots = EVID.map((v, i) => {
    const c = add(s, "circle", { cx: X(v), cy: y, r: 9 });
    add(s, "text", { x: X(v), y: y + (i === 5 ? 48 : 28), "text-anchor": "middle", class: "small muted" }, v);
    return c;
  });
  const estLine = add(s, "line", { y1: y - 50, y2: y - 12, "stroke-width": 3 });
  const estLab = add(s, "text", { y: y - 58, "text-anchor": "middle", class: "big" });
  const sumLab = add(s, "text", { x: 500, y: 276, "text-anchor": "middle", class: "small" });
  function render(i) {
    const st = SA_STATES[i];
    const col = i === 1 ? "var(--ltt-c1)" : i === 2 ? "var(--ltt-c2)" : "var(--ltt-ink)";
    dots.forEach((c, j) => {
      c.setAttribute("fill", st.on[j] ? col : "var(--ltt-card-2)");
      c.setAttribute("stroke", st.on[j] ? col : "var(--ltt-line-2)");
      c.setAttribute("stroke-width", 1.5);
    });
    loArrow.style.opacity = i === 1 ? 1 : 0.25;
    hiArrow.style.opacity = i === 2 ? 1 : 0.25;
    hyp.textContent = st.hyp;
    const est = saEstimate(st);
    estLine.setAttribute("x1", X(est)); estLine.setAttribute("x2", X(est)); estLine.setAttribute("stroke", col);
    estLab.setAttribute("x", X(est)); estLab.setAttribute("fill", col);
    estLab.textContent = `추정 ${est}세`;
    const on = EVID.filter((_, j) => st.on[j]);
    sumLab.textContent = `추정 = 떠오른 근거의 평균 = (${on.join("+")}) ÷ ${on.length} = ${est}`;
  }
  LTT.sweep({
    params: { anc: { kind: "steps", stops: [0, 1, 2], value: 0, stopLabel: i => SA_STATES[i].label, fmt: i => SA_STATES[i].label } },
    render: vals => render(vals.anc)
  });
  return {};
}
