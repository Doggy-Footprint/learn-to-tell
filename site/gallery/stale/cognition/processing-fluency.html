<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읽기 쉬우면 왜 더 믿게 될까?</title>
<script type="application/json" id="ltt-meta">{"domain":"인지과학","topic":"처리 유창성과 반복에 의한 착각 진실 효과","audience":"agent 출력을 읽고 판단해 본 적이 있다","pattern":["hook","explain","compare","keywords"],"mode":"설명형: 사용자 자신의 편향을 겨냥하므로 체험시키지 않고 연구 사례를 보여 준다","decision":"agent 답변을 믿을지 정할 때 문체·형식이 아닌 검증 가능한 근거로 판단하는 기준"}</script>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .claim { font-size: 15px; text-align: center; line-height: 1.4; }
  .claim.low { color: #b4b9c6; font-size: 13px; }
  .claim.high { color: #000; font-weight: 800; font-size: 17px; }
  .claim.rep { display: grid; gap: 4px; }
  .claim.rep span:nth-child(n+2) { opacity: .55; font-size: 13px; }
  .reply { font-size: 14px; border-left: 4px solid var(--ltt-line); padding: 6px 10px; text-align: left; }
  .reply.slick { border-color: var(--ltt-accent); background: #eef1fd; font-weight: 600; }
  .meter { display: flex; gap: 4px; justify-content: center; }
  .meter i { width: 14px; height: 14px; border-radius: 3px; background: var(--ltt-line); }
  .meter i.on { background: var(--ltt-accent); }
</style>
</head>
<body>
<script>
  const meter = (k, of = 5) => `<div class="meter">${Array.from({ length: of }, (_, i) => `<i class="${i < k ? "on" : ""}"></i>`).join("")}</div>`;
  const CORE = "사용자 수가 늘면 서버 비용도 함께 늘어난다.";

  LTT.deck({
    title: "읽기 쉬우면 왜 더 믿게 될까?",
    scenes: [
      { type: "hook", art: "🪞",
        text: "매끈하게 쓴 답은 <u>맞아 보인다</u>.<br>그런데 '맞아 보임'은 내용이 아니라 읽기 편했다는 신호다.",
        sub: "agent 답변·문서를 믿을지 정할 때 이 착시를 아는 것만으로 확인 순서가 바뀐다." },

      { type: "explain", kicker: "원리", title: "뇌는 '읽기 쉬움'을 '참'으로 착각한다",
        steps: [
          { icon: "👀", title: "읽는다", text: "선명한 글씨, 익숙한 표현, 이미 본 문장은 빨리 처리된다." },
          { icon: "⚡", title: "쉽다는 느낌", text: "처리 속도 자체가 하나의 느낌(유창성)으로 남는다." },
          { icon: "✅", title: "참이라고 판단", text: "그 느낌의 출처를 따지지 않고 '익숙하니 맞겠지'로 읽는다." },
        ] },

      { type: "compare", kicker: "연구 사례", title: "같은 문장, 모양만 바꿨을 때 사람들의 판단",
        sub: "실험 참가자들이 본 것을 재현했다. 네 카드의 내용은 모두 같다.",
        items: [
          { label: "흐린 글씨", visual: `<div class="claim low">${CORE}</div>`, tone: "bad", verdict: "덜 참이라고 판단",
            noteAfter: true, note: "Reber & Schwarz 1999: 대비가 낮으면 참 판단이 줄었다." },
          { label: "선명한 글씨", visual: `<div class="claim high">${CORE}</div>`, tone: "good", verdict: "더 참이라고 판단",
            noteAfter: true, note: "같은 연구: 대비만 높였는데 참 판단이 늘었다." },
          { label: "여러 번 본 문장", visual: `<div class="claim rep"><span>${CORE}</span><span>${CORE}</span><span>${CORE}</span></div>`, tone: "good", verdict: "더 타당하다고 평가",
            noteAfter: true, note: "Hasher 외 1977: 반복 노출만으로 타당 평가가 올랐다. 거짓 문장에서도." },
          { label: "전문 용어로 포장", visual: `<div class="claim"><i>사용자 집단의 확장은 서버 자원 소비의 증분적 상승을 수반한다.</i></div>`, tone: "warn", verdict: "'심오하다' 평가, 개인차 큼",
            noteAfter: true, note: "Pennycook 외 2015: 그럴듯한 용어 나열을 심오하게 보는 경향." },
        ],
        basis: "효과 크기는 과제마다 달라 숫자를 싣지 않았다. 모두 여러 사람의 평균에서 나온 경향이다." },

      { type: "compare", kicker: "내 작업에서", title: "agent 답 세 개 중 무엇을 더 믿어야 할까?",
        sub: "질문: \"이 마이그레이션을 운영 중에 돌려도 되나?\"",
        revealLabel: "근거 개수 보기",
        items: [
          { label: "거친 초안", visual: `<div class="reply">음, 락 안 잡는 것 같음. 아마 괜찮을 듯?</div>`, tone: "warn",
            verdict: "확인한 근거 0건", note: `확신 느낌 ${meter(1)}` },
          { label: "매끈한 전문가 어조", visual: `<div class="reply slick">본 마이그레이션은 비차단 온라인 스키마 변경으로 설계되어 무중단 적용이 가능함을 확인했습니다.</div>`, tone: "bad",
            verdict: "확인한 근거 0건", note: `확신 느낌 ${meter(5)}` },
          { label: "근거를 붙인 답", visual: `<div class="reply">스테이징에서 <code>EXPLAIN</code>과 락 모니터로 확인: <code>ACCESS EXCLUSIVE</code> 없음. 로그 첨부.</div>`, tone: "good",
            verdict: "확인한 근거 2건", note: `확신 느낌 ${meter(3)}` },
        ],
        basis: "확신 느낌 막대는 방향만 보인 그림이다(측정값 아님). 앞의 두 답은 문체만 다르고 근거는 똑같이 없다." },

      { type: "explain", kicker: "실전 습관", title: "읽는 순서를 뒤집는다", arrows: true,
        steps: [
          { icon: "🔍", title: "근거부터 찾기", text: "실행 결과, 로그, 출처 링크, 재현 방법이 있는가?" },
          { icon: "🧪", title: "없으면 요청", text: "\"어떻게 확인했나? 명령과 출력 보여줘\"라고 되묻는다." },
          { icon: "📝", title: "문체는 마지막", text: "매끈함은 가산점이 아니다. 거친 답도 맞을 수 있다." },
        ] },

      { type: "keywords", title: "다음에 비슷한 걸 만나면",
        terms: [
          { ko: "처리 유창성", en: "processing fluency" },
          { ko: "착각 진실 효과", en: "illusory truth effect" },
        ],
        signals: [
          "근거 없이 \"확인했습니다\"라는 말에 안심이 될 때",
          "같은 주장을 여러 곳에서 봤다는 이유로 믿게 될 때",
          "용어가 어려워 반박하기 귀찮을 때",
        ],
        queries: ["processing fluency truth judgment", "illusory truth effect repetition", "pseudo-profound bullshit receptivity", "LLM overconfidence verification"],
        neighbors: [
          { term: "확증 편향", diff: "믿고 싶은 쪽 근거만 찾는 것. 유창성은 근거와 무관하게 '느낌'이 판단을 바꾼다." },
          { term: "권위 편향", diff: "말한 사람의 지위를 믿는 것. 유창성은 말의 모양을 믿는 것." },
        ] },
    ],
  });
</script>
</body>
</html>
