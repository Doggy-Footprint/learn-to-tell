<script>
(function () {
  // ---------- 모델 ----------
  // 요청 전 핸드셰이크 왕복 수 H. 첫 응답 = (H + 1) × RTT.
  var PROTO = {
    t12:  { l: "TCP + TLS 1.2",        segs: ["TCP", "TLS", "TLS"] },
    t13:  { l: "TCP + TLS 1.3",        segs: ["TCP", "TLS"] },
    t13z: { l: "TCP + TLS 1.3 0-RTT",  segs: ["TCP"] },
    q1:   { l: "QUIC (1-RTT)",         segs: ["QUIC+TLS"] },
    q0:   { l: "QUIC 0-RTT",           segs: [] }
  };
  function respMs(p, rtt) { return (PROTO[p].segs.length + 1) * rtt; }

  // 패킷 i(1..12)의 스트림. L이 빠지면 뒤 패킷이 재전송 1 RTT를 기다린다.
  var STREAMS = ["A", "B", "C"], SNAME = { A: "HTML", B: "CSS", C: "이미지" };
  function streamOf(i) { return STREAMS[(i - 1) % 3]; }
  function held(t, L) {
    var out = [];
    for (var i = L + 1; i <= 12; i++) if (t === "tcp" || streamOf(i) === streamOf(L)) out.push(i);
    return out;
  }
  function otherHeld(t, L) { return held(t, L).filter(function (i) { return streamOf(i) !== streamOf(L); }).length; }

  // ---------- 기대값 (독립 계산과 대조) ----------
  LTT.expect("TCP+TLS1.2 @200ms", respMs("t12", 200), 800);
  LTT.expect("TCP+TLS1.3 @300ms", respMs("t13", 300), 900);
  LTT.expect("TCP+TLS1.3 0-RTT @100ms", respMs("t13z", 100), 200);
  LTT.expect("QUIC 1-RTT @200ms", respMs("q1", 200), 400);
  LTT.expect("QUIC 0-RTT @20ms", respMs("q0", 20), 20);
  var cells = 0;
  Object.keys(PROTO).forEach(function (p) { [20, 50, 100, 200, 300].forEach(function (r) { if (r >= 100 && respMs(p, r) <= 300) cells++; }); });
  LTT.expect("목표 만족 칸 수", cells, 6);
  LTT.expect("TCP L=3 같은 스트림 대기", held("tcp", 3).length - otherHeld("tcp", 3), 3);
  LTT.expect("TCP L=3 다른 스트림 대기", otherHeld("tcp", 3), 6);
  LTT.expect("TCP L=5 다른 스트림 대기", otherHeld("tcp", 5), 5);
  LTT.expect("TCP L=9 다른 스트림 대기", otherHeld("tcp", 9), 2);
  LTT.expect("QUIC L=1 같은 스트림 대기", held("quic", 1).length, 3);
  LTT.expect("QUIC L=5 다른 스트림 대기", otherHeld("quic", 5), 0);

  // ---------- 그림 도우미 ----------
  function svgIn(el) { var s = d3.select(el).append("svg"); return s.node(); }
  var ACT = [{ id: "c", l: "브라우저", icon: "monitor" }, { id: "s", l: "서버", icon: "server" }];
  function A(id, f, t, l, k) { return { id: id, f: f, t: t, l: l, kind: "async", k: k }; }
  var SEQ = {
    t12: { items: [A("syn", "c", "s", "SYN"), A("synack", "s", "c", "SYN-ACK"),
      A("ch", "c", "s", "ACK · ClientHello"), A("sh", "s", "c", "ServerHello · Certificate · ServerKeyExchange · Done"),
      A("cke", "c", "s", "ClientKeyExchange · Finished"), A("sf", "s", "c", "Finished"),
      A("get", "c", "s", "GET /", "accent"), A("ok", "s", "c", "200 OK", "accent")],
      spans: [{ from: "syn", to: "synack", l: "TCP" }, { from: "ch", to: "sh", l: "TLS ①" }, { from: "cke", to: "sf", l: "TLS ②" }, { from: "get", to: "ok", l: "요청", k: "accent" }] },
    t13: { items: [A("syn", "c", "s", "SYN"), A("synack", "s", "c", "SYN-ACK"),
      A("ch", "c", "s", "ACK · ClientHello + key_share"), A("sh", "s", "c", "ServerHello + key_share · {Certificate · Finished}"),
      A("get", "c", "s", "{Finished} · GET /", "accent"), A("ok", "s", "c", "200 OK", "accent")],
      spans: [{ from: "syn", to: "synack", l: "TCP" }, { from: "ch", to: "sh", l: "TLS" }, { from: "get", to: "ok", l: "요청", k: "accent" }] },
    q1: { items: [A("ch", "c", "s", "Initial[ClientHello + key_share]"), A("sh", "s", "c", "Initial[ServerHello] · Handshake[Certificate · Finished]"),
      A("get", "c", "s", "Handshake[Finished] · 1-RTT[GET /]", "accent"), A("ok", "s", "c", "1-RTT[200 OK]", "accent")],
      spans: [{ from: "ch", to: "sh", l: "QUIC+TLS" }, { from: "get", to: "ok", l: "요청", k: "accent" }] },
    q0: { items: [A("ch", "c", "s", "Initial[ClientHello + PSK] · 0-RTT[GET /]", "accent"), A("sh", "s", "c", "Initial[ServerHello] · Handshake[Finished] · 1-RTT[200 OK]", "accent"),
      A("fin", "c", "s", "Handshake[Finished]")],
      spans: [{ from: "ch", to: "sh", l: "요청", k: "accent" }] }
  };
  function drawSeq(holder, key) {
    holder.replaceChildren();
    var sv = svgIn(holder);
    var sp = SEQ[key];
    return LTT.sequence(sv, { actors: ACT, items: sp.items, spans: sp.spans, col: 380, row: 38, actorW: 160, label: PROTO[key].l + " 시퀀스" });
  }

  // 작은 RTT 그림 (terms)
  function rttMini(el) {
    el.innerHTML = "<svg viewBox='0 0 220 110' class='ltt-svg'><line x1='30' y1='10' x2='30' y2='100' stroke='var(--ltt-line-2)'/><line x1='190' y1='10' x2='190' y2='100' stroke='var(--ltt-line-2)'/>" +
      "<path d='M30 30 L186 50' stroke='var(--ltt-ink-2)' fill='none' stroke-width='1.6'/><path d='M190 58 L34 80' stroke='var(--ltt-ink-2)' fill='none' stroke-width='1.6'/>" +
      "<path d='M182 46 L190 51 L181 54Z M38 76 L30 81 L39 84Z' fill='var(--ltt-ink-2)'/>" +
      "<path d='M16 30 H10 V80 H16' stroke='var(--ltt-accent)' fill='none' stroke-width='2'/><text x='6' y='60' fill='var(--ltt-accent)' font-size='12' text-anchor='end' font-family='var(--ltt-mono)'></text>" +
      "<text x='30' y='8' fill='var(--ltt-muted)' font-size='11' text-anchor='middle'>나</text><text x='190' y='8' fill='var(--ltt-muted)' font-size='11' text-anchor='middle'>서버</text>" +
      "<text x='110' y='104' fill='var(--ltt-accent)' font-size='12' text-anchor='middle' font-family='var(--ltt-mono)'>갔다 오는 시간 = 1 RTT</text></svg>";
  }
  function pk(head, fields) {
    return "<div class='pk'><span class='h'>" + head + "</span>" + fields.map(function (f) {
      return "<span class='f" + (f[1] ? " " + f[1] : "") + "'>" + f[0] + "</span>";
    }).join("") + "</div>";
  }
  function streamsMini(el) {
    var c = ["var(--ltt-c1)", "var(--ltt-c2)", "var(--ltt-c3)"], mk = ["square", "ring", "diamond"], s = "<svg viewBox='0 0 240 96' class='ltt-svg'>";
    s += "<path d='M10 40 H230' stroke='var(--ltt-line-2)' stroke-width='26' stroke-opacity='.35'/><text x='120' y='14' font-size='11' fill='var(--ltt-muted)' text-anchor='middle'>연결 하나 (한 줄의 선)</text>";
    for (var j = 0; j < 9; j++) s += "<g transform='translate(" + (24 + j * 24) + ",40)'>" + LTT.mark(mk[j % 3], { size: 11, color: c[j % 3] }) + "</g>";
    ["HTML", "CSS", "이미지"].forEach(function (n, k) { s += "<g transform='translate(" + (40 + k * 76) + ",78)'>" + LTT.mark(mk[k], { size: 10, color: c[k] }) + "</g><text x='" + (50 + k * 76) + "' y='82' font-size='11' fill='var(--ltt-ink-2)'>" + n + "</text>"; });
    el.innerHTML = s + "</svg>";
  }
  function holMini(el) {
    var s = "<svg viewBox='0 0 240 70' class='ltt-svg'><path d='M10 35 H230' stroke='var(--ltt-line-2)' stroke-width='26' stroke-opacity='.35'/>";
    for (var j = 0; j < 6; j++) {
      var x = 30 + j * 34;
      if (j === 0) s += "<g transform='translate(" + x + ",35)'>" + LTT.mark("cross", { size: 16, color: "var(--ltt-bad)", weight: 3 }) + "</g>";
      else s += "<rect x='" + (x - 9) + "' y='26' width='18' height='18' rx='2' fill='var(--ltt-warn-soft)' stroke='var(--ltt-warn)'/>";
    }
    s += "<text x='30' y='66' font-size='11' fill='var(--ltt-bad)' text-anchor='middle'>빠짐</text><text x='150' y='66' font-size='11' fill='var(--ltt-warn)' text-anchor='middle'>뒤는 전부 대기</text></svg>";
    el.innerHTML = s;
  }

  // ---------- 장면 ----------
  var scenes = [];

  scenes.push({
    type: "hook", art: "network", pre: "TLS 1.3 · 전송 계층 · 웹 성능",
    text: "HTTPS 요청은 데이터보다 인사가 먼저다. 그 인사를 줄인 것이 TLS 1.3과 {{QUIC}}이다.",
    sub: "끝나면 말할 수 있는 것: 서비스에 {{HTTP/3}}(QUIC 위의 HTTP)와 재방문 즉시 전송을 켤지, 켠다면 어떤 요청과 어떤 망에 켤지, 그 조건.",
    chips: ["핸드셰이크 왕복 수", "재방문 즉시 전송의 대가", "손실과 멈춤", "IP가 바뀔 때"]
  });

  scenes.push({
    type: "terms", kicker: "용어 둘", title: "속도는 '몇 번 갔다 왔나'로 센다",
    terms: [
      { key: "RTT", word: "RTT", en: "round-trip time", visual: rttMini,
        plain: "패킷 하나가 서버까지 갔다가 답이 돌아오기까지의 시간. 서울↔도쿄 30ms 안팎, 서울↔미국 동부 180ms 안팎처럼 거리와 망이 정한다.",
        example: "핸드셰이크가 2번 왕복이면 RTT 200ms 망에서 400ms가 인사에만 든다." },
      { key: "key share", word: "key share", en: "key_share", visual: pk("ClientHello", [["version: TLS 1.3"], ["cipher_suites: …"], ["key_share: x25519 공개값", "hot"]]),
        plain: "Diffie-Hellman 키 합의에 쓰는 내 쪽 공개값. 서로 상대의 key share를 받으면 각자 같은 비밀 키를 계산할 수 있다.",
        example: "TLS 1.3 클라이언트는 첫 메시지에 이 값을 미리 넣는다." }
    ]
  });

  scenes.push({
    type: "predict", kicker: "짐작 1", title: "QUIC은 요청 전에 몇 번 왕복할까",
    question: "TCP + TLS 1.3은 새 연결에서 요청을 보내기 전 {{RTT}} 2번이 든다(TCP 1 + TLS 1). QUIC은 UDP 위에서 돈다. 새 연결이라면 요청 전 몇 번 왕복할까?",
    visual: LTT.facts([{ icon: "network", value: "UDP", label: "QUIC이 올라타는 전송" }, { icon: "lock", value: "TLS 1.3", label: "QUIC이 쓰는 암호 핸드셰이크" }, { icon: "timer", value: "2 RTT", label: "TCP + TLS 1.3, 새 연결" }]),
    choices: [
      { id: "two", text: "2번. 암호 핸드셰이크는 따로 1번 더 해야 한다" },
      { id: "one", text: "1번. 전송 연결과 TLS 핸드셰이크를 한 번에 한다" },
      { id: "zero", text: "0번. UDP라 연결 맺기가 없다" }
    ],
    answer: "one",
    why: "UDP에 연결 맺기가 없어도, 키를 합의하려면 {{key share}}를 주고받는 왕복 1번은 꼭 필요하다. QUIC은 이 TLS 1.3 왕복이 곧 연결 맺기가 되도록 둘을 같은 패킷에 싣는다. 0번 왕복은 전에 접속한 적이 있을 때만 가능하다(다음 장면 마지막 단계).",
    answerVisual: pk("새 연결의 첫 왕복", [["→ Initial[ClientHello + key_share]", "hot"], ["← Initial[ServerHello] · Handshake[…]", "hot"], ["→ 1-RTT[GET /]  ← 여기서 요청"]])
  });

  scenes.push({
    type: "figure", kicker: "주 그림", title: "왕복이 한 줄씩 사라진다: 3 → 2 → 1 → 0",
    figure: function (pic) {
      var w = LTT.h("div", "seqwrap"); pic.appendChild(w);
      var api = { el: w, cur: null };
      return api;
    },
    steps: [
      { caption: "<b>TCP + TLS 1.2.</b> TCP 1번, TLS 2번을 왕복한 뒤에야 GET을 보낸다. 요청 전 3 RTT. 왼쪽 괄호가 왕복 한 번이다.", enter: function (k, api) { drawSeq(api.el, "t12").show(null); } },
      { caption: "<b>TCP + TLS 1.3.</b> ClientHello에 key_share를 미리 실어 TLS가 1번으로 줄었다. 요청 전 2 RTT. TCP 왕복 1번은 그대로 남는다.", enter: function (k, api) { drawSeq(api.el, "t13").show(null); } },
      { caption: "<b>QUIC.</b> TCP 핸드셰이크가 따로 없다. 전송 연결 정보와 TLS 1.3 메시지를 같은 패킷(Initial)에 실어 1번에 끝낸다. 요청 전 1 RTT.", enter: function (k, api) { drawSeq(api.el, "q1").show(null); } },
      { caption: "<b>QUIC 0-RTT.</b> 전에 접속하며 받은 재개 키({{PSK}})가 있으면 첫 패킷에 GET을 같이 싣는다. 요청 전 0 RTT. TCP + TLS 1.3도 0-RTT를 쓸 수 있지만 TCP 왕복 1번은 남아 요청 전 1 RTT다. 이 첫 데이터에는 대가가 있다(7·8장).", enter: function (k, api) { drawSeq(api.el, "q0").show(null); } }
    ],
    caption: "같은 브라우저와 서버, 같은 GET 하나. 위에서 아래로 시간이 흐르고, 강조색 화살표가 실제 요청과 응답이다. {…}는 이미 암호화된 부분. Initial·Handshake·0-RTT·1-RTT는 QUIC 패킷 종류로, 어느 단계의 키로 암호화했는지를 뜻한다.",
    takeaway: "새 연결에서 요청 전 왕복은 TCP+TLS 1.2가 3번, TCP+TLS 1.3이 2번, QUIC이 1번, 재방문 QUIC 0-RTT가 0번이다.",
    recall: "새 연결에서 TCP+TLS 1.3과 QUIC은 요청 전에 각각 몇 번 왕복하나? 0번이 되는 조건은?",
    ask: "우리 서비스 사용자의 RTT 분포(p50·p95)와 재방문 비율은 어떻게 되나?",
    basis: "근거: RFC 8446 §2, RFC 9000 §7, RFC 9001 §4. 전제: TCP Fast Open·TLS False Start 없음, QUIC Retry 없음, 서버 첫 응답이 증폭 한도(받은 바이트의 3배) 안에 들어감. 인증서 체인이 크면 QUIC도 1번 더 걸릴 수 있다."
  });

  scenes.push({
    type: "explain", form: "stack", kicker: "TLS 1.3의 수", title: "TLS 1.3은 서버가 고를 그룹을 '추측'해서 한 번을 줄인다",
    steps: [
