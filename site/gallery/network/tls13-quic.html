<!doctype html>

<title>TLS 1.3과 QUIC — 왕복을 세면 HTTP/3가 보인다</title>
<script type="application/json" id="ltt-meta">{
 "topic": "TLS 1.3과 QUIC: 핸드셰이크 왕복 수와 HOL blocking",
 "audience": "HTTPS 인증서 설정을 해 본 웹 백엔드 개발자",
 "theme": "spec",
 "medium": "deck",
 "decision": "서비스에 HTTP/3를 켤지",
 "glossary": {
  "key_share": "키 교환에 쓰는 클라이언트·서버의 공개 값. TLS 1.3에서는 클라이언트가 ClientHello에 미리 싣는다(RFC 8446 §4.2.8).",
  "PSK": "Pre-Shared Key. 지난 연결에서 서버가 준 재개 티켓에서 나온 비밀 값. 다음 연결에서 인증서 교환 없이 키를 만든다.",
  "early data": "0-RTT 데이터. PSK로 만든 키로 ClientHello와 같은 flight에 실어 보내는 애플리케이션 데이터.",
  "replay": "재전송 공격. 공격자가 가로챈 메시지를 복사해 서버에 다시 보내는 것. 0-RTT 데이터는 이것을 막지 못한다(RFC 8446 §8).",
  "멱등": "같은 요청을 여러 번 실행해도 결과가 한 번 실행한 것과 같은 성질. 예: GET 조회. 결제 POST는 멱등이 아니다.",
  "스트림": "한 연결 안에서 요청·응답 하나가 오가는 독립된 순서 있는 통로. HTTP/2·HTTP/3는 한 연결에 여러 스트림을 섞는다.",
  "멀티플렉싱": "한 연결 위에 여러 스트림의 데이터를 번갈아 섞어 보내는 것.",
  "HOL blocking": "Head-of-line blocking. 줄 맨 앞이 막히면 뒤의 것이 준비돼도 함께 기다리는 현상.",
  "Alt-Svc": "서버가 '같은 서비스를 다른 프로토콜·포트로도 제공한다'고 알리는 HTTP 헤더(RFC 7838). 예: alt-svc: h3=\":443\".",
  "QUIC": "UDP 위에서 연결 설정·순서·재전송·암호화를 함께 하는 전송 프로토콜(RFC 9000). HTTP/3가 이 위에서 돈다.",
  "UDP": "연결·순서·재전송 없이 데이터그램을 보내는 전송 프로토콜. QUIC은 UDP 위에서 연결·순서·재전송을 직접 구현한다.",
  "CRYPTO 프레임": "QUIC 패킷 안에서 TLS 핸드셰이크 메시지를 나르는 칸(RFC 9001 §4)."
 }

</head><body>
<script>
const SVG = "http://www.w3.org/2000/svg";
const PX = 64; // 1 RTT의 세로 높이. 모든 사다리 그림이 같은 축척을 쓴다.
const STYLE = {
  tcp: { c: "var(--ltt-ink-2)", w: 1.6, d: "" },
  tls: { c: "var(--ltt-c2)", w: 2.2, d: "7 4" },
  data: { c: "var(--ltt-accent)", w: 3.4, d: "" },
};
const mk = (tag, a, p) => { const e = document.createElementNS(SVG, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, x, y, s, a = {}) => { const t = mk("text", Object.assign({ x, y }, a), p); t.textContent = s; return t; };
const clamp = (v) => Math.max(0, Math.min(1, v));

// ---- 수치 모델: 첫 응답 바이트까지 왕복 수 ----
const ROUNDS = {
  tls12: { name: "TCP + TLS 1.2", seg: [["TCP", 1, "tcp"], ["TLS", 2, "tls"], ["요청", 1, "data"]] },
  tls13: { name: "TCP + TLS 1.3", seg: [["TCP", 1, "tcp"], ["TLS", 1, "tls"], ["요청", 1, "data"]] },
  tls13z: { name: "TCP + TLS 1.3 0-RTT", seg: [["TCP", 1, "tcp"], ["요청", 1, "data"]] },
  quic: { name: "QUIC (HTTP/3)", seg: [["QUIC+TLS", 1, "tls"], ["요청", 1, "data"]] },
  quicz: { name: "QUIC 0-RTT", seg: [["요청", 1, "data"]] },
};
const rounds = (k) => ROUNDS[k].seg.reduce((a, s) => a + s[1], 0);
const firstByte = (k, rtt) => rounds(k) * rtt;
const gapMs = (rtt) => firstByte("tls12", rtt) - firstByte("quicz", rtt);

// ---- 메시지 사다리 ----
const M = {
  tls12: [
    { f: "c", t: 0, l: "SYN", k: "tcp" }, { f: "s", t: .5, l: "SYN-ACK", k: "tcp" },
    { f: "c", t: 1, l: "ACK, ClientHello (암호 목록)", k: "tls" },
    { f: "s", t: 1.5, l: "ServerHello, Certificate, ServerHelloDone", k: "tls" },
    { f: "c", t: 2, l: "ClientKeyExchange, Finished", k: "tls" },
    { f: "s", t: 2.5, l: "Finished", k: "tls" },
    { f: "c", t: 3, l: "GET /", k: "data" }, { f: "s", t: 3.5, l: "200 OK", k: "data" }],
  tls13: [
    { f: "c", t: 0, l: "SYN", k: "tcp" }, { f: "s", t: .5, l: "SYN-ACK", k: "tcp" },
    { f: "c", t: 1, l: "ACK, ClientHello + key_share", k: "tls" },
    { f: "s", t: 1.5, l: "ServerHello + key_share, {Certificate, Finished}", k: "tls" },
    { f: "c", t: 2, l: "{Finished}, {GET /}", k: "data" }, { f: "s", t: 2.5, l: "{200 OK}", k: "data" }],
  tls13z: [
    { f: "c", t: 0, l: "SYN", k: "tcp" }, { f: "s", t: .5, l: "SYN-ACK", k: "tcp" },
    { f: "c", t: 1, l: "ACK, ClientHello + PSK, {GET /}", k: "data" },
    { f: "s", t: 1.5, l: "ServerHello, {Finished}, {200 OK}", k: "data" }],
  quic: [
    { f: "c", t: 0, l: "Initial: ClientHello + key_share", k: "tls" },
    { f: "s", t: .5, l: "ServerHello, {Certificate, Finished}", k: "tls" },
    { f: "c", t: 1, l: "{Finished}, {GET /}", k: "data" }, { f: "s", t: 1.5, l: "{200 OK}", k: "data" }],
  quicz: [
    { f: "c", t: 0, l: "ClientHello + PSK, {GET /}", k: "data" },
    { f: "s", t: .5, l: "ServerHello, {Finished}, {200 OK}", k: "data" }],
};
const SPANS = {
  tls12: [{ a: 0, b: 1, l: "TCP 1 RTT" }, { a: 1, b: 3, l: "TLS 2 RTT" }, { a: 3, b: 4, l: "요청 1 RTT" }],
  tls13: [{ a: 0, b: 1, l: "TCP 1 RTT" }, { a: 1, b: 2, l: "TLS 1 RTT" }, { a: 2, b: 3, l: "요청 1 RTT" }],
  tls13z: [{ a: 0, b: 1, l: "TCP 1 RTT" }, { a: 1, b: 2, l: "TLS+요청 1 RTT" }],
  quic: [{ a: 0, b: 1, l: "QUIC+TLS 1 RTT" }, { a: 1, b: 2, l: "요청 1 RTT" }],
  quicz: [{ a: 0, b: 1, l: "TLS+요청 1 RTT" }],
};

function ladderSize(o) { const P = PX * (o.mini ? .5 : 1); const top = o.title ? 62 : 36;
  return { w: (o.mini ? 26 : 84) + o.gap + (o.mini ? 26 : 150), h: top + o.tmax * P + (o.mini ? 26 : 40) }; }
function ladderG(g, o) {
  const P = PX * (o.mini ? .5 : 1), L = o.x0 + (o.mini ? 26 : 84), R = L + o.gap, top = o.title ? 62 : 36;
  const y = (t) => top + t * P;
  const fs = o.mini ? 12 : 14;
  if (o.title) tx(g, (L + R) / 2, 20, o.title, { "text-anchor": "middle", "font-weight": 700, "font-size": o.mini ? 14 : 16 });
  tx(g, L, top - 14, "클라이언트", { "text-anchor": "middle", "font-size": fs, class: "mut" });
  tx(g, R, top - 14, "서버", { "text-anchor": "middle", "font-size": fs, class: "mut" });
  [L, R].forEach((x) => mk("line", { x1: x, y1: top - 6, x2: x, y2: y(o.tmax) + 6, stroke: "var(--ltt-line-2)", "stroke-width": 2 }, g));
  if (!o.mini) for (let r = 0; r <= o.tmax; r++) {
    mk("line", { x1: L, y1: y(r), x2: R, y2: y(r), stroke: "var(--ltt-line)", "stroke-dasharray": "2 5" }, g);
    tx(g, L - 10, y(r) + 4, r ? r + " RTT" : "0", { "text-anchor": "end", "font-size": 12, class: "mut" });
  }
  const parts = o.msgs.map((m) => {
    const st = STYLE[m.k], x1 = m.f === "c" ? L : R, x2 = m.f === "c" ? R : L, y1 = y(m.t), y2 = y(m.t + .5);
    const ln = mk("line", { x1, y1, x2: x1, y2: y1, stroke: st.c, "stroke-width": st.w, "stroke-dasharray": st.d }, g);
    const hd = mk("path", { d: "M0,0 L-11,-5.5 L-11,5.5 Z", fill: st.c, opacity: 0 }, g);
    const la = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI, ta = la > 90 ? la - 180 : la < -90 ? la + 180 : la;
    const mx = (L + R) / 2, my = (y1 + y2) / 2;
    const lb = o.mini ? null : tx(g, mx, my - 7, m.l, { "text-anchor": "middle", "font-size": 14, class: "halo", transform: `rotate(${ta} ${mx} ${my})` });
    return { m, x1, x2, y1, y2, ln, hd, lb, ang: Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI };
  });
  const spans = o.mini ? [] : (o.spans || []).map((s) => {
    const sg = mk("g", { opacity: 0 }, g), x = R + 14;
    mk("path", { d: `M${x},${y(s.a) + 3} h7 V${y(s.b) - 3} h-7`, fill: "none", stroke: "var(--ltt-ink-2)", "stroke-width": 1.4 }, sg);
    tx(sg, x + 14, (y(s.a) + y(s.b)) / 2 + 5, s.l, { "font-size": 13 });
    return { s, sg };
  });
  const rg = mk("g", { opacity: 0 }, g);
  mk("circle", { cx: L, cy: y(o.resp), r: o.mini ? 5 : 7, fill: "var(--ltt-accent)" }, rg);
  tx(rg, L + 12, y(o.resp) + (o.mini ? 18 : 24), `첫 응답 ${o.resp} RTT`, { "font-size": o.mini ? 14 : 17, "font-weight": 700, class: "acc" });
  return (tr) => {
    parts.forEach((p) => {
      const f = clamp((tr - p.m.t) / .5), x = p.x1 + (p.x2 - p.x1) * f, yy = p.y1 + (p.y2 - p.y1) * f;
      p.ln.setAttribute("x2", x); p.ln.setAttribute("y2", yy);
      p.hd.setAttribute("transform", `translate(${x},${yy}) rotate(${p.ang})`); p.hd.setAttribute("opacity", f > .02 ? 1 : 0);
      if (p.lb) p.lb.setAttribute("opacity", f > 0 ? 1 : 0);
    });
    spans.forEach((s) => s.sg.setAttribute("opacity", tr > s.s.a ? 1 : 0));
    rg.setAttribute("opacity", tr >= o.resp - 1e-9 ? 1 : 0);
  };
}
function stackG(g, x0, y0, unknown) {
  const rh = 40, gp = 6, cw = 190;
  const col = (cx, title, rows) => {
    tx(g, cx + cw / 2, y0 + 14, title, { "text-anchor": "middle", "font-weight": 700, "font-size": 15 });
    rows.forEach(([l, r0, n, k, inner]) => {
      const yy = y0 + 26 + r0 * (rh + gp), hh = n * rh + (n - 1) * gp;
      mk("rect", { x: cx, y: yy, width: cw, height: hh, rx: 6, fill: k === "tls" ? "var(--ltt-accent-soft)" : "var(--ltt-card-2)", stroke: k === "tls" ? "var(--ltt-c2)" : "var(--ltt-line-2)", "stroke-width": k === "tls" ? 2 : 1.2, "stroke-dasharray": k === "tls" ? "7 4" : "" }, g);
      tx(g, cx + 12, yy + 25, l, { "font-size": 15, "font-weight": 600 });
      if (inner) {
        mk("rect", { x: cx + 86, y: yy + 8, width: cw - 96, height: hh - 16, rx: 5, fill: unknown ? "var(--ltt-card)" : "var(--ltt-accent-soft)", stroke: unknown ? "var(--ltt-warn)" : "var(--ltt-c2)", "stroke-width": 2, "stroke-dasharray": "7 4" }, g);
        tx(g, cx + 86 + (cw - 96) / 2, yy + hh / 2 + 6, inner, { "text-anchor": "middle", "font-size": unknown ? 22 : 15, "font-weight": 700 });
      }
    });
  };
  col(x0, "HTTP/2 (HTTPS)", [["HTTP/2", 0, 1], ["TLS", 1, 1, "tls"], ["TCP", 2, 1], ["IP", 3, 1]]);
  col(x0 + cw + 30, "HTTP/3", [["HTTP/3", 0, 1], ["QUIC", 1, 2, "", unknown ? null : "TLS 1.3"], ["UDP", 3, 1], ["IP", 4, 1]]);
  if (unknown) {
    const bx = x0 + 2 * cw + 60, by = y0 + 26 + 1 * (rh + gp);
    mk("rect", { x: bx, y: by, width: 110, height: rh, rx: 6, fill: "var(--ltt-card)", stroke: "var(--ltt-warn)", "stroke-width": 2, "stroke-dasharray": "7 4" }, g);
    tx(g, bx + 55, by + 26, "TLS는?", { "text-anchor": "middle", "font-size": 17, "font-weight": 700 });
    return { w: 2 * cw + 60 + 110, h: 26 + 5 * (rh + gp) };
  }
  return { w: 2 * cw + 30, h: 26 + 5 * (rh + gp) };
}
// 여러 사다리를 한 svg에. id가 있으면 clock으로 움직이고, 없으면 끝 상태로 그린다.
function ladderFig(host, list, { id, stack } = {}) {
  const svg = mk("svg", { class: "lad", role: "img" });
  let x = 0, H = 0; const draws = [];
  list.forEach((o) => { const sz = ladderSize(o); const g = mk("g", {}, svg); draws.push(ladderG(g, Object.assign({ x0: x }, o))); x += sz.w + (o.mini ? 6 : 20); H = Math.max(H, sz.h); });
  if (stack) { const g = mk("g", {}, svg); const s = stackG(g, x + 10, 8, false); x += s.w + 20; H = Math.max(H, s.h + 10); }
  svg.setAttribute("viewBox", `0 0 ${x} ${H}`); svg.setAttribute("width", x); svg.style.maxWidth = "100%"; svg.style.height = "auto";
  host.appendChild(svg);
  const tmax = Math.max(...list.filter((o) => !o.still).map((o) => o.resp));
  const draw = (t) => draws.forEach((d, i) => d(list[i].still ? 1e6 : t / 1000));
  if (id) LTT.clock(svg, draw, { dur: tmax * 1000 + 400, id }); else draw(1e6);
  return svg;
}
const lad = (k, extra = {}) => Object.assign({ msgs: M[k], tmax: Math.ceil(rounds(k)), resp: rounds(k), spans: SPANS[k], gap: 380 }, extra);
function legendHTML() {
  const sw = (k) => `<svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="${STYLE[k].c}" stroke-width="${STYLE[k].w}" stroke-dasharray="${STYLE[k].d}"/></svg>`;
  return `<div class="legend"><span>${sw("tcp")}TCP 제어</span><span>${sw("tls")}TLS 핸드셰이크</span><span>${sw("data")}HTTP 요청·응답</span><span>{ } = 암호화된 메시지</span></div>`;
}

// ---- HOL 모델 ----
const PK = [
  { n: "A1", s: "A", arr: 10 }, { n: "B1", s: "B", arr: 20, lost: true, re: 120 }, { n: "C1", s: "C", arr: 30 },
  { n: "A2", s: "A", arr: 40 }, { n: "B2", s: "B", arr: 50 }, { n: "C2", s: "C", arr: 60 }];
const avail = (p) => (p.lost ? p.re : p.arr);
function deliver(kind) {
  return PK.map((p, i) => Math.max(...PK.slice(0, i + 1).filter((q) => kind === "tcp" || q.s === p.s).map(avail)));
}
const DEL = { tcp: deliver("tcp"), quic: deliver("quic") };
const OWN = deliver("quic");
const blockedByOthers = (kind) => PK.filter((p, i) => !p.lost && DEL[kind][i] > OWN[i]).length;

function holFig(host, { panels = ["tcp", "quic"], mode = "full", id } = {}) {
  const X = (ms) => 190 + ms * 5, rowH = 22, ph = 36 + PK.length * rowH + 8;
  const W = X(140) + 120, H = panels.length * ph + 36;
  const svg = mk("svg", { class: "lad", viewBox: `0 0 ${W} ${H}`, width: W, role: "img" });
  svg.style.maxWidth = "100%"; svg.style.height = "auto";
  const SC = { A: ["square", "var(--ltt-c1)"], B: ["ring", "var(--ltt-c3)"], C: ["diamond", "var(--ltt-c4)"] };
  const shape = (p, x, y, s) => { const [k, c] = SC[s];
    if (k === "square") return mk("rect", { x: x - 6, y: y - 6, width: 12, height: 12, fill: c }, p);
    if (k === "ring") return mk("circle", { cx: x, cy: y, r: 6, fill: "none", stroke: c, "stroke-width": 3 }, p);
    return mk("path", { d: `M${x},${y - 8} L${x + 8},${y} L${x},${y + 8} L${x - 8},${y} Z`, fill: c }, p); };
  const dyn = [];
  panels.forEach((kind, pi) => {
    const y0 = pi * ph;
    tx(svg, 8, y0 + 22, kind === "tcp" ? "TCP 위 HTTP/2" : "QUIC 위 HTTP/3", { "font-size": 16, "font-weight": 700 });
    const cnt = mode === "full" ? tx(svg, X(140) + 110, y0 + 22, "", { "text-anchor": "end", "font-size": 15, "font-weight": 700, fill: kind === "tcp" ? "var(--ltt-bad)" : "var(--ltt-good)" }) : null;
    PK.forEach((p, i) => {
      const y = y0 + 40 + i * rowH + rowH / 2;
      mk("line", { x1: X(0), y1: y, x2: X(140), y2: y, stroke: "var(--ltt-line)", "stroke-dasharray": "2 5" }, svg);
      shape(svg, 24, y, p.s); tx(svg, 40, y + 5, `${p.n} (스트림 ${p.s})`, { "font-size": 14 });
      const d = DEL[kind][i];
      const type = p.lost ? "lost" : d > OWN[i] ? "other" : d > p.arr ? "own" : "none";
      const col = { lost: "var(--ltt-bad)", other: "var(--ltt-warn)", own: "var(--ltt-muted)", none: "var(--ltt-good)" }[type];
      const bar = mk("line", { x1: X(p.arr), y1: y, x2: X(p.arr), y2: y, stroke: col, "stroke-width": 9, "stroke-linecap": "butt", "stroke-dasharray": p.lost ? "6 4" : "", opacity: 0 }, svg);
      const g0 = mk("g", { opacity: 0 }, svg);
      if (p.lost) { mk("path", { d: `M${X(p.arr) - 7},${y - 7} l14,14 m0,-14 l-14,14`, stroke: "var(--ltt-bad)", "stroke-width": 3 }, g0); }
      else shape(g0, X(p.arr), y, p.s);
      const gr = mk("g", { opacity: 0 }, svg);
      if (p.lost) { shape(gr, X(p.re), y, p.s); }
      const gd = mk("g", { opacity: 0 }, svg);
      if (mode === "full") {
        mk("line", { x1: X(d), y1: y - 10, x2: X(d), y2: y + 10, stroke: "var(--ltt-ink)", "stroke-width": 2.5 }, gd);
        tx(gd, X(d) + 8, y + 5, `전달 ${d} ms`, { "font-size": 13 });
      }
      if (p.lost) tx(g0, X(p.arr) + 12, y - 6, "손실", { "font-size": 12, fill: "var(--ltt-bad)" });
      dyn.push((ms) => {
        g0.setAttribute("opacity", ms >= p.arr ? 1 : 0);
        if (p.lost) gr.setAttribute("opacity", ms >= p.re ? 1 : 0);
        const end = mode === "full" ? Math.min(ms, d) : p.arr;
        bar.setAttribute("x2", X(Math.max(p.arr, end))); bar.setAttribute("opacity", mode === "full" && ms > p.arr ? 1 : 0);
        gd.setAttribute("opacity", mode === "full" && ms >= d ? 1 : 0);
      });
    });
    if (cnt) dyn.push((ms) => { const n = PK.filter((p, i) => !p.lost && DEL[kind][i] > OWN[i] && ms > p.arr).length;
      cnt.textContent = `다른 스트림 때문에 기다린 패킷 ${n}개`; });
  });
  const ay = panels.length * ph + 6;
  for (let ms = 0; ms <= 140; ms += 20) { mk("line", { x1: X(ms), y1: ay, x2: X(ms), y2: ay + 6, stroke: "var(--ltt-ink-2)" }, svg); tx(svg, X(ms), ay + 22, ms + " ms", { "text-anchor": "middle", "font-size": 12, class: "mut" }); }
  const cur = mk("line", { x1: X(0), y1: 30, x2: X(0), y2: ay, stroke: "var(--ltt-accent)", "stroke-width": 1.5, opacity: 0 }, svg);
  host.appendChild(svg);
  const draw = (t) => { const ms = mode === "full" ? t / 50 : 140; dyn.forEach((f) => f(ms));
    cur.setAttribute("x1", X(ms)); cur.setAttribute("x2", X(ms)); cur.setAttribute("opacity", mode === "full" && ms < 140 ? 1 : 0); };
  if (id) LTT.clock(svg, draw, { dur: 7000, id }); else draw(7000);

}
function holLegend() {

// ---- 작은 화살표 카드 그림 ----
function mini(pairs) {
  const h = 22 + pairs.length * 34;
  let s = `<svg class="lad" viewBox="0 0 300 ${h}" width="300" style="max-width:100%;height:auto">`;
  s += `<text x="30" y="14" text-anchor="middle" font-size="12" class="mut">클라이언트</text><text x="270" y="14" text-anchor="middle" font-size="12" class="mut">서버</text>`;
  s += `<line x1="30" y1="20" x2="30" y2="${h}" stroke="var(--ltt-line-2)" stroke-width="2"/><line x1="270" y1="20" x2="270" y2="${h}" stroke="var(--ltt-line-2)" stroke-width="2"/>`;
  pairs.forEach(([dir, l, k], i) => { const st = STYLE[k], y1 = 26 + i * 34, y2 = y1 + 16, x1 = dir > 0 ? 30 : 270, x2 = dir > 0 ? 270 : 30;
    const a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st.c}" stroke-width="${st.w}" stroke-dasharray="${st.d}"/>`;
    s += `<path d="M0,0 L-10,-5 L-10,5 Z" fill="${st.c}" transform="translate(${x2},${y2}) rotate(${a})"/>`;
    s += `<text x="150" y="${y1 + 4}" text-anchor="middle" font-size="13" class="halo">${l}</text>`; });
  return s + "</svg>";
}

// ---- RTT 손잡이 막대 ----
function rttBars(svg, rtt) {
  const max = [50, 100, 200, 400, 800].find((m) => m >= 4 * rtt), k = 540 / max;
  const X = (ms) => 220 + ms * k, keys = Object.keys(ROUNDS), rowH = 44;
  svg.innerHTML = "";
  for (let ms = 0; ms <= max; ms += max / 5) { mk("line", { x1: X(ms), y1: 6, x2: X(ms), y2: keys.length * rowH + 6, stroke: "var(--ltt-line)", "stroke-dasharray": "2 5" }, svg);
    tx(svg, X(ms), keys.length * rowH + 24, ms + " ms", { "text-anchor": "middle", "font-size": 12, class: "mut" }); }
  const fill = { tcp: "var(--ltt-ink-2)", tls: "var(--ltt-c2)", data: "var(--ltt-accent)" };
  keys.forEach((key, i) => {
    const y = 12 + i * rowH; tx(svg, 8, y + 21, ROUNDS[key].name, { "font-size": 14, "font-weight": 600 });
    let at = 0;
    ROUNDS[key].seg.forEach(([l, n, c]) => { const w = n * rtt * k;
      mk("rect", { x: X(at), y, width: Math.max(w - 1, 0), height: 28, fill: fill[c], opacity: c === "tcp" ? .55 : .85 }, svg);
      if (w > 64) tx(svg, X(at) + 6, y + 19, `${l} ${n}`, { "font-size": 12, fill: "var(--ltt-bg)", "font-weight": 700 });
      at += n * rtt; });
    tx(svg, X(at) + 8, y + 20, `${firstByte(key, rtt)} ms (${rounds(key)} RTT)`, { "font-size": 14, "font-weight": 700 });
  });
  tx(svg, 892, keys.length * rowH + 44, `축 0–${max} ms (RTT에 맞춰 바뀜)`, { "text-anchor": "end", "font-size": 12, fill: "var(--ltt-warn)" });
}
