<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공기저항과 최적 발사각</title>
<script type="application/json" id="ltt-meta">{
  "topic": "공기저항(2차 항력)이 있을 때 최적 발사각",
  "audience": "게임 클라이언트 개발자. 등가속도 포물선 운동과 sin2θ 사거리 공식은 안다",
  "theme": "lab",
  "medium": "deck",
  "decision": "공 던지기 게임에서 공기저항을 어떻게 넣고, 가장 멀리 가는 조준각을 어떻게 정할지",
  "glossary": {
    "항력": "공기가 움직이는 물체에 주는 힘. 방향은 늘 물체 속도의 반대다(바람이 없을 때).",
    "2차 항력": "크기가 속도의 제곱에 비례하는 항력. F = ½ρC<sub>d</sub>Av². 공처럼 빠르고 큰 물체에 맞는 모형이다.",
    "종단 속도": "떨어지는 물체의 항력이 중력과 같아져 더 빨라지지 않는 속도 v<sub>t</sub>. 공의 무게·크기·모양으로 정해진다.",
    "항력/중력 비": "그 순간 항력이 중력의 몇 배인지. 2차 항력에서는 (v / v<sub>t</sub>)².",
    "항력 계수": "C<sub>d</sub>. 모양에 따라 정해지는 무차원 수. 매끈한 공은 대략 0.3–0.6.",
    "최적 발사각": "같은 속력으로 던질 때 같은 높이에 떨어지는 거리가 가장 긴 각도."
  }
}</script>
<link rel="stylesheet" href="/kit/vendor/katex/katex.min.css">
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/vendor/katex/katex.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<style>
  .fig { width: 100%; height: auto; display: block; }
  .fig text { font-size: 13px; fill: var(--ltt-ink-2); }
  .fig .muted { fill: var(--ltt-muted); }
  .fig .big { font-size: 15px; font-weight: 600; fill: var(--ltt-ink); }
  .fig .axis line, .fig .axis path { stroke: var(--ltt-line-2); }
  .fig .grid { stroke: var(--ltt-line); stroke-width: 1; }
  .num { font-variant-numeric: tabular-nums; }
  .ctl { display: grid; grid-template-columns: auto 1fr 7.5em; gap: 8px 12px; align-items: center; margin-top: 8px; }
  .ctl output { font-variant-numeric: tabular-nums; min-width: 7.5em; text-align: right; }
  .twin { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }
  .readout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .readout div { border: 1px solid var(--ltt-line); border-radius: 6px; padding: 6px 8px; }
  .readout b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ltt-ink); }
  .readout span { font-size: 13px; color: var(--ltt-muted); }
</style>
</head>
<body>
<script>
(function () {
  const g = 9.81, VT = 22, V0 = 30;
  const NS = "http://www.w3.org/2000/svg";
  const C1 = "var(--ltt-c1)", C2 = "var(--ltt-c2)", C3 = "var(--ltt-c3)", MUTED = "var(--ltt-muted)", INK = "var(--ltt-ink)";

  // 2차 항력 포물체: ax = -k|v|vx, ay = -g - k|v|vy, k = g/vt². RK4.
  function fly(v0, deg, vt, dt) {
    const k = vt ? g / (vt * vt) : 0, th = deg * Math.PI / 180;
    dt = dt || 0.002;
    const f = (s) => { const sp = Math.hypot(s[2], s[3]); return [s[2], s[3], -k * sp * s[2], -g - k * sp * s[3]]; };
    let s = [0, 0, v0 * Math.cos(th), v0 * Math.sin(th)], t = 0;
    const pts = [{ t, x: 0, y: 0, vx: s[2], vy: s[3] }];
    for (let i = 0; i < 200000; i++) {
      const a = f(s), b = f(s.map((v, j) => v + a[j] * dt / 2)), c = f(s.map((v, j) => v + b[j] * dt / 2)), d = f(s.map((v, j) => v + c[j] * dt));
      const n = s.map((v, j) => v + dt / 6 * (a[j] + 2 * b[j] + 2 * c[j] + d[j]));
      if (n[1] < 0) {
        const r = s[1] / (s[1] - n[1]);
        const L = s.map((v, j) => v + r * (n[j] - v));
        pts.push({ t: t + r * dt, x: L[0], y: 0, vx: L[2], vy: L[3] });
        break;
      }
      s = n; t += dt;
      pts.push({ t, x: s[0], y: s[1], vx: s[2], vy: s[3] });
    }
    const last = pts[pts.length - 1];
    return { pts, R: last.x, T: last.t };
  }
  const rangeOf = (v0, deg, vt) => fly(v0, deg, vt, Math.max(0.0005, v0 / g / 400)).R;
  function optimum(v0, vt) {
    let best = { deg: 45, R: -1 };
    for (let d = 20; d <= 46; d += 0.5) { const R = rangeOf(v0, d, vt); if (R > best.R) best = { deg: d, R }; }
    return refine(v0, vt, best);
  }
  // 사거리 곡선은 꼭짓점 근처가 평평해 0.5° 격자만으로는 최적각이 계단처럼 튄다. 이웃 세 점의 포물선 꼭짓점으로 다듬는다.
  function refine(v0, vt, best) {
    const a = rangeOf(v0, best.deg - 0.5, vt), c = rangeOf(v0, best.deg + 0.5, vt), den = a - 2 * best.R + c;
    const off = den < 0 ? Math.max(-0.5, Math.min(0.5, 0.25 * (a - c) / den)) : 0;
    return { deg: best.deg + off, R: best.R };
  }
  function at(path, t) {
    const p = path.pts;
    if (t >= p[p.length - 1].t) return p[p.length - 1];
    let i = Math.min(p.length - 2, Math.floor(t / 0.002));
    while (i > 0 && p[i].t > t) i--;
    while (i < p.length - 2 && p[i + 1].t < t) i++;
    const a = p[i], b = p[i + 1], r = (t - a.t) / ((b.t - a.t) || 1);
    return { t, x: a.x + r * (b.x - a.x), y: a.y + r * (b.y - a.y), vx: a.vx + r * (b.vx - a.vx), vy: a.vy + r * (b.vy - a.vy) };
  }
  function semiImplicit(v0, deg, vt, dt) {
    const k = g / (vt * vt), th = deg * Math.PI / 180;
    let x = 0, y = 0, vx = v0 * Math.cos(th), vy = v0 * Math.sin(th);
    for (let i = 0; i < 100000; i++) {
      const sp = Math.hypot(vx, vy);
      vx += -k * sp * vx * dt; vy += (-g - k * sp * vy) * dt;
      const nx = x + vx * dt, ny = y + vy * dt;
      if (ny < 0) return x + (nx - x) * y / (y - ny);
      x = nx; y = ny;
    }
    return x;
  }

  // ---- 기대값 대조 (outline.md의 손계산·RK4 dt=1e-4 값)
  const air45 = fly(V0, 45, VT), air30 = fly(V0, 30, VT), air60 = fly(V0, 60, VT);
  const vac45 = fly(V0, 45, 0), vac30 = fly(V0, 30, 0), vac60 = fly(V0, 60, 0);
  const optT = optimum(V0, VT);
  const euler60 = semiImplicit(V0, 39, VT, 1 / 60), euler30 = semiImplicit(V0, 39, VT, 1 / 30);
  LTT.expect("진공 45° 사거리 (m)", vac45.R, 91.74, { tol: 0.05 });
  LTT.expect("진공 30° 사거리 (m)", vac30.R, 79.45, { tol: 0.05 });
  LTT.expect("진공 60° 사거리 (m)", vac60.R, 79.45, { tol: 0.05 });
  LTT.expect("공기 45° 사거리 (m)", air45.R, 41.28, { tol: 0.05 });
  LTT.expect("공기 30° 사거리 (m)", air30.R, 40.34, { tol: 0.05 });
  LTT.expect("공기 60° 사거리 (m)", air60.R, 34.19, { tol: 0.05 });
  LTT.expect("공기 45° 체공 시간 (s)", air45.T, 3.36, { tol: 0.01 });
  LTT.expect("테니스공 30 m/s 최적각 (°)", optT.deg, 39, { tol: 1 });
  LTT.expect("최적각 v0/vt=2 (°)", optimum(44, 22).deg, 36, { tol: 1 });
  LTT.expect("최적각 v0/vt=4 (°)", optimum(88, 22).deg, 31, { tol: 1 });
  LTT.expect("던지는 순간 항력/중력", (V0 / VT) ** 2, 1.86, { tol: 0.005 });
  LTT.expect("낙하 1 s 속도 (m/s)", VT * Math.tanh(g * 1 / VT), 9.21, { tol: 0.01 });
  LTT.expect("반암시 오일러 1/60 s, 39° (m)", euler60, 41.41, { tol: 0.05 });
  LTT.expect("반암시 오일러 1/30 s, 39° (m)", euler30, 40.87, { tol: 0.05 });
  LTT.expect("60° 공기 착지 vx (m/s)", air60.pts[air60.pts.length - 1].vx, 4.91, { tol: 0.03 });

  // 덱은 figure 함수를 문서에 붙이기 전에 부르므로, #id로 손잡이를 찾는 LTT.sweep은 붙은 뒤에 건다.
  function whenAttached(id, fn) {
    if (document.getElementById(id)) fn(); else requestAnimationFrame(() => whenAttached(id, fn));
  }

  // ---- SVG helpers
  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function svg(host, w, h, maxw) {
    const s = el("svg", { viewBox: `0 0 ${w} ${h}`, class: "fig", role: "img" });
    s.style.maxWidth = (maxw || w) + "px";
    host.appendChild(s);
    return s;
  }
  function arrow(parent, x, y, dx, dy, color, width) {
    const grp = el("g", {}, parent);
    const len = Math.hypot(dx, dy);
    if (len < 2) return grp;
    const a = Math.atan2(dy, dx), h = Math.min(10, len * 0.45);
    el("line", { x1: x, y1: y, x2: x + dx - Math.cos(a) * h * 0.6, y2: y + dy - Math.sin(a) * h * 0.6, stroke: color, "stroke-width": width || 3, "stroke-linecap": "round" }, grp);
    el("path", { d: `M${x + dx},${y + dy} L${x + dx - h * Math.cos(a - 0.45)},${y + dy - h * Math.sin(a - 0.45)} L${x + dx - h * Math.cos(a + 0.45)},${y + dy - h * Math.sin(a + 0.45)}Z`, fill: color }, grp);
    return grp;
  }
  function pathD(pts, X, Y, tmax) {
    let d = "";
    for (const p of pts) { if (tmax != null && p.t > tmax) break; d += (d ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1); }
    return d;
  }
  function axes(s, X, Y, o) {
    const gA = el("g", { class: "axis" }, s);
    const [x0, x1] = X.range(), [y0, y1] = Y.range();
    (o.yt || []).forEach(v => {
      el("line", { x1: x0, x2: x1, y1: Y(v), y2: Y(v), class: "grid" }, gA);
      el("text", { x: x0 - 6, y: Y(v) + 4, "text-anchor": "end", class: "muted" }, gA, o.yf ? o.yf(v) : v);
    });
    (o.xt || []).forEach(v => el("text", { x: X(v), y: y0 + 17, "text-anchor": "middle", class: "muted" }, gA, o.xf ? o.xf(v) : v));
    el("line", { x1: x0, x2: x1, y1: y0, y2: y0, stroke: "var(--ltt-line-2)", "stroke-width": 1.5 }, gA);
    el("line", { x1: x0, x2: x0, y1: y0, y2: y1, stroke: "var(--ltt-line-2)", "stroke-width": 1.5 }, gA);
    if (o.xl) el("text", { x: x1, y: y0 + 34, "text-anchor": "end", class: "muted" }, gA, o.xl);
    if (o.yl) el("text", { x: x0, y: y1 - 10, "text-anchor": "start", class: "muted" }, gA, o.yl);
    return gA;
  }

  // ---- 장면 1: hook 그림
  function hookArt(host) {
    const s = svg(host, 260, 220, 260);
    const X = d3.scaleLinear([0, 95], [12, 248]), sc = (X(10) - X(0)) / 10, Y = y => 150 - y * sc;
    el("text", { x: 12, y: 40, class: "muted" }, s, "45°, 가로·세로 같은 축척");
    el("line", { x1: 6, x2: 254, y1: 150, y2: 150, stroke: "var(--ltt-line-2)", "stroke-width": 1.5 }, s);
    el("path", { d: pathD(vac45.pts, X, Y), fill: "none", stroke: MUTED, "stroke-width": 2, "stroke-dasharray": "5 4" }, s);
    el("path", { d: pathD(air45.pts, X, Y), fill: "none", stroke: C1, "stroke-width": 3.5 }, s);
    el("circle", { cx: X(air45.R), cy: Y(0), r: 5, fill: C1 }, s);
    el("circle", { cx: X(vac45.R), cy: Y(0), r: 5, fill: "none", stroke: MUTED, "stroke-width": 2 }, s);
    el("text", { x: X(air45.R), y: 172, "text-anchor": "middle", style: "font-size: 15px; font-weight: 600; fill: var(--ltt-ink)" }, s, "공기 " + air45.R.toFixed(1) + " m");
    el("text", { x: X(vac45.R), y: 198, "text-anchor": "end", style: "font-size: 15px; font-weight: 600; fill: var(--ltt-ink)" }, s, "진공 " + vac45.R.toFixed(1) + " m");
    return s;
  }

  // ---- 장면 2: 항력 방향 (clock dir)
  function dirFigure(host) {
    const s = svg(host, 660, 360, 680);
    const X = d3.scaleLinear([0, 45], [120, 620]), Y = d3.scaleLinear([0, 0], [250, 250]);
    const sc = (X(10) - X(0)) / 10, Yv = (y) => 250 - y * sc;
    const MG = 50, VS = 2.2;
    el("line", { x1: 40, x2: 650, y1: 250, y2: 250, stroke: "var(--ltt-line-2)", "stroke-width": 1.5 }, s);
    [0, 10, 20, 30].forEach(m => el("text", { x: X(m) + 4, y: 268, "text-anchor": "start", class: "muted" }, s, m + " m"));
    el("path", { d: pathD(air45.pts, X, Yv), fill: "none", stroke: "var(--ltt-line-2)", "stroke-width": 2, "stroke-dasharray": "3 4" }, s);
    const trail = el("path", { fill: "none", stroke: INK, "stroke-width": 2, "stroke-opacity": 0.5 }, s);
    const live = el("g", {}, s);
    // 범례
    const lg = el("g", {}, s);
    [["속도 v", C1], ["중력 mg", MUTED], ["항력", C2]].forEach(([t, c], i) => {
      el("line", { x1: 20 + i * 110, x2: 46 + i * 110, y1: 22, y2: 22, stroke: c, "stroke-width": 4 }, lg);
      el("text", { x: 52 + i * 110, y: 27 }, lg, t);
    });
    el("text", { x: 20, y: 48, class: "muted" }, s, "화살표 길이: 중력 mg = 50 px, 항력은 같은 축척");
    const ro = el("g", {}, s);
    const r1 = el("text", { x: 20, y: 300, class: "big num" }, ro);
    const r2 = el("text", { x: 20, y: 322, class: "num" }, ro);
    const r3 = el("text", { x: 20, y: 344, class: "num" }, ro);
    el("text", { x: 650, y: 344, "text-anchor": "end", class: "muted" }, s, "단순화: 회전·바람 없음");
    function draw(ms) {
      const t = Math.min(ms / 1000, air45.T);
      const p = at(air45, t);
      trail.setAttribute("d", pathD(air45.pts, X, Yv, t));
      live.innerHTML = "";
      const x = X(p.x), y = Yv(p.y), sp = Math.hypot(p.vx, p.vy), ux = p.vx / sp, uy = p.vy / sp, dg = (sp / VT) ** 2;
      arrow(live, x, y, 0, MG, MUTED, 3);
      arrow(live, x, y, -ux * MG * dg, uy * MG * dg, C2, 4);
      arrow(live, x, y, ux * sp * VS, -uy * sp * VS, C1, 3);
      el("circle", { cx: x, cy: y, r: 7, fill: INK }, live);
      const vert = Math.abs(p.vy) < 0.4 ? "거의 없음 (뒤로만)" : (p.vy > 0 ? "아래 ↓ (중력에 보탬)" : "위 ↑ (중력을 덜어 냄)");
      r1.textContent = `t = ${t.toFixed(2)} s · 속력 ${sp.toFixed(1)} m/s · 항력 = ${dg.toFixed(2)} mg`;
      r2.textContent = `항력의 위·아래 성분: ${vert}`;
      r3.textContent = `항력의 수평 성분: 뒤로 ← (수평 속도 ${p.vx.toFixed(1)} m/s를 줄임)`;
    }
    LTT.clock(s, draw, { dur: Math.round(air45.T * 1000), loop: true, id: "dir" });
  }

  // ---- 장면 3: 속도 제곱 항력 (sweep spd)
  function forceFigure(host) {
    const s = svg(host, 640, 320, 660);
    const X = d3.scaleLinear([0, 40], [60, 610]), Y = d3.scaleLinear([0, 3.5], [270, 30]);
    axes(s, X, Y, { xt: [0, 10, 20, 30, 40], yt: [0, 1, 2, 3], yf: v => v + " mg", xl: "공의 속력 v (m/s)", yl: "항력 크기 (중력 mg의 몇 배)" });
    let d = "";
    for (let v = 0; v <= 40; v += 0.5) d += (v ? "L" : "M") + X(v).toFixed(1) + "," + Y(Math.min(3.5, (v / VT) ** 2)).toFixed(1);
    el("line", { x1: X(0), x2: X(40), y1: Y(1), y2: Y(1), stroke: MUTED, "stroke-width": 2, "stroke-dasharray": "6 5" }, s);
    el("text", { x: X(1), y: Y(1) - 8, class: "muted" }, s, "중력 = 1 mg");
    el("path", { d, fill: "none", stroke: C2, "stroke-width": 3 }, s);
    el("circle", { cx: X(VT), cy: Y(1), r: 7, fill: "none", stroke: INK, "stroke-width": 2 }, s);
    el("line", { x1: X(VT), x2: X(VT), y1: Y(1), y2: Y(0), stroke: INK, "stroke-dasharray": "2 4" }, s);
    el("text", { x: X(VT) - 8, y: Y(0.12), "text-anchor": "end" }, s, "항력 = 중력: 22 m/s");
    const dyn = el("g", {}, s);
    const wrap = document.createElement("div");
    wrap.className = "ctl";
    wrap.innerHTML = '<label for="spd">공의 속력</label><input type="range" id="spd" min="0" max="40" step="1" value="11"><output id="spd-v" class="num"></output>';
    host.appendChild(wrap);
    function render(vals) {
      const v = vals.spd, f = (v / VT) ** 2;
      dyn.innerHTML = "";
      el("line", { x1: X(v), x2: X(v), y1: Y(0), y2: Y(Math.min(3.5, f)), stroke: C2, "stroke-dasharray": "3 3" }, dyn);
      el("circle", { cx: X(v), cy: Y(Math.min(3.5, f)), r: 7, fill: C2 }, dyn);
      el("text", { x: X(v) + (v > 30 ? -12 : 12), y: Y(Math.min(3.5, f)) - 10, "text-anchor": v > 30 ? "end" : "start", class: "big num" }, dyn, `${v} m/s → ${f.toFixed(2)} mg`);
      if (2 * v <= 40 && v > 0) {
        const f2 = (2 * v / VT) ** 2;
        el("circle", { cx: X(2 * v), cy: Y(Math.min(3.5, f2)), r: 6, fill: "none", stroke: C2, "stroke-width": 2 }, dyn);
        el("text", { x: X(2 * v) + 10, y: Y(Math.min(3.5, f2)) + 20, class: "num" }, dyn, `2배 속력 ${2 * v} m/s → ${f2.toFixed(2)} mg (4배)`);
      }
    }
    render({ spd: 11 });
    whenAttached("spd", () => LTT.sweep({ params: { spd: { kind: "range", map: x => +x, fmt: v => v + " m/s", label: "공의 속력" } }, render }));
  }

  // ---- 장면 4: 종단 속도 (clock fall)
  function fallFigure(host) {
    const s = svg(host, 660, 330, 680);
    const H = d3.scaleLinear([0, 125], [40, 290]);
    el("text", { x: 90, y: 22, "text-anchor": "middle" }, s, "진공");
    el("text", { x: 150, y: 22, "text-anchor": "middle" }, s, "공기");
    el("text", { x: 120, y: 318, "text-anchor": "middle", class: "muted" }, s, "0.5 s마다 공의 자리");
    [0, 50, 100].forEach(m => { el("line", { x1: 60, x2: 175, y1: H(m), y2: H(m), class: "grid" }, s); el("text", { x: 54, y: H(m) + 4, "text-anchor": "end", class: "muted" }, s, m + " m"); });
    const X = d3.scaleLinear([0, 5], [230, 630]), Y = d3.scaleLinear([0, 50], [290, 40]);

      '<div class="readout"><div><b id="ro-r">–</b><span>v0 / vt</span></div><div><b id="ro-f">–</b><span>던지는 순간 항력/중력</span></div><div><b id="ro-o">–</b><span>최적각 · 사거리</span></div><div><b id="ro-d">–</b><span>45°로 던지면 손해</span></div></div>';
