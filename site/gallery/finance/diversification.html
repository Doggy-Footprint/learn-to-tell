<script>
const F = (() => {
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function normals(n, seed) { const r = rng(seed), o = []; while (o.length < n) { const u = r() || 1e-9, v = r(); o.push(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)); } return o; }
  function stdz(x) { const n = x.length, m = x.reduce((a, b) => a + b, 0) / n, c = x.map(v => v - m), s = Math.sqrt(c.reduce((a, v) => a + v * v, 0) / n); return c.map(v => v / s); }
  // 표본 상관이 정확히 rho, 모표준편차가 정확히 sd가 되도록 중심화·직교화한다(그림의 숫자와 공식이 정확히 맞게).
  function pair(n, rho, seed, sd = 20, mean = 5) {
    const z1 = stdz(normals(n, seed)); let z2 = stdz(normals(n, seed + 101));
    const k = z2.reduce((a, v, i) => a + v * z1[i], 0) / n;
    z2 = stdz(z2.map((v, i) => v - k * z1[i]));
    const q = Math.sqrt(Math.max(0, 1 - rho * rho));
    return { a: z1.map(v => mean + sd * v), b: z1.map((v, i) => mean + sd * (rho * v + q * z2[i])) };
  }
  const mean = x => x.reduce((a, b) => a + b, 0) / x.length;
  const sd = x => { const m = mean(x); return Math.sqrt(mean(x.map(v => (v - m) ** 2))); };
  const corr = (x, y) => { const mx = mean(x), my = mean(y); return mean(x.map((v, i) => (v - mx) * (y[i] - my))) / (sd(x) * sd(y)); };
  const sig = (w, sa, sb, r) => Math.sqrt(Math.max(0, w * w * sa * sa + (1 - w) ** 2 * sb * sb + 2 * w * (1 - w) * r * sa * sb));
  const wmin = (sa, sb, r) => { const d = sa * sa + sb * sb - 2 * r * sa * sb; return d < 1e-9 ? 0 : clamp((sb * sb - r * sa * sb) / d, 0, 1); };
  const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
  const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
  const fz = v => f1(v).replace(/\.0$/, '');
  function svg(el, w, h, cls) {
    let s = d3.select(el).select(':scope > svg');
    if (s.empty()) { el.innerHTML = ''; s = d3.select(el).append('svg'); } else s.selectAll('*').remove();
    return s.attr('viewBox', `0 0 ${w} ${h}`).attr('class', 'fig ' + (cls || ''));
  }

  function bars(el, { rho = 0, seed = 7, n = 12, t0 = 0 } = {}) {
    const d = pair(n, rho, seed), mix = d.a.map((v, i) => (v + d.b[i]) / 2);
    const rows = [
      { key: 'A', name: 'A만', vals: d.a, cls: 'c1', s: sd(d.a) },
      { key: 'B', name: 'B만', vals: d.b, cls: 'c2', s: sd(d.b) },
      { key: 'M', name: '반반', vals: mix, cls: 'cm', s: sd(mix) }];
    const s = svg(el, 720, 400, 'bars');
    s.append('text').attr('x', 0).attr('y', 18).attr('class', 'note').text('가상 예시 · 12개 기간의 수익률 · 가운데 점선 = 평균 5%');
    const g = rows.map((r, j) => {
      const cy = 90 + j * 115, row = s.append('g');
      row.append('text').attr('x', 0).attr('y', cy - 6).attr('class', 'lab ' + (r.key === 'M' ? 'strong' : '')).text(r.name);
      const sl = row.append('text').attr('x', 0).attr('y', cy + 20).attr('class', 'num ' + (r.key === 'M' ? 'accent' : '')).text('σ ' + f1(r.s) + '%');
      row.append('line').attr('x1', 150).attr('x2', 715).attr('y1', cy).attr('y2', cy).attr('class', 'mean');
      const rects = r.vals.map((v, i) => row.append('rect').attr('x', 168 + i * 46).attr('width', 28).attr('class', 'bar ' + r.cls));
      return { r, cy, rects, sl };
    });
    function draw(t) {
      g.forEach((o, j) => {
        const start = [0, 1000, 2200][j], len = [900, 900, 1400][j];
        const e = clamp((t - start) / len, 0, 1);
        o.rects.forEach((rc, i) => {
          const dev = (o.r.vals[i] - 5) * e;
          rc.attr('y', o.cy - Math.max(dev, 0)).attr('height', Math.abs(dev));
        });
        o.sl.attr('opacity', e >= 1 ? 1 : 0);
      });
    }
    draw(t0);
    return { el, draw, sds: rows.map(r => r.s) };
  }

  function scatter(el, rho, { seed = 11, n = 40 } = {}) {
    const d = pair(n, rho, seed);
    const s = svg(el, 440, 430, 'scatter');
    const X = d3.scaleLinear([-55, 65], [62, 425]), Y = d3.scaleLinear([-55, 65], [380, 24]);
    [-40, -20, 0, 20, 40, 60].forEach(v => {
      s.append('line').attr('x1', X(v)).attr('x2', X(v)).attr('y1', 24).attr('y2', 380).attr('class', 'grid');
      s.append('line').attr('y1', Y(v)).attr('y2', Y(v)).attr('x1', 62).attr('x2', 425).attr('class', 'grid');
      s.append('text').attr('x', X(v)).attr('y', 400).attr('class', 'tick').attr('text-anchor', 'middle').text(v);
      s.append('text').attr('x', 54).attr('y', Y(v) + 5).attr('class', 'tick').attr('text-anchor', 'end').text(v);
    });
    s.append('text').attr('x', 425).attr('y', 425).attr('text-anchor', 'end').attr('class', 'axl').text('A 수익률(%) →');
    s.append('text').attr('transform', 'translate(14,24) rotate(90)').attr('class', 'axl').text('B 수익률(%) →');
    d.a.forEach((v, i) => s.append('circle').attr('cx', X(v)).attr('cy', Y(d.b[i])).attr('r', 5.5).attr('class', 'pt'));
    s.append('text').attr('x', 74).attr('y', 50).attr('class', 'note').text('가상 예시 · 40개 기간, 점 하나 = 한 기간');
    return { el, r: corr(d.a, d.b), sa: sd(d.a), sb: sd(d.b), smix: sd(d.a.map((v, i) => (v + d.b[i]) / 2)) };
  }

  function square(el, { a, b, rho, la = 'w_Aσ_A', lb = 'w_Bσ_B', dims = true }) {
    const k = 15, x0 = 40, y0 = dims ? 46 : 10, s = svg(el, 390, dims ? 370 : 330, dims ? 'square' : 'square big');
    const cells = [
      { x: x0, y: y0, w: a, h: a, v: a * a, cls: 'c1', diag: true },
      { x: x0 + a * k, y: y0 + a * k, w: b, h: b, v: b * b, cls: 'c2', diag: true },
      { x: x0 + a * k, y: y0, w: b, h: a, v: rho * a * b },
      { x: x0, y: y0 + a * k, w: a, h: b, v: rho * a * b }];
    s.append('rect').attr('x', x0).attr('y', y0).attr('width', (a + b) * k).attr('height', (a + b) * k).attr('class', 'frame');
    cells.forEach(c => {
      const W = c.w * k, H = c.h * k;
      if (W < 0.5 || H < 0.5) return;
      if (c.diag) s.append('rect').attr('x', c.x).attr('y', c.y).attr('width', W).attr('height', H).attr('class', 'cell ' + c.cls);
      else {
        s.append('rect').attr('x', c.x).attr('y', c.y).attr('width', W).attr('height', H).attr('class', 'slot');
        const fw = W * Math.abs(rho);
        if (fw > 0.5) s.append('rect').attr('x', c.x).attr('y', c.y).attr('width', fw).attr('height', H).attr('class', 'cell ' + (rho > 0 ? 'cx' : 'neg'));
      }
      if (Math.min(W, H) >= 34) s.append('text').attr('x', c.x + W / 2).attr('y', c.y + H / 2 + 6).attr('text-anchor', 'middle').attr('class', 'cellv').text((c.v < 0 ? '−' : c.v > 0 && !c.diag ? '+' : '') + fz(Math.abs(c.v)));
    });
    const seg = (x, len, txt) => { if (len * k < 40) return; s.append('line').attr('x1', x + 2).attr('x2', x + len * k - 2).attr('y1', y0 - 14).attr('y2', y0 - 14).attr('class', 'dim'); s.append('text').attr('x', x + len * k / 2).attr('y', y0 - 22).attr('text-anchor', 'middle').attr('class', 'diml').text(txt); };
    if (dims) { seg(x0, a, la + ' = ' + fz(a)); seg(x0 + a * k, b, lb + ' = ' + fz(b)); }
    if (dims) s.append('text').attr('x', x0).attr('y', 366).attr('class', 'note').text('가상 예시 · 단위 %, 넓이 단위 %²');
    const total = a * a + b * b + 2 * rho * a * b;
    return { el, total, sigma: Math.sqrt(Math.max(0, total)), cells: cells.map(c => c.v) };
  }

  const AS = { sa: 20, sb: 10, ea: 8, eb: 3 };
  function plane(el, st) {
    const { sa, sb, ea, eb } = AS;
    const s = svg(el, 620, 430, 'plane');
    const X = d3.scaleLinear([0, 22], [72, 600]), Y = d3.scaleLinear([2, 9], [380, 24]);
    [0, 5, 10, 15, 20].forEach(v => { s.append('line').attr('x1', X(v)).attr('x2', X(v)).attr('y1', 24).attr('y2', 380).attr('class', 'grid'); s.append('text').attr('x', X(v)).attr('y', 402).attr('text-anchor', 'middle').attr('class', 'tick').text(v); });
    [2, 4, 6, 8].forEach(v => { s.append('line').attr('y1', Y(v)).attr('y2', Y(v)).attr('x1', 72).attr('x2', 600).attr('class', 'grid'); s.append('text').attr('x', 62).attr('y', Y(v) + 5).attr('text-anchor', 'end').attr('class', 'tick').text(v); });
    s.append('text').attr('x', 600).attr('y', 426).attr('text-anchor', 'end').attr('class', 'axl').text('위험 = 표준편차(%) →');
    s.append('text').attr('transform', 'translate(16,24) rotate(90)').attr('class', 'axl').text('기대수익률(%) →');
    s.append('text').attr('x', 84).attr('y', 46).attr('class', 'note').text(st.note || '가상 예시 · A 주식형(8%, 20%), B 채권형(3%, 10%)');
    const line = d3.line().x(p => X(p[0])).y(p => Y(p[1]));
    const at = (w, r) => [sig(w, sa, sb, r), w * ea + (1 - w) * eb];
    const pts = (r, w0 = 0, w1 = 1) => d3.range(0, 201).map(i => at(w0 + (w1 - w0) * i / 200, r));
    (st.curves || []).forEach(c => {
      if (c.frontier) {
        const wm = wmin(sa, sb, c.rho);
        s.append('path').attr('d', line(pts(c.rho, 0, wm))).attr('class', 'curve ineff');
        s.append('path').attr('d', line(pts(c.rho, wm, 1))).attr('class', 'curve front');
      } else s.append('path').attr('d', line(pts(c.rho))).attr('class', 'curve ' + (c.cls || ''));
      if (c.label) { const p = at(c.labelAt, c.rho); s.append('text').attr('x', X(p[0]) + (c.dx || 10)).attr('y', Y(p[1]) + (c.dy || 4)).attr('class', 'clab ' + (c.cls || '')).attr('text-anchor', c.anchor || 'start').text(c.label); }
      if (c.mvp) {
        const p = at(wmin(sa, sb, c.rho), c.rho);
        s.append('circle').attr('cx', X(p[0])).attr('cy', Y(p[1])).attr('r', 7).attr('class', 'mvp');
        if (c.mvpLabel) s.append('text').attr('x', X(p[0]) - 12).attr('y', Y(p[1]) + (c.mvpDy || 5)).attr('text-anchor', 'end').attr('class', 'mlab').text(c.mvpLabel);
      }
    });
    (st.marks || []).forEach(m => {
      s.append('circle').attr('cx', X(m.x)).attr('cy', Y(m.y)).attr('r', 7).attr('class', 'mk ' + (m.cls || ''));
      if (m.label) s.append('text').attr('x', X(m.x) + (m.dx || 12)).attr('y', Y(m.y) + (m.dy || 5)).attr('text-anchor', m.anchor || 'start').attr('class', 'mlab ' + (m.cls || '')).text(m.label);
    });
    if (st.gap) { const [x, y1, y2] = st.gap; s.append('line').attr('x1', X(x) + 22).attr('x2', X(x) + 22).attr('y1', Y(y1) - 4).attr('y2', Y(y2) + 4).attr('class', 'gap'); s.append('text').attr('x', X(x) + 32).attr('y', (Y(y1) + Y(y2)) / 2 + 5).attr('class', 'mlab good').text(st.gapLabel); }
    [['A', sa, ea, 'A 주식형 100%', -12, -12, 'end'], ['B', sb, eb, 'B 채권형 100%', 12, 24, 'start']].forEach(([kk, x, y, t, dx, dy, an]) => {
      s.append('rect').attr('x', X(x) - 7).attr('y', Y(y) - 7).attr('width', 14).attr('height', 14).attr('class', 'asset ' + (kk === 'A' ? 'c1' : 'c2'));

window.addEventListener('load', () => {
  const s = F.sig;
  LTT.expect('같은 위험 반반 σ (ρ=1)', s(0.5, 20, 20, 1), 20, { tol: 0.005 });
  LTT.expect('같은 위험 반반 σ (ρ=0.5)', s(0.5, 20, 20, 0.5), 17.32, { tol: 0.005 });
  LTT.expect('같은 위험 반반 σ (ρ=0)', s(0.5, 20, 20, 0), 14.14, { tol: 0.005 });
  LTT.expect('같은 위험 반반 σ (ρ=−0.5)', s(0.5, 20, 20, -0.5), 10, { tol: 0.005 });
  LTT.expect('같은 위험 반반 σ (ρ=−1)', s(0.5, 20, 20, -1), 0, { tol: 0.005 });
  const d = F.pair(12, 0, 7), mix = d.a.map((v, i) => (v + d.b[i]) / 2);
  LTT.expect('막대 데이터 A σ', F.sd(d.a), 20, { tol: 0.005 });
  LTT.expect('막대 데이터 반반 σ', F.sd(mix), 14.14, { tol: 0.005 });
  const p = F.pair(40, 0.5, 11);
  LTT.expect('산점도 표본 ρ', F.corr(p.a, p.b), 0.5, { tol: 0.001 });
  LTT.expect('주식·채권 반반 σ (ρ=0.2)', s(0.5, 20, 10, 0.2), 12.04, { tol: 0.005 });
  LTT.expect('주식·채권 반반 분산', s(0.5, 20, 10, 0.2) ** 2, 145, { tol: 0.01 });
  LTT.expect('최소분산 비중 (ρ=0.2)', F.wmin(20, 10, 0.2), 0.1429, { tol: 0.0005 });
  LTT.expect('최소분산 σ (ρ=0.2)', s(F.wmin(20, 10, 0.2), 20, 10, 0.2), 9.56, { tol: 0.005 });
  LTT.expect('최소분산 기대수익률 (ρ=0.2)', 3 + 5 * F.wmin(20, 10, 0.2), 3.71, { tol: 0.005 });
  LTT.expect('σ=10인 다른 비중의 σ', s(2 / 7, 20, 10, 0.2), 10, { tol: 0.005 });
  LTT.expect('σ=10인 다른 비중의 기대수익률', 3 + 5 * 2 / 7, 4.43, { tol: 0.005 });
  LTT.expect('최소분산 σ (ρ=0)', s(F.wmin(20, 10, 0), 20, 10, 0), 8.94, { tol: 0.005 });
  LTT.expect('최소분산 비중 (ρ=−0.5)', F.wmin(20, 10, -0.5), 0.2857, { tol: 0.0005 });
  LTT.expect('최소분산 σ (ρ=−0.5)', s(F.wmin(20, 10, -0.5), 20, 10, -0.5), 6.55, { tol: 0.005 });
  LTT.expect('최소분산 비중 (ρ=0.5)', F.wmin(20, 10, 0.5), 0, { tol: 1e-9 });
  LTT.expect('목표 범위 끝 σ (w=13%)', s(0.13, 20, 10, 0.2), 9.565, { tol: 0.002 });
});
