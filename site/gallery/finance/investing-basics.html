<script>
const SVGNS = "http://www.w3.org/2000/svg";
const P0 = 1000; // 만원
const won = (v) => Math.round(v).toLocaleString("ko-KR") + "만원";
const growth = (r, T) => P0 * Math.pow(1 + r, T);
const sigmaBasket = (n) => 40 * Math.sqrt(1 / n + (1 - 1 / n) * 0.2);
const sigmaMix = (w) => Math.sqrt((18 * w) ** 2 + (6 * (1 - w)) ** 2 + 2 * 0.2 * 18 * 6 * w * (1 - w));
const expMix = (w) => 7 * w + 4 * (1 - w);
const badYear = (mu, sg) => mu - 1.645 * sg;
const normal = (v, mu, sg) => Math.exp(-(((v - mu) / sg) ** 2) / 2) / (sg * Math.sqrt(2 * Math.PI));

// 같은 시드면 같은 경로: 해마다 시장 충격 f 하나를 뽑고 종목 순서대로 개별 충격 e를 뽑는다.
function simStocks(seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const nrm = () => { const u = 1 - rnd(), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const n = 20, T = 20, sm = 0.4 * Math.sqrt(0.2), se = 0.4 * Math.sqrt(0.8), g = 0.07 - 0.4 * 0.4 / 2;
  const paths = Array.from({ length: n }, () => [1]);
  for (let y = 1; y <= T; y++) { const f = nrm(); for (const p of paths) p.push(p[y - 1] * Math.exp(g + sm * f + se * nrm())); }
  const port = [];
  for (let y = 0; y <= T; y++) port.push(paths.reduce((s, p) => s + p[y], 0) / n);
  return { paths, port };
}
const SIM = simStocks(4);
const FIN = SIM.paths.map((p) => p[20]);
const PORT_END = SIM.port[20];

const TIMING = [12, -18, 25, 8, -6, 30, 4, -12, 20, 9];
const runSeq = (rs) => rs.reduce((v, r) => v * (1 + r / 100), P0);
const BEST2 = [30, 25], WORST2 = [-18, -12];
const timingRows = {
  stay: runSeq(TIMING),
  missBest: runSeq(TIMING.map((r) => (BEST2.includes(r) ? 3 : r))),
  avoidWorst: runSeq(TIMING.map((r) => (WORST2.includes(r) ? 3 : r))),
  missBoth: runSeq(TIMING.map((r) => (BEST2.includes(r) || WORST2.includes(r) ? 3 : r))),
  deposit: growth(0.03, 10),
};
const DCA_PRICES = [10000, 5000, 10000, 20000];
const DCA_SHARES = DCA_PRICES.map((p) => 100000 / p);
const DCA_TOTAL = DCA_SHARES.reduce((a, b) => a + b, 0);

function frame(el, w, h) {
  const svg = d3.select(el).append("svg").attr("class", "ib-svg").attr("viewBox", `0 0 ${w} ${h}`);
  svg.style("max-width", w + "px");
  return svg;
}
function axes(svg, x, y, h, m, xf, yf, xt = 6, yt = 5) {
  svg.append("g").attr("class", "grid").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(yt).tickSize(-(x.range()[1] - m.l)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("transform", `translate(0,${h - m.b})`).call(d3.axisBottom(x).ticks(xt).tickFormat(xf));
  svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(yt).tickFormat(yf));
}
const path = (svg, pts, x, y, color, width = 2.5, op = 1) =>
  svg.append("path").attr("d", d3.line().x((p) => x(p[0])).y((p) => y(p[1]))(pts)).attr("fill", "none").style("stroke", color).attr("stroke-width", width).attr("opacity", op);
const text = (svg, x, y, s, cls, anchor = "start") => svg.append("text").attr("x", x).attr("y", y).attr("class", cls || null).attr("text-anchor", anchor).text(s);

// 3번·10번이 같은 축(0–30년, 0–8,000만원)을 쓴다.
function growthAxes(el) {
  const W = 720, H = 300, m = { l: 70, r: 150, t: 16, b: 34 };
  const svg = frame(el, W, H);
  const x = d3.scaleLinear([0, 30], [m.l, W - m.r]), y = d3.scaleLinear([0, 8000], [H - m.b, m.t]);
  axes(svg, x, y, H, m, (d) => d + "년", (d) => d.toLocaleString("ko-KR") + "만");
  return { svg, x, y, W, H, m };
}
const years = d3.range(0, 31);

function compoundFig(el) {
  const g = growthAxes(el);
  const series = [
    { id: "simple", pts: years.map((t) => [t, P0 * (1 + 0.07 * t)]), color: "var(--ltt-c2)", w: 2.5, label: "단리 7%" },
    { id: "comp", pts: years.map((t) => [t, growth(0.07, t)]), color: "var(--ltt-c1)", w: 4, label: "복리 7%" },
    { id: "dep", pts: years.map((t) => [t, growth(0.03, t)]), color: "var(--ltt-muted)", w: 2.5, label: "예금 복리 3%" },
  ];
  const parts = {};
  for (const s of series) {
    const grp = g.svg.append("g");
    path(grp, s.pts, g.x, g.y, s.color, s.w);
    const end = s.pts[30];
    text(grp, g.x(30) + 8, g.y(end[1]) - 4, s.label, "lab");
    text(grp, g.x(30) + 8, g.y(end[1]) + 15, won(end[1]));
    parts[s.id] = grp;
  }
  text(g.svg, g.x(0) + 6, g.y(1000) + 22, "시작 1,000만원");
  const show = (ids) => { for (const k in parts) parts[k].attr("opacity", ids.includes(k) ? 1 : 0); };
  show(["simple", "comp", "dep"]);
  return { el: g.svg.node(), show };
}

function riskFig(el) {
  const W = 720, H = 400, m = { l: 30, r: 20, t: 30, b: 44 };
  const svg = frame(el, W, H);
  const x = d3.scaleLinear([-50, 60], [m.l, W - m.r]), y = d3.scaleLinear([0, 0.075], [H - m.b, m.t]);
  svg.append("g").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(11).tickFormat((d) => d + "%"));
  text(svg, W - m.r, H - 6, "한 해 수익률", null, "end");
  svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", m.t).attr("y2", H - m.b).style("stroke", "var(--ltt-line-2)").attr("stroke-dasharray", "2 3");
  const xs = d3.range(-50, 60.5, 0.5);
  const area = (mu, sg, color) => svg.append("path").attr("d", d3.area().x((v) => x(v)).y0(y(0)).y1((v) => y(normal(v, mu, sg)))(xs)).style("fill", color).attr("opacity", 0.18);
  area(7, 18, "var(--ltt-c1)"); area(4, 6, "var(--ltt-c2)");
  path(svg, xs.map((v) => [v, normal(v, 4, 6)]), x, y, "var(--ltt-c2)", 2.5);
  path(svg, xs.map((v) => [v, normal(v, 7, 18)]), x, y, "var(--ltt-c1)", 4);
  svg.append("line").attr("x1", x(3)).attr("x2", x(3)).attr("y1", y(0)).attr("y2", y(0.072)).style("stroke", "var(--ltt-ink)").attr("stroke-width", 3);
  text(svg, x(3) + 6, y(0.072) + 4, "예금 3% (매년 같음)", "lab");
  text(svg, x(4) + 26, y(normal(4, 4, 6)) + 34, "채권 평균 4%", "lab");
  text(svg, x(30), y(normal(30, 7, 18)) - 10, "주식 평균 7%", "lab");
  const bad = (v, label, color, yy) => {
    svg.append("line").attr("x1", x(v)).attr("x2", x(v)).attr("y1", yy).attr("y2", y(0)).style("stroke", color).attr("stroke-width", 2).attr("stroke-dasharray", "5 4");
    text(svg, x(v), yy - 6, label, "lab", "middle");
  };
  bad(badYear(7, 18), "주식 나쁜 해 " + badYear(7, 18).toFixed(1) + "%", "var(--ltt-bad)", y(0.03));
  bad(badYear(4, 6), "채권 나쁜 해 " + badYear(4, 6).toFixed(1) + "%", "var(--ltt-c2)", y(0.046));
  text(svg, m.l, m.t - 10, "높을수록 그 수익률이 나오는 해가 흔하다. 나쁜 해 = 약 20년에 한 번(하위 5%)");
  return { el: svg.node() };
}

function dragFig(el) {
  const W = 640, H = 330, m = { l: 60, r: 170, t: 24, b: 44 };
  const svg = frame(el, W, H);
  const x = d3.scalePoint(["시작", "1년 뒤", "2년 뒤"], [m.l + 20, W - m.r]), y = d3.scaleLinear([50, 160], [H - m.b, m.t]);
  axes(svg, x, y, H, m, (d) => d, (d) => d, 3, 5);
  const a = [["시작", 100], ["1년 뒤", 150], ["2년 뒤", 75]], b = [["시작", 100], ["1년 뒤", 100], ["2년 뒤", 100]];
  path(svg, b, x, y, "var(--ltt-muted)", 2.5);
  path(svg, a, x, y, "var(--ltt-c1)", 4);
  for (const [k, v] of a) svg.append("circle").attr("cx", x(k)).attr("cy", y(v)).attr("r", 6).style("fill", "var(--ltt-c1)");
  text(svg, x("1년 뒤"), y(150) - 12, "+50% → 150", "lab", "middle");
  text(svg, x("2년 뒤") + 12, y(75) + 5, "−50% → 75", "lab");
  text(svg, x("2년 뒤") + 12, y(100) + 5, "매년 0% → 100");
  return { el: svg.node() };
}

function pathsFig(el) {
  const W = 760, H = 450, m = { l: 70, r: 190, t: 66, b: 40 };
  const svg = frame(el, W, H);
  const x = d3.scaleLinear([0, 20], [m.l, W - m.r]), y = d3.scaleLog([0.05, 30], [H - m.b, m.t]);
  axes(svg, x, y, H, m, (d) => d + "년", (d) => d + "배", 5, 6);
  svg.selectAll("g").filter(function () { return this.getAttribute("transform") === `translate(${m.l},0)`; }).remove();
  svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickValues([0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20]).tickFormat((d) => d + "배"));
  svg.append("line").attr("x1", x(0)).attr("x2", x(20)).attr("y1", y(1)).attr("y2", y(1)).style("stroke", "var(--ltt-ink-2)").attr("stroke-dasharray", "4 4");
  text(svg, x(20) + 8, y(1) + 5, "원금 1배");
  const line = d3.line().x((p) => x(p[0])).y((p) => y(p[1]));
  const faint = SIM.paths.map(() => svg.append("path").attr("fill", "none").style("stroke", "var(--ltt-c2)").attr("stroke-width", 1.5).attr("opacity", 0.4));
  const bold = svg.append("path").attr("fill", "none").style("stroke", "var(--ltt-c1)").attr("stroke-width", 4.5);
  const endG = svg.append("g");
  text(endG, x(20) + 8, y(PORT_END) - 6, "나눠 담은 바구니", "lab");
  text(endG, x(20) + 8, y(PORT_END) + 14, PORT_END.toFixed(2) + "배", "big");
  const below = FIN.filter((v) => v < PORT_END).length, under1 = FIN.filter((v) => v < 1).length;
  text(endG, m.l, 22, `20개 중 ${below}개가 바구니보다 낮게, ${under1}개가 원금보다 낮게 끝났다`, "lab");
  text(endG, m.l, 44, `가장 좋은 종목 ${Math.max(...FIN).toFixed(2)}배 · 가장 나쁜 종목 ${Math.min(...FIN).toFixed(2)}배`);
  const draw = (t) => {
    const k = Math.max(0, Math.min(20, Math.floor((t / 6000) * 20 + 1e-9)));
    SIM.paths.forEach((p, i) => faint[i].attr("d", line(p.slice(0, k + 1).map((v, j) => [j, v]))));
    bold.attr("d", line(SIM.port.slice(0, k + 1).map((v, j) => [j, v])));
    endG.attr("opacity", k === 20 ? 1 : 0);
  };
  draw(0);
  LTT.clock(svg.node(), draw, { dur: 6000, id: "paths" });
  return { el: svg.node() };
}

const TV = {
  "수익률": `<rect x="14" y="30" width="34" height="30" style="fill:var(--ltt-line-2)"/><rect x="72" y="26" width="34" height="34" style="fill:var(--ltt-c1)"/><text x="89" y="20" text-anchor="middle">+7%</text>`,
  "복리": `<path d="M8 58 L112 34" style="stroke:var(--ltt-c2);stroke-width:2.5;fill:none"/><path d="M8 58 Q70 54 112 8" style="stroke:var(--ltt-c1);stroke-width:3.5;fill:none"/>`,
  "변동성": `<path d="M8 36 H112" style="stroke:var(--ltt-muted);stroke-dasharray:4 4"/><path d="M8 36 L22 14 L36 54 L50 20 L64 58 L78 12 L92 48 L112 30" style="stroke:var(--ltt-c1);stroke-width:2.5;fill:none"/>`,
  "분산투자": `<circle cx="28" cy="36" r="20" style="fill:var(--ltt-c2)"/>${[0, 1, 2, 3].map((r) => [0, 1, 2, 3].map((c) => `<circle cx="${70 + c * 13}" cy="${17 + r * 13}" r="5" style="fill:var(--ltt-c1)"/>`).join("")).join("")}`,
  "보수": `<rect x="8" y="24" width="104" height="24" style="fill:var(--ltt-c1)"/><rect x="88" y="24" width="24" height="24" style="fill:var(--ltt-bad)"/><text x="100" y="16" text-anchor="middle">−</text>`,
  "적립식": [0, 1, 2, 3].map((i) => `<rect x="${10 + i * 26}" y="20" width="18" height="32" style="fill:var(--ltt-c1)"/>`).join(""),
};
const tv = (k) => `<svg viewBox="0 0 120 70" width="120" height="70" style="font-size:14px;fill:var(--ltt-ink)">${TV[k]}</svg>`;

function treeFig(el) {
  const svg = el.appendChild(document.createElementNS(SVGNS, "svg"));
  const dg = LTT.diagram(svg, {
    cols: 3, rows: 4, cell: [270, 96], node: [210, 62],
    nodes: [
      { id: "now", c: 0, r: 1.5, l: "투자의 기본", s: "이번 수업", k: "accent", ring: true, icon: "trend" },
      { id: "index", c: 1, r: 0, l: "인덱스펀드·ETF", icon: "layers" },
      { id: "rebal", c: 2, r: 0, l: "리밸런싱", icon: "scale" },
      { id: "tax", c: 1, r: 1, l: "연금저축·ISA 세제", icon: "shield-check" },
      { id: "infl", c: 1, r: 2, l: "인플레이션과 실질수익률", icon: "gauge" },
      { id: "bond", c: 2, r: 2, l: "채권 금리와 가격", icon: "doc" },
      { id: "emerg", c: 1, r: 3, l: "비상금과 투자 순서", icon: "home" },
    ],
    edges: [
      { f: "now", t: "index" }, { f: "index", t: "rebal" }, { f: "now", t: "tax" },
      { f: "now", t: "infl" }, { f: "infl", t: "bond" }, { f: "now", t: "emerg" },
    ],
  });
  return { el: svg, dg };
}

function overviewFig(el) {
  const svg = el.appendChild(document.createElementNS(SVGNS, "svg"));
  const dg = LTT.diagram(svg, {
    cols: 6, rows: 2, cell: [190, 120], node: [160, 70],
    nodes: [

    figure: (el) => {
