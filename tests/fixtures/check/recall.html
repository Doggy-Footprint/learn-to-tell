<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fixture</title>
<script>window.__errs=0;addEventListener("error",function(){window.__errs++});addEventListener("unhandledrejection",function(){window.__errs++});window.__warns=[];console.warn=function(){window.__warns.push(Array.prototype.join.call(arguments," "));};</script>
<script type="application/json" id="ltt-meta">{"topic":"t","audience":"a","theme":"paper","medium":"m","decision":"d","glossary":{"k":"키 풀이"}}</script>
</head>
<body>
<div id="r"></div><div id="rh"></div><div id="rx"><p>a</p><p>b</p></div>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>


<script>
window.__calls=[];
window.__ra=LTT.recall(document.getElementById("r"),{question:"<b>무엇</b>인가?",answer:"정답 {{k}}",title:"T"});
window.__rb=LTT.recall(document.getElementById("rh"),{question:"홀드 질문",answer:"홀드 답",title:"H",
  hold:function(a){window.__holdEl=a;window.__calls.push("hold");},
  onReveal:function(a){window.__revealEl=a;window.__calls.push("reveal");}});
</script>
<script>
function ltt_probe(extra){var p={errs:window.__errs,warns:window.__warns,vp:[innerWidth,innerHeight]};var e=extra||{};for(var k in e)p[k]=e[k];
  var s=document.createElement("script");s.type="application/json";s.id="probe";
  s.textContent=JSON.stringify(p).replace(/</g,"\u003c");document.body.appendChild(s);}
function ltt_openPop(term){var ev=["mouseover","focusin","click"];
  for(var i=0;i<ev.length;i++){term.dispatchEvent(new MouseEvent(ev[i],{bubbles:true}));
    var pop=document.getElementById("ltt-pop");
    if(pop&&pop.textContent.trim())return{via:ev[i],text:pop.textContent.trim()};}
  return{via:null,text:""};}
addEventListener("load",function(){setTimeout(function(){
var el=document.getElementById("r"),ta=el.querySelector("textarea"),btn=el.querySelector("button"),ans=window.__ra.answer;
var out={hasTa:!!ta,hasBtn:!!btn,beforeVisible:ans.checkVisibility(),beforeDisabled:btn.disabled,callsBefore:window.__calls.slice()};
ta.value=" 네 ";ta.dispatchEvent(new Event("input",{bubbles:true}));btn.click();
out.afterVisible=ans.checkVisibility();out.afterDisabled=btn.disabled;
out.terms=ans.querySelectorAll(".ltt-term").length;out.termKeys=Array.prototype.map.call(ans.querySelectorAll(".ltt-term"),function(t){return t.getAttribute("data-term")});
ta.value="다른";btn.click();out.afterVisible2=ans.checkVisibility();
var hb=document.getElementById("rh").querySelector("button");
out.holdCallsBefore=window.__calls.slice();
var hta=document.getElementById("rh").querySelector("textarea");if(hta){hta.value="답";hta.dispatchEvent(new Event("input",{bubbles:true}));}
if(hb)hb.click();
out.holdCallsAfter=window.__calls.slice();out.holdIsAnswer=window.__holdEl===window.__rb.answer;out.revealIsAnswer=window.__revealEl===window.__rb.answer;if(hb){hb.click();}out.holdCallsAfter2=window.__calls.slice();out.hbDisabled=hb?hb.disabled:null;
var x=document.getElementById("rx"),n=x.childNodes.length,msg=null,threw=false;
try{LTT.recall(x,{answer:"x"});}catch(e){threw=true;msg=e.message;}
out.threw=threw;out.msg=msg;out.childrenBefore=n;out.childrenAfter=x.childNodes.length;
ltt_probe(out);},2500);});
</script>
</body>
</html>
