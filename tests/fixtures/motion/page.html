<body>
<script>
  // The scenario name comes from ?s=<name>; each scenario lives in scn/<name>.js so one page shell serves every fixture.
  const s = new URLSearchParams(location.search).get("s");
  if (!/^[a-z0-9-]+$/.test(s || "")) throw new Error("bad scenario " + s);
  document.write('<script src="scn/' + s + '.js"><\/script>');
</script>
</body>
