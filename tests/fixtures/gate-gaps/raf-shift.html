// The neighbour resizes only in the next animation frame, as lessons that batch their redraw do.
var sp = document.getElementById("sp"), inp = document.getElementById("r1");
inp.addEventListener("input", function () { var v = +inp.value; requestAnimationFrame(function () { sp.style.width = (v / 100 * 40) + "px"; }); });
