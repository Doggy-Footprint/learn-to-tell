<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fixture</title>
<style>html,body{margin:0;padding:0}*,*::before,*::after{transition:none!important;animation:none!important}
.flex{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;width:640px}
.rd{font:16px monospace;white-space:nowrap;display:inline-block}</style>
<script type="application/json" id="ltt-meta">{"topic":"t","audience":"a","theme":"paper","medium":"m","decision":"d"}</script>
</head>
<body>
<script src="/kit/vendor/d3.min.js"></script>
<script src="/kit/ltt.js"></script>
<script src="/kit/ltt-parts.js"></script>
<script src="/kit/ltt-ui.js"></script>
<script src="/kit/ltt-deck.js"></script>
<script>
// MOVE_SCENE: "3" makes the dial readout of scene 3 change width with the value; "none" keeps every readout fixed-width.
var MOVE_SCENE = "__MOVE_SCENE__";
LTT.deck({title:"d",theme:"paper",scenes:[
 {title:"장면 하나",narration:"n1",mount:function(body){
  body.innerHTML='<p style="font:24px sans-serif">첫 장면</p>';
  return {};}},
 {title:"장면 둘",narration:"n2",mount:function(body){
  body.innerHTML='<div style="width:640px"><input type="range" id="r2" min="0" max="100" value="0" style="width:200px"></div>';
  return {};}},
 {title:"장면 셋",narration:"n3",mount:function(body){
  var mv = MOVE_SCENE === "3";
  body.innerHTML='<div class="' + (mv ? "flex" : "") + '" style="width:640px"><div id="hue3"></div><span id="hue3-v" class="rd"></span></div>';
  LTT.sweep({params:{hue3:{kind:"dial",step:9,value:0,fmt:function(v){return mv?"W".repeat(1+Math.round(v/9)):"값";}}},render:function(){}});
  return {};}}]});
</script>
</body>
</html>
