name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - id: v
        run: |
          v=$(node scripts/build.mjs version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      # Same version as an existing tag means nothing to release; npm would also refuse to republish it.
      - if: steps.v.outputs.new == 'true'
        run: node scripts/build.mjs kit && node scripts/build.mjs zip
      - if: steps.v.outputs.new == 'true'
        working-directory: packages/ltt-kit
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.v.outputs.new == 'true'
        run: gh release create "v${{ steps.v.outputs.version }}" dist/learn-to-tell.zip --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
